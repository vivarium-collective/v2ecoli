conclusion: 'dnaG is a genuine outlier, and the basal-versus-ppGpp substitution explains its gap.

  The explanation does not generalise, and that limit is the study''s second result.


  ParCa''s fitted dnaG implies 6.85x more transcription than the model delivers, against

  a population median of 0.55 across 3456 monomers -- twelve times the typical

  transcript. The median sitting BELOW 1 matters: the ordinary gene is slightly

  over-transcribed relative to its fit, so dnaG is not an instance of a global offset

  but a specific departure.


  That departure matches the ratio between the two probability vectors. ParCa fits

  against the cache''s basal_prob while TranscriptInitiation transcribes according to

  the ppGpp-adjusted replacement, and for dnaG those differ by 3.99x against an

  observed discrepancy of 6.85x -- agreement within 1.72x, which is the finest

  distinction the mass balance can support given it was validated to 74.5% within a

  factor of two.


  The generalisation fails. Across the transcriptome the correlation between the

  discrepancy and the vector ratio is 0.318 against a 0.5 bar: positive, so the

  substitution contributes, but far from dominant. It is a real mechanism with limited

  reach rather than a transcriptome-wide law, and reporting it as the latter would

  overstate what one gene''s agreement can support.


  A measurement bug was caught and fixed mid-study, and it is recorded because the

  symptom was subtle. The first implementation computed the implied transcription rate

  from the SIMULATION''s observed protein rather than ParCa''s fitted count, which merely

  re-derives the mass balance''s own residual: it returned 1.44 for dnaG, and 1/0.694 =

  1.44 is exactly the predecessor''s balance ratio. Reading a plausible-looking number

  that happens to be a restatement of the input is the failure mode this investigation

  has hit repeatedly; here it was caught because the figure disagreed with the 6.85x it

  was supposed to reproduce.


  For the investigation this closes the chain. The stall, the limiting pool, the

  transcription deficit, the protein shortfall and now the fit-runtime disagreement all

  trace to one structural fact: the model fits against one probability vector and runs

  against another.

  '
