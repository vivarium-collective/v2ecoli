schema_version: 2
name: flagella-cascade
title: "Flagella transcriptional cascade — Maya's Aim 2 (Kalir & Alon SUM-gate) in v2ecoli"
created: '2026-06-20'
status: active

question: |
  Can a mechanistic transcriptional regulatory cascade — rather than manual
  multipliers / stoichiometry tweaks / overrides — give the E. coli whole-cell
  model temporally ordered flagellar gene expression and biologically feasible
  flagella counts? Concretely: does a Kalir & Alon (Cell 2004) bilinear SUM-gate
  driving promoter initiation, coupled to FlgM/sigma-28 sequestration relieved by
  type-III secretion through assembled flagella, reproduce the Class II -> Class III
  ordering (FlhDC/FliA genes first, then fliC/motAB/cheAW after hook-basal-body
  completion)?

hypothesis: |
  Maya Abdalla's prelim (Specific Aim 2): the WCM currently OVERPRODUCES flagella
  (~48 vs a biological handful) because the regulatory machinery is synthesized but
  never used to gate flagellar production. Embedding the Kalir & Alon SUM-gate as a
  FlagellaTranscriptionRegulation process — Class II weighted toward FlhD4C2, Class
  III toward free FliA — with FlgM holding FliA below threshold until basal-body
  completion (FlgMSecretion then releases it) will produce temporally ordered
  expression and feasible counts WITHOUT manual overrides. With the feature off the
  model is byte-neutral (init_prob_override stays 0; transcript_initiation unchanged).

lead: |
  Ports Maya Abdalla's flagella transcription-regulation work (Specific Aim 2 of her
  prelim proposal, "Abdalla Prelim Exam Proposal 051326") from the vEcoli `biofilm`
  branch (https://github.com/vivarium-collective/vEcoli/tree/biofilm) onto v2ecoli's
  process-bigraph stack. The cascade is an opt-in `flagella_regulation` feature.
  This is a living integration branch (draft PR #276), NOT a merge target. It now
  covers Aim 2A (the transcriptional regulatory network — studies 01-03) AND brings
  in Aim 2B (NFsim rule-based assembly — study 04, from vivarium-collective/pbg-nfsim).
  Aim 1 (spatial / Voronoi compartments) remains out of scope here.

executive:
  what_is_this: |
    Two new process-bigraph Steps plus the ParCa data + wiring that drive them:

    1. ecoli-flagella-transcription-regulation — the Kalir & Alon bilinear SUM-gate.
       Promoter activity = weighted sum of FlhD4C2 (CPLX0-3930) and free FliA/sigma28
       (EG11355-MONOMER); Class II weighted to FlhDC, Class III to FliA. Writes a
       per-promoter init_prob_override for 7 Class II + 9 Class III TUs (incl. flgM,
       closing the negative-feedback loop). transcript_initiation substitutes the
       override where > 0.

    2. ecoli-flagella-flgm-secretion — depletes cytoplasmic FlgM (G369-MONOMER[c])
       proportional to complete flagella (CPLX0-7452[j]); the Class II -> Class III
       timing gate that releases sequestered FliA after basal-body completion.

    Supporting data: FLGM-FLIA-CPLX sequestration equilibrium, an init_prob_override
    field on the promoter unique molecule, and a metabolism guard so a
    protein-protein equilibrium coexists with ParCa biomass fitting.

  verdict: |
    Infrastructure landed and the cascade is functional across TWO cell generations
    (real divisions at the ~700 fg threshold). Feature-off is seam-neutral; with the
    cascade on, the SUM-gate holds Class II > Class III and FlgM secretion releases
    bounded free FliA.

    COUNT VERDICT (settled) — the cascade does NOT reduce flagellar overexpression;
    under proper calibration it INCREASES it. The fast-mode cache suggested a
    reduction (OFF g1=53,g2=44 vs ON g1=44,g2=34), but a 4-seed x 3-gen ensemble on
    the FULL-mode (calibrated) cache robustly reverses that: ON means 62.5/54.8/59.0
    vs OFF means 49.5/44.2/40.8 (ON > OFF in 11 of 12 seed-generations). So the
    reduction was a fast-mode artifact; Maya's overexpression-reduction hypothesis is
    REFUTED for the cascade as currently implemented (the SUM-gate override,
    p_i/p_i_ref * basal_prob, over-drives the flagella TUs once basal_prob is
    properly calibrated). The mechanistic results (seam neutrality, Class II>III
    ordering, FlgM->FliA release, ordered NFsim assembly) are unaffected — only the
    count claim flips.
  verdict_status: in-progress

biological_story: |
  E. coli builds its flagella "just in time" through a three-class transcriptional
  hierarchy. The master regulator FlhD4C2 (Class I) activates Class II genes (the
  hook-basal-body apparatus + fliA, the flagellar sigma factor sigma-28). FliA is
  held inactive by the anti-sigma factor FlgM. Only once a hook-basal body is
  complete does its type-III secretion system export FlgM, freeing FliA to fire the
  Class III genes (filament flagellin fliC, the motor motAB, chemotaxis cheAW). This
  delay is the molecular clock that orders assembly. Kalir & Alon (Cell 2004)
  quantified the FlhDC/FliA promoter weights as a bilinear SUM-gate; this
  investigation embeds that gate in the whole-cell model so flagellar expression is
  governed mechanistically rather than by hand-tuned overrides.

glossary:
  # Plain-language definitions for reviewers (from Maya's 2026-07-24 review).
  - term: "features=[]  /  features=['flagella_regulation']"
    meaning: |
      The composite's opt-in feature list. Empty [] = regulation OFF (stock WCM).
      ['flagella_regulation'] = the Kalir & Alon SUM-gate is wired ON. The name
      flagella_regulation was taken directly from Maya's vEcoli config script.
  - term: "regulation ON vs OFF"
    meaning: |
      ON = the two flagella Steps (SUM-gate + FlgM secretion) are active and writing
      promoter init_prob_override. OFF = they are not wired at all. Several baseline
      figures show BOTH (OFF as the reference, ON for comparison) — that is why a
      "baseline" study can contain an ON trace.
  - term: "byte-neutral (seam-neutral)"
    meaning: |
      With the feature OFF the model output is bit-for-bit identical to pre-port
      main — the port adds nothing observable until switched on. This is what lets
      every downstream difference be attributed to the cascade, not the port.
  - term: "baseline vs variant"
    meaning: |
      A study's baseline is its reference composite/config (here, with or without
      flagella_regulation). A variant is a perturbation OFF that baseline (e.g. a
      changed rate or initial pool). "No variants run" means only the baseline has
      been simulated — not that nothing ran.
  - term: "low-IC (low initial condition)"
    meaning: |
      A run seeded from Maya's flagellum_initial_value.json (4 flagella, 500 free
      FliA, 800 FlgM) instead of the default already-flagellated cache — used to
      expose the assembly-gated Class II -> III onset the default start hides.
  - term: "Class I / II / III"
    meaning: |
      The flagellar transcription hierarchy. Class I = master regulator FlhD4C2.
      Class II = hook-basal-body genes + fliA (sigma-28). Class III = filament
      (fliC), motor (motAB), chemotaxis (cheAW) — fired only after FlgM export
      frees FliA.
  - term: "stale"
    meaning: "Outdated — generated from an earlier cache/run and superseded."

testing_standard:
  # Maya's review ask: "study 1 had 4 tests, study 2 has 2 — make a 'standards'
  # testing criteria." Every study's behavior_tests + success_criteria are now
  # organized into these shared categories so acceptance is comparable across
  # studies. Tests remain hand-authored (a mix of standard categories + claims
  # unique to each study); this taxonomy is the standard, not an auto-generator.
  categories:
    - id: model-runs
      description: The composite runs to completion (through division) without error.
    - id: model-mechanism
      description: The mechanism does what it is wired to do (e.g. the gate writes
        overrides; secretion depletes FlgM) — a MODEL-level success.
    - id: biology-correct
      description: The behaviour matches the known biology (temporal ordering,
        bounded FliA, ordered assembly) — a BIOLOGY-level success, Maya's
        distinction between "the model captured the dynamics" and "the result is
        biologically what we would call successful."
    - id: robustness
      description: The result holds across seeds / generations / initial conditions.
  two_tier_acceptance: |
    Each study now carries success_criteria split into `model:` and `biology:`
    (Maya's idea). Model success = the simulation behaves and the mechanism fires.
    Biology success = the outcome is what a biologist would accept (ordering across
    generations, counts toward biological levels, response to perturbation) — often
    a stated FUTURE target, which keeps model-plumbing wins honest about not yet
    being biological validation.

open_decisions:
  - id: nfsim-own-investigation
    raised_by: MA
    date: '2026-07-24'
    question: "Should NFsim (study 04) be its own investigation?"
    recommendation: |
      Keep under flagella-cascade as Aim 2B while it is a standalone example; split
      into a dedicated flagella-nfsim-assembly investigation once it is coupled into
      the WCM (then it becomes a distinct rule-based-vs-Gillespie methods thread with
      its own acceptance criteria). Maintainers' call.
  - id: report-study-differentiation
    raised_by: MA
    date: '2026-07-24'
    question: "Make the studies more visually distinct (bigger fonts / clearer
      per-study differentiation) in the investigation report."
    recommendation: |
      Report-template (vivarium-workbench) change, not a study-yaml change — logged
      for the dashboard maintainers. Interim mitigation applied here: each study's
      title + description now leads with its Aim (2A/2B) and a one-line scope so the
      studies read as distinct sections.

review_log:
  - reviewer: Maya Abdalla (MA)
    date: '2026-07-24'
    source: inline-feedback widget (27 annotations, imported to feedback/)
    response: |
      All 27 annotations addressed — see feedback/RESPONSES.md for the
      point-by-point mapping of each comment to the action taken.

studies:
  - flagella-01-overexpression-baseline
  - flagella-02-sumgate-cascade
  - flagella-03-flgm-flia-feedback
  - flagella-04-nfsim-assembly

acceptance_criteria:
  - id: AC1
    behavior: feature-off-seam-neutral
    study: flagella-01-overexpression-baseline
    detail: |
      With flagella_regulation OFF, promoters.init_prob_override stays 0 on every
      promoter across a run and transcript_initiation is unchanged — so the port is
      a true no-op until the feature is enabled (and the uncontrolled ~48-flagella
      overexpression baseline is reproduced for comparison).
  - id: AC2
    behavior: cascade-classII-before-classIII
    study: flagella-02-sumgate-cascade
    detail: |
      With the feature on, Class II init_prob_override rises before Class III, and
      Class III stays near 0 until complete flagella accumulate and FlgM is secreted
      — the experimentally observed temporal order (Kalir et al. 2001).
  - id: AC3
    behavior: fliA-not-overproduced
    study: flagella-03-flgm-flia-feedback
    detail: |
      Free FliA (EG11355-MONOMER[c]) stays within a biologically plausible band
      rather than running away — the FlgM secretion gate plus the flgM
      negative-feedback loop (flgM is itself a Class III gene) hold it in check.
  - id: AC4
    behavior: ordered-hierarchical-assembly
    study: flagella-04-nfsim-assembly
    detail: |
      NFsim rule-based assembly (pbg-nfsim) builds flagella through ordered,
      conditional steps (export apparatus -> motor/basal body -> hook -> complete
      flagellum) that the stochastic Gillespie complexation cannot enforce — Maya's
      Aim 2B.

scientific_argument:
  main_claim: |
    Mechanistic transcriptional regulation — the Kalir & Alon SUM-gate coupled to
    FlgM/sigma-28 sequestration relieved by type-III secretion — gives the v2ecoli
    whole-cell model temporally ordered flagellar expression WITHOUT the manual
    multipliers/overrides the current WCM relies on. It does NOT lower flagella
    counts — under calibration it raises them (4-seed x 3-gen calibrated ensemble,
    ON > OFF in 11/12 seed-generations); the fast-mode reduction was an artifact.
    NFsim rule-based assembly
    additionally supplies the ordered, conditional construction that stochastic
    Gillespie complexation cannot.
  evidence_for:
    - The SUM-gate writes per-promoter init_prob_override with Class II > Class III,
      and the ordering is maintained across a cell division (study 02).
    - FlgM is secreted (1481 -> 5) and free FliA is released but stays bounded
      (~1.35x initial) via the flgM negative-feedback loop (study 03).
    - (Mechanistic, cache-independent) the cascade is wired and functional; the
      count direction is covered under evidence_against, not here.
    - NFsim assembles complete flagella through ordered intermediates
      (export -> motor -> hook -> flagellum); 9 complete flagella in 2400 s (study 04).
    - Under a low-flagella initial condition (study 03), the Class III override starts
      at exactly 0 and rises only as FlgM is secreted (1481 -> 115) — the
      assembly-gated Class II -> Class III onset, made explicit.
  evidence_against:
    - CALIBRATION REVERSAL (multi-seed confirmed) — on the full-mode calibrated
      cache the regulated lineage has MORE flagella, not fewer, robustly across a
      4-seed x 3-gen ensemble (ON means 62.5/54.8/59.0 vs OFF means 49.5/44.2/40.8;
      ON > OFF in 11 of 12 seed-generations). The fast-mode reduction was an
      artifact; the cascade as implemented over-drives flagella expression.
    - The reduction within one generation is modest; the full overexpression ->
      biological-count correction is not demonstrated.
    - All lineages are single-seed, daughter-1-carry-forward; robustness across
      seeds/daughters is untested.
    - The assembly-gated Class III onset is shown only under a hand-set low-flagella
      initial condition (study 03); from the default already-flagellated cache the
      cascade shows the magnitude ordering but not the onset delay.
  key_figures:
    - flagella-01-overexpression-baseline/charts/02_multigen_flagella_and_mass.svg
    - flagella-02-sumgate-cascade/charts/01_sumgate_classII_classIII.svg
    - flagella-03-flgm-flia-feedback/charts/01_flgm_secretion_flia_release.svg
    - flagella-04-nfsim-assembly/charts/01_nfsim_assembly.svg
  caveats:
    - The transcriptional cascade (Aim 2A) and the NFsim assembly (Aim 2B) run as
      separate opt-in pieces; NFsim is standalone, not yet wired to replace
      ecoli-complexation inside the WCM.
    - Spatial organization (Aim 1) is out of scope.
    - Quantitative count results use a local full-mode ParCa rebuild (out/cache_full);
      the committed ParCa fixture stays fast-mode.
