confidence: Accepted
findings:
- id: basal-rpobc-fix
  kind: computational
  status: confirms
  statement: 'CONTROL — v2ecoli reproduces vEcoli on basal (the ParCa fit point) both before and after the rpoBC fix (overall within_tol). Confirms the fix preserves the already-correct basal condition. Root cause: the ParCa ppGpp-expression NNLS set exp_free[rpoBC operon]=0 (a non-negativity boundary solution), inverting the RNAP-core (rpoB/rpoC) nutrient response and compressing assembled APORNAP-CPLX -> active_RNAP -> rRNA/growth. The fix restores a fold-change-consistent, basal-preserving rpoBC split.'
  evidence:
    from_card: statistical
    observed: 'after fix (4-seed gen-1): all observables within_tol (cell/dry +1.x%, protein/RNA <1.5%, growth ~+5% at seed-noise level). Unchanged from before the fix.'
