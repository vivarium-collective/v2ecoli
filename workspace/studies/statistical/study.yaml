schema_version: 4
name: statistical
investigation: whole-cell-model-comparison
title: "Statistical equivalence — v2ecoli baseline vs vEcoli (basal, 4 seeds)"
condition: basal
question: Is v2ecoli statistically equivalent to vEcoli on basal across 4 seeds?
baseline:
  - name: ecoli_baseline
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    description: v2-native candidate arm (fork-free) — the model under test.
  - name: vecoli
    composite: v2ecoli.composites.vecoli.vecoli
    params:
      condition: basal
      cache_dir: out/compare_harness/vecoli_parca
    description: vEcoli (v1) reference arm — the live vEcoli simulation this study grades v2ecoli against, run on the same condition. Running it requires the vEcoli reference env (V2E_VECOLI_DIR + fork sim_data cache); declared here so the comparison's reference model is visible in the Model tab.
comparison:
  seeds: 4
  generations: 4
  cards:
    - config
    - statistical
report_cards:
  - viz/report_card/config.html
  - viz/report_card/statistical.html
tests:
  - name: config-vs-vecoli
    kind: report_card
    card: config
    classification: primary
    question: Does v2ecoli reproduce vEcoli on statistical (config card)?
  - name: statistical-vs-vecoli
    kind: report_card
    card: statistical
    classification: primary
    question: Does v2ecoli reproduce vEcoli on statistical (statistical card)?
    measure:
      kind: report_card_axis
      card: docs/report_cards/whole-cell-model-comparison/statistical
      group: statistical
runs:
  - composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    name: statistical-comparison
    kind: analysis
    canonical: true
    description: v2e-compare study statistical
    status: completed
    result: PASS
    outcomes:
      statistical-vs-vecoli:
        result: PASS
        detail: 'report card ''statistical'': within_tol'
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    # condition:basal was legacy; ecoli_baseline defaults to media:minimal
    params: {}
  model_settings: []
status: evaluated
confidence: Accepted
findings:
  - id: statistical-statistical
    kind: computational
    status: confirms
    statement: 'v2ecoli is statistically equivalent to vEcoli on basal across 4 seeds: all 5 observables within tolerance.'
    evidence:
      from_card: statistical
      observed: 5 within tolerance (Cell mass, Growth rate, Dry mass, Protein mass, RNA mass)
inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir
  - artifact: basal
    from: basal
