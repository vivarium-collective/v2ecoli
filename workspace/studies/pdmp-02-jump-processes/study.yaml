schema_version: 4
name: pdmp-02-jump-processes
investigation: v2ecoli-pdmp
title: "Phase 2 — Jump Process Layer: Discrete-Time → Continuous-Time Stochastic"
claim: "The `pdmp-trajectory-distribution-match` gate FAILED on cell_mass: the Poisson tau-leap Wasserstein-2\ngrows monotonically 9.73 → 15.35 → 49.46. This is a legitimate negative result — cell_mass is the\nwrong observable because the consumption_matched homeostat washes per-tick variance out, so Phase-3\ninference must anchor on count-level listeners, not mass.\n"
confidence: Investigating
status: running
phase: Decide
topic: pdmp
tags:
  - pdmp
  - phase-2
  - jump-processes
  - transcription
  - translation
  - division
  - first-passage
  - gillespie
  - xarray-emitter
created: '2026-05-24'
question: 'Can v2ecoli''s discrete-time stochastic layer (Poisson gene-expression draws scaled by

  timestep/doubling time, the teleonomic division trigger, and the globally-acting resource

  reallocation correction) be replaced by a coherent continuous-time jump process that, coupled with

  the Phase 1 metabolism ODE, satisfies the Markov property of a piecewise-deterministic Markov process?

  '
hypothesis: '(a) Replacing scaled-Poisson gene-expression draws with continuous-time jump processes governed by

  explicit propensity functions from measured kinetic constants (initiation, elongation, degradation

  rates) reproduces the v2ecoli baseline trajectory distribution within tolerance. (b) Replacing the

  teleonomic doubling-time division trigger with a first-passage threshold crossing in cell volume or

  total protein mass reproduces the observed division-time distribution. (c) Replacing the global

  resource reallocation step with affinity-based competition jumps conserves mass and yields a PDMP:

  deterministic ODE flow between jumps with state-dependent kernels at jumps.

  '
objective: 'Implement transcription_jump, translation_jump, and division_threshold as Process Bigraph processes,

  replace the global resource correction with jump-based competition reactions, and couple all jump

  processes with the Phase 1 metabolism ODE under an integrated PDMP runner. Verify the Markov property

  (deterministic between jumps, specified kernels at jumps) and compare trajectory distributions vs. the

  v2ecoli baseline across the Phase 0 conditions.

  '
description: "Phase 2 of the v2ecoli → PDMP roadmap. The discrete-time layer is the most numerically suspect part of\nv2ecoli: stochastic-draw parametrization depends on the ratio of the fixed timestep to the teleonomic\n\"doubling time\" (DUF Sec. 4.1.1), and the global reallocation step exists to paper over\nmass-conservation violations from composing independent processes (DUF Sec. 2.1). A PDMP formulation\nhas neither: events occur at random times from explicit propensity functions, division is a\nfirst-passage time of a continuous observable, and resource competition is state-dependent jump\nkernels. The contract to verify is that between any two jumps the state evolves deterministically under\nthe coupled ODE, with jumps at times set by ∫ λ(s) ds = E for E ~ Exp(1).\n\n# Numerical considerations\nStochastic integration. Gillespie SSA is exact but slow at single-cell mRNA/protein propensity scales\n(10²–10⁴ events / s). The per-process choice (exact SSA vs. τ-leaping vs. hybrid) trades variance\nagainst compute: ribosome-elongation uses τ-leaping with τ set so the leap condition (Δλ/λ < 0.03)\nholds; rare promoter firing uses exact next-reaction.\n\nExponential-clock validation. The core correctness test is that the cumulative hazard ∫ λ(s) ds at\nsuccessive events is Exp(1)-distributed — an Anderson-Darling test over ≥10⁴ inter-event intervals per\njump process (α = 0.05). A failed test indicates a propensity bug.\n\nFirst-passage validation. Division is a first-passage time for volume crossing a threshold. Before the\nfull WCM we validate the integrator on an Ornstein-Uhlenbeck process with exact Bessel-function FPT:\nthe empirical FPT must match the analytical CDF to KS distance < 0.02 over N=10⁴ trajectories.\n\nDistribution-match resolution. Trajectory ensembles vs. baseline are compared with W₂ on summary\nstatistics (growth rate, mean per-gene mRNA/protein, division-time CV). N=200 PDMP trajectories per\ncondition gives W₂ MCSE ≈ σ_W₂/√200 ≈ 0.07 σ_W₂ — enough to detect deviations of ≥0.2 σ; sample size\nis revisited if MCSE > 10% of the inter-baseline effect size.\n\nPDMP integrator validity. The Markov property is tested by re-simulating segments with the same\n(state, RNG seed) and confirming bit-identical determinism between jumps.\n\n# Emitter\nXArrayEmitter records each jump event as a row in a separate zarr group ('jumps') alongside the\ncontinuous trajectory group ('continuous'). max_generations=8 in workspace.yaml accommodates the\nmulti-generation division-time CV / mother-daughter inheritance distributions compared to baseline.\n"
expected_behavior:
  - name: jump-process-from-kinetics
    en: "Every jump process (transcription, translation, division, competition) has a propensity function derived from measured or curated kinetic constants — no scaling by simulation timestep, no teleonomic \"rates\" derived from doubling-time targets."
    given:
      condition: all-jump-processes
    measure:
      kind: observable-comparison
      observable: propensity-function-source
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: division-first-passage
    en: Division events occur as first-passage crossings of a threshold in cell volume or total protein mass; the teleonomic doubling-time check is removed from the model.
    given:
      condition: per-generation
    measure:
      kind: observable-comparison
      observable: division-event-record
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: pdmp-trajectory-distribution-match
    en: "Summary statistics over PDMP trajectory ensembles (growth rate distribution, mean mRNA/protein abundances per gene, division-time CV) match the v2ecoli baseline distributions within specified tolerance across all ≥3 Phase 0 conditions. (Gating criterion.)"
    given:
      condition: M9-glucose AND M9-acetate AND M9-glucose-aa
    measure:
      kind: observable-comparison
      observable: trajectory-summary-distribution
    expect:
      op: within-tolerance
      note: "Gate FAILED on cell_mass: the Poisson cell_mass Wasserstein-2 grows monotonically 9.73 → 15.35 → 49.46 (does not converge within tolerance). Per the closeout this is the wrong observable (the consumption_matched homeostat washes per-tick variance out of cell_mass), so the negative result is reframed as structural, but the gate itself is FAILED, not passed/accepted."
    status: stub
  - name: markov-property-verified
    en: "Between any two jump events, state evolves deterministically under the ODE; jump times follow ∫ λ(s) ds = E for E ~ Exp(1). Verified by re-simulating segments with the same RNG seed and checking bit-identical determinism."
    given:
      condition: per-segment
    measure:
      kind: observable-comparison
      observable: between-jump-evolution
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: uq-exponential-clock-anderson-darling
    en: "Cumulative hazard ∫λ(s)ds at successive events for each jump process passes an Anderson-Darling Exp(1) test (α=0.05) over ≥10⁴ inter-event intervals. The core correctness test for a stochastic-jump implementation."
    given:
      condition: per-jump-process
    measure:
      kind: observable-comparison
      observable: cumulative-hazard-distribution
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: uq-fpt-analytical-validation
    en: "The first-passage implementation, applied to an OU process with analytically known FPT distribution, recovers the analytical CDF to KS distance < 0.02 over N=10⁴ trajectories before being deployed on the WCM division mechanism."
    given:
      condition: analytical-test-problem
    measure:
      kind: observable-comparison
      observable: ornstein-uhlenbeck-fpt-distribution
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: uq-tau-leap-validity
    en: "For every τ-leaping jump process, the leap-condition (max Δλ/λ < 0.03) is monitored; fraction of timesteps where it is violated must be <0.1% across the run. Above threshold, τ is shrunk or the process is switched to exact SSA."
    given:
      condition: tau-leaping-processes
    measure:
      kind: observable-comparison
      observable: leap-condition-fraction-violated
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
  - name: uq-trajectory-w2-mcse
    en: "Trajectory-distribution comparison vs v2ecoli baseline uses W₂ on summary distributions over N≥200 PDMP trajectories per condition; the W₂ MCSE is reported and required <10% of the cross-condition effect size before any tolerance decision is made."
    given:
      condition: N200-per-condition
    measure:
      kind: observable-comparison
      observable: w2-with-MCSE
    expect:
      op: within-tolerance
      note: Acceptance band set as this test is built out (design-stage readout).
    status: stub
