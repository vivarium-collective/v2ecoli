conclusion_logic:
  if_primary_tests_pass: Autoregulation holds DnaA in-band with cell cycle preserved, so the V-tension is closed by feedback; proceed to multi-seed robustness and the ~1/min rate stretch.
  if_primary_tests_fail: Tune the feedback strength (Hill s / K) at stable V to center the band; k_h for the ATP-fraction. The homeostasis means V is not the lever.

# ─── v4 narrative spine (authored from existing study content; reviewer-facing report sections) ───
study_card:
  goal: |
    Make dnaA transcription feedback-controlled (DnaA represses its own promoter) so
    the DnaA pool self-stabilizes in the literature [300,800] band across generations
    via feedback, instead of being pinned there by the manual V override used in
    dnaa-1/dnaa-2.
  mechanism: |
    A negative DnaA-ATP → dnaA-promoter (TU00259[c]) recruitment edge scales the dnaA
    synthesis probability down as DnaA occupies its own promoter (Hill form,
    s=0.7, K=0.5, n=4), driven by the adopted dnaA-promoter box occupancy from dnaa-3.
  expected_result: |
    The DnaA pool holds within [300,800] across generations with the cell cycle
    preserved (oriC 1↔2, one initiation per generation), dissolving the dnaa-1/dnaa-2
    V tension and the per-generation drift.
  main_expert_question: |
    Does DnaA negative autoregulation self-stabilize the pool in-band without the V
    override, and does it close the V tension (Rashmi's autoregulation-gap handoff)?
  why_before_next: |
    The autoregulation edge and the homeostasis result it exposes (V is cancelled by
    feedback) are prerequisites for any downstream study that assumes a
    self-regulating DnaA pool (e.g. dnaa-5 cooperativity).

biological_summary: |
  In E. coli, the replication initiator DnaA negatively autoregulates its own gene.
  DnaA binds DnaA-box sites in its own promoter region (dnaAp); when those sites are
  occupied, transcription of dnaA is repressed. Because DnaA also drives replication
  initiation at oriC, this creates a negative feedback loop: as the DnaA protein pool
  rises, the dnaA promoter fills, dnaA transcription is throttled back, and the pool is
  pulled back down — a homeostatic setpoint for the initiator.

  This study wires that biology into the model. Previously the model had no feedback
  path: the dnaA promoter carried no DnaA-ATP recruitment edge, and the dnaA level was
  instead set by a hand-tuned constitutive expression rate (the "V override") in
  dnaa-1/dnaa-2. That made the level fragile: too low and replication never initiates,
  too high and it over-initiates, and there was no single V that held the pool steady
  across generations.

  With autorepression wired in, dnaA transcription becomes a function of how full its
  own promoter is. The key emergent consequence, observed in the V-sweep, is
  homeostasis: the DnaA setpoint becomes largely insensitive to the constitutive
  expression rate V. Raising V makes the no-feedback control over-shoot ever harder,
  but the autoregulated cell simply represses more and holds DnaA near the same
  setpoint. The setpoint is therefore tuned by feedback strength (the Hill s / K), not
  by V. At s=0.7 the pool sits in/near the literature [300,800] band across full
  generations while the cell cycle (oriC 1↔2, one initiation per cycle, periodic
  mass-doubling) is preserved.

model_change:
  base_model: v2ecoli.composites.baseline.baseline   # inherits dnaa-3's adopted active box-binding (PR #162)
  new_processes: []   # no new process; the edge lives in the existing transcription-regulation recruitment
  new_state_variables:
    - listeners.replication_data.promoter_high_bound # dnaA-promoter occupancy = the repression signal (from dnaa-3's box-binding listener)
  new_parameters:
    - DNAA_AUTOREG_STRENGTH # Hill s (0.7 canonical)
    - DNAA_AUTOREG_FORM     # hill
    - DNAA_AUTOREG_HILL_K   # 0.5
    - DNAA_AUTOREG_HILL_N   # 4
  modified_processes:
    - transcript_initiation (dnaA synth_prob now scaled by a Hill function of dnaA-promoter occupancy; requires probability renormalization across the multinomial so the freed mass is not piled onto an arbitrary promoter)
  notes: |
    Negative DnaA-ATP → dnaA-promoter (TU00259[c]) recruitment edge: dnaA synth_prob
    = base_V × (1 − s·fⁿ/(Kⁿ+fⁿ)), f = dnaA-promoter occupancy fraction. The runs still
    apply a fixed base V=1.5e-3 (--perturbation "TU00259[c]=1.5e-3") which the feedback
    scales down, so the realized scheme is "base V × Hill feedback", not the pure
    no-V-override the design originally aspired to (see design_pivot_required).

implementation_requirements:
  - id: REQ-1
    title: DnaA-ATP → dnaA-promoter autorepression edge
    kind: model
    status: done
    description: Wire the negative recruitment edge so the dnaA synth prob is modulated down by dnaA-promoter occupancy; force the edge to survive the ParCa L1 promoter fit.
  - id: REQ-2
    title: Repression signal source
    kind: model
    status: done
    description: Drive the bound-fraction from the adopted dnaA-promoter box occupancy (promoter_high_bound, option b) rather than the standard TF p_promoter_bound — confirmed to carry a usable signal (occupancy mean 1.41/2, range 0.5-2.0).
  - id: REQ-3
    title: Multinomial probability renormalization
    kind: model
    status: done
    description: Renormalize the synth-prob distribution after scaling the dnaA TU, so the freed probability mass is not piled onto an arbitrary promoter (a review caught this).
  - id: REQ-4
    title: Hill-form calibration of the feedback strength
    kind: analysis
    status: done
    description: Calibrate s / K / n so the feedback equilibrium lands DnaA in-band at a stable V; s=0.7, K=0.5, n=4 selected over linear (over-represses trough) and s=0.6/0.8.
  - id: REQ-5
    title: Baseline allocator over-draft robustness (#209)
    kind: infra
    status: done
    description: PROTON NegativeCountsError on seed1 (allocator over-draft after an FBA infeasibility tick) fixed by resolve_overdraft clamp+warn in v2ecoli #209; behavior-neutral, cherry-picked here.
  - id: REQ-6
    title: Resume-from-dill stability probe
    kind: tooling
    status: blocked
    description: The --resume-dill path produces a daughter that never re-initiates replication (dill-roundtrip bug, docs/resume_dill_replication_init_bug.md); the continuous 16-gen runs supply the multi-generation stability evidence instead.

enforced_params:   # Canonical = Rashmi's reference (commit eb4ea39, Haochen-informed): linear s=0.6 + F-05. See F-07.
  dnaA_expression_V: 1.5e-3            # TU00259[c] synth-prob base override; feedback scales it down
  DNAA_HYDROLYSIS_RATE_PER_MIN: 0.025  # DnaA-ATP intrinsic hydrolysis k_h (lowered from 0.046 default)
  DNAA_AUTOREG_FORM: linear            # Canonical (F-07): linear (1-s*f) + F-05 reproduces a clean band pass and clean cell cycle; supersedes the Hill exploration
  DNAA_AUTOREG_STRENGTH: 0.6           # linear s
  F05_kinetic_apo_ATP: true            # cache patch integrate_dt_mask[24]=True (kinetic apo+ATP charging) — part of the working reference (F-07)
  # (Hill knobs below retained for the superseded Hill path only — ignored when FORM=linear)
  DNAA_AUTOREG_HILL_K: 0.5
  DNAA_AUTOREG_HILL_N: 4
  KD_HIGH_M_nM: 3                      # high-affinity boxes (chromosomal_high/oriC_high/dnaA-promoter_high), DnaA-ATP and DnaA-ADP
  KD_LOW_M_nM: 100                     # low-affinity oriC boxes, DnaA-ATP only

design_pivot_required:
  - id: STUDY-AE-01
    status: accepted
    question: |
      Should band-centering be driven by raising the constitutive expression rate V, as
      proposed in the dnaa-1/dnaa-2 handoff?
    decision: |
      No. The V-sweep showed the autoregulation makes the DnaA setpoint insensitive to V
      (homeostasis): raising V is cancelled by stronger repression, and V=2.0e-3 also
      destabilized metabolism (NegativeCountsError on PROTON ~gen 7). Band-centering
      therefore proceeds via the feedback strength (Hill s / K) at a stable V=1.5e-3, a
      pivot away from V as the lever. This is the central finding of the study, stronger
      than landing any single V in band.
    alternatives:
      - 'Raise V (rejected: cancelled by homeostasis and destabilizes metabolism)'
      - 'Tune feedback strength s/K at stable V (accepted: s=0.7 lands 2/3 seeds in-band)'
  - id: STUDY-AE-02
    status: open
    question: |
      Given the band test is partial (strict per-gen fail on the truncated final gen g17
      and seed0 noise; 2/3 seeds clean for full gens g3-16), is a box-binding redo on the
      autoreg expression warranted, or is the existing box-binding-under-autoreg
      sufficient (dnaa-4 already runs box-binding under the s=0.7 expression)?
    requested_response: Rashmi's call.

literature_anchors:
  - expectation: DnaA protein abundance is ~300-800 molecules per cell.
    model_observable: total DnaA pool (bulk PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c] + bound forms), gen_steady_state
    source: dnaa-abundance-jb-1991; liu-nature-microbiology-s41564-020-0717-x
    status_in_workspace: 'Partial: 2/3 seeds hold in [300,800] across full gens g3-16; strict per-gen eval partial.'
  - expectation: One replication initiation per cell cycle (oriC count cycles 1↔2), periodic mass-doubling.
    model_observable: listeners.replication_data.number_of_oric; listeners.mass.cell_mass
    source: initiator-titration-nat-comm-s41467-022-33886-6; macklin2020
    status_in_workspace: 'Verified: oriC mean 1.55-1.70 in [1,2], 0 re-inits, clean 16/16 divisions across all 3 seeds.'
  - expectation: DnaA negatively autoregulates its own promoter (repression as the promoter saturates).
    model_observable: dnaA-promoter occupancy (promoter_high_bound) vs the dnaA synth prob it scales
    source: dnaa-review-frontiers-2018-fmicb-00319
    status_in_workspace: 'Verified: the loop is wired and the promoter-swing chart shows synth riding inversely to occupancy.'

conclusion_verdicts:
  biological_validation:
    basis: |
      Mechanism validated as homeostasis. The autoregulation edge is wired and the DnaA
      setpoint is robust to V (tuned by feedback strength, not V). Band test partial
      (2/3 seeds in-band across full gens g3-16; strict per-gen fail on the truncated
      g17 and seed0 noise); cell-cycle-preserved pass robustly across all 3 seeds.
  regression_compatibility:
    basis: |
      All 3 canonical seeds completed 16 generations; seed1 required the behavior-neutral
      #209 allocator over-draft fix (clamps and warns, byte-identical parity). No
      autoregulation-caused crashes; 0 re-initiations.
  explanatory_gain:
    basis: |
      The homeostasis result reframes the dnaa-1/dnaa-2 V tension: V is not the lever;
      feedback strength is. This explains why no single constitutive V held the pool
      steady, and supersedes "raise V to lift DnaA into band".

findings:
  - id: F-01
    statement: >-
      Canonical result: linear DnaA autoregulation s=0.6 + F-05 kinetic apo+ATP charging
      (V=1.5e-3, k_h=0.025/min; commit eb4ea39): the autoregulated DnaA homeostasis is robust
      across seeds 0/1/2: the total-DnaA pool sits in [300,800] every steady generation g4-11 with
      a clean cell cycle (12/12 divided, oriC 1<->2, 0 re-inits). The DnaA-ATP-fraction band
      [0.2,0.5] holds on seed 1 only (0.261, matching Rashmi's reference); seeds 0/2 fall below
      0.2, so dnaa-4 is an honest partial on the fraction. This linear s=0.6 + F-05 reference
      supersedes the earlier Hill s=0.7 exploration (only 2/3 seeds in band) and the s=0.65/F-06
      attempt (band-centered but stalled division).
    status: evaluated
    from_feedback: fb-ae3c03d2f5fae8bb
    provenance:
      run_ids: [dnaa4_s06_F05_seed0_12gen, dnaa4_s06_F05_seed1_12gen, dnaa4_s06_F05_seed2_12gen] # the canonical linear s=0.6 + F-05 3-seed runs this headline reports
  - id: F-02
    statement: >-
      Homeostasis (form-independent, the central mechanism result): the autoregulation makes
      the DnaA setpoint insensitive to the constitutive expression rate V (raising V is cancelled
      by stronger repression), so the setpoint is tuned by the feedback strength at a stable
      V=1.5e-3, not by V. This reframes and dissolves the dnaa-1/dnaa-2 V tension. Band-centering
      is delivered by the canonical linear s=0.6 + F-05 reference (see F-01/F-07).
    status: draft
    from_feedback: fb-db23ebc5d0ed0bfb
    provenance:
      run_ids: [dnaa4_s06_F05_seed0_12gen, dnaa4_s06_F05_seed1_12gen, dnaa4_s06_F05_seed2_12gen] # the V-cancellation context is the registered V=1.5e-3 control/linear/Hill runs above; band-centering is the canonical linear s=0.6 + F-05 runs
  - id: F-03
    statement: >-
      Test outcomes on the canonical linear s=0.6 + F-05 reference (seeds 0/1/2): cell-cycle-preserved
      pass robustly on all 3 seeds (oriC 1<->2, 0 re-inits, 12/12 divided); total-DnaA-pool-in-band pass
      on all 3 seeds (every steady gen g4-11 in [300,800]); the DnaA-ATP-fraction band is the only partial
      axis, in band on seed 1 only (0.261), seeds 0/2 below 0.2. Hence gate_status partial: homeostasis
      robust, the fraction band seed-1-specific.
    status: draft
    from_feedback: fb-6bb05a4528f336e1
    provenance:
      run_ids: [dnaa4_s06_F05_seed0_12gen, dnaa4_s06_F05_seed1_12gen, dnaa4_s06_F05_seed2_12gen] # the evaluated test outcomes this finding summarizes come from the canonical 3-seed reference
  - id: F-04
    statement: >-
      Historical (superseded by linear s=0.6 + F-05; the binding-under-the-reference view now lives in
      dnaa-3, re-run on the current config). Box-binding dynamics under the s=0.7 autoregulated expression (analyzed from the existing
      dnaa4_s07_seed{0,1,2} runs, steady gens >=3): high-affinity boxes stay well-occupied
      (chromosomal_high 0.70/0.89/0.95, oriC_high 0.69/0.88/0.93, dnaA-promoter_high 0.67/0.86/0.90
      across seed0/1/2), while the low-affinity oriC boxes (K_d 100 nM) stay mostly empty
      (0.10/0.15/0.28). The oriC-low over-binding flagged in dnaa-3 (read-only observer ~0.8,
      active-mechanism adopted ~0.46) is further resolved under autoregulation: feedback lowers
      DnaA, depleting the free DnaA-ATP that drove low-affinity over-occupancy, so the low-aff
      sites fill only transiently. Bound pools are predominantly DnaA-ADP (~20-32% ATP at the
      high-aff boxes) from intrinsic hydrolysis. (The box-dynamics chart was retired in the
      chart cleanup, Rashmi 2026-06-16; the binding-under-the-reference view now lives in dnaa-3,
      which is re-run on the current linear-s=0.6+F-05 configuration.) (Rashmi 2026-06-14:
      box-binding dynamics on top of the achieved expression dynamics, answered via the existing
      autoreg runs rather than a fresh study, since dnaa-4 already runs box-binding under autoreg.)
    status: draft
    provenance:
      run_ids: [dnaa4_s07_seed0, dnaa4_s07_seed1, dnaa4_s07_seed2]
  - id: F-05
    statement: >-
      DnaA-ATP-vs-DnaA-ADP noise asymmetry (Haochen 2026-06-14): the DnaA-ADP curve is much
      smoother than DnaA-ATP even though ADP is downstream of ATP (ATP hydrolyses to ADP), so
      ADP should inherit ATP's noise. Mechanism (where the asymmetry comes from): in
      flat_overrides/equilibrium_reaction_rates.tsv, DnaA-ATP formation (MONOMER0-160_RXN,
      apo+ATP<->DnaA-ATP) has integrate_dt=false (fast-equilibrium: re-solved to steady state
      every tick, so it instantly tracks the stochastic free-ATP/apo pools => noisy), while
      DnaA-ADP formation (MONOMER0-4565_RXN) and the hydrolysis (DNAA-INTRINSIC-HYDROLYSIS-RXN)
      are integrate_dt=true (kinetic ODE integration over dt, which averages out the sub-tick
      stochasticity => smooth). Important: this is not a bug. The fast-equilibrium treatment of
      DnaA+ATP<->DnaA-ATP is a deliberate, physically-justified modeling choice (Haochen: cellular
      ATP is abundant, so DnaA-ATP binding equilibrates fast, fast-equilibrium is the appropriate
      approximation) and is the original whole-cell-model treatment. So the smoothness asymmetry is
      an expected consequence of that justified design, not an artifact to "correct".
      Experiment (Haochen/Eran endorsed "try this too"), run and resolved 2026-06-14: set
      MONOMER0-160_RXN integrate_dt false->true (kinetic integration of DnaA-ATP formation) to test
      whether the DnaA-ATP curve becomes smoother. Method: rather than a full-ParCa rebuild (which
      independently fails at the unrelated promoter-binding cvxpy solver, promoter_fitting.py:548,
      not caused by this flag), the integrate_dt_mask was patched directly in a copy of the canonical
      cache (cache_dnaa4_autoreg, which already had ADP+hydrolysis kinetic), flipping only
      MONOMER0-160 to kinetic, then resumed from the seed-1 gen5 dill for gen 6 (s=0.7 Hill, V=1.5e-3,
      k_h=0.025; gen completed cleanly, tau=59 min, divided). Result, negative: kinetic ATP did not
      smooth the DnaA-ATP curve. Tick-jitter/mean of the DnaA-ATP form went 0.0082 (fast-eq) -> 0.0132
      (kinetic, marginally worse), the ATP/ADP asymmetry ratio went 2.11 -> 2.41 (worse), and the ATP
      fraction shifted 0.327 -> 0.293. Conclusion: the asymmetry is not a solver-method artifact for
      ATP; it is a pool-size/topology effect. DnaA-ADP is the larger terminal sink (~278 vs ~132
      molecules) that accumulates downstream, so its relative noise is intrinsically lower (~1/sqrt N
      buffering); DnaA-ATP is the smaller dynamic intermediate (formed by ATP binding, drained by
      hydrolysis and oriC/box turnover) and necessarily carries the turnover fluctuations. Noise does
      propagate ATP->ADP but is averaged out by the large ADP pool. Decision (taken): reverted
      MONOMER0-160_RXN integrate_dt back to false; the justified, abundant-ATP, original-WCM
      fast-equilibrium default stands; the kinetic variant is not adopted (it doesn't help and is
      marginally worse). Comparison figure: out/dnaa4_atp_kinetic_vs_fasteq_gen6.png. (Residual
      box-binding free<->bound stochasticity in dnaa_box_binding.py is a separate, smaller noise
      source; reducing the visible ATP jitter further would mean enlarging/buffering the ATP pool or
      smoothing the box-binding turnover, not changing the equilibrium solver method.)
    status: draft
    provenance:
      run_ids: [dnaa4_atpkinetic_g6b, dnaa4_s07_seed1_16gen_fixed]
  - id: F-06
    statement: >-
      Historical (superseded by linear s=0.6 + F-05): the s=0.65 attempt below band-centered but stalled
      division, which is why the linear s=0.6 + F-05 reference was adopted instead.
      Band-centering via feedback strength (s/seed sweep, 2026-06-15): the dnaa-4
      DnaA-pool-in-band test was partial at s=0.7: seed 0's per-generation mean dipped out of
      [300,800] at g11-13 (246/187/269) while seeds 1,2 held. A focused sweep (other DnaA-ATP
      regulators disabled, pure dnaa-4) resuming seed 0 from its gen-8 dill through the failing window
      g9-14 shows s=0.65 threads the needle: every generation mean lands in band (409-545) and
      the peak stays under 800 (781), converting the previously-failing gens to a clean per-gen
      pass. s=0.60 also lifts the means in-band but the peak breaks 800 (827), too weak. So
      s=0.65 (Hill K=0.5, n=4, V=1.5e-3, k_h=0.025) is the band-centering value: between s=0.7
      (trough dips out) and s=0.6 (peak breaks band). Honest caveats: (1) the test scores the
      generation-average (operator generation_average_in_range): at s=0.65 all gen-means are
      in-band, though the instantaneous trough still grazes ~251 momentarily; (2) this is seed 0
      resumed through its dip window, so a fully robust clean-pass claim needs a 3-seed fresh
      16-gen run at s=0.65 (other DnaA-ATP regulators off). Confirmation result (2026-06-15), s=0.65 not
      adopted: the fresh runs reveal a trade-off the resume-sweep hid. Where s=0.65 completes
      (seed 2, all 16 gens) the band is a clean per-gen pass (g3-16 means 320-611, all in
      [300,800]), band-centering confirmed. But s=0.65 induces a progressive division
      slowdown: per-gen tau drifts upward (seed0 56->90, seed1 ->90, seed2 ->82 min) and 2/3
      seeds stall: a generation exceeds the 90-min division cap (seed0 g6, seed1 g9; dry_mass
      ~283 fg, divided=False -> lineage ends). That is a cell-cycle-integrity regression vs s=0.7
      (robust ~59 min/gen, all seeds divide). FBA is not the cause (the completing seed2 logged
      56 GLP_NOFEAS vs the stalled seeds' 3-4). Decision: revert to s=0.7 as canonical; its band
      partial (seed-0 trough dips below 300 on g11-13) is the better trade-off than s=0.65's
      cell-cycle fragility. The band thus stays partial (not a clean pass); closing it cleanly
      needs a lever that lifts the trough without slowing division (tune Hill K, not s; or fix the
      s=0.65 growth slowdown), a future calibration, not done here. Runs: dnaa4_band_s065/s060
      (sweep); dnaa4_s065_seed{0,1,2}_16gen (confirmation: seed2 16gen clean-band, seed0 6gen and
      seed1 9gen stalled on slow growth).
    status: draft
    provenance:
      run_ids: [dnaa4_band_s065, dnaa4_band_s060, dnaa4_s065_seed0_16gen, dnaa4_s065_seed1_16gen, dnaa4_s065_seed2_16gen]
  - id: F-07
    statement: >-
      Reference config adopted (Rashmi/Haochen handoff, commit eb4ea39, 2026-06-16): the
      canonical dnaa-4 autoregulation is linear (1 - s*f) at s=0.6 with F-05 (kinetic apo+ATP
      charging, integrate_dt_mask[24]=True) at V=1.5e-3, K_d 3/100 nM, k_h=0.025. Rashmi tried
      this combination herself (PDF v1.5e-3_s06_F05_seed1) and asked us to verify. Reproduced
      cleanly (run dnaa4_s06_F05_seed1_12gen, fresh 12-gen seed 1, other DnaA-ATP regulators off, pure dnaa-4): cell
      cycle clean (12/12 divided, oriC 1<->2 every gen, tau ~55-71 min), DnaA total per-gen mean
      in [300,800] for every steady generation g4-11 (326-435), a clean band pass, and DnaA-ATP
      fraction 0.261 (in band [0.2,0.5]). Both pages of her PDF reproduce (trajectory:
      dnaa4_linear_s06_F05_trajectory; per-chromosome region panels gen 7, oriC-low 2-3/8:
      dnaa4_linear_s06_F05_regions). This supersedes the Hill exploration and reconciles the
      earlier findings: (a) F-06: Hill s=0.65 band-centered but slowed division (2/3 seeds
      stalled); linear s=0.6 + F-05 band-centers and divides cleanly, so it is the better lever.
      (b) the earlier "Hill > linear (linear over-represses the trough)" read was without F-05 and
      at s=0.8; with F-05's kinetic charging and s=0.6, linear holds the trough (g4-11 troughs
      203-299, gen-means in band). (c) F-05: judged noise-negative in isolation (with Hill s=0.7)
      but is part of this working combination (Rashmi/Haochen's choice); the TSV stays fast-eq for
      ParCa, F-05 is applied as a cache patch for the reference run. Decision: adopt linear s=0.6 +
      F-05 as canonical (enforced_params updated); the DnaA-pool-in-band test is now a clean pass on
      this reference. Next: confirm across seeds 0/2 (this is seed 1, matching Rashmi's reference).
      [Seeds 0/2 confirmed, see F-08: homeostasis robust 3/3, ATP-fraction band seed-sensitive (1/3).]
    status: evaluated
    provenance:
      run_ids: [dnaa4_s06_F05_seed1_12gen]
  - id: F-08
    statement: >-
      Multi-seed confirmation of the F-07 linear-s=0.6+F-05 reference (seeds 0 and 2, 2026-06-16,
      12 generations each, byte-identical config: cache out/cache_dnaa4_s06_F05, V=1.5e-3,
      DNAA_AUTOREG_FORM=linear, DNAA_AUTOREG_STRENGTH=0.6, k_h=0.025, K_d 3/100 nM, other DnaA-ATP regulators off, pure dnaa-4).
      Result: the homeostasis is robust across all three seeds: every seed divides 12/12 with oriC 1<->2
      and 0 re-inits, and the total-DnaA pool sits in [300,800] on every steady generation g4-11 (seed 0
      per-gen total-mean 315-392; seed 1 326-435; seed 2 382-539). So the autoregulated DnaA homeostasis and
      clean cell cycle, the dnaa-4 headline, replicates cleanly. However the DnaA-ATP-fraction band
      [0.2,0.5] is seed-sensitive and does not replicate: in band only on seed 1 (steady-gen mean 0.261);
      seed 0 is 0.156 and seed 2 is 0.085, both below 0.2. The per-gen detail explains it: seed 0's
      fraction ramps up over the lineage (0.02 g4 -> 0.20 g7 -> 0.25 g12, slow ATP-pool charging, in/near
      band by the late gens), while seed 2 stays low and erratic (0.02-0.12, never settles). This mirrors
      the Hill s=0.7 round (2/3 seeds in band). Conclusion: the mechanism result (homeostasis) is robust;
      the fraction band is seed-1-specific, so dnaa-4 remains partial on the fraction, not promoted to a
      clean pass. Honest negative result from the multi-seed confirmation, exactly what it was run to test.
    status: evaluated
    provenance:
      run_ids: [dnaa4_s06_F05_seed0_12gen, dnaa4_s06_F05_seed1_12gen, dnaa4_s06_F05_seed2_12gen]
