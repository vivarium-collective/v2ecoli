  does not rescue the lineage: growth control collapses and no seed survives past generation 5.'
conclusion: 'The hypothesis is refuted at the outcome and substantially confirmed at the mechanism. ppGpp
  substitution is what starves dnaG -- removing it lifts dnaG from 0.045 to 0.686 of its fitted basal_prob,
  a 16.6x recovery of the deficit against its ribosomal-protein peers. But the free-DnaG pool still never
  clears the gate (-3 worst margin), a 2.85x deficit remains unexplained by ppGpp, and the intervention
  wrecks growth homeostasis (tau 3.0x vs 1.26x in the control), so 0 of 3 lineages complete. Two incidental
  findings matter beyond this study: DnaG is limiting first rather than uniquely, since HolA becomes the
  worst pool once DnaG is relieved; and the comparison group this investigation has used throughout excludes
  dnaG''s own allocation class, so the 5.40x deficit figure needs recomputing.'
