    chart: image
    render: "Real data (2-seed order-2 PCE). Two panels — growth rate and cell mass — bar chart of total-order Sobol per deep param with across-seed whiskers and the 0.5 dominance line. Mass is dominated by the dry-mass fraction (rebuild-reached); growth rate is split between the dry-mass fraction and RNAP elongation rate (post-ParCa-reached)."

pipeline_gate:
  gate_status: passed
inputs:
  - artifact: param-uq-00-screen
    from: param-uq-00-screen
