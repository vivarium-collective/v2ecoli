acceptance_criteria:
- id: AC1
  behavior: feature-off-seam-neutral
  study: flagella-01-overexpression-baseline
  detail: |
    With flagella_regulation OFF, promoters.init_prob_override stays 0 on every
    promoter across a run and transcript_initiation is unchanged — so the port is
    a true no-op until the feature is enabled (and the uncontrolled ~48-flagella
    overexpression baseline is reproduced for comparison).
- id: AC2
  behavior: cascade-classII-before-classIII
  study: flagella-02-transcription-regulation
  detail: |
    With the feature on, Class II init_prob_override rises before Class III, and
    Class III stays near 0 until complete flagella accumulate and FlgM is secreted
    — the experimentally observed temporal order (Kalir et al. 2001).
- id: AC3
  behavior: fliA-not-overproduced
  study: flagella-02-transcription-regulation
  detail: |
    Free FliA (EG11355-MONOMER[c]) stays within a biologically plausible band
    rather than running away — the FlgM secretion gate plus the flgM
    negative-feedback loop (flgM is itself a Class III gene) hold it in check.
- id: AC4
  behavior: ordered-hierarchical-assembly
  study: flagella-04-complexation-nfsim
  detail: |
    NFsim rule-based assembly (pbg-nfsim) builds flagella through ordered,
    conditional steps (export apparatus -> motor/basal body -> hook -> complete
    flagellum) that the stochastic Gillespie complexation cannot enforce — Maya's
    Aim 2B.
- id: AC5
  behavior: voronoi-compartment-fidelity
  study: flagella-03-voronoi-compartments
  detail: |
    The Voronoi plot correctly sections all flagellar proteins by their
    compartment label ([c] cytosol, [i] inner membrane, etc.) and the overlay
    correctly reflects each compartment's total mass.

scientific_argument:
  main_claim: |
    Mechanistic transcriptional regulation — the Kalir & Alon SUM-gate coupled to
    FlgM/sigma-28 sequestration relieved by type-III secretion — gives the v2ecoli
    whole-cell model temporally ordered flagellar expression WITHOUT the manual
    multipliers/overrides the current WCM relies on. The COUNT direction claim is
    UNRESOLVED, not settled either way: under the investigation-wide "regulation
    ON = feature + full initial-state override" definition, a 4-seed x 3-gen
    ensemble shows ON below OFF in 12/12 seed-generations, but ON is rising and
    OFF is falling generation-over-generation (converging) — consistent with ON
    simply recovering from a much lower starting flagella count (the override sets
    4) rather than a clean regulatory suppression at steady state. The PRIOR
    override-free ensemble had shown the opposite (ON > OFF, 11/12) — the two
    results answer different questions (regulation alone vs. regulation + the
    full override) and neither should be read as a clean answer to Maya's
    original overexpression-REDUCTION hypothesis. NFsim rule-based assembly
    additionally supplies the ordered, conditional construction that stochastic
    Gillespie complexation cannot.
  evidence_for:
  - The SUM-gate writes per-promoter init_prob_override with Class II > Class III, and the ordering is maintained across a cell division (study 02).
  - FlgM is secreted (1481 -> 5) and free FliA is released but stays bounded (~1.35x initial) via the flgM negative-feedback loop (study 02).
  - (Mechanistic, cache-independent) the cascade is wired and functional; the count direction is covered under evidence_against, not here.
  - NFsim assembles complete flagella through ordered intermediates (export -> motor -> hook -> flagellum); 9 complete flagella in 2400 s (study 04).
  - Under a low-flagella initial condition (study 02), the Class III override starts at exactly 0 and rises only as FlgM is secreted (1481 -> 115) — the assembly-gated Class II -> Class III onset, made explicit.
  - The complete (non-reduced) initial-state override also reproduces the same onset delay with no equilibrium error (study 02, chart 01, the study's lead figure) — the reduced override used elsewhere was an unnecessary precaution.
  evidence_against:
  - COUNT DIRECTION IS CONFOUNDED, NOT RESOLVED (2026-07-28) — under the current
    "regulation ON = feature + full override" definition, ON sits below OFF in
    12/12 seed-generations of a fresh 4-seed x 3-gen ensemble (ON means
    20.5/28.0/31.0 vs OFF means 49.25/43.25/39.5), but this is NOT a clean
    regulation effect -- OFF still starts from the default cache's ~30-45
    already-flagellated state while ON starts from the override's 4, and the two
    trajectories are CONVERGING (ON rising, OFF falling) across generations —
    consistent with ON recovering from a lower start rather than steady-state
    suppression. The prior override-free ensemble had shown the opposite (ON
    means 62.5/54.8/59.0 vs OFF 49.5/44.2/40.8, ON > OFF in 11/12) — that result
    is superseded by this redefinition, not contradicted by it, since it answers
    a different question (regulation alone, same initial condition for both arms).
  - Neither ensemble isolates "regulation's effect" cleanly -- the override-free one
    holds initial condition constant but omits Maya's real initial state; the
    override one uses Maya's real initial state but only for ON, confounding it
    with regulation. A same-initial-condition comparison (OFF also given the
    override) or a longer ensemble (to see if ON's rising trend crosses OFF) would
    be needed to separate the two effects — neither has been run yet.
  - All lineages are single-seed, daughter-1-carry-forward within each of the 4
    ensemble seeds; robustness beyond 3 generations is untested.
  - The assembly-gated Class III onset is shown only under a hand-set low-flagella
    initial condition (study 02); from the default already-flagellated cache the
    cascade shows the magnitude ordering but not the onset delay.
  key_figures:
  - flagella-01-overexpression-baseline/charts/02_multigen_flagella_and_mass.svg
  - flagella-02-transcription-regulation/charts/01_full_override_gated_cascade.svg
  - flagella-02-transcription-regulation/charts/02_sumgate_classII_classIII.svg
  - flagella-03-voronoi-compartments/charts/01_flagella_protein_compartments.svg
  - flagella-04-complexation-nfsim/charts/01_nfsim_assembly.svg
  caveats:
  - The transcriptional cascade (Aim 2A) and the NFsim assembly (Aim 2B) run as separate opt-in pieces; NFsim is standalone, not yet wired to replace ecoli-complexation inside the WCM.
  - Spatial organization (Aim 1) now has two studies (03 Voronoi compartments, 05 spatial transport) but neither is coupled to the transcriptional cascade or the WCM's actual spatial dynamics yet — both are visualization/scaffolding, not mechanistic spatial simulation.
  - Quantitative count results use a local full-mode ParCa rebuild (out/cache_full); the committed ParCa fixture stays fast-mode.
  - Regulation ON (feature + full override) and regulation OFF (default cache, no override) now start from DIFFERENT initial flagella counts (4 vs ~30-45) -- by Maya's explicit choice, since OFF is meant to stay the unregulated reference. Any ON-vs-OFF count comparison therefore mixes the regulatory effect with the initial-condition gap; see the COUNT VERDICT section above for the full caveat.
