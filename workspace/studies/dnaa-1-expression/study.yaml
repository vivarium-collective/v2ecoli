simulation_set:
  - name: dnaa1-mechA-vtuning
    kind: single-daughters-multigen-lineage
    status: ran
    base_model: v2ecoli.composites.baseline (cache out/cache_dnaa1_mechA_1.7e-3, V overridden per run via --perturbation; resume from dnaa-0 gen-3 init)
    duration_steps: 7200 s/gen cap × 7 gens
    seeds: [0, 1, 2, 3]
    sweep: "TU00259[c] per-promoter init_prob ∈ {0.8e-3 (canonical), 0.9e-3, 1.0e-3, 1.1e-3, 1.2e-3, 1.3e-3, 1.7e-3}, 2026-06-08 7-point full-history choose-the-V sweep (seed 1) via recorded --perturbation override (see charts/dnaa1_v_sweep), plus a 4-seed multiseed at V=1.2e-3 (seeds 0/1/2/3, see charts/dnaa1_v12_multiseed)"
    metrics: [DnaA monomer total (trough/mean/peak), dnaA mRNA init rate, oriC count]
    pass_fail_tests:
      - dnaa-monomer-count-in-band-300-800-across-generations
      - dnaa-mrna-init-rate-near-biological-rate

conclusion_logic:
  if_primary_tests_pass: |
    Mechanism A (runtime overwrite of dnaA's per-promoter init_prob) lands the
    dnaA mRNA initiation rate near the biological ≈1 event/min and holds the
    DnaA monomer pool cycle-mean in band [300,800] with a clean oriC cycle, so
    the succinate DnaA-expression foundation is established and downstream
    mechanism / box-binding / extrinsic studies can be designed on top.
    Realized 2026-06-09 (V swept down per Rashmi, reconciled to canonical
    V=0.8e-3): pass on the in-band + steady criterion at V=0.8e-3; the cycle-mean
    plateaus in [300,800] for steady gens 4-7 (336.5/337.5/359.5/414.8, the whole
    oscillation under 800) with oriC clean 1↔2 every gen and a division every gen.
    This satisfies the expert's ask (the DnaA pool oscillating in band while the
    dynamics stay steady). The init-rate layer is not simultaneously satisfied at
    the chosen V: at V=0.8e-3 the rate is ~0.6/min (0.46–0.71, below ~1/min); the
    rate hits target only at V≈1.0-1.1e-3, where the pool does not equilibrate in
    band (the 15-gen V=1.1e-3 run overshoots). No single constitutive V closes
    both; closing both needs a regulated lever. So the foundation is established
    for the band-stable pool, with the rate tradeoff documented for re-review.
  if_primary_tests_fail:
    summary: |
      Sweep the per-promoter init_prob in [1e-3, 5e-3] to land the rate near
      target; if the pool cannot be held in band with a clean cell cycle,
      document the structural difference from the PDF setup (cache, initial
      condition, or regulation) rather than forcing the value.
    # The spine roll-up reads needs_calibration (not failed): the in-band +
    # steady tests PASS at canonical V=0.8e-3, but the init-rate PRIMARY test is
    # an honest PARTIAL (~0.6/min vs ~1/min) — an outstanding, expert-acknowledged
    # CALIBRATION item, not a failure. It is established here that NO constitutive
    # V closes both the band and the ~1/min rate, so the rate cannot be calibrated
    # within this study; the diagnose entry below stamps the seeded study that
    # resolves it with a regulated lever.
    diagnose:
      - issue: >-
          Residual calibration item driving the needs_calibration roll-up: at the
          band-stable canonical V=0.8e-3 the dnaA mRNA initiation rate is
          sub-physiological (~0.6/min vs the ~1/min target), the partial init-rate
          test. Established here (7-point sweep + 15-gen equilibration) that no
          single constitutive V closes both the in-band pool and the ~1/min rate,
          so the rate is not calibratable within this study; it needs a regulated
          / cell-cycle-coupled DnaA synthesis lever.
        seeded_study: dnaa-4-autoregulation
        status: seeded
        note: >-
          dnaa-4-autoregulation (DnaA negative autoregulation, self-stabilizing
          the DnaA pool without the manual V override) is the seeded diagnostic
          that dissolves this band-vs-rate tension at its root. The expert (Rashmi
          2026-06-09) approved V=0.8e-3 to move forward with the rate flagged as
          the known tradeoff; closing the rate is deferred to the regulated lever,
          not outstanding within dnaa-1.

