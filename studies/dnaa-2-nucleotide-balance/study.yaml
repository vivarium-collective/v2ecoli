tests:
  - name: dnaa-atp-fraction-in-band-0.2-0.5
    classification: primary
    question: Is the DnaA-ATP fraction in [0.2, 0.5], stable across the lineage?
    measure:
      kind: range_check_per_generation
      path: MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
    pass_if:
      op: in_range_every_generation
      low: 0.2
      high: 0.5
    status: failed   # strict per-gen NOT met on the only on-disk run; cycle-mean in band
    result: |
      FAIL on the strict per-generation criterion against the only on-disk run
      (seed0-v1e-3-6gen-ondisk): gen-1 = 0.546 (above, burned-in transient) and
      gen-5 = 0.191 (below), so NOT in [0.2,0.5] every generation. Cycle-mean =
      0.283 IS in band, and the MECHANISM (Haochen's bf8b82e integrate_dt) is
      validated — the fraction is driven off the ~0.997 fast-equilibrium pin into
      the band region. Rashmi's 7-gen reproduction met this test (all gens in
      band) but has no raw data on this branch to re-verify. A clean 7-gen
      reproduction on current code is required to record a strict PASS.
    notes: |
      The ~0.997 pin was the fast-equilibrium artefact, NOT a K_d / [ATP]:[ADP] /
      expected-fraction parameter error. Resolved by flagging the DnaA-ADP
      reaction integrate_dt=true (kinetic) while keeping it bidirectional. The
      open item is reproduction cleanliness (per-gen in-band across a full
      lineage), not the mechanism.

  - name: total-dnaa-in-band-300-800
    classification: secondary
    question: Does total DnaA stay in [300, 800]?
    measure:
      kind: range_check_per_generation
      path: PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c]
    pass_if:
      op: in_range_every_generation
      low: 300
      high: 800
    status: partial
    result: |
