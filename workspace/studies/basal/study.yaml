      result: WITHIN_TOL
      detail: 'report card ''statistical'': ungraded'
status: evaluated
tests:
- name: summary-vs-vecoli
  kind: report_card
  card: summary
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (summary card)?
- name: parca-vs-vecoli
  kind: report_card
  card: parca
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (parca card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/whole-cell-model-comparison/basal
    group: parca
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/whole-cell-model-comparison/basal
    group: statistical
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (standard card)?
- name: trajectory-vs-vecoli
  kind: report_card
  card: trajectory
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (trajectory card)?
- name: distribution-vs-vecoli
  kind: report_card
  card: distribution
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (distribution card)?
- name: metabolism-vs-vecoli
  kind: report_card
  card: metabolism
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (metabolism card)?
- name: composition-vs-vecoli
  kind: report_card
  card: composition
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (composition card)?
