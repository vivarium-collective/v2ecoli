robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: 3 seeds x 3 generations is a smoke-level replication floor, chosen because the null test only
    needs to observe a single non-zero transcript to fail. It does NOT support a powered claim about rates;
    no rank test is planned and none should be inferred.
controls:
- name: comparison-group-is-synthesized
  kind: positive
  hypothesis: The 294 other top-300 transcription units should be transcribed normally. If they are silent
    too, the run or the listener is broken and no contrast can be drawn.
  expected: median synthesis above zero across the comparison group.
  observed: ''
  result: PENDING
alternative_hypotheses:
- claim: The zeros are ordinary stochastic sampling; a generation is a finite number of draws and 43.3%
    of all TUs got zero.
  discriminated_by: zero-synthesis-is-reproducible, across 3 seeds x 3 generations. This is the null and
    the study dissolves if it holds.
  status: untested
- claim: The ribosomal-protein override assigns these TUs an effectively zero probability, so they are
    silent by construction.
  discriminated_by: cohort-shares-a-distinguishing-attribute and effective-probability-explains-silence.
  status: untested
- claim: The probability in force is normal and the TUs are simply never selected, making this a sampling
    or allocation defect rather than an assignment one.
  discriminated_by: effective-probability-explains-silence, which fails in that case and redirects the
    repair downstream.
  status: untested
- claim: The six share nothing; their zeros have separate causes and the cohort is an artefact of ranking
    by a probability that is not in force.
  discriminated_by: cohort-shares-a-distinguishing-attribute.
  status: untested
falsifiability: The study is overturned if any cohort TU is transcribed in any generation of any seed,
  which would make the zeros stochastic; if the comparison group is also silent, which would indict the
  run rather than the cohort; or if the six share no attribute rarer than 10% in the comparison group,
  which would mean there is no common mechanism to repair.
limitations:
- The cohort's identity comes from one generation of one seed, so membership may be incomplete; other
  TUs could be silent without having appeared in that observation.
- 3 seeds x 3 generations is a replication floor sufficient to falsify "never transcribed", not to estimate
  a transcription rate.
- Single medium and condition. A TU silent under these conditions may be transcribed under others, and
  nothing here speaks to that.
- Identifying a shared attribute establishes association, not cause. Showing the attribute is what silences
  the cohort would need an intervention, which is deliberately left to a follow-up rather than claimed
  here.
- The study does not address whether these TUs SHOULD be transcribed biologically; it asks only why the
  model does not transcribe units it assigns a high probability.
conclusion_logic:
  if_primary_tests_pass: A reproducible cohort of high-probability transcription units is silent by construction,
    at least one other gene is stranded on them, and the repair is in how effective synthesis probability
    is assigned -- a general fix rather than a dnaG-specific one.
  if_primary_tests_fail:
    summary: If the zeros do not reproduce, the cohort is stochastic and dnaG's finding weakens from "never
      transcribed" to "rarely transcribed", which is a materially different and much smaller claim. If
      they reproduce but share no attribute, the silences have separate causes and each needs its own
      diagnosis. If the effective probability is normal, the defect is in sampling rather than assignment.
    diagnose:
    - question: Is the silence an artefact of probability assignment or of transcript selection?
      note: Answered by effective-probability-explains-silence within this study.
discovery_implications:
  resolved_uncertainties:
  - 'Whether the zeros were stochastic: partly. The cohort IS transcribed, so ''silent'' is refuted, but
    at ~1/51 of its assigned rate, so the anomaly is real.'
  - 'Whether the ribosomal-protein override explains the cohort: no. 1 of 6.'
  - 'Whether transcript length explains it: no. r = -0.106 across the top 300.'
  - 'Whether the defect is dnaG-specific: no. Four other cistrons are stranded on cohort transcripts.'
  remaining_uncertainties:
  - What actually depresses these transcripts, given no static cache attribute does.
  - Whether the runtime synthesis probability in force differs from the assigned value for these TUs.
  - 'Whether the cohort is complete: membership came from one generation, so other depressed TUs may exist
    that happened to be transcribed that time.'
  - Whether the four newly-identified stranded cistrons have measurable phenotypes.
  followup_study_proposals:
  - id: FU-01
    title: Instrument the runtime synthesis probability per TU
    motivation: 'Static cache inspection is exhausted: no attribute distinguishes the cohort. The

      remaining candidate is that the probability actually in force at runtime differs

      from the assigned one for these TUs, which requires instrumenting

      TranscriptInitiation rather than reading the cache.

      '
  - id: FU-02
    title: Enumerate the full depressed cohort across many generations
    motivation: 'Membership came from a single generation, so the six are those that happened to

      be zero that time. Ranking every TU by realized/assigned over many generations

      would give the true cohort and show how much of the proteome is affected.

      '
  - id: FU-03
    title: Do the four newly-stranded cistrons have phenotypes?
    motivation: 'EG10401, EG10833, EG11140 and G6542 are supplied at the same reduced rate as

      dnaG but nothing surfaces them. Whether their scarcity has measurable consequences

      determines how much of the model''s behaviour this defect quietly shapes.

      '
