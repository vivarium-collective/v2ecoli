    note: "The whole-cell (EcoliWCM) tier placed into the mother-machine geometry via\nv2ecoli.colony_bench (build_bench_core('wcm') + geometries.mother_machine).\nBounded natural-division run; phenotypes extracted by colony_bench.phenotypes,\nfigures by colony_bench.viz — the same pipeline as colonies-05/06/08.\n"
