  config:
    title: >-
      dnaa-1 expression figure (V=1.1e-3 CANONICAL, seed 1, 7 generations, FULL
      within-cycle history) — rendered from out/dnaa1_v1p1e-3, the chosen run of
      the 2026-06-08 V sweep (V set at run time via --perturbation
      'TU00259[c]=1.1e-3', OVERRODE cache-baked 0.0017; recorded provenance).
      Generation-aligned 4-panel on a shared cumulative lineage-time axis:
      (a) dnaA mRNA initiation events/min (≈1.0/min on target), (b) total DnaA
      monomer count + accepted band [300,800], (c) DnaA concentration (nM),
      (d) oriC count. RESULT (Rashmi's generation-average criterion): at V=1.1e-3
      the DnaA monomer steady-gen (4-7) cycle-mean is 676 — INSIDE [300,800] —
      AND the dnaA init rate (gens 4-7 = 0.94/1.05/1.04/0.97, mean 1.00/min) is
      ON the ~1/min biological target, so BOTH targets are met. oriC stays
      periodic 1↔2 (clean cycle, no reinitiation) and every gen divides at
      chromosomes=2; the multiseed (seeds 0-3) confirms the dynamics are
      seed-robust. HONEST: the strict whole-oscillation-≤800 is NOT met — the
      pool doubles per cycle so the within-cycle PEAK overshoots 800 (gen6/7 max
      1161/1139, later-gen cycle-means creep to 804/842); per the dnaa-2 rule
      this is the expected accumulate-then-divide excursion, not a fail. The
      prior 0.8e-3 pick was in-band but sub-physiological-rate and is superseded.
