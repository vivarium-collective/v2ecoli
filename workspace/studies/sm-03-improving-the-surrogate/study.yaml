schema_version: 4
name: sm-03-improving-the-surrogate
investigation: surrogate-modeling
title: "Improving the surrogate — does rollout-loss training close the gap?"
created: '2026-06-16'
status: evaluated

design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

claim: |
  Multi-step rollout-loss training (the net trains on its own unrolled
  predictions) genuinely improves the neural surrogate — it eliminates the
  autoregressive instability (0/8 unstable folds vs 1/8 for one-step training)
  and lowers rollout error (median nRMSE 0.053 vs 0.069). It still does not beat
  the linear baseline (0.019) for this smooth target, but it is the right
  technique to carry to harder, genuinely nonlinear targets.
confidence: Accepted

question: |
  sm-01 diagnosed the neural net's weakness as autoregressive instability from
  one-step training. Does the principled fix — multi-step rollout-loss training —
  close the gap to the linear baseline?

report:
  title: sm-03-improving-the-surrogate — rollout-loss training
  verdict: pass
  confidence: high
  evidence_quality: 8-fold leave-one-trajectory-out CV; one-step vs rollout-loss vs linear
  objective: |
    Test whether training the surrogate on its own K-step unrolled predictions
    (so compounding error is penalized) fixes the instability sm-01 found and
    narrows the gap to the linear baseline.
  setup: |
    code/rollout_train.py trains a pbg-torch SurrogateNet with a differentiable
    K=10-step rollout loss and compares it head-to-head against the one-step net
    and the linear baseline under the same 8-fold leave-one-trajectory-out CV
    (cell_mass rollout nRMSE + instability count).
  result: |
    8-fold CV, cell_mass rollout nRMSE (median) / unstable folds:
      - neural net, one-step loss   : 0.069  (1/8 unstable)
      - neural net, rollout loss     : 0.053  (0/8 unstable)   <- improved + stabilized
      - linear baseline              : 0.019  (0/8 unstable)   <- still best
    Rollout-loss training removes the instability entirely and improves rollout
    accuracy by ~23%, but does not overtake the linear model.
  interpretation: |
    The diagnosis was correct and the fix works: rollout-loss training is the
    right way to stabilize an autoregressive neural surrogate, and it measurably
    improves it. For a target as smooth as coarse cell mass, though, a linear
    model still wins — there is little nonlinear structure for the net to exploit.
    The value of this result is methodological: rollout-loss is the technique to
    apply to genuinely nonlinear targets (where a linear model fails), and the
    pipeline now supports it. It does not change sm-01's conclusion for THIS
    target; it shows the path for harder ones.
  decision: |
    PASS — rollout-loss training narrows the gap (stabilizes + improves the net).
    The honest ranking for coarse growth is unchanged (linear best), but the
    follow-up establishes the right tool for harder targets.

conditions:
  baseline:
    composite: ecoli_baseline
    params:
      seed: 0
  variants:
    - name: rollout-loss-training
      perturbation: "Train the SurrogateNet on K=10-step unrolled predictions."
      expected_contrast: "Fewer unstable rollouts; lower rollout error than one-step training."
      measured_contrast: "0/8 unstable (vs 1/8); nRMSE 0.053 (vs 0.069). Still > linear 0.019."

      composite: ecoli_baseline
  model_settings: []
tests:
  - name: rollout-loss-training-narrows-the-gap
    classification: primary
    status: passed
    question: |
      Does rollout-loss training improve the neural surrogate over one-step
      training — eliminating instability AND lowering rollout error?
    measure:
      kind: authored
      detail: |
        8-fold CV. Improvement ratio = one-step nRMSE / rollout-loss nRMSE =
        0.069 / 0.053 = 1.30 (>1 means improved); rollout-loss unstable folds = 0
        (vs 1 for one-step).
      measured_value: 1.30
    pass_if:
      op: gt
      low: 1.0
    cites_note: "Methodological: the fix must measurably improve the net to be worth adopting."

runs:
  - name: rollout-loss-cv
    status: completed
    kind: cross_validation
    canonical: true
    description: |
      code/rollout_train.py: 8-fold CV comparing one-step vs rollout-loss (K=10)
      SurrogateNet training vs the linear baseline on cell_mass rollout.
    dispatch: serial
    emitter:
    result: PASS
    outcomes:
      rollout-loss-training-narrows-the-gap:
        result: PASS
        detail: "rollout-loss 0.053 nRMSE, 0/8 unstable (vs one-step 0.069, 1/8). Linear still best at 0.019."
    computed_outcomes:
      _status: store_unresolved

embed_visualizations:
  - name: "Rollout-loss training — does it help? (interactive)"
    url: /reports/figures/sm-03-improving-the-surrogate/rollout_loss_improvement.html
    description: "8-fold CV rollout error (log) for the one-step net, the rollout-loss net, and the linear baseline. Rollout-loss eliminates the instability (0/8) and improves accuracy, but the linear model still wins for this smooth target — rollout-loss is the technique for harder, nonlinear targets."

conclusion_verdicts:
  - claim: "Rollout-loss training fixes the neural surrogate's autoregressive instability."
    verdict: supported
    basis: "0/8 unstable folds with rollout loss vs 1/8 with one-step training."
  - claim: "Rollout-loss training makes the neural net beat the linear baseline."
    verdict: refuted
    basis: "Rollout-loss nRMSE 0.053 still > linear 0.019; little nonlinear structure to exploit."

robustness:
  n_replicates: 1
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  parameter_sweep: false
  swept_param: "held-out trajectory (8-fold)"

falsifiability: |
  The improvement claim fails if rollout-loss training does not reduce the number
  of unstable folds or does not lower the median rollout error vs one-step.

simulation_set:
  - name: rollout-loss-cv
    kind: cross_validation
    status: ran
    base_model: v2ecoli.composites.ecoli_baseline
    duration_steps: 0
    seeds: 8
    details: "8-fold CV: one-step vs rollout-loss vs linear on cell_mass rollout."
    metrics:
      - rollout_mass_nrmse_median
      - unstable_folds
    pass_fail_tests:
      - rollout-loss-training-narrows-the-gap
inputs:
  - artifact: sm-01-nn-surrogate
    from: sm-01-nn-surrogate
