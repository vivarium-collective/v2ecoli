schema_version: 4
name: succinate
investigation: whole-cell-model-comparison
title: v2ecoli reproduces vEcoli on succinate
condition: succinate
question: Does v2ecoli reproduce vEcoli on the succinate condition?
comparison:
  seeds: 4
  generations: 4
report_cards:
  - viz/report_card/config.html
  - viz/report_card/standard.html
  - viz/report_card/statistical.html
runs:
  - composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    name: succinate-comparison
    kind: analysis
    canonical: true
    description: v2e-compare study succinate
    status: completed
    result: PASS
    outcomes:
      statistical-vs-vecoli:
        result: WITHIN_TOL
        detail: 'report card ''statistical'': ungraded'
status: evaluated
tests:
  - name: config-vs-vecoli
    kind: report_card
    card: config
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (config card)?
  - name: standard-vs-vecoli
    kind: report_card
    card: standard
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (standard card)?
  - name: statistical-vs-vecoli
    kind: report_card
    card: statistical
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (statistical card)?
    measure:
      kind: report_card_axis
      card: docs/report_cards/whole-cell-model-comparison/succinate
      group: statistical
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      media: minimal_succinate  # migrated from condition:succinate; calibrated per-condition ParCa cache lives at out/cache/.regen_succinate_seed00
  model_settings: []
confidence: Accepted
findings:
  - id: succinate-vs-vecoli-result
    kind: computational
    status: partial
    statement: 'v2ecoli reproduces vEcoli on succinate (4-seed gen-1, Welch t-test): cell, dry, RNA and protein mass within tolerance (4/5 within_tol); growth rate shows a non-significant drift at basal noise level.'
    evidence:
      from_card: statistical
      observed: 'growth -6.6% (p=0.44, not significant); RNA -2.2%; cell -1.3%; dry -1.4%; protein -0.8% -- overall drift.'
inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir
