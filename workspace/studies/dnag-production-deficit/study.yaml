    verdict: confirmed
    basis: No model code or data was changed. The correcting measurement is an additional 3-generation run on the same cache and composite.
  biological_validation:
    verdict: not_met
    basis: "The simulation delivers 4.6% of ParCa's fitted DnaG count. The cause is now established as transcriptional: dnaG's only transcript is synthesised zero times per generation."
  explanatory_gain:
    verdict: confirmed (after correction)
    basis: "The study's first conclusion was wrong and was reversed by measuring transcription during a run rather than reading a parameter. The corrected result identifies a concrete mechanism: dnaG depends on TU00352 alone, that transcript is never synthesised, and its operon partners escape via alternative transcripts (rpoD 461, rpsU 1, dnaG 0). It also records two methodological traps -- basal_prob is overridden for idx_rprotein TUs, and the three cistrons do NOT share a single mRNA pool."
claim: "DnaG is starved because its only transcript, TU00352, is transcribed ~51x below its assigned rate while its operon partners rpsU and rpoD have alternative transcripts that are supplied normally."
