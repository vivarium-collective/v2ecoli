findings:
  - id: F-01
    statement: >-
      DnaA-ATP FRACTION LEVER IS RIDA, NOT INTRINSIC HYDROLYSIS. The DnaA-ATP fraction is set by the
      fast apo-charging equilibrium (apo+ATP⇌DnaA-ATP, apo+ADP⇌DnaA-ADP, forward rate ~1.0) which pins
      the DnaA-ATP/ADP split to the cellular ATP/ADP competition; the intrinsic equilibrium hydrolysis
      (~7.5e-6) and the charging Kd are ~5 orders smaller and, when scaled, have NO steady-state effect
      (verified: multiplier 1.0 vs 0.005 byte-identical). The dominant, TUNABLE DnaA-ATP->ADP drain is
      RIDA (replisome-coupled regulatory hydrolysis). RIDA is monotonic on the fraction: on 0.045, ×0.1
      0.098, ×0.05 0.276, off 0.389. So Rashmi's "tune the hydrolysis rate" is correct — the effective
      hydrolysis knob is RIDA. RIDA×0.05 lands the fraction in band on seeds 0/1/2 (0.218/0.244/0.212).
    status: evaluated
    provenance:
      run_ids: [opE40_s0, opE40_s1, opE40_s2]
  - id: F-02
    statement: >-
      FULL-OCCUPANCY TRIGGER. The mechanistic trigger fired when oriC_low_bound_atp >= threshold ×
      n_oriC; at the default threshold 6 (of 8 sites) it fired at ~0.6-0.75 occupancy. Setting
      DNAA_INIT_LOW_THRESHOLD=8 requires all 8 oriC-low sites bound — the trigger now fires at peak
      occupancy 1.00 (verified), while preserving the cycle.
    status: evaluated
    provenance:
      run_ids: [opE40_s0]
  - id: F-03
    statement: >-
      oriC ASYNCHRONY (new mechanism). Initiation was hardcoded synchronous ("we assume asynchronous
      initiation does not happen") — when the trigger fired, ALL origins doubled in one tick (oriC 2->4).
      A new flag-gated per-origin path (DNAA_ASYNC_INITIATION): the replication_data deriver emits
      per-origin oriC-low saturation (bound-ATP boxes grouped by domain_index), and chromosome_replication
      fires ONLY the saturated subset of origins, with a per-origin eclipse. Origins separate via
      per-origin stochastic filling + the RIDA feedback. Validated: on the same over-initiating config,
      async OFF jumps oriC 2->4 (no oriC=3) while async ON steps oriC 2->3->4 (4833 ticks at oriC=3), the
      decoupled behavior Rashmi requested. Default off = synchronous baseline byte-identical.
    status: evaluated
    provenance:
      run_ids: [ridaoff_sync, ridaoff_async]
  - id: F-04
    statement: >-
      SEED-ROBUST OPERATING POINT + F-04(dnaa-6) CORRECTION. RIDA×0.05 + threshold 8 + async +
      eclipse 40 min satisfies all four targets seed-robustly: DnaA-ATP fraction in band (0.21-0.24 all
      seeds), full-occupancy firing, asynchronous initiation, and regular once-per-cycle division with
      DnaA in [300,800]. The eclipse (per-origin SeqA) is essential — without it, weak RIDA + async
      over-replicate (oriC stuck at 3). This CORRECTS dnaa-6 F-04: the DnaA-ATP-fraction band does NOT
      need a code-level k_r change — it is reachable with existing env knobs (RIDA + eclipse). The open
      item is CALIBRATION (is RIDA×0.05 physiological?), a question for Rashmi/Haochen, not a modeling gap.
    status: evaluated
    provenance:
      run_ids: [opE40_s0, opE40_s1, opE40_s2]

biological_summary: >-
  E. coli times replication initiation through DnaA: DnaA-ATP cooperatively saturates the oriC
  low-affinity boxes and fires initiation; RIDA (at the replisome) and DDAH (at datA) hydrolyze
  DnaA-ATP to DnaA-ADP to lower activity after initiation, DARS reactivates DnaA-ADP mid-cycle, and
  SeqA sequesters the newly-replicated origin to block immediate re-firing. This study shows the model
  captures these as four separable controls — RIDA sets the DnaA-ATP level (the [0.2,0.5] band),
  full-filament saturation (8/8) sets when an origin fires, per-origin initiation sets that the two
  origins fire independently (oriC 2->3->4, not 2->4), and the SeqA eclipse sets one initiation per
  cycle — and that a single operating point balances all four, seed-robustly.
