schema_version: 4
name: foldchange-to-delta-fidelity
title: Does ParCa encode fold changes faithfully?
investigation: transcription-rewiring
study_type: fit_validation
phase: Design
created: '2026-09-04'
status: planned
design_status: complete
implementation_status: not_started
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested
question: dnaG is silenced because the LexA delta on its operon retains 4.3e-08 of basal expression. But
  the measured datum ParCa fit that delta from is lexA->rpoD at log2FC = -0.65, which means retaining
  0.637 -- a 1.48e+07-fold distortion between the input and its encoding. Is that isolated to this entry,
  or does the TF-regulation layer systematically misrepresent the fold-change data it is fit from?
parent_studies:
- study: pc00010-repression-arithmetic
  condition: ran
  relation: refines
- study: dnag-generational-decay
  condition: complete
  relation: supports
units_and_time:
  tick: not applicable -- this study reads static fit artefacts, not a simulation.
  quantities:
    log2FC: log2 fold change, the measured input (fold_changes.tsv)
    retained fraction: 1 + relative delta; the expression a target keeps when its TF is bound (dimensionless)
    discrepancy: log10 ratio of implied to expected retained fraction (dimensionless)
behavior_tests:
- name: distortion-is-systematic
  classification: primary
  gate_class: acceptance_criterion
  question: Is the fold-change-to-delta distortion confined to dnaG's operon, or does it affect the regulatory
    network?
  description: 'Across every delta_prob entry that can be joined to a source fold change, the median ratio
    of the delta''s implied retained fraction to 2**log2FC lies within [0.67, 1.5].


    The scope question, and the reason this is a separate study rather than a footnote to pc00010-repression-arithmetic.
    That study asks whether the RUNTIME arithmetic closes given the delta; this asks whether the delta
    faithfully encodes the measured data it was fit from -- a ParCa question, upstream, needing no simulation.
    A PASS means the LexA/rpoD case is an isolated pathology; a FAIL means the TF-regulation layer systematically
    misrepresents its inputs and every study in this investigation that leaned on delta_prob is affected.


    Threshold provenance: theory. 0.3 in log10 is the factor-of-2 agreement band this investigation uses
    throughout, applied to a quantity that should agree exactly.'
  measure:
    kind: derived
    path: median (delta-implied retained fraction / 2**log2FC) over all joinable TF-target delta_prob
      entries, the encoding that silences dnaG via lexA on rpoD
    detail: median absolute log10 ratio of implied to expected retained fraction across the joined network.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Expressed as the RATIO implied/expected with a band around 1, not as |log10 discrepancy| in
        [0, 0.3]. The two say the same thing, but a band anchored at zero always has half-width equal
        to its midpoint and so can never satisfy the discrimination check -- the same reformulation dnag-promoter-availability
        needed. [0.67, 1.5] is the factor-of-1.5 agreement band used across this investigation.
  status: pending
- name: distortion-grows-with-repression-strength
  classification: primary
  gate_class: acceptance_criterion
  question: Does the distortion depend on how strong the measured regulation is?
  description: 'The median discrepancy for STRONG repressors (log2FC <= -1) is within 2x of that for WEAK
    ones (-0.5 <= log2FC < 0).


    Separates two very different defects. If the discrepancy is uniform, the encoding has a constant bug.
    If it explodes for strong repression, the failure is a saturation or clipping behaviour -- which is
    what the dnaG/rpoD case looks like, since a MODEST -0.65 became total silencing, and that would predict
    the reverse of the naive expectation.


    Threshold provenance: theory. 2x is the standing agreement band, here applied between two subgroups.'
  measure:
    kind: derived
    path: ratio of median |log10 implied/expected| for strong repressors to weak ones, including the lexA->rpoD
      entry that silences dnaG
    detail: median |log10 ratio| for log2FC <= -1 divided by the same for -0.5 <= log2FC < 0.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check's 3x ceiling.
        [0.67, 1.5] is the agreement band used by every other axis here, so the subgroup comparison reads
        on the same scale as the fidelity measurements.
  status: pending
- name: delta-respects-the-probability-bound
  classification: diagnostic
  gate_class: acceptance_criterion
  question: Does any delta drive an initiation probability negative?
  description: 'Zero delta_prob entries have an implied retained fraction below 0, i.e. no relative delta
    is more negative than -1.


    EG10620_RNA[c] already shows a delta of -1.000009252, giving a retained fraction of -9.25e-06. A negative
    initiation probability is not a rounding artefact: it is a term a multinomial cannot accept. This
    axis counts how widespread that is. Recorded here rather than in pc00010-repression-arithmetic because
    that study asks whether the negative value reaches the SAMPLER at runtime, while this asks how many
    such entries the FIT produced.


    Threshold provenance: definitional. A probability is non-negative.


    Classified DIAGNOSTIC, not primary. None of H1-H4 predicts a different outcome for it -- it measures
    the prevalence of a defect already known to exist (EG10620_RNA[c] at -9.25e-06), rather than discriminating
    between the hypotheses. Labelling it primary was a mis-classification on my part, and it also made
    the audit flag a one-sided threshold of zero as ''unverifiably loose'' when zero is the tightest threshold
    a violation count can have.'
  measure:
    kind: derived
    path: count of delta_prob entries with implied retained fraction < 0, the bound the lexA-regulated
      EG10620 entry already violates alongside dnaG's operon
    detail: number of TF-target delta entries with relative delta below -1, across the whole matrix.
  pass_if:
    op: <=
    value: 0
    provenance:
      kind: theory
      note: 'Definitional: an initiation probability cannot be negative.'
  status: pending
- name: activators-are-encoded-faithfully
  classification: primary
  gate_class: acceptance_criterion
  question: Is the distortion specific to repression?
  description: 'For activating regulation (log2FC > 0), the median implied/expected ratio lies within
    [0.67, 1.5].


    The discriminating control, and a real one: 523 of the 907 fold changes are POSITIVE. If activators
    are encoded faithfully while repressors are not, the defect is in how negative regulation is converted,
    which localises it sharply. If both are distorted, the problem is the conversion itself.


    Threshold provenance: theory. The same band as the systematic axis, so the two are directly comparable.'
  measure:
    kind: derived
    path: median (implied retained / 2**log2FC) for activating entries, the control for the lexA repression
      that silences dnaG through rpoD
    detail: median absolute log10 ratio for positive-fold-change entries.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Expressed as the RATIO implied/expected with a band around 1, not as |log10 discrepancy| in
        [0, 0.3]. The two say the same thing, but a band anchored at zero always has half-width equal
        to its midpoint and so can never satisfy the discrimination check -- the same reformulation dnag-promoter-availability
        needed. [0.67, 1.5] is the factor-of-1.5 agreement band used across this investigation.
  status: pending
  control: negative
- name: lexa-rpod-discrepancy
  classification: supporting
  gate_class: regression_pin
  question: Does the case that motivated this study still measure as recorded?
  description: 'The LexA->rpoD discrepancy stays within a factor of 10 of the recorded 1.476e+07.


    POST-HOC and explicitly so: this number was MEASURED while scoping pc00010-repression-arithmetic,
    before this study existed, so it cannot be an acceptance criterion here. lexA->rpoD carries a measured
    log2FC of -0.65 (retain 0.6373) while the in-force delta retains 4.3167e-08. Recorded as a pin so
    the case is pinned against drift, not as evidence that the study''s own thresholds were met.'
  measure:
    kind: derived
    path: expected over implied retained fraction for the lexA->rpoD delta on dnaG's operon TU00352
    detail: 2**-0.65 divided by (1 + in-force relative delta) for TU00352[c], TF index 14.
  pass_if:
    op: <=
    value: 147600000.0
    provenance:
      kind: post_hoc
      note: 10x the 1.476e+07 measured while scoping the sibling study; a drift pin, not a gate.
  status: pending
