  - test: distortion-grows-with-repression-strength
    prior: Does the distortion depend on how strong the measured regulation is?
  - test: delta-respects-the-probability-bound
    prior: Does any delta drive an initiation probability negative?
  - test: activators-are-encoded-faithfully
    prior: Is the distortion specific to repression?
implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Join delta_prob entries to their source fold changes.
  detail: 'fold_changes.tsv is keyed by (TF common name, TARGET CISTRON common name); delta_prob is keyed
    by (TU index, TF index). The join needs three maps, all already available: tf_ids from ecoli-tf-binding,
    the cistron_tu_mapping_matrix carried on several listener configs, and gene common-name to cistron
    id. A cistron regulated in a POLYCISTRONIC TU is the crux of this study -- lexA regulates rpoD, and
    dnaG is silenced as its operon passenger -- so the join must record which cistron each TU-level delta
    came from and must not silently collapse a multi-cistron TU to one target. Entries that cannot be
    joined are reported as a count, never dropped quietly.'
- id: req-2
  status: not_started
  blocking: false
  summary: Locate the ParCa stage that converts fold changes into deltaV.
  detail: 'Needed to interpret a FAIL rather than merely record one. transcription_regulation.py exposes
    get_delta_prob_matrix but the deltaV values arrive precomputed in sim_data; the conversion happens
    earlier in the ParCa fit. Not blocking: the fidelity measurement stands whether or not the responsible
    line is found.'
alternative_hypotheses:
- name: H1 isolated pathology
  discriminator: distortion-is-systematic
  statement: Only a handful of entries are distorted and the network is otherwise faithful. Predicts distortion-is-systematic
    PASSES while the lexA-rpoD pin stays extreme -- a bad entry, not a bad layer.
- name: H2 systematic encoding defect
  discriminator: distortion-is-systematic
  statement: The median entry is misencoded by more than 2x, meaning the TF-regulation layer does not
    represent its input data and every result in this investigation that leaned on delta_prob needs revisiting.
- name: H3 saturation on strong repression
  discriminator: distortion-grows-with-repression-strength
  statement: Faithful for weak regulation and divergent for strong, i.e. a clipping or saturation behaviour.
    The dnaG case argues AGAINST the naive version of this -- a modest -0.65 became total silencing --
    so a confirmation here would mean the saturation is not driven by fold-change magnitude at all.
- name: H4 repression-specific
  discriminator: activators-are-encoded-faithfully
  statement: Activators are encoded faithfully and repressors are not, localising the defect to the negative
    branch of the conversion.
falsifiability: 'Every hypothesis is separated by a named axis, and the activator subset is a genuine
  control rather than a formality: 523 of 907 fold changes are positive, so if the conversion were simply
  broken both subsets would fail together. The study also cannot be satisfied by its own motivating case
  -- that is a PIN, explicitly post-hoc, and the acceptance criteria are all network-level quantities
  not yet measured.'
assumptions:
- assumption: 2**log2FC is the retained fraction the delta should encode.
  basis: fold_changes.tsv declares its column as 'log2 FC mean', and a delta is defined in transcription_regulation.get_delta_prob_matrix
    as the change in initiation probability when the TF is bound; with ppgpp=True it is divided by basal_prob
    and so becomes relative, making 1 + delta the retained fraction directly comparable to 2**log2FC.
  risk: low
- assumption: A TU-level delta is attributable to its regulated cistron's fold change.
  basis: 'Necessary for the join, and imperfect: a TU carrying several regulated cistrons has one delta
    and several fold changes. req-1 requires such TUs be recorded rather than collapsed, and the study
    reports single-cistron and multi-cistron joins separately so this assumption is visible in the result
    instead of buried in it.'
  risk: medium
simulation_set: []
planned_runs:
- name: static-fit-analysis
  status: planned
  n_steps: 0
  details: 'NO SIMULATION AT ALL. This study reads two static artefacts: the ParCa cache (out/cache/sim_data_cache.dill,
    fingerprint ea05ac9b23b1d843) and reconstruction/ecoli/flat/fold_changes.tsv. It is a fit-validation
    study, and its result is a property of the cache every study in this investigation shares, not of
    any run.'
robustness:
  n_replicates: 1
  seeds: []
  parameter_sweep: false
  note: 'Replication is not meaningful: the quantities are deterministic properties of a fixed cache and
    a fixed TSV. The relevant breadth is the 907 fold changes and 47 TFs, not repeated draws.'
controls:
- name: activators-are-encoded-faithfully
  kind: negative
  hypothesis: If activators are distorted too, the defect is the conversion itself, not the repression
    branch.
  expected: median |log10 discrepancy| below 0.3 for positive fold changes.
  observed: ''
  result: PENDING
limitations:
- The join is by common gene name between two independently maintained artefacts; unjoinable entries are
  counted and reported, but a systematic naming mismatch could bias which entries are examined.
- A polycistronic TU carrying several regulated cistrons has one delta and several fold changes. Reported
  separately, but no single expected value exists for such entries.
- 'The study measures fidelity between input and encoding. It does NOT establish which is right: a faithful
  encoding of a wrong fold change would pass every axis here.'
- The result is a property of cache fingerprint ea05ac9b23b1d843. A cache rebuilt after a ParCa change
  could differ, and this investigation has a recorded LexA-related ParCa fix on another branch whose relationship
  to this cache has not been checked.
claim: ''
conclusion: ''
confidence: Planned
