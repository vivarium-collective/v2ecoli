schema_version: 4
name: ketchup-exchange-comparison
investigation: ketchup-baseline-comparison   # owning investigation (back-reference)
title: v2ecoli baseline central-carbon exchange phenotype vs KETCHUP kinetic models
created: '2026-06-12'
status: evaluated

# Canonical 6-axis status. The KETCHUP kinetic models run as real dashboard
# simulations (KetchupEstimator / KetchupDynamicEstimator, IPOPT); the v2ecoli
# baseline side is the pinned population_phenotype_basal reference vector.
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

question: |
  Does the v2ecoli baseline central-carbon exchange / byproduct phenotype
  (glucose, O2, CO2, acetate, NH3, SO4) match the KETCHUP core-metabolism
  kinetic models k-ecoli74 and k-ecoli307, when both are glucose-normalized and
  graded by the report-card flux_scatter criterion?

report:
  title: "ketchup-exchange-comparison — v2ecoli baseline vs KETCHUP k-ecoli74/307 + Millard 2017"
  verdict: partial
  confidence: high
  evidence_quality: multi-axis report cards (whole-vector R^2 + per-metabolite rel-tol) over 3 kinetic models
  objective: |
    Grade the v2ecoli whole-cell baseline central-carbon exchange-flux vector
    against THREE kinetic models (used as report-card reference sources) —
    KETCHUP k-ecoli74, KETCHUP k-ecoli307, and the Millard 2017 central-carbon
    ODE — to characterize which kinetic regime v2ecoli's baseline byproduct
    partitioning resembles. A CHARACTERIZATION, not a v2ecoli pass/fail.
  setup: |
    MEASURED = v2ecoli baseline exchange fluxes (pinned population_phenotype_basal
    reference, 20-seed ensemble mean), glucose-normalized to -100. REFERENCES =
    (1) KETCHUP k-ecoli74 / k-ecoli307 fitted exchange fluxes (pbg-ketchup
    KetchupEstimator, boundary reactions → EcoCyc IDs); (2) the Millard 2017 ODE
    (millard2017_metabolism / COPASI, the flux source of millard_fba_bridge_harness;
    glucose + acetate only). Each model graded by report_card.py with a
    whole-vector flux_scatter axis PLUS per-metabolite rel_tol axes (O2/CO2/NH3).
  finding: |
    v2ecoli's baseline phenotype lines up with a GLUCOSE-LIMITED kinetic model,
    not the batch-aerobic MFA cores — and pinning v2ecoli's central-carbon FBA to
    the Millard ODE (the FBA-bridge) moves it PART of the way toward the kinetic
    cores' respiration without flipping it into acetate overflow.
      • Millard 2017 ODE — WITHIN_TOL (R^2 = 1.00): both v2ecoli and Millard run
        glucose-limited with NO acetate overflow. (Narrow: Millard exchanges only
        glucose + acetate.)
      • KETCHUP k-ecoli74 / k-ecoli307 — MISMATCH (R^2 = -0.89 / -0.72): directions
        agree (uptake −, CO2 secretion +) but per 100 glucose the cores respire
        far harder (O2 ≈ -135 vs v2ecoli -9; CO2 ≈ +145 vs +33) and secrete acetate
        (≈ +71, absent in v2ecoli → 'lost'). Per-metabolite axes confirm: O2 and
        CO2 mismatch, NH3 drift.
      • v2ecoli + Millard FBA-bridge (millard_fba_bridge_harness) — MISMATCH but
        the CLOSEST candidate (R^2 = +0.65, vs the cores' NEGATIVE R^2; 3 matched,
        1 appeared, 1 lost). The live whole-cell run (viable: dry_mass 380→385 fg
        over the window) respires ~3× the bare baseline (O2 ≈ -26 vs -9 per 100
        glucose) — toward, but still far below, the cores' -135 — while keeping the
        baseline's acetate-free, CO2-quiet signature. So the Millard pin nudges
        respiration up without inducing overflow.
      • KETCHUP FDH dynamic — shown as a NADH(t) data-vs-fit figure (real IPOPT
        time-series fit, optimal, SSE 0.011 over 9 conditions). Not an exchange
        model, so not graded on the scatter axis.
    The two KETCHUP models agree closely with each other (shared K-FIT lineage).
    Caveat flagged for review: v2ecoli's baseline O2:glucose is anomalously low
    (~0.09), which drives much of the magnitude divergence.
  report_cards:
  - docs/report_cards/ketchup_vs_baseline/index.html
  - docs/report_cards/ketchup_vs_baseline/fba-bridge.html
  - docs/report_cards/ketchup_vs_baseline/k-ecoli307.html
  - docs/report_cards/ketchup_vs_baseline/k-ecoli74.html
  - docs/report_cards/ketchup_vs_baseline/millard2017.html
  - docs/report_cards/ketchup_vs_baseline/fdh-dynamic.html
  # The same cards are mirrored to reports/figures/ketchup-exchange-comparison/
  # so the dashboard report generator auto-embeds them as iframe figures.

# Structured bibliography (resolved in references/papers.bib) so the report's
# References section renders the kinetic-model + estimator sources this study
# compares against, which were previously named only in the run-outcome prose:
# Millard 2017 (the central-carbon kinetic ODE) and K-FIT / Gopalakrishnan 2020
# (the IPOPT estimator that fits the KETCHUP k-ecoli74 / k-ecoli307 models).
bibliography:
  bib_keys:
  - millard2017
  - gopalakrishnan2020

assumptions:
- text: |
    The pinned population_phenotype_basal reference (20-seed baseline ensemble
    mean) is a faithful stand-in for the v2ecoli baseline exchange phenotype, so
    no new sim is run for the measured side.
  verified_in_v2ecoli: true
- text: |
    The KETCHUP boundary reactions (up_glc/out_co2/out_ac/up_o2/up_nh3/up_so4
    for k-ecoli74; gluc_up/EX_* for k-ecoli307) map 1:1 to the v2ecoli EcoCyc
    exchange compound IDs (GLC[p], CARBON-DIOXIDE[p], ACET[p],
    OXYGEN-MOLECULE[p], AMMONIUM[c], SULFATE[p]).
  verified_in_v2ecoli: true

conditions:
  # The runnable models in this investigation ARE the KETCHUP kinetic models
  # (from pbg-ketchup); the v2ecoli baseline is the pinned reference vector they
  # are graded against. Each composite below is a real, dashboard-runnable
  # KetchupEstimator / KetchupDynamicEstimator estimation that emits its fitted
  # fluxes / kinetic parameters.
  baseline:
    composite: pbg_ketchup.composites.estimation.ketchup_baseline
    params:
      model_name: k-ecoli74
      seed: 0
      solver_options: ''   # vendored IPOPT default (the old v2e-ketchup-compare worktree was removed)
  variants:
  - name: k-ecoli307
    composite: pbg_ketchup.composites.estimation.ketchup_baseline
    params:
      model_name: k-ecoli307
      seed: 0
      solver_options: ''   # vendored IPOPT default (the old v2e-ketchup-compare worktree was removed)
  - name: fdh-dynamic
    composite: pbg_ketchup.composites.dynamic.ketchup_dynamic
    params:
      model_name: FDH
      seed: 0
      solver_options: ''   # vendored IPOPT default (the old v2e-ketchup-compare worktree was removed)
  - name: v2ecoli-baseline
    composite: v2ecoli.composites.baseline.baseline
    params:
      cache_dir: out/cache
  - name: fba-bridge
    composite: v2ecoli.composites.millard_fba_bridge_harness.millard_fba_bridge_harness
    params:
      cache_dir: out/cache
      seed: 0
    # v2ecoli's REAL whole-cell tFBA with the Millard 2017 ODE wired in as a flux
    # source pinning the central-carbon FBA reactions. Run live for 60 ticks off
    # the ParCa cache; the exchange vector is the time-averaged
    # listeners.fba_results.external_exchange_fluxes (scripts/run_ketchup_models.py
    # bridge). This is "v2ecoli composed with Millard + FBA bridge".
  # Millard 2017 participates as a report-card REFERENCE (model_settings below),
  # not a runnable variant: its composite is a file-discovered YAML spec, and
  # that run path doesn't substitute ${model_source}, so it can't run as a
  # dashboard sim. Its central-carbon flux vector comes from the ODE directly
  # (scripts/ketchup_baseline_report_cards.py → millard_exchange.json).
  model_settings:
  - name: v2ecoli-baseline-reference
    gate: optional
    detail: "The MEASURED model: v2ecoli whole-cell baseline. Now also a runnable dashboard variant (v2ecoli-baseline, off a built ParCa cache at out/cache). The report-card MEASURED vector still uses the pinned population_phenotype_basal reference (20-seed ensemble mean) — a better estimate than a short fresh single-cell run."
  - name: ketchup-k-ecoli74-reference
    gate: optional
    detail: "KETCHUP k-ecoli74 (108-reaction core) reference source; fitted exchange fluxes from pbg-ketchup (github.com/vivarium-collective/pbg-ketchup)."
  - name: ketchup-k-ecoli307-reference
    gate: optional
    detail: "KETCHUP k-ecoli307 (305-reaction) reference source; fitted exchange fluxes from pbg-ketchup."
  - name: millard2017-reference
    gate: optional
    detail: "Millard 2017 central-carbon ODE (millard2017_metabolism, COPASI) — the flux source of millard_fba_bridge_harness. Covers glucose + acetate only (no O2/CO2/NH3/SO4 exchange)."
  - name: fba-bridge-reference
    gate: optional
    detail: "v2ecoli + Millard FBA-bridge (millard_fba_bridge_harness): the REAL whole-cell tFBA with the Millard 2017 ODE wired in as a flux source that pins the central-carbon FBA reactions (fba-flux-coupler). Now RUN LIVE off the ParCa cache (60 ticks, viable: dry_mass 380→385 fg); the exchange vector is the time-averaged listeners.fba_results.external_exchange_fluxes (scripts/run_ketchup_models.py bridge). Graded vs the v2ecoli baseline: R^2 = +0.65 — the closest candidate (the bare cores score NEGATIVE R^2)."
  - name: ketchup-fdh-dynamic-figure
    gate: optional
    detail: "KETCHUP FDH dynamic (KetchupDynamicEstimator): a real IPOPT time-series fit of cell-free formate-dehydrogenase NADH(t) across 9 conditions (optimal, SSE 0.011, 7 params). Shown as a data-vs-fit small-multiples figure (fdh-dynamic.html) — a dynamic kinetic fit has no central-carbon exchange vector, so it is not graded on the scatter axis."
  - name: glucose-normalized-multiaxis-cards
    gate: optional
    detail: "All models glucose-normalized to -100; graded by report_card.py with a whole-vector flux_scatter axis (identity-line R^2) PLUS per-metabolite rel_tol axes (O2/CO2/NH3, 30% tol)."

tests:
- name: v2ecoli-baseline-matches-ketchup-k-ecoli74-exchange
  classification: primary
  status: partial
  question: Does the v2ecoli baseline central-carbon exchange vector match KETCHUP k-ecoli74 (flux_scatter R^2)?
  measure:
    kind: flux_scatter
    reference: KETCHUP k-ecoli74
    detail: "Identity-line R^2 over the 6 shared glucose-normalized central-carbon exchange fluxes, plus appeared/disappeared, via report_card.py."
  cites: [gopalakrishnan2020]   # KETCHUP k-ecoli74 is fit by the K-FIT estimator
  pass_if:
    op: correlates
    r2_min: 0.8
- name: v2ecoli-baseline-matches-ketchup-k-ecoli307-exchange
  classification: primary
  status: partial
  question: Does the v2ecoli baseline central-carbon exchange vector match KETCHUP k-ecoli307 (flux_scatter R^2)?
  measure:
    kind: flux_scatter
    reference: KETCHUP k-ecoli307
    detail: "Whole-vector flux_scatter R^2 + per-metabolite rel_tol (O2/CO2/NH3) vs KETCHUP k-ecoli307, via report_card.py."
  cites: [gopalakrishnan2020]   # KETCHUP k-ecoli307 is fit by the K-FIT estimator
  pass_if:
    op: correlates
    r2_min: 0.8
- name: v2ecoli-baseline-matches-millard2017-exchange
  classification: primary
  status: passed
  question: Does the v2ecoli baseline central-carbon exchange vector match the Millard 2017 ODE (flux_scatter R^2)?
  measure:
    kind: flux_scatter
    reference: Millard 2017 ODE
    detail: "Whole-vector flux_scatter R^2 vs the Millard 2017 central-carbon ODE (glucose + acetate only), via report_card.py."
  cites: [millard2017]   # the Millard 2017 kinetic ODE this band is anchored to
  pass_if:
    op: correlates
    r2_min: 0.8
- name: v2ecoli-baseline-matches-fba-bridge-exchange
  classification: secondary
  status: partial
  question: How close is the v2ecoli + Millard FBA-bridge exchange vector to the bare v2ecoli baseline (flux_scatter R^2)?
  measure:
    kind: flux_scatter
    reference: v2ecoli + Millard FBA-bridge (millard_fba_bridge_harness, live run)
    detail: "Whole-vector flux_scatter R^2 + per-metabolite rel_tol vs the live FBA-bridge exchange vector (time-averaged external_exchange_fluxes), via report_card.py."
  pass_if:
    op: correlates
    r2_min: 0.8

pipeline_gate:
  prerequisites: []
  enables: []
  gate_status: passed

runs:
- name: ketchup-k-ecoli74-estimation
  status: completed
  kind: simulation
  composite: pbg_ketchup.composites.estimation.ketchup_baseline
  description: "Real KETCHUP/IPOPT steady-state fit of k-ecoli74 (KetchupEstimator), run through the dashboard composite-runner; emits fitted exchange fluxes, SSE, status, parameter count. 986 params / 108 fluxes."
  dispatch: local
  emitter: sqlite
- name: ketchup-k-ecoli307-estimation
  status: completed
  kind: simulation
  composite: pbg_ketchup.composites.estimation.ketchup_baseline
  description: "Real KETCHUP/IPOPT fit of k-ecoli307 (2476 params / 305 fluxes), run through the dashboard composite-runner."
  dispatch: local
  emitter: sqlite
- name: ketchup-fdh-dynamic-estimation
  status: completed
  kind: simulation
  composite: pbg_ketchup.composites.dynamic.ketchup_dynamic
  description: "Real KETCHUP/IPOPT time-series fit of cell-free FDH (KetchupDynamicEstimator), run through the dashboard composite-runner; fits NADH(t) across 9 conditions."
  dispatch: local
  emitter: sqlite
- name: ketchup-exchange-comparison-grade
  status: completed
  kind: analysis
  canonical: true
  description: |
    Graded the v2ecoli baseline central-carbon exchange vector against four
    kinetic models with the PR #134 report-card flux_scatter criterion: the two
    KETCHUP cores (k-ecoli74 / k-ecoli307), the Millard 2017 ODE, and the live
    v2ecoli + Millard FBA-bridge run. KETCHUP fluxes from pbg-ketchup
    (KetchupEstimator, boundary reactions mapped to EcoCyc IDs, glucose-normalized);
    the FBA-bridge vector from a live millard_fba_bridge_harness run
    (scripts/run_ketchup_models.py bridge); v2ecoli side from the pinned
    population_phenotype_basal reference. Built by
    scripts/ketchup_baseline_report_cards.py; cards in
    docs/report_cards/ketchup_vs_baseline/ (mirrored to
    reports/figures/ketchup-exchange-comparison/ for report embedding).
  dispatch: local
  emitter: none
  result: PARTIAL
  outcomes:
    # keys MUST match tests[].name exactly (lowercase), or the report renders
    # the pill as 'pending' (walkthrough.js: outcomeByTest[t.name]).
    v2ecoli-baseline-matches-ketchup-k-ecoli74-exchange:
      result: PARTIAL
      detail: "Report card: MISMATCH (whole-vector R^2 = -0.89, 4 matched + 2 lost [acetate, SO4]; per-metabolite O2/CO2 mismatch). Directions agree but v2ecoli respires far less per glucose (O2 -9 vs -135, CO2 +33 vs +144) and secretes no acetate (KETCHUP +71). PARTIAL = directionally consistent, quantitatively divergent — expected whole-cell-FBA vs batch-MFA core divergence."
    v2ecoli-baseline-matches-ketchup-k-ecoli307-exchange:
      result: PARTIAL
      detail: "Report card: MISMATCH (whole-vector R^2 = -0.72; same pattern as k-ecoli74, the two KETCHUP models agree closely). NH3 closer here (v2ecoli -136 vs -81). Directions consistent, magnitudes + acetate overflow diverge."
    v2ecoli-baseline-matches-millard2017-exchange:
      result: PASS
      detail: "Report card: WITHIN_TOL (R^2 = 1.00 over the 1 active shared exchange). v2ecoli's baseline AGREES with the Millard 2017 ODE: both glucose-limited with NO acetate overflow. Millard exchanges only glucose + acetate (no O2/CO2/NH3/SO4), so the match is narrow but directionally and qualitatively clean — v2ecoli's phenotype lines up with a glucose-limited kinetic model, not the batch-aerobic KETCHUP cores."
    v2ecoli-baseline-matches-fba-bridge-exchange:
      result: PARTIAL
      detail: "Report card: MISMATCH but the CLOSEST candidate (whole-vector R^2 = +0.65 — POSITIVE, vs the bare cores' negative R^2; 3 matched, 1 appeared, 1 lost). Pinning v2ecoli's central-carbon FBA to the Millard ODE deepens respiration ~3× (O2 ≈ -26 vs baseline -9 per 100 glucose, toward but well below the cores' -135) while keeping the baseline's acetate-free, CO2-quiet exchange signature. Live whole-cell run, viable (dry_mass 380→385 fg over 60 ticks)."
- name: ketchup-fba-bridge-run
  status: completed
  kind: simulation
  composite: v2ecoli.composites.millard_fba_bridge_harness.millard_fba_bridge_harness
  description: "Live v2ecoli + Millard FBA-bridge run: the real whole-cell tFBA (~55 procs) with the Millard 2017 ODE wired in as a flux source pinning the central-carbon FBA reactions. 60 1-second ticks off the ParCa cache (out/cache), viable (dry_mass 380→385 fg). Exchange phenotype = time-averaged listeners.fba_results.external_exchange_fluxes (post 10-tick burn-in). Run via scripts/run_ketchup_models.py bridge."
  dispatch: local
  emitter: none
