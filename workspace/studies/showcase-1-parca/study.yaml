  status: completed
  kind: parca
  canonical: true
  description: |
    Full ParCa rebuild from the 133 ecoli-sources flat files on the Mac mini
    (2026-06-09). Command:
      .venv/bin/python scripts/parca_run.py --mode full --cpus 8 \
        -o out/sim_data-showcase --cache-dir out/sim_data-showcase/kmcache
    then gzip parca_state.pkl (634 MB → 41 MB .gz) and
      .venv/bin/python scripts/build_cache.py \
        --fixture out/sim_data-showcase/parca_state.pkl.gz \
        --cache out/cache-showcase
    Completed in 142.4 s (step_4=47.1 s, step_5=55.8 s). 51 TF conditions
    fitted. Cache bundle out/cache-showcase has its OWN dir (not the dnaa cache;
    out-symlink hazard). Bundle: initial_state.json 10.39 MB, sim_data_cache.dill
    164.92 MB, metadata.json 210 B, cache_version.json 1.1 KB
    (inputs_hash 36f7930256f9bc44…). sim_data: 4538 genes / 3277 TUs / 4309
    monomers / 1118 complexes / 9460 metabolic reactions; initial_state 16321
    bulk species + 11 unique molecule types. Smoke: build_composite("baseline",
    cache_dir="out/cache-showcase").run(5) ran with no equilibrium-solver crash.
  cache_dir: out/cache-showcase
  result: PASS
  outcomes:
    PARCA-BUILDS-FULL-51-CONDITIONS:
      result: PASS
      detail: 51 TF conditions fitted (--mode full, 142.4 s on the mini); 51 = full vs 7 = fast/debug.
    CACHE-BUNDLE-COMPLETE:
      result: PASS
      detail: All four artifacts present in out/cache-showcase — initial_state.json (10.39 MB), sim_data_cache.dill (164.92 MB), metadata.json (210 B), cache_version.json (1.1 KB).
    SIM_DATA-REPRODUCES-PARCA-COMPARISON:
      result: PARTIAL
      detail: |
        Verified at structural-inventory + simulation-readiness level (4538 genes /
        3277 TUs / 4309 monomers / 1118 complexes / 9460 metabolic reactions;
        5-step baseline smoke run, no equilibrium-solver crash). The full cross-tool
