- name: doubling time over the lineage
  address: image:charts/doubling_time_line.png
  config:
    title: "Doubling time over the lineage (cap-immune instantaneous trace, ~52 min, STABLE — not declining)"
  chart: line
  source_run: showcase2-baseline-ensemble
  render: "doubling_time_line (multivariant) over the clean sweep. Top panel = cap-immune instantaneous doubling time t2 = ln(2)/mu from listeners.mass.instantaneous_growth_rate over the whole lineage (218 per-timestep samples, not 3 generational points): STABLE at ~44–52 min (mean ~52 min, matching the runnable doubling-time-in-band test), no decline. The earlier per-generation line appeared to 'go down' only because the FINAL generation is truncated at the 6500-step emit cap before it divides, so its raw span read short (~10–19 min) — an artifact, not a biological trend. Bottom panel = per-generation division-time markers with that truncated final generation excluded (gen-1/gen-2 in-band, 43–52 min)."
- name: doubling time distribution
  address: image:charts/doubling_time_hist.png
  config:
    title: "Distribution of doubling times across the ensemble (cap-immune instantaneous t2, n=218 timesteps, mean 52.4 min)"
  chart: histogram
  source_run: showcase2-baseline-ensemble
  render: "doubling_time_hist (multivariant) over the clean sweep — histogram of the cap-immune instantaneous doubling time t2 = ln(2)/mu over all emitted timesteps (many samples). Tight distribution centred near ~52 min within the physiological band; immune to the final-generation step-cap truncation that biased the old per-cell-span histogram toward a spurious low-end bin."
# --- Replication & cell cycle ---
- name: chromosome replication
  address: image:charts/replication.png
  config:
    title: Chromosome replication across the seed-0 3-generation lineage (oriC 2→4→2, twice)
  chart: line
  source_run: showcase2-baseline-ensemble
  render: replication (multigeneration over seed 0) over the clean sweep — 3-gen dry-mass sawtooth, oriC/fork cycling per division
- name: chromosome-state snapshots
  address: image:charts/chromosome_snapshots.png
  config:
    title: Chromosome state at three points across the seed-0 lineage — oriC, replisomes, replication bubbles, and RNAPs on the circular chromosome
    caption: >-
      Three timepoints from the seed-0 lineage rendered on the circular
      chromosome, ordered left-to-right in ascending time. Each rim is anchored
      by oriC (green dot, top) and Ter (red square, bottom). RNAPs (blue dots)
      sit at their transcription coordinates; replisomes (gold triangles) mark
      the active replication forks; replication bubbles (green arcs) trace the
      newly-synthesized daughter strand from oriC out to each fork. RNAPs that are transcribing a newly-replicated daughter strand are drawn ON the bubble arc (resolved by the per-RNAP chromosome domain against the emitted parent->child domain tree); RNAPs on the parent strand stay on the rim. Panel (i) —
      t~2 min, mid-replication: a single chromosome with one replication
      bubble, two replisomes roughly halfway from oriC to Ter. Panel (ii) —
      t~23 min, post-replication: two segregated chromosomes, no active forks
      (RNAPs + oriC only). Panel (iii) — t~88 min, multifork re-initiation:
      both daughter chromosomes have re-initiated (4 replisomes, nested bubbles
      near oriC), the overlapping-rounds regime of fast growth. This
      complements the time-series replication panel by showing the spatial
      layout of the replication machinery on the chromosome itself.
  chart: image
  source_run: showcase2-baseline-chromo
  render: scripts/render_chromosome_snapshots.py over .pbg/runs/showcase2-baseline-chromo (seed-0 3-gen lineage emitted with V2ECOLI_EMIT_UNIQUE=1) — reuses _plot_chromosome_map; daughter-strand RNAPs are placed ON the replication bubbles using the per-row chromosome_domain__child_domains tree (now emitted as a flattened list<int> column under V2ECOLI_EMIT_UNIQUE), aligned to chromosome_domain__domain_index
