- dnag-promoter-availability__promoter-trajectory
findings:
- summary: Promoter availability does not explain dnaG's collapse. H1 refuted on every axis that tests
    it.
  status: contradicts
  evidence:
    from_test: promoter-loss-explains-the-collapse
    observed: 0.0633
    units: fraction of the collapse in log space
    divergence_factor: 0.90552239
  explanation: 'Three independent refutations agree. dnaG has zero promoters on 0.0000 of ~120,000 timesteps
    across 6 seeds, so transcript_initiation''s p_i <- 0 branch is never reached. The promoter loss that
    does occur accounts for 6.3% of the collapse in log space against a required 67% -- promoters fall
    ~2.04x while synthesis falls ~1e+05x. And the discriminating control fires: the peers lose promoters
    identically (2.09-2.23 -> 1.000) while their transcription RISES, so promoter count cannot be what
    distinguishes dnaG at all.'
  expected:
    range:
    - 0.67
    - 1.5
  provenance:
    run_ids:
    - dnag-promoter-availability__promoter-trajectory
- summary: The promoter loss that does occur is generic gene dosage, not a dnaG defect.
  status: novel
  evidence:
    from_test: peers-keep-their-promoters
    observed: 0.4597
    units: peer gen-last/gen-1 ratio
    divergence_factor: 0.3138806
  explanation: Every TU goes 2 -> 1 as the lineage stalls, which is exactly get_average_copy_number's
    2**(((1 - relative_pos) * C + D) / tau) collapsing toward 1 as tau stretches to 200 min. It is the
    whole chromosome losing multi-fork replication, and it happens to dnaG and its unaffected class-mates
    alike. Worth recording because it is a real, first-measured effect that is nonetheless a red herring
    for this question.
  expected:
    range:
    - 0.67
    - 1.5
  provenance:
    run_ids:
    - dnag-promoter-availability__promoter-trajectory
- summary: dnaG is not promoter-poor despite the TU dedup. Whatever the dedup costs it, it is not promoter
    copies.
  status: novel
  evidence:
    from_test: dnag-promoter-count-at-generation-1
    observed: 2.0388
    units: promoter records
  explanation: 'The first promoter counts ever measured in this model: dnaG holds 2.04 at generation 1
    against a peer median of 2.17 -- statistically indistinguishable. TU00352[c] is the transcript whose
    three native promoters (rpsUp1/2/3) the dedup collapses into a single TU record, and it was reasonable
    to expect that to show up as fewer promoter copies. It does not. That closes a standing suspicion
    about the dedup''s quantitative cost at this point in the pipeline.'
  expected: {}
  provenance:
    run_ids:
    - dnag-promoter-availability__promoter-trajectory
- summary: 'OBSERVATION, not a graded axis: the stall clock is insensitive to when dnaG collapses.'
  status: novel
  evidence:
    from_run: dnag-promoter-availability__promoter-trajectory
  explanation: 'Across 6 seeds the stall generation is nearly invariant (4, 5, 4, 4, 4, 4) while the collapse
    generation ranges widely (3, 5, 4, 2, 4, 2). Seeds 3 and 5 collapse at generation 2 and still stall
    at generation 4, the same generation as seeds that collapse two or three generations later. If dnaG''s
    collapse drove the stall, an earlier collapse should bring the stall forward; it does not. The precedence
    tally splits exactly 3 precedes / 3 coincides.

    So neither ''collapse causes stall'' nor ''stall causes collapse'' is supported -- they look like
    two consequences of the same deterioration on different clocks. Recorded as an observation because
    ''collapse generation'' uses a post-hoc 1e-9 threshold of the agent''s choosing and no pre-registered
    axis tests it. It deserves its own study before it is relied upon.'
biological_summary: 'If a gene is not being transcribed, an obvious explanation is that RNA polymerase
  has nowhere to land: the promoters are gone. This study tested that for dnaG, whose transcription collapses
  a hundred-thousand-fold over four generations, and the answer is a clean no. dnaG has at least one promoter
  at every single moment of every simulated cell cycle -- across six independent lineages and roughly
  120,000 sampled timesteps, not one instance of a promoterless dnaG.


  Promoter copies do fall, from about two to exactly one, but that happens to every gene on the chromosome.
  It is the ordinary consequence of a cell that has stopped growing fast: rapidly dividing bacteria carry
  several copies of genes near the replication origin because new rounds of replication begin before earlier
  ones finish, and as the doubling time stretches toward three hours that multiplicity decays to one.
  The forty-one ribosomal-protein transcripts dnaG shares an allocation class with lose promoters at exactly
  the same rate, and their transcription goes UP.


  So the polymerase has somewhere to land, the cell is assigning dnaG a healthy and even rising probability,
  and dnaG is still not transcribed. The failure is in neither the instruction nor the landing site but
  in what happens between them. One long-standing suspicion can also be retired: dnaG''s operon is one
  whose three natural promoters this model merges into a single record, and it was reasonable to think
  that left it short-changed. Measured for the first time, it is not -- dnaG carries as many promoter
  copies as its healthy neighbours.'
conclusion_verdicts:
- claim: dnaG loses its promoters (H1)
  verdict: refuted
  basis: zero-promoter fraction 0.0000 across 6 seeds; promoter count explains 6.3% of the collapse.
- claim: Promoter loss is class-level, not dnaG-specific (H3)
  verdict: supported
  basis: Peers fall 2.09-2.23 -> 1.000 identically, ratio 0.460, while their transcription rises.
- claim: The collapse is in the per-promoter probability (H2)
  verdict: supported
  basis: By elimination, plus dnaG's assigned ppGpp basal rising 14% (dnag-generational-decay).
- claim: The TU dedup leaves dnaG promoter-poor
  verdict: refuted
  basis: 2.04 promoters against a peer median of 2.17 at generation 1.
discovery_implications:
- 'The defect is now cornered: not the ParCa fit, not ppGpp, not the class rescaling, not promoter availability.
  What remains is the delta_prob/bound_TF term of promoter_init_probs and the normalisation after it --
  and the repaired deriver makes that term observable for the first time.'
- Gene dosage collapses 2 -> 1 for EVERY TU as the lineage stalls. Any future study reading a per-TU quantity
  across generations must normalise for this or it will attribute a chromosome-wide effect to its gene
  of interest.
- The TU dedup does not cost dnaG promoter copies. Its cost, if any, is elsewhere in the pipeline.
- The stall clock does not move when dnaG collapses earlier, so the intuitive 'dnaG collapse starves the
  forks and stalls the cell' story is not supported by the timing and needs its own study.
