simulation_set:
- name: dnaa1-mechA-vtuning
  kind: single-daughters-multigen-lineage
  status: ran
  base_model: v2ecoli.composites.baseline (cache out/cache_dnaa1_mechA_1.7e-3, V OVERRIDDEN per run via --perturbation; resume from dnaa-0 gen-3 init)
  duration_steps: 7200 s/gen cap × 7 gens
  seeds: [0, 1, 2, 3]
  sweep: "TU00259[c] per-promoter init_prob ∈ {0.8e-3 (CANONICAL), 0.9e-3, 1.0e-3, 1.1e-3, 1.2e-3, 1.3e-3, 1.7e-3} — 2026-06-08 7-point full-history choose-the-V sweep (seed 1) via recorded --perturbation override (see charts/dnaa1_v_sweep), PLUS a 4-seed multiseed at V=1.2e-3 (seeds 0/1/2/3, see charts/dnaa1_v12_multiseed)"
  metrics: [DnaA monomer total (trough/mean/peak), dnaA mRNA init rate, oriC count]
  pass_fail_tests:
  - dnaa-monomer-count-in-band-300-800-across-generations
  - dnaa-mrna-init-rate-near-biological-rate

conclusion_logic:
  if_primary_tests_pass: |
    Mechanism A (runtime overwrite of dnaA's per-promoter init_prob) lands the
    dnaA mRNA initiation rate near the biological ≈1 event/min and holds the
    DnaA monomer pool cycle-mean in band [300,800] with a clean oriC cycle, so
    the succinate DnaA-expression foundation is established and downstream
    mechanism / box-binding / extrinsic studies can be designed on top.
    REALIZED 2026-06-08 (V swept down per Rashmi): PASS on the DnaA-pool band
    test at V=0.8e-3 — the cycle-mean plateaus in [300,800] for steady gens 4-7
    (337/338/360/415, peaks <800) with oriC clean 1↔2 every gen. This satisfies
    Rashmi's primary ask (the DnaA pool oscillating in band). The init-rate
    layer is NOT simultaneously satisfied at the chosen V: at V=0.8e-3 the rate
    is 0.46–0.71/min (below ~1/min); the rate hits target only at V≈1.0e-3,
    where the pool ramps out of band by gen 7. So the foundation is established
    for the band-stable pool, with the rate tradeoff documented for re-review.
  if_primary_tests_fail: |
    Sweep the per-promoter init_prob in [1e-3, 5e-3] to land the rate near
    target; if the pool cannot be held in band with a clean cell cycle,
    document the structural difference from the PDF setup (cache, initial
    condition, or regulation) rather than forcing the value.

