schema_version: 4
name: colonies-01-hpc-readiness
investigation: colonies
title: HPC scaling readiness for the colony composite
description: "Build phase fixed daughter-process hydration so structural _add instantiates\n\
  daughter EcoliWCMs through the engine. Decide-phase N-sweep (N \u2208 {1,2,4,8})\
  \ on\none machine measured per-tick wall, per-cell cost, peak RSS, and pymunk step,\n\
  extrapolated to a cells-per-HPC-node budget, and identified the GIL as the\ndominant\
  \ bottleneck. Output (2026-07-26 remote re-run @ f69f9690): ~1024\ncells/node on\
  \ 64-core/256GB \u2014 2.7\xD7 the original 384, driven by per-cell RSS\ndropping\
  \ ~450\u2192154 MB. All primary behavior tests still PASS.\n"
topic: scaling
tags:
- colony
- multi-cell
- hpc
- perf
- scaling
- requires-pymunk
- requires-viva-munk
created: '2026-05-16'
last_run: 2026-07-26T01:27Z
status: ran
phase: Decide
design_status: approved
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
visualizations:
- name: colony-animation
  address: gif:colony.gif
  description: 'Animated GIF of a pure-WC N=2 colony, force-divided after warmup

    into 4 daughters. Each capsule = one cell; colour encodes lineage

    (daughters are hue-shifted variants of the mother). Regenerate via

    `python studies/colonies-01-hpc-readiness/sims/make_gif.py`.

    '
- name: perf-tick-wall-vs-n
  address: dashboard:study_charts
  description: "Per-tick wall time vs N (steady-state). Linear scaling = HPC-ready;\n\
    any super-linear bend would mean GIL contention or O(N\xB2) physics.\n"
- name: perf-per-cell-vs-n
  address: dashboard:study_charts
  description: "Per-cell wall time vs N. The per-cell-cost-within-2x-reference test\n\
    passes when this stays flat (\u2264 2\xD7 the N=1 value).\n"
- name: perf-rss-vs-n
  address: dashboard:study_charts
  description: 'Peak RSS vs N. Slope sets the per-node cell ceiling on HPC.

    '
- name: perf-tick-trace-largest
  address: dashboard:study_charts
  description: "Per-tick wall trace for the largest-N run \u2014 exposes warmup,\n\
    division spikes, and steady-state variance.\n"
baseline:
- name: colony-pure-wc
  composite: v2ecoli.composites.ecoli_colony.ecoli_colony
  params:
    seed: 0
    cache_dir: out/cache
    n_cells: 2
    env_size: 30
    physics_interval: 1.0
    ecoli_interval: 1.0
purpose:
  question: "Is the pure whole-cell colony composite ready to scale on HPC? Can N\n\
    parallel EcoliWCMs grow and divide cleanly for \u22652 generations inside one\n\
    composite, and how does wall-time / RAM / per-tick cost scale with N on one\n\
    machine \u2014 well enough to project a cells-per-HPC-node budget?\n"
  mechanism: "The `colony` composite generator (v2ecoli/composites/colony.py) wires\
    \ N\ncopies of EcoliWCM (v2ecoli/bridge.py) into a pymunk 2D physics environment.\n\
    Each EcoliWCM holds an internal Composite of the 55-process baseline. At cell\n\
    division the bridge returns a structural update (_remove mother, _add two\ndaughter\
    \ EcoliWCMs) that the outer composite engine must hydrate. We sweep\nN \u2208\
    \ {1,2,4,8} and instrument per-tick costs.\n"
  expected_outcome: "After the Build fix, a pure-WC N=2 colony runs past first division\
    \ to 4\nticking cells without the manual-hydration workaround in\nreports/colony_report.py.\
    \ In the N-sweep, per-cell wall stays within ~2\xD7 of\nthe N=1 cost (no super-linear\
    \ blow-up from coupling/contention), peak RSS\nscales close to linear, and we\
    \ can name the dominant bottleneck (GIL, pymunk\nserial step, or RAM-per-cell).\n"
pipeline_gate:
  prerequisites: []
  enables:
  - colonies-02-hpc-deployment
  proceed_condition: "Build-phase acceptance test passes (N=2 pure-WC \u2192 4 daughters,\n\
    no manual hydration) AND the N-sweep completes for at least\nN \u2208 {1,2,4}.\
    \ N=8 is best-effort on a laptop and may be deferred\nto the HPC follow-up.\n"
  blocks_until_resolved: "If daughter EcoliWCMs cannot be hydrated through the composite\n\
    engine's structural _add path, the colonies-02 HPC deployment\nstudy should NOT\
    \ start \u2014 there is no point sizing nodes for a\ncomposite that loses cells\
    \ at every division. Resolution choices:\n(a) fix the bridge's structural-update\
    \ emission so the engine\nhydrates daughters natively, (b) fix the engine's _add\
    \ handling\nfor process nodes, or (c) accept the manual-driving pattern\nand re-design\
    \ the HPC plan around per-cell processes outside\nthe composite.\n"
simulation_set:
- name: build-smoke-n2
  base_model: v2ecoli.composites.ecoli_colony.ecoli_colony
  perturbation: null
  condition: pure-WC, 2 cells, env_size=30
  duration_min: 90
  seeds:
  - 0
  readouts:
  - colony_cell_count
  - per_cell_dry_mass
  - division_events
  - wall_seconds
  applies_tests:
  - daughters-hydrated
  - two-generations-complete
  status: ready
- name: nsweep-n1
  base_model: v2ecoli.composites.ecoli_colony.ecoli_colony
  perturbation:
    n_cells: 1
  condition: pure-WC, single cell, baseline reference
  duration_min: 90
  seeds:
  - 0
  readouts:
  - wall_seconds
  - peak_rss_mb
  - per_tick_latency_ms
  - per_cell_update_ms
  - pymunk_step_ms
  applies_tests:
  - reference-perf-recorded
  status: gated
  blocked_by_requirements:
  - req-1-perf-harness
- name: nsweep-n2
