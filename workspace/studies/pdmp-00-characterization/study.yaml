- name: fix-per-process-rng-seeding
  kind: single
  status: blocks-ensemble
  base_model: v2ecoli.composites.diagnostic.diagnostic
  duration_steps: (infrastructure fix, no simulation steps)
  details: "Discovered 2026-05-24 via 3-seed pilot ensemble: v2ecoli baseline's `seed`\
    \ parameter only seeds `allocator_rng` (baseline.py:408). All other 55 stochastic\
    \ processes (transcription, translation, division-threshold, protein-degradation,\
    \ equilibrium, two-component-system, complexation, RNA-maturation, transcript-initiation,\
    \ polypeptide-initiation, chromosome-replication, tf-binding, tf-unbinding, chromosome-structure)\
    \ seed from the cached sim_data, shared across runs. Net: 3 seeds produced bit-identical\
    \ trajectories (CV across seeds: 0.000% on every observable). Fix: each stochastic\
    \ process seeds its RNG from hash(master_seed, process_name). Until fixed, Phase\
    \ 0's N\u226564 ensemble target is moot. See reports/figures/pdmp-00/v2ecoli_ensemble_3seeds.html\
    \ for the diagnostic."
  metrics:
  - reference-zarr-stores
  - interface-schemas
  - per-step-compute-profile
  - variable-categorisation-map
  pass_fail_tests:
  - variables-categorized
  - interface-schemas-typed
  - reference-xarray-3-conditions
