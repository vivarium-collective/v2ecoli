discovery_implications:
  resolved_uncertainties:
    - Continuous-time per-promoter / per-protein Poisson tau-leap samplers were implemented and land in `poisson` mode. The "150 fg" figure is max |Delta cell_mass| = 150 fg between configs, a transient on a single trajectory pair, computed in scripts/trajectory_divergence.py on the cell_mass quantity. It is not measured at the rnap_data listener (a narrative literal absent from the computing script), and it cuts against this study's own thesis that cell_mass is the wrong observable.
    - 'cell_mass is the wrong observable for jump-process variance: the consumption_matched homeostat (from Phase 1) washes per-tick variance out of cell_mass by construction. Three controller- tuning attempts (tau-EMA, open-loop, sparse injection) all failed to recover mass variance.'
  remaining_uncertainties:
    - "The original Phase-2 gate `pdmp-trajectory-distribution-match` (trajectory-distribution W2 match to the v2ecoli baseline on cell_mass across all Phase-0 conditions) FAILED: the Poisson cell_mass W2 grows monotonically 9.73 → 15.35 → 49.46. Per the closeout this is the wrong gate (cell_mass is the wrong observable), a legitimate negative/structural result, but the gate status is FAILED, not passed/accepted. A replacement count-level trajectory-distribution criterion has not yet been formally specified or passed."
    - The Anderson-Darling Exp(1) exponential-clock verification (>=1e4 inter-event intervals) and the OU first-passage division-trigger validation (KS < 0.02) remain unrun.
  alternate_hypotheses:
    - id: homeostat-is-the-variance-sink
      statement: It is the consumption_matched homeostat specifically (not jump sampling per se) that erases per-tick variance; loosening or disabling the homeostat would restore cell_mass as a usable variance observable.
      why_plausible: The homeostat actively tracks a reference growth trajectory, so any per-tick fluctuation it sees is corrected within a tick.
      mechanism_elements_affected:
        - consumption_matched-driver
        - cell_mass-observable
        - jump-variance-propagation
      discriminating_observables:
        - cell_mass CV with the homeostat on vs off under identical jump seeds
        - count-listener variance (rnap_data, ribosome_data) vs cell_mass variance
      evidence_for:
        - Open-loop (homeostat-off) was one of the three tuning attempts.
      evidence_against:
        - "Even open-loop, cell_mass did not become the right inference channel — pointing to counts, not mass, as the signal carrier."
  mechanism_update_proposals:
    - mechanism_node_or_edge: inference-observable (cell_mass -> count-level listeners)
      update_type: revise
      rationale: Anchor all downstream variance-based inference on count-level listeners (rnap_data, ribosome_data, monomer_counts) rather than cell_mass; the homeostat makes mass variance-blind. This redirected Phase 3.
      requires_expert_approval: true
  followup_study_proposals:
    - id: pdmp-02-count-trajectory-gate
      title: Count-level trajectory-distribution match as the Phase-2 acceptance gate
      study_type: criterion_redesign
      source_trigger: negative_finding
      proposed_experiment: Define and run a trajectory-distribution W2/KS criterion on count-level listeners (transcript/protein initiation counts) vs the v2ecoli baseline, replacing the cell_mass gate the closeout invalidated.
      expected_information_gain: high
      expert_gate_required: true
    - id: pdmp-02-exponential-clock-validation
      title: Anderson-Darling Exp(1) exponential-clock + OU first-passage division validation
      study_type: validation
      source_trigger: open_deliverable
      proposed_experiment: Verify the cumulative hazard integral of lambda is Exp(1)-distributed over >=1e4 inter-event intervals (A-D, alpha=0.05) and validate the first-passage division trigger against an OU analytical CDF (KS < 0.02).
      expected_information_gain: medium
      expert_gate_required: false
findings:
  - id: trajectory-match-gate-failed-cellmass-wrong-observable
    kind: computational
    status: contradicts
    statement: 'The Phase-2 trajectory-distribution-match gate FAILED on cell_mass: the Poisson tau-leap Wasserstein-2 grows monotonically rather than converging. The negative finding is that cell_mass is the wrong observable for jump-process variance, because the consumption_matched homeostat washes per-tick variance out by construction. This redirects Phase-3 inference onto count-level listeners.'
    evidence:
      from_run: phase2-progress (Poisson tau-leap vs baseline)
      observed: cell_mass Poisson W2 grows 9.73 -> 15.35 -> 49.46 (monotonic; gate not met)
    expected:
      range:
        - 0.0
        - 9.73
    provenance:
      run_ids:
        - phase2-progress
    next_action: Re-anchor the distribution-match test on count-level listeners (rnap_data / ribosome_data / monomer_counts).
    next_action_type: refine_representation
  - id: jump-variance-lives-at-count-level
    kind: computational
    status: confirms
    statement: 'Confirms the Phase-2 redirect: across 4 seeds at 250 steps, every aggregate observable (cell_mass, dry_mass, total monomer, ATP[c] count) washes out to ~0.028% cross-seed CV, while the direct jump-event count (cumulative transcription-initiation events, rnap_data.rna_init_event) shows 0.85% CV, ~30x higher. The jump-process stochasticity is real but lives at the per-event count level, not in the aggregate mass/pool observables the consumption_matched homeostat regulates. This is why Phase-3 inference must anchor on count-level listeners.'
    evidence:
      from_run: baseline N=4 x 250 steps tick-by-tick (scripts/phase2_count_variance.py)
      observed: 'CV: cell_mass 0.0285%, dry_mass 0.0288%, monomer 0.0273%, ATP 0.0283%, cumulative rna_init 0.846% (~30x)'
    provenance:
      run_ids:
        - phase2-count-variance-diagnostic
    next_action: Build the count-level distribution-match gate (rna_init / monomer counts) as the Phase-2/3 acceptance criterion.
    next_action_type: refine_representation
