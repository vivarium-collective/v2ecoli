schema_version: 4
name: metabolism_redux_no_oxygen
investigation: v2ecoli-vecoli-comparison
title: v2ecoli reproduces vEcoli with MetabolismRedux (no_oxygen)
condition: no_oxygen
question: Does v2ecoli reproduce vEcoli on no_oxygen when both engines swap FBA Metabolism for MetabolismRedux?
comparison:
  seeds: 6
  generations: 1
  max_steps_per_gen: 15000
  cards:
  - config
  - parca
  - standard
  - statistical
  - trajectory
  - distribution
  - metabolism
  - composition
from_vecoli_config: configs/metabolism_redux_no_oxygen.json
report_cards:
- viz/report_card/config.html
- viz/report_card/parca.html
- viz/report_card/standard.html
- viz/report_card/statistical.html
- viz/report_card/trajectory.html
- viz/report_card/distribution.html
- viz/report_card/metabolism.html
- viz/report_card/composition.html
pipeline_gate:
  enables: []
runs:
- composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  name: metabolism_redux_no_oxygen-comparison
  kind: analysis
  canonical: true
  description: v2e-compare study metabolism_redux_no_oxygen
status: build
tests:
- name: config-vs-vecoli
  kind: report_card
  card: config
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (config card)?
- name: parca-vs-vecoli
  kind: report_card
  card: parca
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (parca card)?
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (standard card)?
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/v2ecoli-vecoli-comparison/metabolism_redux_no_oxygen
    group: statistical
- name: trajectory-vs-vecoli
  kind: report_card
  card: trajectory
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (trajectory card)?
- name: distribution-vs-vecoli
  kind: report_card
  card: distribution
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (distribution card)?
- name: metabolism-vs-vecoli
  kind: report_card
  card: metabolism
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (metabolism card)?
- name: composition-vs-vecoli
  kind: report_card
  card: composition
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_no_oxygen (composition card)?
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      condition: no_oxygen
      swap: ecoli-metabolism-redux
depends_on:
- parca
confidence: Investigating
findings:
- id: metabolism_redux_no_oxygen-vs-vecoli-result
  kind: computational
  status: confirms
  statement: "Measured (6 seeds requested, 5 effective vEcoli, gen-1, matched timepoints): parca (t=0 initial-state match) within_tol. Statistical card (Welch t-test) overall verdict drift -- driven solely by growth-rate -- all four masses within_tol (largest growth-rate delta of the five conditions). Matched gen-1 median |delta|: cell 0.70%, dry 0.70%, protein 0.20%, rna 1.23%, growth 15.3%. No mismatch on any axis; active_RNAP/active_ribosome are ungraded (not in the local reader's observable set)."
  evidence:
    from_card: statistical
    observed: parca within_tol; cell/dry/protein/rna mass all within_tol (median |delta| 0.70%/0.70%/0.20%/1.23%); growth-rate median |delta| 15.3% (sole driver of the drift verdict).
inputs:
- artifact: sim_data
  from: parca

