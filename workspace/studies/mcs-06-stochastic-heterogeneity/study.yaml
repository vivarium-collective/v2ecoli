schema_version: 4
name: mcs-06-stochastic-heterogeneity
investigation: multiscale-complexity-showcase
title: "Follow-up (Arc 3) — restore single-cell heterogeneity"
created: '2026-09-03'
status: planned
confidence: Planned

cites:
  - {key: TaheriAraghi2015, claim: "interdivision-time CV ~10-30% and adder homeostasis in E. coli"}

question: >-
  Arc 3 (mcs-03) found v2ecoli is under-dispersed — interdivision-time CV ~7% vs the
  biological 10-30% — because many processes run at expected (mean) rather than stochastic
  rates. Which process is the dominant missing noise source (division D-period timing,
  replication-initiation timing, or low-copy expression), and does enabling stochasticity
  there raise the ensemble CV toward the biological band WITHOUT changing the mean
  generation time or breaking size homeostasis?

hypothesis: >-
  The interdivision-time CV is set mainly by deterministic division/initiation timing.
  Adding biologically-motivated noise to that timing (or enabling an existing stochastic
  mode) raises the CV into 0.10-0.30 while the MEAN generation time and mean mass are
  preserved (the fix adds variance, not bias).

objective: >-
  Audit which timing processes are deterministic; enable/introduce the smallest
  biologically-motivated stochastic term; re-run the seed ensemble and re-measure the
  interdivision-time CV (target 0.10-0.30) with mean generation time held out.

parent_studies:
  - {study: mcs-03-single-cell-heterogeneity, relation: leads-to, condition: tests-passed}
pipeline_gate:
  prerequisites:
    - {study: mcs-03-single-cell-heterogeneity, condition: tests-passed}

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants:
    - name: stochastic-timing-enabled
      detail: >-
        Enable/introduce stochasticity in the dominant timing process (chosen during the
        audit — division D-period or replication initiation). Smallest change that lifts CV.
  model_settings:
    - {name: seed-ensemble, detail: ">=8 seeds, multi-generation, before vs after"}

comparison: {seeds: 8, generations: 6}

inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir

readouts:
  - "interdivision-time CV across the ensemble (target 0.10-0.30)"
  - "mean generation time and mean mass (held-out — must be preserved)"

expected_behavior:
  - name: noise-source-localized
    observable: "per-process contribution to division-time variance"
    condition: baseline
    rationale: "Identify which deterministic timing process dominates the low CV."
  - name: cv-restored-to-band
    observable: division_time
    condition: "after enabling stochasticity"
    rationale: "CV should rise from ~0.07 into the biological 0.10-0.30 band."
  - name: mean-generation-time-preserved
    observable: division_time
    condition: "held-out: after fix"
    rationale: "Adding variance must not shift the mean generation time."

tests:
  - name: cv-restored-to-band
    classification: primary
    question: "Does enabling stochastic timing raise the ensemble CV into 0.10-0.30?"
    measure: {kind: derived, detail: "arc3_heterogeneity.py CV before vs after."}
  - name: mean-generation-time-preserved
    classification: primary
    kind: held_out
    question: "Is the mean generation time unchanged (variance added, not bias)?"
    measure: {kind: derived, detail: "mean division_time before vs after within tolerance."}

runs: []

preliminary_findings:
  - id: noise-source-is-bypassed-not-absent
    kind: static-analysis
    status: confirms
    statement: >-
      A code audit of the division machinery localizes the under-dispersion without a run:
      v2ecoli/steps/division.py DOES carry a stochastic term — the division mass multiplier
      mu_div ~ Normal(1.0, 0.1) (CRC32-seeded, ~10% CV) — but it feeds the LEGACY mass-threshold
      trigger, while the ACTIVE division trigger is deterministic: divide fires when
      global_time reaches (replication completion + a fixed D_period). So the ~10% noise the
      model already knows about is bypassed by the replication-timed trigger, and interdivision
      timing inherits only the (small) variance of replication completion. This is the exact
      lever the model-update needs: route mu_div-style variance into the active trigger, or make
      D_period stochastic (real E. coli D-period is variable), then re-run the ensemble and
      confirm CV rises into the 0.10-0.30 band with the mean generation time preserved.
    evidence:
      code_ref: "v2ecoli/steps/division.py:138 (mu_div ~ Normal(1.0,0.1)); :40,:44 (deterministic replication+D_period trigger)"
      parent_measured_cv: 0.070
      target_band: [0.10, 0.30]
    next_action: "Make D_period stochastic (or route mu_div into the active trigger); re-run the 6-seed ensemble; re-measure CV."
    next_action_type: escalate_model

findings: []

biological_summary: >-
  Arc 3 found the model too synchronized (CV ~7% vs 10–30%). A code audit localizes the missing
  noise: the division machinery HAS a stochastic term (μ_div ~ Normal(1.0, 0.1)) but it feeds the
  legacy mass trigger, while the active trigger is deterministic (replication completion + a fixed
  D-period). Routing noise into the active trigger (or making D-period stochastic) is the fix.

behavior_tests:
  - name: noise-source-localized
    classification: primary
    measure: "per-process contribution to division-time variance (code audit)"
    pass_if: "identify the dominant deterministic timing process"
    expected: "a bypassed or missing noise source"
    observed: "μ_div noise bypassed; active trigger = deterministic replication + fixed D-period"
    verdict: pass
  - name: cv-restored-to-band
    classification: primary
    measure: "ensemble CV after enabling stochastic timing"
    pass_if: "0.10–0.30"
    expected: "0.10–0.30"
    observed: "(not yet run — fix designed)"
    verdict: pending
  - name: mean-generation-time-preserved
    classification: primary
    measure: "mean interdivision time (HELD-OUT)"
    pass_if: "unchanged (variance added, not bias)"
    expected: "preserved"
    observed: "(not yet run)"
    verdict: pending

conclusion: >-
  ## Result
  Designed follow-up. The under-dispersion is localized to a bypassed division-noise term; the
  stochasticity fix + re-run remain to be executed.
