schema_version: 2
name: parameter-uq
title: "Parameter UQ — global sensitivity of v2ecoli"
created: '2026-06-12'
status: running

question: |
  Which sim_data parameters drive variance in v2ecoli single-cell observables?
  Starting with the ribosome-elongation subsystem, forward uncertainty
  quantification (PCRV-sampled PCE surrogate + analytic Sobol indices) identifies
  which elongation knobs most control mass/growth variance, setting a template for
  a systematic global-sensitivity sweep across the full parameter space. The same
  method then generalizes along two axes: from endogenous physiology to
  ENGINEERED DESIGN knobs (a heterologous GFP new-gene strain, param-uq-05), and
  from a single bulk statistic to a decomposition across AGGREGATION STRATEGIES
  (population / by-generation / by-seed) — turning the diagnostic sweep into a
  design tool and a methodological demonstration for the M8/08.4.2 UQ milestone.

hypothesis: |
  Among ribosome-elongation parameters, the energetic cost of elongation
  (gtpPerElongation) — not raw elongation speed — is the dominant lever on
  single-cell mass/growth, because GTP availability couples translation to the
  cell's energy budget. Forward UQ should surface a single dominant driver
  (total-order Sobol ≥ 0.5) rather than a diffuse, evenly-shared sensitivity.

executive:
  what_is_this: |
    Forward global-sensitivity UQ (pbg-uq) finding which sim_data parameters drive variance in the v2ecoli baseline. A low/high screen kept the 3 knobs that move growth rate; PCE forward UQ ran over 120- and 360-step windows; the deep physiological params were swept via a sim_data injection adapter (param-uq-04). The investigation now extends to a STRAIN-DESIGN use case (param-uq-05): a GFP new-gene insert swept via expression + translation-efficiency knobs, delivering the M8/08.4.2 milestone's required aggregation-strategy-1–3 (population / by-generation / by-seed) decomposition natively in v2ecoli — the deliverable that supersedes the standalone uqEcoli demo.
  verdict: |
    The ribosome's translation basal_elongation_rate dominates variance in
    instantaneous growth rate among the effective config-reachable elongation knobs.
    Total-order Sobol ≈ 0.97 (stable across 3 PCRV seeds, range 0.955–0.987), vs
    ppGpp-synthesis kS ≈ 0.04 and DNA-pol elongation rate ≈ 0.01, with a surrogate
    fit of ~1.7% test error. The original hypothesis (GTP cost dominates) is
    refuted: that 0.88 reading was a state-carryover artifact (fixed in v2ecoli
    PR #197), and gtpPerElongation / ribosomeElongationRate turned out to be inert.
  verdict_status: passed
  decisions_needed:
  - question: Accept the param-uq-05 strain-design SMOKE result, or gate on the production ensemble first?
    context: |
      The GFP-ParCa build + pbg-uq new-gene pipeline now run end-to-end (smoke:
      n=12, 3 seeds, 1 gen). Preliminary: exp & trl_eff co-dominant for product
      (refutes "exp dominates"), trl_eff dominates growth. But the product
      surrogate is under-resolved (51% test error), argmax is not seed-robust, and
      strategy-2 (by-generation) is missing. A converged production ensemble is
      running on the mini to resolve these before the milestone claim is firm.
  - question: Fix the by-generation (strategy 2) daughter-cache blocker in the UQ harness?
    context: |
      run_multigen_xarray reads out/cache/initial_state.json for daughters, but each
      variant sample builds a per-sample TEMP cache → division FileNotFoundError, so
      runs stay single-generation regardless of step budget. Strategy 2 (the
      induction-timing decomposition) needs the daughter-cache path threaded through
      — a harness fix, not more compute. Follow-up for full milestone coverage.
  decisions_resolved:
  - question: Expand to the DEEP sim_data physiological parameters (ParCa-level injection)?
    decision: YES — built and ran (param-uq-04-deep-params).
    resolution: |
      Built a sim_data injection adapter (pbg_v2ecoli.uq_sim_data_injection) that
      routes each deep param either POST_PARCA (it surfaces as a runtime config key →
      config_overrides, no rebuild) or REBUILD (it shapes initial_state → regenerate
      the bundle with save_sim_input). Two premises of the original block were wrong:
      the "rebuild" is a ~2 s bundle regeneration (no full ParCa refit, not ~2.5 min),
      and several deep params (RNAP elongation rate, FBA weights) are reachable with
      NO rebuild at all. Result: the dry-mass fraction (a deep param reachable only
      via the rebuild path) dominates mass variance (total-order Sobol ≈ 1.0) and
      co-dominates growth rate (≈0.5, shared with RNAP elongation rate); the FBA
      kinetic-objective weight is inert. The deep physiological surface is now cheaply
      sweepable; the open follow-up is to widen to the full uqEcoli deep-param set over
      multi-generation runs and re-calibrate bounds to v2ecoli's current ParCa state.

scientific_argument:
  main_claim: |
    Among effective config-reachable elongation knobs, basal_elongation_rate
    dominates instantaneous-growth-rate variance (Sobol ≈ 0.97).
  evidence_for:
  - "Total-order Sobol of basal_elongation_rate = 0.966 (range 0.955–0.987 across 3 PCRV seeds); dominant knob identical every seed (argmax [0,0,0])."
  - "First-order ≈ total (0.956 vs 0.966): the effect is direct, with little interaction."
  - "PCE surrogate test relative error 1.3–2.1% supports the variance attribution."
  - "Mechanistically expected: basal_elongation_rate sets ribosome speed → protein synthesis → growth rate."
  evidence_against:
  - "Scope (now partly addressed by param-uq-04): studies 00–02 varied only config-reachable top-level knobs. param-uq-04 added a sim_data injection adapter and tested 3 deep physiological params — finding the dry-mass fraction dominates MASS variance (Sobol ≈ 1.0) and co-dominates growth with the elongation rate. So the dominant lever depends on the observable and the parameter surface; a full deep-param sweep is still open."
  - "Observable is instantaneous growth rate over a 120-step window (~4% of a generation); mass observables don't respond at this window, and longer windows could shift weights."
  key_figures:
  - "charts/sobol_indices.png — Sobol bars (across-seed whiskers): basal_elongation_rate ≈ 0.97 dominant."
  - "charts/pce_response_curves.png — growth rate rises with basal_elongation_rate; flat vs kS and DNA-pol rate."
  caveats:
  - "This corrects an earlier artifact; the original demo's 'GTP-dominant 0.88' was a carryover bug (v2ecoli PR #197), and 2 of its 3 params were inert."
  - "The proven core (main_claim) is the elongation/deep-param DIAGNOSIS on the baseline. The strain-design generalization (param-uq-05: design knobs + aggregation strategies 1–3) is DESIGNED and wired but NOT yet run — it carries no result and does not back any claim here until the GFP-ParCa build + ensemble complete."

competing_frameworks:
- name: Local one-at-a-time (OAT) sensitivity
  relation: superseded-by
  note: |
    OAT perturbs one parameter around a nominal point and reads the local slope.
    It misses interactions and is nominal-point-dependent; this investigation uses
    variance-based global Sobol (total-order captures interactions) over a sampled
    prior instead. OAT is the implicit baseline most modelers reach for first.
- name: Morris elementary-effects screening
  relation: complementary
  note: |
    Morris is a cheap global SCREEN (which params matter at all) but gives only a
    rank, not a variance fraction. It is the right tool for param-uq-00's screen
    step; the PCE+Sobol here is the quantitative attribution that follows it.
- name: Monte Carlo / Saltelli Sobol estimation
  relation: alternative
  note: |
    Sobol indices can be estimated by brute-force Monte Carlo (Saltelli sampling)
    without a surrogate. This investigation instead fits an order-2 PCE and reads
    Sobol analytically from its coefficients — far fewer whole-cell sims for the
    same attribution, at the cost of assuming the surrogate fits (tracked via test
    error). For strain design (param-uq-05) this efficiency is what makes a
    3-strategy decomposition over multi-generation runs affordable.

at_a_glance:
- study: param-uq-00-screen
  role: "Screens 7 config-reachable knobs to the 3 that move growth rate (>2% response), excluding 4 inert ones, defining the effective UQ surface for studies 01–03."
- study: param-uq-01-elongation
  role: "Finds basal_elongation_rate dominates growth-rate variance (Sobol ≈ 0.97) among effective elongation knobs, after fixing the carryover bug (PR #197)."
- study: param-uq-02-observables
  role: "basal_elongation_rate dominance holds for mass observables (dry_mass/cell_mass Sobol ~0.86) over a 360-step window; the growth-rate ranking is window-dependent (kS overtakes basal by 360 steps)."
- study: param-uq-03-growth-stratified
  role: "PLANNED: tests whether parameter influence on growth/mass is uniform or stage-dependent across the cell cycle (10 θ bins, requires multi-gen runs + pbg-uq extension)."
- study: param-uq-04-deep-params
  role: "RAN: extends UQ to deep SimulationDataEcoli physiological params via a sim_data injection adapter. Finds the dry-mass fraction dominates mass variance (Sobol ≈ 1.0) and co-dominates growth (≈0.5, with RNAP elongation rate); FBA kinetic weight inert. Establishes a cheap (~2 s/sample) deep-param injection path — the pivot's ~2.5-min-ParCa premise was wrong."
- study: param-uq-05-strain-design
  role: "SMOKE result (production ensemble running): turns the pbg-uq machinery on a STRAIN-DESIGN use case — a GFP new-gene insert swept via expression + translation-efficiency knobs. Pipeline runs end-to-end on the GFP strain; preliminary reading (n=12, 3 seeds) — exp & trl_eff CO-DOMINANT for product level (refutes 'exp dominates'), trl_eff dominates growth cost; product surrogate under-resolved (51% err) and argmax not yet seed-robust; strategy-2 (by-generation) pending division. Delivers strategies 1 & 3; the parameter-uq deliverable absorbing the standalone uqEcoli demo."

biological_story: |
  Translation is one of the cell's largest energy sinks, so which elongation dial
  most shapes growth rate is a natural question. Forward uncertainty
  quantification — run after fixing a state-carryover bug that had faked the
  original signal and switching to instantaneous growth rate as the observable —
  finds that the ribosome's basal elongation rate dominates, about 97% of the
  growth-rate variance among these knobs, far above ppGpp synthesis or the
  DNA-polymerase rate. This follows from mechanism: basal_elongation_rate sets how
  fast ribosomes add amino acids, which sets the protein-synthesis flux that drives
  growth. The first result (GTP cost dominates) was an artifact; the finding held
  up only after independent samples, effective parameters, a responsive observable,
  and an adequate budget were in place.

  The investigation then widens the parameter surface. Going deeper than the
  config-reachable knobs, a sim_data injection adapter reaches the calibrated
  physiological parameters and finds the dry-mass fraction dominates MASS variance
  almost entirely, co-dominating growth with the RNAP elongation rate — so the
  dominant lever depends on both the observable and how deep into sim_data you
  reach. Two lessons carry forward: sensitivity is a property of an
  (observable, parameter-surface, time-window) triple, not of a parameter alone;
  and the pbg-uq machinery is cheap enough (~seconds per deep-param sample) to
  sweep that surface systematically.

  Finally the same method turns from diagnosis to design. A heterologous GFP gene
  is inserted and induced, and its two engineering dials — how strongly it is
  transcribed (expression) and how efficiently its message is translated
  (translation efficiency) — are swept to ask which one a strain engineer should
  turn to move product yield, and at what cost to growth. Because the gene is
  induced at a chosen generation, the answer is examined three ways from a single
  ensemble — averaged over the whole population, split by generation across the
  induction, and split by stochastic seed — so the aggregation choice becomes part
  of the finding rather than a hidden assumption. This is the strain-design study
  (param-uq-05). A first SMOKE ensemble (n=12, 3 seeds, 1 generation) already runs
  the pipeline end-to-end on the GFP strain and gives a preliminary reading:
  expression and translation efficiency are CO-DOMINANT for product level
  (refuting the pre-registered "expression dominates" guess), while translation
  efficiency dominates the small growth-rate cost. Two honesty flags temper it —
  the product-level surrogate is under-resolved at this budget (51% held-out
  error) and the dominant knob is not yet robust across seeds — and one strategy
  is still missing: by-generation needs cell division, which the short smoke
  window didn't reach. A converged production ensemble is running to resolve both.

