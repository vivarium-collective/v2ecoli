findings:
- id: oric-overbinds-free-dnaa-above-kd
  kind: computational
  status: novel
  statement: Solving the oriC box-binding equilibrium self-consistently (concentrations in nM via cell volume), free DnaA settles at ~150-200 nM, above the ~100 nM K_d of the oriC low-affinity boxes, so the modeled oriC stays highly occupied across the cycle. This reproduces Haochen's concern; the cause (DnaA abundance vs K_d vs an unmodeled sink such as datA) is left as an explicit open question rather than asserted.
  evidence:
    from_run: dnaa3_binding_analysis (self-consistent brentq solve over steady gens)
  provenance:
    run_ids:
    - dnaa3-seed1-8gen
    verified_by: scripts/render_dnaa3_binding_analysis.py
- id: two-step-oric-fill-307-boxes
  kind: computational
  status: novel
  statement: With 307 chromosomal DnaA boxes plus oriC and dnaAp, the model predicts a two-step oriC fill. The sequestration-capacity sweep (307/360/400/450 boxes) shows occupancy is sensitive to total box count; the default is held at 307 pending Haochen's input.
  evidence:
    from_run: dnaa3_box_variants (box-count sweep)
  provenance:
    run_ids:
    - dnaa3-seed1-8gen
    verified_by: scripts/render_dnaa3_binding_analysis.py
- id: oric-doubles-at-replication
  kind: computational
  status: confirms
  statement: oriC and its associated boxes double at replication initiation (11->22 low-affinity boxes), now reflected in the occupancy figure as Haochen requested.
  evidence:
    from_run: dnaa3_box_occupancy
  provenance:
    run_ids:
    - dnaa3-seed1-8gen
    verified_by: scripts/render_dnaa3_binding_analysis.py
