  condition: pure-WC, 2 cells
  duration_min: 90
  seeds:
  - 0
  readouts:
  - wall_seconds
  - peak_rss_mb
  - per_tick_latency_ms
  - per_cell_update_ms
  - pymunk_step_ms
  applies_tests:
  - per-cell-cost-within-2x-reference
  status: gated
  blocked_by_requirements:
  - req-1-perf-harness
  - req-2-daughter-hydration-fix
- name: nsweep-n4
  base_model: v2ecoli.composites.ecoli_colony.ecoli_colony
  perturbation:
    n_cells: 4
