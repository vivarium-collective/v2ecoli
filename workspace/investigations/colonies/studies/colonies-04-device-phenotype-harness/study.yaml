schema_version: 4
name: colonies-04-device-phenotype-harness
investigation: colonies
title: Device harness + simple-agent phenotype baseline
description: |
  Stand up the shared colony-phenotyping infrastructure — cell-tier factory,
  geometry builders (mother machine, daughter machine, free colony), and the
  tier-agnostic phenotype extractor — and validate the measurement pipeline
  with cheap simple agents before spending WCM compute. Produces the common
  phenotype panel: growth rate, size-at-division, added length, inter-division
  time.
topic: phenotype-quantification
tags: [colony, mother-machine, daughter-machine, phenotype, adder, requires-viva-munk]
created: '2026-07-25'

baseline:
- name: free-colony-simple
  composite: v2ecoli.composites.ecoli_colony.ecoli_colony
  params:
    seed: 0
    n_cells: 2
    env_size: 30
  note: |
    The free-colony geometry populated with simple viva-munk grow_divide
    agents. This study also exercises the mother-machine and daughter-machine
    geometries via v2ecoli.colony_bench (geometry builders that place any
    cell-model tier — simple / surrogate / wcm — into a device); those are not
    registered composite generators, but the phenotype panel (growth rate,
    size-at-division, added length, inter-division time) is extracted uniformly
    across all three geometries.

status: designed
phase: Build
design_status: approved
implementation_status: in_progress
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested

acceptance_criteria:
  - behavior: factory-yields-runnable-cell-per-tier
  - behavior: geometry-builders-run-with-simple-agents
  - behavior: extractor-recovers-known-division-stats
  - behavior: harness-produces-phenotype-panel

pipeline_gate:
  prerequisites:
  - colonies-03-wcm-rss-leak
  enables:
  - colonies-05-mother-machine
  - colonies-06-daughter-machine
  proceed_condition: |
    Part B builds on the Part A composite foundation and treats the colonies-03
    native RSS leak as a stated run-length BOUND, not a blocker; the WCM-tier
    studies (colonies-08/09) use short bounded windows.
