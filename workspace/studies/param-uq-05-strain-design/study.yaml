# Report authored at Evaluate over REAL emitted numbers from the smoke ensemble.
# Labelled SMOKE/preliminary; production ensemble running. No values are invented.
report:
  title: param-uq-05-strain-design — strain-design UQ across aggregation strategies 1–3 (SMOKE)
  verdict: partial — pipeline validated + decomposition demonstrated (smoke); quantitative product-level ranking pending production
  confidence: Low (smoke/preliminary)
  evidence_quality: "REAL smoke: GFP fitSimData_1 build (gate passed) + pbg-uq order-2 PCE ensemble (n=12 train + 3 test, 3 seeds, 1 generation, 700 steps). GFP surrogate under-resolved (51% held-out test error); growth surrogate 10% test error. Production ensemble (n=24+4, 3 seeds, up to 3 gens, 4000 steps) running."
  objective: |
    Rank the two GFP new-gene strain-design knobs (expression, translation
    efficiency) by Sobol contribution to product level and growth rate, and
    demonstrate the milestone-required decomposition across aggregation
    strategies 1–3.
  setup: |
    ### Parameter Specifications (swept knobs)

    Both knobs come from the PUBLIC `new_gene_internal_shift` variant
    (present in v2ecoli's ecoli build), applied to a GFP-new-gene sim_data.

    | Parameter | Variant path | Nominal | Planned range | Description |
    |---|---|---|---|---|
    | `exp` | `new_gene_internal_shift.exp_trl_eff.exp` | 1.0 | **1e3–1e4 (screened)** | Factor scaling induced new-gene expression (transcription-level). |
    | `trl_eff` | `new_gene_internal_shift.exp_trl_eff.trl_eff` | 1.0 | 0.5–2.0 | Factor scaling induced new-gene translation efficiency. |
    | `inert_decoy` | (drawn, never applied) | — | 0–1 | Adversarial null knob: sampled and fed to the PCE but never applied to sim_data; must return ~0 Sobol. |

    The placeholder `exp` range [0.5,5.0] produced ~0 GFP (the new-gene synth-prob
    baseline is ~1.7e-9 — genes are near-knocked-out by default). A screen
    (exp ∈ {1,10,100,1000,10000}) gave GFP counts 0 / 1 / 3 / 30 / 409 over 1000
    steps, so the PRODUCTIVE range [1e3, 1e4] is used (study anticipated this screen).

    ### Tracked observables

    | Observable | Path | Why |
    |---|---|---|
    | new-gene product level | new-gene monomer count (GFP) | The engineering output the strain-design ranking is about. |
    | `instantaneous_growth_rate` | `listeners.mass.instantaneous_growth_rate` | Growth-rate load of expressing the product. |

    ### Methodology (as run — smoke)

    | Field | Value |
    |---|---|
    | Tool | pbg-uq · `sims/run_strain_design_uq.py` (adapted from pbg-uq/examples/v2ecoli_demo.py) |
    | Composite | `v2ecoli.composites.ecoli_baseline` built per-sample from a GFP `new_genes: gfp` sim_data with `modify_new_gene_exp_trl` applied |
    | Induction | immediate (generation 0): v2ecoli bakes sim_data into the cache bundle, so the vEcoli generational `internal_shift_dict` is not honoured — the (exp, trl_eff) factors are applied directly. Knob semantics identical; only induction timing differs. |
    | Sampling | PCRV (uniform prior) over (exp, trl_eff) + inert decoy; `pbg_uq.sampling.draw_samples` |
    | Surrogate | order-2 Polynomial Chaos Expansion, analytic Sobol; `pbg_uq.uqpc.fit_pce_and_sobol` (fit per output) |
    | Aggregation | strategy 1 (population), strategy 3 (by-seed) real; strategy 2 (by-generation) single-generation only in smoke |
    | Budget (smoke) | 12 train + 3 test PCRV samples × 3 seeds × 1 generation × 700 steps |
    | Compute | mini (GFP fitSimData_1 build + ensemble) |
  result: |
    REAL — smoke ensemble (n=12 train + 3 test, 3 seeds, 1 generation, 700 steps;
    exp ∈ [1e3,1e4], trl_eff ∈ [0.5,2.0], + inert decoy). Total-order Sobol
    indices (first-order in parentheses):

    **Strategy 1 — population (bulk average over seeds+time):**

    | Observable | exp | trl_eff | inert decoy | PCE held-out test error |
    |---|---|---|---|---|
    | GFP product level | **0.492** (0.481) | **0.457** (0.396) | 0.112 (0.062) | **51%** |
    | instantaneous growth rate | 0.511 (0.118) | **0.858** (0.452) | 0.039 (0.022) | 10% |

    **Strategy 3 — by-seed (GFP product level, total-order):**

    | Seed | exp | trl_eff | inert decoy | argmax |
    |---|---|---|---|---|
    | 0 | 0.402 | 0.490 | 0.218 | trl_eff |
    | 1 | 0.462 | 0.486 | 0.082 | trl_eff |
    | 2 | 0.638 | 0.410 | 0.048 | exp |

    **Strategy 2 — by-generation:** only generation 1 is present (no cell division
    in the 700-step smoke window), so strategy 2 == strategy 1 here. A genuine
    by-generation decomposition awaits the multi-generation production ensemble.

    PCE response (charts/pce_response_strain_design.png): GFP rises (saturating)
    with exp and rises-then-plateaus with trl_eff over the productive range.
  interpretation: |
    Three real readings, honestly bounded:

    1. **Pipeline liveness (PASS).** A GFP new-gene strain built via fitSimData_1
       runs end-to-end through the pbg-uq forward-UQ pipeline on the swept
       new_gene_internal_shift knobs; per-sample GFP monomer count and growth
       rate are emitted and an order-2 PCE fits. The milestone's need-to-have
       (a working strain-design demonstration) is met.

    2. **Product-level ranking (QUALITATIVE only at this budget).** exp (0.49) and
       trl_eff (0.46) are CO-DOMINANT for GFP product level — refuting the
       pre-registered "exp dominates" hypothesis. But this ranking is NOT yet
       quantitatively trustworthy: the GFP PCE has 51% held-out test error and the
       inert decoy leaks 0.11 (> the 0.05 null band), both symptoms of an
       under-resolved order-2 surrogate at n=12 against single-cell stochastic
       noise. Read as: "both knobs clearly move product; which leads is not
       resolved at smoke budget."

    3. **Growth-rate ranking (more trustworthy).** trl_eff dominates growth-rate
       variance (0.858) over exp (0.511), with a clean adversarial null
       (decoy 0.039) and 10% test error — translation-efficiency load is the
       larger growth lever in this window, consistent with the biology (raising
       translation efficiency diverts ribosomes/charged-tRNA to the heterologous
       product).

    4. **Robustness (FAILS at smoke budget).** The GFP dominant-knob argmax flips
       across seeds (seeds 0,1 → trl_eff; seed 2 → exp), so the ranking is NOT
       robust — again pointing to insufficient samples/seeds, which the production
       ensemble is sized to fix.

    The adversarial check did its job: it flagged the product-level readout as
    not-yet-trustworthy rather than rubber-stamping it.
  decision: |
    PROCEED to production, do not yet publish a product-level ranking. The smoke
    passes the pipeline-liveness gate and demonstrates the strategy-1/strategy-3
    decomposition from a single ensemble, so the machinery is proven. But two of
    the four rigor tests fail at smoke budget (GFP dominant-knob not robust across
    seeds; GFP adversarial decoy 0.11 > 0.05 null), and strategy 2 (by-generation)
    could not be computed (no division in a 700-step window). The running
    production ensemble (n=24+4, 3 seeds, up to 3 generations, 4000 steps) is
    sized to: (a) resolve the GFP surrogate (drive test error down, close the
    decoy leak), (b) test argmax robustness at a real budget, and (c) admit cell
    division for a genuine by-generation decomposition. The one finding solid
    enough to carry now is that trl_eff — not exp — is the dominant growth-rate
    lever (clean null, 10% test error). No product-level winner is asserted.

