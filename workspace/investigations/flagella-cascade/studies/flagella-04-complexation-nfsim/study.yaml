  Maya's own note (2026-07-24): "I have not worked on this fully yet" — this study is
  the least mature of the four; it runs the STANDALONE pbg-nfsim example, and the
  WCM-coupling is unstarted. Reviews of this study should be read in that light.

  Brought in from https://github.com/vivarium-collective/pbg-nfsim (the example
  already existed there). Installed via `uv pip install -e` into the workspace venv
  alongside `bionetgen`. bionetgen 0.8.6 imports the removed
  `pkg_resources.packaging` on Python 3.12 — the driver shims it from the
  standalone `packaging` package before importing pbg_nfsim. Coupling it into the
  WCM to replace ecoli-complexation (full Aim 2B) is the next step.

  FUTURE WORK flagged by Maya (2026-08-05): once the complexation reactions
  themselves are properly built out (real biologically-grounded sub-species/
  sub-complexes for flagellar assembly, not a 1:1 port of the current coarse
  single-step Gillespie reactions), spatiality will need to be introduced too
  -- real flagellar placement/nucleation plausibly has a genuine geometric
  component (membrane surface area, spacing between basal bodies) on top of
  the transcriptional/degradation control identified in
  what-would-actually-cap-flagella-count's 2026-08-05 update. Not started;
  noted here so it isn't lost before the complexation work itself begins.
