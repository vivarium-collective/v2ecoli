    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  model_settings: []
confidence: Accepted
findings:
- id: basal-vs-vecoli-result
  kind: computational
  status: confirms
  statement: 'CONTROL -- v2ecoli reproduces vEcoli on basal (the ParCa fit point):
    all observables within tolerance (4-seed gen-1).'
  evidence:
    from_card: statistical
    observed: cell/dry +1.x%, protein/RNA <1.5%, growth ~+5% at seed-noise level --
      all within_tol.
inputs:
- artifact: sim_data
  from: parca
  into: cache_dir
pipeline_gate:
  enables: []
