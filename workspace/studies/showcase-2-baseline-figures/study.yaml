schema_version: 4
name: showcase-2-baseline-figures
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: Wild-type baseline single-cell→division ensemble reproduces E. coli properties
created: '2026-06-09'
status: complete   # legacy back-compat; canonical axes below
report_card_refs:
  vs_vecoli: docs/report_cards/v2ecoli-vecoli-comparison/basal/report_card_verdict.json

# v4 schema (vivarium_workbench.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]

# Canonical 6-axis status. Baseline ensemble run + native-analysis gallery done.
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

question: |
  Does the baseline single-cell→division sim reproduce wild-type E. coli
  properties across a multiseed/multigen ensemble? The wild-type baseline
  resumed from the showcase-1 full ParCa cache should produce a doubling time
  in band, physiological mass fractions, FBA fluxes that correlate with Toya
  2010, and a proteome that correlates with Schmidt 2016 / Wisniewski.

report:
  title: showcase-2 — wild-type baseline ensemble vs measured E. coli properties
  verdict: pass
  confidence: high
  evidence_quality: multiseed-ensemble + native-analysis gallery

  objective: |
    Establish that the v2ecoli wild-type baseline single-cell→division ensemble,
    resumed from the showcase-1 full ParCa cache, reproduces measured wild-type
    E. coli properties across a multiseed/multigen ensemble: doubling time in
    band, physiological mass fractions, FBA flux correlation to Toya 2010, and
    proteome correlation to Schmidt 2016 / Wisniewski 2014.

  setup: |
    Composite: baseline (v2ecoli.composites.ecoli_baseline.ecoli_baseline), resumed from the
    showcase-1 cache (out/cache-showcase, 51-condition full ParCa). The run is a
    MULTISEED + MULTIGEN ensemble: 2 seeds (0–1) × 3 generations, dispatched
    Ray-parallel (run_seeds_parallel, 6 threads/worker) with XArray/zarr emit as
    the primary store PLUS a parquet sidecar; the parquet sidecar is the
    authoritative store (the seed_00 xarray store failed to write — Quantity
    'shape' AttributeError — and seed_01's xarray captured only gens 1–2, but
    BOTH seeds' parquet is the clean [1,2,3] phylogeny: gen1 agent=0 / gen2
    agent=00 / gen3 agent=000). 6500 steps / cell; total wall ~1228 s. The
    native analyses (v2ecoli/workflow/analyses/) consumed the parquet sidecar
    directly; sim_data was hydrated from the showcase ParCa fixture
    (out/sim_data-showcase/parca_state.pkl.gz via hydrate_sim_data_from_state)
    and the Schmidt/Wisniewski proteome validation data attached for the
    proteome correlation. Figures rendered to PNG+SVG via vl_convert (Altair) /
    matplotlib on the mac mini (scripts/render_showcase2.py).

  result: |
    Regenerated from the CLEAN 2-seed × 3-generation re-run (gen1 agent=0 /
    gen2 agent=00 / gen3 agent=000 for both seeds). Doubling time per DIVIDED
    generation is in-band and clean: gen-1 = 43 min (both seeds), gen-2 = 43 min
    (seed 0) / 52 min (seed 1), mean of the divided generations ≈ 46 min. The
    cap-immune instantaneous-growth-rate measure (the runnable test, evaluated
    by pbg-compute-outcomes) gives 52.4 min across the full lineage (per-gen
    51 / 52 / 54 min). The old gen-2
    step-cap over-report (~104 min) is GONE — #173 ends gen-2 at its real
    division. The only residual span artifact is the LAST generation (gen-3),
    which is truncated at the 6500-step cap before it divides, so its raw span
    reads short (~10–19 min); the cap-immune measure and the divided-generation
    headline are unaffected. Mass fractions are physiological: protein 0.461
    (per-gen 0.477 / 0.453 / 0.442), rRNA 0.105, tRNA 0.019, DNA 0.018; mean dry
    mass ≈467 fg, cell mass ≈1556 fg. The proteome correlates with Schmidt 2016
    at r = 0.728 (n=2228 monomers) and Wisniewski 2014 at r = 0.602 (n=2226).
    The native-analysis gallery (11 figures) reproduces the clean 3-generation
    cell-mass ramps, the replication program (oriC 2→4→2 per division, twice
    across the seed-0 lineage), the ppGpp pool, and high tRNA charging.
    The central-carbon FBA-vs-Toya-2010 scatter is regenerated on the clean
    run: the baseline FBA fluxes correlate with the Toya 2010 C13-MFA measured
    central-carbon fluxes at Pearson R = 0.6990 (p = 2.1e-4, n = 23 reactions).

  interpretation: |
    The v2ecoli baseline reproduces wild-type single-cell physiology: clean
    3-generation growth/division (cell_mass ramps), physiological biomass
    composition, and a proteome that correlates with Schmidt 2016 (r≈0.73) and
    Wisniewski 2014 (r≈0.60), consistent with the upstream vEcoli baseline. The
    doubling-time artifact that the prior run carried is RESOLVED: with #173,
    gen-2 now ends at its own division (43–52 min in-band) instead of emitting
    to the step-window cap (the old ~104 min over-report is gone). The
    doubling_time_line / doubling_time_hist figures now show a clean gen-2; the
    only remaining span quirk is the truncated FINAL generation (gen-3 hits the
    6500-step cap before dividing, so its raw span reads short). The headline
    uses the cap-immune instantaneous-growth doubling time (52.4 min) and the
    divided-generation division times (~46 min). The central-carbon FBA fluxes
    correlate with the Toya 2010 measured fluxes at Pearson R = 0.6990
    (n = 23 reactions), consistent with the upstream vEcoli baseline.

  decision: |
    PASS — the baseline ensemble reproduces wild-type properties. All four
    primary tests pass on the clean re-run (doubling time in-band, mass fractions
    physiological, FBA fluxes correlate with Toya 2010 at R = 0.6990, proteome
    correlates Schmidt/Wisniewski). Gate stays
    passed, unblocking showcase-3 (the reviewer variant decision).

# --- v4 narrative-spine sections (filled from this study's recorded results) ---
study_card:
  phase: Simulate / Evaluate
  one_liner: "Run the wild-type baseline single-cell→division ensemble (2 seeds × 3 gens) and confirm it reproduces measured E. coli properties."
  status: complete
  headline: "PASS — doubling ~46–52 min (in-band), protein fraction 0.461, Toya-2010 FBA flux R = 0.6990, proteome Schmidt r = 0.728 / Wisniewski r = 0.602."

runtime:
  wall_seconds: 1228
  dispatch: Ray-parallel (run_seeds_parallel, 6 threads/worker)
  scale: 2 seeds × 3 generations, 6500 steps/cell
  hardware: Mac mini

readouts:
- {name: doubling-time, description: "cap-immune doubling time t2 = ln(2)/mu averaged over the full lineage (min)"}
- {name: mass-fractions, description: "dry-mass fractions (protein / rRNA / tRNA / DNA) per generation"}
- {name: fba-flux-vs-toya2010, description: "central-carbon FBA flux vs Toya 2010 C13-MFA (Pearson R over 23 reactions)"}
- {name: proteome-correlation, description: "proteome correlation vs Schmidt 2016 and Wisniewski 2014 (log10 monomer counts)"}
- {name: replication-and-regulation, description: "replication program (oriC copy number over the cell cycle) and ppGpp / tRNA-charging traces"}

enforced_params:
- {name: cache_dir, value: out/cache-showcase, why: "resume from the showcase-1 full-mode (51-condition) ParCa cache"}
- {name: seeds, value: "0–1", why: "multiseed ensemble (2 seeds), seed 0 anchors the baseline condition"}
- {name: generations, value: 3, why: "single-cell→division lineage depth"}
- {name: emitter, value: parquet-sidecar, why: "the in-engine ParquetEmitter is a RAM trap; the parquet sidecar is authoritative"}

biological_summary: |
  The wild-type baseline is the unperturbed v2ecoli whole cell growing in
  glucose minimal medium. Reproducing the four measured-property classes —
  doubling time, biomass composition (mass fractions), central-carbon flux
  (vs Toya 2010), and the proteome (vs Schmidt 2016 / Wisniewski 2014) — across
  a multiseed/multigen ensemble is the evidence that the cell is "the same
  E. coli" the upstream WCM was validated against, and the reference that all
  showcase-4 perturbation variants are measured against.

literature_anchors:
- {cite: macklin2020, note: "The Covert-lab whole-cell model; the source of the validated baseline properties (doubling time, mass fractions, Toya-2010 FBA flux + Schmidt/Wisniewski proteome cross-evaluation) v2ecoli reproduces here."}

# Structured bibliography: the bib keys (resolved in references/papers.bib) this
# study cites, so the report's References section renders them. Mirrors the
# anchors named in the run-outcome prose (Toya 2010 FBA flux; Schmidt 2016 +
# Wisniewski 2014 proteome) which were previously prose-only.
bibliography:
  bib_keys:
  - macklin2020
  - toya2010
  - schmidt2016
  - wisniewski2014

model_change: |
  None — this is the unperturbed wild-type baseline. The only configuration is
  the multiseed/multigen ensemble + Ray-parallel dispatch + parquet emit (see
  model_settings); no process parameters are altered.

implementation_requirements: |
  v2ecoli.composites.ecoli_baseline.ecoli_baseline resumed from out/cache-showcase;
  run_seeds_parallel (Ray) dispatch; parquet sidecar store; the native analyses
  (v2ecoli/workflow/analyses/) consuming the parquet; sim_data hydrated from
  out/sim_data-showcase/parca_state.pkl.gz via hydrate_sim_data_from_state;
  Schmidt/Wisniewski + restored Toya-2010 (toya_2010_central_carbon_fluxes.tsv)
  validation data attached; figures via scripts/render_showcase2.py.

design_pivot_required: false

conclusion_verdicts:
- {claim: "doubling time is in the physiological band", verdict: supported, basis: "divided-generation ~46 min; cap-immune instantaneous t2 = 52.4 min (in [35,55])"}
- {claim: "mass fractions are physiological", verdict: supported, basis: "protein 0.461, rRNA 0.105, tRNA 0.019, DNA 0.018"}
- {claim: "FBA fluxes correlate with Toya 2010", verdict: supported, basis: "Pearson R = 0.6990 (p = 2.1e-4, n = 23 reactions)"}
- {claim: "proteome correlates with Schmidt / Wisniewski", verdict: supported, basis: "Schmidt r = 0.728 (n=2228), Wisniewski r = 0.602 (n=2226)"}

conclusion_logic:
  if_primary_tests_pass:
    summary: "The wild-type baseline ensemble reproduces measured E. coli properties (doubling time in-band, physiological mass fractions, Toya-2010 FBA flux correlation, Schmidt/Wisniewski proteome correlation), so it is a trusted reference and showcase-3 (the reviewer variant decision) is unblocked."
    block_downstream: false
    pipeline_unblocks: [showcase-3-variant-decide]
    biological_validation: "All four property classes land in their physiological ranges with no calibration trade-off among them, consistent with the upstream WCM baseline (macklin2020)."
  if_primary_tests_fail:
    summary: "If any property class falls out of band (e.g. doubling time off-band, non-physiological mass fractions, FBA fluxes uncorrelated with Toya 2010, or proteome decorrelated), the baseline is not a trustworthy reference and the perturbation studies (showcase-3/4) must wait for re-calibration."
    block_downstream: true
    diagnose: ["doubling time out of [35,55] min", "protein fraction out of [0.40,0.55]", "Toya-2010 FBA correlation lost", "Schmidt/Wisniewski proteome correlation lost"]
    biological_validation: "A baseline that misses the measured-property classes would mean the resumed ParCa cache is mis-calibrated, so every downstream perturbation delta would be untrustworthy."

simulation_set:
- name: showcase2-baseline-ensemble
  kind: simulation
  status: complete
  base_model: baseline
  duration_steps: 6500
  seeds: "0–1 (2 seeds) × 3 generations"
  metrics: [doubling time, mass fractions, Toya-2010 FBA flux R, Schmidt/Wisniewski proteome r]
  pass_fail_tests: [doubling-time-in-band, mass-fraction-physiological, fba-flux-correlates-toya2010, proteome-correlates-schmidt-wisniewski]

conditions:
  baseline:
    composite: ecoli_baseline
    params:
      seed: 0
      cache_dir: out/cache-showcase
    # NOTE: the RUN is NOT a single seed-0 cell. seed 0 anchors the baseline
    # condition; the actual run is a MULTISEED + MULTIGEN ensemble (2 seeds ×
    # 3 generations) dispatched Ray-parallel via run_seeds_parallel. The native
    # analyses (doubling time, mass fractions, Toya FBA fluxes,
    # Schmidt/Wisniewski proteome) render from the parquet sidecar of that
    # ensemble (.pbg/runs/showcase2-baseline-clean/).
  variants:
  # The wild-type baseline carries no perturbation variants — it is itself the
  # reference. The perturbation variants live in showcase-4 and are measured
  # against this baseline.
  - name: wild-type baseline (no perturbation)
    role: reference
    detail: "Unperturbed glucose-minimal whole cell; the reference all showcase-4 perturbation deltas are taken against."
  model_settings:
  - name: multiseed-multigen-ensemble
    detail: "Run is a multiseed + multigen ensemble (2 seeds × 3 generations, not a single cell); the tests are evaluated over the ensemble."
  - name: ray-parallel-dispatch
    detail: "Seeds fanned out Ray-parallel via run_seeds_parallel."
  - name: xarray-zarr-emit
    detail: "XArray/zarr emit (NOT the in-engine ParquetEmitter, which is a RAM trap)."

assumptions:
- text: |
    The wild-type baseline resumed from the showcase-1 full ParCa cache reaches
    a physiological steady state across a multiseed/multigen ensemble, so the
    four wild-type-property tests are evaluated on the ensemble (not a single
    cell).
  verified_in_v2ecoli: false
- text: |
    Ray-parallel dispatch (run_seeds_parallel) + XArray/zarr emit is the correct
    runner for a multiseed ensemble; the in-engine ParquetEmitter is a RAM trap
    and is avoided.
  verified_in_v2ecoli: false

tests:
- name: doubling-time-in-band
  classification: primary
  status: passed
  question: Is the ensemble doubling time within the physiological band for the baseline growth condition?
  measure:
    # Cap-immune doubling time: derive it from the per-step instantaneous
    # growth rate rather than a per-generation window over cell_mass. The
    # instantaneous specific growth rate mu (units 1/s) gives doubling time
    # t2 = ln(2)/mu; in minutes t2 = (ln2/60)/mu = 0.011552453.../mu. Because
    # this is a per-tick quantity it never references division events or the
    # 6500-step emit cap, so it avoids the gen-2 over-report artifact that the
    # naive (max_time-min_time) per-generation window suffers (gen-2 cells keep
    # emitting to the cap after dividing -> ~63-104 min false reading).
    # The evaluator averages the per-tick t2 across the full lineage.
    kind: derived
    formula: 0.011552453009332421 / listeners.mass.instantaneous_growth_rate
    window: full_lineage_from_gen_0
    detail: Doubling time t2 = ln(2)/mu (min) from the per-step instantaneous specific growth rate, averaged over the full lineage. Cap-immune (no division-event / step-window dependence).
  cites: [macklin2020]
  cites_note: |
    Central value sourced to the Covert-lab whole-cell model baseline
    (macklin2020), whose glucose-minimal wild-type doubles at ~40–45 min; the
    [35, 55] min band is an analyst tolerance window around that published
    value, not a separately-published interval. The primary growth-physiology
    datasets aggregated by the WCM are not individually in references/papers.bib.
  pass_if:
    op: in_range
    low: 35
    high: 55
- name: mass-fraction-physiological
  classification: primary
  status: passed
  question: Are the cell mass fractions (protein / RNA / DNA / etc.) physiological?
  measure:
    # Protein is the headline physiological dry-mass fraction (~0.47 for
    # wild-type E. coli). The DSL evaluates one measure per test, so this test
    # gates on the protein fraction; the other fractions (rRNA ~0.106, tRNA
    # ~0.019, DNA ~0.018) are reported in the authored outcomes detail and were
    # spot-checked to be physiological via the same listeners.mass.* / dry_mass
    # ratio (all in band).
    kind: generation_average
    path: listeners.mass.protein_mass / listeners.mass.dry_mass
    window: every_generation
    detail: Protein dry-mass fraction (listeners.mass.protein_mass / listeners.mass.dry_mass), generation-averaged, vs the physiological E. coli band.
  cites: [macklin2020]
  cites_note: |
    Central value (protein ~0.47 of dry mass) sourced to the Covert-lab
    whole-cell model baseline (macklin2020); the [0.40, 0.55] band is an analyst
    tolerance window around that published composition, not a separately-
    published interval.
  pass_if:
    op: in_range
    low: 0.40
    high: 0.55
- name: fba-flux-correlates-toya2010
  classification: primary
  status: passed   # clean run: FBA fluxes correlate with Toya 2010 at Pearson R = 0.6990 (p = 2.1e-4, n = 23)
  question: Do the baseline FBA fluxes correlate with the Toya 2010 measured central-carbon fluxes?
  measure:
    kind: flux_correlation
    reference: Toya 2010
    detail: Correlate baseline FBA fluxes against Toya 2010 measured fluxes.
  cites: [toya2010]   # the Toya 2010 C13-MFA central-carbon flux dataset this band is anchored to
  pass_if:
    op: correlates
- name: proteome-correlates-schmidt-wisniewski
  classification: primary
  status: passed
  question: Does the baseline proteome correlate with the Schmidt 2016 / Wisniewski measured proteome?
  measure:
    kind: proteome_correlation
    reference: Schmidt 2016 / Wisniewski
    detail: Correlate baseline protein abundances against the Schmidt/Wisniewski measured proteome.
  cites: [schmidt2016, wisniewski2014]   # the two measured-proteome datasets this band is anchored to
  pass_if:
    op: correlates

discovery_implications:
  resolved_uncertainties:
  - The central-carbon FBA-vs-Toya-2010 scatter is regenerated on the clean run — the Toya 2010 flux validation TSV (toya_2010_central_carbon_fluxes.tsv) was restored to v2ecoli/validation/ecoli/flat/ and build_validation_data now exposes validation_data.reactionFlux.toya2010fluxes. The baseline FBA fluxes correlate with the Toya 2010 C13-MFA measured fluxes at Pearson R = 0.6990 (p = 2.1e-4, n = 23 reactions).
  - The wild-type baseline reproduces the measured-property classes on the clean 3-generation re-run (doubling time in-band, physiological mass fractions, Schmidt r≈0.73 / Wisniewski r≈0.60) — no calibration trade-off appeared across them.
  - "RESOLVED (was: gen-2 doubling-time step-cap over-report): #173 ends each non-final generation at its real division, so gen-2 now reads 43–52 min (in-band) instead of the old ~104 min cap-inflated value. The doubling_time_line / doubling_time_hist figures show a clean gen-2."
  - "RESOLVED (reviewer: 'why is the doubling time going down? get more samples'): the apparent decline was the cap-truncated FINAL generation, not a real trend. doubling_time_line / doubling_time_hist now lead with a cap-immune instantaneous doubling-time trace t2 = ln(2)/mu from listeners.mass.instantaneous_growth_rate over the whole lineage (218 per-timestep samples vs the old 3 generational points): STABLE at ~44–52 min (mean ~52 min), no decline. Per-generation division-time markers are kept but the truncated final generation is excluded so it no longer reads as a downward trend."
  - "RESOLVED (was: gen-3 mislabeled / folded phylogeny): the clean re-run has the correct lineage labelling — gen1 agent=0 / gen2 agent=00 / gen3 agent=000 for both seeds — so cell_mass now renders three distinct clean generations."
  remaining_uncertainties:
  - "The FINAL generation (gen-3) is truncated at the 6500-step emit cap before it divides, so its raw per-generation span reads short (~10–19 min). This no longer affects the headline figures: doubling_time_line / doubling_time_hist now plot the cap-immune instantaneous doubling time (t2 = ln(2)/mu, 52.4 min over the full lineage, matching the runnable test) and the per-generation division-time markers explicitly exclude the truncated final generation (heuristic: last generation of a lineage whose final emitted row lands at the 6500-step cap). A per-generation division-event listener would let the span-based markers identify a real division instead of relying on this cap heuristic."

pipeline_gate:
  prerequisites:
  - showcase-1-parca
  enables:
  - showcase-3-variant-decide
  gate_status: passed

runs:
- name: showcase2-baseline-ensemble
  status: completed
  kind: simulation
  canonical: true
  description: |
    CLEAN multiseed/multigen wild-type baseline ensemble on the Mac mini: 2
    seeds (0–1) × 3 generations of v2ecoli.composites.ecoli_baseline.ecoli_baseline, resumed
    from the showcase-1 full ParCa cache (out/cache-showcase, 51 TF conditions).
    Dispatched Ray-parallel (run_seeds_parallel, 6 threads/worker). 6500 steps /
    cell; total wall ~1228 s (per-seed ~695 / 1225 s). The parquet sidecar
    (.pbg/runs/showcase2-baseline-clean/sweep/showcase2_baseline/) is the
    authoritative store and has the CLEAN [1,2,3] phylogeny for both seeds
    (gen1 agent=0 / gen2 agent=00 / gen3 agent=000); the XArray/zarr store is
    incomplete (seed_00 failed to write with a Quantity 'shape' AttributeError;
    seed_01 captured only gens 1–2) so all analyses ran off the parquet. This
    run REPLACES the old showcase2-baseline-full, which had a folded gen-2 /
    missing gen-3. The native analyses (v2ecoli/workflow/analyses/) consumed the
    parquet directly; sim_data hydrated from out/sim_data-showcase/parca_state.pkl.gz
    via hydrate_sim_data_from_state; Schmidt/Wisniewski proteome validation data
    attached. 11 figures rendered to PNG+SVG (vl_convert for Altair, matplotlib
    for the Voronoi / flux-barplot / heatmap views) via scripts/render_showcase2.py.
  dispatch: ray
  # Authoritative persisted store is the parquet sidecar. The xarray/zarr emit
  # was attempted as the primary store but seed_00 failed to write (Quantity
  # 'shape' AttributeError) and seed_01 captured only gens 1–2; the parquet
  # sidecar carries the clean [1,2,3] phylogeny for both seeds and is what every
  # analysis ran off, so parquet is recorded as the emitter of record here.
  emitter:
    kind: parquet
    note: "parquet sidecar (authoritative); xarray/zarr emit attempted but incomplete"
  cache_dir: out/cache-showcase
  wall_seconds: 1228
  # Local parquet sidecar (hive-partitioned, has history/) for the evaluator's
  # RunReader. _resolve_run_store opens this directly (it contains history/).
  # Path is repo-root-relative (.pbg/ lives at the v2ecoli repo root); run
  # pbg-compute-outcomes from the repo root so the cwd base resolves it.
  parquet: .pbg/runs/showcase2-baseline-clean/sweep/showcase2_baseline
  result: PASS
  outcomes:
    # NOTE: ALL authored outcome keys are lowercase to match their tests[].name
    # EXACTLY. For the two runnable tests (doubling-time / mass-fraction) this
    # lets the evaluator's computed_outcomes reconcile (keyed by test.name)
    # produce agree/divergent. For the two correlation tests (agent-bucketed —
    # correlation is not a supported run-data op, so computed_outcomes is
    # no_authored) the lowercase key is what lets the REPORT surface the authored
    # PASS pill: walkthrough.js does out = outcomeByTest[t.name], so an
    # UPPERCASE-keyed authored outcome would render as "pending" instead of PASS.
    doubling-time-in-band:
      result: PASS
      detail: "Divided-generation division times: gen-1 = 43 min (both seeds), gen-2 = 43 min (seed 0) / 52 min (seed 1) → mean of divided gens ≈ 46 min; cap-immune instantaneous-growth measure (runnable test) = 52.4 min over the full lineage. In-band for the baseline glucose condition. The old ~104 min gen-2 step-cap over-report is resolved by #173; the final gen-3 cell is truncated at the 6500-step cap (raw span ~10–19 min) so it is excluded from the division-time headline."
    mass-fraction-physiological:
      result: PASS
      detail: "Average dry-mass fractions: protein 0.461 (per-gen 0.477 / 0.453 / 0.442), rRNA 0.105, tRNA 0.019, DNA 0.018 — physiological E. coli composition (mean dry mass ≈467 fg, cell mass ≈1556 fg)."
    fba-flux-correlates-toya2010:
      result: PASS
      detail: "Baseline central-carbon FBA fluxes vs Toya 2010 C13-MFA measured fluxes — Pearson R = 0.6990 (p = 2.1e-4) over 23 reactions (central_carbon_metabolism_scatter, multiseed over 2 seeds). Toya flat file (toya_2010_central_carbon_fluxes.tsv) restored; validation_data.reactionFlux.toya2010fluxes now built by build_validation_data."
    proteome-correlates-schmidt-wisniewski:
      result: PASS
      detail: log10 average monomer counts vs measured proteomics — Schmidt 2016 Pearson r = 0.728 (n=2228 overlapping monomers), Wisniewski 2014 r = 0.602 (n=2226) (protein_counts_validation, multiseed over 2 seeds).

  computed_outcomes:
    doubling-time-in-band:
      result: PASS
      measured_value: 52.40456
      evaluated_by: code
      operator: derived/in_range
      detail: 52.4 in [35.0, 55.0]
      reconcile: agree
    mass-fraction-physiological:
      result: PASS
      measured_value: 0.461785
      evaluated_by: code
      operator: generation_average/in_range
      detail: 0.4618 in [0.4, 0.55]
      reconcile: agree
    fba-flux-correlates-toya2010:
      evaluated_by: agent
      reason: "non-run-data kind: 'flux_correlation'"
      reconcile: no_authored
    proteome-correlates-schmidt-wisniewski:
      evaluated_by: agent
      reason: "non-run-data kind: 'proteome_correlation'"
      reconcile: no_authored
