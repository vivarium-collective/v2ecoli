findings:
- summary: 'The rule gets dnaG right and the network wrong: it removes the LexA/TU00352 edge but strips
    89.5% of adjudicated edges.'
  status: contradicts
  evidence:
    from_test: most-edges-are-unchanged
    observed: 0.1049
    units: fraction retained
    divergence_factor: 0.83861538
  explanation: Applied uniformly, the rule reproduces the LexA judgement the EcoCyc coordinates imply
    -- TU00352 loses its edge, as predicted before running. But it also removes 89.5% of every other adjudicated
    edge, which makes it a different model rather than a correction and voids any rescue Phase B could
    have shown. The disruption control was carried over from ppgpp-off-rescue precisely to catch this,
    and it did.
  expected:
    range:
    - 0.65
    - 1.0
  provenance:
    run_ids:
    - promoter-specific-regulation__phase-A
- summary: 'The failure is NOT the tolerance. Distances are bimodal: a tenth of edges match a site exactly,
    the rest have no nearby site at all.'
  status: novel
  evidence:
    from_test: most-edges-are-unchanged
    observed: 0.177
    units: retention at a 500 bp tolerance
    divergence_factor: 0.83861538
  explanation: p5 and p10 of |implied TSS - TU start| are 0.5 bp, while p25 is 1568 bp, p50 14376 bp and
    p75 103123 bp. Loosening the tolerance a hundredfold moves retention only 0.1049 -> 0.1770, so no
    window rescues it. A smooth distribution would indicate a calibration problem; a sharp mode at 0.5
    bp plus a long tail indicates the export covers SOME promoters exactly and misses others entirely.
  expected:
    range:
    - 0.65
    - 1.0
  provenance:
    run_ids:
    - promoter-specific-regulation__phase-A
- summary: Two readings remain open and this data cannot separate them.
  status: novel
  evidence:
    from_run: promoter-specific-regulation__phase-A
  explanation: 'Either (a) the model''s TF-TU assignments are largely unsupported by binding-site evidence,
    or (b) the export is an incomplete subset and the rule strips real regulation wherever a site is missing.
    The bimodality favours (b), and so does the coverage: only 9 of 23 model TFs appear at all, 29.2%
    of sites name no promoter, and 11.6% name one without an offset. I cannot distinguish them from this
    file, and it would be wrong to present the 89.5% as evidence against the model.

    The dnaG case is unaffected either way: LexA''s site IS in the export and matches TU00435 to 0.5 bp,
    so the evidence there is positive rather than an absence.'
conclusion_verdicts:
- claim: The rule removes the misattributed LexA edge (H1's first step)
  verdict: supported
  basis: TU00352's LexA edge removed by the uniform rule, as predicted before running.
- claim: Positional attribution is applicable network-wide from this data
  verdict: refuted
  basis: Retention 0.1049 against a required 0.65; the rule strips 89.5% of adjudicated edges.
- claim: The disruption is a tolerance artefact
  verdict: refuted
  basis: Bimodal distances; a 100x looser tolerance moves retention only 0.1049 -> 0.1770.
- claim: The 89.5% shows the model's assignments are wrong
  verdict: undetermined
  basis: Indistinguishable from an incomplete export; coverage and bimodality favour incompleteness.
discovery_implications:
- 'A targeted correction at the dnaG locus IS supported: LexA''s site is present in the data and matches
  TU00435 to 0.5 bp, so removing its edge from TU00352 rests on positive evidence rather than an absence.'
- A network-wide promoter-specific fix is NOT supportable from this export. It needs the complete regulation
  table -- regulation.dat from the Pathway Tools distribution -- so that a missing site means 'no site'
  rather than 'not exported'.
- 'The bimodal distance distribution is itself a useful diagnostic for any future attribution work: exact
  matches at 0.5 bp show the join is sound where data exists, so the long tail is about coverage rather
  than method.'
- TU00434 sits 22.5 bp from the implied TSS and does NOT match, so even restoring it would not carry the
  LexA edge under this rule -- contradicting what I assumed when scoping tu-dedup-promoter-collapse.
