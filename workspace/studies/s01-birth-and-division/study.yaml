schema_version: 4
name: s01-birth-and-division
created: '2026-07-25'

# --- canonical lifecycle axes (reconciled 2026-07-27 during hardening) ---
# The pack pipeline ran ONCE on a newer toolchain (producing the numbers cited
# below), but is NOT reproducible in the canonical environment: origin/main pins
# pbg-parsimony to a moving `branch = "main"` and the installed editable checkout
# is stale (missing the `compartment`/`envelope`/multi-chromosome API that
# v2ecoli/structural/build.py now requires), AND the `parsimony` binary that
# actually meshes+packs is absent (no PARSIMONY_BIN/PARSIMONY_HOME, not on PATH).
# 4 structural tests that exercise the real pack are RED on canonical main for
# exactly this reason. So the study's headline placed-instance numbers cannot be
# re-verified from disk (the ~90-180 MB packs were never committed). See the
# reproducibility note in `conclusion` and SUMMARY.md at the worktree root.
phase: Simulate
design_status: complete
implementation_status: complete
simulation_status: not_run        # not reproducible in canonical env (toolchain absent); see note
evaluation_status: in_progress    # gate DEFINED; selection+scheduling sub-tests green; pack gate awaits a reproducible run
expert_review_status: not_requested
status: gate-defined-sim-blocked  # legacy free-form; canonical axes above are authoritative

question: |
  Pack the simulated whole-cell molecular state into a 3D cell at ~10 s
  (post-equilibration birth) and right before division, so the Parsimony Viewer
  can show both declared-time snapshots for this study.

conclusion: |
  RECONCILED 2026-07-27 (hardening). The pack pipeline previously ran end-to-end
  (seed 0, relax=true, division reached) on a newer toolchain and reportedly
  produced two loadable snapshots:
    - initial (t ≈ 10 s):    287,013 placed instances (~314k molecules, 46 species)
    - pre-division:          552,450 placed instances (~519k molecules, 46 species)
  with content growing ~1.7-1.9x birth -> division at conserved composition and a
  ~1.5x envelope elongation — the rod-shaped growth expected of a dividing cell.

  HOWEVER these numbers are NOT currently reproducible or verifiable in the
  canonical environment, and were NOT re-derived by this hardening:
    * The ~90-180 MB pack artifacts were never committed — nothing on disk to
      check the numbers against (verified: workspace/studies/s01-birth-and-division/
      has only study.yaml; no viz/3d/).
    * The 3D pack cannot be produced here: pbg-parsimony is pinned to a moving
      `branch = "main"` and the installed editable checkout is stale — it lacks the
      `Ingredient(compartment=...)`, `build_pack(envelope=...)`, and multi-chromosome
      `Chromosome(...)` API that v2ecoli/structural/build.py requires (4 structural
      tests RED on canonical main for this reason) — and the `parsimony` mesh/pack
      binary is absent from the machine entirely.

  What IS verified in the canonical env (green today, no parsimony binary needed):
    * Snapshot scheduling: both declared snapshots fire exactly once at their
      declared times / at division_time (tests/test_pack_step.py — green).
    * Count conservation at the selection layer: v2ecoli's counts -> ingredient
      selection conserves every selected species' count exactly, caps auto-
      expansion at top_n, and is deterministic
      (tests/structural/test_s01_acceptance_gate.py::test_selection_layer... — green).

  The end-to-end pack gate (both snapshots written, placed-vs-requested
  conservation, no over-pack, birth->division growth direction) is now DEFINED and
  implemented (v2ecoli/structural/acceptance.py + the artifact test) but SKIPS
  (not falsely passes) until a real pack is produced with a pinned toolchain.
  See decisions_needed / followups on the investigation to unblock reproduction.

# --- acceptance gate (added 2026-07-27; was previously ABSENT) ---
# Checker: v2ecoli/structural/acceptance.py; harness: tests/structural/test_s01_acceptance_gate.py
behavior_tests:
  - name: snapshot-scheduling-fires-once-at-declared-times
    classification: primary
    acceptance_form: qualitative_direction
    status: passed
    description: Each declared snapshot ("initial" at a fixed sim-time, "pre-division" at the chromosome's scheduled division_time) fires exactly once, at/after its target, within epsilon_s, and skips (without marking fired) when 'shape' has no volume yet. Reproducible with installed deps (no parsimony binary).
    measure: {kind: unit_test, ref: tests/test_pack_step.py}
    pass_if: {op: tests_green}
    requires_simulation: none
    cites: []
  - name: selection-layer-conserves-counts
    classification: primary
    acceptance_form: quantitative_range
    status: passed
    description: v2ecoli's counts -> ingredient selection (build.select_ingredients) conserves every selected species' count EXACTLY (0 mismatches), caps auto-expanded monomers at top_n, and is deterministic. Verified via a permissive Ingredient shim so it does not depend on the stale installed pbg_parsimony API. This is the reproducible core of "packed counts conserve the simulation's counts".
    measure: {kind: selection_conservation, ref: v2ecoli.structural.acceptance.check_selection_conservation}
    pass_if: {op: count_mismatches_at_most, value: 0}
    units: species
    requires_simulation: none
    cites: []
  - name: both-snapshots-written
    classification: primary
    acceptance_form: qualitative_direction
    status: awaiting_verification   # blocked: needs a real pack (pinned pbg-parsimony API + parsimony binary)
    description: A real run writes BOTH snapshots' pack.json + meta.json + recipe under <study>/viz/3d, each with a non-empty 'placements' array. Skipped (never falsely passed) while the pack toolchain is absent.
    measure: {kind: pack_artifacts_present, ref: v2ecoli.structural.acceptance.evaluate_pack_gate}
    pass_if: {op: both_present_and_nonempty}
    requires_simulation: baseline
    cites: []
  - name: count-conservation-placed-vs-requested
    classification: primary
    acceptance_form: quantitative_range
    status: awaiting_verification
    description: Per snapshot, the number of PLACED instances is within [0.80, 1.0] of the requested (scaled) count summed over ingredients — i.e. the packer drops at most ~20% for steric feasibility and never duplicates. Band is provisional; calibrate against the first real pack.
    measure: {kind: placed_over_requested, ref: v2ecoli.structural.acceptance.evaluate_pack_gate}
    pass_if: {op: in_range, low: 0.80, high: 1.0}
    units: fraction
    requires_simulation: baseline
    cites: []
  - name: no-overpack
    classification: primary
    acceptance_form: quantitative_range
    status: awaiting_verification
    description: Placed instances never exceed requested (placed/requested <= 1.0) — a direct "no >100% packing / no gross steric overlap / no duplication" physical-plausibility floor.
    measure: {kind: placed_at_most_requested, ref: v2ecoli.structural.acceptance.evaluate_pack_gate}
    pass_if: {op: at_most, value: 1.0}
    units: fraction
    requires_simulation: baseline
    cites: []
  - name: growth-direction-birth-to-division
    classification: secondary
    acceptance_form: qualitative_direction
    status: awaiting_verification
    description: Pre-division has MORE placed instances than birth, the SAME ingredient-id set (conserved composition — growth is scaling-up, not a compositional shift), and a MORE elongated envelope (capsule aspect ratio increases). Encodes the study's biological reading as a testable check.
    measure: {kind: growth_direction, ref: v2ecoli.structural.acceptance.evaluate_pack_gate}
    pass_if: {op: predivision_gt_initial_same_composition_more_elongated}
    requires_simulation: baseline
    cites: []

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_structural.ecoli_structural
    params:
      study: s01-birth-and-division      # MUST equal this study's slug (drives pack out_dir)
      snapshots:
        initial: 10.0
        pre-division: division_time
      top_n: 40
      scale: 0.3
      relax: true
      relax_params: {equil_ps: 40.0}
      seed: 0
      cache_dir: out/cache
      n_steps: 2700
  variants: []
  model_settings: []
