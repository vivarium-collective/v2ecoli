findings:
- id: F-01
  kind: computational
  status: contradicts
  statement: 'The simulation delivers 4.6% of the DnaG count ParCa fitted for it (mean 1.76 vs 38 copies) -- a 22x gap against the model''s own target.'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: simulation-reproduces-parca-target
    observed: 0.046271
  expected:
    summary: The simulation should reproduce ParCa's fitted count within 2x.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    This is an execution gap, not a calibration gap, and the distinction
    decides where a repair belongs. ParCa's fit of 38 copies is 0.64x the
    four-dataset literature median of 59, which is unremarkable. The running
    simulation then delivers 1.76. So the model is not failing to match
    experiment so much as failing to reproduce the parameterisation it was
    given.

    Any fix aimed only at recalibrating DnaG upward would be aimed at the wrong
    quantity: even hitting the literature median exactly in ParCa would still
    leave the simulation ~20x short, because the loss happens after the fit.
  next_action: 'Trace why translated output falls so far below the fitted target: compare mRNA copy number and ribosome occupancy on TU00352 against what the fitted efficiency implies.'
  next_action_type: escalate_model
- id: F-02
  kind: biological
  status: contradicts
  statement: 'CORRECTED: dnaG IS starved of transcription. TU00352 is synthesised zero times per generation and its mRNA is absent at 100% of timesteps, despite a high assigned basal_prob.'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: transcription-is-not-the-lossy-step
    observed: 91.852304
  expected:
    summary: The dedup hypothesis predicts dnaG's transcript is below the median; this tests the opposite direction.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    The original finding claimed the opposite and was wrong. It read basal_prob, a
    static parameter, rather than measuring transcription during a run -- in a study
    whose own headline is that parameters and behaviour diverge by 22x.

    Two things invalidate the parameter reading. TU00352 is in idx_rprotein, so
    TranscriptInitiation replaces its basal_prob with the fixed ribosomal-protein
    probability; basal_prob never governed it. And measured directly, the transcript
    is never made at all: 0 synthesis events and 0 mRNA across 2528 timesteps.

    This also explains the protein deficit without appeal to translation. ParCa seeds
    ~38 copies, nothing replenishes them, and the pool decays toward zero. An mRNA
    that is never made cannot be translated, so translation efficiency was a red
    herring downstream of the real block.
  next_action: Establish why an idx_rprotein TU receives zero synthesis probability, and whether the dedup is what left dnaG dependent on it.
  next_action_type: escalate_model
  review_note: |
    CORRECTED 2026-09-03 after an expert challenge: 'without checking if it is
    actually being actively transcribed throughout, how do you invalidate the
    hypothesis?'

    The original axis measured basal_prob, a STATIC ParCa parameter, and concluded
    dnaG is not starved of transcription. Measuring what the simulation actually does
    reverses that completely. Over a full generation (2528 timesteps):
      TU00352 mRNA count            0 at 100% of timesteps
      TU00352 synthesis events      0
      realized / assigned           0.000x
    TU00352 is also in idx_rprotein, so TranscriptInitiation OVERRIDES its basal_prob
    with the fixed ribosomal-protein probability -- basal_prob never governed it.
  superseded_note: |
    SUPERSEDED 2026-09-03 by silent-transcription-units. This study reported TU00352 at
    ZERO synthesis with mRNA absent at 100% of timesteps, from ONE generation of ONE
    seed. Across 9 (seed, generation) observations TU00352 receives 5 transcripts, so
    'never synthesised' is wrong.

    The deficit itself stands: ~0.5 transcripts per generation against a peer median of
    55 amply explains a protein at zero 62% of the time. Only the DESCRIPTION changes,
    from 'never transcribed' to 'transcribed ~51x below its assigned rate'.
- id: F-03
  kind: biological
  status: contradicts
  statement: 'CORRECTED: the operon partners diverge because they have DIFFERENT transcripts, not because of a per-cistron step. dnaG has only TU00352 (0 made); rpsU also has TU0-14460, rpoD also has TU00472 (461 made).'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: operon-partners-diverge
    observed: 3.554638
  expected:
    summary: If the partners tracked together the loss would be shared, not per-cistron.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    The original finding's premise was false. It assumed one shared mRNA pool and
    concluded any divergence must be downstream of transcription. rpsU and rpoD each
    carry a second transcript that IS synthesised; dnaG does not. The divergence is
    transcriptional.

    This is the mechanism the investigation was looking for. dnaG's operon partners
    have escape routes and dnaG does not, so a transcript that is never used starves
    dnaG alone while leaving rpsU and rpoD unaffected.
  review_note: |
    CORRECTED 2026-09-03 after an expert challenge: 'without checking if it is
    actually being actively transcribed throughout, how do you invalidate the
    hypothesis?'

    The original axis measured basal_prob, a STATIC ParCa parameter, and concluded
    dnaG is not starved of transcription. Measuring what the simulation actually does
    reverses that completely. Over a full generation (2528 timesteps):
      TU00352 mRNA count            0 at 100% of timesteps
      TU00352 synthesis events      0
      realized / assigned           0.000x
    TU00352 is also in idx_rprotein, so TranscriptInitiation OVERRIDES its basal_prob
