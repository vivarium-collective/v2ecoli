schema_version: 4
name: metabolism_redux_with_aa
investigation: v2ecoli-vecoli-comparison
title: v2ecoli reproduces vEcoli with MetabolismRedux (with_aa)
condition: with_aa
question: Does v2ecoli reproduce vEcoli on with_aa when both engines swap FBA Metabolism for MetabolismRedux?
comparison:
  seeds: 6
  generations: 1
  max_steps_per_gen: 15000
  cards:
  - config
  - parca
  - standard
  - statistical
  - trajectory
  - distribution
  - metabolism
  - composition
from_vecoli_config: configs/metabolism_redux_with_aa.json
report_cards:
- viz/report_card/config.html
- viz/report_card/parca.html
- viz/report_card/standard.html
- viz/report_card/statistical.html
- viz/report_card/trajectory.html
- viz/report_card/distribution.html
- viz/report_card/metabolism.html
- viz/report_card/composition.html
pipeline_gate:
  enables: []
runs:
- composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  name: metabolism_redux_with_aa-comparison
  kind: analysis
  canonical: true
  description: v2e-compare study metabolism_redux_with_aa
status: evaluated
tests:
- name: config-vs-vecoli
  kind: report_card
  card: config
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (config card)?
- name: parca-vs-vecoli
  kind: report_card
  card: parca
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (parca card)?
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (standard card)?
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/v2ecoli-vecoli-comparison/metabolism_redux_with_aa
    group: statistical
- name: trajectory-vs-vecoli
  kind: report_card
  card: trajectory
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (trajectory card)?
- name: distribution-vs-vecoli
  kind: report_card
  card: distribution
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (distribution card)?
- name: metabolism-vs-vecoli
  kind: report_card
  card: metabolism
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (metabolism card)?
- name: composition-vs-vecoli
  kind: report_card
  card: composition
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_with_aa (composition card)?
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      condition: with_aa
      swap: ecoli-metabolism-redux
confidence: Accepted
findings:
- id: metabolism_redux_with_aa-vs-vecoli-result
  kind: computational
  status: confirms
  statement: "Measured (6 seeds requested, 5 effective vEcoli, gen-1, matched timepoints): parca (t=0 initial-state match) within_tol. Statistical card (Welch t-test) overall verdict within_tol -- within_tol on ALL axes including growth rate -- the only fully within_tol condition of the five. Matched gen-1 median |delta|: cell 0.86%, dry 0.86%, protein 0.13%, rna 0.34%, growth 4.3%. No mismatch on any axis; active_RNAP/active_ribosome are ungraded (not in the local reader's observable set)."
  evidence:
    from_card: statistical
    observed: parca within_tol; cell/dry/protein/rna mass all within_tol (median |delta| 0.86%/0.86%/0.13%/0.34%); growth-rate median |delta| 4.3% (within_tol, no drift).
inputs:
- artifact: sim_data
  from: parca
  into: cache_dir

