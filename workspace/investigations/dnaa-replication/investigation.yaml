  studies:
  - dnaa-0-succinate-baseline: succinate steady-state validation (10-generation single-daughters run; oriC periodicity ⇒ save canonical initial condition)
  - dnaa-1-expression: DnaA monomer pool tuning via Mechanism A (runtime sim_data.genetic_perturbations overwrite) — gated on dnaa-0 passing
  blocked:
