name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs run in parallel:
#   fast-tests      — unit + state-only tests, target <30 s, PR-gating
#   behavior-tests  — simulation-running tests (composite.run), target <5 min, PR-gating
# A PR only merges when BOTH are green (branch protection requires both).
#
# tests/test_initialize.py, test_kinetics_units.py, test_unit_bridge.py are
# deselected: any test that imports v2ecoli.types triggers a load of the
# unreleased bigraph-schema `api` branch (plum-dispatched serialize).
# PyPI bigraph-schema 1.1.1 doesn't have it, so collection fails with
# AttributeError on .dispatch. Re-enable after bigraph-schema ships those
# changes to PyPI.

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        # vivarium-workbench's wheel build fails under strict hatchling; the
        # upstream fix requires bigraph-schema>=1.4.1 (a core bump we're
        # deferring). It isn't imported by the test suite (testpaths=tests),
        # so skip building it here.
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      - name: Run fast tests (no .run() calls)
        # Run IN-PROCESS (no pytest-xdist). `-n 1` gave zero parallelism yet still
        # spawned an execnet worker, and on the Linux runner that worker
        # intermittently dies ("node down: Not properly terminated") mid-suite;
        # with a single worker, xdist then hangs waiting for it and the job runs
        # to its timeout (GitHub reports "cancelled"). In-process removes that
        # failure mode: a genuine hang is caught by pytest-timeout (120 s, thread
        # method → os._exit) as a fast, clear failure instead of a 15-min hang.
        # Memory is not a concern here — the CI-relevant "no .run()" tests peak
        # ~3.7 GB, well under the 7 GB runner (the 9-12 GB analysis/ptools cases
        # skip on CI: they need local sms-api / reference-sweep fixtures).
        run: >-
          uv run pytest
          -m "not slow and not sim"
          --ignore=tests/test_initialize.py
          --ignore=tests/test_kinetics_units.py
          --ignore=tests/test_unit_bridge.py
          -p no:xdist
          -v --tb=short

  behavior-tests:
    runs-on: ubuntu-latest
    # Job cap so a hang (e.g. an import/collection hang from a dep bump) fails
    # in minutes, not GitHub's 6h default. Normal run is ~9 min; cold ParCa
    # cache build adds headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        # vivarium-workbench's wheel build fails under strict hatchling; the
        # upstream fix requires bigraph-schema>=1.4.1 (a core bump we're
        # deferring). It isn't imported by the test suite (testpaths=tests),
        # so skip building it here.
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      # Cache out/cache (initial_state.json + sim_data_cache.dill +
      # cache_version.json) across PRs. The cache key pins to the same
      # input files that cache_version.compute_cache_version fingerprints,
      # so a change to ParCa fixture or the LoadSimData boundary forces
      # a rebuild on the next CI run. The hashFiles list mirrors
      # cache_version.INPUT_FILES, plus cache_version.py itself so future
      # additions to INPUT_FILES automatically bust the cache.
      - name: Restore ParCa cache
        id: parca-cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: >-
            parca-cache-v4-${{ hashFiles(
              'models/parca/parca_state.pkl.gz',
              'v2ecoli/library/sim_data.py',
              'v2ecoli/library/unit_bridge.py',
              'v2ecoli/types/quantity.py',
              'v2ecoli/library/initial_conditions.py',
              'v2ecoli/library/cache_version.py',
              'v2ecoli/core.py',
              'v2ecoli/composites/baseline.py',
              'v2ecoli/composites/baseline_population.py',
              'v2ecoli/composites/baseline_time_varying_env.py',
              'v2ecoli/composites/colony.py',
              'v2ecoli/composites/millard_pdmp_baseline.py'
            ) }}

      - name: Build ParCa cache on miss
        if: steps.parca-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/build_cache.py

      - name: Run simulation-based behavior tests
        # Tight step cap: the 7 sim tests target ~9 min. A hang here (test body,
        # or an import/collection hang at pytest startup that pytest-timeout's
        # per-test cap can't catch) fails fast at 15 min instead of running on.
        timeout-minutes: 15
        env:
          CI: 'true'
        # -n auto: pytest-xdist parallelism. The 7 behavior tests are
        # mostly independent full-composite runs that each spend ~2 min
        # in the inner WCM; parallelizing across 4 workers should
        # roughly halve the wall time (target ~7 min vs ~14 min serial).
        # --dist=loadfile keeps a file's tests on one worker so any
        # module-level ParCa-cache-warm fixture pays its cost once.
        run: >-
          uv run pytest
          -m "sim and not slow"
          --ignore=tests/test_initialize.py
          --ignore=tests/test_kinetics_units.py
          --ignore=tests/test_unit_bridge.py
          -n auto --dist=loadfile
          -v --tb=short

  validate-status:
    # Lightweight read-only consistency check on investigation.yaml +
    # study yamls (single-study cadence enum, focus_study existence,
    # upstream-approval ordering, per-study status alignment). See
    # scripts/validate_status.py for the 7 rules. Runs in parallel with
    # the test jobs; ~1s total — no uv sync needed, just PyYAML.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate status fields
        # exit 0 = clean, 1 = errors (fail CI), 2 = warnings only (don't fail).
        run: |
          set +e
          python scripts/validate_status.py
          code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0
