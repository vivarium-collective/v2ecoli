schema_version: 4
name: showcase-4-variant-comparison
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: "Five-variant perturbation sweep — which perturbation most clearly moves v2ecoli off baseline"
created: '2026-06-12'
status: complete   # legacy back-compat; canonical axes below

# v4 schema (vivarium_workbench.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]

# Canonical 6-axis status. The 5-variant sweep RAN (design/impl/sim complete);
# the 8 cross-variant comparison figures are rendered and the test outcomes are
# evaluated against the real measured deltas, so evaluation is evaluated and the
# gate is passed. Expert review is pending.
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

question: |
  Of the four perturbations proposed in showcase-3 (ppGpp regulation OFF, a
  dnaA 2x expression knob, a slower ribosome elongation rate, and a media /
  condition change to succinate), which one most clearly and interpretably
  moves the v2ecoli whole cell off its wild-type baseline? Run all four as a
  single multivariant sweep against the showcase-2 baseline and quantify each
  variant's delta across growth, replication, regulation, central-carbon flux,
  and proteome.

report:
  title: showcase-4 — five-variant perturbation sweep vs the wild-type baseline
  verdict: pass
  confidence: high
  evidence_quality: 5-variant x 2-seed multigen sweep + 8 cross-variant comparison figures

  objective: |
    Resolve the showcase-3 reviewer decision empirically by running ALL four
    candidate perturbations (rather than picking one) as a single 5-variant
    sweep (baseline + 4), and measure how far each variant moves the cell off
    the wild-type baseline across five readout classes: growth (doubling time,
    cell mass), replication (oriC copy number / re-initiation timing),
    regulation (ppGpp pool, tRNA charging), central-carbon metabolism (FBA flux
    + Toya-2010 correlation), and the proteome (Schmidt / Wisniewski
    correlation). The deliverable is a ranked, quantitative contrast that seeds
    the next-direction decision (showcase-5).

  setup: |
    Sweep: 5 variants x 2 seeds, resumed from the showcase-1 full ParCa caches.
    Variant 0 baseline / 1 ppgpp-off / 2 dnaA-2x / 3 elong-down all run on the
    glucose cache (out/cache-showcase, 51-condition full ParCa); variant 4
    media-succinate runs on its OWN succinate cache (out/cache-succinate,
    condition=succinate / fixed_media=minimal_succinate). Generations vary by
    phenotype and are themselves a contrast: baseline / dnaA-2x / elong-down /
    media reach 3 generations, ppgpp-off only 2 (it grows slower). max_steps
    6500/cell; total sweep wall ~2982 s on the mac mini.
    Variant levers (config_overrides on the runner):
      - ppgpp-off  = ecoli-transcript-initiation.ppgpp_regulation=False +
                     ecoli-polypeptide-elongation.ppgpp_regulation=False,
                     DEFAULT_FEATURES dropped.
      - dnaA-2x    = ecoli-transcript-initiation.perturbations
                     {TU00259[c]: 2.117e-5} (2x the basal 1.058e-5 init prob).
      - elong-down = ecoli-polypeptide-elongation.basal_elongation_rate 22->15.4.
      - media      = succinate cache (condition=succinate,
                     fixed_media=minimal_succinate); no config_override.
    The 8 cross-variant comparison analyses (v2ecoli/workflow/analyses/
    {growth_overlay, doubling_time_grouped, mass_fraction_grouped,
    replication_overlay, proteome_delta, fba_flux_overlay, regulation_overlay,
    scorecard}) consumed the sweep's hive-partitioned parquet directly; sim_data
    was hydrated from the showcase ParCa fixture
    (out/sim_data-showcase/parca_state.pkl.gz via hydrate_sim_data_from_state)
    and Schmidt/Wisniewski + Toya-2010 validation data attached. Figures
    rendered to PNG+SVG via scripts/render_variant_comparison.py with the real
    variant_metadata {0:baseline, 1:ppgpp-off, 2:dnaA-2x, 3:elong-down,
    4:media-succinate}.

  result: |
    Measured per-variant scorecard (delta vs baseline; from the scorecard /
    doubling_time_grouped / regulation_overlay / replication_overlay /
    fba_flux_overlay / proteome_delta figures):

      metric            baseline  ppgpp-off  dnaA-2x  elong-down  media-succinate
      doubling (min)      51.1      61.6      48.4      49.3        52.9
      dry mass (fg)        492       510       489       487         271   <- -45%
      protein fraction    0.461     0.430     0.453     0.435       0.532  <- +0.07
      max oriC               4         4         4         4           2   <- never multiforks
      mean ppGpp          64.8     120.6      67.9      61.2        56.4   <- 1.86x (ppgpp-off)
      Schmidt r          0.734     0.696     0.737     0.741       0.716
      Toya r             0.727     0.764     0.457     0.698      -0.058   <- collapses (succinate)

    Strongest, most interpretable contrast = media-succinate: dry mass nearly
    halved (271 vs 492 fg), the cell never multiforks (max oriC stays 2 vs 4),
    protein fraction rises to 0.532, and the central-carbon FBA flux distribution
    decorrelates from the glucose-grown Toya-2010 measurements (Toya r collapses
    from 0.73 to -0.06, with the largest flux shifts on the TCA / succinate-entry
    reactions: SUCCINATE-DEHYDROGENASE, 2OXOGLUTARATEDEH, MALATE-DEH).
    Second strongest = ppgpp-off: the ppGpp pool RISES to ~230 by end-of-run
    (mean 120.6, 1.86x baseline) rather than collapsing, and growth slows the
    most (doubling 61.6 min, +10.5; only 2 generations reached). This is the
    honest, slightly counter-intuitive result — disabling ppGpp *regulation*
    (the feedback the ribosome/RNAP allocation reads) does NOT stop ppGpp
    *synthesis*, so without the feedback ppGpp accumulates and growth falls.
    dnaA-2x is a PARTIAL contrast: it does NOT raise the max oriC count above
    baseline (both peak at 4), but it advances the timing of replication
    re-initiation (the dnaA-2x oriC curve rises to 4 earlier and re-initiates
    earlier in the second cycle) and it noticeably degrades the central-carbon
    flux match (Toya r 0.727 -> 0.457). elong-down is the WEAKEST contrast: the
    22->15.4 basal-elongation-rate cut barely moves the cap-immune doubling time
    (49.3 vs 51.1 min, actually marginally faster), and its proteome / mass /
    replication readouts are essentially baseline — the steady-state charging
    model and variable-elongation machinery appear to compensate. tRNA charged
    fraction stays ~0.97 across ALL variants. The proteome is the least
    discriminating axis overall: every variant stays tightly correlated to the
    baseline proteome (Schmidt r 0.70-0.74, Wisniewski ~0.61 across the board).

  interpretation: |
    Running all four candidates rather than choosing one was the right call: it
    converted the showcase-3 reviewer decision into a measured ranking. The
    media / condition change is the most demonstrative single perturbation —
    it moves the cell off baseline on FOUR independent axes at once (mass,
    replication, composition, central-carbon flux) and the Toya-r collapse is a
    clean, physiologically-grounded signature of a different carbon source. The
    ppGpp-off result is the most scientifically informative surprise: the
    regulatory knock-out does not silence ppGpp, it de-represses it, so the
    "ppGpp collapse" intuition is wrong for this lever — worth flagging to
    reviewers. dnaA-2x demonstrates the targeted gene-knob path works (it shifts
    replication timing + central-carbon flux) but does not push the discrete
    oriC ceiling, so its contrast is real but subtle. elong-down is a near-null
    at this magnitude — a useful negative control, but not a compelling showcase
    perturbation on its own.

  decision: |
    PASS — the 5-variant sweep ran to completion and the 8 cross-variant
    comparison figures resolve the showcase-3 decision with measured deltas.
    Three of the four perturbations produce a clear, interpretable contrast vs
    baseline (media-succinate strongest, ppgpp-off second, dnaA-2x partial); the
    fourth (elong-down) is a near-null at this magnitude. The gate passes,
    unblocking showcase-5 (the next-direction decision), which is seeded below
    to deepen the strongest contrast (media / growth-condition response) and to
    chase the ppGpp-off surprise.

# --- v4 narrative-spine sections (filled from this study's recorded results) ---
study_card:
  phase: Simulate / Evaluate
  one_liner: "Run all four showcase-3 candidate perturbations as a single 5-variant × 2-seed sweep and rank how far each moves the cell off the wild-type baseline."
  status: complete
  headline: "PASS — media-succinate strongest (mass halved, never multiforks, Toya r collapses to -0.06); ppgpp-off de-represses ppGpp (1.86x) + slows growth most; dnaA-2x partial; elong-down near-null (negative control)."

runtime:
  wall_seconds: 2982
  dispatch: multivariant sweep (5 variants × 2 seeds)
  scale: 6500 steps/cell; generations vary by phenotype (baseline/dnaA-2x/elong-down/media reach 3, ppgpp-off 2)
  hardware: Mac mini

readouts:
- {name: doubling-time-per-variant, description: "cap-immune doubling time per variant (growth)"}
- {name: mass-per-variant, description: "dry mass + mass fractions per variant (composition)"}
- {name: oric-per-variant, description: "oriC copy number over the cell cycle (replication / multifork timing)"}
- {name: regulation-per-variant, description: "ppGpp pool + tRNA charged fraction (regulation)"}
- {name: fba-flux-per-variant, description: "central-carbon FBA flux delta + Toya-2010 correlation per variant (metabolism)"}
- {name: proteome-per-variant, description: "proteome log-log vs baseline + Schmidt / Wisniewski correlation per variant"}

enforced_params:
- {name: "ppgpp-off", value: "ecoli-transcript-initiation.ppgpp_regulation=False + ecoli-polypeptide-elongation.ppgpp_regulation=False, DEFAULT_FEATURES dropped"}
- {name: "dnaA-2x", value: "ecoli-transcript-initiation.perturbations {TU00259[c]: 2.117e-5} (2x basal 1.058e-5)"}
- {name: "elong-down", value: "ecoli-polypeptide-elongation.basal_elongation_rate 22 -> 15.4 aa/s (0.7x)"}
- {name: "media-succinate", value: "succinate cache (condition=succinate, fixed_media=minimal_succinate); no process override"}

biological_summary: |
  A perturbation-response demonstration: each variant is a single mechanistic
  lever (a regulatory toggle, a gene-expression knob, a translation-rate cut, or
  a carbon-source change) applied to the validated wild-type baseline. Measuring
  the delta across five readout classes (growth / replication / regulation /
  central-carbon flux / proteome) shows which perturbation most clearly and
  interpretably moves the whole cell off baseline — converting the showcase-3
  reviewer decision into a measured ranking.

literature_anchors:
- {cite: macklin2020, note: "The Covert-lab whole-cell model; the baseline (variant 0) and its Toya-2010 FBA-flux + Schmidt/Wisniewski proteome validation surfaces come from this WCM."}

# Structured bibliography (resolved in references/papers.bib) so the report's
# References section renders the validation-data anchors this study reports
# against per variant: Toya 2010 (central-carbon FBA flux r), Schmidt 2016 +
# Wisniewski 2014 (proteome r).
bibliography:
  bib_keys:
  - macklin2020
  - toya2010
  - schmidt2016
  - wisniewski2014

model_change: |
  Four process-level perturbations against the baseline (see enforced_params /
  conditions.variants): ppGpp regulation toggle, dnaA (TU00259[c]) init-prob 2x,
  ribosome basal_elongation_rate 0.7x, and a glucose->succinate media change
  (run on its own full ParCa cache). monomer_counts uses the corrected SET
  listener (#185, overwrite[monomer_counts_vec]).

implementation_requirements: |
  A 5-variant × 2-seed multigen sweep resumed from the showcase-1 full ParCa
  caches (out/cache-showcase for glucose variants; out/cache-succinate for
  media-succinate); config_overrides on the runner for the three process levers;
  the 8 cross-variant comparison analyses (v2ecoli/workflow/analyses/) reading
  the hive-partitioned parquet with a real variant_metadata int->name map; sim_data
  hydrated from out/sim_data-showcase/parca_state.pkl.gz; figures via
  scripts/render_variant_comparison.py.

design_pivot_required: false

conclusion_verdicts:
- {claim: "media-succinate is the strongest, most interpretable contrast", verdict: supported, basis: "moves 4 axes at once — dry mass 271 vs 492 fg, max oriC 2 vs 4, protein 0.532, Toya r 0.73 -> -0.06"}
- {claim: "ppgpp-off de-represses (not collapses) the ppGpp pool and slows growth most", verdict: supported, basis: "mean ppGpp 64.8 -> 120.6 (1.86x), trace climbs to ~230; doubling +10.5 min, only 2 gens"}
- {claim: "dnaA-2x advances re-init timing + drops Toya r but does not raise the oriC ceiling", verdict: partial, basis: "Toya r 0.727 -> 0.457; max oriC both peak at 4"}
- {claim: "elong-down (0.7x) is a near-null negative control", verdict: supported, basis: "doubling -1.8 min (within ±3 of baseline); mass/proteome/replication ~baseline — compensated"}

conclusion_logic:
  if_primary_tests_pass:
    summary: "The 5-variant sweep ran to completion and produced a measured, ranked contrast that resolves the showcase-3 reviewer decision empirically (media-succinate strongest, ppgpp-off second, dnaA-2x partial, elong-down a near-null negative control), so showcase-5 (the next-direction decision) is unblocked."
    block_downstream: false
    pipeline_unblocks: [showcase-5-next-direction-decide]
    biological_validation: "Three of four levers move the cell off baseline in mechanistically-interpretable ways; the fourth is a clean, informative negative control. The ppGpp-off de-repression is the most scientifically informative surprise."
  if_primary_tests_fail:
    summary: "If the sweep had not separated the variants (no measurable contrast on any axis, or the baseline reference itself off-band), the ranking would be untrustworthy and the next-direction decision could not be seeded."
    block_downstream: true
    diagnose: [no ppGpp perturbation under ppgpp-off, no Toya-r shift under dnaA-2x or media, baseline reference off-band]
    biological_validation: "A sweep with no separable contrasts would mean either the levers are inert or the baseline is mis-calibrated — either way the ranking would not be a trustworthy basis for showcase-5."

simulation_set:
- name: showcase4-variant-sweep
  kind: simulation
  status: complete
  base_model: baseline
  duration_steps: 6500
  seeds: "0–1 (2 seeds) × 5 variants; generations vary by phenotype (2–3)"
  metrics: [doubling time, dry mass, mass fractions, max oriC, mean ppGpp, Schmidt r, Toya r]
  pass_fail_tests: [ppgpp-off-perturbs-ppgpp-and-growth, dnaa-2x-shifts-replication-and-flux, elong-down-is-near-null-negative-control, media-shifts-central-carbon-flux]

conditions:
  baseline:
    composite: baseline
    params:
      seed: 0
      cache_dir: out/cache-showcase
    # The baseline condition is variant 0 of the sweep (glucose, full ParCa
    # cache); it is the reference all per-variant deltas are taken against.
  variants:
  - name: ppgpp-off
    variant_index: 1
    cache_dir: out/cache-showcase
    perturbation: "ppGpp regulation OFF"
    config_overrides:
      ecoli-transcript-initiation.ppgpp_regulation: false
      ecoli-polypeptide-elongation.ppgpp_regulation: false
    drop_default_features: true
    expected_contrast: "ppGpp regulatory feedback removed -> growth-rate / allocation response"
    measured_contrast: "PARTIAL-as-expected: growth slows MOST (doubling 61.6 min, +10.5; only 2 gens reached) but the ppGpp pool RISES (mean 120.6, 1.86x baseline; trace climbs to ~230) rather than collapsing — disabling regulation de-represses synthesis."
  - name: dnaA-2x
    variant_index: 2
    cache_dir: out/cache-showcase
    perturbation: "dnaA (TU00259[c]) transcription-init probability 2x basal"
    config_overrides:
      ecoli-transcript-initiation.perturbations:
        "TU00259[c]": 2.1166695712115088e-05   # 2x basal 1.0583347856057544e-05
    drop_default_features: false
    expected_contrast: "more DnaA -> earlier / more replication initiation (raised oriC)"
    measured_contrast: "PARTIAL: does NOT raise max oriC (both peak at 4) but ADVANCES re-initiation timing (oriC->4 earlier; earlier 2nd-cycle re-init) and degrades central-carbon flux match (Toya r 0.727 -> 0.457)."
  - name: elong-down
    variant_index: 3
    cache_dir: out/cache-showcase
    perturbation: "ribosome basal_elongation_rate 22 -> 15.4 aa/s (0.7x)"
    config_overrides:
      ecoli-polypeptide-elongation.basal_elongation_rate: 15.399999999999999
    drop_default_features: false
    expected_contrast: "slower translation -> longer doubling time"
    measured_contrast: "WEAK / near-null: cap-immune doubling time barely moves (49.3 vs 51.1 min, marginally FASTER not slower); mass / proteome / replication ~baseline. tRNA charging + variable-elongation appear to compensate at this magnitude."
  - name: media-succinate
    variant_index: 4
    cache_dir: out/cache-succinate
    perturbation: "growth condition glucose -> succinate (own full ParCa cache)"
    config_overrides: {}   # the lever is the cache/condition, not a process override
    condition: succinate
    fixed_media: minimal_succinate
    drop_default_features: false
    expected_contrast: "different carbon source -> shifted central-carbon flux + slower growth"
    measured_contrast: "STRONGEST: dry mass nearly halved (271 vs 492 fg), never multiforks (max oriC 2 vs 4), protein fraction up to 0.532, and Toya-2010 central-carbon flux correlation collapses 0.727 -> -0.058 (largest shifts on TCA / succinate-entry reactions)."
  model_settings:
  - name: multivariant-multiseed-sweep
    detail: "5 variants x 2 seeds, resumed from the showcase-1 full ParCa caches; baseline + 3 levers on out/cache-showcase, media-succinate on its own out/cache-succinate."
  - name: generations-vary-by-phenotype
    detail: "baseline / dnaA-2x / elong-down / media reach 3 generations; ppgpp-off only 2 (it grows slower) — itself a contrast."
  - name: cross-variant-comparison-analyses
    detail: "8 overlay/group/delta analyses (v2ecoli/workflow/analyses/) read the sweep parquet with a real variant_metadata int->name map; rendered via scripts/render_variant_comparison.py."

assumptions:
- text: |
    The showcase-2 wild-type baseline (variant 0) is validated, so each
    variant's delta is a clean contrast against a trusted reference.
  verified_in_v2ecoli: true
- text: |
    The four perturbations are the four candidates proposed in showcase-3
    (ppGpp-off, dnaA knob, elongation-rate sweep point, media change); running
    all four resolves the showcase-3 reviewer decision empirically.
  verified_in_v2ecoli: true
- text: |
    monomer_counts is the corrected SET listener (#185, overwrite[monomer_counts_vec])
    so each row carries the instantaneous proteome (not an accumulating sum);
    the proteome_delta / scorecard Schmidt/Wisniewski correlations rely on this.
  verified_in_v2ecoli: true

tests:
- name: ppgpp-off-perturbs-ppgpp-and-growth
  classification: primary
  status: passed
  question: "Does disabling ppGpp regulation measurably perturb the ppGpp pool and slow growth vs baseline?"
  measure:
    kind: scorecard_delta
    metric: mean ppGpp (ppgpp-off) / mean ppGpp (baseline)
    detail: "Ratio of the ppgpp-off mean ppGpp pool to baseline; pass if it moves substantially off 1.0 (direction-agnostic). Cross-checked against doubling time (expect slower)."
  # No published source: the [1.5, 3.0] band is an OPERATIONAL "substantially off
  # 1.0" threshold chosen for this demonstrative sweep, not a literature value.
  # GAP — no real bib_key exists, so none is invented (band_test_missing_cites
  # stays as an honest, reported gap).
  cites_note: "Operational threshold for the demonstrative sweep — not literature-sourced; no real bib_key available."
  pass_if:
    op: in_range
    low: 1.5
    high: 3.0
- name: dnaa-2x-shifts-replication-and-flux
  classification: primary
  status: partial
  question: "Does the dnaA-2x knob shift replication initiation and/or the central-carbon flux match vs baseline?"
  measure:
    kind: scorecard_delta
    metric: Toya r (baseline) - Toya r (dnaA-2x)
    detail: "Drop in the Toya-2010 central-carbon flux correlation under dnaA-2x (proxy for the metabolic shift), plus a qualitative check that oriC re-initiation timing advances. NOTE: max oriC does NOT increase (both peak at 4) so the naive 'raises oriC count' expectation FAILS; the contrast is in timing + flux."
  cites_note: "Operational threshold for the demonstrative sweep — not literature-sourced; no real bib_key available."
  pass_if:
    op: in_range
    low: 0.15
    high: 0.50
- name: elong-down-is-near-null-negative-control
  classification: negative_control
  status: passed
  # NEGATIVE CONTROL. The pre-run HYPOTHESIS was that a 22->15.4 aa/s (0.7x)
  # elongation-rate cut would lengthen the doubling time (expected +3..+30 min).
  # That hypothesis was DISPROVEN: the measured delta is marginally negative
  # (-1.8 min). The study's validated finding is therefore that elong-down is a
  # near-null — at this magnitude the steady-state-charging + variable-elongation
  # machinery compensates and growth does NOT slow. This test asserts that
  # validated finding (near-baseline doubling time), so it PASSES as a control;
  # the disproven slowdown hypothesis is documented in full in the detail/outcome.
  question: "Is the 0.7x ribosome elongation-rate cut a near-null on growth (doubling time within ±3 min of baseline), i.e. a clean negative control rather than a contrast?"
  measure:
    kind: scorecard_delta
    metric: doubling time (elong-down) - doubling time (baseline)   # minutes
    detail: "Cap-immune doubling-time delta under elong-down. The pre-run hypothesis (slower translation -> +3..+30 min) did NOT hold; measured -1.8 min (49.3 - 51.1), within ±3 min of baseline = near-null. Compensated by steady-state charging + variable elongation."
  cites_note: "Operational near-null window (±3 min) for the demonstrative sweep — not literature-sourced; no real bib_key available."
  pass_if:
    op: in_range
    low: -3.0
    high: 3.0
- name: media-shifts-central-carbon-flux
  classification: primary
  status: passed
  question: "Does the succinate media change shift the central-carbon flux distribution (decorrelate from glucose-grown Toya-2010) and slow growth?"
  measure:
    kind: scorecard_delta
    metric: Toya r (baseline) - Toya r (media-succinate)
    detail: "Drop in the Toya-2010 central-carbon flux correlation under succinate (0.727 -> -0.058 = 0.785 drop). Cross-checked against dry mass (halved) and max oriC (2 vs 4)."
  # The Toya-2010 dataset is the reference, but it is not in references/papers.bib
  # and the [0.40, 1.50] r-drop band is an operational threshold, not a published
  # value. GAP — no real bib_key invented.
  cites_note: "Operational threshold for the demonstrative sweep — not literature-sourced; the Toya 2010 reference dataset is not in references/papers.bib, so no real bib_key available."
  pass_if:
    op: in_range
    low: 0.40
    high: 1.50

discovery_implications:
  resolved_uncertainties:
  - "showcase-3's open reviewer decision is resolved empirically: all four candidate perturbations were run as a 5-variant sweep, and the media / condition change is the most demonstrative single perturbation (moves the cell off baseline on mass, replication, composition, and central-carbon flux simultaneously)."
  - "ppGpp-off does NOT collapse the ppGpp pool — it de-represses it (mean ppGpp 64.8 -> 120.6, 1.86x; trace climbs to ~230). Disabling ppGpp *regulation* removes the feedback the allocation reads but not ppGpp *synthesis*. Growth slows the most (doubling +10.5 min, only 2 gens)."
  - "dnaA-2x advances replication re-initiation TIMING and degrades the central-carbon flux match (Toya r 0.727 -> 0.457) but does NOT raise the discrete max oriC ceiling (both peak at 4)."
  - "media-succinate's central-carbon FBA flux decorrelates from the glucose-grown Toya-2010 measurements (Toya r collapses to -0.058), with the largest flux shifts on the TCA / succinate-entry reactions — a clean carbon-source signature."
  remaining_uncertainties:
  - "elong-down is a near-null at the 0.7x magnitude (doubling 49.3 vs 51.1 min) — the steady-state charging + variable-elongation machinery appears to compensate. Whether a larger cut (e.g. 0.4-0.5x) or a different translation knob produces a graded slowdown is open."
  - "The proteome is the least discriminating axis: all variants stay at Schmidt r 0.70-0.74 / Wisniewski ~0.61. Whether a coarser-grained or pathway-resolved proteome readout would separate the variants is open."
  - "tRNA charged fraction is pinned at ~0.97 across every variant including ppgpp-off and elong-down — the charging model may be insensitive to these levers, or the readout saturates."
  followup_study_proposals:
  - id: deepen-media-growth-condition-response
    title: "Deepen the strongest contrast — media / growth-condition response (dose of carbon sources)"
    study_type: condition-sweep
    source_trigger: showcase-4-strongest-contrast
    proposed_experiment: |
      Run a small panel of growth conditions (e.g. glucose, succinate, acetate,
      glycerol, +amino-acids), each with its own full ParCa cache, and chart the
      growth rate / central-carbon flux (Toya-r) / mass-composition response as a
      function of carbon source. Builds directly on media-succinate, the
      strongest showcase-4 contrast.
    expected_information_gain: high
    effort: high   # one full ParCa cache per condition (~2.5 min each)
    expert_gate_required: true
  - id: chase-ppgpp-off-de-repression
    title: "Chase the ppGpp-off surprise — why does the pool rise, not collapse?"
    study_type: mechanism-probe
    source_trigger: showcase-4-counterintuitive-result
    proposed_experiment: |
      Decompose the ppGpp-off result: separate ppGpp *synthesis* (RelA/SpoT)
      from the *regulatory* coupling, and test whether toggling synthesis vs
      regulation independently reproduces the rise. Adds a synthesis-off /
      regulation-off 2x2 to confirm the de-repression mechanism.
    expected_information_gain: high
    effort: medium
    expert_gate_required: true

pipeline_gate:
  prerequisites:
  - showcase-2-baseline-figures
  enables:
  - showcase-5-next-direction-decide
  gate_status: passed

runs:
- name: showcase4-variant-sweep
  status: completed
  kind: simulation
  canonical: true
  description: |
    5-variant x 2-seed multigen sweep on the mac mini, resumed from the
    showcase-1 full ParCa caches. Variant 0 baseline / 1 ppgpp-off / 2 dnaA-2x /
    3 elong-down on out/cache-showcase (glucose, 51-condition full ParCa);
    variant 4 media-succinate on out/cache-succinate (condition=succinate /
    fixed_media=minimal_succinate). Generations vary by phenotype: baseline /
    dnaA-2x / elong-down / media reach 3 generations, ppgpp-off only 2.
    max_steps 6500/cell; total sweep wall ~2982 s. Hive-partitioned parquet
    history (experiment_id=showcase4_variants / variant / lineage_seed /
    generation / agent_id). The 8 cross-variant comparison analyses
    (v2ecoli/workflow/analyses/) consumed the parquet directly; sim_data
    hydrated from out/sim_data-showcase/parca_state.pkl.gz; Schmidt/Wisniewski +
    Toya-2010 validation attached. 8 figures rendered to PNG+SVG via
    scripts/render_variant_comparison.py with variant_metadata
    {0:baseline, 1:ppgpp-off, 2:dnaA-2x, 3:elong-down, 4:media-succinate}.
  dispatch: sweep
  emitter: parquet
  cache_dir: out/cache-showcase + out/cache-succinate
  wall_seconds: 2982
  parquet: .pbg/runs/showcase4-variants/showcase4_variants
  result: PASS
  outcomes:
    # All authored outcome keys are lowercase to match their tests[].name EXACTLY
    # (per the #182 fix) so the report surfaces the authored result pill.
    ppgpp-off-perturbs-ppgpp-and-growth:
      result: PASS
      detail: "ppGpp-off mean ppGpp 120.6 vs baseline 64.8 = 1.86x (in [1.5, 3.0]); doubling time 61.6 vs 51.1 min (+10.5, slowest of all variants; only 2 generations reached). NOTE: the pool RISES (de-repression), it does not collapse — the trace climbs to ~230 by end-of-run."
    dnaa-2x-shifts-replication-and-flux:
      result: PARTIAL
      detail: "Toya r drop 0.727 - 0.457 = 0.270 (in [0.15, 0.50]); re-initiation timing advances (oriC reaches 4 earlier, earlier 2nd-cycle re-init). BUT max oriC does NOT increase (both peak at 4), so the naive 'raises oriC count' expectation fails — the contrast is in timing + flux, hence PARTIAL."
    elong-down-is-near-null-negative-control:
      result: PASS
      detail: "NEGATIVE CONTROL passes: doubling-time delta 49.3 - 51.1 = -1.8 min, within ±3 min of baseline = near-null. The pre-run slowdown hypothesis (expected +3..+30 min) was DISPROVEN — the 22->15.4 aa/s cut does NOT slow growth; mass / proteome / replication stay ~baseline. Steady-state charging + variable elongation compensate at 0.7x. The informative null seeds showcase-5 candidate D (a wider translation-rate sweep to find where compensation breaks)."
    media-shifts-central-carbon-flux:
      result: PASS
      detail: "Toya r drop 0.727 - (-0.058) = 0.785 (in [0.40, 1.50]) — the central-carbon flux decorrelates from glucose-grown Toya-2010; largest shifts on TCA / succinate-entry reactions. Cross-checks: dry mass halved (271 vs 492 fg), never multiforks (max oriC 2 vs 4), protein fraction up to 0.532. Strongest contrast of the sweep."

visualizations:
# --- Scorecard (headline) ---
- name: variant scorecard (delta vs baseline)
  address: image:charts/scorecard.png
  config:
    title: "Variant scorecard — 7 metrics x 5 variants, colored by normalized delta vs baseline"
    caption: >-
      The headline summary: each cell is a measured metric (doubling time,
      dry mass, protein fraction, max oriC, mean ppGpp, Schmidt r, Toya r) for
      each variant, colored by its normalized delta vs baseline. media-succinate
      is the strongest multi-axis contrast (dry mass 271, max oriC 2, Toya r
      -0.058, protein 0.532); ppgpp-off is strongest on regulation/growth
      (ppGpp 121, doubling 61.6); dnaA-2x is partial (Toya r 0.457); elong-down
      is near-baseline.
  chart: heatmap
  source_run: showcase4-variant-sweep
  render: scorecard (multivariant) over the 5-variant sweep
# --- Growth & mass ---
- name: growth overlay (cell mass + instantaneous growth rate)
  address: image:charts/growth_overlay.png
  config:
    title: "Cell mass + instantaneous growth rate, all 5 variants overlaid"
    caption: >-
      media-succinate (green) has the lowest cell-mass trajectory (~270 vs ~490
      fg) and lowest growth rate; ppgpp-off's instantaneous growth rate decays
      over the run. Other variants track baseline.
  chart: line
  source_run: showcase4-variant-sweep
  render: growth_overlay (multivariant) over the sweep
- name: doubling time per variant
  address: image:charts/doubling_time_grouped.png
  config:
    title: "Cap-immune doubling time per variant (ln2/mean mu)"
    caption: >-
      ppgpp-off is the slowest (mean 61.6 min, wide spread to 77 min);
      dnaA-2x fastest (48.4); elong-down ~baseline (49.3, the weak contrast);
      media-succinate slightly slow (52.9).
  chart: box
  source_run: showcase4-variant-sweep
  render: doubling_time_grouped (multivariant) over the sweep
- name: mass fractions per variant
  address: image:charts/mass_fraction_grouped.png
  config:
    title: "Mean dry-mass fractions per variant (protein / rRNA / tRNA / DNA / small-mol)"
    caption: >-
      media-succinate shifts composition most — protein up to 0.532 and
      small-mol down to 0.325; the other variants cluster near baseline.
  chart: bar
  source_run: showcase4-variant-sweep
  render: mass_fraction_grouped (multivariant) over the sweep
# --- Replication ---
- name: replication overlay (oriC copy number)
  address: image:charts/replication_overlay.png
  config:
    title: "Number of oriC over the cell cycle, all 5 variants overlaid"
    caption: >-
      baseline / ppgpp-off / dnaA-2x / elong-down all multifork to 4 oriC;
      dnaA-2x and elong-down reach 4 slightly EARLIER (advanced re-initiation).
      media-succinate never multiforks (stays 1->2), reflecting slow growth /
      no overlapping rounds — the clearest replication contrast.
  chart: line
  source_run: showcase4-variant-sweep
  render: replication_overlay (multivariant) over the sweep
# --- Regulation ---
- name: regulation overlay (ppGpp + tRNA charging)
  address: image:charts/regulation_overlay.png
  config:
    title: "ppGpp pool + tRNA charged fraction over the cell cycle, all 5 variants"
    caption: >-
      ppgpp-off (orange) ppGpp RISES to ~230 by end-of-run (highest of all,
      de-repression — NOT a collapse); other variants stay ~50-85. tRNA charged
      fraction is pinned at ~0.97 across every variant.
  chart: line
  source_run: showcase4-variant-sweep
  render: regulation_overlay (multivariant) over the sweep
# --- Metabolism ---
- name: central-carbon FBA flux delta + Toya correlation
  address: image:charts/fba_flux_overlay.png
  config:
    title: "Central-carbon flux delta vs baseline (per reaction) + Toya-2010 r per variant"
    caption: >-
      media-succinate produces the largest central-carbon flux shifts (TCA /
      succinate-entry reactions) and its Toya-2010 correlation collapses to
      -0.058 (baseline 0.727); dnaA-2x drops Toya r to 0.457; ppgpp-off slightly
      raises it to 0.764.
  chart: bar
  source_run: showcase4-variant-sweep
  render: fba_flux_overlay (multivariant) over the sweep
# --- Proteome ---
- name: proteome delta vs baseline + validation r
  address: image:charts/proteome_delta.png
  config:
    title: "Per-variant proteome vs baseline (log-log) + Schmidt / Wisniewski r per variant"
    caption: >-
      The least-discriminating axis: every variant hugs the baseline proteome
      diagonal and the validation correlation stays flat (Schmidt r 0.70-0.74,
      Wisniewski ~0.61). ppgpp-off shows the most scatter (Schmidt 0.696).
      Uses the corrected SET monomer_counts (#185).
  chart: scatter
  source_run: showcase4-variant-sweep
  render: proteome_delta (multivariant) over the sweep

