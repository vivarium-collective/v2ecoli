schema_version: 4
name: param-uq-05-strain-design
investigation: parameter-uq
title: "Strain-design UQ — which new-gene knob (expression vs translation efficiency) drives product/growth variance, decomposed across aggregation strategies 1–3"
created: '2026-08-15'
status: evaluated_smoke

# Canonical 6-axis status. GFP-new-gene sim_data BUILT (fitSimData_1,
# new_genes_option='gfp'; gate passed), pbg-uq new-gene driver WIRED and RUN as a
# SMOKE ensemble (n=12+3 test, 3 seeds, 1 generation, 700 steps). A production
# ensemble (n=24+4 test, 3 seeds, up to 3 generations, 4000 steps) is running in
# the background on the mini. Results below are REAL smoke numbers, labelled
# preliminary; the by-generation strategy and a converged budget await production.
design_status: complete
implementation_status: complete       # GFP build + new-gene driver + aggregation strategies 1–3 all working
simulation_status: partial            # smoke ensemble complete; production ensemble running (background)
evaluation_status: partial            # strategies 1 & 3 evaluated (smoke); strategy 2 by-generation + converged budget pending production
gate_status: partial                  # pipeline-runs gate PASSED; robustness + GFP adversarial-null + by-generation gates NOT yet passed at smoke budget
expert_review_status: pending

# Investigation-graph node fields.
claim: |
  SMOKE (preliminary). A GFP new-gene strain built via fitSimData_1
  (new_genes_option='gfp') runs end-to-end through the pbg-uq forward-UQ pipeline
  when the two public new_gene_internal_shift knobs (exp, trl_eff) are swept.
  For NEW-GENE PRODUCT LEVEL, expression (exp, total-order Sobol 0.49) and
  translation efficiency (trl_eff, 0.46) are CO-DOMINANT under population
  aggregation — refuting the pre-registered "exp dominates" hypothesis — but the
  GFP surrogate is under-resolved at this budget (51% held-out test error, inert
  decoy leaks 0.11 > 0.05 null band), so the product-level ranking is qualitative
  only. For GROWTH RATE, trl_eff dominates (0.86) over exp (0.51) with a clean
  adversarial null (decoy 0.039) and 10% test error — the more trustworthy
  finding. The dominant knob is NOT robust across seeds (argmax flips: seeds 0,1
  → trl_eff, seed 2 → exp). Aggregation strategies 1 (population) and 3 (by-seed)
  are computed from one ensemble; strategy 2 (by-generation) is pending, as no
  cell division occurred in the 700-step smoke window (single generation only).
confidence: Low (smoke/preliminary — production ensemble in progress)

question: |
  For a GFP new-gene strain-design use case in v2ecoli: (1) does the pbg-uq
  forward-UQ pipeline run end-to-end when the swept knobs are new-gene
  expression + translation-efficiency factors (public new_gene_internal_shift)?
  (2) Which knob dominates variance in new-gene product level and in growth rate?
  (3) Does the dominant-knob ranking depend on the aggregation strategy — a single
  bulk-population average (strategy 1), stratified by generation across the
  induction shift (strategy 2), or stratified by stochastic seed (strategy 3)?

hypothesis: |
  Expression (exp) is the dominant lever on new-gene product level (a direct
  transcription-level scaling), while translation efficiency (trl_eff) contributes
  a smaller, more interaction-laden share. Because new_gene_internal_shift induces
  at a chosen generation, the by-generation aggregation (strategy 2) is expected to
  reveal induction-timing structure that the population aggregation (strategy 1)
  averages away — i.e. the strategy choice is itself informative, not merely a
  variance-reduction knob. Growth-rate sensitivity to either knob is expected to be
  modest at the demonstration window (product expression is a small metabolic load).

objective: |
  Run a forward-UQ on a GFP new-gene v2ecoli strain, sweeping the two public
  strain-design knobs (expression, translation efficiency), to (a) rank their
  Sobol contributions to new-gene product level and growth rate, and (b)
  demonstrate the milestone's required decomposition across aggregation strategies
  1–3. This is the parameter-uq investigation's strain-design extension — the
  "systematic sweep across the full parameter space" the overview anticipates —
  and the concrete demonstration deliverable for the M8 / 08.4.2 UQ milestone,
  built natively in v2ecoli (pbg-uq) rather than the standalone uqEcoli pipeline.

description: |
  The sibling studies param-uq-00..04 established that the pbg-uq forward-UQ
  pipeline runs on the v2ecoli baseline and that, among physiological elongation
  knobs, ribosome basal_elongation_rate dominates growth-rate variance. This study
  turns the same machinery on a STRAIN-DESIGN use case: a heterologous GFP
  new-gene insert (ParCa `new_genes: gfp`), swept via the public
  new_gene_internal_shift variant's two continuous factors — expression (`exp`)
  and translation efficiency (`trl_eff`).

  Two things make it the milestone demonstration rather than another physiology
  sweep. First, the observable of interest is an ENGINEERING output — new-gene
  product level — so the Sobol ranking answers a design question ("which knob to
  turn to move product yield"). Second, the milestone explicitly requires applying
  aggregation strategies 1–3, and new_gene_internal_shift's generational induction
  makes strategy 2 (by-generation) mechanistically meaningful: the same ensemble,
  aggregated three ways, is expected to yield three readings, and the study's job
  is to report and interpret that difference — not to pick one.

  Prerequisite (hard): no existing sim_data cache carries a new gene, so a
  dedicated ParCa build with `new_genes: gfp` is required before any sampling.
  That build is the study's first implementation step and runs on the mini.

pipeline_gate:
  prerequisites:
    - param-uq-01-elongation
    - param-uq-03-growth-stratified
  proceed_condition: |
    param-uq-01-elongation.gate_status == passed (the pbg-uq forward-UQ pipeline
    runs end-to-end on v2ecoli) AND a GFP-new-gene sim_data is built and verified
    (get_new_gene_ids_and_indices returns a non-empty set).
  blocks_until_resolved: |
    Without a GFP-new-gene sim_data the strain-design knobs are inert and no
    sampling is meaningful; the GFP-ParCa build is the first implementation gate.

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    # NOTE: baseline must be built from a GFP-new-gene sim_data (ParCa
    # new_genes: gfp). Recorded as an enforced input below; wiring in progress.
  variants:
    - name: new_gene_expression
      detail: "new_gene_internal_shift exp_trl_eff.exp — factor scaling induced new-gene expression."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: new_gene_translation_efficiency
      detail: "new_gene_internal_shift exp_trl_eff.trl_eff — factor scaling induced new-gene translation efficiency."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  interventions:
    - name: aggregation-strategy-1-population
      detail: "Bulk average across all cells & timepoints (uniform)."
    - name: aggregation-strategy-2-by-generation
      detail: "Stratify by generation across the induction shift; requires generations >= 2."
    - name: aggregation-strategy-3-by-seed
      detail: "Stratify by stochastic (lineage) seed; requires multiple seeds."
    - name: adversarial-inert-knob
      detail: "A knob that SHOULD be inert for product level — a post-induction knockout_gen with expression already floored — must return near-zero Sobol, or the sensitivity readout is not trustworthy."

assumptions:
  - name: new-gene-present
    detail: |
      The strain-design knobs only do anything on a sim_data built with the
      new-gene option enabled. get_new_gene_ids_and_indices(sim_data) must return
      a non-empty GFP cistron/monomer set; a vanilla baseline errors. Verified as
      an implementation gate before sampling.
  - name: demonstration-window
    detail: |
      A short demonstration ensemble (few generations, modest sample budget) is a
      DEMONSTRATION of the strategy decomposition, not a converged full-parameter
      global sweep. Scope claims accordingly.

tests:
  - name: strain-design-uq-pipeline-runs-end-to-end
    observable: pbg-uq ensemble over the two new-gene knobs completes on a GFP sim_data
    condition: |
      A GFP-ParCa sim_data is built; PCRV sampling over (exp, trl_eff) runs
      >= 2 generations x multiple seeds; per-sample new-gene product level and
      growth rate are emitted; a PCE surrogate fits with reported test error.
    rationale: |
      The milestone's need-to-have is a working strain-design demonstration; this
      is the end-to-end liveness gate.
  - name: aggregation-strategies-1-3-decomposed
    observable: Sobol indices reported under all three aggregation strategies
    condition: |
      The same ensemble is aggregated three ways (population, by-generation,
      by-seed) and the study reports a Sobol ranking for each, plus an explicit
      statement of whether/why the rankings differ.
    rationale: |
      "Apply sensitivity analysis for aggregation strategies (1–3)" is the
      explicit milestone wording. Passing means the decomposition is present and
      interpreted, not that any particular knob wins.
  - name: dominant-knob-identified-and-robust
    observable: a ranked Sobol ordering of (exp, trl_eff) for product level, stable across seeds
    condition: |
      One knob's total-order Sobol ranking is stable across PCRV seeds (argmax
      identical), with the surrogate test error reported. Direction (exp vs
      trl_eff) is not pre-judged.
    rationale: |
      The design question ("which knob moves product yield") needs a robust,
      not a single-seed, answer.
  - name: adversarial-inert-knob-returns-null
    observable: Sobol index of the deliberately-inert knob
    condition: "The inert adversarial knob's total-order Sobol is near-zero (within noise)."
    rationale: |
      Rigor: the sensitivity readout must reject a knob that cannot affect the
      observable, or it cannot be trusted to accept one that does.

runs: []

planned_runs:
  - name: gfp-parca-build
    status: planned
    n_steps: 0
    details: |
      ParCa build with new_genes: gfp on the mini → sim_data with a GFP new gene.
      Gate: get_new_gene_ids_and_indices(sim_data) non-empty. Not a simulation
      (n_steps=0); the prerequisite build for every run below.
  - name: strain-design-screen
    status: planned
    n_steps: 120
    details: |
      Low→high screen of (exp, trl_eff) on the GFP baseline to set production
      bounds and confirm each knob moves new-gene product level; seeds [0].
  - name: strain-design-ensemble
    status: planned
    n_steps: 480
    details: |
      Production PCRV ensemble over (exp, trl_eff), >= 2 generations x 3 PCRV
      seeds [0,1,2], XArray emitter. Emits new-gene product level + growth rate
      per cell/generation so strategies 1–3 can all be computed from one ensemble.
      tests: [strain-design-uq-pipeline-runs-end-to-end,
      aggregation-strategies-1-3-decomposed, dominant-knob-identified-and-robust,
      adversarial-inert-knob-returns-null]

simulation_set:
  - name: gfp-parca-build
    kind: build
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    description: |
      DONE. Built via sims/build_gfp_sim_data.py — classic
      reconstruction.ecoli.knowledge_base_raw.KnowledgeBaseEcoli(new_genes_option='gfp')
      + fitSimData_1 (basal_expression_condition='M9 Glucose minus AAs'), 126.7s.
      GATE PASSED: get_new_gene_ids_and_indices → cistron 'NG001_RNA',
      monomer 'NG-GFP-MONOMER[c]' (monomer index 4309). One v2ecoli-integration
      patch was required: the classic DnaA_box unique-molecule schema lacks
      v2ecoli's pool_label / DnaA_bound_form fields — added before save_sim_input.
      (sim_data dill + bundle live off-repo at out/paramuq05/, ~66 MB, not committed.)
    duration_steps: 0
    seeds: [0]
    metrics: [new_gene_cistron_count]
    pass_fail_tests: []
  - name: strain-design-screen
    kind: screen
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {new_gene_internal_shift.exp_trl_eff.exp: "1e3..1e4", new_gene_internal_shift.exp_trl_eff.trl_eff: "0.5..2.0"}
    description: |
      DONE. The new-gene synth-prob baseline is ~1.7e-9 (genes near-knocked-out
      by default), so exp factors O(1) give ~0 GFP. Screen (exp ∈ {1,10,100,
      1000,10000}, trl=1, 1000 steps) gave GFP counts 0 / 1 / 3 / 30 / 409 → the
      PRODUCTIVE expression-factor range is [1e3, 1e4]. This replaces the
      pre-screen placeholder bounds [0.5,5.0] (study.yaml anticipated this screen).
    duration_steps: 1000
    seeds: [0]
    metrics: [new_gene_product_level]
    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end]
  - name: strain-design-ensemble-smoke
    kind: uq-ensemble
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {sampler: PCRV, knobs: [exp, trl_eff, inert_decoy], n_train: 12, n_test: 3, seeds: 3, generations: 1, steps: 700}
    description: |
      DONE (smoke). PCRV ensemble over (exp, trl_eff) + an adversarial inert decoy
      knob; order-2 PCE + analytic Sobol under aggregation strategies 1 & 3
      (strategy 2 single-generation only — no division in the 700-step window).
      45 records in 35.5 min. Results in results_smoke/sobol.json; figures in charts/.
    duration_steps: 700
    seeds: [0, 1, 2]
    metrics: [new_gene_product_level, instantaneous_growth_rate, sobol_indices_per_strategy, pce_test_error]
    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end, aggregation-strategies-1-3-decomposed, dominant-knob-identified-and-robust, adversarial-inert-knob-returns-null]
  - name: strain-design-ensemble-production
    kind: uq-ensemble
    status: running
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {sampler: PCRV, knobs: [exp, trl_eff, inert_decoy], n_train: 24, n_test: 4, seeds: 3, generations: 2, steps: 1500}
    description: |
      RUNNING in background on the mini (nohup; ~2.3 h). Doubles the sample
      budget (24+4 vs 12+3) and the per-cell window (1500 vs 700 steps) to
      resolve the GFP surrogate — the smoke's GFP PCE has 51% held-out test
      error and the inert decoy leaks 0.11 — and to retest argmax robustness at
      a real budget. Will overwrite results_smoke's numbers below when complete.

      KNOWN LIMITATION — by-generation (strategy 2) is still blocked: v2ecoli's
      run_multigen_xarray daughter-cell setup reads the cache from the default
      `out/cache/initial_state.json`, but this driver builds each sample's
      variant sim_data into a per-sample TEMP cache, so at the division point the
      run raises `DIVISION FAILED: FileNotFoundError out/cache/initial_state.json`
      and stays single-generation. A genuine by-generation decomposition needs
      that daughter-cache path threaded through (follow-up), not just more steps.
    duration_steps: 1500
    seeds: [0, 1, 2]
    metrics: [new_gene_product_level, instantaneous_growth_rate, sobol_indices_per_strategy, pce_test_error]
    pass_fail_tests: [dominant-knob-identified-and-robust, adversarial-inert-knob-returns-null]

