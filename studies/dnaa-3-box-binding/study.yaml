readouts:
- name: total DnaA concentration
  status: primary
  identifier: (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c] + sum(all bound-box DnaA)) / listeners.mass.cell_mass
  units: count / fg
  notes: |
    Rashmi 2026-06-05: plot total DnaA CONCENTRATION (count / cell mass), where
    total includes ALL forms of DnaA — free (apo + DnaA-ATP + DnaA-ADP) AND
    box-bound. Concentration (not raw count) controls binding equilibria, so this
    is the physiologically meaningful readout across the cycle.
- name: DnaA-ATP fraction
  status: primary
  identifier: bulk MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
  notes: Carried over from dnaa-2; must stay in the [0.2,0.5] band (gen-3 ~0.2-0.5).
