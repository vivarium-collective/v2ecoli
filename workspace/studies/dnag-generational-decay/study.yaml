  criteria:
  - test: decay-is-real-per-generation
    prior: Does dnaG's transcription actually fall generation over generation?
  - test: peers-do-not-decay
    prior: Is the decay specific to dnaG rather than to its whole allocation class?
  - test: ppgpp-conc-rises-across-generations
    prior: Does the only per-generation-varying input to the ppGpp vector actually move?
  - test: ppgpp-predicts-the-decay
    prior: Does the measured ppGpp concentration alone reproduce the observed decay?
  - test: decay-survives-within-class-normalisation
    prior: Is the decay upstream of the class rescaling, or produced by it?
assumptions:
- assumption: Gene dosage cannot drive the decay through the ppGpp basal vector.
  basis: 'Ruled out a priori from source, not assumed. ppgpp_initiation computes basal_prob = synth_prob(ppgpp_conc,
    copy_number), and copy_number is declared ''integer{1}'' -- a static scalar, ''the expected gene copy
    number at the reference doubling time'', supplied once at build time via _helpers.py:1491. It is not
    a per-gene, per-generation array, so it carries no dosage information and cannot vary across a lineage.
    Independently, dnaG is oriC-PROXIMAL: 70% of all TUs sit farther from oriC than its 715 kb, and its
    rProtein peers average 548 kb, so under-replication would hurt most other genes more. Dosage may still
    act elsewhere (e.g. promoter copy number reaching transcript_initiation directly) and decay-survives-within-class-normalisation
    would surface that.'
  risk: low
- assumption: The idx_rprotein TUs are a valid comparison class for dnaG.
  basis: 'TU00352[c] is itself in idx_rprotein, so these are its actual class-mates under transcript_initiation''s
    fixed-fraction rescaling. They measured 1.95-2.23 of basal across BOTH arms of ppgpp-off-rescue, i.e.
    stable under a drastic intervention. The investigation''s usual top-300 mRNA group is NOT valid here:
    it removes fixed-allocation classes and therefore excludes dnaG itself.'
  risk: low
alternative_hypotheses:
- name: H1 ppGpp feedback spiral
  statement: ppGpp rises as the lineage stalls and mass accumulates; the squared Hill term suppresses
    dnaG further each generation; less DnaG worsens the stall. Predicts ppgpp-predicts-the-decay PASSES.
  discriminator: ppgpp-predicts-the-decay
- name: H4 class-bookkeeping artefact
  statement: dnaG's absolute synthesis falls only because the rProtein class denominator moves; its within-class
    share is flat. Predicts decay-survives-within-class-normalisation FAILS.
  discriminator: decay-survives-within-class-normalisation
- name: H5 downstream of basal_prob
  statement: The decay originates in the delta_prob/TF term or in promoter copy number, not in the ppGpp
    vector. Predicts ppgpp-predicts-the-decay FAILS while decay-is-real-per-generation PASSES; the next
    study would then target transcript_initiation's promoter path.
  discriminator: ppgpp-predicts-the-decay
- name: H6 no decay at all
  statement: The apparent decline is an artefact of reading cumulative windows. Predicts decay-is-real-per-generation
    FAILS, which closes the question.
  discriminator: decay-is-real-per-generation
falsifiability: 'Every hypothesis above is refuted by a specific named axis, and the two primary discriminators
  are independent: ppgpp-predicts-the-decay is a zero-parameter held-out prediction from a fitted function
  this study does not touch, and decay-survives-within-class-normalisation is a pure renormalisation of
  the same data. H6 is checked FIRST so no mechanism is fitted to a phenomenon that does not exist.'
implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Fix the generation-1 seed defect before any new run.
  detail: 'run_condition_multigen_parquet.py''s no-perturbation generation-1 path calls build_composite
    without seed=, so generation 1 always executes at baseline()''s default seed 0. Confirmed empirically:
    replisome-gate-sufficiency''s four mechanistic seeds are bit-identical in generation 1. This study
    reads a PER-GENERATION trajectory across seeds, so correlated generation-1 states would bias the very
    quantity being measured. One line: pass seed=args.seed. The separate question of whether generation
    2+ should use hash(seed, gen) rather than seed+gen_idx -- whose streams overlap across seeds -- is
    a behaviour change affecting prior studies and is NOT in scope here.'
- id: req-2
  status: not_started
  blocking: false
  summary: Recompute the 5.40x deficit against idx_rprotein peers.
  detail: inforce_reference's comparison group excludes fixed-allocation classes and therefore excludes
    TU00352[c] itself. The 5.40x figure carried through studies 8-10 compares dnaG against a class it
    does not belong to; against its actual peers the ppGpp-on deficit measures 47.4x. Not blocking for
    this study, which uses the peer group throughout, but the older figure must not be cited beside these
    results.
- id: req-3
  status: not_started
  blocking: true
  summary: Per-generation extraction helper in v2ecoli/library/generational_decay.py.
  detail: 'All six axes read per-generation aggregates; every existing helper returns a single pooled
    average across a window, which is exactly the conflation that produced the cumulative figures motivating
    this study. One module returning {seed: {generation: {dnag, peer_median, class_total, ppgpp_conc}}},
    reused by every axis so no axis re-derives its own aggregation.'
simulation_set:
- name: ppgpp-on-mechanistic
  kind: single
  is_baseline: true
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides:
      ecoli-chromosome-replication.mechanistic_replisome: true
  note: 'The decay is a ppGpp-ON phenomenon, so this is the only arm needed. No ppGpp-off arm: ppgpp-off-rescue
    established that it destroys growth homeostasis, so it cannot serve as a control for a generational
    trajectory.'
planned_runs:
- name: phase-A-reuse
  status: planned
  n_steps: 0
  details: 'NO NEW SIMULATION. Axes are first evaluated on ppgpp-off-rescue''s ppGpp-on control arm, which
    already carries actual_rna_synth_prob and ppgpp_conc for 3 seeds x generations 1-4. Study 2''s mechanistic
    arm CANNOT be reused: its raw history was distilled to bundles during the 76 GB reclaim and the per-TU
    synthesis columns are gone. Phase A is fully determined by existing data and settles H6 and the two
    discriminators.'
- name: phase-B-confirm
  status: planned
  n_steps: 6
  details: 6 seeds x 5 generations, mechanistic gate ON, AFTER req-1 lands so the seeds are genuine replicates.
    Runs stall at generation 4-5 by construction, so each is ~30 min; ~1.5 h at 2 concurrent (one sim
    costs ~5.5 GB RSS; a 16 GB machine fits 2). Phase B exists to replicate Phase A's verdict on properly
    seeded runs, not to discover it.
robustness:
  n_replicates: 6
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  parameter_sweep: false
  note: Phase A has only 3 correlated seeds (generation 1 identical, see req-1), sufficient to discriminate
    the hypotheses -- the discriminators are within-lineage trajectory comparisons, not cross-seed contrasts
    -- but NOT to state a decay rate. Phase B's 6 properly seeded replicates carry any quantitative claim.
controls:
- name: peers-do-not-decay
  kind: negative
  hypothesis: If dnaG's class-mates decay alongside it, the phenomenon is class-level and not dnaG-specific.
  expected: idx_rprotein peer median changes by less than 1.5x over generations 1-4.
  observed: ''
  result: PENDING
- name: decay-is-real-per-generation
  kind: positive
  hypothesis: The decay must be shown to exist per-generation before any mechanism is fitted to it.
  expected: generation-4 dnaG synthesis below half of generation 1.
  observed: ''
  result: PENDING
limitations:
- Phase A's 3 seeds are correlated by the generation-1 seed defect; no quantitative decay rate may be
  quoted from Phase A alone.
- The lineage stalls at generation 4-5, so the trajectory is only ever 4-5 points long and cannot distinguish
  an exponential decay from a saturating one.
- ppgpp_conc is read from a listener as a per-generation mean; if the decay is driven by transient excursions
  rather than the mean, the prediction axis could fail for a reason unrelated to H1's truth.
- Phase A measures a stalling lineage. Every quantity is read from cells that are already failing, so
  a mechanism found here is a mechanism of the failure and may not describe healthy growth.
claim: ''
conclusion: ''
confidence: Planned
