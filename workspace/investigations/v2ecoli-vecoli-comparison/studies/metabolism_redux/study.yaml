findings:
- id: metabolism_redux-perf-blocker
  kind: methodological
  status: resolved
  statement: 'RESOLVED. The v2-side tick-2 hang was a GlobalClock zero-advance deadlock, NOT a step-cascade non-convergence (the earlier theory was a downstream symptom). MetabolismRedux is a vivarium Step but was injected as an interval pbg process, so its next_update_time output applied a tick late and GlobalClock.calculate_timestep pinned at 0. Fixed in v2ecoli PR #389 (inject vivarium Step subclasses as pbg steps). v2ecoli now runs 301 redux steps in ~125 s and REPRODUCES genuine vEcoli on basal within_tol on all graded axes (worst matched-time median |Δ| = 0.79%).'
  evidence:
    from_card: standard
    observed: 'ROOT CAUSE (pinned by direct measurement, 2026-07-26): GlobalClock.calculate_timestep returns min(next_update_time - global_time) over the next_update_time map; it advances sim time by that full_step. MetabolismRedux (vivarium Step, update_condition-gated) inherits FBA metabolism''s topology so its next_update_time wires to (''next_update_time'',''metabolism''). The inject bridge set as_step only from an explicit _force_step attr (which redux lacks), so redux was injected as an interval pbg PROCESS. As a process its next_update_time output is deferred to front-time global_time+interval and applies one tick late; at tick 2 nut[''metabolism'']==global_time==1.0 => calculate_timestep returns 0 => global_time frozen => _run_inner spins (~170k apply_updates rounds/tick). A probe recorded 4001/4001 zero-advance clock calls, argmin always the orphaned ''metabolism'' key. FBA metabolism does not hang because it is built as partitioned Requester/Evolver STEPS (applied immediately in the cascade). FIX: _should_inject_as_step(cls) returns True for vivarium Step subclasses (PartitionedProcess already rejected as ''partitioned'', so plain Processes stay processes); as a step the deriver applies within the tick so next_update_time advances before the clock recomputes. VERIFIED: redux basal advances global_time normally at ~0.4 s/tick; matched-timepoint gen-1 grade vs genuine vEcoli — cell_mass 0.10%, dry_mass 0.10%, protein_mass 0.07%, rna_mass 0.52%, growth_rate 0.79% => within_tol all axes. See memory project_metabolism_redux_tick2_hang. (Supersedes the earlier STEP-CASCADE NON-CONVERGENCE theory and the missing project_metabolism_redux_injection_ode_stiffness memory.)'
