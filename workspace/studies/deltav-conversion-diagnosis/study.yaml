schema_version: 4
name: deltav-conversion-diagnosis
title: Where the fold changes get lost
investigation: transcription-rewiring
study_type: root_cause
phase: Design
created: '2026-09-04'
status: planned
design_status: complete
implementation_status: not_started
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested
question: foldchange-to-delta-fidelity showed ParCa's TF-regulation layer misencodes its fold-change data
  by a median factor of 2, in both directions and uniformly in magnitude, with six entries encoding negative
  probabilities. It characterised the defect without locating it. Which step produces deltaV, what does
  it do wrong, and does correcting it restore both the network-wide fidelity and dnaG's operon?
parent_studies:
- study: foldchange-to-delta-fidelity
  condition: complete
  relation: leads-to
- study: pc00010-repression-arithmetic
  condition: complete
  relation: supports
units_and_time:
  tick: not applicable -- static ParCa artefacts, no simulation.
  quantities:
    deltaV: fitted coefficient in probability units, read from r_vector
    basal_prob: fitted alpha (intercept) in probability units
    retained fraction: 1 + deltaV/basal_prob; the expression a target keeps when its TF is bound
    log2FC: log2 fold change, the measured input
behavior_tests:
- name: conversion-path-reproduces-the-cache
  classification: primary
  gate_class: acceptance_criterion
  question: Is the identified code path actually the one that produced this cache's deltaV?
  description: 'Re-reading deltaV and basal_prob from cell_specs[''basal''][''r_vector''] by calculateRnapRecruitment''s
    own indexing reproduces the cache''s stored delta_prob to within 1e-9 relative on at least 99% of
    entries.


    Checked FIRST, and it is a real gate rather than a formality: every axis below reasons about a conversion,
    and if the identified path is not the one that produced these numbers then the diagnosis is of the
    wrong code. fit_sim_data_1.py:4022 calculateRnapRecruitment reads r[col_names_to_index[rnaId + ''__''
    + tf]] into deltaV and r[... + ''__alpha''] into basal_prob, so the reproduction is exact arithmetic,
    not an estimate.


    Threshold provenance: definitional. Reading the same vector by the same index either reproduces it
    or the path is wrong.'
  measure:
    kind: derived
    path: fraction of delta_prob entries reproduced from r_vector within 1e-9 relative, for the deltaV
      conversion in calculateRnapRecruitment
    detail: fraction of stored deltaV entries reproduced by re-indexing r_vector, over the whole matrix.
  pass_if:
    low: 0.99
    high: 1.0
    provenance:
      kind: theory
      note: A fraction bounded above by 1.0; 0.99 tolerates entries whose column names cannot be reconstructed
        without tolerating a wrong code path.
  status: pending
- name: candidate-explains-bidirectionality
  classification: primary
  gate_class: acceptance_criterion
  question: Does the proposed defect predict BOTH the activator over-shoot and the repressor under-shoot?
  description: 'The candidate mechanism, applied to the joined entries, predicts a median implied/expected
    ratio above 1 for activators and below 1 for repressors, with both predicted medians within 2x of
    the measured 4.77 and 0.628.


    The first of two constraints this study inherits from foldchange-to-delta-fidelity, and the reason
    that study had to run first. Any diagnosis that explains only repression is already refuted -- and
    that specifically rules out the intuitive story where a repressor delta simply saturates at total
    silencing, since activators are distorted MORE (4.77x) than repressors (0.628x). A candidate that
    cannot produce a sign-dependent asymmetry of that shape is not the mechanism.


    Threshold provenance: theory. 2x is the standing agreement band, applied to two subgroup medians simultaneously.'
  measure:
    kind: derived
    path: predicted over measured median implied/expected ratio, separately for activating and repressing
      deltaV entries
    detail: worst of the two subgroup ratios (predicted median over measured median) for activators and
      repressors.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check's 3x ceiling.
        [0.67, 1.5] is the agreement band used throughout this investigation, so every ratio axis here
        reads on one scale. Two-sided and applied to the WORSE of the two subgroups, so a candidate cannot
        pass by matching activators while missing repressors.
  status: pending
- name: candidate-explains-magnitude-uniformity
  classification: primary
  gate_class: acceptance_criterion
  question: Does the proposed defect predict distortion that does NOT grow with fold-change magnitude?
  description: 'The candidate predicts a strong-vs-weak repressor distortion ratio within 2x of the measured
    1.166.


    The second inherited constraint, and the sharper of the two. foldchange-to-delta-fidelity measured
    the distortion as essentially uniform in |log2FC|, which refutes an entire family of otherwise-plausible
    explanations: any log-versus-linear space mismatch, any saturation, any clipping at a bound would
    all produce error that GROWS with magnitude. A candidate surviving this axis must be magnitude-independent
    by construction, which points toward a fit-residual or a normalisation defect rather than a transform
    error.


    Threshold provenance: theory. The standing 2x band applied to a ratio that measured 1.166.'
  measure:
    kind: derived
    path: predicted over measured strong-vs-weak distortion ratio for the deltaV conversion
    detail: candidate-predicted strong/weak distortion ratio divided by the measured 1.166.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: 'Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check''s 3x ceiling.
        [0.67, 1.5] is the agreement band used throughout this investigation, so every ratio axis here
        reads on one scale. Two-sided: a candidate predicting strong magnitude-dependence and one predicting
        none are both wrong if the measurement says 1.166.'
  status: pending
- name: corrected-conversion-restores-fidelity
  classification: primary
  gate_class: acceptance_criterion
  question: Applying the correction, does the encoding actually match the data?
  description: 'Recomputing deltaV under the corrected conversion moves the median implied/expected retained
    fraction into [0.67, 1.5], from the measured 2.006.


    The axis that separates a diagnosis from a story. A candidate can explain both symptoms and still
    be wrong; the test is whether applying it repairs the numbers. This is deliberately the hardest axis
    in the study, and a FAIL here alongside passes above would mean the symptoms are understood but the
    cause is not.


    Threshold provenance: theory. The same band foldchange-to-delta-fidelity used to judge the uncorrected
    encoding, so corrected and uncorrected read on one scale.'
  measure:
    kind: derived
    path: median implied/expected retained fraction after recomputing deltaV under the corrected conversion
    detail: median ratio across the 564 joinable entries, post-correction.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Identical to the band that the uncorrected encoding failed at 2.006, so the comparison is
        direct.
  status: pending
- name: corrected-lexa-rpod-is-non-lethal
  classification: primary
  gate_class: acceptance_criterion
  question: Does the correction restore dnaG's operon to a survivable expression?
  description: 'Under the corrected conversion, the lexA->rpoD delta on TU00352[c] retains between 0.42
    and 0.96 of basal, bracketing the 0.637 its measured log2FC of -0.65 specifies.


    The end-to-end check, and the one that matters biologically. The uncorrected encoding retains 4.3167e-08
    -- total silencing of dnaG''s operon and, through the chain this investigation traced, a stalled lineage.
    A correct diagnosis must return this entry to roughly the modest repression its source datum describes.


    Threshold provenance: theory. The band spans 3x centred on 0.637, the value 2**-0.65 specifies.'
  measure:
    kind: derived
    path: corrected retained fraction for the lexA->rpoD deltaV entry on dnaG's operon TU00352
    detail: 1 + corrected relative delta for TU00352[c] at the LexA column.
  pass_if:
    low: 0.42
    high: 0.96
    provenance:
      kind: theory
      note: Centred on the 0.637 the measured log2FC specifies and spanning 3x, the widest the discrimination
        check permits; a correction landing outside this has not restored the datum.
  status: pending
- name: negative-basal-clipping-is-not-the-cause
  classification: diagnostic
  gate_class: acceptance_criterion
  question: Is the distortion concentrated in entries whose basal_prob was clipped to zero?
  description: 'The distorted entries are NOT concentrated in TUs whose basal_prob was clipped: the fraction
    of high-distortion entries sitting on clipped-basal TUs is within 2x of the base rate.


    A specific candidate, cheap to eliminate, and visible in the source: calculateRnapRecruitment applies
    basal_prob[basal_prob < 0] = 0 to the intercept but leaves deltaV untouched, so any TU whose fitted
    alpha went negative has a delta divided by a clipped basal. Diagnostic rather than primary because
    it discriminates a single candidate rather than between the study''s hypotheses, and dnaG''s own basal
    is 1.2128e-04 and so was not clipped -- which already argues against it as the general cause.'
  measure:
    kind: derived
    path: ratio of clipped-basal prevalence among high-distortion deltaV entries to the base rate
    detail: fraction of high-distortion entries on clipped-basal TUs, over the overall clipped fraction.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check's 3x ceiling.
        [0.67, 1.5] is the agreement band used throughout this investigation, so every ratio axis here
        reads on one scale. Two-sided; a strong enrichment OR depletion would both be informative about
        this candidate.
  status: pending
