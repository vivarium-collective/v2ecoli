inputs_in_place:
- 307 high-affinity DnaA box catalog computed at ParCa-build (Schaper-Messer consensus on the K-12 genome). Includes the 3 oriC high-aff (R1 −55, R2 +50, R4 +124) and the 2 high-aff dnaA-promoter sites (box1 −41917, box2 −42883).
- Static dnaA autorepression via fold_changes_nca.tsv (dnaA→dnaA = −2.31 log2 FC). The 5 weaker dnaA-promoter boxes are intentionally NOT modeled (autorepression already covers self-regulation — do not double-count).
- bf8b82e DnaA-ATP intrinsic hydrolysis (k ≈ 0.046/min) active in the equilibrium.

inputs_to_supply:
- id: oric-low-affinity-coordinates
  title: 8 low-affinity oriC box coordinates (R5M, τ2, I1, I2, C3, C2, I3, C1)
  status: provisional
  method: |
    Extract precise positions from oric_sequence.pdf using R1 (−55), R2 (+50),
    R4 (+124) as signed-coordinate anchors. Order along oriC (from the sequence
    map): R1 · R5M · τ2 · I1 · I2 · R2 · C3 · C2 · I3 · C1 · R4 — so 4 low-aff
    boxes (R5M, τ2, I1, I2) lie between R1 and R2, and 4 (C3, C2, I3, C1)
    between R2 and R4.
  provisional_coords_signed:
      # PROVISIONAL — interpolated from the rendered oric_sequence figure using the
      # R1/R2/R4 anchors (signed ≈ figure_pos − 255). MUST be confirmed by exact
      # sequence matching against oriC 3925744–3925989 at ParCa build before use.
    R5M: -10
    "τ2": 3
    I1: 15
    I2: 30
    C3: 67
    C2: 85
    I3: 97
    C1: 110
  note: |
    Treat the coordinates above as approximate ordering aids, NOT final. The REQ
    below (extract-low-aff-coords) closes this by pulling exact positions from the
    raw oriC sequence.

# ── Conditions: reuse the dnaa-2 V=1e-3 succinate baseline ─────────────────────
