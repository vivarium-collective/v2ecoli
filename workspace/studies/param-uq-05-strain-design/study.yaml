    chart: image
    address: image:charts/sobol_by_strategy.png
    config:
      title: "REAL (2-gen) — Strain-design Sobol (exp vs trl_eff vs inert decoy) on GFP product level, aggregation strategies 1–3"
    render: |
      REAL 2-generation result (n=12+2 test, 2 seeds, 2 gens, 4000 steps): grouped
      total-order Sobol bars for exp / trl_eff / inert-decoy on new-gene product
      level. Four groups: strategy 1 (population), strategy 2 as TWO groups
      (generation_1, generation_2 — now real, division fix landed), strategy 3
      (by-seed, whiskers = across-seed min–max). trl_eff (orange) is the LARGER
      real knob in every group — the ranking trl_eff > exp is argmax-robust across
      seeds and generations. The by-generation panels show the milestone finding:
      exp's share FALLS gen1 (0.35) → gen2 (0.19) while trl_eff's RISES (0.53 →
      0.64). The inert decoy (grey) sits at 0.24–0.51 — well ABOVE the 0.05 null
