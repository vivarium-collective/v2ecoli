conditions:
  baseline:
    composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
    params:
      emitter: xarray
  variants:
    - name: transcription-jump-from-kinetics
      base_composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
      description: "Replace v2ecoli's scaled-Poisson transcription with continuous-time jumps from measured initiation/elongation rate constants. Propensity λ = k_init × [RNAP_free] × [promoter] for each gene."
      params:
        backend: exact-SSA-or-tau-leap
        leap_condition: "Δλ/λ < 0.03"
      composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
    - name: translation-jump-from-kinetics
      base_composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
      description: "Same treatment for translation: propensity λ = k_elong × [ribosome_bound] × [aa_charged]. τ-leaping for the ribosome-elongation channel; exact next-reaction for rare initiation events."
      params:
        backend: hybrid-tau-leap-plus-exact
      composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
    - name: division-first-passage
      base_composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
      description: Cell division as a first-passage time on cell volume crossing a threshold under the coupled ODE+jump dynamics. Validated against the OU-process analytical FPT before deployment.
      params:
        threshold_observable: cell_volume
        validation: OU-FPT-analytical
      composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
    - name: competition-jumps
      base_composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
      description: Replace v2ecoli's global resource-reallocation correction step with affinity-based competition jumps. Each shared resource has affinity-weighted propensity to be drawn by each competing process.
      params:
        affinities: from-Michaelis-constants
      composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
    - name: full-pdmp-coupled
      base_composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
      description: Phase 1 ODE + all 4 jump processes coupled under the PDMP runner. The complete deliverable.
      params:
        runner: Vivarium-PDMP-experimental
      composite: v2ecoli_pdmp.composites.pdmp_runner.pdmp_runner
  model_settings: []
