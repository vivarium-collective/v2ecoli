schema_version: 2
name: ketchup-baseline-comparison
title: "Does v2ecoli's baseline central-carbon exchange phenotype match KETCHUP kinetic models?"
created: '2026-06-12'
status: active

# A behavioral-report-card investigation. The v2ecoli whole-cell baseline is
# graded — via the PR #134 report-card grader — against two external KETCHUP
# kinetic models (k-ecoli74, k-ecoli307; from the pbg-ketchup wrapper) used as
# reference *sources*. One study, two behavior tests (one per KETCHUP model),
# graded by the flux_scatter criterion over the shared central-carbon exchange
# fluxes (glucose-normalized).

question: |
  Does the v2ecoli whole-cell baseline reproduce the central-carbon exchange /
  byproduct phenotype (glucose, O2, CO2, acetate, NH3, SO4) of the KETCHUP
  core-metabolism kinetic models k-ecoli74 and k-ecoli307? Both are E. coli
  central-carbon models fit to flux data, so their glucose-normalized exchange
  partitioning is a natural cross-model check on v2ecoli's baseline FBA.

executive:
  what_is_this: |
    A one-study report-card comparison that drives the PR #134 behavioral
    report-card grader with KETCHUP kinetic models as the reference source:
      • ketchup-exchange-comparison — grade the v2ecoli baseline central-carbon
        exchange-flux vector against k-ecoli74 and k-ecoli307 (each a behavior
        test) using the flux_scatter criterion (identity-line R^2 on signed,
        glucose-normalized, matched fluxes). KETCHUP fluxes come from the
        pbg-ketchup wrapper (KetchupEstimator).
  verdict_status: characterized
  verdict_detail: |
    PARTIAL match. The 5 quantitatively-matched exchanges agree in DIRECTION
    (glucose/O2/NH3/SO4 uptake, CO2 secretion) but diverge sharply in MAGNITUDE:
    per 100 glucose, the KETCHUP core models respire far more (O2 ~-135 vs
    v2ecoli -9; CO2 ~+145 vs +33) and secrete acetate (~+71) where v2ecoli's
    baseline shows none — so acetate is a qualitative mismatch ("lost" from
    v2ecoli's side). Identity-line R^2 is negative (-0.68 vs k-ecoli74, -0.53 vs
    k-ecoli307). This is an expected divergence between a whole-cell FBA baseline
    and core 13C-MFA-style kinetic models at different conditions/objectives, not
    a v2ecoli defect; the value is the quantified, auditable characterization.
  decisions_needed:
  - question: "Is v2ecoli's low baseline O2:glucose (~0.09) physiological, or an artifact of the baseline FBA regime / exchange representation?"
    status: "OPEN — flagged for review"
    context: |
      v2ecoli's baseline O2 uptake is only -9 per 100 glucose (vs -135 in the
      KETCHUP core models), i.e. nearly fermentative. This dominates the
      magnitude divergence. Worth confirming whether the baseline genuinely runs
      low-respiration or whether external_exchange_fluxes under-reports O2.

scientific_argument:
  main_claim: |
    v2ecoli's baseline central-carbon exchange phenotype is DIRECTIONALLY
    consistent with the KETCHUP core kinetic models (correct uptake/secretion
    signs across glucose, O2, CO2, NH3, SO4) but QUANTITATIVELY divergent: the
    KETCHUP models predict substantially deeper respiration and aerobic acetate
    overflow per glucose, neither of which the v2ecoli baseline exhibits.
  evidence_for:
  - "Graded via the PR #134 flux_scatter criterion over the 6 shared central-carbon exchanges, glucose-normalized: signs match on all 5 quantitatively-compared fluxes; identity-line R^2 = -0.68 (k-ecoli74) and -0.53 (k-ecoli307). [REALIZED — see ketchup-exchange-comparison.]"
  - "Acetate is a qualitative mismatch: both KETCHUP models secrete acetate (~+71 per 100 glucose) while v2ecoli's baseline secretes none (0.0), flagged as 'lost' by the grader. [REALIZED.]"
  - "The two KETCHUP models agree closely with each other (shared K-FIT data lineage), so the divergence is v2ecoli-vs-core-kinetic-model, not model-specific noise. [REALIZED.]"
  caveats:
  - "This is a CHARACTERIZATION (cross-model agreement check), not a hypothesis test or a v2ecoli pass/fail. The KETCHUP models describe 13C-MFA-style core kinetics at their own condition; v2ecoli is whole-cell FBA — divergence is expected and the point is to quantify it."
  - "Comparison is over the 6 shared central-carbon exchanges only; KETCHUP is a core-carbon model and does not exchange the amino acids / ions v2ecoli's whole-cell model does (those are expected absences, not phenotype changes)."
  - "KETCHUP fluxes are at a bounded fit (status maxIterations); v2ecoli values are the 20-seed population_phenotype_basal ensemble mean."
  - "v2ecoli's baseline O2:glucose is anomalously low (~0.09) and dominates the magnitude divergence — flagged for review (decisions_needed)."

at_a_glance:
  studies:
  - ketchup-exchange-comparison: grade the v2ecoli baseline central-carbon exchange vector against k-ecoli74 and k-ecoli307 (flux_scatter, glucose-normalized); PARTIAL — directions agree, magnitudes + acetate overflow diverge

studies:
- ketchup-exchange-comparison

