      V=1.7e-3  747/870/936/1190/1131  — ramps out of band
      V=1.0e-3  359/392/580/694/832    — gens 3-6 in band, gen 7 exits
      V=0.8e-3  281/337/338/360/415    — gens 4-7 band-stable (plateau)  ← CHOSEN
    Selected V=0.8e-3: the DnaA cycle-mean plateaus in [300,800] for steady gens
    4-7 with the per-cycle PEAK under 800 and oriC clean 1↔2 every gen — the
