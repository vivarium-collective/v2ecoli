- name: dnaa-atp-fraction-in-band-gen3
  status: partial   # NOT met on the ADOPTED active-binding run: evaluator-computed 0.127 (bulk) / 0.187 (total incl. box-bound) < the [0.2,0.5] band. Inherited from dnaa-2 (where bulk==total, no binding); under active binding DnaA-ATP is sequestered onto boxes + V is tuned down to hold the pool band, depressing the fraction. The documented V-tension — no constitutive V meets both bands; scoped to dnaa-4. Honestly recorded FAIL on the canonical run (computed==authored, reconcile: agree); not forced to pass.
  classification: primary
  description: DnaA-ATP fraction at gen 3 in the [0.2,0.5] band (inherited from dnaa-2).
  # TOTAL DnaA-ATP fraction = (free + box-bound DnaA-ATP) / (all free + all box-bound DnaA).
  # Under active box-binding most DnaA is bound, so the free-bulk-only fraction (the dnaa-2
  # form, valid there because free==total) under-reads badly (~0.05). The Boesen band is on
  # the TOTAL fraction, so the bound forms must be included (2026-06-17, reconfig).
  measure: {kind: generation_average, path: "(MONOMER0-160[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp) / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.chromosomal_high_bound_adp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_high_bound_adp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp + listeners.replication_data.promoter_high_bound_adp)", window: from_generation_3}
  pass_if: {op: range, low: 0.2, high: 0.5}
  baseline_value: "~0.26 (dnaa-2)"
  cites:
  - pnas-pnas-2322772121
  cites_note: |
    The [0.2,0.5] DnaA-ATP / total-DnaA fraction band is the Boesen et al. 2024 PNAS
    value (DnaA-ATP fraction observed in Delta4 cells), inherited from dnaa-2. Same
    bib_key the sibling studies cite for this band.
- name: dnaa-pool-within-band
  status: partial
  classification: primary
  description: (Rashmi 2026-06-10, test #1) Total DnaA pool (bulk+bound) within the literature [300,800] band across the steady-state generations, with the active binding adopted on the in-band V=1e-3.
  measure: {kind: generation_average, path: "MONOMER0-160[c] + MONOMER0-4565[c] + PD03831[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.chromosomal_high_bound_adp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_high_bound_adp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp + listeners.replication_data.promoter_high_bound_adp", window: gen_steady_state}
  pass_if: {op: generation_average_in_range, low: 300, high: 800}
  baseline_value: "in-band gens 1-5 (336-687); drifts >800 gens 6-8 (V-tension -> dnaa-4)"
  cites:
  - dnaa-abundance-jb-1991
  cites_note: |
    The [300,800] total-DnaA band is the original DnaA protein abundance measurement
    (J. Bacteriol. 1991), the same literature anchor dnaa-1 tunes V to and dnaa-2
    reports against.
- name: oric-low-gradual-filling
  status: passed
  classification: primary
  description: (Rashmi 2026-06-10, test #2) The 8 oriC low-affinity boxes are NOT all occupied at cell birth — they fill GRADUALLY over the cycle as free DnaA-ATP accumulates toward initiation.
  measure: {kind: trajectory_over_cycle, field: oriC_low_occupancy}
  pass_if: {op: gradual_rise, note: "low at cell birth, rises toward initiation"}
  baseline_value: "gen-5 ~0.3 at birth -> ~0.7 toward init"

