  details: 'PILOT 2026-05-25. scripts/run_jax_pilot.py implements a 4-state lumped Millard
    subset (G6P, F6P, PEP, PYR via PGI-glycolysis-PYK-drain) in JAX/Diffrax. Real timings on this
    hardware: cold compile = 221ms (one-time XLA JIT), warm-cache mean = 4.11 ± 0.08 ms (N=20),
    cold→warm speedup = 53.7×. Apples-to-oranges vs basico full-Millard: basico-full 288.5 ms vs
    JAX-subset warm 4.11 ms = 70× — promising signal for the full 77-state JAX port (the actual
    jax-compiled-throughput-10x test target). SCAFFOLD honestly: 4 states out of 77, lumped rate
    laws (not faithful Millard kinetics), single-CPU. Full port is the legitimate test, this pilot
    proves the toolchain works end-to-end.'
