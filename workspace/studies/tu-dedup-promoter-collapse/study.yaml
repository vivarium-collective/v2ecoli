        note: 1.5x the 637 measured while scoping; pin only.
  criteria:
  - test: dedup-discards-distinct-promoters
    prior: Do the discarded TUs really differ only by start coordinate, i.e. are they distinct promoters?
  - test: restored-dnag-tus-escape-the-constraint
    prior: Refitted with the dnaG transcripts restored, do their deltas land off the probability-validity
      boundary?
  - test: dnag-transcription-recovers
    prior: Does dnaG actually get transcribed once it has more than one transcript?
  - test: lineage-completes-with-restored-tus
    prior: Does the cell live?
  - test: restoration-is-not-a-global-growth-artefact
    prior: Is any rescue attributable to dnaG rather than to perturbing the model generally?
implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Relax the gene-set dedup for the dnaG locus and REBUILD ParCa.
  detail: 'getter_functions.py:220-262 keys on the sorted gene tuple and `continue`s past later TUs. The
    minimal intervention is to key on (gene tuple, left_end_pos, right_end_pos) so distinct promoters
    survive, applied narrowly first -- restoring only TU00434 and TU00435 -- so the arm changes ONE thing.
    This REQUIRES A FULL ParCa REBUILD: the TU set changes, so basal_prob, delta_prob and the whole r_vector
    are refitted. The resulting cache will NOT be fingerprint ea05ac9b23b1d843, so the control arm must
    be the EXISTING cache and every comparison must be stated as across-cache. That is a real weakness
    of this design and is recorded as a limitation rather than glossed.'
- id: req-2
  status: not_started
  blocking: true
  summary: Decide narrow-vs-global restoration BEFORE running, and record it.
  detail: Restoring all 637 dedup casualties changes the transcriptome-wide basal allocation and would
    make any dnaG result uninterpretable. Restoring only the 2 dnaG TUs is the clean experiment. Recording
    the choice -- NARROW -- before running, so a global restoration cannot be substituted later if the
    narrow one fails to rescue.
- id: req-3
  status: not_started
  blocking: false
  summary: Reuse the deficit and margin measurements verbatim.
  detail: pc00010-repression-arithmetic's peer-deficit method and replisome_arrest's gate-margin helper
    are reused unchanged so the refitted arm is measured exactly as the existing runs were.
alternative_hypotheses:
- name: H1 promoter collapse is the root cause
  discriminator: lineage-completes-with-restored-tus
  statement: With three transcripts dnaG's supply is the sum, at least one escapes the constraint, DnaG
    accumulates and the lineage completes. Predicts all four primary axes pass.
- name: H2 all three TUs land on the boundary
  discriminator: restored-dnag-tus-escape-the-constraint
  statement: 'The refit pins every dnaG-bearing TU at Z@R ~ 0, because they share a gene set and so nearly
    share an alpha. Restoration then changes nothing and the constraint is the sole cause. Plausible:
    the three TUs are near-identical, and the 10 currently-pinned targets include BOTH surviving rpoD-bearing
    TUs.'
- name: H3 transcription recovers but the lineage still stalls
  discriminator: lineage-completes-with-restored-tus
  statement: dnaG's deficit falls but something else limits the lineage -- the activator residual, or
    another subunit. Predicts the deficit axis passes while the lineage axis fails, which would still
    be a real advance.
- name: H4 the rescue is a global artefact
  discriminator: restoration-is-not-a-global-growth-artefact
  statement: Refitting shifts basal allocation broadly and the lineage survives for reasons unrelated
    to dnaG. This is how ppgpp-off-rescue's apparent rescue was voided.
falsifiability: H2 is a genuine and quite likely outcome -- the three dnaG TUs share a gene set and so
  nearly share an alpha, and both surviving rpoD-bearing TUs are already pinned -- so this study can fail
  on its own central mechanism at the second axis, before any simulation. That is why the escape axis
  is graded separately from the lineage axis instead of being folded into it.
assumptions:
- assumption: Restoring TUs is a data-side change with no runtime component.
  basis: The dedup runs in getter_functions during ParCa, so the change is entirely upstream of simulation.
    That is what makes this cheaper than re-solving the convex program's constraint, though it still needs
    a full refit.
  risk: low
- assumption: An across-cache comparison is admissible here.
  basis: 'It has to be: the refit necessarily produces a different cache. Every prior study in this investigation
    compared arms WITHIN one cache, so this is the first that cannot, and the control arm''s stall generation
    must be re-verified on the new cache rather than assumed from the old runs.'
  risk: high
simulation_set:
- name: restored-promoters
  kind: single
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides:
      ecoli-chromosome-replication.mechanistic_replisome: true
  note: Built from a ParCa cache rebuilt with TU00434 and TU00435 restored.
- name: dedup-control
  kind: single
  is_baseline: true
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides:
      ecoli-chromosome-replication.mechanistic_replisome: true
  note: The existing cache ea05ac9b23b1d843. Its stall at generation 4-5 must be re-verified on matched
    seeds rather than assumed, since the comparison is across caches.
planned_runs:
- name: phase-A-static
  status: planned
  n_steps: 0
  details: NO SIMULATION. Confirms the dedup discards distinct promoters (axis 1) and records the blast
    radius. Runs before any rebuild, and can refute the premise cheaply.
- name: phase-B-refit
  status: planned
  n_steps: 0
  details: 'ParCa rebuild with TU00434/TU00435 restored, then axis 2 read statically from the new cache.
    This is the decision point: if all three dnaG TUs are still pinned at the boundary, H2 holds and Phase
    C is not worth running.'
- name: phase-C-lineage
  status: planned
  n_steps: 6
  details: 3 seeds x 2 arms x 12 generations, only if Phase B shows an escape. ~30-60 min per run. Disk
    is at 56 GB with out/ holding 51 GB, so distil dnag-promoter-availability's 28 GB first; a ParCa rebuild
    also needs room.
robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: 3 independent seeds per arm, enough to separate a 12-generation completion from a 4-5 stall. The
    across-cache comparison is the dominant uncertainty here, not seed variance.
controls:
- name: restoration-is-not-a-global-growth-artefact
  kind: negative
  hypothesis: A refit shifts basal allocation broadly; survival for unrelated reasons is not evidence
    about dnaG.
  expected: generation time within 50% of control.
  observed: ''
  result: PENDING
- name: restored-dnag-tus-escape-the-constraint
  kind: positive
  hypothesis: If all three dnaG TUs are still pinned at Z@R ~ 0, restoration cannot help and H2 holds.
  expected: at least 2 of 3 above Z@R = 1e-9.
  observed: ''
  result: PENDING
limitations:
- THE COMPARISON IS ACROSS CACHES. Restoring TUs forces a full ParCa refit, so the restored arm cannot
  share fingerprint ea05ac9b23b1d843 with the control. Every prior study here compared arms within one
  cache; this one cannot, and the control's stall must be re-verified on matched seeds rather than assumed.
- Restoring only the 2 dnaG TUs is the clean experiment but is not the fix a modeller would ship; the
  general fix restores all 637 and changes transcriptome-wide allocation, which this study deliberately
  does not test.
- 'The study can show restoration is SUFFICIENT to rescue dnaG without showing the dedup is the only defect:
  the constraint artefact, the cistron-content regulation rule and the 2.13x activator residual are all
  untouched by it.'
- Whether the discarded TUs are biologically real distinct promoters rests on the source data's coordinates
  and evidence codes. The repo carries no TF-binding-site-to-promoter mapping, so this study cannot verify
  that LexA's operator lies upstream of TU00352 and not of TU00434/TU00435 -- which is the fact that would
  make the biology decisive.
- The EcoCyc export gives site positions and the operon each is attributed to, but not per-TU regulation,
  so the rpsUp3-to-TU00435 identification rests on matching the site name's stated offset (4.5 bases downstream)
  against TU00435's start coordinate. The agreement is 0.5 bp, but it is an inference from a name string,
  not a declared mapping.
claim: LexA's operator is at rpsUp3, which the dedup discarded; the model then applied LexA's repression
  to TU00352, a promoter LexA does not regulate. dnaG is silenced through the wrong promoter.
conclusion: 'Phase A answers the study''s question without the ParCa refit it was scoped to need, using
  EcoCyc''s binding-site export.

  The dedup collapses 637 TUs across 428 groups; 84% of the discards are distinct promoters and 16% genuine
  duplicates, so the axis as pre-registered FAILS at 0.8399 and my characterisation was too sweeping.
  But dnaG''s case is far worse than a generic collapse. The only LexA site at this locus is at rpsUp3,
  TSS 3210734.5, matching TU00435''s start of 3210735 -- and TU00435 is one of the two DISCARDED TUs.
  The model kept TU00352, whose TSS is 88 bp upstream of the operator, and rna_id_to_regulating_tfs handed
  it LexA anyway because it contains rpoD.

  So dnaG is silenced through a promoter LexA does not regulate, having lost the one it does. That reorders
  the fixes: promoter-specific regulation ALONE would free dnaG entirely, since the surviving TU carries
  no LexA site -- cheaper than restoring TUs, and it makes restoration alone useless, because the cistron-content
  rule would reassign LexA to all three. The faithful fix is both together: restore rpsUp1/p2/p3 and assign
  regulation by promoter, giving dnaG two unrepressed transcripts and one repressed.

  Phases B and C are NOT run and axes 2-5 stay pending. Phase B as designed -- refit with the TUs restored
  -- would now test the WRONG fix on its own.'
confidence: Planned
runs:
- name: tu-dedup-promoter-collapse__phase-A
  status: complete
  canonical: false
  started_at: '2026-09-04T17:30:00Z'
  started_at_iso: '2026-09-04T17:30:00Z'
  note: PHASE A ONLY -- static, no simulation and no ParCa rebuild. Reads transcription_units.tsv and
    replays getter_functions' gene-set dedup. Phases B and C (refit, then lineage) are NOT run; axes 2-5
    remain pending.
  outcomes:
    dedup-discards-distinct-promoters:
      result: FAIL
      measured_value: 0.8399
      evaluated_by: agent
      operator: derived/band [0.9, 1.0]
      gate_class: acceptance_criterion
      detail: '535 of 637 discarded TUs (0.8399) differ from their retained twin in left or right end
        position; 102 have byte-identical coordinates and are genuine duplicates the dedup is right to
        remove. Below the 0.9 I pre-registered, so my characterisation of the dedup as discarding distinct
        promoters is 84% accurate rather than near-universal. Recording the FAIL rather than reinterpreting
        the band.

        The study''s own mechanism is unaffected: dnaG''s three TUs differ in start coordinate (3210646
        / 3210712 / 3210735), so dnaG sits squarely in the 84%. What changes is the generalisation --
        any claim that ''the dedup removes 637 promoters'' overstates it by about a sixth.'
    dedup-discarded-tu-count:
      result: PASS
      measured_value: 637
      evaluated_by: agent
      operator: derived/<= 956
      gate_class: regression_pin
      detail: 637 TUs discarded across 428 gene-set groups, from 3766 source TUs to 3129 kept. Reproduces
        the scoping measurement. The largest single group holds 8 TUs collapsed to one.
preliminary_observations:
- note: Phase A, recorded before Phases B/C exist. The dedup collapses 637 TUs from 428 groups, the largest
    group being 8 TUs reduced to one. 84% of the discards are distinct promoters and 16% are true duplicates
    -- so the dedup is doing legitimate work part of the time, which my scoping framing did not allow
    for. dnaG's collapse (3210646 / 3210712 / 3210735) is a genuine distinct-promoter case.
findings:
- summary: 'DECISIVE: LexA''s operator is at rpsUp3, the promoter the dedup DISCARDED. The model represses
    a promoter LexA does not regulate.'
  status: novel
  evidence:
    from_run: tu-dedup-promoter-collapse__phase-A
    observed: 3210735
    units: TU00435 start vs implied rpsUp3 TSS 3210734.5
  explanation: 'From EcoCyc''s TF binding-site export (references/all-transcription-factor-binding-sites.txt,
    4356 sites): the only LexA site at this locus is ''LexA DNA-binding-site 4.5 bases downstream of rpsUp3'',
    spanning 3210729-3210749 on the + strand, attributed to the rpsU-dnaG-rpoD operon. Its centre at 3210739
    minus 4.5 puts rpsUp3''s TSS at 3210734.5 -- TU00435''s start of 3210735, to within half a base.

    The model kept TU00352 (start 3210646, 88 bp UPSTREAM of the operator) and discarded both TU00434
    and TU00435. rna_id_to_regulating_tfs then assigned LexA to TU00352 because it contains rpoD. So dnaG
    is silenced through rpsUp1, a promoter LexA has no site at, while the promoter LexA actually represses
    was removed from the model.

    Two defects compose exactly: the dedup removed the regulated promoter, and cistron-content regulation
    reassigned its repressor to an unregulated one.'
- summary: Promoter-specific regulation ALONE would free dnaG, because the surviving TU is not a LexA
    target.
  status: novel
  evidence:
    from_run: tu-dedup-promoter-collapse__phase-A
  explanation: 'This reorders the candidate fixes. If regulation were assigned by promoter rather than
    by cistron content, TU00352 -- the only surviving dnaG-bearing TU -- would carry NO LexA delta at
    all, since LexA''s site is at rpsUp3. dnaG would be unrepressed and the constraint-pinned delta would
    never touch it. That is cheaper than restoring TUs and does not require changing the TU set.

    It is also slightly WRONG biologically: the correct model has three promoters with LexA repressing
    one of them, so dnaG should lose roughly a third of its supply under SOS, not none. The faithful fix
    is both changes together -- restore the promoters AND assign regulation by promoter. Restoration alone
    would not help, because the cistron-content rule would hand LexA to all three.'
