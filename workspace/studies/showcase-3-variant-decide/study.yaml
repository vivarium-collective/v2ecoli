schema_version: 4
name: showcase-3-variant-decide
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: "Which perturbation best demonstrates v2ecoli's response — reviewers to choose"
created: '2026-06-09'
status: design   # legacy back-compat; canonical axes below

# v4 schema (vivarium_dashboard.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]

# Canonical 6-axis status. This is a DECISION study: design is complete, but the
# variant is intentionally un-chosen, so the sim is NOT run and the gate / expert
# review are pending the reviewer's choice.
design_status: complete
implementation_status: not_run
simulation_status: not_run
evaluation_status: not_run
gate_status: pending
expert_review_status: pending

question: |
  Which perturbation best demonstrates v2ecoli's response — reviewers to
  choose? Building on the wild-type baseline (showcase-2), this study stops at
  a DECISION: it commits no variant. Four candidate perturbations are proposed;
  reviewers pick which one (or more) best demonstrates v2ecoli's perturbation
  response. No simulation runs until a variant is chosen.

report:
  title: showcase-3 — reviewer variant decision (no variant committed)
  verdict: pending
  confidence: design-stage
  evidence_quality: design-only

  objective: |
    Hand reviewers an explicit, OPEN choice: which perturbation should we run on
    top of the wild-type baseline to demonstrate v2ecoli's response? This study
    deliberately commits no variant (conditions.variants is empty); it presents
    four candidates and stays un-run until a reviewer selects one.

  result: |
    [NO RUN — decision study. The sim does not run until a variant is chosen.
    See decisions_needed and discovery_implications.followup_study_proposals for
    the four candidate perturbations.]

  decision: |
    OPEN — reviewers to choose which perturbation (or perturbations) best
    demonstrates v2ecoli's response. The four candidates are below.

  decisions_needed:
  - question: "Which variant should we run to demonstrate v2ecoli's perturbation response?"
    status: "OPEN — reviewers to choose"
    context: |
      Four candidate perturbations on top of the showcase-2 wild-type baseline.
      No option is preferred; the reviewer chooses (and may pick more than one).
        1. ppgpp_regulation toggle OFF — disable the ppGpp regulatory layer; a
           clean global single-switch knock-out.
        2. parameter sweep via linspace — sweep a transcription/translation knob
           (e.g. a global RNAP or ribosome elongation-rate factor) across a
           linspace; a dose-response demonstration.
        3. media / condition change — switch the growth condition (e.g.
           glucose→succinate or +amino-acids). FLAG: each condition needs its
           OWN full ParCa cache (~2.5 min/condition), multiplying the build cost.
        4. dnaA expression knob — the TU00259[c] transcription-init override
           (sim_data.genetic_perturbations["TU00259[c]"] = V) from the
           dnaa-replication investigation; a targeted single-gene perturbation.

  review_asks: |
    For reviewers, before any perturbation is run:
    1. WHICH VARIANT — which of the four candidates (ppGpp-off, linspace
       parameter sweep, media/condition change, dnaA expression knob) best
       demonstrates v2ecoli's response for this showcase? You may select more
       than one.
    2. READOUT — what is the primary readout you want to see for the chosen
       perturbation (growth rate, expression, a specific pathway flux, the DnaA
       pool, …)?
    3. COST TRADE-OFF — is the media/condition-change option worth its extra
       cost (a separate full ParCa cache per condition, ~2.5 min each) vs the
       single-cache options (ppGpp-off, linspace sweep, dnaA knob)?
    4. SCOPE — should the showcase run exactly one perturbation, or a small set,
       to demonstrate v2ecoli's response?

conditions:
  baseline:
    composite: baseline
    # No variant committed — this is a reviewer-decision study. The four
    # candidate perturbations live in decisions_needed +
    # discovery_implications.followup_study_proposals.
  variants: []
  model_settings: []

assumptions:
- text: |
    The wild-type baseline (showcase-2) is validated before any perturbation is
    run, so each candidate variant is a clean delta against a trusted reference.
  verified_in_v2ecoli: false

tests:
- name: reviewer-selects-perturbation-variant
  classification: decision
  status: pending
  question: Have reviewers selected which perturbation variant(s) to run to demonstrate v2ecoli's response?
  measure:
    kind: reviewer_decision
    detail: |
      Placeholder decision gate. Resolves when a reviewer picks one (or more) of
      the four candidate perturbations (ppGpp-off, linspace parameter sweep,
      media/condition change, dnaA expression knob). No quantitative pass/fail —
      the outcome is the chosen variant, which then becomes a committed run.
  pass_if:
    op: reviewer_selected_variant

discovery_implications:
  resolved_uncertainties: []
  remaining_uncertainties:
  - Which perturbation most clearly demonstrates v2ecoli's response is an OPEN reviewer choice; no variant is committed in this scaffold.
  followup_study_proposals:
  - id: variant-ppgpp-regulation-off
    title: ppGpp regulation toggle OFF
    study_type: perturbation
    source_trigger: reviewer-decision
    proposed_experiment: |
      On the showcase-2 wild-type baseline, disable the ppGpp regulatory layer
      (ppgpp_regulation = off) and run the same multiseed/multigen ensemble.
      Compare growth rate, ribosome/RNAP allocation, and expression against the
      baseline.
    expected_information_gain: high
    effort: low
    expert_gate_required: true
  - id: variant-parameter-sweep-linspace
    title: Parameter sweep via linspace (transcription/translation knob)
    study_type: parameter-sweep
    source_trigger: reviewer-decision
    proposed_experiment: |
      Sweep one transcription/translation knob (e.g. a global RNAP or ribosome
      elongation-rate factor) across a linspace of values on the baseline cache,
      one parameterized run per point, and plot the dose-response (growth rate /
      mass fractions vs the swept value).
    expected_information_gain: high
    effort: medium
    expert_gate_required: true
  - id: variant-media-condition-change
    title: Media / condition change (e.g. glucose→succinate or +amino-acids)
    study_type: condition-change
    source_trigger: reviewer-decision
    proposed_experiment: |
      Switch the growth condition and run the baseline ensemble in the new
      media. FLAG: each condition needs its OWN full ParCa cache (~2.5 min per
      condition), so this multiplies the build cost vs the single-cache options.
    expected_information_gain: high
    effort: high   # a separate full ParCa cache per condition (~2.5 min each)
    expert_gate_required: true
  - id: variant-dnaa-expression-knob
    title: dnaA expression knob (TU00259[c] transcription-init override)
    study_type: gene-perturbation
    source_trigger: reviewer-decision
    proposed_experiment: |
      Apply the Mechanism-A runtime override
      sim_data.genetic_perturbations["TU00259[c]"] = V (carried over from the
      dnaa-replication investigation) on the baseline cache and run the ensemble;
      read the DnaA pool / replication-initiation response vs the baseline.
    expected_information_gain: medium
    effort: low
    expert_gate_required: true

pipeline_gate:
  prerequisites:
  - showcase-2-baseline-figures
  enables: []
  gate_status: pending

runs: []
