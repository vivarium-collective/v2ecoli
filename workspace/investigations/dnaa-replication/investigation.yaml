scientific_argument:
  main_claim: |
    Under ParCa-default succinate, v2ecoli reaches a non-overlapping
    periodic cell cycle (oriC 1↔2 at steady state, from gen 3 onwards;
    a transient overshoot to 4 in the first generations marks the
    pre-steady-state relaxation) and, with the 2e-3 dnaA init_prob
    runtime overwrite, the dnaA mRNA initiation rate lands near the
    biologically-expected ≈1 event/min, which in turn holds the DnaA
    monomer pool in the Schmidt 2016 / Mori 2021 [300, 800] band stably
    across generations.
  evidence_for:
  - 'dnaa-0 (confirmed 2026-05-30, Rashmi "this looks correct"): the succinate single-daughters lineage is periodic from gen 3 onwards — oriC 1↔2, cell mass sawtooth, every division fires with d_period_elapsed=True and chromosomes=2 at the split (Round 3.7 D-period fix in place). The early-generation oriC overshoot to 4 is the expected pre-steady-state transient. Gen-3 state saved as the canonical succinate initial condition.'
  - 'dnaa-1 (pass 2026-06-09 at the canonical V=0.8e-3 on the expert''s in-band + steady criterion): a 7-point full-per-gen-history sweep of the dnaA RNA-synth probability plus a 15-gen equilibration run and a multiseed (set per-run via the recorded --perturbation override on one shared cache) establish that V=0.8e-3 is the only V whose DnaA pool oscillates within [300,800] — the whole oscillation, steady-gen (4-7) cycle-mean 336.5/337.5/359.5/414.8 (pooled ~362), peaks <800 (max 553), troughs ~207 — while keeping steady-state dynamics (oriC periodic 1↔2, never 4, every gen, every gen divides), so the dnaa-0 cell cycle is preserved under the tuned expression and the expert''s ask is met. The dnaA init rate at V=0.8e-3 is ~0.6/min (gens 4-7 0.65/0.46/0.57/0.71), sub-physiological vs the ~1/min target: the known tradeoff (init-rate test partial). No single constitutive V closes both the in-band pool and the ~1/min rate (7-point sweep + the 15-gen V=1.1e-3 equilibration run that overshoots the band then relaxes), so closing both needs a regulated, cell-cycle-coupled DnaA synthesis lever (for Rashmi/Haochen). The earlier V=1.1e-3 pick is withdrawn (its 7-gen "676 in-band" reading was a pre-equilibration artifact). Steady-state dynamics are seed-robust (multiseed seeds 0-3). Canonical run out/dnaa1_v0p8e-3, seed 1.'
  evidence_against:
  - 'Within each cycle the DnaA pool oscillates above the [300,800] band at its pre-division peak (≈1000) before halving at division, so the band holds for the cycle-mean, not every instantaneous tick. This is the expected accumulate-then-divide behaviour, not a contradiction, but worth stating: "in band" here means cycle-typical, not a hard cap.'
  caveats:
  - 'This investigation is a fresh start as of 2026-05-29. All prior Round 1–3.8 findings, prose, and decisions are retired (see feedback-2026-05-29-fresh-start/feedback.pdf for the directive). Anyone reading the prior dnaa-mock work (PR 59 on feat/dnaa-mock-investigation-start) should treat its content as historical reference only.'
  - RIDA mechanism is out of scope for this investigation. The extrinsic-regulation study (formerly dnaa-06) is removed entirely. Glossary entries for RIDA are likewise removed.
  - 'Original gating directive (now satisfied): dnaa-2..N were blocked until dnaa-0 and dnaa-1 reached passing verdicts; no further studies were to be authored in this directory tree until the first two were validated.'
  - Round 3.7 D-period wiring fix (v2ecoli/steps/division.py + v2ecoli/composites/_helpers.py, commit 8b5d8cd on feat/dnaa-mock-investigation-start) is the one upstream artifact worth pulling forward. Under any media, the Division step needs to read MarkDPeriod's `divide` flag to enforce D. Cherry-pick or re-implement before running dnaa-0, otherwise the 10-gen succinate run will fire division at the wrong time and the periodic-steady-state test will fail for the wrong reason.
  interpretation_ref: biological_story

biological_story: |
  In a real E. coli cell, the decision to start a new round of chromosome
  replication is made by the protein DnaA, gated by oriC site occupancy.
  Under fast growth (τ short relative to C+D), replication initiates
  multiple times before division and the cell can have 4+ oriC. Under
  slower growth (τ > C+D, the regime this investigation targets), each
  cell cycle has a free B-period where the cell isn't replicating; the
  cycle proceeds 1 oriC → initiation → 2 oriC → C-period replication →
  D-period delay → division → 1 oriC.

  This investigation pulls v2ecoli into the slower regime via succinate
  (ParCa fit: τ ≈ 82 min, C = 40 min, D = 20 min, B = 22 min) and asks
  two foundational questions before any mechanism is built on top:
  (1) does v2ecoli actually settle into the periodic regime succinate
  predicts, and (2) once it does, can the DnaA pool be held in the
  physiological literature band stably across generations?

  Step 1 — succinate steady state. Run for 10 generations with
  single_daughters tracking, check per-cell oriC and cell_mass are
  periodic in the followed daughter lineage. After ~3 generations the
  transient should decay; from generation 3 onwards, the lineage looks
  like the PDF's exemplar trace: cell mass sawtooths 600 → 1200 → 600
  fg per cycle, oriC steps 1 → 2 → 1 once per cycle. Save the gen-N
  state as the canonical succinate initial condition for subsequent
  studies.

  Step 2 — DnaA expression tuning. With the canonical initial condition
  in hand, apply Mechanism A (runtime overwrite of TU00259[c]'s
  per-promoter init_prob to 2e-3) and check the DnaA monomer count
  (sum across forms) lands in [300, 800] and stays stable across the
  7+ generation lineage.

