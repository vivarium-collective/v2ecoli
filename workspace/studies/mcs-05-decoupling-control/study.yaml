schema_version: 4
name: mcs-05-decoupling-control
investigation: multiscale-complexity-showcase
title: "Adversarial — decoupling control"
created: '2026-09-03'
status: planned
confidence: Planned
kind: adversarial

question: >-
  If the emergent growth/replication coordination in Arc 1 is genuinely caused by the
  ppGpp signal, then disabling ppGpp coupling must ABOLISH it. When ppGpp synthesis is
  knocked out (relA/spoT) or the ppGpp -> initiation link is fixed to a constant, does
  the origins-per-cell / growth-rate coordination collapse?

hypothesis: >-
  Under decoupling, origins_per_cell no longer tracks growth_rate (the positive slope
  from Arc 1 flattens) and initiation-mass constancy breaks — confirming the coordination
  is caused by ppGpp, not by an imposed hard-wired correlation. If the coordination
  SURVIVES decoupling, the Arc 1 thesis (emergent control) is refuted.

objective: >-
  Re-run the Arc 1 conditions with ppGpp coupling disabled and test whether the
  origins-vs-growth coordination collapses — an adversarial falsification of H1.

# This is the required adversarial member: the metric passes by REJECTING a system that
# should not show emergent coordination once the causal signal is removed.

parent_studies:
  - {study: mcs-01-ppgpp-replication-coupling, relation: refutes, condition: tests-passed}

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants:
    - name: ppgpp-decoupled
      detail: >-
        Disable ppGpp coordination — via relA/spoT knockout or by pinning the
        ppGpp -> chromosome_initiation coupling to a constant. Exact mechanism chosen
        during execution from what ecoli_baseline exposes (knockouts= or config_overrides).
  model_settings: []

inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir

expected_behavior:
  - name: coordination-collapses-when-decoupled
    observable: "slope(origins_per_cell vs growth_rate)"
    condition: "decoupled vs coupled"
    rationale: >-
      If coordination is ppGpp-driven, decoupling flattens the origins-vs-growth slope
      relative to Arc 1. A persistent slope refutes the emergent-control claim (H1).

tests:
  - name: coordination-collapses-when-decoupled
    classification: primary
    question: "Does the origins-vs-growth slope flatten (toward 0) under decoupling?"
    measure:
      kind: derived
      detail: >-
        Compare slope(origins_per_cell vs growth_rate) decoupled vs coupled (Arc 1);
        expect a significant reduction. Adversarial: the investigation's H1 PASSES only
        if this control shows the collapse.

runs: []
findings: []

pipeline_gate:
  enables: []
