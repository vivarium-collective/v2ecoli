findings:
- id: F-01
  statement: >-
    The phenomenological global-refractory SeqA eclipse (DNAA_INIT_ECLIPSE_MIN 20/40 min) and
    threshold/K tuning (oriC-low threshold 8/8, K=45) do NOT restore one-initiation-per-cycle for
    the mechanistic DnaA-ATP/oriC trigger. Every variant still reaches oriC 4 with substantial
    re-initiation (no-eclipse 1400; eclipse-40 2405; eclipse-20 2578; thr=8 3511; K=45 6530 ticks);
    the global block + stricter thresholds make it WORSE (a global eclipse delays division -> larger
    cell -> bigger burst). The cell cycle stays sustained (8/8 divide) and the DnaA pool stays in
    band, so it is an initiation-CONTROL failure, not viability. ROOT CAUSE: nothing turns the
    DnaA-ATP switch OFF after initiation (these runs had RIDA off). The fix is RIDA (DnaA-ATP ->
    DnaA-ADP inactivation post-init, dnaa-05) to reset the switch + a per-origin SeqA model.
  status: evaluated
  provenance:
    run_ids: [dnaa7_seqa_eclipse40_seed1_8gen, dnaa7_seqa_eclipse20_seed1_8gen, dnaa6_tune_thr8_k30_seed1_8gen, dnaa6_tune_thr6_k45_seed1_8gen, dnaa6_mech_low_coop_n4_seed1_8gen]
- id: F-03
  statement: >-
    OPERATING POINT FOUND — the loop closes. Sweeping the RIDA rate (RIDA_RATE_MULTIPLIER 0.1-1.0,
    DARS on) against BOTH targets shows a window, RIDA in [0.5, 0.7], that simultaneously gives
    clean oriC 1<->2 (0 re-inits), DnaA-ATP fraction IN [0.2,0.5] (0.28/0.40/0.26 at 0.5/0.6/0.7),
    DnaA pool in band, and 8/8 divisions. Below it (<=0.3) the cell over-initiates and the fraction
    runs high; at RIDA=1 the cell is clean but the fraction crashes to 0.03. RIDA=0.6 is the
    canonical operating point. So the full mechanistic DnaA-ATP/oriC initiation (cooperative switch
    + RIDA reset) replaces the cell-mass heuristic with ALL acceptance bands held — the investigation
    arc is complete on seed 1. Open follow-ups: multi-seed robustness (seeds 0/2) and a per-origin
    hemimethylation SeqA refinement.
  status: evaluated
  provenance:
    run_ids: [dnaa7_ridacal_r05_seed1_8gen, dnaa7_ridacal_r06_seed1_8gen, dnaa7_ridacal_r07_seed1_8gen, dnaa7_ridacal_r03_seed1_8gen, dnaa7_rida_full_seed1_8gen]
- id: F-02
  statement: >-
    RIDA RESOLVES the over-initiation (hypothesis confirmed). Re-running the mechanistic oriC-low
    trigger + cooperativity with RIDA ON (RIDA_RATE_MULTIPLIER=1; no eclipse) gives clean
    one-initiation-per-cycle — oriC 1<->2, ZERO re-inits, 8/8 divide — for both RIDA-only and full
    RIDA/DDAH/DARS. This confirms the F-01 root cause: the over-init was the un-reset DnaA-ATP
    switch; RIDA (DnaA-ATP -> DnaA-ADP post-initiation) drops free DnaA-ATP below threshold so the
    switch resets. The mechanistic DnaA-ATP/oriC initiation now works end to end (cooperative switch
    fires it, RIDA enforces once-per-cycle). CAVEAT: RIDA at full rate over-suppresses DnaA-ATP —
    the fraction crashes to 0.012 (RIDA-only) / 0.031 (full) << [0.2,0.5], even with DARS. So the
    RIDA RATE needs calibration (dnaa-05) to hold the ATP-fraction band; the control mechanism
    itself is solved.
  status: evaluated
  provenance:
    run_ids: [dnaa7_rida_only_seed1_8gen, dnaa7_rida_full_seed1_8gen, dnaa6_mech_low_coop_n4_seed1_8gen]

biological_summary: >-
  SeqA binds newly hemimethylated oriC after initiation, sequestering it for the eclipse period
  (~1/3 of the cell cycle) so the origin cannot re-fire. This is the molecular basis of
  once-per-cycle initiation, and the missing piece that lets the DnaA-ATP/oriC trigger replace the
  cell-mass heuristic cleanly.
