findings:
- id: F-01
  kind: biological
  status: contradicts
  statement: The cohort is NOT silent. Across 9 (seed, generation) observations it received 13 transcripts,
    up to 3 in a single run, so 'never transcribed' is refuted.
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: zero-synthesis-is-reproducible
    observed: 3.0
  expected:
    summary: Every cohort TU receives zero transcripts in every seed and generation.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  tier: observation
  summary: 'The null test did its job and dissolved the framing it was written to

    check. dnag-production-deficit reported TU00352 at zero synthesis with mRNA

    absent at 100% of timesteps, from ONE generation of ONE seed. Across nine

    observations TU00352 alone receives 5 transcripts.


    This was foreseeable and was the reason the axis existed: 43.3% of all 3277

    transcripts get zero in a single generation, because most are low-probability

    and a generation is a finite number of draws. A zero from n=1 could never have

    established silence, and the prior study should not have claimed it.

    '
- id: F-02
  kind: biological
  status: confirms
  statement: 'The 294 comparison TUs transcribe normally: median 55 transcripts per observation, realized
    at 1.006x their assigned probability, 1.2% zeros.'
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: comparison-group-is-synthesized
    observed: 55.0
  expected:
    summary: The comparison group should be transcribed.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  tier: observation
  summary: 'The positive control passes cleanly, which is what licenses the contrast.

    A comparison median of 1.006x assigned means the model normally transcribes very

    nearly as specified, so a cohort sitting far below that is a real deviation and

    not a general property of the transcription process.

    '
- id: F-03
  kind: biological
  status: contradicts
  statement: No shared attribute explains the cohort. Only is_mRNA (80.6% of the comparison group) is
    common to all six, and just 1 of 6 is idx_rprotein.
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: cohort-shares-a-distinguishing-attribute
  tier: mechanism
  summary: 'The mechanism hypothesis fails. The ribosomal-protein override was the

    leading candidate -- TU00352 is in idx_rprotein and its basal_prob is replaced by

    a fixed probability -- but only ONE of the six is in that set, so the override

    explains TU00352 and nothing else.


    Length was also tested, because the cohort''s median length (2222 nt) is more than

    double the comparison group''s (938 nt) and that looked promising. It does not

    hold: one cohort member sits at the 32nd percentile of comparison lengths, and

    across all 300 the correlation between log length and log realized/assigned is

    only -0.106. Recorded as tested and rejected rather than left as a live story.


    So the depression is real but its cause is unidentified. That is the honest state.

    '
  expected:
    summary: All six should share an attribute rare in the comparison group.
  next_action: Examine the per-TU synthesis probability actually in force at runtime, rather than static
    cache attributes, since no static attribute distinguishes the cohort.
  next_action_type: split_hypothesis
  provenance:
    run_ids:
    - silent-transcription-units__sweep
- id: F-04
  kind: biological
  status: partial
  statement: The cohort is transcribed at 0.000-0.020 of its assigned probability against a comparison
    median of 1.006 -- about 51x depressed -- but the worst member exceeds the pre-registered 0.01 bar.
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: effective-probability-explains-silence
    observed: 0.019652
  expected:
    summary: Cohort realized/assigned should be below 1% if silence is by construction.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  tier: mechanism
  summary: 'A fail on the letter of the threshold, with the substance strongly

    supported. Five of the six sit below 0.01; TU00352 reaches 0.0197.


    The threshold is NOT relaxed to fit. It was pre-registered at 0.01 before the

    sweep and moving it afterwards would convert a genuine prior into a post-hoc

    rationalisation, which is the failure this investigation has already made once.

    The axis is recorded as failing and the effect size is reported alongside it.


    What the number does establish: the comparison group transcribes at essentially

    its assigned rate, so the model is not generally lossy. The cohort is

    specifically depressed, by roughly fifty-fold, for a reason F-03 shows is not

    any static attribute yet examined.

    '
- id: F-05
  kind: biological
  status: confirms
  statement: 'The defect is not dnaG-specific: four other cistrons (EG10401, EG10833, EG11140, G6542)
    depend entirely on cohort transcripts.'
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: silence-generalises-beyond-dnag
    observed: 4
  expected:
    summary: At least one other cistron should depend entirely on cohort transcripts.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  tier: mechanism
  summary: 'dnaG surfaced only because a replication gate made its absence visible.

    Four other cistrons have every one of their transcripts inside the depressed

    cohort and are therefore supplied at the same ~50x-reduced rate, with nothing in

    the model drawing attention to them.


    This is the finding with the widest consequence. It means the deficit is a class

    of under-supplied genes rather than a single accident, and that other proteins

    are quietly scarce for the same reason.

    '
- id: F-06
  kind: biological
  status: contradicts
  statement: 'The regression pin fails: dnaG received 5 transcripts across 9 observations, so it is rarely
    transcribed rather than never.'
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: dnag-remains-stranded
    observed: 5.0
  expected:
    summary: dnaG should receive zero transcripts, as previously reported.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  tier: observation
  summary: 'The pin was carried from dnag-production-deficit to catch drift. It fails

    immediately, and the thing it caught is that study''s own overclaim rather than a

    later regression.


    dnaG''s protein deficit still stands -- roughly 0.5 transcripts per generation

    against a peer median of 55 is ample to explain a protein that sits at zero 62%

    of the time. What changes is the mechanism''s description, from ''never

    transcribed'' to ''transcribed about fifty-fold below its assigned rate''.

    '
- id: F-07
  kind: biological
  status: partial
  statement: Two of five graded axes are within tolerance; the card gate fails on the null and on the
    effective-probability bar.
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: silent_tus
  tier: mechanism
  summary: 'The failures are informative rather than defects in the study. The null

    failing is the study working as designed; the effective-probability axis fails on

    a threshold held at its pre-registered value despite a ~51x effect.

    '
  expected:
    summary: All graded axes within tolerance.
  provenance:
    run_ids:
    - silent-transcription-units__sweep
- id: F-08
  kind: computational
  tier: interpretation
  mechanism_origin: engineered
  status: novel
  statement: A class of high-probability transcripts is transcribed ~50x below its assigned rate for reasons
    no static attribute explains, under-supplying at least five cistrons including dnaG.
  summary: 'The study replaces a strong wrong claim with a weaker right one, and widens it.


    Wrong: ''these transcripts are never made.'' That came from a single generation and

    does not survive nine. Right: they are made at roughly a fiftieth of their assigned

    rate, while comparable transcripts are made at essentially exactly their assigned

    rate. Wider: this affects at least five cistrons, not just dnaG.


    The cause is open. The ribosomal-protein override explains one of six; length was

    tested and rejected; no other static attribute in the cache distinguishes the group.

    That points the next investigation at runtime state -- the probability actually in

    force during a run, and how transcripts are selected from it -- rather than at more

    cache inspection, which has now been exhausted without success.


    Marked engineered: nothing was tuned to produce this. It follows from how the model

    assigns and samples synthesis probability.

    '
  expected:
    summary: No pre-registered expectation; a synthesis formed after the sweep and a hypothesis for the
      next study.
  evidence:
    from_run: silent-transcription-units__sweep
    from_test: effective-probability-explains-silence
  provenance:
    run_ids:
    - silent-transcription-units__sweep
  next_action: Instrument the per-TU synthesis probability in force at runtime and compare it against
    the assigned value for cohort vs comparison TUs.
  next_action_type: refine_representation
conclusion: 'The cohort is depressed, not silent, and the cause is not any static attribute.


  Across 9 (seed, generation) observations the six transcripts received 13 in total,

  up to 3 in a single run. The null test therefore FAILS and the ''never transcribed''

  framing inherited from dnag-production-deficit is refuted. That claim rested on one

  generation of one seed, and 43.3% of all 3277 transcripts receive zero in a single

  generation, so it could never have been established from that evidence.


  What survives is a large, well-controlled effect. The 294 comparable top-300

  transcripts are realized at 1.006x their assigned probability -- the model normally

  transcribes very nearly as specified -- while the cohort sits at 0.000-0.020, about

  51x below. The positive control passing at median 55 transcripts with 1.2% zeros is

  what licenses that contrast.


  The mechanism is NOT identified. The ribosomal-protein override was the leading

  candidate and explains exactly one of the six. Length looked promising, since the

  cohort median (2222 nt) is more than double the comparison median (938 nt), but it

  fails on inspection: one member sits at the 32nd percentile and the correlation

  between log length and log realized/assigned across all 300 is -0.106. Both are

  recorded as tested and rejected rather than left as live stories.


  The effective-probability axis fails on its threshold while supporting its substance:

  five of six are below the pre-registered 0.01 bar and TU00352 reaches 0.0197. The bar

  is left where it was set. Moving it after seeing the result would convert a genuine

  prior into a rationalisation, which is an error this investigation has already made

  once and should not repeat.


  The widest result is that this is not about dnaG. Four other cistrons -- EG10401,

  EG10833, EG11140 and G6542 -- depend entirely on cohort transcripts and are supplied

  at the same reduced rate, with nothing in the model drawing attention to them. dnaG

  surfaced only because a replication gate made its absence visible.


  Consequence for the prior study: dnaG''s protein deficit stands, since ~0.5

  transcripts per generation against a peer median of 55 amply explains a protein at

  zero 62% of the time. Its DESCRIPTION changes from ''never transcribed'' to

  ''transcribed about fifty-fold below its assigned rate'', and dnag-production-deficit

  has been corrected accordingly.


  Next: static cache inspection is now exhausted without finding a discriminator, so

  the question moves to runtime -- the synthesis probability actually in force during a

  run, and how transcripts are selected from it.

  '
conclusion_verdicts:
  regression_compatibility:
    verdict: confirmed
    basis: No model code or data was changed. 3 seeds x 3 generations of stock v2ecoli on the existing
      cache with no perturbation; 13.4 min, 0 failures.
  biological_validation:
    verdict: not_met
    basis: Two of five acceptance criteria pass. The null fails, refuting the inherited 'silent' framing,
      and the effective-probability axis fails its pre-registered threshold (0.0197 vs 0.01) despite a
      ~51x effect. No shared attribute explains the cohort, so the mechanism remains unidentified.
  explanatory_gain:
    verdict: confirmed
    basis: 'The study corrected a claim from its own predecessor rather than inheriting it: ''never transcribed''
      does not survive 9 observations. It replaced it with a quantified and controlled one -- ~51x depression
      against peers realized at 1.006x assigned -- eliminated two candidate mechanisms (the rProtein override
      explains 1 of 6; length rejected at r=-0.106), and widened the scope from dnaG to five stranded
      cistrons.'
claim: A class of high-probability transcripts is transcribed ~51x below its assigned rate, under-supplying
  at least five cistrons including dnaG; they are depressed rather than silent, and no static attribute
  explains it.
observable_correction: 'OBSERVABLE CORRECTION 2026-09-03 from dnag-protein-mass-balance.


  This study used DnaG protein = 1.76 copies. That figure is the FREE-MONOMER bulk

  count sampled from the permissive arm of a different sweep. The correct observable is

  listeners.monomer_counts (total protein), which gives 7.996 copies on the

  silent-transcription-units sweep.


  Consequence: the gap against ParCa''s fitted 38 is 4.75x, not 21.6x. Combined with the

  corrected 5.40x transcription deficit, the arithmetic closes with no residual -- a

  held-out mass balance predicts DnaG at 0.694 of observed.


  Separately: mRNA measured from the BULK store is not a valid discriminator; 3220 of

  3277 transcripts read zero there. The rna_counts listener is the correct source, and

  measured properly TU00352 is still at zero mRNA 100% of the time while 1844 of 3134

  TUs carry mRNA -- so that finding survives and is stronger than when it was made.

  '
confidence: Refuted
