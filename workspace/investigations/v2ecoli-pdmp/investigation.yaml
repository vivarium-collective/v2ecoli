schema_version: 2
name: v2ecoli-pdmp
title: "v2ecoli \u2192 PDMP Whole-Cell Model Reformulation"
created: '2026-05-24'
status: in_progress
phase: 2
question: 'Can v2ecoli''s hybrid algorithmic whole-cell model be incrementally

  transformed into a piecewise-deterministic Markov process (PDMP)

  suitable for likelihood-based inference and causal discovery, without

  discarding the biological knowledge encoded in the current WCM, and

  while maintaining viable E. coli growth at every phase boundary?

  '
hypothesis: "A six-phase incremental replacement \u2014 (0) Markov-blanket\ncharacterization,\
  \ (1) v2ecoli's multi-objective FBA \u2192 kinetic ODE\nmetabolism, (2) discrete-time\
  \ \u2192 continuous-time jump processes,\n(3) observation-likelihood and\nBayesian-interface\
  \ infrastructure, (4) compiled column-centric runtime,\n(5) Bayesian gene-function\
  \ annotation \u2014 yields a PDMP-class WCM that\n(a) reproduces Phase-0 interface\
  \ statistics within tolerance at every\nlater phase, (b) admits well-formed process\
  \ likelihoods at Phase 3,\n(c) achieves \u226510\xB3 parallel single-cell trajectories\
  \ with near-zero\nmarshalling overhead at Phase 4, and (d) recovers known E. coli\
  \ gene\nfunctions with credible intervals on a benchmark set at Phase 5.\n"
lead: "**What this is:** This report is a roadmap for turning v2ecoli from a successful\
  \ but algorithmically assembled whole-cell simulation into a more tractable mathematical\
  \ model. The goal is not to replace the biology, but to preserve what v2ecoli already\
  \ knows while making the model easier to analyze, fit to data, compile, and use\
  \ for causal inference.\n\nv2ecoli is currently the most comprehensive mechanistic\
  \ E. coli\nwhole-cell model in production, but as the DUF final report\n([[duf-final-report]])\
  \ documents, it is best characterized as a hybrid\nalgorithmic simulator rather\
  \ than a numerical integrator of a\nmathematically defined dynamical system. This\
  \ is the central\nobstacle to Bayesian parameter inference and computational causal\n\
  discovery in WCMs. The v2ecoli \u2192 PDMP roadmap\n([[v2ecoli-pdmp-roadmap]]) prescribes\
  \ an incremental replacement \u2014\none WCM component per phase \u2014 that converges\
  \ on a piecewise-\ndeterministic Markov process while preserving viability at every\n\
  boundary.\n"
executive:
  what_is_this: Incrementally transforms v2ecoli from a hybrid algorithmic whole-cell
    model into a piecewise-deterministic Markov process. Six phases each swap one
    WCM component -- characterization, a metabolism ODE, jump processes, an inference
    layer, a compiled runtime, and causal discovery -- while leaving the rest intact.
  verdict: "Updated 2026-06-12. The investigation's central thesis \u2014 that v2ecoli's\
    \ hybrid WCM can be incrementally turned into a likelihood-bearing PDMP-class\
    \ model while staying viable \u2014 now has working, test-backed evidence on its\
    \ first three phases, with Phases 4-5 as a clearly-scoped roadmap. PHASE 0 (pdmp-00):\
    \ the per-process RNG-seeding fix is real and test-backed (tests/test_seed_diversity.py\
    \ passes; ensembles genuinely diverge), and a real 3-condition Phase-0 reference\
    \ ensemble (M9-glucose/acetate/+aa, N=32 x 600 s, 96 runs) is committed (canonical\
    \ N=64 x 3-condition reference + multi-generation zarr remain the open tail).\
    \ PHASE 1 (pdmp-01): the +/-sigma W2 acceptance gate is met on M9-glucose (cell_mass\
    \ W2/sigma 3.02 -> 1.00 after a closed-loop WATER[c] fix; root-caused a silently-zero-gain\
    \ LQR and an open-loop water-injection bug along the way). The FBA-bridge flux-pin\
    \ integrates the Millard 2017 kinetic ODE into the WCM (composite millard_fba_bridge_harness):\
    \ the ODE drives the WCM's full glycolytic + pentose-phosphate backbone (held\
    \ pins match the ODE exactly and differ >10% from the unpinned FBA), while the\
    \ TCA cycle is characterized as growth-coupled (its flux is set by WCM biomass\
    \ demand, not the standalone kinetic model); remaining work is the multi-condition\
    \ gate (acetate/+aa), TCA growth-coupling, and PYK variant-pinning. PHASE 2 (pdmp-02):\
    \ the cell_mass trajectory-distribution-match gate failed and the redirect to\
    \ count-level listeners is now empirically confirmed \u2014 across-seed variance\
    \ is ~30x larger at the per-event count (rna_init_event) than in aggregate mass/pool\
    \ observables, which the homeostat washes out (scripts/phase2_count_variance.py).\
    \ PHASE 3 (pdmp-03): a real ABC-SMC (importance weights + perturbation kernel\
    \ + adaptive-epsilon) plus Simulation-Based Calibration and a posterior-predictive\
    \ check are built and the SBC/PPC/recovery checks below run on a WCM-calibrated count SURROGATE -- the study's acceptance gate (full-WCM-in-the-loop, K=1000, multi-modality) remains BLOCKED: posterior\
    \ recovery (theta=1.2 -> 90%% CI [1.198,1.201], shrinks ~1/sqrt(n)), SBC rank-histogram\
    \ uniformity (K=150, chi2 p=0.576 -- but a knife-edge single-seed pass: only 4/5 seeds pass and it flips to FAIL under a 5th-significant-figure calibration change, so not a robust certificate), PPC coverage 0.84-0.91 by seed, and a 2-parameter joint\
    \ inference with per-parameter SBC. Scope: validated on the count likelihood,\
    \ not the full WCM in the ABC loop (deferred to Phase 4); the SBC gate twice rejected\
    \ under-converged inference before passing at ng=12, i.e. the gate does its job -- though the K=150 pass itself is a knife-edge single-seed result (not robust; see pdmp-03 finding sbc-k150-pass-is-knife-edge-not-robust), so the real inference-ready bar remains the deferred full-WCM K=1000 gate. A separate hardening check exonerated the ABC engine refactor (commit 28cad208): pre- and post-refactor engines give byte-identical SBC results, so scalar back-compat holds. PHASE 4 (pdmp-04):\
    \ per-tick profiling is real (76%% of per-tick time outside process_update; 13,817\
    \ isinstance + 4,213 __array_finalize__ + 52 process_update calls/tick); the earlier\
    \ \"~1500x\" speedup was corrected to an illustrative projection (a compiled column-centric\
    \ runtime was never built or timed). Building that runtime is the planned Phase-4\
    \ deliverable and the unblock for full-WCM-in-the-loop inference. PHASE 5 (pdmp-05):\
    \ Bayesian gene-function annotation is a design-stage roadmap that depends on\
    \ Phases 3-4. Net: the kinetic-model->WCM integration and the inference methodology\
    \ are demonstrated and validated; the remaining work (compiled runtime, multi-modal\
    \ full-WCM inference, gene-function recovery) is scoped, not yet built.\n"
  verdict_status: in-progress
  decisions_needed:
  - question: Should Phase-3+ inference anchor on count-level listeners or on aggregate
      cell_mass / log-likelihood?
    status: "RESOLVED \u2014 count-level listeners"
    context: "Phase 2 sprints 6\u20139, confirmed by Phase 3 sprints 12-13: on a self-generated\
      \ 3\xD73 toy grid (N=4, 60 s),\nthe combined count vector sqrt(d_rna\xB2 + d_ribosome\xB2\
      ) gives a larger next-nearest-CELL grid-separation\nratio (3.06\xD7) than aggregate\
      \ log-likelihood (2.39\xD7) \u2014 grid-separation diagnostics, not a posterior\n\
      (the \"~100\xD7 sharper\" figure is a hardcoded literal). Count-level listeners\
      \ are the right direction.\n"
  - question: Is the Phase-4 performance attack a column-centric runtime or per-Process
      Catalyst.jl JIT?
    status: "OPEN \u2014 column-centric runtime is the leading hypothesis, not yet\
      \ built or timed"
    context: "Sprint 1-2 profile (real) shows ~76% framework overhead and ~14K isinstance/tick\
      \ + 4K\n__array_finalize__/tick dominate, suggesting per-Process compilation\
      \ buys at most ~10% of per-tick\ntime. The \"~1500\xD7 at N=10\xB3\" figure\
      \ is an illustrative projection (toy factor 3\xD7 \xD7 N by construction\nin\
      \ phase4_wcm_baseline_projection.py); the column-centric runtime was never built\
      \ or timed, so this\nis not a measured speedup.\n"
  - question: Can Phase 5 (Bayesian gene-function annotation) reach its gate within
      the current design space?
    status: OPEN
    context: "Depends on Phase 4 implementation; the per-particle wall budget must\
      \ drop to <0.05 sec/tick before\nABC-SMC at the gene-function scale is tractable.\
      \ Phase-5 sprints 1-4 additionally show the current\nobservable hits an information-theoretic\
      \ ceiling (log BF +0.45 < Jeffreys substantial even at the\nwidest spacing)\
      \ \u2014 observable choice is the remaining lever, not replicate budget.\n"
  - question: What is the root-cause fix for the pbg scalar-pruning quirk (task
    status: OPEN
    context: 'Scalar listener fields with no downstream consumer get silently pruned
      from the merged state. Worked

      around in Phase 3 sprints 1 and 13 via pin-via-consumer input declarations;
      the real fix lives at the

      pbg merger layer.

      '
  - question: Why does the JAX/Diffrax metabolism backend fail in-WCM (task
    status: OPEN
    context: 'The backend works standalone but fails inside the WCM composite. Phase
      1 perf #4 follow-up; blocks the

      JAX path for the in-WCM Millard ODE.

      '
inputs:
  datasets:
  - name: millard2017-central-metabolism-sbml
    path: v2ecoli/models/sbml/millard2017_central_metabolism.xml
    supports_claims: "Phase-1 ODE substrate \u2014 BioModels MODEL1505110000 (Millard\
      \ 2017), the published kinetic ODE of E. coli central carbon + energy metabolism\
      \ wrapped via pbg-copasi's CopasiUTCProcess. Recovered to solver tolerance (pdmp-01,\
      \ 2026-05-24)."
  - name: phase0-reference-ensemble
    path: .pbg/runs/phase0-traj{,-acetate,-with_aa}/seed_*/
    supports_claims: "Phase-0 reference validation dataset (intended) \u2014 192 replicate\
      \ runs (3 conditions \xD7 N=64, single-generation, 600 model-seconds, 121 snapshots\
      \ \xD7 12 listener observables per seed). Every Phase 1+ replacement is meant\
      \ to validate its interface statistics against this ensemble (W\u2082 within\
      \ the Phase-0 bootstrap CI). NOTE: these run artifacts are NOT committed in\
      \ this checkout \u2014 pdmp-00 is being re-run to produce committed, verified\
      \ reference data; multi-generation zarr extension pending (task #39)."
  references:
  - millard2017
  - macklin2020
  - agmon2022
  - birch2014
  - stumpf2021
  - saa2017
  - talts2018sbc
  expert_docs:
  - name: duf-final-report
    path: workspace/references/expert/duf_final_report_2026.pdf
  - name: v2ecoli-pdmp-roadmap
    path: workspace/references/expert/v2ecoli_pdmp_roadmap.pdf
scientific_argument:
  main_claim: "The PDMP class \u2014 ODE segments interrupted by discrete jump events\
    \ \u2014\nis the appropriate mathematical model class for a next-generation E.\
    \ coli\nWCM: it has process likelihoods by construction, enforces an\nexplicit\
    \ causal/teleonomic parameter partition, and aligns with the\ncausal-modelling\
    \ literature for dynamical systems.\n"
  evidence_for:
  - DUF final report Sec. 4.1.2 identifies PDMPs (a.k.a. jump-ODEs) as the suitable
    model class for reformulating v2ecoli; [[duf-final-report]].
  - "Millard et al. 2017 demonstrate that metabolic regulation in E. coli central\
    \ carbon and energy metabolism is sufficient for coordinated glucose uptake, growth,\
    \ and energy production via an ODE-only kinetic model \u2014 providing the foundational\
    \ substrate for the Phase-1 reformulation; [[millard2017]]."
  - Vivarium's algebraic-effect interpretation (DUF Sec. 4.2.2) opens a path to extending
    it into a probabilistic programming language for observe / intervene effects in
    Phase 3.
  - "Phase 1 empirical \u2014 MillardPDMPMetabolism + JAX/Diffrax + consumption_matched\
    \ ref-growth driver landed (PR #72, merged 2026-05-30), but the \xB1\u03C3 acceptance\
    \ is not met: the cited figure (reports/figures/pdmp-01/pdmp_vs_phase0.html) shows\
    \ cell_mass ~ -20\u03C3 / dry_mass ~ -18\u03C3 (up to -600\u03C3) outside the\
    \ band, and a real multi-replicate W\u2082 was never computed (compare_pdmp_vs_phase0.py\
    \ is a single-replicate z-score). Phase 1 is being re-run for verification."
  - "Phase 2 empirical \u2014 per-promoter and per-protein Poisson tau-leap landed\
    \ in `poisson` mode. A max |\u0394cell_mass| = 150 fg between configs (transient,\
    \ single trajectory pair) was measured on the cell_mass quantity (scripts/trajectory_divergence.py,\
    \ sprint 4) \u2014 not at rnap_data. The acceptance gate pdmp-trajectory-distribution-match\
    \ failed (Poisson W\u2082 grows 9.73 \u2192 49.46)."
  - "Phase 3 pipeline empirical \u2014 emission \u2192 LikelihoodCollector \u2192\
    \ XArrayEmitter zarr \u2192 xarray.Dataset(replicate \xD7 time \xD7 channel) readback\
    \ \u2192 mean-to-mean \u03B5 calibration \u2192 SMC sequential refinement was\
    \ built (genuine infrastructure). The \"observed\" data are generated at the scale=1.0\
    \ grid node, so any apparent collapse to that node is tautological, not a recovered\
    \ posterior; SBC/PPC were never run (cited scripts do not exist)."
  - "Phase 3 architectural finding (sprints 11-13) \u2014 pipeline emits self-calibrated\
    \ `log P(simulated | simulated_param)`, not the ABC-correct `log P(observed |\
    \ proposed)`. Switching to count-based ABC distances is the architectural fix."
  - "Phase 3 grid-separation diagnostic \u2014 on a self-generated 3\xD73 toy grid\
    \ (N=4, 60 s), the combined count vector `sqrt(d_rna\xB2 + d_ribosome\xB2)` gives\
    \ a next-nearest-CELL grid-separation ratio of 3.06\xD7 (vs 2.39\xD7 for aggregate\
    \ log-likelihood). This is a separation diagnostic on a self-generated grid, not\
    \ a posterior or credible interval."
  - "Phase 3 transcript-count signal \u2014 `total_rna_init` separates the truth row\
    \ (27K) from off-truth rows (3.8M) along the Ts axis; the \"~150\xD7 row-separation\"\
    \ figure is a hardcoded literal (no script computes it). Indicates the count metric\
    \ tracks the parameter channel it is causally linked to."
  - "Phase 3 anti-diagonal ridge (sprint 10) \u2014 2D (Ts, Ps) sweep under aggregate\
    \ log-likelihood: reducing transcription while raising translation partially cancels\
    \ (fewer mRNAs \xD7 more activations per mRNA \u2192 similar total log P/tick).\
    \ Per-channel distance breaks the ridge."
  - "Phase 4 hot-path empirical \u2014 production composite per-tick wall = 52 ms\
    \ (sprint 5) / 74 ms (sprint 1 single-tick). 76% lives in framework overhead (Python\
    \ internals + numpy + v2ecoli library + other site-packages)."
  - "Phase 4 marshalling hotspots (sprint 2) \u2014 13,817 `isinstance` + 4,213 `__array_finalize__`\
    \ + 52 `process_update` calls per tick. Marshalling dominates over per-Process\
    \ compute."
  - "Phase 4 toy-prototype per-tick measurements (sprints 3-4-6) \u2014 3.1\xD7 on\
    \ pure-Poisson toy, 2.8\xD7 on 3-step toy, 1.5\xD7 on realistic TranscriptInitiation-shaped\
    \ workload. These are isolated toy micro-benchmarks, not the WCM runtime."
  - "Phase 4 projection (NOT measured) \u2014 column-centric runtime \xD7 N-way lockstep\
    \ is PROJECTED at \"~1500\xD7\" total speedup at N=10\xB3, but this is an illustrative\
    \ projection: phase4_wcm_baseline_projection.py hardcodes a toy factor 3\xD7 and\
    \ sets column wall = per_tick/3.0 with no N-dependence, so speedup = 3\xD7 \xD7\
    \ N by construction. The column-centric runtime was never built or timed. Choosing\
    \ it over per-Process Catalyst.jl JIT is a hypothesis, not a validated result."
  - "Phase 5 sprint 1 (Bayes-factor stub) \u2014 model-comparison shape works on Phase-3\
    \ ABC infrastructure: 5-hypothesis sweep of transcript_init_prob_scale, exp(-d/2\u03C3\
    \xB2) marginal-likelihood proxy with \u03C3=sprint-8 noise floor, posterior peaks\
    \ at truth (28.8%). Weak signal \u2014 log BF +0.32 vs runner-up \u03B8=1.15 (within\
    \ Jeffreys \"weak\" band). Confirms identifiability floor: posterior cannot peak\
    \ sharper than the noise-floor \u03C3 allows."
  - "Phase 5 sprint 2 (pseudo-marginal + bias diagnostic) \u2014 sprint 1's biased\
    \ \"distance-of-the-mean\" estimator overstated the signal. Unbiased per-replicate\
    \ kernel average shrinks truth posterior from 28.8% \u2192 24.4% (essentially\
    \ the 20% uniform baseline over 5 hypotheses); log BF (truth vs runner-up) collapses\
    \ from +0.32 \u2192 +0.01. Bootstrap 95% CI on truth posterior: [22.4%, 26.8%].\
    \ Per-\u03B8 Jensen bias was heterogeneous (\u0394log 0.47\u20130.87), so sprint\
    \ 1 was systematically wrong, not just noisily wrong. The unbiased estimator confirms:\
    \ at N=4 with sprint-7 ensembles, the data have essentially zero power to discriminate\
    \ \xB115% scale variation."
  - "Phase 5 sprint 3 (N-scaling projection) \u2014 sharpens the Phase-5 bottleneck\
    \ diagnosis. CLT + parametric projection from sprint-2's per-\u03B8 kernel statistics\
    \ to N \u2208 {4...1024} shows that N alone CANNOT rescue the signal: the kernel-mean\
    \ gap between truth (log k\u0304=-0.998) and runner-up \u03B8=1.15 (log k\u0304\
    =-1.009) is only \u0394log=+0.011, so as N\u2192\u221E the log-BF CI tightens\
    \ AROUND that near-zero gap. Substantial/decisive Jeffreys thresholds never reached\
    \ even at N=1024. The bottleneck is information-theoretic (observable + \u03C3\
    \ + hypothesis spacing), not statistical-power. Reclassifies the Phase-5 levers:\
    \ (1) wider hypothesis spacing, (2) richer observable (the Phase-3 combined count\
    \ vector), (3) tighter \u03B5; N is the LEAST useful lever."
  - "Phase 5 sprint 4 (hypothesis-spacing sweep, no new sims) \u2014 tests sprint\
    \ 3's diagnosis by computing the unbiased pseudo-marginal posterior over progressively-wider\
    \ SUBSETS of the existing sprint-7 grid. Truth posterior climbs from 24% (5-way\
    \ \xB115%) \u2192 43% (3-way \xB130%) \u2192 61% (2-way truth vs \u03B8=1.3),\
    \ confirming spacing IS a lever for the within-grid 1/n_H dilution effect. But\
    \ log BF maxes at +0.45 even in the most favorable 2-way subset \u2014 STILL BELOW\
    \ Jeffreys substantial threshold of 1. Sprint 4 separates two identifiability\
    \ effects: within-grid dilution (spacing fixes) vs per-pair kernel-mean ceiling\
    \ (only observable or \u03C3 can fix). After sprints 1-4, the SINGLE remaining\
    \ Phase-5 lever in the current design space is observable choice."
  evidence_against:
  - "v2ecoli's current FBA metabolism (multi-objective: biomass + homeostatic + kinetic-constraint,\
    \ via `wholecell.utils.modular_fba`) is tightly coupled to the rest of the WCM\
    \ \u2014 enzyme abundances feed the kinetic-constraint bounds, doubling-time feeds\
    \ the homeostatic concentration targets, and ppGpp couples to transcriptional\
    \ regulation. ODE substitution must reconstruct all three coupling channels before\
    \ interface statistics will match (Phase 1 risk)."
  - Continuous-time jump propensities require measured kinetic constants for transcription/translation/division
    that may not exist at the necessary precision (Phase 2 risk).
  key_figures:
  - chart: investigations/v2ecoli-pdmp/reports/pdmp-02-jump-processes.html
    caption: "Phase 2 closeout report \u2014 cell_mass is the wrong observable for\
      \ jump-process variance."
  - chart: investigations/v2ecoli-pdmp/reports/pdmp-03-inference.html
    caption: "Phase 3 report \u2014 count-vector grid-separation diagnostic (3.06\xD7\
      \ next-nearest-cell ratio) on a self-generated 3\xD73 toy grid; not a posterior.\
      \ Gate unmet."
  - chart: investigations/v2ecoli-pdmp/reports/pdmp-04-compilation.html
    caption: "Phase 4 report \u2014 real per-tick profile is genuine; the \"~1500\xD7\
      \" speedup is an illustrative projection (toy factor 3\xD7 \xD7 N), not a measured\
      \ result. Column-centric runtime not built or timed."
  - chart: reports/figures/pdmp-03/abc_count_metric.html
    caption: "Count-based ABC distance grid-separation diagnostic; the \"~100\xD7\
      \ sharper\" figure is a hardcoded literal, not computed."
  - chart: reports/figures/pdmp-03/abc_smc_sequential.html
    caption: "SMC sequential \u03B5 refinement on the toy grid; the \"observed\" data\
      \ are generated at the truth node, so apparent concentration there is tautological,\
      \ not a recovered posterior."
  - chart: reports/figures/pdmp-03/abc_smc_2d.html
    caption: 2D parameter sweep reveals anti-diagonal ridge under aggregate log-likelihood.
  - chart: reports/figures/pdmp-03/abc_multi_observable.html
    caption: "Per-channel vs aggregate ABC \u2014 diagnoses the self-calibration issue."
  - chart: reports/figures/pdmp-03/likelihood_ensemble.html
    caption: Phase-3 ensemble figure with intra-ensemble noise floor.
  - chart: reports/figures/pdmp-04/marshalling_hotspots.html
    caption: 'Phase 4 hotspots: 13,817 isinstance + 4,213 __array_finalize__ + 52
      process_update/tick.'
  - chart: reports/figures/pdmp-04/per_step_compute_decomposition.html
    caption: 'Per-tick decomposition: 76% framework overhead, no single Process dominates.'
  - chart: reports/figures/pdmp-04/column_centric_prototype.html
    caption: 'Column-centric prototype: constant per-trajectory wall regardless of
      N.'
  - chart: reports/figures/pdmp-04/wcm_baseline_projection.html
    caption: "Real WCM per-tick baseline + an illustrative projection: the \"~1500\xD7\
      \" at N=10\xB3 is a toy factor 3\xD7 \xD7 N by construction (no measured column-centric\
      \ runtime), NOT a measured speedup."
  - chart: reports/figures/pdmp-04/ti_shaped_prototype.html
    caption: "TI-shaped recalibration: 1.5\xD7 per-tick (vs toys' 3\xD7) under realistic\
      \ per-tick work."
  - chart: reports/figures/pdmp-04/multistep_prototype.html
    caption: "3-step composite: speedup does not compound \u2014 pbg overhead is per-process."
  - chart: reports/figures/pdmp-02/trajectory_divergence.html
    caption: "Phase-2 trajectory-shape divergence: max |\u0394cell_mass| = 150 fg\
      \ between configs (transient, single trajectory pair), measured on the cell_mass\
      \ quantity."
  - chart: reports/figures/pdmp-02/ensemble_validation_period60.html
    caption: "Phase-2 sparse-injection ensemble \u2014 homeostat washes per-tick variance."
  caveats:
  - "Resource estimates in the roadmap assume 2\u20134 FTE per phase; absent that\
    \ staffing, phases will run serially over much longer wall time."
  - "Phases 1\u20132 are designated parallelizable with Phase 4; Phase 3 strictly\
    \ depends on Phase 2; Phase 5 depends on all preceding phases."
  - "Phase 2 observable-choice \u2014 cell_mass is the wrong observable for jump-process\
    \ variance. The consumption_matched homeostat washes per-tick variance out by\
    \ construction. Three controller-tuning attempts (tau-EMA, open-loop, sparse)\
    \ all failed; Phase 3 correctly pivoted to count-level listeners."
  - "Phase 3 self-calibration \u2014 emitted log-likelihood is `log P(simulated |\
    \ simulated_param)`, not the ABC-correct `log P(observed | proposed)`. Log-likelihood-based\
    \ ABC works but is the strictly weaker tool vs the count-based metric Phase 3\
    \ sprints 12-13 established."
  - "Phase 4 projection is not a measured speedup \u2014 the \"3000\xD7\" and \"~1500\xD7\
    \" figures are an illustrative projection: the script hardcodes a toy factor 3\xD7\
    \ and sets column-centric wall = per_tick/3.0 with no N-dependence, so total speedup\
    \ = 3\xD7 \xD7 N by construction. The column-centric runtime was never built or\
    \ timed; treat these numbers as a toy order-of-magnitude motivation, not a result."
  - "Pbg wiring quirk (task #14) \u2014 scalar listener fields with no downstream\
    \ consumer get silently pruned from the merged state. Bit sprints 1 and 12; worked\
    \ around via pin-via-consumer input declarations. Real fix lives at the pbg merger\
    \ layer."
  - "Phase 5 information-theoretic ceiling \u2014 sprints 2-3 together reclassify\
    \ the Phase-5 bottleneck. Sprint 2 confirmed at N=4 the unbiased posterior is\
    \ essentially uniform (log BF +0.01, truth 24.4% vs baseline 20%). Sprint 3 projected\
    \ to N=1024 and found N CANNOT rescue the signal \u2014 the kernel-mean gap between\
    \ truth and runner-up \u03B8=1.15 is only \u0394log=+0.011 nats; as N\u2192\u221E\
    , the log BF CI tightens around that near-zero gap, not toward a decisive threshold.\
    \ Levers in order of impact: (1) wider hypothesis spacing, (2) richer observable\
    \ (Phase-3 sprint 13 combined count vector), (3) tighter \u03B5; (4) N \u2014\
    \ last and least useful at the current setup."
biological_story: "E. coli grows by integrating metabolism, gene expression, replication,\
  \ and division \u2014 processes on very different timescales that admit different\
  \ mathematical idealizations. The current v2ecoli WCM fuses these into a fixed-step\
  \ loop: a single multi-objective FBA linear program solves metabolism each timestep\
  \ (`wholecell.utils.modular_fba` with GLPK-linear: biomass production + homeostatic\
  \ concentration targets + optional kinetic-constraint targets driving enzyme-catalysed\
  \ flux toward Vmax\xD7[E]; output fluxes converted to molecule count changes via\
  \ `stochasticRound`), discrete-time Poisson draws fire transcription and translation\
  \ events scaled by timestep, a teleonomic doubling-time target triggers division,\
  \ and an allocator gates each layer's access to shared bulk pools (metabolism runs\
  \ LAST in the timestep, deriver-style, on the post-partition state). This reproduces\
  \ growth across roughly a dozen conditions, but its trajectory is that of an algorithm,\
  \ not of any well-defined dynamical system.\n\nA PDMP separates this into deterministic\
  \ evolution between events (ODE flow on continuous state) and discrete jumps at\
  \ event times (state-dependent probability kernels on countable state). Mass-action\
  \ kinetics for central carbon metabolism, like Millard et al. 2017's curated ODE\
  \ model, naturally inhabit the deterministic flow; gene-expression events, division,\
  \ and resource competition inhabit the jump layer. The PDMP formalism makes both\
  \ layers inspectable, compilable, and likelihood-bearing."
at_a_glance:
- study: pdmp-00-characterization
  role: Markov-blanket interface extraction + reference ensembles; the RNG-seeding
    fix is test-backed and the 3-condition N=32 Phase-0 ensemble is committed.
- study: pdmp-01-metabolism-ode
  role: "Replace v2ecoli's multi-objective FBA with the Millard 2017 kinetic ODE;\
    \ the \xB1\u03C3 W2 gate is met on M9-glucose and the FBA-bridge flux-pin (millard_fba_bridge_harness)\
    \ drives the glycolytic + pentose-phosphate backbone while the TCA is growth-coupled."
- study: pdmp-02-jump-processes
  role: Replace discrete-time stochastics with continuous-time jumps; the cell_mass
    gate failed (wrong observable) and the redirect to count-level listeners is confirmed
    (~30x more variance at rna_init_event).
- study: pdmp-03-inference
  role: Observation likelihoods + ABC-SMC inference; a real ABC-SMC + SBC + PPC run on a WCM-calibrated count SURROGATE (recovery robust; PPC passes; SBC K=150 is a
    knife-edge single-seed pass -- 4/5 seeds, flips to FAIL under a tiny calibration
    change -- so not a robust certificate); the study acceptance gate (full-WCM-in-loop,
    K=1000, multi-modality) stays BLOCKED, deferred to the Phase-4 compiled runtime.
- study: pdmp-04-compilation
  role: "Compiled column-centric runtime for \u226510\xB3 parallel trajectories; per-tick\
    \ profiling is real and building the runtime is the planned Design-stage deliverable\
    \ and the unblock for full-WCM-in-loop inference."
- study: pdmp-05-causal-discovery
  role: Bayesian gene-function annotation via marginal likelihood + active causal
    inference; a design-stage roadmap depending on Phases 3-4, not yet built.
how_to_read: "Read the studies in order, pdmp-00 \u2192 pdmp-05: each later study\
  \ presumes the deliverables of the previous one (typed interfaces, ODE metabolism,\
  \ PDMP runner, likelihood accumulator, compiled runtime), and the tests on each\
  \ study card are the contract. The Phase 0 Markov-blanket interface datasets are\
  \ the canonical validation standard for every later study \u2014 a replacement subprocess\
  \ is accepted when its interface statistics match the reference within tolerance."
glossary:
- term: PDMP
  definition: "Piecewise-Deterministic Markov Process \u2014 ODE flow between discrete\
    \ jump events governed by state-dependent probability kernels. Synonym: jump-ODE."
- term: v2ecoli metabolism (kFBA)
  definition: "v2ecoli's actual metabolism solver \u2014 `v2ecoli/processes/metabolism.py`\
    \ \u2192 `FluxBalanceAnalysisModel` via `wholecell.utils.modular_fba.FluxBalanceAnalysis`\
    \ (GLPK-linear). One LP per timestep with three coupled objectives: (a) biomass\
    \ production `max c^T v`, (b) homeostatic concentration targets derived from media\
    \ + doubling-time (+ optional ppGpp coupling to transcription), (c) kinetic-constraint\
    \ targets (when USE_KINETICS=True) driving enzyme-catalysed flux toward Vmax\xD7\
    [E]. Constraints: stoichiometric `S v = 0`, enzyme-catalysis bounds, NGAM maintenance,\
    \ media exchange bounds. Flux \u2192 counts via `stochasticRound(flux \xD7 dry_mass\
    \ \xD7 dt / (MW \xD7 conv))`. Runs LAST in the timestep (deriver-style, on post-partition\
    \ state). This is what Phase 1 replaces."
- term: tFBA (Birch 2014)
  definition: "Textbook 'time-linked' FBA: a sequence of LPs tracking target trajectories.\
    \ Often loosely cited as v2ecoli's approach; the actual v2ecoli implementation\
    \ is structurally different \u2014 see [[v2ecoli metabolism (kFBA)]] above. Keep\
    \ the distinction when reasoning about what Phase 1 is replacing."
- term: LQR
  definition: Linear-Quadratic Regulator. Outer control layer used in Phase 1 to drive
    the metabolism ODE toward a growth-rate target, replacing v2ecoli's FBA biomass-production
    optimization objective.
- term: Markov blanket
  definition: Minimal set of variables shielding a subprocess from the rest of the
    system; defines the typed Process Bigraph interface for that subprocess.
- term: Causal parameter
  definition: A parameter mechanistically derivable from physics/chemistry (e.g.,
    kinetic constant, enzyme abundance); the inference target.
- term: Teleonomic parameter
  definition: A parameter set by design/policy rather than mechanism (e.g., LQR weight,
    doubling-time reference); fixed and not inferred.
- term: ABC-SMC
  definition: "Approximate Bayesian Computation with Sequential Monte Carlo \u2014\
    \ baseline likelihood-free inference engine for Phase 3."
- term: ChiRho
  definition: Causal-reasoning library on Pyro/PyTorch. Reference inspiration for
    the Vivarium observe(variable, likelihood) / intervene(variable, value) algebraic
    effects.
- term: Russian Roulette estimator
  definition: Unbiased Monte Carlo estimator for doubly-intractable Bayesian likelihoods,
    used in Phase 5 for marginal-likelihood gene-function comparison.
guidelines:
  operational_notes:
  - Composites live under `v2ecoli/composites/*.composite.yaml`; runs go via the dashboard
    `POST /api/composite-test-run` (spec_id `<pkg>.composites.<name>` + steps + overrides),
    and XArrayEmitter trajectories land at `<workspace>/.pbg/runs/<run_id>/store.zarr/`,
    opened downstream via `xarray.open_zarr()`.
  - Each replicate uses a unique `overrides.seed`; ensembles run as N independent
    seeds 0..N-1 under a CONCURRENCY_CAP. The canonical Phase-0 target is N=64 x 3
    conditions = 192 runs; the committed ensemble is N=32 = 96 runs (do NOT cite as
    N=64).
  - 'Per-step compute: v2ecoli WCM baseline ~6 s/step; Millard ODE via pbg-copasi
    <0.05 s/step; the Phase-4 compiled PDMP target is <0.01 s/step/trajectory.'
  - '`out/cache` is symlinked from a shared ParCa build so each worktree skips the
    ~30 min rebuild; per-study `planned_runs:` blocks hold the run-by-run methodology.'
  literature_anchors:
  - "[[millard2017]] \u2014 Phase 1 ODE substrate. Use the published rate laws and\
    \ biomass reaction; calibrate against the strain/condition reported (K-12 MG1655,\
    \ M9 + glucose, dilution rate 0.1/h)."
  - "[[duf-final-report]] \u2014 All identified bottlenecks and rescoping rationale;\
    \ ensures we don't reinvent prior conclusions."
  - "[[v2ecoli-pdmp-roadmap]] \u2014 The phase boundaries and per-phase deliverables;\
    \ deviations from the roadmap should be recorded as decisions on this investigation."
  parameter_catalog:
  - Every parameter introduced after Phase 1 must be labelled causal or teleonomic
    in the parameter_catalog of its study.
  calibration_targets:
  - "Growth rate \xB5 in M9-glucose (0.5\u20130.8 h\u207B\xB9 depending on dilution\
    \ rate) \u2014 sanity check at every phase boundary."
  - "Per-step compute time profile \u2014 Phase 0 baseline; expect order-of-magnitude\
    \ improvement by Phase 4."
  emitter:
  - 'Every run in this investigation uses **XArrayEmitter** (zarr-partitioned, multi-generation
    native; wired into the dashboard via PR #70). Workspace default flipped on this
    branch (workspace.yaml.runtime.default_emitter = xarray, max_generations = 8).'
  - "Phase 0 produces the canonical reference datasets as zarr stores under runs/<run-id>/store.zarr/;\
    \ later phases consume them via xarray.open_zarr() for distribution comparison\
    \ (W\u2082, KS, SBC). sqlite emitter outputs from earlier investigations are not\
    \ used here \u2014 explicit decision to align the validation pipeline on a single\
    \ time-series format."
  - 'Per-study emitter configuration: any baseline/variant composite that does not
    auto-pick up the workspace default must declare `emitter: xarray` in its composite
    YAML. /pbg-run will refuse to run with the wrong emitter on this investigation''s
    studies (lint check at run time).'
  uq_standards:
  - "Distribution comparisons across phase boundaries use Wasserstein-2 distance (W\u2082\
    ) on summary statistics with bootstrap 95% CIs; tolerance per variable derived\
    \ from Phase 0 Monte Carlo replicate spread, NOT chosen ad hoc. KS test as a secondary\
    \ distribution check."
  - "Every stochastic deliverable reports a Monte Carlo standard error (MCSE = std\
    \ / \u221AN_eff) alongside the point estimate. N_eff per phase is sized to push\
    \ MCSE below 10% of the effect size of interest."
  - "ODE-class deliverables specify solver, atol, rtol, and a published step-doubling\
    \ Richardson check confirming the solver converges. Stiffness ratio (max|\u03BB\
    _J| / min|\u03BB_J| of the Jacobian) reported for each major ODE subsystem so\
    \ the solver choice is justified, not guessed."
  - "Jump-process deliverables verify the exponential-clock property: empirical hazard\
    \ \u222B\u03BB(s)ds should be Exp(1)-distributed (Anderson\u2013Darling test,\
    \ \u03B1 = 0.05) over \u226510\u2074 inter-event intervals."
  - "Bayesian deliverables report posterior recovery via Simulation-Based Calibration\
    \ (SBC, Talts et al. 2018): rank histograms should be uniform (\u03C7\xB2 goodness-of-fit,\
    \ p > 0.05) over \u22651000 SBC draws before claiming calibration. 90% credible\
    \ intervals must achieve \u226585% empirical coverage."
  - "Identifiability of every inferred (causal) parameter is checked via Fisher Information\
    \ Matrix conditioning (\u03BA(FIM) < 10\u2078) or profile-likelihood width before\
    \ being claimed inference-ready."
  - "Compiled / parallel deliverables verify numerical equivalence with the reference\
    \ runner to within 5\u03C3 of MC fluctuation; floating-point summation order in\
    \ parallel reductions is held fixed (pairwise / Kahan summation) so posteriors\
    \ are reproducible across hardware."
