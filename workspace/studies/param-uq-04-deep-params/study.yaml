schema_version: 4
name: param-uq-04-deep-params
investigation: parameter-uq
title: "Deep physiological parameters — sensitivity to sim_data attributes via ParCa-level injection."
created: '2026-06-12'
# Advanced ran → evaluated: the study reached a firm passed verdict
# (evaluation_status complete, gate passed, conclusion_verdict passed) on
# strong evidence — cell_dry_mass_fraction S_T = 1.00 on mass across 2 seeds,
# 100% crash-free. Confidence stays Moderate (proof-of-capability, small budget).
status: evaluated

# Canonical 6-axis status.
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: complete
gate_status: passed
expert_review_status: pending

# Investigation-graph node fields.
claim: |
  A DEEP sim_data physiological parameter reachable only via sim_data injection —
  the dry-to-wet mass fraction (mass.cell_dry_mass_fraction) — dominates single-cell
  MASS variance (total-order Sobol ≈ 1.0, stable across seeds) and co-dominates
  GROWTH-RATE variance (S_T ≈ 0.5, shared with the transcription RNAP elongation
  rate ≈ 0.5). The FBA kinetic-objective weight is inert (S_T ≈ 0.1). A sim_data
  injection adapter reaches these params; crucially, the "rebuild" it needs is a
  ~2 s bundle regeneration (save_sim_input, no ParCa refit), not the ~2.5-min full
  ParCa the study originally budgeted for.
confidence: Moderate — proof-of-capability (small budget, 150-step single-cell window)

question: |
  How sensitive are growth/mass observables to the DEEP physiological sim_data
  parameters (e.g., transcription rnap active fractions, metabolism
  kinetic_objective_weight / secretion_penalty_coeff, mass cell_dry_mass_fraction)
  that the uqEcoli demo varies — and which dominate?

report:
  title: param-uq-04-deep-params — sensitivity to sim_data physiological parameters
  verdict: |
    PASSED (mass, decisively; growth, as a co-dominance). Deep sim_data params ARE
    reachable and inject crash-free. The dry-mass fraction dominates mass variance
    (S_T ≈ 1.0) and co-dominates growth-rate variance (≈0.5, tied with RNAP
    elongation rate). A single deep param dominates the MASS observables; growth
    rate is split between two deep params.
  confidence: Moderate
  evidence_quality: |
    Good for a proof-of-capability. 2 PCRV seeds × (26 train + 8 test) order-2 PCE;
    PCE test relative error 0.0–0.1% on mass, 1.6% on growth rate; 100% crash-free.
    Small budget and a 150-step single-cell window (mass observables would move more
    over multi-generation runs). Bounds adopted from uqEcoli, not re-calibrated.

  objective: |
    Extend the UQ coverage from config-reachable process-config scalars (studies
    00–02) to the deeper physiological parameters embedded in the SimulationDataEcoli
    dataclass. These parameters set fundamental biological rates (RNAP activity,
    metabolic objectives, cell composition) and are the primary targets of the
    original uqEcoli parameter uncertainty analysis. This study determines which
    of these deep params most drive single-cell growth/mass variance.

  setup: |
    Candidate parameters and bounds (matching the uqEcoli demo):

    | Parameter | sim_data path | Low | High | Units | Description |
    |---|---|---|---|---|---|
    | rnap_free | transcription.rnap_active_fraction | 0.25 | 0.47 | fraction | Fraction of RNAP not actively transcribing |
    | rnap_bound | transcription.rnap_bound_fraction | 0.12 | 0.22 | fraction | Fraction of RNAP actively transcribing |
    | basal_elongation_rate | transcription.basal_elongation_rate | 15 | 28 | aa/s | (sim_data copy — distinct from process-config) |
    | kinetic_objective_weight | metabolism.kinetic_objective_weight | 5e-8 | 5e-7 | — | FBA kinetic objective weight |
    | secretion_penalty_coeff | metabolism.secretion_penalty_coeff | 5e-4 | 5e-3 | — | FBA secretion penalty |
    | dry_mass_frac | mass.cell_dry_mass_fraction | 0.25 | 0.35 | fraction | Dry-to-wet mass ratio |

    Injection method: the deep sim_data injection adapter
    `pbg_v2ecoli.uq_sim_data_injection` (built for this study). Per param it routes
    the sampled value one of two ways, decided empirically:
      • POST_PARCA — the param surfaces as a runtime `configs` key → inject via
        config_overrides on the shared bundle (no rebuild). Reaches
        rnap_elongation_rate and the FBA weights.
      • REBUILD — the param shapes initial_state / the config projection, so a
        config override is inert → deep-copy the fitted sim_data, mutate the
        attribute, regenerate the bundle with `save_sim_input`. Reaches
        cell_dry_mass_fraction.

    FINDING that corrects the study's premise: the REBUILD is a ~2 s bundle
    regeneration (save_sim_input reuses the already-fitted sim_data, no expensive
    ParCa refit), NOT the ~2.5-min full ParCa the study originally budgeted for.
    So per-sample deep-param injection is cheap and a full study is affordable.

    3 params tested (one per mechanism plus a control), 2 observable families:
      | UQ param | sim_data path | mode | bounds |
      |---|---|---|---|
      | rnap_elongation_rate | process.transcription.rnaPolymeraseElongationRateDict (scale) | post-ParCa | [0.7, 1.3] |
      | cell_dry_mass_fraction | mass.cell_dry_mass_fraction | rebuild | [0.25, 0.35] |
      | kinetic_objective_weight | process.metabolism.kinetic_objective_weight | post-ParCa | [5e-8, 5e-7] |

  result: |
    Total-order Sobol, mean [min, max] across 2 PCRV seeds (order-2 PCE, 26+8 samples):

      dry_mass  (PCE test err 0.0%):  cell_dry_mass_fraction 1.00 [1.00,1.00];
                                      rnap_elongation_rate 0.00; kinetic_objective_weight 0.00
      cell_mass (PCE test err 0.1%):  cell_dry_mass_fraction 1.00 [1.00,1.00];
                                      rnap_elongation_rate 0.00; kinetic_objective_weight 0.00
      inst_growth_rate (err 1.6%):    cell_dry_mass_fraction 0.52 [0.21,0.82];
                                      rnap_elongation_rate 0.50 [0.25,0.75];
                                      kinetic_objective_weight 0.11 [0.02,0.20]

    Max total-order Sobol across the tested deep params = 1.00 (dominance test
    pass_if in_range[0.5,1.0] → PASS). 100% crash-free (all 68 samples completed).
    See charts/deep_param_sobol.png and artifacts/sobol_results.json.

  interpretation: |
    Deep sim_data physiological params ARE injectable for forward UQ, and one of
    them dominates. The dry-to-wet mass fraction — reachable ONLY through the
    rebuild path (a config override is inert; generate_initial_state reads it
    directly) — sets the entire mass scale, so it explains ~100% of mass-observable
    variance and about half of instantaneous-growth-rate variance. The transcription
    RNAP elongation rate (post-ParCa reachable) explains the other half of growth-rate
    variance but has no effect on mass over this window. The FBA kinetic-objective
    weight is inert on single-cell growth/mass — a genuine physiological null.

    Two caveats keep this a proof-of-capability, not the final map: (1) the mass
    observables respond over a 150-step single-cell window mainly through the initial
    mass partition; multi-generation runs would let dynamic (RNAP/translation) params
    accumulate. (2) The rebuild path captures a param's DIRECT initial-state/config
    effect, not any ParCa refit feedback — the standard forward-UQ-on-sim_data
    assumption (matching uqEcoli's sim_data_setattr).

  decision: |
    PASS. Ship the sim_data injection adapter as the deep-param UQ path for the
    parameter-uq program. Because the rebuild is ~2 s (not 2.5 min), the deep
    physiological surface is now cheaply sweepable — the next study should widen to
    the full uqEcoli deep-param set (RNAP fractions with ppGpp coupling handled,
    translation efficiencies, mass sub-fractions) over multi-generation runs, and
    re-calibrate bounds to v2ecoli's current ParCa state.

# Run environment / budget (narrative-spine runtime section). Real values from
# this study's runs/simulation_set — NOT a new run.
runtime:
  tool: pbg-uq + pbg_v2ecoli.uq_sim_data_injection (POST_PARCA + ~2 s REBUILD routing)
  composite: v2ecoli.composites.ecoli_baseline
  window_steps: 150
  seeds: [0, 1]
  samples: "26 train + 8 test PCRV per seed (68 samples total)"
  surrogate: per-observable order-2 Polynomial Chaos Expansion
  sensitivity: analytic Sobol indices per observable
  wall: "19.5 min (~17 s/sample incl. ~2 s save_sim_input rebuild); single-cell run"
  observables: [dry_mass, cell_mass, instantaneous_growth_rate]
  environment: |
    Ran on the Mac mini in the v2ecoli .venv. 100% crash-free (68/68). Deep
    sim_data params reached via the injection adapter: post-ParCa config-key
    routing (rnap_elongation_rate, FBA weights) and a ~2 s save_sim_input bundle
    regeneration for cell_dry_mass_fraction (no ParCa refit).

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      seed: 0
  variants:
    - name: rnap-elongation-rate
      perturbation: "transcription RNAP elongation rate (scale factor on rnaPolymeraseElongationRateDict) via post-ParCa config_overrides"
      expected_contrast: "RNAP transcription speed → mRNA flux → protein synthesis → growth."
      measured_contrast: "LIVE on growth: total-order Sobol 0.50 [0.25,0.75] on instantaneous growth rate; ~0 on mass over this window. Substituted for the originally-planned rnap_active_fraction, which is MASKED by ppGpp regulation (recomputed each tick from ppGpp, so a static-fraction override is inert)."
      params:
        transcription.rnap_elongation_rate: [0.7, 1.3]
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: kinetic_objective_weight
      perturbation: "metabolism.kinetic_objective_weight (FBA) via post-ParCa config_overrides"
      expected_contrast: "FBA kinetic-objective weighting → metabolic flux distribution."
      measured_contrast: "INERT: total-order Sobol 0.11 [0.02,0.20] on growth, ~0 on mass. Injects cleanly as a float config key but does not move single-cell growth/mass — a physiological null control."
      params:
        metabolism.kinetic_objective_weight: [5.0e-8, 5.0e-7]
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: cell_dry_mass_fraction
      perturbation: "mass.cell_dry_mass_fraction via sim_data injection + ~2 s bundle rebuild (save_sim_input)"
      expected_contrast: "Dry-to-wet mass ratio → biomass accounting → cell/dry mass."
      measured_contrast: "DOMINANT: total-order Sobol 1.00 [1.00,1.00] on dry_mass and cell_mass (PCE err ≤0.1%), 0.52 [0.21,0.82] on growth rate. Reachable ONLY via the rebuild path (config override inert)."
      params:
        mass.cell_dry_mass_fraction: [0.25, 0.35]
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  model_settings:
    - name: sim-data-injection-adapter
      detail: "RESOLVED. Built pbg_v2ecoli.uq_sim_data_injection with per-param POST_PARCA (config_overrides) and REBUILD (save_sim_input) routing. Some deep params (rnap_elongation_rate, FBA weights) are reachable post-ParCa with NO rebuild; only params that shape initial_state (cell_dry_mass_fraction) need the rebuild path."
      gate: satisfied
    - name: rebuild-cost-corrected
      detail: "CORRECTED. The rebuild is save_sim_input bundle regeneration (~2 s, reuses the fitted sim_data — no ParCa refit), not the ~2.5-min full ParCa originally budgeted. 68 samples ran in 19.5 min wall on the mini."
      gate: satisfied
    - name: pbg-uq-driving
      detail: "pbg-uq drives sampling + PCE + Sobol via CallableAdapter over the adapter's batch evaluator; per-observable Sobol computed by fitting each observable column with fit_pce_and_sobol."
      gate: satisfied

assumptions:
  - text: |
      The uqEcoli parameter bounds (RNAP fractions, FBA weights, mass fraction) are
      meaningful uncertainty ranges for v2ecoli. They may need re-calibration if
      v2ecoli's ParCa pipeline has shifted the baseline physiological state since
      the original uqEcoli work. STILL UNVERIFIED — bounds adopted as-is; the
      nominal values probed match uqEcoli (cell_dry_mass_fraction 0.30,
      kinetic_objective_weight 1e-7), so the ranges are plausible but not re-fit.
    verified_in_v2ecoli: false
  - text: |
      Per-sample rebuilds are feasible within the compute budget. FALSIFIED-AND-
      IMPROVED: the rebuild is NOT a ~2.5-min full ParCa — save_sim_input regenerates
      the bundle from the already-fitted sim_data in ~2 s with no refit. 68 samples
      (incl. 34 with a rebuild param) ran in 19.5 min total. Caveat: this captures a
      param's direct initial-state/config effect, not ParCa refit feedback.
    verified_in_v2ecoli: true

tests:
  - name: deep-param-injection-feasible-and-ranked
    classification: primary
    status: passed
    question: |
      Can the deep sim_data parameters be injected cleanly (per-sample bundle
      rebuild, no simulation crashes), and does a single parameter robustly dominate
      total-order Sobol across growth/mass observables?
    measure:
      kind: authored
      detail: |
        (1) crash-free completion rate = 100% (68/68 samples). (2) max total-order
        Sobol across the tested deep params = 1.00 (cell_dry_mass_fraction on
        dry_mass and cell_mass, stable [1.00,1.00] across 2 seeds). A single deep
        param dominates the MASS observables decisively; growth-rate variance is
        split ~0.5/0.5 between cell_dry_mass_fraction and rnap_elongation_rate.
      measured_value: 1.00
    pass_if:
      op: in_range
      low: 0.5
      high: 1.0
  # The "Sobol >= 0.5" dominance threshold is an analyst-chosen methodological
  # convention, not a literature-derived band. Documented as a citation GAP.
    cites_note: "Sobol >= 0.5 dominance threshold is methodological; not literature-derived."

# Narrative-spine behavior_tests — one entry per tests[] entry, restating the
# real pass condition and its actual evaluated outcome.
behavior_tests:
  - name: deep-param-injection-feasible-and-ranked
    expectation: |
      Deep sim_data params inject cleanly (per-sample bundle rebuild, no crashes)
      and a single param robustly dominates total-order Sobol (>= 0.5) across the
      growth/mass observables.
    status: passed  # 100% crash-free; cell_dry_mass_fraction S_T = 1.00 on mass across 2 seeds.

runs:
  - name: uq-deep-params-injection
    status: complete
    # Run outcomes keyed by the literal test name (matches how a report resolves
    # the per-test pass/fail pill). Reflects the study's own recorded verdict.
    outcomes:
      deep-param-injection-feasible-and-ranked:
        result: PASS
        detail: |
          100% crash-free (68/68 samples); max total-order Sobol across the tested
          deep params = 1.00 (cell_dry_mass_fraction on dry_mass and cell_mass,
          [1.00,1.00] across 2 seeds). Dry-mass fraction dominates MASS variance;
          the FBA kinetic-objective weight is inert (S_T ≈ 0.11); growth-rate
          variance is a co-dominance (dry-mass fraction ≈0.52 / RNAP elongation ≈0.50).
    n_steps: 150
    n_samples: "26 train + 8 test per seed; seeds [0,1]; order-2 PCE"
    wall: "19.5 min (68 samples, ~17 s/sample incl. ~2 s rebuild)"
    artifacts:
      - artifacts/sobol_results.json
      - artifacts/samples_seed0.npz
      - artifacts/samples_seed1.npz
      - charts/deep_param_sobol.png
      - artifacts/run_param_uq_04.py
    details: |
      Forward UQ over 3 deep sim_data params (rnap_elongation_rate post-ParCa,
      cell_dry_mass_fraction rebuild, kinetic_objective_weight post-ParCa) via
      pbg_v2ecoli.uq_sim_data_injection + pbg-uq. Per-observable total-order Sobol
      over dry_mass / cell_mass / instantaneous_growth_rate. Sim seed fixed per
      design so within-design variance is parametric; seeds vary across designs.

planned_runs:
  - name: pbg-uq-sim-data-injection-adapter
    status: complete
    n_steps: "(infrastructure — no simulation steps)"
    details: |
      DONE — built pbg_v2ecoli.uq_sim_data_injection (POST_PARCA + REBUILD routing).
      Not in pbg-uq itself (kept in the workspace package so it lives on this branch);
      it bridges pbg-uq's CallableAdapter to v2ecoli sim_data injection.
  - name: uq-deep-params-parca-rebuild
    status: superseded
    n_steps: 150
    details: |
      SUPERSEDED by uq-deep-params-injection. The premise (each sample needs a
      ~2.5-min full ParCa rebuild) proved false: save_sim_input regenerates the
      bundle from the fitted sim_data in ~2 s with no refit, so no 100-min ParCa
      overhead was incurred.

readouts:
  - name: crash_free_completion_rate
    status: done
    notes: "100% (68/68 samples completed; no simulation crashes)."
  - name: per_deep_param_sobol
    status: done
    notes: "Per-deep-param total-order Sobol per observable in artifacts/sobol_results.json. Mass: cell_dry_mass_fraction 1.00. Growth: cell_dry_mass_fraction 0.52 / rnap_elongation_rate 0.50 / kinetic_objective_weight 0.11."
  - name: growth_mass_responses
    status: done
    notes: "dry_mass & cell_mass driven ~entirely by cell_dry_mass_fraction; instantaneous_growth_rate by cell_dry_mass_fraction + rnap_elongation_rate."

enforced_params:
  - transcription.rnap_active_fraction
  - transcription.rnap_bound_fraction
  - transcription.basal_elongation_rate
  - metabolism.kinetic_objective_weight
  - metabolism.secretion_penalty_coeff
  - mass.cell_dry_mass_fraction

study_card:
  goal: |
    Extend UQ coverage from config-reachable process-config scalars (studies 00–02)
    to the deeper physiological parameters in SimulationDataEcoli (RNAP rates, FBA
    weights, mass fractions) via a sim_data injection adapter, and determine which
    most drive single-cell growth/mass variance.
  why_before_next: |
    These deep params set fundamental biological rates and are the primary targets of
    the original uqEcoli analysis. This study proves they are reachable and ranks
    them — establishing the (now-cheap) injection path the rest of the deep-param
    program builds on.

biological_summary: |
  The deep sim_data levers on growth/mass live in the SimulationDataEcoli dataclass,
  not in process configs. Quantifying their sensitivity finds the dry-to-wet mass
  fraction is the dominant single lever on cell/dry mass (it sets the whole mass
  scale) and shares control of instantaneous growth rate with the transcription RNAP
  elongation rate; the FBA kinetic-objective weight is inert at single-cell scale.
  Reaching the mass fraction needs a bundle regeneration (it is read when the initial
  state is built); the RNAP rate and FBA weights are reachable without a rebuild.

literature_anchors:
  - expectation: |
      The candidate deep-parameter ranges (RNAP fractions, FBA weights, dry-mass
      fraction) match the original uqEcoli analysis and the v2ecoli/wcEcoli sim_data parameterization.
    model_observable: "transcription.rnap_active_fraction, metabolism.kinetic_objective_weight, mass.cell_dry_mass_fraction"
    source: "v2ecoli baseline parameterization (Macklin et al. 2020); uqEcoli demo bounds"
    status_in_workspace: "Tested — bounds adopted from uqEcoli; nominal values match (dry-mass fraction 0.30, kinetic weight 1e-7). Not re-calibrated to v2ecoli's current ParCa state (open follow-up)."
    cites: [macklin2020]

model_change:
  base_model: v2ecoli.composites.ecoli_baseline
  new_processes: []
  new_parameters: []
  modified_processes: []
  notes: |
    No biological model change. Infrastructure: the sim_data injection adapter
    pbg_v2ecoli.uq_sim_data_injection (POST_PARCA config-key routing + REBUILD via
    save_sim_input), bridging pbg-uq's CallableAdapter to deep sim_data params not
    reachable via the plain config_overrides path used in studies 00–02.

implementation_requirements:
  - id: req-sim-data-injection-adapter
    kind: framework
    title: sim_data-level injection adapter
    effort: L
    status: done
    description: |
      DONE — pbg_v2ecoli.uq_sim_data_injection. sim_data_setattr-style mutation for
      REBUILD params + config-key routing for POST_PARCA params. Kept in the workspace
      package (not pbg-uq) so it lives on this branch and bridges pbg-uq's CallableAdapter.
    unblocks:
      - deep-param-injection-feasible-and-ranked
  - id: req-per-sample-parca-rebuild
    kind: harness
    title: Per-sample bundle rebuild
    effort: S
    status: done
    description: |
      DONE and cheaper than feared — save_sim_input regenerates the bundle from the
      fitted sim_data in ~2 s (no ParCa refit), so no n × 2.5-min ParCa overhead. Only
      params that shape initial_state (cell_dry_mass_fraction) need it at all.
    unblocks:
      - deep-param-injection-feasible-and-ranked

design_pivot_required:
  - id: PIVOT-deep-params-need-parca-injection
    status: accepted-then-refined
    question: "Can the deep physiological params be reached via the baseline() config_overrides path?"
    decision: |
      PARTLY. The pivot's binary framing was too pessimistic. Empirically, deep
      params split three ways: (a) some surface as runtime `configs` keys and ARE
      reachable via config_overrides with no rebuild (rnap_elongation_rate, the FBA
      weights); (b) some are masked at runtime (rnap_active_fraction, recomputed from
      ppGpp); (c) some are read only at bundle-build time and genuinely need a
      rebuild (cell_dry_mass_fraction). The rebuild, however, is a ~2 s save_sim_input
      bundle regeneration — NOT the ~2.5-min full ParCa the pivot assumed. Resolved
      by the pbg_v2ecoli.uq_sim_data_injection adapter, which routes each param to
      the correct mechanism.
    alternatives:
      - "Approximate deep params with config-reachable proxies (rejected — not equivalent)."
      - "Full ParCa rebuild per sample (rejected — unnecessary; save_sim_input suffices for these params)."

conclusion_verdicts:
  - claim: "A single deep sim_data parameter dominates growth/mass variance (total-order Sobol ≥ 0.5)."
    verdict: passed
    basis: "cell_dry_mass_fraction total-order Sobol = 1.00 [1.00,1.00] on dry_mass and cell_mass across 2 seeds (PCE err ≤0.1%); 0.52 on growth rate. Max deep-param S_T = 1.00. Holds decisively for mass; growth rate is a co-dominance with rnap_elongation_rate (≈0.5 each)."

