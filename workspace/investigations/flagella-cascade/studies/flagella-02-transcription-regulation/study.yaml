baseline:
- name: wcm-flagella-regulation
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    seed: 0
    cache_dir: out/cache_full
    features: ['flagella_regulation']

purpose:
  question: |
    (a) Does Class II init_prob_override rise before Class III, with Class III
    gated until complete flagella (CPLX0-7452) accumulate and FlgM (G369-MONOMER)
    is secreted, releasing free FliA (EG11355-MONOMER / sigma-28)? (b) Does the
    FlgM secretion gate keep FliA bounded via the flgM negative-feedback loop?
    (c) Does this all still hold under Maya's complete, unreduced initial-state
    override?
  mechanism: |
    Promoter activity p_i = (beta*X + beta'*Y)/(beta+beta') with X=[FlhDC]/(K+[FlhDC]),
    Y=[free FliA]/(K+[FliA]). Class II beta-weighted (FlhDC), Class III beta'-weighted
    (FliA). The SUM-gate writes p_i (normalized to basal scale) to
    promoters.init_prob_override; transcript_initiation substitutes it where > 0.
    ecoli-flagella-flgm-secretion: exported = min(FlgM, round(n_flagella * 0.1 * dt)).
    FLGM-FLIA-CPLX equilibrium sequesters FliA; as FlgM falls, FliA is released.
    flgM is itself driven as a Class III gene: as free FliA rises, flgM
    transcription rises, making more FlgM to re-sequester FliA — the cap that
    prevents runaway FliA (Stefan et al. 2015, PLoS Comput Biol 11:e1004028).
  expected_outcome: |
    Mean Class III override trajectory lags mean Class II override; Class III stays
    near 0 while FliA is sequestered, rising as free FliA is released. Cytoplasmic
    FlgM falls when flagella are present; free FliA rises then plateaus within a
    plausible band rather than growing without bound. This holds under both the
    reduced and the complete initial-state override.

behavior_tests:
  - id: gate-writes-overrides
    statement: |
      With the feature ON, the SUM-gate writes nonzero init_prob_override onto the
      flagella Class II/III promoters within the first few ticks.
    status: passing      # verified: 17 nonzero overrides after 10 s
  - id: classIII-lags-classII
    statement: |
      Over a multi-minute run, the mean Class III override rises later than (or
      stays below until FliA is freed) the mean Class II override.
    status: passing      # 600 s run (full-override IC): Class II <ov> 1.532e-4 >
                         # Class III 4.338e-5 throughout
    caveat: |
      Magnitude ordering (Class II > Class III) holds; a clean temporal LAG needs a
      low-flagella initial condition (chart 01 below).
  - id: bursts-are-division-transients
    statement: |
      The transient bursts in the multigen mean-override trace (~14 min, ~60 min)
      occur at the division boundaries and decay within a few ticks — a re-partition
      transient at division, not a persistent SUM-gate artifact or a stochastic
      rounding error in the override write.
    status: untested     # raised in Maya's 2026-07-24 review; needs a run that logs
                         # division times alongside the override trace to confirm.
  - id: flgm-secreted-when-flagella-present
    statement: |
      With complete flagella (CPLX0-7452[j]) > 0, cytoplasmic FlgM (G369-MONOMER[c])
      decreases over the run.
    status: passing      # verified: FlgM 800 -> 278 over 600 s (full-override IC)
  - id: fliA-released-and-bounded
    statement: |
      Free FliA (EG11355-MONOMER[c]) stays within a plausible band (does not run
      away) thanks to the flgM negative-feedback loop, across the full trajectory
      from initial net sequestration through eventual release.
    status: passing      # 600 s: FlgM 800->278, FliA 500->288 (still declining,
                         # net sequestration); 900 s (chart 01): FliA 500->580
                         # (net risen) -- bounded throughout, no runaway either way
  - id: full-override-no-equilibrium-crash
    statement: |
      Applying EG11355-MONOMER[c]=500 and G369-MONOMER[c]=800 directly (in addition
      to the flagella/motor overrides) does not raise an equilibrium ValueError over
      a 900 s run against out/cache_full.
    status: passing      # verified directly: comp.run(900) completed with no exception
  - id: class-III-onset-delayed-full-override
    statement: |
      Class III init_prob_override starts at 0 and rises only as FlgM is secreted,
      under the full override (same qualitative behavior as the reduced override).
    status: passing      # Class III 0.0 -> 6.09e-05 over 900 s, tracking FlgM 800 -> 117

success_criteria:
  model:
    - Feature ON writes nonzero init_prob_override onto the flagella promoters within
      the first ticks, and transcript_initiation substitutes it (verified).
    - The regulated composite runs to division without error and the Class II > III
      ordering is stable across the cell cycle (2 generations shown).
    - FlgM (G369-MONOMER[c]) is depleted by type-III secretion when complete
      flagella are present, and the FlgM-FliA equilibrium releases free FliA
      (verified — FlgM 1481 -> 5).
    - Free FliA rises but stays bounded (~1.35x initial) rather than running away —
      the flgM negative-feedback loop holds (verified).
    - The full 4-value override runs without an equilibrium error (verified, 900 s,
      out/cache_full).
  biology:
    - Class II (FlhDC-driven, hook-basal-body + fliA) expression precedes Class III
      (FliA/sigma-28-driven, fliC/motAB/che) — the Kalir & Alon temporal order.
    - The secretion gate reproduces the anti-sigma-factor logic — FliA (sigma-28) is
      held sequestered until basal-body completion exports FlgM, then released — the
      molecular clock that orders Class III after Class II.
    - Confirms the anti-sigma-factor gate logic holds under the TRUE vEcoli initial
      condition, not just a reduced approximation.
    - FUTURE (Maya's biological-success target) — a clean Class II -> III LAG (not
      just a magnitude ordering) demonstrated across generations from a physiological
      initial condition, a demonstrated response to perturbation, and a
      literature-calibrated free-FliA band.

open_decisions:
  - id: multigen-flagella-completion-still-untested-past-3-generations
    raised_by: system
    date: '2026-08-07'
    status: OPEN
    question: >-
      The original question this whole thread has been chasing (does
      inherited, in-progress flagellum construction complete and converge to
      a realistic count, per divide_nascent_flagellum's whole-unit
      inheritance across REAL generations) is still not answered. The
      division-disabled diagnostic confirms completion is achievable given
      enough uninterrupted time (~180-210 min minimum), and a single
      generation (~42 min) is far shorter than that -- so completion, if it
      happens at all in the real dividing model, requires accumulating
      progress across several generations. But every attempt to actually run
      that test (single lineage, expanding population) hit the
      division/mass-homeostasis limitation logged in investigation.yaml's
      open_decisions (division-mass-homeostasis-gap) once pushed past ~3-4
      generations, before the flagella question could be resolved either way.
    recommendation: |
      Two independent paths, not mutually exclusive: (a) fix or work around
      the division/mass-homeostasis gap first (see investigation.yaml), which
      unblocks this AND any other long multi-gen test in this repo; (b) if a
      fix isn't in scope soon, consider whether ~3 generations (the currently-
      trustworthy window) is long enough to see a MEANINGFUL PARTIAL signal
      (e.g. rising total nascent-filament progress, even without full
      completions) rather than needing full convergence. Maintainers'/Maya's
      call on priority.
