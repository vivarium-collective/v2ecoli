      (oriC<=2, 0 re-inits). seed0 is the one noisy seed (in-band most gens, a stochastic dip to ~187 at
      g11-12). Peak-cap and cell-cycle integrity are ROBUST across all 3 seeds; clean in-band centering for
      2/3. The only systematic sub-300 point is the partial final gen g17 (truncated). So s=0.7 is the right
      strength (s=0.7 > s=0.6's trough-dips > s=0.8's low setpoint), now multi-seed. Band test stays PARTIAL
      in the strict evaluator only because it counts g17 + seed0.
      Note: seed1 first crashed (PROTON NegativeCountsError — a baseline allocator/FBA edge, platform-
      sensitive); fixed in v2ecoli #209 (resolve_overdraft, behavior-neutral) and re-run clean — it became
      the cleanest seed.
      (2) "Select a .dill from a steady-state generation and continue another lineage to confirm stability."
      Could NOT be completed — the --resume-dill path is broken by a tooling bug: the resumed daughter never
      re-initiates replication (oriC pinned at 2, grows to ~2x mass, never divides), reproduced across two
      seeds, while the in-process continuous divide of the identical state divides fine. So it's a dill-
      roundtrip serialization bug (docs/resume_dill_replication_init_bug.md), NOT instability. The multi-
      generation stability you wanted is already evidenced by the continuous 16-gen runs (clean, every gen
      divides); the dill-resume confirmation is deferred until that tooling is fixed.
