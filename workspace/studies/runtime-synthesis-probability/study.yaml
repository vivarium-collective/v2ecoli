controls:
- name: comparison-group-behaves-normally
  kind: positive
  hypothesis: Transcripts realized at 1.006x assigned should show actual and target probabilities in close
    agreement. If they do not, the columns do not mean what this study assumes.
  expected: actual within a factor of two of target across the comparison group.
  observed: ''
  result: PENDING
alternative_hypotheses:
- claim: The probability in force is depressed, so the defect is in assignment.
  discriminated_by: runtime-probability-is-depressed.
  status: untested
- claim: The probability in force is normal and transcripts are simply not selected from it, so the defect
    is in sampling or allocation.
  discriminated_by: runtime-probability-is-depressed failing while realized-tracks-runtime-probability
    also fails.
  status: untested
- claim: Regulation suppresses these transcripts after the target is computed.
  discriminated_by: actual-tracks-target.
  status: untested
- claim: The emitted columns do not mean what the study assumes and the decomposition is invalid.
  discriminated_by: comparison-group-behaves-normally.
  status: untested
falsifiability: The assignment explanation is overturned if the cohort's actual probability is comparable
  to the comparison group's, which would move the defect downstream to selection. The whole decomposition
  is invalidated if the control fails, since that would mean actual and target do not behave as assumed
  even for transcripts known to be normal.
limitations:
- The sweep is reused rather than repeated; it is the same cache and composite, but it is reuse, not independent
  replication.
- A depressed probability in force localises the defect but does not name its source; identifying which
  override or normalisation removes the probability would need a further study.
- Six cohort members is a small group for a median comparison, and the cohort itself was defined from
  a single generation, so membership may be incomplete.
- Single medium and condition.
- n_bound_TF_per_TU is recorded as context but is not graded, so any regulatory story it suggests is a
  hypothesis rather than a result.
conclusion_logic:
  if_primary_tests_pass: The probability in force is depressed and tracks its target, so the deficit originates
    in how synthesis probabilities are computed, and the repair belongs upstream of transcript selection.
  if_primary_tests_fail:
    summary: If the probability in force is normal, the defect is in transcript selection rather than
      assignment, and the repair belongs in the sampling path. If actual falls far below target, something
      applied after the target is removing these transcripts' probability.
    diagnose:
    - question: Is the deficit in probability assignment or in transcript selection?
      note: Answered by this study's own two primary axes taken together.
discovery_implications:
  resolved_uncertainties:
  - 'Assignment or selection: ASSIGNMENT. The probability in force is 93x depressed.'
  - 'Whether regulation causes it: no. Zero TFs bound; actual tracks target to 0.1%.'
  - 'Why static ParCa attributes explained nothing: basal_prob is not what the process uses -- the in-force
    value is 25x lower for these transcripts.'
  remaining_uncertainties:
  - Where target_rna_synth_prob is computed and what reduces it 25x below basal_prob.
  - Whether the secondary selection effect (0.380) is real or n=6 sampling noise.
  - Whether the same computation depresses transcripts outside this six-member cohort.
  followup_study_proposals:
  - id: FU-01
    title: Trace the target-probability computation
    motivation: 'The defect is now localised to wherever target_rna_synth_prob is computed, since

      actual tracks target exactly and regulation is excluded. Finding what reduces it

      25x below basal_prob for these transcripts would identify the bug itself rather

      than its consequences.

      '
  - id: FU-02
    title: Rank every TU by in-force vs assigned probability
    motivation: 'The cohort was defined from realized counts in one generation. Ranking all 3277

      by in-force/basal_prob would give the true affected set directly from the

      quantity that matters, and show how much of the transcriptome is mis-assigned.

      '
