conclusion_logic:
  if_primary_tests_pass: |-
    All five axes covered with per-axis floors met (A6/B2/C2/D3/E2), every gap carries a resolution_type+venue (+decision_authority for scope_decision), a provenance, and all four mandatory carried priors are incorporated -> the gap taxonomy is accepted as the next-iteration roadmap. Drive the next cycle from the priority-1 gaps: the both-daughters population runner + fed-batch (batch-scale architectural gap), Millard kinetic calibration to division, and the pbg-bioreactordesign fed-batch PR.
  if_primary_tests_fail: |-
    If an axis floor is unmet or a gap lacks a resolution/provenance, the synthesis is incomplete: re-walk the upstream mbp-01..07 limitations/open_questions and the beulig_batch report cards for the missed axis before locking the taxonomy (see failure_modes).
