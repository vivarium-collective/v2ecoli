    path subject to confirmation once the diagnostic-mode runner is wired.
variants:
- name: v2ecoli-diagnostic-M9-glucose
  description: "Canonical reference: M9 minimal + 22 mM glucose, aerobic, 37\xB0C.\
    \ The baseline against which all other Phase 0 conditions are compared."
  params: &id002
    condition: M9-glucose
    seed: 0
    n_steps: 600
- name: v2ecoli-diagnostic-M9-acetate
  description: Slower-growth gluconeogenic regime; same cache, swap nutrient condition
    to acetate. Tests interface fidelity when the FBA solution sits on a different
    polytope facet.
  params: &id003
    condition: M9-acetate
    seed: 0
    n_steps: 600
- name: v2ecoli-diagnostic-M9-glucose-aa
  description: 'Faster-growth (partial relief on translation): M9 + glucose + 20 amino-acid
    mix at fully-supplemented concentrations.'
  params: &id004
    condition: M9-glucose+aa
    seed: 0
    n_steps: 400
- name: v2ecoli-diagnostic-ensemble-N64
  description: "N=64 stochastic replicates per condition (3 conditions \xD7 64 = 192\
    \ runs). The full reference ensemble Phase 1+ phases validate against. Wall-clock\
    \ estimate: ~30 hr serially, ~1 hr in parallel on a 32-core machine."
  params: &id005
    condition: M9-glucose
    seed: <replicate>
    n_steps: 600
interventions: []
runs:
- name: phase0-reference-ensemble-N32-3cond
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  status: completed
  n_steps: 600
  started_at: '2026-06-11'
  emitter: parquet
  provenance_file: studies/pdmp-00-characterization/phase0_ensemble_provenance.json
  params:
    conditions:
    - M9-glucose
    - M9-acetate
    - M9-glucose+aa
    n_seeds_per_condition: 32
    snapshot_stride_s: 5
  summary: "Real Phase-0 reference ensemble: N=32 \xD7 600 s \xD7 3 conditions (96\
    \ runs), 2026-06-11, Ray fan-out (sequential for +aa). Endpoint cell/dry mass\
    \ ordered by doubling time (glucose+aa > glucose > acetate); cross-seed CV 0.1\u2013\
    1.3%. Scope: N=32, not the N\u226564 canonical gating target; raw per-seed stores\
    \ gitignored, committed artifacts = provenance JSON + figures. See phase0_ensemble_provenance.json."
  outcomes:
    growth-rate-condition-monotone:
      result: PASS
      note: Endpoint cell mass ordered acetate (374 fg) < glucose (1461 fg) < glucose+aa
        (2958 fg), matching the expected growth ordering (provenance biology_check);
        the diagnostic sanity check holds.
    ensemble-rng-seeding-divergence:
      result: PASS
      note: "Cross-seed CV 0.1\u20131.3% on endpoint observables (> 0); replicates\
        \ are distinct, not bit-identical. tests/test_seed_diversity.py passes. The\
        \ per-process RNG-seeding degeneracy is fixed."
    reference-ensemble-N64:
      result: FAIL
      note: "Gating criterion not met: only N=32 per condition ran (provenance: \"\
        Do NOT cite as N=64\"); the N\u226564 ensemble + MCSE-vs-effect-size ratio\
        \ was not produced. This is the study's gate and it is unmet; verdict kept\
        \ at in_progress, not passed."
    markov-blanket-covers-all-major-processes:
      result: SKIP
      note: 'Design deliverable not produced: the typed PB interface schemas for the
        6 subprocesses are a planned readout (not yet written).'
    marshalling-overhead-dominates:
      result: SKIP
      note: 'Not evaluated by this ensemble: the per-step compute profiling harness
        is a planned readout (a later Phase-4 probe measured ~76% framework overhead,
        but that is not this study''s run).'
