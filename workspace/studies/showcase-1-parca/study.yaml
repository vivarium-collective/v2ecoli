schema_version: 4
name: showcase-1-parca
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: Rebuild the ParCa in full from the ecoli-sources flat files
created: '2026-06-09'
status: complete   # legacy back-compat; canonical axes below

# v4 schema (vivarium_workbench.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]
# Missing any of these → dashboard marks study as "invalid".

# Canonical 6-axis status (ParCa built + figures rendered; gate passed → unblocks showcase-2).
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

question: |
  Can v2ecoli rebuild the ParCa in full from the ~133 ecoli-sources flat
  files? Running the ParCa pipeline with --mode full should fit all 51 TF
  conditions (the full-mode proof, vs ~7 in fast/debug mode) and emit a
  complete cache bundle (initial_state.json + sim_data_cache.dill + metadata +
  cache_version) that reproduces the parca_compare reference.

report:
  title: showcase-1 — full ParCa rebuild from ecoli-sources
  verdict: pass
  confidence: high
  evidence_quality: direct-run

  objective: |
    Establish that the v2ecoli ParCa pipeline rebuilds in FULL from the raw
    ~133 ecoli-sources flat files: --mode full fits all 51 TF conditions and
    produces a complete, reproducible cache bundle that downstream studies
    (showcase-2 baseline) resume from.

  setup: |
    Ran the v2ecoli ParCa pipeline with --mode full --cpus 8 on the 133
    ecoli-sources flat files (v2ecoli/processes/parca/reconstruction/ecoli/flat)
    on the Mac mini (2026-06-09, branch report/elongation-3gen-parity-and-guards,
    .venv). Command:
      .venv/bin/python scripts/parca_run.py --mode full --cpus 8 \
        -o out/sim_data-showcase --cache-dir out/sim_data-showcase/kmcache
    Then gzipped the 634 MB parca_state.pkl → parca_state.pkl.gz (41 MB) and
    built the simulation-input bundle:
      .venv/bin/python scripts/build_cache.py \
        --fixture out/sim_data-showcase/parca_state.pkl.gz \
        --cache out/cache-showcase
    The cache lives in its OWN dir (out/cache-showcase), not the dnaa cache (the
    out-symlink hazard). Verified mode by condition count (51 = full, 7 = fast).

  result: |
    PASS. Full ParCa completed in 142.4 s (2.4 min) — consistent with the ~2.5
    min mini runtime; the docs' "4-8 hours / ~300 conditions" figure is stale.
    Per-step: step_4=47.1 s, step_5=55.8 s (the TF-fitting steps dominate).
    51 TF conditions fitted (basal + with_aa + acetate + succinate + no_oxygen +
    the active/inactive TF set) — the full-mode proof (vs 7 in fast/debug).
    Cache bundle out/cache-showcase complete, all four artifacts present:
      initial_state.json    10.39 MB
      sim_data_cache.dill   164.92 MB
      metadata.json         210 B
      cache_version.json    1.1 KB   (inputs_hash 36f7930256f9bc44…)
    initial_state: 16321 bulk molecule species + 11 unique molecule types across
    4 top-level stores (bulk/unique/environment/boundary). sim_data structural
    inventory: 4538 genes (cistrons), 3277 transcription units, 4309 protein
    monomers, 1118 complexes, 9460 metabolic reactions. Smoke check:
    build_composite("ecoli_baseline", cache_dir="out/cache-showcase").run(5) ran 5
    steps with NO "Could not solve ODEs in equilibrium to SS" crash — i.e. the
    metabolite concentrations are calibrated (the full-mode calibration the docs
    require for a simulation-ready fixture).

  interpretation: |
    v2ecoli rebuilds the ParCa in full from the ecoli-sources flat files in
    minutes, fitting all 51 TF conditions and emitting a complete, simulation-
    ready cache bundle. The 51-condition count and the no-crash 5-step smoke run
    together establish this is the full ParCa (not the fast/debug build that
    mis-calibrates dnaA/replication). showcase-2 can resume the baseline sim from
    out/cache-showcase.

  decision: |
    PASS ⇒ the cache bundle is complete (51 conditions, all four artifacts
    present) and is simulation-ready (5-step smoke run, no equilibrium-solver
    crash) ⇒ unblock showcase-2-baseline-figures. Caveat: the full cross-tool
    parca_compare HTML diff (against vivarium-ecoli --save-intermediates) was NOT
    re-run this session (the vEcoli reference intermediates are not present on
    the mini), so the reproduces-parca_compare test is PARTIAL — verified at the
    structural-inventory + simulation-readiness level, not the per-step bit diff.

# --- v4 narrative-spine sections (filled from this study's recorded results) ---
study_card:
  phase: Build / Simulate
  one_liner: "Rebuild the ParCa in full (51 TF conditions) from the ~133 ecoli-sources flat files and confirm a complete, simulation-ready cache bundle."
  status: complete
  headline: "PASS — 51 conditions fit in 142.4 s; 4-artifact bundle complete; 5-step smoke run clean (no equilibrium-solver crash)."

runtime:
  wall_seconds: 142.4
  dispatch: single-process ParCa (--cpus 8)
  scale: 51 TF conditions
  hardware: Mac mini (2026-06-09)

readouts:
  - {name: tf-condition-count, description: "TF-condition count fit by the ParCa run (51 = full, ~7 = fast/debug)"}
  - {name: cache-bundle-artifacts, description: "cache-bundle artifact presence (initial_state.json + sim_data_cache.dill + metadata.json + cache_version.json)"}
  - {name: simdata-structural-inventory, description: "sim_data structural inventory (4538 genes / 3277 TUs / 4309 monomers / 1118 complexes / 9460 metabolic reactions)"}
  - {name: smoke-run, description: "5-step build_composite('ecoli_baseline') smoke run — no equilibrium-solver crash"}

enforced_params:
  - {name: mode, value: full, why: "fits all 51 TF conditions; fast/debug fits ~7 and mis-calibrates dnaA / replication"}
  - {name: cache_dir, value: out/cache-showcase, why: "own dir, not the dnaa cache (out-symlink hazard)"}
  - {name: cpus, value: 8}

biological_summary: |
  The ParCa (parameter-calculator) fits heterogeneous measured E. coli datasets
  into a single self-consistent sim_data parameter set across 51 transcription-
  factor conditions (basal + with_aa + acetate + succinate + no_oxygen + the
  active/inactive TF set). The full-mode fit is what calibrates the metabolite
  concentrations so the whole-cell composite can solve its equilibrium ODEs at
  steady state — the precondition for a simulation-ready wild-type baseline.

literature_anchors:
  - {cite: macklin2020, note: "The Covert-lab whole-cell model whose ParCa pipeline v2ecoli rebuilds from the ecoli-sources flat files."}

model_change: |
  None — this is the unmodified full-mode ParCa build (the reference pipeline).
  The only configuration axis exercised is the build MODE: --mode full (51 TF
  conditions, used) vs fast/debug (~7 conditions, contrast only, never used for
  simulation because it mis-calibrates dnaA / replication).

implementation_requirements: |
  scripts/parca_run.py --mode full --cpus 8 (the reconstruction pipeline);
  gzip of parca_state.pkl (634 MB → 41 MB) and scripts/build_cache.py to emit
  the simulation-input bundle. Run via the v2ecoli .venv (bare python lacks
  unum). Cross-tool parca_compare additionally needs vivarium-ecoli
  --save-intermediates reference checkpoints (absent on the mini this session).

design_pivot_required: false

conclusion_verdicts:
  - {claim: "v2ecoli rebuilds the ParCa in full from ecoli-sources", verdict: supported, basis: "51 TF conditions fit in 142.4 s — the full-mode proof (vs 7 fast/debug)"}
  - {claim: "the cache bundle is complete and simulation-ready", verdict: supported, basis: "all 4 artifacts present; 5-step baseline smoke run, no equilibrium-solver crash"}
  - {claim: "the rebuilt sim_data reproduces the parca_compare reference", verdict: partial, basis: "verified at structural-inventory + simulation-readiness level; the cross-tool HTML bit-diff was NOT re-run (vEcoli --save-intermediates reference absent)"}

conclusion_logic:
  if_primary_tests_pass:
    summary: "The ParCa rebuilds in full (51 TF conditions) from the ecoli-sources flat files and emits a complete, simulation-ready cache bundle, so showcase-2 can resume the wild-type baseline from out/cache-showcase."
    block_downstream: false
    pipeline_unblocks: [showcase-2-baseline-figures]
    biological_validation: "51 fitted TF conditions plus a no-crash 5-step smoke run confirm the metabolite concentrations are calibrated — the full-mode calibration a simulation-ready fixture requires."
  if_primary_tests_fail:
    summary: "If the build fits only ~7 conditions or the bundle is missing artifacts, the cache is the fast/debug build that mis-calibrates dnaA / replication and must NOT seed the baseline; showcase-2 stays blocked until a full rebuild succeeds."
    block_downstream: true
    diagnose: [condition count != 51, missing cache artifact, equilibrium-solver crash on the smoke run]
    biological_validation: "A fast-mode cache over-expresses dnaA (~2x) and breaks replication initiation, so any downstream baseline resumed from it would be mis-calibrated."

simulation_set:
  - name: showcase1-parca-full-2026-06-09
    kind: parca
    status: complete
    base_model: parca
    duration_steps: "n/a (reconstruction build; 5-step smoke validation)"
    seeds: "n/a"
    metrics: [TF-condition count, cache-bundle artifacts, sim_data structural inventory, 5-step smoke run]
    pass_fail_tests: [parca-builds-full-51-conditions, cache-bundle-complete, sim_data-reproduces-parca-comparison]

conditions:
  baseline:
    composite: parca
    params:
      mode: full
      cache_dir: out/cache-showcase
  variants:
  # No perturbation variants — a ParCa rebuild has a single configuration. The
  # build MODE is the only axis, and it is itself the full-mode proof.
    - name: full-mode (51 TF conditions)
      role: reference
      detail: "The build configuration actually used (--mode full); the study's only simulation-ready configuration."
      composite: parca
    - name: fast/debug-mode (~7 TF conditions)
      role: contrast (NOT used for simulation)
      detail: "The debug build the full-mode proof is contrasted against; it mis-calibrates dnaA / replication, so it is never used to seed the showcase sims."
      composite: parca
  model_settings: []

assumptions:
  - text: |
      --mode full fits all 51 TF conditions from the ~133 ecoli-sources flat
      files and is fast (~2.5 min on the mini). The docs' "4-8 hours / ~300
      conditions" figure is stale; verify by condition count (51 = full).
    verified_in_v2ecoli: true # 51 conditions in 142.4 s on the mini, 2026-06-09
  - text: |
      A complete cache bundle is initial_state.json + sim_data_cache.dill +
      metadata + cache_version. All four must be present for showcase-2 to resume.
    verified_in_v2ecoli: true # all four present in out/cache-showcase (cache_version ships as cache_version.json)

tests:
  - name: parca-builds-full-51-conditions
    classification: primary
    status: passed
    result: PASS — 51 TF conditions fitted (--mode full, 142.4 s on the mini, 2026-06-09).
    question: Does --mode full fit all 51 TF conditions (the full-mode proof, vs ~7 in fast/debug)?
    measure:
      kind: condition_count
      detail: Count the TF conditions fit by the ParCa run; 51 = full, ~7 = fast/debug.
    pass_if:
      op: '=='
      value: 51
  - name: cache-bundle-complete
    classification: primary
    status: passed
    result: PASS — all four artifacts present in out/cache-showcase (initial_state.json 10.39 MB, sim_data_cache.dill 164.92 MB, metadata.json 210 B, cache_version.json 1.1 KB).
    question: Does the cache bundle contain all four artifacts (initial_state.json, sim_data_cache.dill, metadata, cache_version)?
    measure:
      kind: artifacts_present
      detail: initial_state.json + sim_data_cache.dill + metadata + cache_version present under out/cache-showcase.
    pass_if:
      op: all_present
      artifacts: [initial_state.json, sim_data_cache.dill, metadata, cache_version]
  - name: sim_data-reproduces-parca-comparison
    classification: primary
    status: partial
    result: |
      PARTIAL — verified at the structural-inventory + simulation-readiness level
      (4538 genes / 3277 TUs / 4309 monomers / 1118 complexes / 9460 metabolic
      reactions; build_composite("ecoli_baseline").run(5) ran with no equilibrium-solver
      crash). The full cross-tool parca_compare HTML diff was NOT re-run — it
      needs vivarium-ecoli --save-intermediates reference checkpoints, which are
      not present on the mini this session.
    question: Does the rebuilt sim_data reproduce the parca_compare reference?
    measure:
      kind: parca_compare
      detail: Compare the rebuilt sim_data against the parca_compare reference (parca_compare._reach).
    pass_if:
      op: matches_reference

discovery_implications:
  resolved_uncertainties:
    - --mode full fits 51 TF conditions in ~2.4 min on the mini (the docs' 4-8 h / ~300 conditions figure is stale; confirmed 142.4 s, 51 conditions).
    - The full-mode cache bundle is simulation-ready (5-step baseline smoke run, no equilibrium-solver crash).
  remaining_uncertainties:
    - Whether the full ParCa rebuild from ecoli-sources is bit-for-bit reproducible across machines, or only reproducible up to the parca_compare tolerance.
    - The cross-tool parca_compare HTML diff vs vivarium-ecoli --save-intermediates was not re-run (reference intermediates absent); reproduces-parca_compare is verified only at the structural-inventory + simulation-readiness level.

