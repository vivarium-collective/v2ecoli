- address: image:charts/04_phase_portrait_X_Y.svg
  chart: charts/04_phase_portrait_X_Y.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies.py --cache-dir out/cache_full
  description: |
    UPDATED 2026-07-28 (Maya flagged the plot as looking broken): X = FlhDC
    activity [FlhDC]/(K_flhDC+[FlhDC]), Y = free-FliA activity
    [FliA]/(K_fliA+[FliA]). K_flhDC=50, K_fliA=600 are NOT visualization-only
    constants -- they are the literal production SUM-gate constants from
    ecoli-flagella-transcription-regulation's own config (sim_data.py), so
    this plot is faithful to the real gate math, not an independent
    approximation. Under the full-override IC, FlhDC (CPLX0-3930[c]) only
    ranges ~353->406 over 600 s, which K_flhDC=50 places deep in the gate's
    saturated regime (X ~ 0.876->0.890 the whole run) -- Class II activity is
    essentially insensitive to further FlhDC increases at this count scale.
    The trajectory is therefore dominated by the Y-axis: free FliA crashes
    500 -> ~124 via the FLGM-FLIA-CPLX equilibration, then climbs back to 288
    by 600 s. Sampling was densified to every 5 s for the first 120 s (from a
    uniform 20 s grid) to check whether that crash was a sampling-resolution
    artifact -- it is NOT: a 1 s-resolution check confirms FliA is already at
    124 by t=5 s, so the equilibration genuinely completes within a single
    sub-5-second tick. The vertical drop in the plot is real, near-instant
    equilibrium dynamics, not an under-sampled straight-line approximation of
    a gradual curve. The subsequent slow climb (124 -> 288 over the remaining
    ~595 s, visible as the dense cluster of points) is the real,
    resolvable dynamic -- driven by the much slower flagellar-export-paced
    FlgM depletion. Time is the color; o marks birth and star the end. This is
    NOT "two master regulators rising together" (the old caption's claim) --
    FlhDC is essentially flat/saturated here; only free FliA activity
    meaningfully moves within this window, in two distinct phases (instant
    crash, then slow release). UPDATED again 2026-07-29 (Maya): axes were
    fixed 0-1, which buried the entire trajectory in one corner (X ~0.87-0.89,
    Y ~0.17-0.45) since both are normalized activities but the data only
    spans a narrow slice of that range. Zoomed to the observed data range
    (with a small pad) instead of the full 0-1 box, so the actual shape --
    instant drop, flat trough, then a smooth curve back up as FlgM depletes
    -- is legible. The 0-1 normalization is still real (axis labels still say
    so); this is a view/zoom change only, not a change to the underlying
    data or gate math.
