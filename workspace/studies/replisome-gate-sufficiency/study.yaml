findings:
- id: F-01
  kind: biological
  status: confirms
  statement: 'With the gate corrected to sufficiency, the lineage still stalls: all 8 mechanistic seeds stopped at generation 4 or 5 of 12.'
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: lineage-stalls-under-sufficiency-gate
    observed: 4
  expected:
    summary: The mechanistic arm should stop short of 12 generations.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: observation
  summary: 'The stall survives the fix, so it was never only an artefact of the

    comparison operator. Under == the arrest came one generation into the run,

    at the first generation that had to initiate from scratch. Under >= the

    lineage initiates normally for three or four generations and then stops,

    which is the signature of a resource being consumed rather than a

    condition that can never be met.


    Graded on the maximum divided count across seeds, so one surviving seed

    would have failed it. None survived.

    '
- id: F-02
  kind: biological
  status: confirms
  statement: The stall generation is 4 or 5 across all 8 seeds, a spread of 1 against a pre-registered bound of 3.
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: stall-generation-is-seed-consistent
    observed: 1
  expected:
    summary: Stall generation should vary by at most 3 generations across seeds.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: observation
  summary: 'Three seeds stall at generation 4 and five at generation 5. The stall

    is a property of the model rather than a seed-specific accident.


    Scope: this is robustness at n=8, not powered inference. No rank test and

    no drift-null control were planned, and the rigor checklist asks n>=20 for

    a causal stochastic claim. Note also that generation 1 is identical across

    seeds (tau 43.0 min, 722.6 fg); divergence begins at generation 2, so the

    seeds share more early trajectory than the word independent suggests.

    '
- id: F-03
  kind: biological
  status: confirms
  statement: 'At the stall a replisome pool is genuinely short: the worst margin is -4 copies, so the stall is subunit-gated, not mass-gated.'
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: some-pool-is-short-at-the-stall
    observed: -4
  expected:
    summary: At least one pool should be below the gate's demand at the stall.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: mechanism
  summary: 'This is the measurement the == operator made impossible. Under equality

    every pool failed the comparison whether it was short or in surplus, so

    ''which pool limits'' could not be asked. Under >= the margins are

    informative, and exactly one pool goes negative while the rest keep an

    order of magnitude of headroom.


    The alternative this excludes is a mass-gated stall. criticalMassPerOriC is

    not emitted by this build, so cell and dry mass were carried in the

    evidence bundle as the available proxy; the negative subunit margin is

    direct evidence that the subunit branch of the gate is the one failing.

    '
- id: F-04
  kind: biological
  status: confirms
  statement: DnaG holds the worst margin in every one of the 8 stalled seeds (margins -1 to -4); no other pool is ever the limiting one.
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: dnag-is-the-limiting-pool
    observed: true
  expected:
    summary: DnaG, rather than another subunit, should hold the worst margin.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: mechanism
  summary: 'Unanimous across seeds, not a single-seed identification. Five other

    pools could have held the worst margin, and HolA was close to marginal in

    the pre-registered prior, so this had real ways to come out otherwise.


    The prior was right about the pool but partly wrong about the reason. It

    extrapolated from study 1''s permissive arm, where oriC is 2 or 4 and DnaG

    would fail a high multi-fork demand. At the actual stall oriC is 1 or 2 and

    DnaG simply runs out, reaching literal zero in several seeds. The pool is

    the same; the mechanism is depletion rather than an unmet multi-fork demand.

    '
  next_action: 'Separate the two DnaG claims: that it gates initiation in the model (settled here) and that its modelled abundance is too low against proteomics (open, and the investigation''s original thread).'
  next_action_type: split_hypothesis
- id: F-05
  kind: biological
  status: confirms
  statement: The permissive control completed all 12 generations in 3 of 3 seeds, so the stall is attributable to the gate.
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: permissive-completes-all-seeds
    observed: 12
  expected:
    summary: The permissive arm should reach 12 generations in every seed.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: observation
  summary: 'With gating off, initiation is unconditional and the lineage runs the

    full length from the same cache and the same seeds. This rules out the run

    length, the initial state and the cache as explanations. Had this arm also

    stalled, the causal chain would have been refuted at its first link.

    '
- id: F-06
  kind: biological
  status: confirms
  statement: 'Removing DnaG from the gate''s requirement list lifts the stall entirely: 5 of 5 ablation seeds reach 12 generations, a paired gain of 8 to 9 generations.'
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: dropping-dnag-relieves-the-stall
    observed: 8
  expected:
    summary: Dropping DnaG from the requirement should extend lineage survival.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: mechanism
  summary: 'This is the causal axis, and it is what separates DnaG being the

    binding constraint from DnaG merely looking scarce. A correlation cannot

    pass it: the intervention removes DnaG from what the gate demands, changes

    nothing else, and the lineage that stalled at generation 4 or 5 now runs

    the full 12.


    The relief is complete rather than partial, which also says no second pool

    is waiting behind DnaG at these origin counts -- consistent with HolA''s

    margin being positive but small at the stall.


    Scope: this shows DnaG gates initiation IN THE MODEL. It does not show that

    DnaG abundance is physiologically limiting in E. coli.

    '
  next_action: 'The limiting resource is identified and the causal test is closed. The actionable follow-up is upstream: why DnaG is this scarce, which is the TU00352 transcription-unit question the investigation started from.'
  next_action_type: escalate_model
- id: F-07
  kind: biological
  status: confirms
  statement: All six graded axes are within tolerance; the card gate passes with 0 hard mismatches.
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: gate_sufficiency
    observed: pass
  expected:
    summary: Every graded axis should be within tolerance.
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  tier: mechanism
  summary: 'Every axis is an acceptance_criterion pre-registered before the sweep,

    with criteria_match verified against these exact pass_if values. There are

    no regression pins in this card: nothing was chosen after seeing a number.

    '
- id: F-08
  kind: biological
  tier: interpretation
  mechanism_origin: emergent
  status: novel
  statement: DnaG is the resource that limits replication initiation in v2ecoli, which makes the transcription-unit architecture that couples dnaG to rpsU and rpoD consequential rather than untidy.
  summary: 'Taken together the six axes close a chain: the lineage stalls, exactly one pool

    is short, that pool is DnaG in every seed, and removing DnaG from the gate lifts

    the stall completely. DnaG is therefore not an incidental scarcity but the

    binding constraint on replication initiation in this model.


    That matters because of where DnaG''s supply comes from. Its only transcript is

    TU00352, polycistronic with rpsU and rpoD, so the model cannot raise DnaG

    without also raising a ribosomal protein and sigma-70. This is why the causal

    arm here had to be an ablation rather than a rescue. An architecture that

    cannot regulate the cell''s limiting replication factor independently is a

    modelling defect with a measurable consequence, not a cosmetic one.


    Marked emergent: nothing was tuned to make DnaG limiting. It follows from the

    modelled abundance, the gate''s stoichiometry and the origin count at the stall.

    The open question this hands back to the investigation is whether DnaG''s

    abundance is itself an artefact of the TU dedup that collapses the rpsU

    promoters, which is where the investigation began.

    '
  expected:
    summary: No pre-registered expectation; this is a synthesis across the six axes, formed after the sweep, and is a hypothesis for the next study rather than evidence from this one.
  evidence:
    from_run: replisome-gate-sufficiency__mechanistic__seed0
    from_test: dnag-is-the-limiting-pool
    observed: true
  provenance:
    run_ids:
    - replisome-gate-sufficiency__mechanistic__seed0
  next_action: Test whether DnaG's modelled abundance is an artefact of the TU dedup collapsing the rpsU promoters into TU00352.
  next_action_type: refine_representation
conclusion: 'The lineage still stalls once the gate tests sufficiency, and the resource that

  limits it is DnaG. All six pre-registered criteria confirm.


  Eight mechanistic seeds, three permissive, five ablation; 12 generations, one

  cache, arms differing only in runtime config_overrides. Every mechanistic seed

  stalled, at generation 4 (three seeds) or 5 (five seeds), a spread of 1 against

  a pre-registered bound of 3. The permissive control reached 12 of 12 in every

  seed, so the stall is attributable to the gate and not to the run length, the

  initial state or the cache.


  At each stall exactly one pool is below the gate''s demand, and it is DnaG in all

  eight seeds (margins -1 to -4, reaching a count of zero in several). The other

  five pools keep an order of magnitude of headroom. Removing DnaG from the gate''s

  requirement list lifts the stall completely: 5 of 5 ablation seeds reach 12

  generations, a paired gain of 8 to 9. That intervention is what turns the

  correlation into a causal claim, and the relief being complete rather than

  partial says no second pool is waiting behind DnaG at these origin counts.


  This closes the question study 1 could not ask. There the arrest came from the

  gate testing equality, so every pool failed the comparison whether short or in

  surplus and the subunit-depletion hypothesis was refuted as unmeasurable rather

  than as false. With the operator corrected the hypothesis is testable, and it

  holds: subunit supply does limit initiation, and DnaG is the subunit.


  The prior was right about the pool and partly wrong about the mechanism. It

  extrapolated from study 1''s permissive arm, where oriC is 2 or 4, and predicted

  DnaG would fail a high multi-fork demand. At the actual stall oriC is 1 or 2 and

  DnaG simply runs out. Same pool, different reason, and the difference matters

  for what to fix.


  What this does not show: that DnaG abundance is physiologically limiting in

  E. coli. The ablation tests what the gate demands in the model, not the biology.

  Eight seeds is robustness, not powered inference, and generation 1 is identical

  across seeds, so the arm shares more early trajectory than seed-independent

  implies. Single medium, single condition.


  Next: DnaG''s only transcript is TU00352, polycistronic with rpsU and rpoD, so

  the model cannot raise DnaG without also raising a ribosomal protein and

  sigma-70 -- which is why the causal arm had to be an ablation rather than a

  rescue. Whether DnaG''s modelled abundance is itself an artefact of the TU dedup

  that collapses the rpsU promoters into TU00352 is the investigation''s original

  question, and it is now the consequential one.

  '
conclusion_verdicts:
  regression_compatibility:
    verdict: confirmed
    basis: The only model change is the == to >= correction in the initiation gate, committed as db3986f3 and validated by a 3-generation smoke before the sweep. All three arms run stock v2ecoli from one cache; the arm differences are runtime config_overrides, so no arm required a separately fitted cache.
  biological_validation:
    verdict: confirmed
    basis: 'All six pre-registered acceptance criteria pass, including the two that could have failed independently: exactly one pool is short at the stall (worst margin -4), and it is DnaG unanimously across 8 seeds when five other pools were available and HolA was near-marginal in the prior. The permissive control isolates the gate as the cause.'
  explanatory_gain:
    verdict: confirmed
    basis: 'The study converts a refuted-because-unmeasurable hypothesis into a closed causal chain. Study 1 could not distinguish a short pool from a pool in surplus because the gate tested equality. Here the chain is: the lineage stalls, one pool is short, that pool is DnaG in every seed, and removing DnaG from the gate''s requirement lifts the stall completely (5/5 to 12 generations, +8 to +9 paired). It also identifies the architectural consequence: DnaG cannot be regulated independently of rpsU and rpoD, which is why the causal arm had to be an ablation rather than a rescue.'
claim: 'With the initiation gate testing sufficiency, the lineage still stalls, and DnaG is the resource that limits it: it is the only pool short at the stall in all 8 seeds, and removing it from the gate''s requirement restores full 12-generation survival.'
