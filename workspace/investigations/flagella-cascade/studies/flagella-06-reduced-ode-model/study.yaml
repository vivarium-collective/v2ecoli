baseline: []

purpose:
  question: |
    Same as the study-level question above: does the real checkpoint +
    SUM-gate + assembly kinetics, as a standalone dynamical system, show
    flagella count rising then plateauing (self-limiting) rather than
    growing without bound, over a multi-hour/multi-generation timescale?
  mechanism: |
    State variables: FlhD4C2 (X), free FliA (Y), cytoplasmic FlgM, free
    FliT-dimer, flagella under construction (mean-field n_nascent), and
    complete flagella count. Synthesis terms use the REAL Kalir & Alon
    SUM-gate math (beta=[1200,450,350,350,150,100,50],
    beta_prime=[250,350,300,450,300,350,300], K_flhDC=K_fliA=10.0, all
    imported from flagella_transcription_regulation.py's own config_schema
    defaults). FlhDC degradation uses the REAL fast-equilibrium checkpoint
    reduction from flagella_flit_flhdc_checkpoint.py (delta2=0.05,
    K_half=50.0) plus the real basal decay rate (0.00289/s, flagella_
    flhdc_degradation.py). FlgM secretion uses the real rate (0.1/s per
    flagellum, flagella_flgm_secretion.py). Filament construction uses a
    mean-field exponential-relaxation approximation (nucleation at the
    real derived rate 0.00167/s, completion at rate 1/tau where tau is
    calibrated from the REAL, DIRECTLY MEASURED fliC-limited completion
    time from study 02's diagnostics -- not re-derived from scratch) --
    this is the one genuinely new (not directly imported) piece, since the
    WCM's per-instance filament_length tracking has no exact ODE
    equivalent; documented as a simplification, not a re-validated
    mechanism.
  expected_outcome: |
    Not predetermined -- this is the actual open question. Candidate
    outcomes: (a) flagella count rises then plateaus near the real Sisti
    et al. 2017 range (2.4-7.8/cell) -- the hoped-for confirmation; (b) it
    plateaus, but the checkpoint isn't what's causing it (e.g. saturates
    due to some other structural reason in the reduced model) -- would
    need distinguishing, same caution as study 02's motor-complex finding;
    (c) it doesn't plateau at all within the tested window -- would argue
    the checkpoint alone (independent of the WCM's supply bottlenecks) is
    not sufficient to explain real self-limiting behavior.

behavior_tests: []

success_criteria:
  model:
  - MET (v2, 2026-08-10). Original phrasing assumed FlhD4C2~335/FliA~2487/
    FlgM~1496/FliT~974 were "reference conditions" to be reproduced as a
    fixed point -- corrected understanding: these are the real natural
    ParCa basal t=0 IC (verified directly), not a steady state the
    dynamics should hold at. Validated instead by comparing the model's
    trajectory (started from the same override IC used in study 02's
    diagnostics) against the real measured WCM trajectory: same
    qualitative shape (gradual FlgM decline, gradual FliA rise,
    fast-then-plateau FlhDC decline), quantitative agreement within ~2-3x
    at t=2400s. See runs/v2-validated-run-2026-08-10.
  biology:
  - MET. Full 8hr run shows the checkpoint mechanism clearly acting on
    gene expression (FlhDC 335->~10, FliA rising substantially, FlgM
    eventually outpaced by secretion), but flagella COUNT is not bounded
    by it within the tested window -- grows to 46.5, tracking
    nucleation_rate*time almost exactly. Converges with study 02's own
    WCM-based finding: the checkpoint alone (without motor-complex
    gating, deliberately not modeled here) does not produce self-limiting
    flagella count. See finding flagella-06-checkpoint-alone-does-not-
    bound-flagella-count-8hr.

open_decisions:
  - id: mean-field-filament-construction-is-a-real-simplification
    raised_by: system
    date: '2026-08-10'
    status: OPEN -- flagged, not resolved
    question: >-
      The nucleation/completion mean-field approximation (exponential
      relaxation, tau calibrated from one measured WCM data point) is the
      least-validated piece of this model -- the real WCM tracks each
      filament's individual length via a genuine rate law
      (dL/dt=a/(b+L)), which is NOT simply an exponential process. Does
      the mean-field approximation change the qualitative self-limiting-
      dynamics answer, or just the quantitative timing?
    recommendation: |
      Cross-check any qualitative finding (does count plateau or not)
      against a second version of the mean-field term before trusting it
      strongly -- e.g. a simple size-structured/queueing formulation
      instead of pure exponential relaxation, to see if the qualitative
      answer is robust to that choice.

  - id: synthesis-rate-constants-not-fully-first-principles
    raised_by: system
    date: '2026-08-10'
    status: OPEN -- flagged, not resolved
    question: >-
      K_SYNTH_* constants are calibrated by assuming the real natural
      ParCa t=0 totals represent a synthesis=degradation steady state for
      each TOTAL pool (defensible, since ParCa's fitting target is total
      expression independent of downstream fast complexation) -- but this
      is one step removed from directly importing ParCa's own basal_prob/
      translation-efficiency chain. Validated against real WCM data to
      within ~2-3x at t=2400s (see runs/v2-validated-run-2026-08-10) --
      good enough for the qualitative self-limiting-dynamics question,
      but the residual gap likely traces to this approximation.
    recommendation: |
      If quantitative precision becomes important (not just the
      plateau-vs-no-plateau qualitative question), pull real basal_prob
      and translation-efficiency values from sim_data directly rather
      than back-calculating synthesis rates from total-pool/degradation-
      rate balance.

  - id: motor-complex-not-modeled-cannot-rule-in-self-limiting-dynamics
    raised_by: system
    date: '2026-08-10'
    status: OPEN -- deliberate scope limit, not a bug
    question: >-
      This model finds the checkpoint alone does not bound flagella count
      over 8hr -- converging with study 02's WCM finding. But neither
      model has examined whether ADDING motor-complex-gated nucleation
      (the mechanism study 02 found actually caps count in the WCM) would
      make a reduced model self-limiting too. Given nucleation already
      consumes 1 motor complex/event in the real mechanism
      (flagella_filament_nucleation.py), this would be a natural, real
      next extension -- gate NUCLEATION_RATE by an added motor-complex
      pool state variable with its own (currently unexamined) synthesis
      chain -- see study 02's open_decision motor-complex-supply-chain-
      unexamined for the same unresolved question in the WCM context.
    recommendation: |
      Natural next step if this line of investigation continues: add a
      motor-complex state variable with a synthesis rate estimated the
      same way fliC's gap was originally found (measure real synthesis,
      back-calculate demand), then re-test whether flagella count
      plateaus.

  - id: source-mechanism-removed-from-live-wcm-2026-08-10
    raised_by: system
    date: '2026-08-10'
    status: RESOLVED -- model updated to v3, kept in sync with the live WCM
    question: >-
      The FliT:FlhD4C2 checkpoint this model was originally built to test
      (flagella_flit_flhdc_checkpoint.py, plus its flhdc-degradation
      companion and the FLIT-FLID-CPLX_RXN equilibrium reaction it depends
      on) was removed from the live WCM on 2026-08-10, after Albanna et al.
      (2018, Sci Rep 8:16705) was found to show no significant Delta-fliT
      phenotype in E. coli MG1655 (this WCM's exact K-12 strain), unlike in
      Salmonella where the mechanism was originally characterized (Yamamoto
      & Kutsukake 2006). Full removal details and archived code at
      archive/flit-flhdc-regulation-2026-08/ (repo root); see also
      flagella-02's finding flagella-02-flit-checkpoint-removed.
    recommendation: |
      RESOLVED same day: Maya asked to keep the model in sync with the
      live WCM rather than leave it frozen. v2 (with the checkpoint) was
      archived at archive/flit-flhdc-regulation-2026-08/code/
      run_reduced_ode_model_v2_with_flit.py; the live run_reduced_ode_
      model.py is now v3, with the checkpoint and FliT:FliD equilibrium
      removed to match. Result (finding flagella-06-flhdc-unbounded-
      without-any-decay-term): FlhD4C2 now grows perfectly linearly with
      no saturation at all, confirming in the reduced model exactly the
      same tradeoff already documented for the live WCM. v2's own finding
      (flagella-06-checkpoint-alone-does-not-bound-flagella-count-8hr)
      remains valid as a historical result about the mechanism as it
      existed before removal -- not rewritten, just superseded by v3 going
      forward.

notes: |
  Companion to CHANGES_2026-08-08.md's "other mechanisms or models"
  discussion. Real parameter values imported directly from
  v2ecoli/processes/flagella_*.py at model-build time, not retyped, to
  avoid the two models drifting out of sync -- see run_reduced_ode_model.py
  for the exact import statements.

  UPDATE 2026-08-10: the WCM mechanism v1/v2 imported and tested (the
  FliT:FlhD4C2 checkpoint) was removed from the live WCM the same day --
  see open_decision source-mechanism-removed-from-live-wcm-2026-08-10
  above. v2 archived; the live script is now v3, updated to match.
  This script and its findings are left as-is (a completed, valid piece of
  analysis of a since-retired mechanism), not deleted or rewritten, per the
  same preserve-history approach used for flagella-02's historical findings
  and the dedicated archive/flit-flhdc-regulation-2026-08/ folder.
