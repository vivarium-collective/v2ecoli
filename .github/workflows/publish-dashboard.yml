name: Publish read-only workbench

# Build the workspace into a self-contained static SPA snapshot and publish it
# to the gh-pages branch at workbench/ (served at
# vivarium-collective.github.io/v2ecoli/workbench/). This is the READ-ONLY
# mirror of every investigation + study on main — browsable with no server.
# The legacy /dashboard/ path is kept as a redirect stub to /workbench/.
#
# Built by vivarium-workbench-publish (scripts/publish_dashboard.sh), the same
# build you can run locally to preview. Companion to publish-reports.yml (which
# publishes the per-investigation HTML reports); this one publishes the
# interactive workbench SPA.
#
# DEPLOY job (post-merge to main), NOT a PR gate — a failure here never blocks a
# merge. It only ever writes workbench/ + dashboard/ on gh-pages; the
# investigation reports, viewers, and docs mirror there are left untouched.

on:
  push:
    branches: [main]
    paths:
      # Republish when anything that changes the snapshot changed.
      - 'workspace/**'
      # Root workspace.yaml is NOT under workspace/** — list it explicitly so
      # registry/layout/runtime changes (e.g. dashboard.registry.include) republish.
      - 'workspace.yaml'
      - 'reports/figures/**'
      - 'scripts/publish_dashboard.sh'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The workbench wheel build warns+skips the loom bundle when npm is absent
    # (so Node-less consumer builds don't fail). But the published read-only
    # dashboard MUST include the Composite Explorer — require it here so a
    # missing/broken bundle fails loudly instead of shipping a loom-less site.
    env:
      VIVARIUM_WORKBENCH_REQUIRE_LOOM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (incl. vivarium-workbench)
        # The publish build needs vivarium-workbench. The hatchling build works
        # now that bigraph-schema is un-pinned; the `|| uv sync` fallback keeps
        # the job alive if an optional extra fails to build.
        run: uv sync --extra dev || uv sync

      - name: Ensure the publish CLI + loom bundle are current (latest main)
        # uv.lock may pin a vivarium-workbench commit that predates the publish
        # CLI (vivarium_workbench.publish). Force the current main so
        # `vivarium-workbench-publish` exists and carries the latest publish
        # robustness fixes.
        #
        # This also refreshes the loom UI: bigraph-loom is now vendored INTO
        # vivarium-workbench (vivarium_workbench/loom/), and the workbench wheel
        # build hook (hatch_build.py) runs scripts/build_loom.sh to produce the
        # `_dist` bundle that publish.py ships via loom_assets.asset_dir(). So a
        # workbench@main reinstall already rebuilds the loom from current source
        # — no separate bigraph-loom install (that external repo is archived).
        run: |
          uv pip install --reinstall-package vivarium-workbench "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-workbench.git@main"

      - name: Build dashboard snapshot
        # Builds the static SPA bundle (all investigations + studies) and strips
        # bigraph-loom source maps. No sim run / ParCa cache needed.
        #
        # Run inside the activated venv rather than via `uv run`: `uv run`
        # re-syncs the env to uv.lock first, which would UNDO the previous step's
        # ad-hoc install of vivarium-workbench@main and drop the
        # `vivarium-workbench-publish` console script (-> exit 127).
        run: |
          source .venv/bin/activate
          bash scripts/publish_dashboard.sh reports/published/workbench

      - name: Publish to gh-pages
        # Surgical: replace ONLY workbench/ on gh-pages via a worktree, and keep
        # the legacy dashboard/ path as a redirect stub to ../workbench/. Never
        # touches investigations/*.html, the viewers, or the docs mirror.
        # Commits only on a diff (config.json carries the source commit, so a
        # new main commit always produces one).
        run: |
          set -euo pipefail
          if [ ! -f reports/published/workbench/index.html ]; then
            echo "::error::build produced no bundle (no index.html); nothing to publish"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          rm -rf /tmp/ghp/workbench
          mkdir -p /tmp/ghp/workbench
          cp -R reports/published/workbench/. /tmp/ghp/workbench/
          # Legacy /dashboard/ → redirect to /workbench/ (single indented printf,
          # NOT a heredoc — a column-1 <!doctype> would break this block scalar).
          mkdir -p /tmp/ghp/dashboard
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../workbench/"><link rel="canonical" href="../workbench/"><title>Moved to /workbench/</title><p>This read-only workbench moved to <a href="../workbench/">/v2ecoli/workbench/</a>.</p>' > /tmp/ghp/dashboard/index.html
          cd /tmp/ghp
          git add workbench dashboard
          if git diff --cached --quiet; then
            echo "workbench snapshot unchanged; skipping commit"
          else
            git commit -m "gh-pages: republish read-only workbench (automated, ${GITHUB_SHA::7})"
            git push origin gh-pages
            echo "published read-only workbench snapshot to gh-pages:workbench/"
          fi
