findings:
- id: insim-binding-fires-readonly-cycle-preserved
  kind: computational
  status: novel
  statement: |
    The PROVIDED DnaA-box binding listener runs IN-SIM inside the composite and is
    cleanly read-only: it writes only listeners.dnaA_binding and never mutates the
    DnaA pool or the box flags, so the cell cycle matches the dnaa-2 succinate
    baseline (oriC 1<->2; divisions every generation). The real per-tick in-sim
    values — free DnaA-ATP/ADP, DnaA-ATP fraction, and oriC low/high occupancy —
    are recorded under runs[dnaa3-insim-readonly].real_insim_numbers, taken
    directly from the emitted parquet. With the DnaA-ATP fraction in [0.2,0.5]
    (from the provided dnaa-2 nucleotide-balance mechanism) the low-affinity sites
    do not all saturate, so the observed occupancy needs no cap, added pool, or
    outside source.
  evidence:
    from_run: dnaa3-insim-readonly (in-sim listener, parquet listeners.dnaA_binding)
  provenance:
    run_ids:
    - dnaa3-insim-readonly
    verified_by: scripts/run_condition_multigen_parquet.py + cache_dnaa3 (ParCa --mode full)
- id: readonly-real-numbers-low-aff-not-saturated
  kind: computational
  status: novel
  statement: |
    REAL numbers from the completed read-only run (no cap, no sink — only the
    provided fast-equilibrium binding mechanism plus the dnaa-2 nucleotide balance),
    read straight from the emitted listeners.dnaA_binding parquet at the steady
    reference generation 5:
      - free DnaA-ATP = 342 nM mean / 344 nM median (free DnaA-ADP ~1053 nM);
        whole-run (6 gens) free DnaA-ATP mean 238 / median 248 nM.
      - DnaA-ATP fraction = ATP/(ATP+ADP+apo) = 0.23 (gen 5), 0.31 (gen 6) — INSIDE
        Rashmi's [0.2,0.5] band (at its low edge), from the provided ATP-fraction
        mechanism, not assumed.
      - oriC LOW-affinity occupancy = 0.77 (gen 5), 0.82 (gen 6) — ~12 of 14 oriC
        boxes bound, clearly BELOW 1. oriC HIGH-affinity, chromosomal and
        dnaA-promoter occupancy = ~1.00.
    Rashmi's key point is RESOLVED with the provided ATP-fraction mechanism alone:
    with the DnaA-ATP fraction correctly in [0.2,0.5], the low-affinity sites do NOT
    all saturate (free DnaA-ATP ~342 nM sits a few-fold above the 100 nM oriC-low
    K_d, giving ~0.77 occupancy, not 1.0). No box-capacity cap, DnaA sink, or added
    pool is needed to keep the low-affinity sites sub-saturated.
    CAVEAT: the parquet emitted only the first tens of seconds of each generation
    (oriC = 1 throughout the emitted window); the 1<->2 oriC pattern and 6/6
    divisions (tau 63/65/64/69/76/56 min) come from the run summary + dills and match
    the dnaa-2 succinate baseline.
  evidence:
    from_run: dnaa3-insim-readonly (in-sim emitted listeners.dnaA_binding, generation 5)
  provenance:
    run_ids:
    - dnaa3-insim-readonly
    verified_by: scripts/render_dnaa3_binding_analysis.py + scripts/render_dnaa3_occupancy.py
- id: oric-low-affinity-is-the-dynamic-switch
  kind: computational
  status: novel
  statement: |
    Across the cell cycle the oriC high-affinity boxes stay near-saturated while
    the 8 oriC low-affinity boxes (K_d ~100 nM) are the dynamic switch — their
    occupancy tracks the free DnaA-ATP concentration. The exact free DnaA-ATP and
    oriC low/high occupancy values are read off the read-only run (see
    runs[].real_insim_numbers); they are not assumed. Only the provided binding
    mechanism is modeled.
  evidence:
    from_run: dnaa3-insim-readonly (in-sim emitted listeners.dnaA_binding)
  provenance:
    run_ids:
    - dnaa3-insim-readonly
    verified_by: scripts/render_dnaa3_binding_analysis.py
- id: oric-doubles-at-replication
  kind: computational
  status: confirms
  statement: oriC and its associated boxes double at replication initiation (11->22 low-affinity boxes), reflected in the occupancy figure.
  evidence:
    from_run: dnaa3_box_occupancy
  provenance:
    run_ids:
    - dnaa3-insim-readonly
    verified_by: scripts/render_dnaa3_occupancy.py
discovery_implications:
  resolved_uncertainties:
  - The provided DnaA-box binding equilibrium (315 boxes, 4 affinity pools, fast equilibrium) is observable in-sim as a read-only listener without perturbing the dnaa-2 cell cycle.
  remaining_uncertainties:
  - The oriC initiation threshold — what DnaA-ATP occupancy robustly triggers initiation — remains unresolved, to be addressed by a later study with provided mechanisms only.
