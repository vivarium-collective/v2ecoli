schema_version: 4
name: pdmp-05-causal-discovery
investigation: v2ecoli-pdmp
title: "Phase 5 — Causal Discovery and Functional Annotation"
claim: "At ±15% hypothesis spacing the unbiased pseudo-marginal posterior is essentially uniform (log BF\n+0.01, truth 24.4% vs 20% baseline) and replicate count cannot rescue it (kernel-mean gap Δlog +0.011\nsets an information-theoretic ceiling). Wider spacing lifts truth posterior to 61% but log BF tops out\nat +0.45 (< Jeffreys substantial), so the single remaining lever in the current design space is\nobservable choice.\n"
confidence: Investigating
status: running
phase: Design
topic: pdmp
tags:
  - pdmp
  - phase-5
  - causal-discovery
  - gene-annotation
  - bayesian-model-comparison
  - russian-roulette
  - active-inference
  - xarray-emitter
created: '2026-05-24'
question: "Can the compiled, likelihood-equipped PDMP WCM support Bayesian model comparison for gene-function\nannotation — recovering known E. coli gene functions on a benchmark set with credible intervals that\nshrink with sample size, and driving an active causal-inference loop that selects in-silico\ninterventions to maximally discriminate between candidate mechanisms?\n"
hypothesis: "Framing gene-function annotation as Bayesian model comparison — with marginal likelihoods estimated via\nRussian Roulette / doubly-intractable estimators, plus active Bayesian causal inference that proposes\ntargeted in-silico interventions (knockouts, overexpression) and selects experiments by expected\ninformation gain — recovers the known functions of a benchmark set of E. coli genes with credible-\ninterval widths that decrease predictably as sample size grows, at a per-annotation compute cost that\nextrapolates to feasible genome-wide scaling.\n"
objective: 'Implement the marginal-likelihood estimator (Russian Roulette / doubly-intractable) on the Phase 3

  accumulator and Phase 4 compiled runtime, build the active causal-inference loop (propose intervention,

  predict outcomes under candidate mechanisms, score by expected information gain), and curate a benchmark

  set of E. coli genes with established functions. Measure posterior recovery rate, credible-interval

  width vs. sample size, and compute cost per annotation, and produce a resource estimate for genome-wide

  scaling.

  '
description: "Phase 5 of the v2ecoli → PDMP roadmap and the final phase, pursuing the DUF ARC goal of\nsimulation-based causal discovery in WCMs. It depends on every preceding phase: the PDMP for process\nlikelihoods (Phase 2), the observation-likelihood library and accumulator (Phase 3), and the compiled\nhigh-throughput runtime that makes marginal-likelihood estimation feasible (Phase 4). Each candidate\ngene-function annotation defines a different WCM; we marginalize over parameters and compare via\nmarginal likelihoods, with Russian Roulette estimators (Lyne et al. 2015) giving unbiased estimates of\nthe otherwise intractable marginals. Active causal inference (Toth et al. 2022) runs the experiment-\ndesign loop, proposing interventions whose outcomes most sharply distinguish competing annotations. The\nbenchmark set holds ≥20 E. coli genes with literature-established functions across diverse mechanism\nclasses (kinases, transcription factors, transporters, structural proteins).\n\n# Numerical considerations\nMarginal likelihood numerics. Russian Roulette (Lyne et al. 2015) gives unbiased estimators of\nintractable normalizing constants Z = ∫ p(D|θ) p(θ) dθ via a truncated geometric series with importance\nweights. The estimator can have unbounded variance, so we monitor empirical variance over batches and\nrequire an ESS-equivalent N_eff ≥ 100 per Z estimate; below that the result is flagged and we use a\ntighter proposal or fall back to thermodynamic integration / nested sampling with documented bias.\n\nBayes factor confidence intervals. Report log Bayes factors with a 95% bootstrap CI from the RR\nvariance bound, not point estimates. Conclusions fire only if the CI sits entirely above the\nJeffreys-scale threshold (|log BF| > 1, \"substantial evidence\").\n\nSBC at the model-comparison level. Extend SBC to model comparison: for K=500 synthetic datasets each\ngenerated under a known true annotation, the recovered posterior model probability should be uniform\nconditional on the true model index (Talts et al. 2018, Cook et al. 2006). A non-uniform rank histogram\nsignals miscalibration before we trust it on novel annotations.\n\nActive inference numerics. Expected information gain (EIG) is estimated via nested Monte Carlo (outer\nover experiments, inner over (θ, y) pairs). Standard NMC has bias O(1/N_inner), so we use\nDonsker-Varadhan or DAD-MINE variational lower bounds where feasible, else NMC with explicit bias\nbounds. Every intervention proposal carries its EIG ± MCSE; the loop never selects an intervention whose\nEIG CI overlaps zero.\n\nFalse discovery control. Benchmark recoveries report per-annotation posterior probability and a\nBenjamini-Hochberg FDR at the gene-set level; a q-value ≤ 0.1 is required before declaring a benchmark\nrecovery successful.\n\nConvergence rate of credible-interval widths. Report the shrinkage rate: sub-√n is the standard MCMC\nrate (posterior-mean variance ∝ 1/n_eff_samples); slower than n^{-1/2} indicates poor mixing or\nnon-identifiability and triggers diagnosis.\n\n# Emitter\nEach candidate-annotation run writes a zarr store with (a) the RR marginal-likelihood estimator\ntrajectory, (b) the per-annotation posterior, and (c) the intervention-selection record + EIG\nestimates. The benchmark gene-set sweep aggregates per-gene zarr stores into one zarr group per\nbenchmark, readable via xarray.open_mfdataset() for the gene-set-level BH-FDR summary.\n"
expected_behavior:
  - name: annotation-bayes-model-compare
    en: Marginal likelihoods are estimated via Russian Roulette / doubly-intractable methods with quantified variance bounds; the implementation passes published unit tests on simpler model-comparison benchmarks before being applied to WCM candidates.
    given:
      condition: candidate-annotations
    measure:
      kind: observable-comparison
      observable: marginal-likelihood-estimator
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: active-causal-discovery-loop
    en: The active-inference loop proposes in-silico interventions (knockouts, overexpression) and selects them by expected information gain over the candidate annotation set; the selection record shows the loop converges in expected number of interventions vs. random selection.
    given:
      condition: per-annotation
    measure:
      kind: observable-comparison
      observable: intervention-selection-record
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: benchmark-recovery-with-credible-intervals
    en: "On a curated benchmark of ≥20 E. coli genes with established functions, the pipeline recovers the correct annotation at the published credible level, with credible-interval widths that shrink predictably as sample size grows. (Gating criterion for the whole investigation.)"
    given:
      condition: e-coli-known-function-benchmark
    measure:
      kind: observable-comparison
      observable: posterior-recovery-rate
    expect:
      op: within-tolerance
      note: "Planned gene-function benchmark — not yet built. Delivered so far: a 5-point synthetic transcript_init_prob_scale sweep (scripts/phase5_bayes_factor_stub.py), a scaffold rather than a gene-function benchmark. Still to build: the Russian-Roulette / pseudo-marginal estimator over genes, the active-inference / EIG loop, and model-level SBC."
    status: planned
  - name: genome-wide-resource-estimate
    en: "Per-annotation compute cost on the benchmark extrapolates to a defensible total compute estimate for genome-wide scaling (≥4000 E. coli genes); the estimate identifies the binding constraint (compute time, memory, or convergence)."
    given:
      condition: benchmark-results
    measure:
      kind: observable-comparison
      observable: compute-cost-extrapolation
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-rr-estimator-ess
    en: Russian Roulette marginal-likelihood estimates carry an ESS-equivalent N_eff; estimates with N_eff < 100 are flagged and either rerun with a tighter proposal or replaced by a documented-bias method (TI / nested sampling).
    given:
      condition: per-marginal-likelihood
    measure:
      kind: observable-comparison
      observable: rr-estimator-N-eff
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-bayes-factor-CIs
    en: log BF reported with 95% bootstrap CI. Annotation calls only fire when the CI lies entirely above the Jeffreys |log BF| > 1 threshold ("substantial evidence").
    given:
      condition: per-pairwise-comparison
    measure:
      kind: observable-comparison
      observable: log-bayes-factor-with-95-CI
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-sbc-at-model-comparison-level
    en: "Extended SBC over K=500 synthetic datasets from known true annotations: rank histogram of true-model posterior probability passes χ² uniformity (p > 0.05). Required before trusting the pipeline on real annotations."
    given:
      condition: K500-synthetic-datasets
    measure:
      kind: observable-comparison
      observable: model-posterior-rank-uniformity
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-eig-MCSE-nonzero
    en: "Every intervention proposal carries an EIG estimate ± MCSE; proposals whose EIG CI overlaps zero are not selected. NMC bias bound reported, or DV/DAD variational lower bound used where feasible."
    given:
      condition: per-intervention-proposal
    measure:
      kind: observable-comparison
      observable: expected-information-gain-with-MCSE
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-fdr-on-benchmark-recoveries
    en: "Recoveries on the benchmark gene set are reported with BH-adjusted q-values; success claim requires q ≤ 0.1 at the gene-set level, not just per-gene posterior probability."
    given:
      condition: benchmark-gene-set
    measure:
      kind: observable-comparison
      observable: benjamini-hochberg-q-value
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
  - name: uq-credible-interval-shrinkage-rate
    en: Credible-interval-width-vs-N curves are fit on a log-log scale; expected slope -1/2 for well-identified parameters. Slopes shallower than -0.4 trigger MCMC mixing diagnostics and identifiability re-check.
    given:
      condition: per-parameter
    measure:
      kind: observable-comparison
      observable: ci-width-vs-sample-size
    expect:
      op: within-tolerance
      note: Acceptance band set when this study enters Build (design-stage).
    status: stub
