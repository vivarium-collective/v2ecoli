schema_version: 4
name: succinate
investigation: v2ecoli-vecoli-comparison
title: v2ecoli reproduces vEcoli on succinate
condition: succinate
question: Does v2ecoli reproduce vEcoli on the succinate condition?
comparison:
  seeds: 4
  generations: 4
report_cards:
  - viz/report_card/config.html
  - viz/report_card/standard.html
  - viz/report_card/statistical.html
runs:
  - composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    name: succinate-comparison
    kind: analysis
    canonical: true
    description: v2e-compare study succinate
    status: completed
    result: PASS
    outcomes:
      statistical-vs-vecoli:
        result: WITHIN_TOL
        detail: 'report card ''statistical'': ungraded'
status: evaluated
tests:
  - name: config-vs-vecoli
    kind: report_card
    card: config
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (config card)?
  - name: standard-vs-vecoli
    kind: report_card
    card: standard
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (standard card)?
  - name: statistical-vs-vecoli
    kind: report_card
    card: statistical
    classification: primary
    question: Does v2ecoli reproduce vEcoli on succinate (statistical card)?
    measure:
      kind: report_card_axis
      card: docs/report_cards/v2ecoli-vecoli-comparison/succinate
      group: statistical
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      media: minimal_succinate  # migrated from condition:succinate; calibrated per-condition ParCa cache lives at out/cache/.regen_succinate_seed00
  model_settings: []
depends_on:
  - parca
confidence: Accepted
findings:
  - id: succinate-rpobc-fix
    kind: computational
    status: confirms
    statement: 'RESOLVED. Succinate was a borderline drift (growth +18.0%, p=0.06). After the fix v2ecoli reproduces vEcoli natively: growth drift halved and flipped to -6.6% (p=0.44, not significant), RNA/cell/dry now within tolerance (4/5 within_tol). The residual growth sits just outside +/-5% but is non-significant, at basal noise. Root cause: the ParCa ppGpp-expression NNLS set exp_free[rpoBC operon]=0 (a non-negativity boundary solution), inverting the RNAP-core (rpoB/rpoC) nutrient response and compressing assembled APORNAP-CPLX -> active_RNAP -> rRNA/growth. The fix restores a fold-change-consistent, basal-preserving rpoBC split.'
    evidence:
      from_card: statistical
      observed: 'before -> after fix (4-seed gen-1, Welch t): growth +18.0% (p=0.06) -> -6.6% (p=0.44, not significant); RNA +12.9% drift -> -2.2% within_tol; cell +8.3% drift -> -1.3% within_tol; dry +8.3% -> -1.4% within_tol; protein +1.7% -> -0.8% within_tol. Overall drift -> drift (now 4/5 within_tol, non-significant).'
inputs:
  - artifact: sim_data
    from: parca
