discovery_implications:
  resolved_uncertainties:
  - 'Continuous-time per-promoter / per-protein Poisson tau-leap samplers were implemented and land in
    `poisson` mode. The "150 fg" headline is max |Delta cell_mass| = 150 fg between configs — a transient
    on a single trajectory pair, computed in scripts/trajectory_divergence.py on the cell_mass quantity
    (NOT measured at the rnap_data listener, which is a narrative literal absent from the computing
    script); and it cuts against this study''s own thesis that cell_mass is the wrong observable.'
  - 'cell_mass is decisively the WRONG observable for jump-process variance: the consumption_matched
    homeostat (from Phase 1) washes per-tick variance out of cell_mass by construction. Three controller-
    tuning attempts (tau-EMA, open-loop, sparse injection) all failed to recover mass variance.'
  remaining_uncertainties:
  - 'The original Phase-2 gate `pdmp-trajectory-distribution-match` — trajectory-distribution W2 match to
    the v2ecoli baseline on cell_mass across all Phase-0 conditions — FAILED: the Poisson cell_mass W2
    grows monotonically 9.73 → 15.35 → 49.46. Per the closeout this is the WRONG gate (cell_mass is the
    wrong observable), a legitimate negative/structural result — but the gate status is FAILED, not
    passed/accepted. A replacement count-level trajectory-distribution criterion has not yet been
    formally specified or passed.'
  - 'The Anderson-Darling Exp(1) exponential-clock verification (>=1e4 inter-event intervals) and the OU
    first-passage division-trigger validation (KS < 0.02) remain unrun.'
  alternate_hypotheses:
  - id: homeostat-is-the-variance-sink
    statement: 'It is the consumption_matched homeostat specifically (not jump sampling per se) that
      erases per-tick variance; loosening or disabling the homeostat would restore cell_mass as a usable
      variance observable.'
    why_plausible: 'The homeostat actively tracks a reference growth trajectory, so any per-tick
      fluctuation it sees is corrected within a tick.'
    mechanism_elements_affected:
    - consumption_matched-driver
    - cell_mass-observable
    - jump-variance-propagation
    discriminating_observables:
    - cell_mass CV with the homeostat on vs off under identical jump seeds
    - count-listener variance (rnap_data, ribosome_data) vs cell_mass variance
    evidence_for:
    - Open-loop (homeostat-off) was one of the three tuning attempts.
    evidence_against:
    - 'Even open-loop, cell_mass did not become the right inference channel — pointing to counts, not
      mass, as the signal carrier.'
  mechanism_update_proposals:
  - mechanism_node_or_edge: inference-observable (cell_mass -> count-level listeners)
    update_type: revise
    rationale: 'Anchor all downstream variance-based inference on count-level listeners (rnap_data,
      ribosome_data, monomer_counts) rather than cell_mass; the homeostat makes mass variance-blind.
      This redirected Phase 3.'
    requires_expert_approval: true
  followup_study_proposals:
  - id: pdmp-02-count-trajectory-gate
    title: Count-level trajectory-distribution match as the Phase-2 acceptance gate
