findings:
- id: F-01
  kind: biological
  status: confirms
  statement: 'With replisome subunit gating on, the lineage arrests at generation 2: that generation ran
    the full 200-minute duration cap without dividing, so the mechanistic arm completed 1 generation of
    a 12-generation run.'
  evidence:
    from_run: mechanistic-replisome-arrest__mechanistic__seed0
    from_test: lineage-arrests-under-mechanistic-replisome
    observed: 1
  expected:
    summary: The mechanistic arm should terminate before generation 12.
  provenance:
    run_ids:
    - mechanistic-replisome-arrest__mechanistic__seed0
  tier: observation
  summary: 'The phenomenon the investigation exists to explain reproduces on this tree. Generation 1 divided
    normally (tau 43.0 min, 718.7 fg); generation 2 then grew to 4156.5 fg -- about 5.8x -- while never
    initiating replication, and was cut off by the duration cap rather than ending on its own.


    This is a single-seed result (seed 0). It establishes that the arrest is real on origin/main, not
    that it is seed-independent; the follow-on seed-robustness study is what would settle that.

    '
- id: F-02
  kind: biological
  status: confirms
  statement: The permissive control completed all 12 generations from the same seed and the same cache,
    so the arrest is attributable to the gating flag itself.
  evidence:
    from_run: mechanistic-replisome-arrest__mechanistic__seed0
    from_test: permissive-lineage-survives
    observed: 12
  expected:
    summary: The permissive arm should reach 12 generations from the same seed.
  provenance:
    run_ids:
    - mechanistic-replisome-arrest__mechanistic__seed0
  tier: observation
  summary: 'Both arms were run from one cache (fingerprint ea05ac9b23b1d843, checked at render time) and
    a byte-identical initial state, differing only in the runtime value of mechanistic_replisome. The
    permissive arm held tau at 43-59 min and dry mass at 592-732 fg across all 12 generations.


    This is the control that makes the comparison interpretable: it rules out the lineage length, the
    initial state and the cache as explanations, leaving the gate. Had this arm also arrested, the causal
    chain would have been refuted at its first link.

    '
- id: F-03
  kind: biological
  status: contradicts
  statement: DnaG is not the exhausted subunit -- no subunit was exhausted. At the arrest every replisome
    pool sat above its requirement, the worst margin being DnaG at +2 copies.
  evidence:
    from_run: mechanistic-replisome-arrest__mechanistic__seed0
    from_test: dnag-is-the-exhausted-subunit
    observed: false
  next_action: Do not calibrate against this. The subunit-depletion hypothesis is refuted; the actionable
    follow-up is the gate's equality condition recorded in F-05.
  expected:
    summary: DnaG, rather than another subunit, should be the pool exhausted at the arrest.
  provenance:
    run_ids:
    - mechanistic-replisome-arrest__mechanistic__seed0
  tier: mechanism
  summary: 'At generation 2 the cell held one oriC, so the gate wanted 6 copies of each trimer and 2 of
    each monomer. Observed minima: pol III core 235 (+229), beta clamp 137 (+131), DnaB hexamer 137 (+135),
    HolB 339 (+337), HolA 17 (+15), DnaG 4 (+2). DnaG is by far the scarcest pool in absolute terms, which
    is consistent with the DnaG-depletion story, but it still cleared the requirement -- so scarcity is
    not exhaustion.


    This refutes the study''s own primary hypothesis, and it is the study''s most informative result.
    The test had four other ways to come out (pol III core, beta clamp, DnaB, HolA); instead of naming
    a different limiting pool it found none limiting at all. Note what this does NOT say: it does not
    show the model is miscalibrated, and it does not overturn the DnaG transcription-unit work. It says
    subunit availability is not the step that blocks initiation here.

    '
  next_action_type: retire_hypothesis
  seeded_study: replisome-gate-sufficiency
  seeded_rationale: Retiring the subunit-depletion hypothesis is exactly what study 2 tests, by re-asking
    the question with a gate that measures supply.
- id: F-04
  kind: biological
  status: contradicts
  statement: 'The graded report card returns 4 of 5 axes within tolerance with one hard mismatch: subunit_shortfall,
    the axis asserting some pool runs short.'
  evidence:
    from_run: mechanistic-replisome-arrest__mechanistic__seed0
    from_test: replisome_arrest
    observed: fail
  next_action: Treat the mismatch as a refuted hypothesis, not a calibration target.
  expected:
    summary: Every graded axis, including the subunit-shortfall mechanism axis, should be within tolerance.
  provenance:
    run_ids:
    - mechanistic-replisome-arrest__mechanistic__seed0
  tier: mechanism
  summary: 'The passing axes are the arrest itself, the paired generation gap (permissive 12 vs mechanistic
    1), the permissive control, and the arrest-generation regression pin. The single hard mismatch is
    the mechanism axis.


    The card gate therefore reads fail, and that is recorded honestly rather than reframed: a pre-registered
    acceptance criterion predicted a negative subunit margin and the measurement came back positive. A
    failing acceptance criterion is how a refutation is supposed to look. The gate failing does not mean
    the run, the model or the control is broken -- the other four axes all passed.

    '
  next_action_type: retire_hypothesis
  seeded_study: replisome-gate-sufficiency
  seeded_rationale: The refuted acceptance criterion is re-posed in study 2 as some-pool-is-short-at-the-stall,
    now that == no longer masks supply.
- id: F-05
  kind: computational
  tier: interpretation
  status: novel
  statement: 'The initiation gate tests equality, not sufficiency: it requires each pool to equal its
    requirement exactly, so a surplus blocks initiation exactly as a shortage would.'
  summary: "chromosome_replication.py:453-455 gates initiation on\n    np.all(n_replisome_trimers == 6\
    \ * n_oriC)\n    and np.all(n_replisome_monomers == 2 * n_oriC)\nBoth comparisons are ==, not >=.\
    \ With one oriC the gate wants exactly 6 and exactly 2; the cell held 235 pol III core and 4 DnaG,\
    \ so 235 == 6 and 4 == 2 are both False and initiation never fires.\n\nThis accounts for the whole\
    \ observation without any appeal to subunit scarcity, and it explains why the margins are uniformly\
    \ positive rather than marginal: the cell is not close to satisfying this condition and growing more\
    \ subunits moves it further away, not closer. It also explains why the arrest is absolute rather than\
    \ intermittent.\n\nRecorded as engineered, not emergent: this is the behaviour of an authored code\
    \ condition, not something the model discovered. Whether == is a genuine defect or model an intended\
    \ stoichiometric-assembly assumption is NOT settled here -- deciding that, and measuring what changes\
    \ under >=, is the next study.\n"
  mechanism_origin: engineered
  next_action: Read the condition against the upstream wcEcoli intent, then run a paired arm with >= to
    measure what the operator alone changes.
  expected:
    summary: No pre-registered expectation; this mechanism was identified after the run while explaining
      the refutation, so it is a hypothesis for the next study rather than evidence from this one.
  next_action_type: ablate
  evidence:
    from_run: mechanistic-replisome-arrest__mechanistic__seed0
    from_test: dnag-is-the-exhausted-subunit
  provenance:
    run_ids:
    - mechanistic-replisome-arrest__mechanistic__seed0
  seeded_study: replisome-gate-sufficiency
  seeded_rationale: 'The == mechanism is ablated in study 2: the operator is corrected and the paired
    arms measure what it alone changed.'
conclusion_verdicts:
  regression_compatibility:
    verdict: confirmed
    basis: No shipped code or data was changed to obtain this result. Both arms run stock v2ecoli from
      one cache (fingerprint ea05ac9b23b1d843) and a byte-identical initial state, differing only in the
      runtime value of mechanistic_replisome, applied through the composite generator's declared config_overrides
      parameter rather than by building a second cache.
  biological_validation:
    verdict: not_met (hypothesis refuted, not a calibration miss)
    basis: 'The study''s primary biological hypothesis — that the arrest coincides with exhaustion of
      DnaG — is refuted. Every replisome pool cleared its requirement at the arrest, the worst margin
      being DnaG at +2 copies. This is a refutation of the hypothesis rather than evidence of a miscalibrated
      model: the arrest itself reproduces and the permissive control passes, so nothing here indicates
      the model is wrong, only that subunit availability is not the step that blocks initiation.'
  explanatory_gain:
    verdict: confirmed
    basis: The study replaces a plausible but untested mechanism with a verified one. The initiation gate
      at chromosome_replication.py:453-455 tests equality rather than sufficiency (== 6 * n_oriC, == 2
      * n_oriC), so a surplus blocks initiation exactly as a shortage would; with 235 pol III cores present,
      235 == 6 is False. That accounts for the arrest without any appeal to scarcity, and it explains
      why the margins are uniformly positive rather than marginal. It also invalidates citing the earlier
      plasmids-branch arrest in support of this one, since that branch had the operator patched to >=
      and was therefore observing a different phenomenon.
claim: 'Replisome subunit gating does arrest the lineage, but not by exhausting a subunit: every pool
  was in surplus at the arrest, and the initiation gate blocks because it tests equality rather than sufficiency.'
conclusion_logic:
  if_primary_tests_pass: If the mechanistic arm arrests, the permissive control completes, and a subunit
    pool is genuinely short at the arrest, then subunit availability gates initiation and DnaG is implicated
    — the transcription-unit architecture becomes the next thing to test.
  if_primary_tests_fail:
    summary: If the arrest reproduces but no pool is short, the arrest is not a depletion phenomenon and
      the DnaG link is refuted as stated; the gate's own condition becomes the object of study before
      any transcription-unit claim can rest on this arrest. This is the branch that was taken.
    diagnose:
    - question: Does the lineage still stall once the gate tests sufficiency (>=) rather than equality?
      seeded_study: replisome-gate-sufficiency
      note: Study 2's lineage-stalls-under-sufficiency-gate.
    - question: With the operator corrected, is a replisome subunit genuinely short at the stall, and
        is it DnaG?
      seeded_study: replisome-gate-sufficiency
      note: Study 2's some-pool-is-short-at-the-stall + dnag-is-the-limiting-pool.
