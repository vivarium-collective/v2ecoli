conclusion_verdicts:
- claim: The rule removes the misattributed LexA edge (H1's first step)
  verdict: supported
  basis: TU00352's LexA edge removed by the uniform rule, as predicted before running.
- claim: Positional attribution is applicable network-wide from this data
  verdict: refuted
  basis: Retention 0.1049 against a required 0.65; the rule strips 89.5% of adjudicated edges.
- claim: The disruption is a tolerance artefact
  verdict: refuted
  basis: Bimodal distances; a 100x looser tolerance moves retention only 0.1049 -> 0.1770.
- claim: The 89.5% shows the model's assignments are wrong
  verdict: undetermined
