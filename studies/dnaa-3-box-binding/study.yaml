# ── Build plan (codebase map, 2026-06-03) ─────────────────────────────────────
# What ALREADY exists in v2ecoli (reuse, don't rebuild):
#   - Equilibrium process + per-reaction integrate_dt two-phase solve:
#       v2ecoli/processes/equilibrium.py + parca/.../dataclasses/process/equilibrium.py
#     Reactions in flat/equilibrium_reactions.tsv; rates+integrate_dt in
#     flat/equilibrium_reaction_rates.tsv (DnaA rows: MONOMER0-160_RXN false,
#     MONOMER0-4565_RXN true, DNAA-INTRINSIC-HYDROLYSIS-RXN true).
#   - Consensus DnaA-box catalog: sequence_motifs.tsv "DnaA_box" (TTWTNCACA, 8
#     variants) → Replication._build_motifs() computes motif_coordinates["DnaA_box"]
#     by scanning flat/sequence.fasta; boxes instantiated as unique molecules
#     (schema DNAA_BOX_ARRAY: coordinates|domain_index|DnaA_bound) in
#     initial_conditions.py. All boxes currently ONE tier, DnaA_bound=false at birth.
#   - Genome sequence flat/sequence.fasta (len 4,641,652); oriC flat/dna_sites.tsv
#     G0-10506 = 3925744-3925975 (verified: oriC seq programmatically extractable;
#     R1 TTATCCACA / R2 TTATACACA anchors locate; signed-coord frame runs OPPOSITE
#     to genome direction — R1(-55) sits at a HIGHER genome coord than R2(+50)).
#   - replication_data listener already emits total_DnaA_boxes + free_DnaA_boxes
#     (v2ecoli/steps/derivers/replication_data.py); no per-pool breakdown yet.
#
# What must be CREATED (the dnaa-3 mechanism):
build_plan:
- step: partition-catalog-into-4-pools
  detail: |
    Split the single "DnaA_box" catalog into chromosomal_high (302), oriC_high
    (3: R1/R2/R4), oriC_low (8), promoter_high (2: box1/box2). High-aff = the
    302 chromosomal consensus matches minus the 5 broken-out sites; oriC_high +
    promoter_high are the 5 named consensus sites; oriC_low is the 8 supplied
    coordinates (extract-low-aff-coords). Carry a per-box affinity tier + pool tag.
  touches: [sequence_motifs.tsv or new dnaa_box_tiers.tsv, replication.py (_build_motifs), DNAA_BOX_ARRAY schema]
- step: extract-low-aff-coords
  detail: |
    8 low-aff oriC boxes are NON-consensus → not in the consensus catalog; supply
    explicitly. Align literature box sequences to the oriC window of
    flat/sequence.fasta (which MATCHES oric_sequence.pdf), using R1/R2/R4 consensus
    hits to fix the frame. Order: R5M·τ2·I1·I2 (between R1 & R2) · C3·C2·I3·C1
    (between R2 & R4). Replaces inputs_to_supply.provisional_coords_signed.
- step: add-box-binding-equilibria
  detail: |
    Add fast-equilibrium binding reactions (integrate_dt=false) to
    equilibrium_reactions.tsv + _rates.tsv: per pool, DnaA-ATP(+ADP for high-aff)
    + free-site ⇌ bound-site, K_d = 1 nM (high) / 100 nM (low). Convert K_d →
    forward/reverse rates (degenerate magnitudes; pick on-rate ~1e8 /M/s scale).
    Hydrolysis k=0.046/min applies to bound DnaA-ATP too (uniform).
  touches: [flat/equilibrium_reactions.tsv, flat/equilibrium_reaction_rates.tsv]
- step: register-bound-pool-species-and-state
  detail: |
    High-aff pools need free/bound-ATP/bound-ADP counts; low-aff free/bound-ATP.
    Either as bulk species pools or as DnaA_bound→(bound-ATP|bound-ADP) state on
    the unique boxes. Box count must double across replication (315→630→315) — the
    existing chromosome_structure.py fork logic already duplicates boxes.
  touches: [internal_state.py / bulkMolecules.py, chromosome_structure.py]
- step: listener-and-viz
  detail: |
    Emit per-pool free/bound-ATP/bound-ADP on replication_data; build the 4
    visualizations (ATP partition, ADP partition, total boxes raw count, total
    bound conc) with the sum-invariant checks.
  touches: [replication_data.py, v2ecoli/visualizations/]
- step: validate
  detail: |
    Run V=1e-3 succinate 8-gen seed=1 burned-in (Rashmi's directed dnaa-2 reproduction, ~35 min). Check
    the 4 tests: 8/8 divisions, oriC 1↔2, 0 re-init, DnaA-ATP fraction gen-3 in
    [0.2,0.5]. The binding observer is read-only, so it cannot perturb the cycle.

# ── Implementation requirements ───────────────────────────────────────────────
