    config:
      title: "REAL (2-gen) — order-2 PCE surrogate: GFP product level vs exp and vs trl_eff (other at midpoint)"
    render: |
      REAL 2-generation result: order-2 PCE surrogate prediction of GFP product
      level across each knob's productive range (exp ∈ [1e3,1e4], trl_eff ∈
      [0.5,2.0]), other knob at midpoint, over the ensemble scatter. Both knobs
