description: "Run the canonical viva-munk MOTHER MACHINE \u2014 narrow dead-end channels\
  \ with a\nflow channel that washes out cells crossing the top \u2014 populated by\
  \ viva-munk's\nsimple grow/divide agents. The simulation runs now and produces (a)\
  \ an\nanimated GIF of the device running and (b) distribution figures for the core\n\
  single-cell phenotypes: size at division, time between birth and division, and\n\
  added size before division (the adder plot).\n\nSimulations run now; biological\
  \ conclusions are HELD for experimental\nmother-machine data (a planned comparison\
  \ study, colonies-09). This study\nestablishes the measurement + visualization pipeline\
  \ against cheap agents.\n"
