schema_version: 4
name: showcase-5-next-direction-decide
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: "Which direction next — deepen the strongest perturbation contrast (reviewers to choose)"
created: '2026-06-12'
status: design   # legacy back-compat; canonical axes below

# v4 schema (vivarium_workbench.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]

# Canonical 6-axis status. This is a DECISION study (like showcase-3): the
# design is complete and the candidate directions are SEEDED from the showcase-4
# results, but no direction is committed, so nothing is run and the gate / expert
# review are pending the reviewer's choice.
design_status: complete
implementation_status: not_run
simulation_status: not_run
evaluation_status: not_run
gate_status: pending
expert_review_status: pending

question: |
  Given the showcase-4 5-variant sweep, which direction should the showcase
  take next? The sweep produced a clear ranking — media / growth-condition
  change was the strongest, most interpretable contrast; the ppGpp-off
  de-repression was the most informative surprise; elong-down was a near-null.
  This study stops at a DECISION: it commits no variant. Candidate next
  directions are seeded from those results; reviewers pick which one (or more)
  to pursue. No simulation runs until a direction is chosen.

report:
  title: showcase-5 — next-direction decision (no direction committed)
  verdict: pending
  confidence: design-stage
  evidence_quality: design-only (seeded from showcase-4 measured results)

  objective: |
    Hand reviewers an explicit, OPEN choice for the NEXT direction, grounded in
    the showcase-4 measured contrasts: which follow-up best advances the
    showcase? This study deliberately commits no variant (conditions.variants
    lists four PROPOSED, uncommitted candidate directions); it presents candidate
    directions seeded from the showcase-4 ranking
    and stays un-run until a reviewer selects one.

  result: |
    [NO RUN — decision study. The sim does not run until a direction is chosen.
    The candidate directions below are SEEDED from the showcase-4 results:

      - STRONGEST contrast (media-succinate): dry mass halved, never multiforks
        (oriC 2 vs 4), Toya-2010 flux correlation collapsed 0.727 -> -0.058.
        => candidate A: deepen the growth-condition response (carbon-source panel).
      - MOST INFORMATIVE SURPRISE (ppgpp-off): ppGpp pool ROSE (1.86x) rather
        than collapsing; growth slowed most.
        => candidate B: decompose ppGpp synthesis vs regulation (2x2).
      - PARTIAL (dnaA-2x): advanced re-init timing + dropped Toya r, but did not
        raise the oriC ceiling.
        => candidate C: push the dnaA knob harder / connect to the
           dnaa-replication investigation.
      - NEAR-NULL (elong-down): 0.7x elongation barely moved growth.
        => candidate D: a graded translation-knob dose-response (larger cuts).
    ]

  decision: |
    OPEN — reviewers to choose the next direction. The four candidates (A
    growth-condition panel / B ppGpp synthesis-vs-regulation decomposition / C
    dnaA knob deepening / D graded translation dose-response) are seeded from the
    showcase-4 ranking below. The agent's recommendation is candidate A (deepen
    the strongest contrast) with candidate B as the high-information alternative,
    but no direction is committed.

  decisions_needed:
  - question: "Which direction should the showcase take next, given the showcase-4 ranking?"
    status: "OPEN — reviewers to choose"
    context: |
      Four candidate directions seeded from the showcase-4 5-variant sweep. The
      agent recommends A (deepen the strongest contrast) or B (chase the most
      informative surprise); none is committed.
        A. DEEPEN THE STRONGEST CONTRAST — growth-condition panel. media-succinate
           was the strongest, most interpretable contrast (4 axes at once:
           mass, replication, composition, Toya-flux collapse). Run a small
           panel of carbon sources (glucose / succinate / acetate / glycerol /
           +amino-acids) and chart the growth / flux / composition response.
           FLAG: one full ParCa cache per condition (~2.5 min each).
        B. CHASE THE SURPRISE — ppGpp synthesis vs regulation (2x2). ppgpp-off
           de-repressed rather than collapsed ppGpp (1.86x). Separate ppGpp
           *synthesis* (RelA/SpoT) from the *regulatory* coupling and run a
           synthesis-off / regulation-off 2x2 to pin the mechanism.
        C. PUSH THE PARTIAL — dnaA knob deepening. dnaA-2x advanced re-init
           timing + dropped Toya r but did not raise the oriC ceiling. Sweep the
           dnaA init-probability (1x..4x) and connect to the dnaa-replication
           investigation's replication-initiation readouts.
        D. RESCUE THE NULL — graded translation dose-response. elong-down (0.7x)
           was a near-null; sweep the basal elongation rate across a wider range
           (e.g. 1.0x..0.4x) to find where the steady-state-charging compensation
           breaks and growth actually slows.

  review_asks: |
    For reviewers, before any next-direction run:
    1. WHICH DIRECTION — A (growth-condition panel), B (ppGpp synthesis-vs-
       regulation 2x2), C (dnaA knob deepening), or D (graded translation
       dose-response)? You may select more than one.
    2. READOUT — what is the primary readout you want for the chosen direction
       (growth rate, central-carbon flux / Toya-r, the ppGpp pool, replication
       initiation timing, ...)?
    3. COST TRADE-OFF — is the growth-condition panel (A) worth its extra cost
       (one full ParCa cache per condition, ~2.5 min each) vs the single-cache
       directions (B / C / D run on the existing glucose cache)?
    4. SCOPE — one direction or a small set?

# --- v4 narrative-spine sections (decision study — filled from existing content) ---
study_card:
  phase: Decide
  one_liner: "A reviewer-decision gate seeded from the showcase-4 ranking: which direction should the showcase deepen next? Four candidates, none committed."
  status: design (open decision)
  headline: "OPEN — reviewers choose among A growth-condition panel / B ppGpp synthesis-vs-regulation 2×2 / C dnaA knob deepening / D graded translation dose-response. Agent recommends A or B."

runtime:
  status: "not run — reviewer-decision study; no compute until a direction is selected"

readouts:
- {name: decision-outcome, description: "Decision outcome: which candidate next-direction(s) the reviewer selects"}
- {name: per-direction-readout, description: "Per direction, the proposed primary readout (growth rate, central-carbon flux / Toya-r, ppGpp pool, or replication-initiation timing — to be chosen by the reviewer)"}

enforced_params:
- {name: basis, value: "showcase-4 5-variant ranking", why: "the candidate directions are seeded from the measured contrasts (media strongest, ppGpp-off most informative surprise, dnaA-2x partial, elong-down near-null)"}

biological_summary: |
  This study commits no direction. It frames an explicit reviewer choice among
  four follow-ups, each grounded in a measured showcase-4 contrast: deepen the
  strongest contrast (a carbon-source panel), chase the most informative surprise
  (decompose ppGpp synthesis vs regulation), push the partial (a dnaA
  init-probability sweep), or rescue the null (a graded translation
  dose-response). The biology of each candidate lives in followup_study_proposals.

literature_anchors:
- {cite: macklin2020, note: "The Covert-lab whole-cell model; the wild-type baseline and validation surfaces (Toya-2010 flux, ppGpp, replication) the candidate directions would extend."}

model_change: |
  None yet — the model change is the OPEN decision. Each candidate would alter a
  different axis (carbon source + its ParCa cache; ppGpp synthesis vs regulation
  decomposition; the dnaA init-probability; or the ribosome elongation rate over
  a wider range); see followup_study_proposals.

implementation_requirements: |
  Single-cache for directions B / C / D (reuse the showcase-1 glucose cache); the
  growth-condition panel (A) needs one full ParCa cache per condition (~2.5 min
  each) — the cost trade-off flagged for reviewers.

design_pivot_required: true   # intentionally a decision/pivot gate — a reviewer choice is REQUIRED before any run

conclusion_verdicts:
- {claim: "the next-direction choice is open", verdict: pending, basis: "four candidates seeded from showcase-4; none committed — resolves when a reviewer selects one (or more). Agent recommends A or B."}

simulation_set:
- name: direction-A-growth-condition-panel
  kind: simulation
  status: planned   # FLAG: one full ParCa cache per condition (~2.5 min each)
  base_model: baseline
  duration_steps: "ensemble per carbon source (glucose / succinate / acetate / glycerol / +amino-acids)"
  seeds: "set when the reviewer selects this candidate"
  metrics: [growth rate, central-carbon flux / Toya-r, mass composition]
  pass_fail_tests: [reviewer-selects-next-direction]
- name: direction-B-ppgpp-synthesis-vs-regulation
  kind: simulation
  status: planned
  base_model: baseline
  duration_steps: "synthesis-off / regulation-off 2×2 on the glucose cache"
  seeds: "set when the reviewer selects this candidate"
  metrics: [ppGpp pool, growth rate per quadrant]
  pass_fail_tests: [reviewer-selects-next-direction]
- name: direction-C-dnaa-knob-deepening
  kind: simulation
  status: planned
  base_model: baseline
  duration_steps: "dnaA init-probability sweep 1x..4x on the glucose cache"
  seeds: "set when the reviewer selects this candidate"
  metrics: [oriC, critical mass per oriC, replication-initiation timing]
  pass_fail_tests: [reviewer-selects-next-direction]
- name: direction-D-graded-translation-dose-response
  kind: simulation
  status: planned
  base_model: baseline
  duration_steps: "basal elongation-rate sweep 1.0x..0.4x on the glucose cache"
  seeds: "set when the reviewer selects this candidate"
  metrics: [doubling time, tRNA charging (to find where compensation breaks)]
  pass_fail_tests: [reviewer-selects-next-direction]

planned_runs:
- name: chosen-direction-run
  status: planned
  n_steps: "depends on the chosen direction (single-cache for B/C/D; one ParCa cache per condition for A)"
  details: "Runs ONLY after a reviewer selects one (or more) of the four candidate directions below; until then this study is intentionally un-run."

conditions:
  baseline:
    composite: ecoli_baseline
    # No direction committed — this is a reviewer-decision study. The four
    # candidate directions live in decisions_needed +
    # discovery_implications.followup_study_proposals, seeded from showcase-4.
  variants:
  # PROPOSED, not committed — the reviewer chooses among these four candidate
  # next-directions (seeded from the showcase-4 ranking). status: proposed.
  - name: A-growth-condition-panel
    role: proposed (uncommitted)
    status: proposed
    detail: "Deepen the strongest contrast (media-succinate): a carbon-source panel. FLAG: one full ParCa cache per condition (~2.5 min each). Agent-recommended."
  - name: B-ppgpp-synthesis-vs-regulation
    role: proposed (uncommitted)
    status: proposed
    detail: "Chase the surprise: a synthesis-off / regulation-off 2×2 to pin why ppGpp de-repressed (rose 1.86x). Single-cache. Agent-recommended."
  - name: C-dnaa-knob-deepening
    role: proposed (uncommitted)
    status: proposed
    detail: "Push the partial: sweep the dnaA init-probability 1x..4x to test whether a larger knob raises the oriC ceiling that 2x did not. Single-cache."
  - name: D-graded-translation-dose-response
    role: proposed (uncommitted)
    status: proposed
    detail: "Rescue the null: sweep the ribosome elongation rate over a wider range to find where the elong-down compensation breaks. Single-cache."
  model_settings: []

assumptions:
- text: |
    The showcase-4 5-variant sweep is complete and its ranking (media strongest,
    ppGpp-off most informative surprise, dnaA-2x partial, elong-down near-null)
    is the trusted basis for choosing the next direction.
  verified_in_v2ecoli: true

tests:
- name: reviewer-selects-next-direction
  classification: decision
  status: pending
  question: "Have reviewers selected which next direction to pursue, given the showcase-4 ranking?"
  measure:
    kind: reviewer_decision
    detail: |
      Placeholder decision gate. Resolves when a reviewer picks one (or more) of
      the four candidate directions (A growth-condition panel, B ppGpp
      synthesis-vs-regulation 2x2, C dnaA knob deepening, D graded translation
      dose-response). No quantitative pass/fail — the outcome is the chosen
      direction, which then becomes a committed follow-up study.
  pass_if:
    op: reviewer_selected_variant

discovery_implications:
  resolved_uncertainties: []
  remaining_uncertainties:
  - "Which direction to deepen is an OPEN reviewer choice; no direction is committed in this scaffold."
  - "elong-down's near-null leaves open where (if anywhere) a translation-rate cut starts to slow growth in v2ecoli — candidate D would resolve it."
  - "The ppGpp-off de-repression mechanism (rise, not collapse) is asserted but not decomposed — candidate B would confirm it."
  followup_study_proposals:
  - id: direction-growth-condition-panel
    title: "A — Growth-condition panel (deepen the strongest contrast)"
    study_type: condition-sweep
    source_trigger: showcase-4-strongest-contrast
    proposed_experiment: |
      Run a small panel of carbon sources (glucose / succinate / acetate /
      glycerol / +amino-acids), each with its own full ParCa cache, and chart the
      growth rate / central-carbon flux (Toya-r) / mass-composition response as a
      function of carbon source. Builds directly on media-succinate, the
      strongest showcase-4 contrast.
    expected_information_gain: high
    effort: high   # one full ParCa cache per condition (~2.5 min each)
    expert_gate_required: true
    recommended: true
  - id: direction-ppgpp-synthesis-vs-regulation
    title: "B — ppGpp synthesis vs regulation 2x2 (chase the surprise)"
    study_type: mechanism-probe
    source_trigger: showcase-4-counterintuitive-result
    proposed_experiment: |
      Separate ppGpp *synthesis* (RelA/SpoT) from the *regulatory* coupling and
      run a synthesis-off / regulation-off 2x2 on the existing glucose cache to
      confirm that the showcase-4 ppGpp rise is de-repression. Reads the ppGpp
      pool + growth rate per quadrant.
    expected_information_gain: high
    effort: medium   # single-cache, no extra ParCa build
    expert_gate_required: true
    recommended: true
  - id: direction-dnaa-knob-deepening
    title: "C — dnaA init-probability sweep (push the partial)"
    study_type: parameter-sweep
    source_trigger: showcase-4-partial-contrast
    proposed_experiment: |
      Sweep the dnaA (TU00259[c]) transcription-init probability across 1x..4x on
      the existing glucose cache and connect to the dnaa-replication
      investigation's replication-initiation readouts (oriC, critical mass per
      oriC). Tests whether a larger knob raises the oriC ceiling that 2x did not.
    expected_information_gain: medium
    effort: low   # single-cache
    expert_gate_required: true
  - id: direction-graded-translation-dose-response
    title: "D — graded translation dose-response (rescue the null)"
    study_type: parameter-sweep
    source_trigger: showcase-4-near-null-result
    proposed_experiment: |
      Sweep the ribosome basal elongation rate across a wider range
      (e.g. 1.0x..0.4x of 22 aa/s) on the existing glucose cache to find where
      the steady-state-charging compensation breaks and growth actually slows —
      resolving why the 0.7x elong-down point was a near-null in showcase-4.
    expected_information_gain: medium
    effort: low   # single-cache
    expert_gate_required: true

pipeline_gate:
  prerequisites:
  - showcase-4-variant-comparison
  enables: []
  gate_status: pending

runs: []

visualizations:
# PLANNED mockup — reviewer-decision study with no run yet. Describes what the
# chosen direction WOULD produce once a reviewer selects a candidate.
- name: PLANNED — chosen next-direction response (mockup)
  status: planned
  address: "planned:chosen-next-direction-response"   # no rendered chart yet — decision study
  config:
    title: "PLANNED: chosen direction's response curve — carbon-source panel / ppGpp 2×2 / dnaA sweep / translation dose-response"
    caption: >-
      Placeholder for the chosen-direction figure. Once a reviewer selects one
      (or more) of the four candidates (A growth-condition panel / B ppGpp
      synthesis-vs-regulation 2×2 / C dnaA knob sweep / D graded translation
      dose-response), this becomes the corresponding response chart on the
      reviewer's chosen readout. No data yet — the study is intentionally un-run.
  chart: planned-mockup

