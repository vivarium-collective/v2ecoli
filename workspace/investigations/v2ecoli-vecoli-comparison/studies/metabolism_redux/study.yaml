confidence: Investigating
findings:
- id: metabolism_redux-perf-blocker
  kind: methodological
  status: blocked
  statement: BLOCKED on a runtime issue, not wiring. Both engines correctly swap FBA
    Metabolism -> MetabolismRedux (vEcoli native via EcoliSim; v2ecoli via convert+inject
    bridge). The v2-side run is fast on tick 1 (~1.3 s) but degrades to 25-45 s/tick
    from tick 2 on, making even a 300-step run impractical (~a day for a full 2-gen
    run).
  evidence:
    from_card: standard
    observed: 'CORRECTED root cause (supersedes the earlier ODE-fallback theory):
      it is a process-bigraph STEP-CASCADE NON-CONVERGENCE, not an ODE/units/allocator
      problem. Measured: ~170,000+ Composite.apply_updates rounds per tick under redux.
      A FIXED GROUP of ~8 steps re-runs together in equal counts (~3,750x/tick, climbing):
      ecoli-equilibrium, ecoli-two-component-system, ecoli-rna-maturation, unique_update_1..4,
      media_update. The re-trigger driver is the unique-molecule /update stores (unique/active_RNAP/update,
      .../RNA/update, .../active_ribosome/update, chromosome/replisome/oriC/promoter)
      flipping every round. Each round is fast (~0 s); the COUNT is the 25-45 s. Baseline
      (no redux): equilibrium runs ~1x/tick, the cascade converges, done. Redux tick-2+:
      the run_steps recursion (run_steps -> apply_updates -> cycle_step_state re-arms
      triggered steps -> run_steps) never reaches a fixed point. EVERYTHING EARLIER
      WAS A DOWNSTREAM SYMPTOM of those ~170k tiny rounds — the "LSODA stiffness"
      was 170k tiny solves, the "cProfile plum/schema" was 170k tiny dispatches. RULED
      OUT (all, with evidence): ODE stiffness; JIT (cost is step-count not RHS speed);
      horizon cap (breaks equilibrium: "Negative values at equilibrium steady state");
      bridge units (CORRECT — cell_mass=1269 fg, boundary.external[GLC]=11.1 mM, counts_to_molar
      sane); output_ports; negative bulk counts (clamp fired 0x); the two-component
      no-allocator fallback; PARTITIONING (would not fix a cascade loop — a partition
      design was drafted then abandoned); the redux flow reorder (removing it did
      NOT help); zeroing Equilibrium.update bulk output (did NOT break the loop —
      eq still participates via being triggered). => the metabolism_redux PROCESS
      SWAP itself perturbs the step trigger/deriver network so the reconciliation
      cascade does not terminate. NOT YET PINNED: the exact closing trigger edge (which
      step''s write re-arms which via the unique /update stores). Fix paths: (true)
      trace the closing edge — a unique_update deriver / listener that redux''s presence
      keeps re-arming; (pragmatic unblock) a max-iteration cap in process_bigraph.composite.run_steps
      to bound the cascade (risks slightly-incomplete reconciliation). Full evidence
      chain in project memory project_metabolism_redux_injection_ode_stiffness.'
