schema_version: 3
name: flagella-01-overexpression-baseline
title: "Aim 2 motivation — uncontrolled flagellar overexpression & seam neutrality"
description: |
  Establishes Maya's Specific Aim 2 motivation in v2ecoli: with no transcriptional
  regulation, the whole-cell model overproduces flagellar components relative to
  biological levels (her prelim reports ~48 flagella). This study characterizes the
  unregulated baseline AND proves that adding the flagella_regulation infrastructure
  is a true no-op when the feature is OFF — so any change downstream is attributable
  to the regulatory cascade, not to the port itself.
topic: regulation
tags: [flagella, baseline, overexpression, seam-neutrality, feature-off, aim2, ported-from-vecoli-biofilm]
created: '2026-06-20'

status: in_progress
phase: Evaluate

design_status: complete
implementation_status: complete
simulation_status: ran             # feature-off neutrality verified during the port
evaluation_status: partial
gate_status: pending
expert_review_status: not_requested

visualizations:
- address: image:charts/01_overexpression_and_neutrality.svg
  chart: charts/01_overexpression_and_neutrality.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies.py
  description: |
    Left — unregulated flagellar components (complete flagella CPLX0-7452 + the
    motor/HBB FLAGELLAR-MOTOR-COMPLEX) over a 600 s run with regulation OFF.
    Right — complete-flagella count, regulation OFF vs ON. Feature-off
    init_prob_override stays 0 throughout (seam neutral); the cascade trims
    flagella modestly within one generation (35 -> 32), the effect compounding
    across generations.
- address: image:charts/02_multigen_flagella_and_mass.svg
  chart: charts/02_multigen_flagella_and_mass.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_multigen.py --generations 2
  description: |
    TWO full cell generations (generations shaded; division = dashed line). Left —
    complete flagella per generation: regulation ON sits below OFF at every
    generation (OFF g1=53, g2=44; ON g1=44, g2=34), so the cascade trims
    overexpression and the ~9-10 flagella gap persists across divisions. Right —
    dry-mass sawtooth (growth then division at the ~700 fg threshold).
- address: image:charts/03_reduction_OFF_vs_ON.svg
  chart: charts/03_reduction_OFF_vs_ON.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/studies/flagella-01-overexpression-baseline/make_reduction_bar.py
  description: |
    Headline grouped bar — complete flagella (CPLX0-7452) per generation, regulation
    OFF vs ON, from the 2-generation lineages. Makes the per-generation reduction
    undeniable: -9 at gen 1 (53->44) and -10 at gen 2 (44->34).

baseline:
- name: wcm-unregulated
  composite: v2ecoli.composites.baseline.baseline
  params:
    seed: 0
    cache_dir: out/cache
    features: []                   # regulation OFF — the unregulated baseline

purpose:
  question: |
    (a) How over-expressed are flagellar components in the unregulated WCM baseline?
    (b) Is the flagella_regulation port byte-neutral when the feature is off?
  mechanism: |
    With features=[] the two flagella Steps are not wired and the promoter
    init_prob_override field stays 0.0 everywhere, so transcript_initiation's
    substitution (guarded on > 0) never fires — identical initiation probabilities
    to pre-port main. Flagellar component counts (CPLX0-7452, flagellin, motor) are
    read straight from the unregulated baseline for comparison against the regulated
    runs in flagella-02 / flagella-03.
  expected_outcome: |
    init_prob_override == 0 for every promoter across the run; cell grows/divides
    normally; flagellar component counts sit at the (over-expressed) unregulated
    level that the cascade is intended to bring down.

behavior_tests:
  - id: feature-off-neutral
    statement: |
      With flagella_regulation OFF, promoters.init_prob_override is 0 for every
      promoter across a 30 s run and the cell grows normally.
    status: passing      # verified during the port (0 nonzero overrides after 30 s)
  - id: parity-attributable-to-data-not-code
    statement: |
      The feature-off signature on the rebuilt cache matches the shipped-fixture
      signature (control), confirming the ~1% delta vs the committed golden is
      pre-existing golden drift, not this port.
    status: passing      # verified via the shipped-fixture control
  - id: regulation-reduces-flagella-across-generations
    statement: |
      Across two cell generations, the flagella_regulation lineage carries fewer
      complete flagella (CPLX0-7452) than the unregulated lineage at each generation
      — the cascade reduces overexpression and the gap persists through division.
    status: contradicted   # holds on fast cache (OFF 53/44 vs ON 44/34) but REVERSES
                           # on the calibrated full cache (single-seed: ON 61/50 vs
                           # OFF 46/43). Multi-seed full-cache ensemble running to
                           # settle the direction; treat the reduction as unconfirmed.
    caveat: |
      The 03_reduction_OFF_vs_ON.svg bar uses fast-mode numbers and does not survive
      full-mode calibration. See the investigation verdict's calibration caveat.

notes: |
  Maya's prelim (Aim 2 rationale): "current expression of flagella is exceedingly
  high compared to biological levels and manual adjustments like multipliers,
  adjustments to stoichiometry, and overrides are a plausible approach to minimize
  expression ... however, manual tuning is not a biologically and mechanistically
  sufficient solution." This study is the no-regulation reference the cascade
  studies are measured against.
