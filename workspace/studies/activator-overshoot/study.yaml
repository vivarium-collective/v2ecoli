limitations:
- Only TFs whose binding sites are observable in bound_TF_coordinates can be paired with a pPromoterBound
  value; the unpairable count is reported but those TFs contribute nothing.
- Runtime occupancy is per-TU, inheriting the per-promoter limitation identified in pc00010-repression-arithmetic.
- All runtime occupancy is measured in a stalling lineage, so it may not represent healthy growth.
- If H3 holds, the fold-change comparison is wrong for activators and this study's premise -- inherited
  from foldchange-to-delta-fidelity -- is itself the error.
- Only LexA's occupancy is directly observable at runtime, so axis 1 rests on one TF; the other 22 are
  assumed to share the pattern, not shown to.
- The correction uses each TF's active/inactive pair as stored. Whether those occupancies are themselves
  correct is not examined here.
- The 2.13x residual is isolated but not explained; this study bounds it rather than identifying it.
claim: The fold change is measured across a partial TF occupancy swing, and correcting for that explains
  about half the activator over-shoot (4.77 -> 2.13) while leaving the already-faithful repressors untouched.
conclusion: 'Partial, and the partiality is the result rather than a shortfall.

  The mechanism is real: pPromoterBound stores an active/inactive occupancy pair per TF, the fit calibrates
  delta against the expression ratio across THAT swing, and comparing the full-swing 1 + delta/alpha to
  2**log2FC overstates it whenever the swing is partial. Correcting for it moves activators from 4.7727
  to 2.1314 -- 52% of the over-shoot in log space.

  Two pre-registered checks make that credible rather than tuned. The 160 entries whose TFs swing a full
  0->1 are unchanged to four decimals, which is what the arithmetic demands. And the free repressors,
  already at 0.9959, move only to 1.0923 -- a correction invented to fix activators had no reason to spare
  them.

  But it does not close: 2.13x remains, outside the band, so a further activator-specific defect is live.
  And one recorded prediction failed -- boundary repressors do NOT stay pinned at 0 under the correction,
  moving to 0.5476, because the constraint pins delta/alpha rather than the swing-corrected ratio.

  Combined with deltav-conversion-diagnosis, ParCa''s encoding defect now has two identified contributors
  -- an active probability-validity constraint for repressors and a partial-swing comparison for activators
  -- and one unexplained residual.'
confidence: Investigating
candidate_correction:
  recorded_at: '2026-09-04T13:00:00Z'
  recorded_before_measuring: true
  statement: 'The fold change is measured across the TF''s ACTIVE-vs-INACTIVE occupancy swing, not a 0->1
    swing, so 1 + delta/alpha is not the quantity 2**log2FC describes.

    pPromoterBound stores an occupancy per TF per condition, including a ''<TF>__active'' and ''<TF>__inactive''
    pair. LexA runs 0.0 -> 0.6615; CPLX-125 runs 0.500 -> 0.945. The fit therefore chooses delta so that
    the expression ratio ACROSS THAT SWING matches the measurement, whereas foldchange-to-delta-fidelity
    compared the FULL-swing ratio 1 + delta/alpha against it. A partial swing means the full-swing effect
    is more extreme than the measured fold change, which inflates activators above 1 and drives repressors
    further below it -- the observed bidirectional signature.'
  formula: "With r = delta/alpha, p_a = pPromoterBound[TF__active][TF] and p_i = pPromoterBound[TF__inactive][TF],\
    \ the fit's own predicted fold change is\n    FC_pred = (1 + r * p_a) / (1 + r * p_i)\nand the corrected\
    \ fidelity ratio to be graded is FC_pred / 2**log2FC, replacing the uncorrected (1 + r) / 2**log2FC.\
    \ Entries whose TF swings a full 0->1 are unchanged by this correction (p_a=1, p_i=0 gives FC_pred\
    \ = 1 + r), which is a useful internal check."
  predictions:
  - Activators move from a median ratio of 4.7727 toward 1, because their full-swing over-statement is
    removed.
  - 'FREE repressors, already at 0.9959, should barely move: their TFs'' swings must be near-complete
    or the uncorrected comparison would not already have been faithful. If they move a lot, the correction
    is wrong.'
  - Boundary repressors stay at ~0 regardless -- they are pinned by the constraint, not by the swing,
    so this correction cannot and should not rescue them.
  - TFs with p_a=1 and p_i=0 show no change at all; that subgroup is the internal control on the arithmetic.
  note: Recorded per req-2 BEFORE computing any corrected value.
