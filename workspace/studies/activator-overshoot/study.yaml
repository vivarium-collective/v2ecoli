schema_version: 4
name: activator-overshoot
title: Why activated genes get too much
investigation: transcription-rewiring
study_type: fit_validation
phase: Decide
created: '2026-09-04'
status: complete
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: failed
expert_review_status: not_requested
question: 'deltav-conversion-diagnosis explained the repressor half of ParCa''s encoding defect as an
  active constraint, and refuted my prediction that the same mechanism covers activators: ZERO of 343
  activating entries sit at any boundary, yet they are encoded 4.77x too strongly -- 60.8% of the regulatory
  network. Does the gap between the occupancy ParCa ASSUMED when fitting (pPromoterBound, median 0.444)
  and the occupancy the simulation PRODUCES (LexA: 0.963-1.000 against an assumed 0.5192) explain it?'
units_and_time:
  tick: not applicable for the fit-side analysis; runtime occupancy is read per simulated second.
  quantities:
    pPromoterBound: probability a TF is bound in a given condition (dimensionless)
    occupancy: measured fraction of timesteps a TF is bound at a promoter coordinate
    retained fraction: 1 + delta/alpha
behavior_tests:
- name: fit-occupancy-differs-from-runtime
  classification: primary
  gate_class: acceptance_criterion
  question: Does the occupancy the fit assumed match the occupancy the simulation produces?
  description: 'The ratio of runtime TF occupancy to the fit''s pPromoterBound[''basal''] value lies in
    [1.5, 4.5] for the median measurable TF -- runtime exceeding the fit''s assumption by roughly the
    factor LexA shows.


    The premise of the whole study, and it is stated as a DISAGREEMENT so that a PASS here means the defect
    exists. ParCa fits alpha and delta with each TF at an assumed basal binding probability (median 0.444
    across the 23 TFs); the runtime then applies delta at whatever occupancy the simulation actually produces.
    For LexA the fit assumed 0.5192 while the simulation measured 0.963 rising to 1.000, so the delta
    is applied roughly twice as hard as the fit intended. If that gap is general, alpha is calibrated
    for one world and delta applied in another.


    Threshold provenance: theory. The standing agreement band, inverted -- agreement would REFUTE the
    study''s premise.'
  measure:
    kind: derived
    path: median over measurable TFs of runtime occupancy divided by the fit's pPromoterBound basal value,
      for the activator overshoot
    detail: median runtime/assumed occupancy ratio across TFs whose binding is observable in bound_TF_coordinates.
  pass_if:
    low: 1.5
    high: 4.5
    provenance:
      kind: theory
      note: Bounded rather than left as '> 1.5'. The claim is not merely that the two disagree but that
        runtime occupancy EXCEEDS the fit's assumption by a factor consistent with what LexA shows (0.963/0.5192
        = 1.855), which is what could inflate an activator's delta. A ratio above 4.5 would mean something
        other than a calibration offset -- e.g. occupancy saturating for unrelated reasons -- and should
        not count as confirming this mechanism. Spans 3x, the discrimination ceiling.
  status: passed
  result: PASS
  measured_value: 1.914
  evaluated_by: agent
- name: occupancy-correction-explains-the-overshoot
  classification: primary
  gate_class: acceptance_criterion
  question: Does accounting for assumed-vs-actual occupancy bring activators into agreement?
  description: 'Recomputing the expected retained fraction as the fit intended it -- alpha already containing
    pPromoterBound worth of TF effect, with delta applied only for the OCCUPANCY INCREMENT -- moves the
    activator median ratio into [0.67, 1.5] from 4.7727.


    The discriminating axis. If alpha is calibrated at partial occupancy, then comparing delta/alpha against
    2**log2FC double-counts the effect already baked into alpha, and activators would appear inflated
    by roughly the amount of activation the basal condition already carried. This predicts the over-shoot
    without any boundary involvement, which is required since ZERO activating entries are at a constraint.


    Threshold provenance: theory. The band foldchange-to-delta-fidelity used to judge fidelity, so corrected
    and uncorrected read on one scale.'
  measure:
    kind: derived
    path: activator median implied/expected retained fraction after correcting for the fit's assumed basal
      occupancy
    detail: median ratio across the 343 activating entries, occupancy-corrected.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Identical to the band the uncorrected activators failed at 4.7727, so the comparison is direct.
  status: failed
  result: FAIL
  measured_value: 2.1314
  evaluated_by: agent
- name: correction-preserves-repressor-fidelity
  classification: primary
  gate_class: acceptance_criterion
  question: Does the same correction leave the already-faithful repressors alone?
  description: 'Applying the identical occupancy correction, the FREE (non-boundary) repressors keep a
    median ratio within [0.67, 1.5], having measured 0.9959 uncorrected.


    The discriminating control, and a strict one. deltav-conversion-diagnosis showed free repressors are
    already essentially perfect at 0.9959. A correction that fixes activators by breaking them is not
    a correction, it is a refit. This axis is what stops an occupancy adjustment being tuned until the
    activator number looks right.


    Threshold provenance: theory. The same band, applied to a group already inside it.'
  measure:
    kind: derived
    path: free-repressor median implied/expected retained fraction after the same occupancy correction
    detail: median ratio across the 175 non-boundary repressing entries, occupancy-corrected.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided; the correction can break these by over- or under-shooting and both would disqualify
        it.
  status: passed
  control: negative
  result: PASS
  measured_value: 1.0923
  evaluated_by: agent
- name: overshoot-is-not-boundary-related
  classification: diagnostic
  gate_class: acceptance_criterion
  question: Is any part of the activator over-shoot a constraint artefact after all?
  description: 'Zero activating entries sit at the upper constraint Z@R <= 1.


    Confirms that deltav-conversion-diagnosis''s mechanism genuinely does not reach activators, so this
    study is not re-explaining a solved problem. Diagnostic because it discriminates no hypothesis here
    -- it fences off territory already covered.


    Threshold provenance: definitional.'
  measure:
    kind: derived
    path: count of activating delta entries with all-TFs-bound probability at the upper constraint, for
      the overshoot
    detail: number of the 343 activating entries with Z@R >= 1 - 1e-6.
  pass_if:
    op: <=
    value: 0
    provenance:
      kind: theory
      note: Definitional; measured at 0 in the sibling study.
  status: passed
  result: PASS
  measured_value: 0
  evaluated_by: agent
- name: activator-overshoot-magnitude
  classification: supporting
  gate_class: regression_pin
  question: Does the baseline over-shoot still measure as recorded?
  description: 'The uncorrected activator median ratio stays within a factor of 2 of the recorded 4.7727.


    POST-HOC: measured in foldchange-to-delta-fidelity. A drift pin on the quantity this study exists
    to explain.'
  measure:
    kind: derived
    path: uncorrected activator median implied/expected retained fraction for the overshoot
    detail: median ratio across the 343 activating entries, uncorrected.
  pass_if:
    op: <=
    value: 9.55
    provenance:
      kind: post_hoc
      note: 2x the 4.7727 measured previously; pin only.
  status: passed
  result: PASS
  measured_value: 4.7727
  evaluated_by: agent
