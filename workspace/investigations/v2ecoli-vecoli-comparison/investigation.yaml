schema_version: 4
name: v2ecoli-vecoli-comparison
title: v2ecoli ↔ vEcoli comparison
question: Does v2ecoli reproduce vEcoli across nutrient conditions?
comparison:
  v2ecoli:
    repo: https://github.com/vivarium-collective/v2ecoli
    commit: ''
  vecoli:
    repo: https://github.com/CovertLab/vEcoli
    commit: ''
  vecoli_dir_env: V2E_VECOLI_DIR
  v2_cache: out/cache_full
  ve_cache: out/compare_harness/vecoli_parca
  defaults:
    cards:
    - config
    - standard
    - statistical
    seeds: 4
studies:
- parca
- basal
- metabolism_redux
- with_aa
- succinate
- no_oxygen
- acetate
- statistical
executive:
  what_is_this: |
    Does v2ecoli reproduce vEcoli across nutrient conditions? Each study runs both engines from matched ParCa initial states and grades v2ecoli against a live vEcoli reference on the standard observables -- cell, dry, protein and RNA mass, and growth rate. GOLD STANDARD: grading gates on the multi-seed STATISTICAL card (Welch t-test over 4 seeds) plus the ParCa t=0 card; the single-seed 'standard' card is illustrative only. The old single-seed 'refuted'/'drift' verdicts were retired as OVERSTATED (one seed can't separate a real divergence from ~8-9% seed noise) -- but re-grading on 4 seeds did NOT clear the comparison. It LOCALIZED a real divergence.

    RESULT (4-seed, gen-1, all 5 conditions graded): basal reproduces cleanly (within_tol -- this is the condition ParCa was fit to). Off-basal, v2ecoli's growth-rate + RNA(ribosome) response to nutrient quality is COMPRESSED toward the basal setpoint, MONOTONIC in doubling time (distance from basal): with_aa (dt 25min, rich AA) v2 grows ~-16% SLOWER with ~-21% LESS RNA (both p<0.01, sign REVERSED); basal (dt 44) clean; succinate (dt 82) ~+18% faster (borderline p=0.06); no_oxygen (dt 100) ~+14% faster (borderline p=0.08); acetate (dt 136, poorest carbon) ~+40% FASTER (p=0.049, significant). v2 over-responds when slower-than-basal and under-responds on rich AA. Protein mass reproduces throughout. This bidirectional, RNA-centered, basal-anchored pattern is a real nutrient-responsive growth-law divergence, not seed noise.

    ROOT-CAUSE TRACE (static diff, no fix in coupling): the ppGpp->rRNA-synthesis and ppGpp->ribosome-elongation coupling CODE is numerically identical between engines; the per-condition ppGpp setpoint get_ppGpp_conc(doubling_time), doubling-time map, and aa-supply fit are identical / within ~1.5%. So the divergence is NOT a coupling port bug and NOT the deterministic ParCa setpoint. It traces to the stochastic low-copy INITIAL ppGpp machinery (SpoT/RelA) -- the previously-proven SpoT-sampling artifact (v2 initial SpoT ~12 vs 1; matched-SpoT seeds track within 2%) -- condition-dependently amplified through the aa-charging->ppGpp->growth feedback, plus a secondary ~+15% offset in v2's cached rRNA-from-ppGpp expression calibration (renormalized at basal). FIX is methodological (match the ppGpp-machinery initial state across engines / more seeds), not a coupling-equation patch. All 5 conditions are now re-graded on the gold standard. The MetabolismRedux swap remains investigated-but-blocked on a process-bigraph step-cascade runtime issue (not a science mismatch).

