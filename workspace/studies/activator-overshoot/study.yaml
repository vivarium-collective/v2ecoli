biological_summary: 'The model learns each regulator''s strength by comparing a gene''s expression when
  the regulator is active against when it is inactive. But ''active'' rarely means fully bound: LexA is
  fitted as going from 0% to 66% occupied between those two states, and another regulator from 50% to
  95%. The strength the model stores is the effect of going all the way from 0% to 100%, which is necessarily
  larger than the effect actually measured across a partial change.


  Comparing the two directly therefore makes every regulator look stronger than its measurement, and for
  genes being turned UP that shows as expression roughly five-fold too high. Accounting for how far each
  regulator actually swings removes about half of that discrepancy.


  Two checks say this is a real correction rather than a convenient one. Regulators that genuinely do
  swing from fully unbound to fully bound are left completely untouched by it, exactly as the arithmetic
  requires. And repressed genes, which were already encoded accurately, stay accurate. Half the problem
  remains unexplained, and that half is now the clearest open question left in this investigation.'
conclusion_verdicts:
- claim: The fit assumes an occupancy the runtime does not reproduce
  verdict: supported
  basis: LexA fitted at 0.5192 basal, measured at 0.988-1.000 (ratio 1.91).
- claim: Partial-swing comparison explains the activator over-shoot (H1)
  verdict: partial
  basis: 4.7727 -> 2.1314, 52% of the log distance, but outside the band.
- claim: A further activator-specific defect exists (H2)
  verdict: supported
  basis: 2.13x residual after a correction validated by two internal controls.
- claim: The comparison target is wrong for activators (H3)
  verdict: refuted
  basis: Free repressors stay faithful under the same correction (1.0923), so the target is not generally
    wrong.
discovery_implications:
- Any future comparison of a fitted delta against a fold change must use the TF's active/inactive occupancy
  pair. Comparing the full-swing ratio is wrong by construction whenever the swing is partial, and foldchange-to-delta-fidelity's
  headline 2.006 inherits that error.
- A 2.13x activator residual is the clearest remaining unexplained quantity in this investigation, now
  isolated from both the constraint mechanism and the swing correction.
- The correction lifts boundary repressors from 0.0000 to 0.5476, so the constraint artefact and the swing
  effect are not independent -- a fix for one changes the apparent size of the other, and they should
  be evaluated together rather than sequentially.
- Only one TF's occupancy is directly observable at runtime, so the fit-versus-runtime occupancy gap is
  established for LexA alone and assumed, not measured, for the other 22.
