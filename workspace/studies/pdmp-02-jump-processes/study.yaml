report:
  confidence: design-stage
  evidence_quality: scaffold
  conclusion: "Predicted. Replacing scaled-Poisson stochastics with continuous-time jumps from measured kinetic constants (Anderson-Darling Exp(1) verified), plus a first-passage division trigger, will yield a PDMP whose trajectory ensembles match v2ecoli baseline summaries within W₂ tolerance."
  main_insight: "The PDMP contract is the key test for stochastic correctness: between-jump deterministic ODE flow + Exp(1) cumulative-hazard distribution. An A-D test on ≥10⁴ inter-event intervals catches propensity bugs."
  caveat: "τ-leaping trades unbiasedness for compute: the leap condition (max Δλ/λ < 0.03) is monitored every step and the process switches to exact SSA when violated >0.1% of the time. Provenance: the per-sprint σ/μ/W2 table (base_mu/base_sd/pdmp_mu/pdmp_sd/w2_cm, incl. the cell_mass W2 progression 9.73 → 15.35 → 49.46) is hand-entered in scripts/phase2_progress_report.py (\"Hardcoded here\"), transcribed not recomputed at render. Report figures cover only the artifacts committed in this checkout; the multi-gen inheritance / Gillespie / waiting-time figures regenerate from a re-run of the phase0-multigen and jump-process pilots."
  key_metrics:
    - label: Anderson-Darling Exp(1) per jump
      status: stub
      value: "α=0.05"
    - label: OU first-passage analytical CDF
      status: stub
      value: KS < 0.02
    - label: "trajectory W₂ vs baseline"
      status: stub
      value: "N≥200"
    - label: Markov property (bit-identical)
      status: stub
