  question: Does v2ecoli reproduce vEcoli on with_aa (composition card)?
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      media: minimal_plus_amino_acids
  model_settings: []
confidence: Accepted
findings:
- id: with_aa-vs-vecoli-result
  kind: computational
  status: confirms
  statement: 'v2ecoli reproduces vEcoli on with_aa (4-seed gen-1, Welch t-test): all
    five observables (cell, dry, protein, RNA mass, growth rate) are within tolerance.'
  evidence:
    from_card: statistical
    observed: growth +1.7% (p=0.53); RNA +0.4% (p=0.89); cell +0.9%; dry +0.9%; protein
      -0.0% -- all within_tol.
inputs:
- artifact: sim_data
  from: parca
  into: cache_dir
pipeline_gate:
  enables: []
