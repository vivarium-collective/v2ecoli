- name: "Phase 4 sprint 5 \u2014 real WCM baseline + illustrative N-scaling projection"
  url: /reports/figures/pdmp-04/wcm_baseline_projection.html
  description: "Real WCM benchmark (measured): pbg sequential at N=10\xB3 \xD7 30\
