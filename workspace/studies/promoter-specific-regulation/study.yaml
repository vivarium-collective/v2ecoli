limitations:
- "CORRECTION 2026-09-05, NOT YET ACTED ON: the limitation below -- 'only 9 of the model's 23 TFs\
  \ have positioned sites in the export' -- does not reproduce. The correct figure is 23 of 23: EVERY\
  \ transcription factor in the model has positioned binding sites in this export. The 9 is a name-resolution\
  \ artefact with three independent causes, each of which silently drops TFs:\n  (1) the Site column\
  \ is not uniformly '<TF> DNA-binding-site ...' -- CRP is listed as 'CRP-cyclic-AMP DNA binding\
  \ transcriptional dual regulator' (309 positioned sites) and ArcA as 'ArcA-PAsp54' (191);\n  (2)\
  \ the id columns of transcription_factors.tsv hold COMMA-SEPARATED lists, so 'CPLX-172, PC00003'\
  \ does not match CPLX-172 -- this alone loses araC, argP and tyrR;\n  (3) the export names some\
  \ TFs by assembled complex rather than subunit gene, so ihfA is 'IHF' (105 positioned) and hns\
  \ is 'H-NS' (67 positioned).\nReproduce with analyses/tf_name_coverage.py. Both copies of transcription_factors.tsv\
  \ (reconstruction/ecoli/flat and ecoli_sources/data/flat) are byte-identical, and there is no transcription_factors_added.tsv\
  \ in either tree -- checked because the _added/_removed pattern applies to transcription_units\
  \ but not to transcription factors.\nRESOLVED 2026-09-05 by re-measurement (analyses/attribution_rule.py):\
  \ the gate verdict STANDS, but its basis was wrong. Correcting name resolution more than doubles\
  \ retention at a tight window (0.1049 -> 0.2353 at 50 bp), so the defect was material -- but the\
  \ axis still fails at every defensible window, reaching only 0.6409 at 5 kb against a 0.65 floor.\
  \ Because coverage is complete, the stripped edges are not missing data: they are assignments with\
  \ no operator for that TF near the promoter. The study's first reading -- that the model's assignments\
  \ are largely unsupported -- is the one the evidence now favours, and the licence argument, which\
  \ rested on incomplete coverage, does not hold."
- Only 9 of the model's 23 TFs have positioned sites in the export, so 14 -- including crp, arcA
  and hns -- keep their cistron-content assignment. This is a PARTIAL fix by construction, and the
  network it produces is a hybrid of two attribution schemes.
- The export gives site positions but no mechanism, so activation by looping or action on an upstream
  promoter would be misassigned. Marked a high-risk assumption.
- Remapping without refitting leaves alphas calibrated for the old attribution. Adequate to test
  the mechanism, not shippable.
- 'RESOLVED 2026-09-05. This limitation read: ''The rpsUp3-to-TU00435 identification underpinning
  the whole study is an inference from a site-name offset (0.5 bp agreement), not a declared mapping.
  The outstanding Pathway Tools licence would supply regulation.dat and settle it directly.'' Pathway
  Tools 30.0 with EcoCyc 30.0 is now installed and the flatfiles were generated with (create-flat-files-for-current-kb).
  regulation.dat carries exactly ONE LexA transcription-factor-binding record at this locus, REG0-5384:
  REGULATOR PC00010, REGULATED-ENTITY PM00583, ASSOCIATED-BINDING-SITE BS00652. In dnabindsites.dat
  BS00652 has ABS-CENTER-POS 3210738.5 and COMPONENT-OF TU00435. That is a DECLARED mapping in EcoCyc''s
  own vocabulary -- the same TU identifiers the model uses -- not an offset inference, and it names
  TU00435, not TU00352. The study''s central premise is confirmed at the source.'
- 'Even a full rescue would show promoter-specific attribution is SUFFICIENT here, not that the other
  three defects are harmless: the constraint boundary, the dedup and the 2.13x activator residual
  all remain.'
- Phase B was not run because the disruption control failed, so this study says nothing about whether
  removing the LexA edge would rescue the lineage. That remains untested.
claim: The promoter-specific rule removes the LexA edge that silences dnaG, exactly as predicted
  -- but strips 89.5% of the adjudicated network, so it cannot be applied generally from this data.
conclusion: 'Phase A settles the approach without a simulation, and the answer is a qualified no.

  The rule works where it was aimed: applied uniformly, with no special-casing and stated in full
  beforehand, it removes the LexA edge on TU00352 -- the prediction recorded before running -- and
  adjudicates 93% of the edges it can reach.

  But the disruption control FAILS at 0.1049 against a band of [0.65, 1.0]: it strips 89.5% of adjudicated
  edges. That is a different model, not a correction, and any Phase B rescue would have been uninterpretable.
  Phase B is not run.

  The cause is diagnosed and is not the tolerance -- distances are bimodal, p10 = 0.5 bp against
  p50 = 14376 bp, and loosening the window a hundredfold barely moves retention. Two readings survive:
  the model''s assignments are largely unsupported, or the export is incomplete and the rule strips
  real regulation where a site is missing. The bimodality and the coverage both favour incompleteness,
  and this file cannot settle it. Presenting the 89.5% as evidence against the model would be the
  wrong conclusion from an absence.

  dnaG is unaffected by that ambiguity, because its evidence is a PRESENT site matching TU00435 to
  0.5 bp rather than a missing one. So a TARGETED correction at this locus is supported by the data;
  a network-wide one is not, and needs the complete regulation table the outstanding Pathway Tools
  licence would provide.'
confidence: Refuted
attribution_rule:
  recorded_at: '2026-09-04T20:15:00Z'
  recorded_before_applying: true
  rule: '1. PARSE. For each binding site whose name states ''N bases upstream|downstream of <promoter>'',
    compute the promoter''s TSS as site_centre - N (downstream counted positive, upstream negative).
    site_centre = (Left+Right)/2.

    2. MATCH. An edge (TF, TU) is RETAINED iff that TF has at least one such site whose implied TSS
    lies within +/-5 bp of the TU''s start coordinate.

    3. REMOVE. An edge is REMOVED iff the TF has at least one positioned, offset-stating site somewhere
    in the genome but none matching that TU''s start.

    4. ABSTAIN. An edge is UNADJUDICATED and left EXACTLY as the model has it iff the TF has no positioned,
    offset-stating site at all. This covers the 14 of 23 model TFs absent from the export.

    5. UNIFORM. Applied to every covered TF with no special-casing of dnaG, LexA or the rpsU-dnaG-rpoD
    locus.'
  tolerance_justification: +/-5 bp accommodates the half-base offsets EcoCyc states (e.g. '4.5 bases
    downstream') and coordinate rounding between the two artefacts. It is a factor of four smaller
    than the 22.5 bp gap to the nearest non-matching TU at the dnaG locus, so it discriminates rather
    than absorbs.
  rejected_alternative: A COORDINATE-WINDOW rule was tried first and REJECTED, and the rejection
    is the honest part. The window was derived BLIND from the distribution of stated offsets across
    2576 sites with the dnaG locus EXCLUDED, giving a central-95% range of -297.8 to +117.2 bases,
    i.e. [-300, +120]. Applied to the dnaG locus that window RETAINS the LexA edge on TU00352, whose
    site sits at +83 -- unremarkable against a median offset of -49.8. So a positional window cannot
    discriminate here, and had I picked a plausible-looking narrow window instead of deriving one,
    I would have got the answer I wanted for the wrong reason. The name-based rule uses EcoCyc's
    own attribution instead of re-deriving it from coordinates.
  coverage: 59.2% of the 4356 sites state an offset from a named promoter (TSS computable); a further
    11.6% name a promoter without an offset (promoter known, TSS not, so unadjudicable under this
    rule); 29.2% name no promoter.
  predictions:
  - The LexA edge on TU00352 is REMOVED; TU00435 would match if it existed in the model, but the
    dedup discarded it, so dnaG's surviving TU ends with NO LexA edge and is unrepressed.
  - TU00434, at 22.5 bp from the implied TSS, does NOT match -- so even restoring it would not carry
    LexA under this rule. That contradicts what I assumed when scoping tu-dedup-promoter-collapse.
  - Most edges should be unchanged, because most TUs have a single promoter and the two attribution
    schemes then agree. If the rule removes most of the network it is disruptive and axis 3 fails.
