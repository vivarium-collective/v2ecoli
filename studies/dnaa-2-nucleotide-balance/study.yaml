          Within-cycle peaks >800 pre-division are the expected accumulate-then-divide
          behaviour; "in band" = the generation average (Rashmi 2026-06-04).
      dnaa-atp-fraction-in-band-0.2-0.5:
        result: PASS
        detail: |
          Generation-average in band (Rashmi 2026-06-04 criterion): all-gen avg 0.26,
          steady-gen avg (excl. gen-1 stabilizing transient) 0.222, both in [0.2,0.5].
          Per-gen averages trend low in later gens (k_r-tuning question for Haochen,
          not a blocker) but the generation average passes.

tests:
  - name: dnaa-atp-fraction-in-band-0.2-0.5
    classification: primary
    question: Is the DnaA-ATP fraction in [0.2, 0.5] on the generation average?
    measure:
      kind: generation_average
      path: MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
    pass_if:
      # Rashmi 2026-06-04: "initial generations might not strictly fall within band
      # because simulation is stabilizing — we can consider the generation average."
      op: generation_average_in_range
      low: 0.2
      high: 0.5
    status: passed   # seed-1 8-gen: generation-average in band (Rashmi's criterion)
    result: |
      PASS on the generation-average criterion (Rashmi 2026-06-04) against the
      directed seed-1 8-gen run (dnaa2-seed1-8gen). Per-generation average
      DnaA-ATP fraction: g1 0.527 (burned-in stabilizing) / g2 0.285 / g3 0.268 /
      g4 0.212 / g5 0.163 / g6 0.207 / g7 0.227 / g8 0.192. ALL-generation average
      = 0.26 (in [0.2,0.5]); steady-gen average (excl. the gen-1 transient) = 0.222
      (in band). The earlier strict per-generation reading (which flagged the gen-1
      stabilizing transient + a gen-5 dip) is superseded by the generation-average
      criterion Rashmi directed.
    notes: |
      The ~0.997 pin was the fast-equilibrium artefact, NOT a K_d / [ATP]:[ADP] /
      expected-fraction parameter error. Resolved by flagging the DnaA-ADP
      reaction integrate_dt=true (kinetic) while keeping it bidirectional. SECONDARY
      observation (not a failure): the per-gen average trends to the low end of the
      band in later gens (~0.16-0.23); a diagnosis (charts/dnaa2_fraction_vs_totaldnaa
      _diagnosis.png) shows this is a total-DnaA dependence, with the DnaA-ADP
      dissociation rate k_r as the lever — a future-tuning question for Haochen,
      not a blocker. CONFIRMED by a k_r sweep (mini, 2026-06-04): gen-2 DnaA-ATP
      fraction k_r=1e-7→0.314, 1e-6→0.314, 1e-5→0.382 — faster k_r does lift the
      fraction, but it takes ~100× (1e-7≈1e-6; only 1e-5 shifts it ~+0.07). All
      three stay in band, so the lever works; the exact k_r is Haochen's call.

  - name: total-dnaa-in-band-300-800
    classification: secondary
    question: Does total DnaA stay in [300, 800] on the generation average?
    measure:
      kind: generation_average
      path: PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c]
    pass_if:
      op: generation_average_in_range   # Rashmi 2026-06-04: use the generation average
      low: 300
      high: 800
    status: passed   # seed-1 8-gen: generation-average in band
    result: |
      PASS on the generation-average criterion (seed-1 8-gen): per-generation
      average total DnaA g1 185 (stabilizing) / g2 432 / g3 639 / g4 660 / g5 556 /
      g6 535 / g7 651 / g8 624 → all-generation average = 535 (in [300,800]).
      Within each cycle the pool accumulates then halves at division (peaks can
      exceed 800 pre-division — the expected accumulate-then-divide behaviour), so
      "in band" is the per-generation average, not every instantaneous tick.

  # Rashmi 2026-06-04 named FOUR behaviors that must be preserved; the two above
  # (DnaA counts in band, DnaA-ATP fraction in band) plus the two below (periodic
  # mass doubling, oriC = exactly one initiation per generation). All four are the
  # dnaa-2 acceptance set, to be evaluated on the seed-1 8-gen reproduction.
  - name: periodic-mass-doubling
    classification: primary
    question: Does cell mass show periodic doubling (sawtooth) across generations?
    measure:
      kind: per_generation_mass_ratio
      path: listeners.mass.cell_mass
    pass_if:
      op: periodic_doubling_every_generation
      tolerance: 0.15
    status: passed   # seed-1 8-gen: 8/8 divisions, periodic sawtooth
    result: |
      PASS on the directed seed-1 8-gen run (dnaa2-seed1-8gen): 8/8 generations
      divide, cell mass periodic sawtooth, τ 53-79 min.
  - name: oric-one-initiation-per-generation
    classification: primary
    question: Does oriC go 1→2 exactly once per generation (no re-initiation, never 4)?
    measure:
      kind: oric_initiations_per_generation
      path: listeners.replication_data.number_of_oric
    pass_if:
      op: exactly_one_initiation_per_generation   # oriC in {1,2}; one 1→2 transition per cycle
    status: passed   # seed-1 8-gen: oriC in {1,2} every gen, never 4
    result: |
      PASS on the directed seed-1 8-gen run: oriC stays in {1,2} in all 8 generations
      (one 1→2 initiation per cycle, never reaches 4, no re-initiation).

