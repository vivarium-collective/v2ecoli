conclusion: "Phase = Decide. Pipeline-open to colonies-02-hpc-deployment with the\
  \ caveats\nbelow.\n\nBuild-phase fixes required to get here:\n\n1. viva-munk apply_updates_with_realize\
  \ unpacked 2 values from\n   bigraph_schema.core.realize, which now returns 3 (escape_merges),\
  \ so every\n   structural `_add` crashed. Patched (viva-munk branch\n   rename-multi-cell-to-viva-munk,\
  \ commit \"fix: handle 3-tuple return from\n   bigraph_schema core.realize\").\n\
  2. v2ecoli/colony.py wired only `mass`/`volume`/`exchange` outputs on initial\n\
  \   cells. `_handle_division` writes to `agents`, but with no `agents` wire the\n\
  \   update had nowhere to land, so mothers stayed put. Fixed by mirroring the\n\
  \   full daughter wiring (`agent_id`/`location`/`angle` inputs, `length`/`agents`\n\
  \   outputs).\n3. v2ecoli/bridge.py `_handle_division` hard-coded\n   `interval=self.config.get('interval',\
  \ 60.0)` for daughters; `interval` is\n   not in `config_schema`, so the fallback\
  \ always won and daughters ticked once\n   per 60s instead of inheriting the mother's\
  \ 1s cadence. Fixed by passing\n   `interval` through.\n\nAfter all three fixes,\
  \ a pure-WC N=2 colony with both initial cells\nforce-divided produces 4 hydrated\
  \ daughters that all advance.\n\nPerf findings (steady-state, N \u2208 {1, 2, 4,\
  \ 8}, 60-tick window;\n2026-07-26 remote re-run @ f69f9690):\n\n- Per-cell wall\
  \ is flat at ~57 ms across N=1..8 (56.5 / 57.4 / 58.5 / 57.4);\n  per-cell-cost-within-2x-reference\
  \ passes at all N with ratio \u2248 1.0. This is\n  ~20% faster than the original\
  \ 73.6 ms (current code + mini hardware).\n- pymunk is essentially free (\u2264\
  0.15 ms/tick even at N=8). All cost is the inner\n  EcoliWCM composite (55 biological\
  \ steps \xD7 N cells, walked sequentially in one\n  Python thread).\n- RSS grows\
  \ only ~154 MB per added cell, atop a ~1.24 GB Python baseline \u2014\n  down 3\xD7\
  \ from the original ~450 MB/cell. RAM is no longer the binding limit.\n\nBottleneck\
  \ at scale is still the GIL: process-bigraph composites are\nsingle-threaded, so\
  \ one process uses ~1 CPU core regardless of cell count.\nScaling to many cells\
  \ means scaling processes, not cells-per-process.\n\nHPC node sizing (64-core /\
  \ 256 GB target) \u2014 re-derived from the new numbers:\n\n- CPU-limited realtime\
  \ ceiling per process: ~17 cells (17 \xD7 57 ms \u2248 970 ms,\n  ~realtime) \u2014\
  \ now the binding constraint.\n- RAM at 16 cells/process \xD7 64 processes = 1024\
  \ cells/node uses\n  64 \xD7 (1 GB + 16 \xD7 0.154 GB) \u2248 222 GB, fits 256 GB\
  \ with headroom.\n- Recommendation: 16 cells/process \xD7 64 processes = ~1024 cells/node\n\
  \  (per-process tick wall ~920 ms, \u2248 realtime; ~222 GB RAM). This ~2.7\xD7\n\
  \  raises the original 384 cells/node budget \u2014 the improvement is driven by\n\
  \  the 3\xD7 lower per-cell RSS, not by CPU (which barely moved).\n\nNot validated\
  \ here (handed to colonies-02):\n\n- Cross-node scaling, distributed environment\
  \ field.\n- Process-bigraph composite parallelism within a single process (unsupported;\n\
  \  needs engine work).\n- Multi-generation drift in per-tick cost (daughters' internal\
  \ composites may\n  bloat over many divisions).\n- Per-cell ParCa cache contention\
  \ if processes share cache_dir.\n"
followup_proposals:
- id: colonies-02-hpc-deployment
  status: seeded
  seeded_study: colonies-02-hpc-deployment
  title: Cross-node HPC deployment of the colony composite
  motivation: 'Build acceptance and N-sweep both PASS on one machine. Per-cell cost

    is flat, pymunk is free, RAM grows linearly. Single-process is the

    right starting shape on HPC; orchestration is the remaining design.

    '
  hypothesized_mechanism: "Per-cell wall matches single-machine projection within\
    \ \xB120% when\ncells/process is held near 16 and we scale across processes/nodes;\n\
    biology is consistent across distributed configurations modulo RNG.\n"
  seed:
    takes_as_input:
    - per_cell_ms = 57 ms (RAM-warm, post-warmup; 2026-07-26 re-run @ f69f9690)
    - per_cell_rss = 154 MB (steady-state, single colony)
    - "recommended cells/process = ~16 (CPU-bound, \u2248realtime)"
    pipeline_gate:
      prerequisites:
      - colonies-01-hpc-readiness
      proceed_condition: 'colonies-01-hpc-readiness.gate_status == passed AND

        per_cell_ms and per_cell_rss recorded.

        '
    behavior_tests:
    - name: hpc-per-cell-within-20pct-of-projection
      classification: primary
    - name: cross-node-biology-consistency
      classification: primary
- id: multi-gen-perf-drift
  status: proposed
  title: Multi-generation perf drift study
  motivation: 'The N-sweep here uses N initial cells held static. Real HPC workloads

    will have growing colonies (each division doubles N). We need to know

    whether per-cell wall stays at ~57 ms or drifts as daughter EcoliWCM

    internal composites accumulate history / fragment caches / etc.

    '
  hypothesized_mechanism: "Per-cell wall drifts \u2264 20% across gens 0-4 of a natural-division\n\
    colony (~10000s sim). If drift > 20%, the inner composite is\naccumulating dead\
    \ nodes or growing per-tick allocations.\n"
  linked_finding: F-06-rss-growth-over-time
  seed:
    simulation_set:
    - name: gen-drift-1cell-4div
      perturbation:
        n_cells: 1
      duration_min: 180
      seeds:
      - 0
    behavior_tests:
    - name: per-cell-wall-drift-within-20pct
      classification: primary
- id: parca-cache-contention
  status: proposed
  title: Per-cell ParCa cache contention
  motivation: 'All cells in this study share `out/cache`. If HPC processes also share

    cache, file-system contention may show up at scale and silently

    degrade per-cell perf. If per-process caches are needed, each cell

    adds ~the full ParCa cache footprint to RAM/disk.

    '
  seed:
    behavior_tests:
    - name: shared-vs-per-process-cache-perf
      classification: primary
- id: gil-aware-engine-research
  status: proposed
  title: Make process-bigraph composite engine GIL-aware (research)
  motivation: 'Every process in a composite ticks on one thread. For embarrassingly-

    parallel composites (independent cells), free parallelism is on the

    table if the engine supports concurrent process invocations

    (multiprocessing or thread-per-process with GIL-friendly bodies).

    Engine-level question that won''t unblock colonies-02 but is worth

    scoping.

    '
  linked_finding: F-02-gil-bottleneck
  seed:
    unblocks:
    - Single-process scaling beyond ~10 cells
findings:
- id: F-01-per-cell-wall-flat
  kind: computational
  status: confirms
  statement: "Per-cell wall time is flat at ~57 ms across N \u2208 {1, 2, 4, 8}. Composite\n\
    scales linearly on one machine. (2026-07-26 re-run; ~20% faster than the\noriginal\
    \ 73.6 ms on current code + mini hardware.)\n"
  evidence:
    from_runs:
    - nsweep-n1
    - nsweep-n2
    - nsweep-n4
    - nsweep-n8
    from_test: per-cell-cost-within-2x-reference
    observed:
      n1: 56.5
      n2: 57.4
      n4: 58.5
      n8: 57.4
    units: ms/tick/cell
  expected:
    summary: "per-cell wall stays within 2\xD7 of the N=1 reference; flat is the strongest\
      \ pass condition."
  provenance:
    run_ids:
    - 2
    - 3
    - 4
    - 5
    model_commit_hash: f69f9690
    raw_data_artifact: studies/colonies-01-hpc-readiness/runs.db
    analysis_script: studies/colonies-01-hpc-readiness/sims/run.py
    random_seeds:
    - 0
  next_action: 'Use ~57 ms/tick/cell as the projection input for colonies-02-hpc-deployment.

    '
- id: F-02-gil-bottleneck
  kind: computational
  status: novel
  statement: "The GIL is the dominant bottleneck at colony scale. Process-bigraph\n\
    composites are single-threaded by design \u2014 one process uses ~1 CPU core\n\
    regardless of how many cells it holds. Scaling means more processes, not\nmore\
    \ cells/process.\n"
  evidence:
    from_run: nsweep-n8
    observed: "pymunk_step_ms \u2248 0.1 ms/tick (free); ecoli_ms grows linearly with\
      \ N"
    units: ms/tick
  explanation: "All 55 inner WCM steps are walked sequentially in one Python thread.\n\
    pymunk is free even at N=8, so any super-linear cost would have to be in\nthe\
    \ EcoliWCM update \u2014 but per-cell stays flat. The only ceiling visible\nis\
    \ total wall vs realtime per process, which crosses ~1.0 around N\u224816.\n"
  provenance:
    run_ids:
    - 5
    model_commit_hash: f69f9690
    raw_data_artifact: studies/colonies-01-hpc-readiness/runs.db
  next_action: 'Seed gil-aware-engine-research follow-up.

    '
- id: F-03-per-cell-rss
  kind: computational
  status: confirms
  statement: "Steady-state per-cell RSS is ~154 MB, atop a ~1.24 GB Python baseline\n\
    (ParCa + WCM imports + cached numpy arrays). This is 3\xD7 lower than the\noriginal\
    \ ~450 MB/cell (2026-07-26 re-run @ f69f9690) \u2014 the biggest change\nof the\
    \ re-run, and it moves the HPC ceiling from RAM-bound to CPU-bound.\n"
  evidence:
    from_run: nsweep-n8
    from_test: per-cell-cost-within-2x-reference
    observed:
      n1_mb: 1391
      n2_mb: 1532
      n4_mb: 1845
      n8_mb: 2466
    slope_mb_per_cell: 154
    units: MB
  expected:
    summary: "Linear in N up to N=8 within one process. At 154 MB/cell RAM is no\n\
      longer binding: 16 cells/process \xD7 64 processes \u2248 222 GB on a 256 GB\n\
      node \u2192 ~1024 cells/node, CPU-bound at ~realtime.\n"
  provenance:
    run_ids:
    - 2
    - 3
    - 4
    - 5
    model_commit_hash: f69f9690
    raw_data_artifact: studies/colonies-01-hpc-readiness/runs.db
- id: F-04-pymunk-negligible
  kind: computational
  status: confirms
  statement: "pymunk 2D physics is essentially free at the N values we tested\n(\u2264\
    \ 0.2 ms/tick at N=8). All wall-time cost is the inner EcoliWCM.\n"
  evidence:
    from_run: nsweep-n8
    observed: "pymunk_step_ms \u2264 0.2"
    units: ms/tick
  provenance:
    run_ids:
    - 5
    model_commit_hash: f69f9690
- id: F-05-build-phase-bugs
  kind: methodological
  status: novel
  statement: 'Three independent bugs blocked daughter hydration through the engine

    and had to be fixed before the Decide phase could run.

    '
  explanation: "(1) viva-munk apply_updates_with_realize unpacked 2 values from\n\
    bigraph_schema.core.realize, which now returns 3 (escape_merges) \u2014\nevery\
    \ structural _add crashed.\n(2) v2ecoli/colony.py wired only mass/volume/exchange\
    \ outputs on\ninitial cells; _handle_division writes to `agents` with no wire,\n\
    so mother updates had nowhere to land.\n(3) v2ecoli/bridge.py _handle_division\
    \ hard-coded `interval=60.0` for\ndaughters; `interval` is not in config_schema,\
    \ so daughters ticked\nonce per 60s instead of inheriting the mother's 1s cadence.\n"
  evidence:
    from_run: build-smoke-n2
    from_test: daughters-hydrated
    observed: After all three fixes, pure-WC N=2 force-divided to 4 hydrated daughters
      that all advance on the next tick. Re-confirmed on the 2026-07-26 re-run @ f69f9690
      (build-smoke-n2, run_id 1).
  provenance:
    run_ids:
    - 1
    model_commit_hash: f69f9690
    raw_data_artifact: studies/colonies-01-hpc-readiness/runs.db
- id: F-06-rss-growth-over-time
  kind: computational
  status: novel
  statement: "RSS grows continuously during a single long N=1 run at ~5 MB/sim-second\n\
    (1126 MB at tick 0 \u2192 7016 MB by tick 1050, before division). Indicates\n\
    either accumulating state in the EcoliWCM internal composite or a leak;\nvisible\
    \ only in long runs, not in the 60s N-sweep windows.\n"
  evidence:
    from_run: bio-1cell-natural-division
    observed: rss_mb climbs monotonically across the pre-division window
    units: MB/sim-second
  next_action: "Folded into multi-gen-perf-drift follow-up \u2014 quantify drift over\n\
    natural divisions and isolate the source (cache, history, fragmentation).\n"
  provenance:
    run_ids:
    - 7
    model_commit_hash: 9addea3
    raw_data_artifact: studies/colonies-01-hpc-readiness/runs.db
