        by the feedback strength rather than by V.
  - name: dnaa4_autoreg_feedback_planned
    address: planned
    status: planned
    config:
      title: >-
        Planned (mockup until the run lands): DnaA pool over generations under
        feedback-controlled synthesis (no V override) vs the fixed-V drift, with the
        [300,800] band; plus dnaA-promoter occupancy (repression signal) and the
        resulting dnaA synth prob (the feedback loop). The test of whether
        autoregulation self-stabilizes DnaA and dissolves the V tension.

tests:
  - name: dnaa-pool-self-stabilizes-in-band-no-V
    criterion: DnaA pool stays within [300,800] across ≥6 generations with no V override (which a constitutive V could not do steadily).
    cites: # the [300,800] DnaA-per-cell band traces to the original abundance measurement + mass-spec stoichiometry (also used as the [300,800] mass-spec/EcoCyc range in dnaa-01)
      - dnaa-abundance-jb-1991
      - liu-nature-microbiology-s41564-020-0717-x
    status: evaluated
    result: PARTIAL
    detail: 'Much closer at s=0.7 (Rashmi 2026-06-13), 3-seed: seeds 1 & 2 hold DnaA in [300,800] across every full generation g3-16 (seed1 333-487, seed2 355-594), peak capped (655/759<800), oriC<=2. The only sub-300 points are the partial final gen g17 (216/251, truncated) and seed0''s noisier trough (dips to ~187 at g11-12). So band-centering is achieved for 2/3 seeds; the strict per-gen evaluator still computes fail because it counts g17 and seed0. Partial (robustly near, 2/3 clean).'
    classification: primary
    measure:
      kind: generation_average
      path: MONOMER0-160[c] + MONOMER0-4565[c] + PD03831[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.chromosomal_high_bound_adp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_high_bound_adp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp + listeners.replication_data.promoter_high_bound_adp
      window: gen_steady_state
    pass_if:
      op: generation_average_in_range
      low: 300
      high: 800
  - name: per-gen-drift-reduced-vs-fixed-V
    criterion: per-generation DnaA mean drift is reduced vs the fixed-V runs (which ramped 73→880 at V=1e-3).
    status: evaluated
    result: PASS
    detail: 'Feedback dampens the amplitude vs fixed V (control 618-1178 -> autoreg ~280-600).'
    classification: secondary
  - name: cell-cycle-preserved
    criterion: oriC 1↔2, one initiation per generation, periodic mass-doubling, preserved under feedback.
    cites: # one-initiation-per-cycle (oriC in {1,2}) is the initiator-titration cell-cycle expectation; the baseline cell cycle this must preserve is the macklin2020 WCM's
      - initiator-titration-nat-comm-s41467-022-33886-6
      - macklin2020
    status: evaluated
    result: PASS
    detail: oriC 1<->2 (1.72 in [1,2]), periodic mass-doubling, clean 16/16 divisions under feedback, code-confirmed.
    classification: primary
    measure:
      kind: snapshot_window
      path: listeners.replication_data.number_of_oric
      window: full_lineage_from_gen_0
    pass_if:
      op: in_range
      low: 1
      high: 2
  - name: closes-the-v-tension-stretch
    criterion: 'Stretch: holds the in-band pool and the ~1/min dnaA init rate simultaneously (no constitutive V achieved both, the dnaa-1 tension).'
    status: evaluated

    result: PARTIAL
    detail: Caps the peak that the V-sweep showed no constitutive V could; full in-band not yet (band partial).
    classification: stretch
report:
  title: dnaa-4 — DnaA negative autoregulation (self-stabilizing the pool)
  verdict: >-
    mechanism-validated-homeostasis. Canonical reference (F-07; Rashmi/Haochen commit eb4ea39):
    linear autoregulation s=0.6 + F-05 (kinetic apo+ATP charging) at V=1.5e-3 reproduces a clean
    band pass (every steady gen g4-11 in [300,800]) and a clean cell cycle (12/12 divided, oriC 1<->2),
    DnaA-ATP fraction 0.261; matches Rashmi's reference PDF. This supersedes the earlier Hill
    exploration: Hill s=0.7 brought 2/3 seeds in-band (band partial: seed0 dip and truncated g17), and
    Hill s=0.65 (F-06) band-centered but slowed division, stalling 2/3 seeds. So the band test is now a
    clean pass on the linear-s=0.6+F-05 reference. (Homeostasis itself, the DnaA setpoint insensitive to
    V, holds across both forms.) Multi-seed confirmation (seeds 0/2, 2026-06-16, 12-gen each, identical
    config): the homeostasis is robust across all 3 seeds, with a clean cell cycle (12/12 divided, oriC 1<->2,
    0 re-inits) and the total-DnaA pool in [300,800] every steady gen g4-11 on seeds 0/1/2. But the
    DnaA-ATP-fraction band is seed-sensitive: in band only on seed 1 (0.261); seed 0 0.156 and seed 2
    0.085 fall below 0.2 (seed 0 ramps 0.02->0.25 over gens, slow ATP charging, near band by g8-12;
    seed 2 stays erratic ~0.02-0.12). So the headline result, autoregulated DnaA homeostasis and clean
    cycle, replicates robustly, but the fraction band does not; dnaa-4 stays partial on the fraction
    (mirrors the Hill s=0.7 2/3-in-band pattern). Runs dnaa4_s06_F05_seed{0,1,2}_12gen.
  confidence: demonstrated-mechanism
  evidence_quality: '6 completed 16-gen runs: control/linear/Hill/Hill-s06 (seed 0, V=1.5e-3) plus s=0.7 Hill 3-seed robustness (seeds 0/1/2; seed1 via the #209 allocator/proton fix)'
  objective: |
    Make dnaA transcription feedback-controlled (autorepression via dnaA-promoter
    occupancy) so the DnaA pool self-stabilizes in-band without the manual V
    override, and test whether this dissolves the dnaa-1/dnaa-2 V tension and drift.

  conclusion: "Current reference (F-07; Rashmi/Haochen commit eb4ea39): the adopted dnaa-4 autoregulation is linear s=0.6 + F-05 (kinetic apo+ATP charging) at V=1.5e-3; it reproduces Rashmi's reference PDF: a clean band pass (every steady generation g4-11 in [300,800]) and a clean cell cycle (12/12 divided, oriC 1<->2), DnaA-ATP fraction 0.261 (run dnaa4_s06_F05_seed1_12gen). The Hill exploration recorded below is the prior journey that led here: Hill s=0.7 reached band partial (2/3 seeds), and s=0.65 (F-06) band-centered but slowed division (2/3 seeds stalled), which is why the linear s=0.6 + F-05 combination was adopted. The homeostasis result holds across both forms.\n\nKey finding, homeostasis (V-sweep 0.70/1.0/1.5/2.0e-3): the autoregulation makes the DnaA level insensitive to the constitutive expression rate V. Raising V sends the no-autoregulation control over-shooting ever harder (steady-gen mean ~562 -> 662 -> 1178 -> 1815 at V=0.70/1.0/1.5/2.0e-3, peak to 2416), but the autoregulated run holds DnaA at a near-constant homeostatic setpoint (Hill mean 248-430 at V=1.5e-3, 238-450 at V=2.0e-3, essentially unchanged). The feedback simply represses more as the dnaA-promoter saturates, cancelling the extra expression. This is the autoregulation working as designed, a stronger result than landing any single V in band: the DnaA setpoint is robust to V and is tuned by the feedback strength (s, Hill K), not by V. (Corollary: Rashmi's 'increase V to lift DnaA into band' is cancelled by the homeostasis; and V=2.0e-3 also destabilized the metabolism, with a NegativeCountsError on PROTON ~gen 7. So band-centering proceeds via s / Hill-K at a stable V, e.g. s=0.6, not via V.)\n\ndnaA self-autoregulation resolves the V-tension the dnaa-3 V-sweep proved no constitutive V could: with feedback off (control, V=1.5e-3) the DnaA pool over-shoots (peak 1567, mean to 1178); with feedback on it caps the peak hard (1567->635, ~2.5x) and dampens the cell-cycle amplitude. The repression form matters (Rashmi's open question, answered with data): the linear (1-0.8f) form over-represses the trough (216), so the Hill form (n=4,K=0.5), with less repression at low promoter occupancy, is correct, lifting the trough to 248. Re-initiation stays controlled (oriC<=2) throughout. Not yet fully band-centered: the Hill trough sits ~50 below the 300 floor and ATP-fraction min ~0.04 below 0.2; final centering is K/s/k_h calibration, not a mechanism question. Implementation note: the autoreg scaling required a probability renormalization (a review caught that scaling one TU in the multinomial distribution without renormalizing piles the freed mass on an arbitrary promoter).\n\nBand-centering (Rashmi 2026-06-12): since V is cancelled by the homeostasis, the setpoint was lifted into band by weakening the feedback (Hill s 0.8->0.6) at a stable V=1.5e-3; DnaA gen-mean now 282-602, oscillating within [300,800] vs the control's runaway to 1567 (run dnaa4_autoreg_hill_s06_v15e3). A feedback-strength trade-off remains: s=0.6 lifts the setpoint in-band but the peak grazes ~850; s=0.8 caps the peak at 635 but sits the setpoint low; s~0.7 is the likely balance. The cell-cycle amplitude is intrinsically near the band's full width.\n\nCorrection (strict spine eval, 2026-06-12): the per-generation band evaluator shows the s=0.6 setpoint dips below 300 on the trough gens (232-298), so dnaa-4 is near band (peak capped, amplitude dampened, cell cycle preserved/PASS) but not cleanly in-band; the 'gen-mean 282-602 in band' read was from a looser render-script window. Band test = PARTIAL (computed FAIL strict / PARTIAL human). s~0.7 is genuinely needed to lift the homeostatic trough past 300, not cosmetic polish.\n\ns=0.7 robustness round (Rashmi 2026-06-13: 'run V=1.5 + Hill K=0.5 + s=0.7 + n=4 for multiple generations'): ran s=0.7 across 3 seeds. s=0.7 delivers the band-centering: seeds 1 and 2 hold DnaA in [300,800] across every full generation g3-16 (seed1 333-487, seed2 355-594), with the peak capped (655/759 < 800) and the cell cycle clean (oriC<=2, 0 re-inits). seed0
    is noisier (in-band most gens but a stochastic dip to ~187 at g11-12). So peak-cap and cell-cycle integrity are robust across all 3 seeds; in-band centering is clean for 2/3. The only systematic sub-300 point is the partial final generation g17 (truncated), an artifact not a steady-state excursion. This is the strongest band result yet (s=0.7 > s=0.6's trough-dips > s=0.8's low setpoint), now multi-seed.\n\nBaseline fix surfaced (#209): seed1 originally crashed with a PROTON[c] NegativeCountsError (an allocator over-draft after an FBA GLP_NOFEAS infeasibility tick; platform-sensitive, crashed on the mini, not the laptop). This is a baseline-model robustness defect, not an autoregulation problem; fixed in v2ecoli #209 (resolve_overdraft clamps the over-draft and warns instead of crashing; behavior-neutral, byte-identical parity). Cherry-picked here; seed1 then completed 16 gens with 6 graceful clamps and was the cleanest seed.\n\nResume-stability probe (Rashmi: 'select a .dill from a steady-state generation and continue another lineage to confirm stability') could not be completed: the --resume-dill path produces a daughter that never re-initiates replication (oriC pinned at 2, grows to ~2x mass, never divides), reproduced across two seeds, while the in-process continuous divide of the identical state divides fine. So this is a dill-roundtrip tooling bug (docs/resume_dill_replication_init_bug.md), not instability; the multi-generation stability evidence comes from the continuous 16-gen runs, which are clean. The resume confirmation is deferred until the tooling is fixed."
next_action: |
  1. Resume-stability confirmation is blocked on a tooling fix: the --resume-dill
     path breaks replication initiation (docs/resume_dill_replication_init_bug.md).
     Fix the dill-roundtrip of cell_state['unique'], then run the deferred
     "continue a lineage from a steady-state gen10 dill" check. 2. seed0 was the
     one noisy seed at s=0.7; a few more seeds would quantify how often the
     trough dips below 300 (the s=0.7 setpoint sits ~1 std above the floor).
     3. Stretch still open: the ~1/min dnaA init rate alongside the in-band pool.
     4. Optional: nudge k_h to lift the ATP-fraction floor. The mechanism,
     band-centering, and 3-seed robustness are now demonstrated; what remains is the
     resume-probe tooling and the rate stretch.

