schema_version: 4
name: flagella-02-transcription-regulation
title: "Transcription Regulation — SUM-gate, FlgM/FliA Feedback & Override Parity"
question: >-
  When the flagella_regulation SUM-gate is ON: (a) does Class II promoter activity
  rise before and stay above Class III (the Kalir & Alon temporal order), surviving
  cell division; (b) does the FlgM secretion gate deplete cytoplasmic FlgM in
  proportion to complete flagella, shift the FlgM-FliA equilibrium to release free
  FliA, and keep FliA bounded via the flgM negative-feedback loop; and (c) does that
  all still hold under Maya's COMPLETE original vEcoli initial-state override
  (all 4 values), not just a reduced approximation of it?
description: |
  Consolidated study covering the full transcriptional half of Maya's Specific Aim
  2A: the Kalir & Alon (Cell 2004) bilinear SUM-gate driving Class II -> Class III
  ordering, the FlgM secretion gate + FliA negative-feedback loop that times the
  Class III onset, and a direct override-parity check against Maya's original
  vEcoli flagellum_initial_value.json. This was originally split across three
  studies (flagella-02-sumgate-cascade, flagella-03-flgm-flia-feedback, and
  flagella-05-full-override-parity); they are merged here because all three are
  the same underlying mechanism — the transcriptional regulatory cascade — viewed
  from different angles (the gate itself, its timing/feedback loop, and a fidelity
  check on its initial-state input). See `merge_history` below for provenance.
topic: regulation
tags: [flagella, transcription-regulation, kalir-alon, sum-gate, classII, classIII,
       sigma28, flhDC, flgM, fliA, secretion, negative-feedback, anti-sigma,
       override-parity, full-parca, aim2a, ported-from-vecoli-biofilm]
created: '2026-06-20'

