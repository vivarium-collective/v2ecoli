schema_version: 4
name: pc00010-repression-arithmetic
title: The repressor that silences dnaG
investigation: transcription-rewiring
study_type: mechanism_confirmation
phase: Design
created: '2026-09-04'
status: planned
design_status: complete
implementation_status: not_started
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested
question: dnaG's transcription collapse has been traced to a single term. The TF PC00010 is bound at dnaG's
  promoter on 96.3% of generation-1 timesteps and 100% of every generation after, and its in-force delta
  is -0.999999957, so b*(1+delta) retains 4.3e-08 of dnaG's assigned probability. Does that arithmetic
  close quantitatively, is the generational collapse simply occupancy rising from 96.3% to 100%, and how
  many other transcripts does this affect?
parent_studies:
- study: inforce-basal-vector
  condition: complete
  relation: refines
- study: dnag-promoter-availability
  condition: complete
  relation: leads-to
- study: dnag-generational-decay
  condition: complete
  relation: leads-to
units_and_time:
  tick: 1 s of simulated time; generations delimited by division events.
  quantities:
    occupancy: fraction of timesteps with PC00010 bound at a promoter coordinate (dimensionless)
    delta: relative change in initiation probability per bound TF (dimensionless, built with ppgpp=True)
    basal_prob: dimensionless per-TU probability (in-force ppGpp vector)
    target_rna_synth_prob: dimensionless per-TU probability
behavior_tests:
- name: arithmetic-predicts-dnag-transcription
  classification: primary
  gate_class: acceptance_criterion
  question: Does b*(1+delta) reproduce dnaG's measured transcription?
  description: 'dnaG''s measured per-promoter probability agrees within 2x with the prediction b*(1 -
    occupancy + occupancy*(1+delta)), using the measured in-force basal b, the measured PC00010 occupancy,
    and the in-force delta of -0.999999957.


    Closes the arithmetic, which is this study''s whole purpose. Every term is now measured rather than
    assumed: b from the per-timestep reconstruction (validated to 1.0003 against the per-generation mean),
    occupancy from the repaired bound_TF listeners, delta from the in-force delta_prob_matrix built with
    ppgpp=True. A first pass predicted a retained fraction of 4.3167e-08 against a measured 2.2e-07 --
    a 5x gap that the occupancy term is expected to explain and that this axis exists to force into the
    open rather than wave through.


    Threshold provenance: theory. 2x for a chain of four independently measured quantities spanning eight
    orders of magnitude.'
  measure:
    kind: derived
    path: predicted dnaG per-promoter init probability from measured b, occupancy and delta, over the
      measured value
    detail: ratio of predicted to measured dnaG per-promoter probability, per generation, median over
      seeds.
  pass_if:
    low: 0.5
    high: 1.5
    provenance:
      kind: theory
      note: 'Two-sided and slightly asymmetric-tolerant: over- and under-prediction are equally informative,
        and a chain spanning eight orders of magnitude that lands within 2x is closed.'
  status: pending
- name: occupancy-explains-the-generational-collapse
  classification: primary
  gate_class: acceptance_criterion
  question: Is the collapse just PC00010's occupancy rising?
  description: 'The rise in PC00010 occupancy at dnaG''s promoter from generation 1 to the last generation
    accounts for the fall in dnaG''s transcription within 2x, treating transcription as proportional to
    (1 - occupancy).


    The causal claim in its testable form. Occupancy measured 0.963 at generation 1 and 1.000 thereafter;
    if transcription is b*(1-occupancy) to first order, that alone predicts the drop from ~8.7% to ~0.
    If this passes, the ''generational decay'' this investigation chased through four studies is nothing
    more than a repressor going from almost-always-bound to always-bound.


    Threshold provenance: theory. Matches the arithmetic axis so both read on one scale.'
  measure:
    kind: derived
    path: predicted dnaG transcription fold-change from PC00010 occupancy alone, over the measured fold-change
    detail: ratio of the occupancy-predicted transcription fold-change to the measured one, generation
      1 to last.
  pass_if:
    low: 0.5
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided; an occupancy model that over-predicts the collapse is as wrong as one that under-predicts
        it.
  status: pending
- name: the-near-total-repression-cohort-is-silenced
  classification: primary
  gate_class: acceptance_criterion
  question: Is dnaG one of a class, or a special case?
  description: 'At least 8 of the 10 PC00010 targets whose in-force delta retains less than 1e-6 of basal
    show measured transcription below 1e-9 in the last generation.


    dnaG is NOT unique: 10 of PC00010''s 45 targets retain <1e-6 when it binds, including TU00062[c],
    which is already in this investigation''s standing cohort. If those transcripts are silenced too,
    the finding is a class-level defect in how near-total repression is represented, not a dnaG curiosity,
    and its scope is much larger than this investigation has assumed.


    Threshold provenance: theory. 8 of 10 tolerates two transcripts whose promoters PC00010 happens not
    to occupy, without letting a scattered result count as a class.'
  measure:
    kind: derived
    path: count of the 10 near-total-repression PC00010 targets with measured transcription below 1e-9
      in the last generation
    detail: number of the 10 identified TUs silenced in the last generation, median over seeds.
  pass_if:
    low: 8
    high: 10
    provenance:
      kind: theory
      note: Bounded above by 10 by construction; 8 is the weakest count that still shows a class rather
        than a scatter.
  status: pending
- name: unregulated-peers-are-unaffected
  classification: primary
  gate_class: acceptance_criterion
  question: Is silencing confined to PC00010's targets?
  description: 'The idx_rprotein peers that PC00010 does NOT regulate retain median transcription within
    1.5x of their in-force basal in the last generation.


    The discriminating control. If transcripts with no PC00010 site are also silenced, the repressor is
    not the mechanism and the whole chain built here is wrong. dnag-generational-decay measured these
    peers RISING, so the expectation is firm.


    Threshold provenance: theory. Two-sided, mirroring the controls in the previous three studies.'
  measure:
    kind: derived
    path: median measured over in-force basal for idx_rprotein peers not regulated by PC00010, last generation
    detail: median transcription-to-basal ratio for unregulated peers in the last generation.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided so the control cannot be satisfied by the peers collapsing alongside the targets.
  status: pending
  control: negative
- name: negative-initiation-probability
  classification: supporting
  gate_class: acceptance_criterion
  question: Does any transcript receive a negative initiation probability?
  description: 'EG10620_RNA[c]''s in-force delta is -1.000009252, i.e. below -1, so b*(1+delta) is NEGATIVE
    (-9.25e-06 of b). The axis asks whether a negative per-promoter probability actually reaches the sampler.


    Found while closing the arithmetic and worth a graded axis rather than a footnote: a negative probability
    is not a small numerical wrinkle but a term that a multinomial cannot accept, so either something
    clips it silently or the distribution is malformed. Either answer is a defect worth naming.


    Threshold provenance: definitional. A probability is non-negative or it is not a probability.'
  measure:
    kind: derived
    path: minimum measured target_rna_synth_prob for EG10620_RNA over the lineage
    detail: minimum of EG10620_RNA[c]'s measured target probability across all timesteps and seeds.
  pass_if:
    op: '>='
    value: 0.0
    provenance:
      kind: theory
      note: 'Definitional: probabilities are non-negative.'
  status: pending
- name: dnag-occupancy-at-generation-1
  classification: supporting
  gate_class: regression_pin
  question: Does the generation-1 occupancy baseline still hold?
  description: 'PC00010 occupancy at dnaG''s promoter at generation 1 stays at or below 0.99.


    POST-HOC: measured at 0.963 in seed 0 of dnag-promoter-availability. A pin so that a drift toward
    full occupancy at generation 1 is caught, since that partial occupancy is exactly what leaves dnaG
    any expression at all in the first generation.'
  measure:
    kind: derived
    path: fraction of generation-1 timesteps with PC00010 bound at dnaG's promoter coordinate
    detail: PC00010 occupancy at dnaG's promoter, generation 1, median over seeds.
  pass_if:
    op: <=
    value: 0.99
    provenance:
      kind: post_hoc
      note: 0.963 measured in seed 0; pin only.
  status: pending
preregistered:
  declared_before_runs: true
  registered_at: '2026-09-04T01:30:00Z'
  date: '2026-09-04'
  thresholds:
    arithmetic-predicts-dnag-transcription:
      low: 0.5
      high: 1.5
      provenance:
        kind: theory
        note: 'Two-sided and slightly asymmetric-tolerant: over- and under-prediction are equally informative,
