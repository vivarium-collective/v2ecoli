schema_version: 4
name: colonies-06-daughter-machine
investigation: colonies
title: "Daughter machine (viva-munk) — device run + phenotype distributions"
description: |
  Part B (phenotype tier) \u2014 run the canonical viva-munk DAUGHTER MACHINE (a
  single cell in a chamber with an absorbing right wall, so the lineage grows
  leftward as daughters are pushed out), populated by viva-munk's simple
  grow/divide agents: the cheapest rung of the cost/fidelity tier ladder (simple
  agent -> growth surrogate -> full WCM). The simulation runs now and produces
  (a) an animated GIF of the device running and (b) distribution figures for the
  core emergent single-cell phenotypes \u2014 size at division, inter-division time
  (birth to division), added length before division, and the adder
  size-homeostasis relation \u2014 extracted uniformly by colony_bench.phenotypes.

  This tier establishes the measurement + visualization pipeline against cheap
  agents; the phenotype distributions are held for comparison against the WCM
  tier (colonies-08) and experimental daughter-machine microfluidic data. No
  biological conclusion is drawn at the simple-agent tier.
topic: phenotype-quantification
tags:
  - colony
  - daughter-machine
  - phenotype
  - adder
  - device
  - requires-viva-munk
created: '2026-07-25'
purpose:
  question: |
    Do the core emergent single-cell phenotypes — size-at-division,
    inter-division time, added length, the adder size-homeostasis relation, and
    growth rate — stay measurable when simple viva-munk agents run in the
    canonical daughter-machine device geometry?
  mechanism: |
    The daughter_machine_document geometry (via v2ecoli.colony_bench.devices) is
    populated with simple grow/divide agents; colony_bench.phenotypes extracts
    the uniform phenotype panel over the lineage, and the resulting
    distributions are the object of study.
  expected_outcome: |
    The device runs and divides, the running animation renders, and the size-at-
    division, inter-division-time, and added-length distributions (plus the adder
    plot) are produced and held for later comparison against the WCM tier
    (colonies-08) and experimental data. This tier makes no biological claim — it
    validates the measurement pipeline against cheap agents.
