schema_version: 2
name: dnaa-replication
title: DnaA / Replication Initiation (succinate, fresh start 2026-05-29)
created: '2026-05-29'
status: active
# Status log (latest 2026-06-10).
# dnaa-0 pass. dnaa-1 pass at the canonical V=0.8e-3 on the expert's in-band + steady
# criterion: the DnaA pool oscillates within [300,800] (steady-gen cycle-mean ~362, peaks
# <800, troughs ~207), oriC stays 1↔2, and every generation divides. The ~0.6/min dnaA
# init rate is the known sub-physiological tradeoff (init-rate test partial). No constitutive
# V closes both the band and the ~1/min rate (7-point sweep plus a 15-gen V=1.1e-3 run that
# overshoots), so a regulated synthesis lever is needed; the earlier V=1.1e-3 pick was
# withdrawn (its 7-gen "676 in-band" reading was a pre-equilibration artifact). Rashmi signed
# dnaa-1 off at V=0.8e-3 2026-06-09; the regulated lever is deferred and non-blocking.
# dnaa-2 was re-verified on the corrected full-per-gen-history emitter (the old pass was stale
# on pre-fix truncated data). It passes on the generation-average criterion across seeds 0/1/2:
# DnaA-ATP fraction 0.268/0.267/0.302 in [0.2,0.5], mass-doubling and oriC 1↔2 every seed,
# total-DnaA in band on the all-gen average (392/575/578). The per-gen mean overshoots 800
# mid-run on seeds 1 and 2 but not seed 0 — in-band only on the all-gen average, matching
# dnaa-1's V=1e-3 overshoot (a genuine V tension: dnaa-1 wants 0.8e-3, dnaa-2's fraction needs
# ~1e-3). Rashmi re-approved dnaa-2 2026-06-10; the 4 behaviour tests pass on the canonical run.
# dnaa-3 box-binding: the read-only occupancy observer left an over-binding (free DnaA-ATP
# ~380-550 nM vs the ~100 nM K_d, oriC-low occupancy ~0.8) that a V-down sweep could not resolve.
# Adopting Rashmi's active Langmuir branch (PR #162) depletes the free pool — the physics the
# observer lacked — resolving the over-binding (oriC-low occupancy mean 0.46) and fixing
# box-doubling (315↔630, low-aff 8→16 via fork-passage release), with 8/8 clean divisions.
# dnaa-4 (DnaA self-autoregulation) is the regulated lever the data called for. The runtime dnaA
# synth prob is a precomputed static value (set in ParCa, overridden by Mechanism A's V), not
# recomputed from basal + delta_prob each tick — the dnaA delta_prob self-edge is 0 and natural
# basal synth is 1.06e-5 (~100x below the 1e-3 override). A stopgap (patch basal+delta_prob, drop
# the V override) failed: DnaA collapsed to ~17 at the natural rate. The same static-synth-prob
# architecture is why both the V override is needed and autoregulation is absent. The fix is to
# make dnaA transcription dynamically feedback-controlled (recompute synth prob from basal +
# autorepression x DnaA-promoter occupancy) and calibrate basal to equilibrate in band; this
# should dissolve the V tension and drift at the root.

question: |
  Can v2ecoli reproduce DnaA-driven replication initiation in succinate at
  STEADY STATE — periodic oriC + cell-mass + DnaA dynamics across multiple
  generations — using ParCa's native succinate parameters with no imposed
  τ / C / D overrides?

hypothesis: |
  In succinate (τ ≈ 70–80 min, ParCa-default C = 40 min, D = 20 min,
  B = τ − C − D > 0), v2ecoli with a tuned dnaA RNA-synthesis probability
  (Mechanism A: sim_data.genetic_perturbations["TU00259[c]"] = 2e-3
  runtime overwrite) holds the DnaA monomer pool in the literature
  [300, 800] band across generations and produces a non-overlapping cell
  cycle that initiates replication exactly once per cycle. The cycle
  proceeds: cell starts with 1 oriC, replication initiates once near the
  end of B-period, oriC briefly doubles to 2, replication completes after
  C-period, D-period elapses, division fires, daughters start the same
  cycle again — never reaching 4 oriC simultaneously.

lead: |
  This investigation replaces the prior dnaa-replication work entirely.
  Prior context (Round 1–3.8 framing, glycerol cache, imposed τ/C/D,
  intrinsic-hydrolysis dnaa-02, RIDA mechanisms, etc.) is deliberately
  retired per the 2026-05-29 reviewer feedback (see
  feedback-2026-05-29-fresh-start/feedback.pdf). The fresh start uses
  succinate (which already has a saved ParCa sim_data state) and is
  gated study-by-study: dnaa-2..N stay blocked until dnaa-0 and dnaa-1
  pass.

executive:
  what_is_this: |
    v2ecoli with DnaA-driven chromosome replication initiation under succinate, built
    study by study. The first five studies hold together: dnaa-0 (succinate periodic steady
    state) pass; dnaa-1 (DnaA expression) pass at V=0.8e-3 on the expert's in-band + steady
    criterion (pool oscillates within [300,800], oriC 1↔2, every gen divides; the ~0.6/min
    init rate is the known sub-physiological tradeoff, so the init-rate test is partial and
    flags the need for a regulated lever); dnaa-2 (DnaA-ATP/ADP nucleotide balance + intrinsic
    hydrolysis) pass, multi-seed, with the fraction in the Boesen [0.2,0.5] band via Haochen's
    kinetic-hydrolysis mechanism; dnaa-3 (DnaA-box binding) pass, where active Langmuir binding
    depletes the free pool and fixes box-doubling, resolving the earlier over-binding; dnaa-4
    (DnaA self-autoregulation) is the regulated lever dnaa-1 called for, dissolving the V-tension
    at the root. A per-generation parquet-emit truncation bug (fixed 2026-06-08) had biased the
    early reads; every pass above is on the corrected full-per-gen history. Each study has an
    explicit acceptance criterion in biological observables (oriC periodicity, DnaA pool steady
    state, DnaA-ATP fraction band). Further mechanistic studies (RIDA/DDAH/DARS, seqA
    sequestration, cooperativity, validation) are scaffolded as a roadmap but not yet worked.
  verdict: |-
    The succinate DnaA cell cycle is reconstructed mechanistically across seven studies (0-6):
    a periodic baseline, in-band DnaA expression, ATP/ADP nucleotide balance, active DnaA-box
    binding, DnaA self-autoregulation, a cooperative oriC switch, and a mechanistic DnaA-ATP/oriC
    initiation trigger that replaces the inherited cell-mass-per-origin heuristic. Each step meets
    its gate (or is honestly partial), and each step's tension pinpoints the next mechanism.

    Headline update (dnaa-6, 2026-06-27): the mechanistic trigger built on the cooperative oriC-low
    switch now gives CLEAN ONCE-PER-CELL-CYCLE initiation — exactly one fill->fire->reset per
    generation, oriC strictly 1<->2 (never 4), seed-robust across seeds 0/1/2 over 8 generations,
    with the cooperative switch alone (SeqA eclipse / RIDA not required). This closes the once-per-
    cycle item that dnaa-5 had flagged as out-of-scope future work: under the inherited mass trigger
    the cooperative switch fired un-phase-locked (the dnaa5_saturation_per_gen [11,93,95,0,...]
    signature); the mechanistic trigger phase-locks it. The earlier "over-initiates to oriC->4"
    concern was a property of the older 59e108fb build and does not reproduce on current code.
    Remaining open (both now CODE-level, not parameter sweeps): the DnaA-ATP-fraction band stays
    seed-variable / mostly below [0.2,0.5] (lever = the code-baked recharge rate k_r), and firing is
    a brief fill-spike rather than a sustained full-saturation plateau (needs a dynamic-kick).

    The arc, step by step:
      (0) succinate baseline: v2ecoli reaches periodic steady state (oriC 1↔2 from gen 3).
      (1) DnaA expression: V=0.8e-3 holds the pool in band, but no constitutive V also gives the
          ~1/min init rate, so the data itself called for a regulated lever.
      (2) DnaA-ATP/ADP nucleotide balance: Haochen's kinetic hydrolysis puts the DnaA-ATP fraction
          in the Boesen [0.2,0.5] band, off the fast-equilibrium pin. Multi-seed pass.
      (3) DnaA-box binding: active Langmuir binding depletes free DnaA-ATP, resolving the
          over-binding and fixing box-doubling. 6/6 tests pass, spine-verified.
      (4) DnaA self-autoregulation: the regulated lever (linear s=0.6 + F-05) dissolves the
          dnaa-1/2/3 V-tension at the root. Homeostasis is robust across 3 seeds; the DnaA-ATP
          fraction band is seed-1-specific (honest partial).
      (5) cooperative oriC switch: a Hill filament makes oriC-low occupancy switch-like (reaches
          full) while preserving the dnaa-3/4 bands (pass). This is the prerequisite the mechanistic
          initiation trigger needs.
      (6) mechanistic initiation trigger: firing initiation on the cooperative oriC-low switch
          (DnaA-ATP/oriC) in place of the cell-mass heuristic gives clean once-per-cell-cycle
          initiation, oriC 1<->2, seed-robust over 8 gens (partial only on the open ATP-fraction band).

    Next (code-level, for Haochen): close the DnaA-ATP-fraction band (expose/tune the recharge rate
    k_r) and add a dynamic-kick so the oriC cluster holds a sustained full-saturation plateau. Detail
    per step follows.

    dnaa-0 pass (succinate periodic steady state, oriC 1↔2 from gen 3). dnaa-1 pass at V=0.8e-3
    on the expert's in-band + steady criterion (steady-gen cycle-mean ~362, peaks <800, troughs
    ~207; oriC clean 1↔2, every gen divides), with the ~0.6/min init rate the known
    sub-physiological tradeoff (init-rate test partial). A 7-point V-sweep plus a 15-gen
    equilibration run established that no constitutive V closes both the in-band pool and the
    ~1/min rate (both rise together with V), so dnaa-1 explicitly called for a regulated lever.
    dnaa-2 pass (multi-seed 0/1/2): Haochen's kinetic-hydrolysis mechanism drives the DnaA-ATP
    fraction off the ~0.997 fast-equilibrium pin and into the Boesen [0.2,0.5] band (avg ~0.27),
    with mass-doubling 8/8 and oriC 1↔2.

    dnaa-3 (DnaA-box binding) pass: the adopted active Langmuir binding (Rashmi's mechanism,
    PR #162) depletes the free DnaA-ATP pool, the physics the read-only observer lacked, so the
    earlier over-binding (free DnaA-ATP ~380-550 nM, oriC-low occupancy ~0.8) is resolved and
    box-doubling is fixed (low-aff sites double 8→16 via fork-passage release). Under the current
    dnaa-4 reference the box-binding re-run passes all 6 acceptance tests, including the
    DnaA-ATP-fraction band (0.284), with oriC-low occupancy down to 0.04-0.17 and free DnaA-ATP
    ~5-11 nM (well below the 100 nM K_d).

    dnaa-4 (DnaA self-autoregulation) is the regulated lever, with mechanism-validated homeostasis.
    The canonical reference (F-07; Rashmi/Haochen commit eb4ea39) is linear autoregulation s=0.6 +
    F-05 (kinetic apo+ATP charging) at V=1.5e-3, k_h=0.025/min: a clean band pass (every steady gen
    g4-11 in [300,800]), clean cell cycle (12/12 divided, oriC 1↔2), DnaA-ATP fraction 0.261,
    matching Rashmi's reference PDF. It supersedes the earlier Hill exploration (Hill s=0.7 brought
    only 2/3 seeds in-band; s=0.65/F-06 stalled division). Feedback holding free DnaA-ATP low is
    also what lets dnaa-3 pass its fraction band, so autoregulation dissolves the dnaa-1/2/3
    V-tension at the root, exactly as deferred.

    Multi-seed (seeds 0/1/2, 12-gen): the autoregulated homeostasis is robust — clean cell cycle
    (12/12, oriC 1↔2, 0 re-inits) and total-DnaA pool in [300,800] (steady g4-11) on all three
    seeds. The DnaA-ATP-fraction band, however, is seed-sensitive: in band only on seed 1 (0.261),
    while seed 0 (0.156, ramping toward band late) and seed 2 (0.085, erratic) fall below 0.2. So
    dnaa-4 stays partial on the fraction (homeostasis confirmed, fraction band seed-1-specific).

    dnaa-5 (cooperative oriC switch) pass — switch and homeostasis validated, with once-per-cycle
    firing a tracked out-of-scope future criterion. Replacing the oriC-low independent-site Langmuir
    with a cooperative Hill filament (n=4, K=30 nM, flag-gated; n=1 recovers dnaa-3 exactly) makes the
    oriC-low occupancy snap to full (max 1.00) versus the Langmuir's gradual partial (max 0.50), a
    switch-like, reproducible signal, while preserving the dnaa-3/4 steady state (DnaA pool in
    [300,800], DnaA-ATP fraction 0.276 in band, clean 8/8 cycle, oriC 1↔2). n=6 is too strong (pool
    dips below 300), so n=4 is the operating point. Multi-seed (seeds 0/1/2): the cooperative switch is
    seed-robust on homeostasis — 8/8 divisions, oriC 1↔2, and pool in [300,800] on all three seeds
    (g3+ mean 332/380/376); the DnaA-ATP-fraction band holds on seed 1 only (0.171/0.276/0.194), the
    same seed-sensitivity carried from dnaa-4 (the ATP-charging kinetics are seed-variable). So the
    switch mechanism generalises while the in-band fraction stays seed-1-calibrated. Once-per-generation
    (Haochen's criterion, an out-of-scope future test that does not gate dnaa-5): under the mass trigger
    the switch does not saturate once per cycle — per-gen saturation episodes [11,93,95,0,0,0,0,0,0],
    over-firing in gens 1-3 then not saturating in gens 4-9 (free DnaA-ATP drifts below threshold), the
    expected behaviour without phase-locking. Clean once-per-cycle firing needs the mechanistic
    DnaA-ATP/oriC trigger phase-locked to initiation plus a sustained DnaA-ATP level (out of scope).
    Cooperativity was also cross-checked in the classical varying-K_d (Adair) formulation: statically
    equivalent to Hill n=4, but dynamically it over-depletes DnaA-ATP at every cooperativity (finding
    F-KD), so the Hill form is the homeostasis-preserving one.

    The cooperative switch is the prerequisite for a DnaA-ATP/oriC initiation trigger to replace the
    cell-mass heuristic. That mechanistic-initiation work (and the RIDA once-per-cycle control) is in
    progress and set aside from this report for now, to keep study 5's cooperative-binding mechanism
    (which runs under the inherited mass trigger) clearly distinct from the initiation-trigger swap.
  verdict_status: in-progress
  verdict_detail: |-
    Both foundational studies pass. dnaa-0: v2ecoli reaches the succinate periodic steady state
    (oriC 1↔2 from gen 3, transient 4 in gens 1–2; reviewer-confirmed). Both acceptance tests were
    re-verified from the parquet (2026-05-31, scripts/verify_dnaa0_acceptance.py): oriC max ≤2 from
    gen 3, cell_mass CV birth 0.021 / peak 0.045. dnaa-1 passed 2026-06-09 at the canonical V=0.8e-3
    on the expert's in-band + steady criterion. A 7-point V-sweep (Rashmi's request: "tune the v
    value to get the DnaA levels to oscillate between 300-800... my guess would be 1e-3") plus a
    15-gen equilibration run and a multiseed were set per-run via the recorded --perturbation
    'TU00259[c]=V' override on one shared cache (out/cache_dnaa1_mechA_1.7e-3, each run overrode the
    baked 0.0017), full per-gen history, seed 1. V=0.8e-3 is the only V whose DnaA pool oscillates
    within [300,800] across the whole oscillation — steady-gen (4-7) cycle-mean
    336.5/337.5/359.5/414.8 (pooled ~362), peaks <800 (max 553), troughs ~207 — while keeping
    steady-state dynamics (oriC clean 1↔2 every gen, every gen divides), exactly the expert's ask.
    The dnaA init rate at V=0.8e-3 is ~0.6/min (gens 4-7 0.65/0.46/0.57/0.71), sub-physiological vs
    the ~1/min target: the known tradeoff, recorded as partial on the init-rate test. No single
    constitutive V closes both the in-band pool and the ~1/min rate; the rate hits ~1/min only at
    V≈1.0-1.1e-3, where the pool does not equilibrate in band (the completed 15-gen V=1.1e-3 run
    out/dnaa1_v1p1e-3_long shows the cycle-mean climbing over 800 — peak 976 @gen9, gens 6-12 ≥800 —
    then relaxing to 485 by gen15). Both the pool and the rate rise together with V, so closing both
    needs a regulated, cell-cycle-coupled DnaA synthesis lever (for Rashmi/Haochen). The earlier
    V=1.1e-3 pick was withdrawn: its 7-gen "676 in-band" reading was a pre-equilibration artifact,
    caught mid-ramp before the pool finished climbing over the ceiling. oriC is clean 1↔2 every gen,
    every gen divides, and the steady-state dynamics are seed-robust (multiseed seeds 0-3). The
    earlier "in-band 665-710" pass at V=1.7e-3 was a truncated-emit artifact (only ~43 s/gen, the
    post-division trough, was emitted before the now-fixed division history-wipe bug).

    2026-05-31 reviewer round (Rashmi): (1) dnaa-0 and dnaa-1 now carry explicit `runs:`
    provenance and canonical 6-axis status, so the report shows them as ran/evaluated/passed rather
    than "pending" (they previously declared completion but recorded no runs, a derive-on-read status
    gap now guarded by a new report-linter check). (2) dnaa-1's RNA-synth probability was re-tuned
    2e-3 → 1.7e-3 to reduce the pre-division DnaA peak overshoot (~28% → ~10–15% over the 800
    ceiling), CV 7.2% → 2.3%, oriC still clean; the residual peak excursion is intrinsic (the DnaA
    pool doubles per cycle). (3) the dnaa-2 canonical lineage was pinned to seed 0: seed 2 showed a
    within-cycle reinitiation at its 4th generation (oriC 1→2→4), while seeds 0 and 3 stay clean.

    dnaa-2 (DnaA-ATP/ADP nucleotide balance + intrinsic hydrolysis) passes. The earlier ~0.997
    DnaA-ATP pin was diagnosed (Haochen) as a fast-equilibrium artefact, not a parameter error:
    v2ecoli integrated the DnaA-ADP binding to steady state each tick, instantly reverting
    hydrolysis-made DnaA-ADP. Haochen's bf8b82e mechanism (adopted) keeps the DnaA-ADP reaction
    bidirectional but flags it integrate_dt=true (kinetic, literal k_r=1×10⁻⁷/s) and adds DnaA-ATP
    intrinsic hydrolysis (k=0.046/min) as a one-way kinetic reaction, driving the DnaA-ATP fraction
    off the pin and into the Boesen [0.2,0.5] band. The directed run (Rashmi 2026-06-04) was seed 1
    over 8 generations, evaluated on her generation-average criterion (initial gens may not strictly
    fall in band while stabilizing, so use the average). All four must-preserve behaviours pass:
    periodic mass doubling (8/8 divisions); oriC 1↔2, one init/gen (in {1,2} every gen); total DnaA
    in [300,800] on the generation average (avg 535; within-cycle peaks >800 pre-division are the
    expected accumulate-then-divide behaviour); and DnaA-ATP fraction in [0.2,0.5] on the generation
    average (all-gen avg 0.26, steady-gen avg 0.222). Canonical figure
    charts/dnaa2_reverify_multiseed.png. Secondary (not a blocker): per-gen averages trend to the low
    edge of the band in later gens, a total-DnaA dependence (diagnosis figure), with k_r the
    future-tuning lever for Haochen.

    dnaa-3 (DnaA-box binding), prepared for review. Haochen's spec wraps DnaA binding to 315 boxes
    in 4 affinity pools (302 chromosomal-high, 3 oriC-high, 8 oriC-low, 2 promoter-high) in fast
    equilibrium on the dnaa-2 baseline, without changing initiation. Design complete with a 6-step
    build plan; the 307-box chromosome map and the dnaa-2 baseline figure are attached. Now built and
    run (the read-only listener; see the 2026-06-07/08 update below).

    dnaa-3 (2026-06-07/08): the in-sim DnaA-box binding fires correctly inside the simulation as the provided read-only occupancy listener (4 affinity pools, fast equilibrium, full box set; three wiring fixes: bulk port type, read-only output topology, emitter overwrite-vs-accumulate). It reports free DnaA-ATP and per-pool occupancy with the dnaa-2 cell cycle preserved exactly. Correction (Rashmi 2026-06-08): an earlier pass had added a box-capacity cap=32 justified by outside ChIP-seq (Smith 2024) plus a DnaA sink and abundance/datA literature, none of which were provided. These have been withdrawn; only the provided mechanisms are modeled. The multi-generation read-only run (7 gens, full per-gen history) and the full plot set Rashmi requested are now done (oriC, cell mass, all DnaA forms bound+free, concentrations, ATP/ADP fraction across generations; box occupancy at a steady-state generation). Honest finding: the over-binding persists within the provided model. The DnaA-ATP fraction is in band (0.23), but free DnaA-ATP stays ~380-550 nM, about 4x the 100 nM oriC-low K_d, for 100% of every cycle across all 7 generations, so oriC-low occupancy holds ~0.8 throughout (the high-affinity pools saturate). So, contrary to the 2026-06-08 expectation, the correct DnaA-ATP fraction does not by itself leave the low-affinity sites modestly occupied; the over-binding is a real open question within the provided mechanisms (nothing in the provided read-only model lowers free DnaA-ATP), and we are not re-introducing a cap/sink to force it down. The withdrawn ideas (Smith ChIP-seq, abundance, datA) are recorded as proposed_inputs for Rashmi to accept or decline in the report.
  decisions_needed:
  - question: "dnaa-4 — the seed-sensitive DnaA-ATP fraction: is it acceptable, or does it warrant a follow-up? (Seeds 0/2 confirmation done: homeostasis robust 3/3, but the fraction band holds only on seed 1.) And should we advance into the downstream mechanistic roadmap (dnaa-05 RIDA/DDAH/DARS next)?"
    status: |
      Seeds 0/2 confirmed 2026-06-16 (F-08): the homeostasis (clean cell cycle + total-DnaA pool
      in [300,800]) is robust across seeds 0/1/2; the DnaA-ATP fraction band [0.2,0.5] is not,
      holding in band only on seed 1 (0.261), with seed 0 (0.156, ramping toward band by late gens)
      and seed 2 (0.085, erratic) below. dnaa-4 stays partial on the fraction. Open: whether this
      seed-sensitivity is acceptable for the mechanism verdict or warrants a follow-up (longer runs
      to test whether seed 0's slow ATP charging settles in band, or a k_h / charging-kinetics
      recalibration). Separately, the roadmap studies (RIDA/DDAH/DARS, seqA, cooperativity,
      validation) are scaffolded but not yet started, awaiting a go-ahead on sequencing them.
    context: |
      The dnaa-4 reference (linear s=0.6 + F-05, V=1.5e-3, k_h=0.025) was verified on seed 1
      (matches Rashmi's PDF); the seeds 0/2 confirmation closed the coincidence-vs-robust question
      the same way dnaa-1/2 were multi-seeded, finding the homeostasis robust but the fraction band
      seed-1-specific.
  - question: "dnaa-2 — resolved and passing (was the mechanism + clean-reproduction question)."
    status: |
      Resolved 2026-06-04, dnaa-2 passes. Mechanism: Haochen's bf8b82e (DnaA-ADP reaction
      bidirectional + integrate_dt=true, literal k_r=1×10⁻⁷/s; DnaA-ATP intrinsic hydrolysis
      one-way), superseding the rejected DnaaAdpRelease/0.03-min workaround. Reproduction: Rashmi
      directed a seed-1 8-gen run and clarified the acceptance criterion (2026-06-04: "initial
      generations might not strictly fall in band while stabilizing, consider the generation
      average"). On the generation-average criterion all four behaviours pass: mass-doubling, oriC
      one-init/gen, total-DnaA avg 535 in [300,800], DnaA-ATP fraction avg 0.26 in [0.2,0.5].
      Secondary (not a blocker): per-gen averages trend to the low edge in later gens, a total-DnaA
      dependence; k_r is the future-tuning lever for Haochen.
    context: |
      Mechanism and in-band fraction region validated; the open item is a clean per-gen reproduction
      across a full 8-gen lineage on the seed Rashmi confirmed (seed 1).
  - question: dnaa-3 — DnaA-box binding design (Haochen's spec, 4 affinity pools, 315 boxes, fast equilibrium on the dnaa-2 baseline) is prepared. Does the first-step design look right before we build it, especially low-aff K_d≈100 nM with cooperativity deferred (vs the brief's 50→1 nM range), and tracking bound-ATP/bound-ADP separately on high-aff pools?
    status: "Resolved and passing. The cap=32 sink (and the Smith-2024/abundance/datA additions) were withdrawn 2026-06-08 as non-provided. The over-binding was instead resolved by adopting Rashmi's active Langmuir binding (PR #162), which depletes the free DnaA-ATP pool (the missing physics) and fixes box-doubling (8→16 low-aff via fork-passage release). Under the dnaa-4 autoregulation reference the box-binding re-run passes all 6 acceptance tests (oriC-low occupancy 0.04-0.17, free DnaA-ATP ~5-11 nM, DnaA-ATP fraction 0.284 in band). dnaa-3 gate_status: pass."
    context: |
      dnaa-3 is design-complete with a 6-step build plan, the 307-box chromosome
      map (from the WCM genome), and the dnaa-2 baseline figure attached. The 8
      oriC low-affinity coordinates are still provisional (to be extracted exactly
      from the oriC sequence at build). Gated on dnaa-2's baseline holding.
  - question: dnaa-0 succinate run reaches per-cell periodic steady state with oriC oscillating 1 ↔ 2 at steady state (transient overshoot to 4 in early gens allowed) — pass or fail?
    status: Resolved 2026-05-30, pass (Rashmi review)
    context: |
      Initialization task per PDF: run ParCa with succinate as the growth
      condition, then run v2ecoli single_daughters and check convergence.
      Resolution (Rashmi 2026-05-30, "this looks correct"): the followed
      daughter's oriC is periodic 1 → 2 → 1 → 2 from generation 3 onwards
      (the steady state). The brief overshoot to oriC = 4 in the early
      generations is the expected not-yet-steady-state signature, not a
      failure; the prior "never reaches 4" framing was corrected. Cell
      mass is correspondingly periodic. The generation-3 state is saved as
      the canonical succinate steady-state initial condition
      (out/steady_state_inputs/succinate_default_gen3_start.dill) and
      dnaa-1 is unblocked.
  - question: dnaa-1 RNA-synthesis-probability tuning holds the DnaA monomer pool oscillating in [300,800] with steady cell-cycle dynamics across the succinate lineage — what V, and does the ≈1/min init rate come along for free?
    status: |
      Resolved 2026-06-09, pass at the canonical V=0.8e-3 on the expert's in-band +
      steady criterion. V=0.8e-3 is the only V whose DnaA pool oscillates within
      [300,800] (steady-gen cycle-mean ~362, peaks <800, troughs ~207) while
      keeping steady dynamics (oriC 1↔2, every gen divides), her ask. The ~0.6/min
      init rate is the known tradeoff (init-rate test partial): no single
      constitutive V closes both the band and the ~1/min rate (7-point sweep + the
      15-gen V=1.1e-3 equilibration run that overshoots), so closing both needs a
      regulated synthesis lever (Rashmi/Haochen). The earlier V=1.1e-3 pick is
      withdrawn (7-gen "676 in-band" was a pre-equilibration artifact).
    context: |
