  statement: 'The chain closes on one structural fact: the model fits against basal_prob and runs against the ppGpp-adjusted vector.'
  summary: |
    Nine studies, and the whole phenomenon reduces to a single mismatch. The replication
    stall, the limiting pool, the transcription deficit, the protein shortfall and the
    fit-runtime disagreement are all consequences of ParCa fitting against one probability
    vector while TranscriptInitiation transcribes according to another.

    For dnaG the two accounts agree quantitatively: the vectors differ by 3.99x and the
    fit-runtime gap is 6.85x, matching within the mass balance's resolution.

    The bound on the claim matters as much as the claim. The mechanism does NOT generalise
    -- correlation 0.318 across the transcriptome -- so it explains dnaG without explaining
    the model. What decides the repair is a question this study deliberately does not
    answer: whether ParCa should fit against the in-force vector, or the runtime should
    stop substituting.
  expected:
    summary: No pre-registered expectation; a synthesis after the measurements.
