schema_version: 4
name: dnag-protein-mass-balance
title: DnaG protein mass balance
created: '2026-09-03'
status: planned
phase: Design
study_type: diagnostic
investigation: transcription-rewiring

question: >-
  dnaG's transcription deficit is 5.4x but its protein sits 21.6x below ParCa's
  fitted count, leaving 4x unexplained. Does a mass balance over the measured
  transcription rate, translation efficiency, degradation and dilution predict
  the observed protein, or is a mechanism genuinely missing?

biological_summary: |
  This study exists because a chain of inference stopped closing when one of its
  numbers was corrected.

  dnag-production-deficit argued that a transcription shortfall explains DnaG's
  protein deficit. At the magnitude then believed -- ~52x -- that inference was
  comfortable: the transcription deficit over-explained the 21.6x protein gap
  with room to spare, so no residual was sought and none was found.
  probability-in-force-reference corrected the magnitude to 5.4x, because the
  earlier figure divided by a vector the model does not use. At 5.4x the deficit
  under-explains the gap by 4x.

  The obvious patch is unavailable. dnaG's translation efficiency is 10.1x below
  the median, which would more than cover the residual, but that efficiency is a
  ParCa input consumed by the very fit that produced the 38-copy expectation.
  Invoking it again to explain a departure FROM that fit counts it twice.

  Four explanations remain, and they are not variations on one idea.

  The comparison may be malformed. A fitted steady-state count and a
  time-averaged simulated count are different quantities. Protein is halved at
  every division and degraded continuously, and DnaG sits at zero for 62% of the
  cycle, so its mean of 1.76 may not be the thing ParCa's 38 predicts. If a
  mass balance built from the measured rates reproduces 1.76, there is no missing
  mechanism and the residual was an artefact of comparing incommensurable
  quantities.

  ParCa's expectation may itself be wrong for the same reason basal_prob was. The
  fit assumes a transcription rate; if the ppGpp path does not deliver that rate,
  38 is not what the simulation should be expected to produce. That would be the
  third instance of the same error in this investigation, which is precisely why
  it is written as an axis rather than assumed away.

  The double-counting objection may not hold. It holds only if the efficiency the
  fit assumed and the efficiency applied at runtime are the same number. If they
  differ, the difference is a legitimate additional term, and the question becomes
  empirical rather than a matter of bookkeeping.

  Or a mechanism really is missing, and the residual is a genuine defect.

  The study is built so the deflationary answer -- that the residual is an
  artefact of the comparison -- is reachable, because that outcome would retract
  the framing rather than confirm it, and this investigation has three times
  preferred the convenient reading.

assumptions:
- text: >-
    listeners.monomer_counts gives per-monomer protein counts, so DnaG protein
    can be read directly rather than inferred from bulk.
  verified_in_v2ecoli: false
- text: >-
    At steady state, protein count is approximated by
    (transcripts/time x translation efficiency) / (degradation rate + growth
    dilution rate).
  verified_in_v2ecoli: false

pipeline_gate:
  prerequisites:
  - study: probability-in-force-reference
    condition: tests-passed
    relation: leads-to
    outputs_used:
    - dnaG transcription deficit 5.40x against the in-force reference
    - The finding that basal_prob is not the reference the model consults
  enables: []
  proceed_condition: >-
    The 4x residual is either explained by the mass balance and dilution, or
    localised to a specific missing term.

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants: []
  model_settings: []

baseline:
- name: baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []

units_and_time:
  tick: 1 tick = 1 s of simulated time (composite time_step=1)
  quantities:
    protein count: molecule copies per cell
    transcription rate: transcripts per second
    translation efficiency: dimensionless ParCa input
    degradation rate: per second, first order
    dilution rate: per second, ln(2)/generation time

# ---------------------------------------------------------------------------
# All axes open at design time. Nothing about the mass balance has been computed.
# Carried in from prior studies and recorded as pins: the 5.40x transcription
# deficit, the 21.6x protein gap, and the 10.1x translation-efficiency shortfall.
# ---------------------------------------------------------------------------
behavior_tests:
- name: mass-balance-predicts-observed-protein
  classification: primary
  gate_class: acceptance_criterion
  question: Does a mass balance over measured rates reproduce the observed protein?
  description: >-
    The mass-balance prediction for DnaG is within a factor of 2 of the observed
    simulated count.

    The deflationary hypothesis, and the one that would dissolve the residual.
    If production from the MEASURED transcription rate, divided by degradation
    plus growth dilution, reproduces the observed count, then no mechanism is
    missing and the 4x arose from comparing a time-averaged count against a
    fitted steady-state one.

    Threshold provenance: theory. A factor of 2 is loose for a first-order mass
    balance with independently measured terms; if the balance is right it should
    do considerably better, and if it is wrong a factor of 2 will not rescue it.
  measure:
    kind: derived
    detail: >-
      predicted DnaG count from (transcription rate x translation efficiency) /
      (degradation + dilution), divided by the observed mean simulated count.
  pass_if:
    op: <
    value: 2.0
    provenance:
      kind: theory
      note: Loose band for a first-order balance with independently measured terms.
  status: pending

- name: mass-balance-works-for-controls
  classification: control
  gate_class: acceptance_criterion
  question: Does the same balance predict proteins that are not in deficit?
  description: >-
    The same mass balance, applied to a set of comparison monomers whose
    transcripts behave normally, predicts their observed counts within a factor
    of 2 for at least 70% of them.

    Instrument check, and the axis that makes the primary one interpretable. If
    the balance cannot predict ordinary proteins, a failure on DnaG says nothing
    about DnaG. If it predicts ordinary proteins well and fails only on DnaG,
    the residual is real and DnaG-specific.

    Threshold provenance: theory. 70% allows for the balance being an
    approximation without letting a broadly-wrong model pass.
  measure:
    kind: derived
    detail: >-
      fraction of comparison monomers whose predicted/observed ratio lies within
      a factor of 2.
  pass_if:
    op: '>='
    value: 0.7
    provenance:
      kind: theory
      note: Tolerates approximation; rejects a broadly-wrong balance.
  status: pending

- name: parca-expectation-matches-delivered-transcription
  classification: primary
  gate_class: acceptance_criterion
  question: Is ParCa's 38-copy fit consistent with the transcription the model delivers?
  description: >-
    The transcription rate implied by ParCa's fitted DnaG count is within a
    factor of 2 of the rate the simulation actually delivers.

    Tests whether the 38-copy expectation is itself malformed, in the same way
    basal_prob was. If ParCa assumes a transcription rate the ppGpp path never
    delivers, then 38 is not what the simulation should produce and the 21.6x
    gap is partly an artefact of the expectation rather than of the model's
    behaviour.

    Written as an axis rather than assumed because this investigation has twice
    found a reference quantity to be the wrong one, and assuming the third time
    would be the same error in a new place.

    Threshold provenance: theory, and the same factor of 2 used throughout for
    comparability.
  measure:
    kind: derived
    detail: >-
      transcription rate implied by inverting the mass balance at ParCa's fitted
      count, divided by the measured transcription rate.
  pass_if:
    op: <
    value: 2.0
    provenance:
      kind: theory
      note: Same band as the other balance axes, for direct comparability.
  status: pending

- name: fitted-and-runtime-translation-efficiency-agree
  classification: primary
  gate_class: acceptance_criterion
  question: Is the double-counting objection actually valid?
  description: >-
    The translation efficiency applied at runtime equals the one ParCa's fit
    consumed, within 10%.

    Settles a bookkeeping question empirically instead of by argument. The
    objection that translation efficiency cannot explain the residual -- because
    the fit already consumed it -- holds only if the fit and the runtime use the
    same value. If they differ, the difference is a legitimate additional term
    and the residual may be explained after all.

    A PASS confirms the double-counting objection and keeps translation
    unavailable as an explanation. A FAIL reopens it.

    Threshold provenance: theory. 10% is tight because these should be the
    identical number if the objection holds; anything looser would not
    distinguish agreement from coincidence.
  measure:
    kind: derived
    detail: >-
      abs(runtime translation efficiency / ParCa-input translation efficiency - 1)
      for dnaG.
  pass_if:
    op: <
    value: 0.1
    provenance:
      kind: theory
      note: Tight, because agreement here should be exact if the objection holds.
  status: pending

- name: transcription-deficit-is-5x-not-52x
  classification: supporting
  gate_class: regression_pin
  description: >-
    dnaG's transcription deficit against the in-force reference remains ~5.4x.

    POST-HOC: measured in probability-in-force-reference. A pin so a future
    change that alters the corrected magnitude is noticed here, since the whole
    arithmetic depends on it.
  measure:
    kind: derived
    detail: comparison-group ratio divided by dnaG's ratio, both against the in-force reference.
  pass_if:
    op: <
    value: 10.0
    provenance:
      kind: post_hoc
      note: Measured in the prior study; pin only.
  status: pending

preregistered:
  declared_before_runs: true
  registered_at: '2026-09-03T18:52:50Z'
  criteria:
  - test: mass-balance-predicts-observed-protein
    prior: >-
      Open, and the deflationary outcome. A pass means no mechanism is missing
      and the 4x was an artefact of comparing a mean against a fitted
      steady-state value.
  - test: mass-balance-works-for-controls
    prior: The instrument check; a failure makes the primary axis uninterpretable.
  - test: parca-expectation-matches-delivered-transcription
    prior: >-
      Open. Tests whether the 38-copy expectation is malformed in the same way
      basal_prob was.
  - test: fitted-and-runtime-translation-efficiency-agree
    prior: >-
      Open. Settles empirically whether the double-counting objection holds.
  predictions:
  - >-
    CARRIED IN from prior studies and recorded as pins rather than findings:
    dnaG's transcription deficit is 5.40x against the in-force reference; the
    observed sim-vs-fit protein gap is 21.6x (38 fitted, 1.76 simulated); dnaG's
    translation efficiency is 2.272e-05 against a median of 2.298e-04 (10.1x
    low); DnaG is at zero for 62% of the cycle.
  - >-
    NOT computed at design time: any mass balance, any predicted count, and any
    comparison between ParCa's implied transcription rate and the delivered one.

  thresholds:
    mass-balance-predicts-observed-protein:
      op: <
      value: 2.0
      provenance:
        kind: theory
        note: Loose band for a first-order balance with independently measured terms.
    mass-balance-works-for-controls:
      op: '>='
      value: 0.7
      provenance:
        kind: theory
        note: Tolerates approximation; rejects a broadly-wrong balance.
    parca-expectation-matches-delivered-transcription:
      op: <
      value: 2.0
      provenance:
        kind: theory
        note: Same band as the other balance axes, for direct comparability.
    fitted-and-runtime-translation-efficiency-agree:
      op: <
      value: 0.1
      provenance:
        kind: theory
        note: Tight, because agreement here should be exact if the objection holds.
readouts:
- name: dnag-protein-count
  store_path: listeners.monomer_counts
  description: >-
    Per-monomer protein counts including EG10239-MONOMER. Must be verified as
    POPULATED, not merely present -- promoter_copy_number was declared available
    in an earlier study and emitted empty arrays on every timestep.
  units: copies per cell
  status: derived-needed
- name: dnag-transcript-count
  store_path: bulk.count
  description: TU00352 mRNA counts, the production term of the balance.
  units: copies per cell
  status: available
- name: generation-time
  store_path: derived
  description: >-
    Per-generation duration from the runner summaries, giving the dilution rate
    ln(2)/tau.
  units: minutes
  status: available

implementation_requirements:
- id: req-1
  kind: data
  title: Verify monomer_counts is populated, not merely declared
  status: planned
  effort: XS
  description: >-
    Confirm the monomer_counts listener carries non-empty arrays across
    timesteps before relying on it. An earlier study declared
    promoter_copy_number available on the strength of the column existing; it
    emitted zero-length arrays on all 2528 timesteps and made an axis
    ungradable. Check data, not schema.
  unblocks:
  - mass-balance-predicts-observed-protein
  - mass-balance-works-for-controls

robustness:
  n_replicates: 3
  seeds: [0, 1, 2]
  parameter_sweep: false
  note: >-
    Reuses the existing 3 seed x 3 generation sweep. The balance is deterministic
    given measured rates; seeds enter only through the rate estimates.

controls:
- name: mass-balance-works-for-controls
  kind: positive
  hypothesis: >-
    A first-order mass balance should predict the counts of proteins whose
    transcripts behave normally. If it cannot, it cannot be used to judge DnaG.
  expected: within a factor of 2 for at least 70% of comparison monomers.
  observed: ''
  result: PENDING

alternative_hypotheses:
- claim: >-
    The residual is an artefact of comparing a time-averaged count against a
    fitted steady-state one, ignoring dilution and degradation.
  discriminated_by: mass-balance-predicts-observed-protein.
  status: untested
- claim: >-
    ParCa's 38-copy expectation is malformed because it assumes a transcription
    rate the ppGpp path does not deliver.
  discriminated_by: parca-expectation-matches-delivered-transcription.
  status: untested
- claim: >-
    The double-counting objection is wrong because the fitted and runtime
    translation efficiencies differ, making translation a legitimate term.
  discriminated_by: fitted-and-runtime-translation-efficiency-agree.
  status: untested
- claim: A mechanism is genuinely missing and the residual is a real defect.
  discriminated_by: >-
    All three axes above failing while the control passes.
  status: untested

falsifiability: >-
  The missing-mechanism framing is overturned if the mass balance reproduces the
  observed count, which would make the residual an artefact of the comparison. It
  is also overturned if ParCa's expectation proves inconsistent with the delivered
  transcription, which would make the 21.6x gap partly an artefact of the
  expectation. The study itself is invalidated if the balance cannot predict
  ordinary proteins.

limitations:
- >-
  A first-order mass balance ignores burst kinetics and the discrete, low-copy
  regime DnaG occupies -- it sits at zero 62% of the time, where a continuous
  steady-state approximation is least trustworthy.
- >-
  The sweep is reused rather than repeated.
- >-
  Agreement within a factor of 2 would show the balance is consistent with the
  observation, not that the modelled mechanism is biologically correct.
- >-
  Single medium and condition.
- >-
  Three quantities are carried in from prior studies as pins and cannot be
  tested here, only relied upon.

conclusion_logic:
  if_primary_tests_pass: >-
    The mass balance reproduces the observed protein from measured rates, so no
    mechanism is missing: the 4x residual was an artefact of comparing a
    time-averaged count against a fitted steady-state one, and the corrected 5.4x
    transcription deficit is sufficient to explain DnaG's scarcity after all.
  if_primary_tests_fail:
    summary: >-
      If the balance fails on DnaG but passes the control, a mechanism is genuinely
      missing and the residual is real. If ParCa's expectation is inconsistent with
      delivered transcription, the gap is partly an artefact of the expectation. If
      the fitted and runtime efficiencies differ, translation becomes available as
      an explanation after all.
    diagnose:
    - question: Is the 4x residual an artefact of the comparison or a missing mechanism?
      note: Answered by the primary axes together with the control.

discovery_implications:
  resolved_uncertainties: []
  remaining_uncertainties: []
  followup_study_proposals: []

canonical_runs:
- name: default
  script: studies/dnag-protein-mass-balance/analyses/measure.py
  args: []
  label: dnag-protein-mass-balance
  default: true

visualizations: []

design_status: complete
implementation_status: not_started
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested
