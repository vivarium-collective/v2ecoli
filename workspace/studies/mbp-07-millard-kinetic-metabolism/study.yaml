schema_version: 3
name: mbp-07-millard-kinetic-metabolism
created: '2026-06-14'
phase: Evaluate
study_kind: diagnostic   # build -> validate -> head-to-head report-card comparison

design_status: drafted
implementation_status: in_progress
simulation_status: smoke_run
evaluation_status: not_evaluated
expert_review_status: not_requested

# ─── Consolidated Millard arc ──────────────────────────────────────────────
# This study merges the former mbp-07 (build), mbp-08 (validate), and mbp-09
# (reactor comparison) into one build->validate->compare arc. The "-swap"
# suffix was dropped from the slug: the study now covers the full lifecycle,
# not just the metabolism swap. Three baseline arms:
#   - baseline_millard:               the Millard kinetic cell (build/validate)
#   - reactor_bird_coupled_millard:   the Millard cell coupled to the BiRD reactor
#   - reactor_bird_coupled:           the WCM-FBA cell coupled to the same reactor (contrast)
baseline:
- name: baseline-millard
  composite: v2ecoli.composites.ecoli_millard
  params: {seed: 0, cache_dir: out/cache}
- name: reactor-bird-coupled-millard
  composite: v2ecoli.composites.reactor_bird_coupled_millard
  params: {seed: 0, cache_dir: out/cache}
- name: reactor-bird-coupled
  composite: v2ecoli.composites.reactor_bird_coupled
  params: {seed: 0, cache_dir: out/cache}

purpose:
  question: |
    The Millard kinetic-metabolism arc, end-to-end. Can the Millard 2017
    kinetic central-carbon ODE replace v2ecoli's constraint-based central-
    carbon FBA as a drop-in cell engine under the cell-side interface
    contract?

    Three linked questions:
      1. BUILD     — does the swapped composite (baseline_millard) build and
                     run, with non-trivial live central fluxes (kinetic ODE
                     active, not FBA)?
      2. VALIDATE  — does the Millard whole-cell model recover growth
                     comparable to the FBA baseline, and (once the Millard
                     cell exposes mass-exchange accounting) close mass
                     conservation?
      3. COMPARE   — coupled to the same BiRD reactor and run against the
                     Beulig WT batch prefix, does the Millard kinetic central
                     metabolism track the bioreactor (growth, substrate, gas
                     transfer) BETTER than v2ecoli's WCM-FBA — and how do both
                     compare to the iML1515 genome-scale FBA (Palsson)?
                     Rendered as a structured 3-arm report-card comparison
                     (per-group axis verdicts + categorized divergences),
                     NOT a tolerance gate (execute-and-report, per
                     chris_feedback_2026_05_26 §10).

implementation_requirements:
- id: req-1-millard-exchange-accounting
  kind: process
  effort: M
  title: Millard cell exposes O2/CO2 exchange to the reactor coupler
  description: |
    The Millard cell (baseline_millard) replaced FBA metabolism, so it does NOT
    populate `agents.*.environment.exchange` with O2/CO2 — which is what
    ReactorCellCoupler reads to drive reactor consumption. Without this the
    Millard-coupled reactor is degenerate (cell consumes no reactor O2; DO stays
    at saturation). The Millard 2017 model HAS an O2 species + central fluxes, so
    translate Millard's O2 uptake / CO2 evolution (central_fluxes) into the cell-
    side exchange the coupler consumes (counts into environment.exchange, or a
    Millard-aware coupler input). This is the deferred Millard mass-exchange
    accounting (also unblocks the wcm-mass-conservation gate on the Millard cell).
  unblocks: [the Millard arm + wcm-mass-conservation-closes-millard on baseline_millard]
  status: done
- id: req-2-millard-coupled-composite
  kind: composite
  effort: S
  title: reactor_bird_coupled (Millard variant)
  description: |
    A composite coupling baseline_millard (instead of baseline_population's FBA
    cell) to BiRDTransportHours + ReactorCellCoupler — i.e. the mbp-03 wiring with
    the Millard cell engine swapped in (the cell-side interface contract makes this
    a drop-in). Likely a `cell_engine` param on reactor_bird_coupled, or a sibling
    reactor_bird_coupled_millard.
  status: done
- id: req-3-beulig-report-card
  kind: harness
  effort: M
  title: Reuse the mbp-05 Beulig comparison harness for all arms
  description: |
    Run the arms against the Beulig batch prefix through the mbp-05 comparison
    harness, producing a report_card_verdict.json per arm at the card paths below,
    so the report_card_axis tests grade them. Reuses mbp-05's comparison_overlays
    + grader (req: mbp-05 built). Now covers THREE arms — the Millard kinetic cell
    (millard_vs_beulig), the WCM-FBA cell (vs_beulig), and the iML1515 genome-scale
    FBA contrast (iml1515_vs_beulig).
  status: done (smoke run; full ~33h batch run is follow-up)

# ─── Behavior tests ────────────────────────────────────────────────────────
# Merged from the three former studies:
#   BUILD    (mbp-07): composite-builds-and-runs, central-fluxes-nontrivial
#   VALIDATE (mbp-08): growth-recovered-vs-baseline
#   DEFERRED (mbp-08 -> mbp-09, now live): wcm-mass-conservation-closes-millard
#   COMPARE  (mbp-09): report_card_axis tests, now for ALL THREE arms.
# The report-card tests are diagnostic (execute-and-report); their verdicts
# categorize divergences that feed mbp-06 and show where kinetic metabolism
# tracks Beulig better than FBA.
behavior_tests:

# ── BUILD ──
- name: composite-builds-and-runs
  measure: {kind: derived, formula: "listeners.mass.cell_mass", window: full_lineage_from_gen_0}
  pass_if: {op: ">", value: 0.0}
  acceptance_form: qualitative_direction
- name: central-fluxes-nontrivial
  measure: {kind: derived, formula: "central_fluxes.PGI", window: full_lineage_from_gen_0}
  pass_if: {op: "!=", value: 0.0}
  acceptance_form: qualitative_direction

# ── VALIDATE ──
- name: growth-recovered-vs-baseline
  measure: {kind: derived, formula: "listeners.mass.instantaneous_growth_rate", window: full_lineage_from_gen_0}
  pass_if: {op: in_range, low: 0.0, high: 0.04}
  cites: [Monod1949AnnRevMicrobiol]
  acceptance_form: quantitative_range

# Deferred from the old mbp-08; once req-1 landed, the Millard cell exposes
# exchange and this mass-conservation gate becomes evaluable on the Millard arm.
- name: wcm-mass-conservation-closes-millard
  classification: diagnostic
  measure: {kind: derived, formula: "listeners.mass.conservation_relative_cumulative", window: full_lineage_from_gen_0}
  pass_if: {op: in_range, low: 0.0, high: 0.05}
  cites: [agmon2022]
  acceptance_form: quantitative_range

# ── COMPARE: Millard arm vs Beulig (card millard_vs_beulig) ──
- name: millard-growth-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: growth}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: millard-substrate-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: substrate}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: millard-gas_transfer-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: gas_transfer}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: kinetic-vs-fba-tracking-summarized
  classification: primary
  question: Is the head-to-head (Millard kinetic vs WCM-FBA vs iML1515, all vs Beulig) rendered with a per-group winner and categorized divergences feeding mbp-06?
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: summary}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range

# ── COMPARE: WCM-FBA arm vs Beulig (card vs_beulig) ──
- name: wcm-growth-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/vs_beulig, group: growth}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: wcm-gas_transfer-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/vs_beulig, group: gas_transfer}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range

# ── COMPARE: iML1515 genome-scale FBA arm vs Beulig (card iml1515_vs_beulig) ──
- name: iml1515-growth-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/iml1515_vs_beulig, group: growth}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: iml1515-tracking-summarized
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/iml1515_vs_beulig, group: summary}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range

open_questions:
- id: bird-o2-saturation-temperature-sign-bug
  text: |
    pbg-bioreactordesign#2 — dissolved-O2 saturation has the wrong temperature
    sign (masked at 298 K; biases c*(O2) high at the 310 K target). All arms
    compare against the same biased c*, so the head-to-head is unaffected, but
    absolute DO magnitudes vs Beulig are biased until fixed upstream.
- id: millard-mass-balance-non-closure
  text: |
    The Millard cell accounts nutrient mass via bulk deltas (Millard writes bulk
    directly), so the standard MassConservationDeriver (which reads
    environment.exchange) historically emitted None on the Millard arm. req-1
    routed Millard's uptake/evolution into the cell-side exchange so the
    wcm-mass-conservation-closes-millard gate can evaluate. UPDATE (#225 item-5,
    2026-06-15): the dominant residual was un-tracked CO2 (decarboxylation) and
    H2O (respiration) efflux — the Millard SBML holds HCO3/H2O as FIXED buffers,
    so O2/glucose uptake looked like phantom mass import. CO2+H2O efflux is now
    reconstructed from reaction stoichiometry and emitted to environment.exchange
    (BYPRODUCT_EFFLUX_REACTIONS). The gate now CLOSES on a sustained 100-step
    run: conservation_relative_cumulative 8.09 BEFORE -> 0.0284 AFTER (< 0.05),
    a ~285x reduction (net mass-in +2.46->+0.09 fg). At 40 ticks it's still ~1.4
    during the early flat-growth transient (tiny Δcell_mass denominator) but
    converges below 5% by ~80-100 steps. Mass closure is now decoupled from the
    slow-growth limitation (see mbp-06 millard-growth-too-slow-to-divide): the
    cell still grows far slower than FBA and will not divide, but the boundary
    mass balance itself is closed.

# `tests:` must be a list — a dict here breaks collect_emit_paths_from_spec
# in the study-run path. Pytest wiring lives in pytest_tests:, as in mbp-03.
tests: []
pytest_tests:
  auto_discover: true
  data_source: latest_run
  pytest_args:
  - tests/test_baseline_millard.py

readouts:
- name: cell_mass
  store_path: listeners.mass.cell_mass
  units: fg
  status: planned
- name: central_flux_PGI
  store_path: central_fluxes.PGI
  units: mmol/(gDW·h)
  status: planned
- name: growth_rate
  store_path: listeners.mass.instantaneous_growth_rate
  units: 1/s
  status: planned
- name: mass_conservation_relative_cumulative
  store_path: listeners.mass.conservation_relative_cumulative
  units: fraction
  status: planned

