- id: F-07
  kind: computational
  tier: interpretation
  mechanism_origin: engineered
  status: partial
  statement: 'The transcription deficit originates in how target synthesis probabilities are computed:
    the value in force is 93x depressed, 25x below the cohort''s own basal_prob, with regulation excluded.'
  summary: 'Five studies converge here. A replication arrest led to DnaG, DnaG led to a

    transcript that is barely made, that transcript led to a cohort of six, and the

    cohort''s cause is now located: the probability the process actually uses is ~93x

    below its peers and ~25x below the basal_prob the cache advertises.


    Regulation is excluded by measurement, not assumption -- zero TFs bound on both

    sides, and actual tracks target to within 0.1%. So the suppression is introduced

    wherever target probabilities are computed, upstream of both regulation and

    selection.


    This also explains a methodological failure that cost this investigation two

    reversed conclusions. basal_prob is not what the process uses; for these transcripts

    it is off by 25x. Any diagnosis that reads it -- as dnag-production-deficit did --

    is reading a number the model never consults.


    Marked engineered: nothing was tuned to produce this; it follows from how the model

    computes and normalises synthesis probability.

    '
  expected:
    summary: No pre-registered expectation; a synthesis after the measurements and a hypothesis for the
      next study.
  evidence:
    from_run: runtime-synthesis-probability__sweep
    from_test: runtime-probability-is-depressed
  provenance:
    run_ids:
    - runtime-synthesis-probability__sweep
  next_action: Trace where target_rna_synth_prob is computed and find what reduces it ~25x below basal_prob
    for these transcripts.
  next_action_type: escalate_model
  review_note: 'CORRECTED 2026-09-03 after the question ''how sure are you on the regulation?''.

    The exclusion of regulation was OVERSTATED and rests on one valid leg and one

    invalid one.


    VALID: no transcription factor is bound. Re-checked with a stronger statistic than

    the median originally used -- mean 0.0000, max 0.0000, any-binding on 0.0% of 7584

    timesteps, for both cohort and comparison. The ADDITIVE TF path cannot be firing.


    INVALID: ''actual tracks target to 0.1%, so nothing between target and use removes

    the probability.'' target_TU_synth_probs is returned by _synthesis_probabilities

    (transcript_initiation.py:764-769), which contains the ENTIRE assignment path

    including the delta_prob . bound_TF term. Both quantities are therefore

    POST-regulation and differ only by RNAP crowding (max_p, tu_is_overcrowded). The

    1.001 ratio shows crowding does not affect these transcripts; it says nothing

    whatever about regulation. The study''s own assumptions block flagged this as

    verified_in_v2ecoli: false and the conclusion leaned on it anyway.


    UNEXAMINED, and now the leading hypothesis: ppgpp_regulation is TRUE in this cache.

    When ppgpp_state carries a basal vector, transcript_initiation.py:547-556 REPLACES

    basal_prob with the ppGpp-adjusted vector and makes the TF effect multiplicative via

    an accessibility gain b^2/(b+K) whose own comment says it goes ''smoothly -> 0 for

    silent genes''. That path requires no TF binding, so zero TFs bound does not exclude

    it.


    Also newly noted: the configured delta_prob sum for these transcripts is almost

    exactly -basal_prob (TU00352 basal 1.213e-04, delta -1.213e-04; TU00062 1.631e-04,

    -1.631e-04), i.e. regulators wired to null the gene. That is the opposite of

    evidence that regulation is irrelevant here.


    Consequence: the ''25x below basal_prob'' framing may be measuring against the wrong

    reference vector entirely. Study probability-in-force-reference is designed to settle

    which vector is in force.

    '
conclusion: 'The deficit is an assignment defect, and it is located upstream of regulation.


  The probability the transcription process actually uses is 4.88e-06 for the cohort

  against 4.53e-04 for the 294 comparable transcripts -- 93x depressed. It tracks its

  own target to within 0.1% (1.001) with zero transcription factors bound on either

  side, so nothing between target and use removes it and regulation is excluded by

  measurement rather than by assumption. The suppression is already present when the

  target is computed.


  The instrument checks out: for the comparison group actual and target agree to a

  fold of 1.00, which is what these columns should look like when nothing is wrong.


  A secondary effect exists and is reported honestly rather than dismissed. Given the

  probability in force, the cohort is drawn at 0.380 of the comparison group''s

  efficiency, failing the pre-registered 0.5 bar. That is ~2.6x against an assignment

  gap of ~93x, so assignment dominates by more than an order of magnitude, and with

  six cohort members the ratio is within reach of sampling noise. It is recorded as a

  genuine but weakly-powered signal needing a larger cohort, and the threshold was not

  moved to accommodate it.


  The most consequential number is one the study did not set out to produce: the

  in-force probability is 25x below TU00352''s own basal_prob of 1.21e-04. basal_prob

  is not what the process uses. That is why four studies of static ParCa attributes

  found nothing, and it is the root cause of the reversed conclusion in

  dnag-production-deficit, which ranked basal_prob at the 91.9th percentile and

  concluded dnaG was not starved of transcription.


  Next: trace where target_rna_synth_prob is computed and find what reduces it ~25x

  below basal_prob for these transcripts. The defect is now localised to a single

  computation rather than a class of possibilities.

  '
