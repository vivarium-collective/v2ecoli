schema_version: 4
name: dnag-locus-targeted-fix
title: One edge
investigation: transcription-rewiring
study_type: fix_validation
phase: Design
created: '2026-09-04'
status: running
design_status: complete
implementation_status: complete
simulation_status: running
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested
question: 'promoter-specific-regulation showed the attribution rule removes the LexA edge on TU00352 exactly
  as predicted, but strips 89.5% of the network and so cannot be applied generally from this export. At
  the dnaG locus the evidence is POSITIVE rather than an absence: LexA''s site is present at 3210729-3210749
  and matches TU00435''s start to 0.5 bp, while TU00352''s start lies 88.5 bp away. Does removing that
  single misattributed edge rescue the lineage?'
parent_studies:
- study: promoter-specific-regulation
  condition: complete
  relation: refines
- study: pc00010-repression-arithmetic
  condition: complete
  relation: supports
- study: replisome-gate-sufficiency
  condition: tests-passed
  relation: supports
units_and_time:
  tick: 1 s of simulated time; generations delimited by division events.
  quantities:
    deficit: peer-median over dnaG of actual/basal transcription (dimensionless)
    generations divided: count of successful divisions before a stall
behavior_tests:
- name: intervention-is-a-single-edge
  classification: primary
  gate_class: acceptance_criterion
  question: Did the fix change exactly one thing?
  description: 'Every changed delta_prob entry is the LexA edge on TU00352 -- i.e. nothing else moved.


    The scope gate, checked FIRST. promoter-specific-regulation''s network-wide rule stripped 89.5% of
    adjudicated edges and its disruption control fired, voiding any rescue it could have shown. This study
    exists because the dnaG locus is the one place the evidence is POSITIVE -- LexA''s site is present
    and matches TU00435 to 0.5 bp -- rather than an absence. If more than one edge moves, the same interpretability
    problem returns.


    Threshold provenance: definitional. One edge, or the intervention is not targeted.'
  measure:
    kind: derived
    path: fraction of changed delta_prob entries that are the LexA edge on dnaG's TU00352
    detail: changed entries that are the intended one, over all changed entries; 1.0 means nothing else
      moved.
  pass_if:
    low: 0.99
    high: 1.0
    provenance:
      kind: theory
      note: 'Expressed as a fraction bounded above by 1.0 rather than a raw count with ''<= 1'', so the
        discrimination check can grade it. Same claim: 1.0 means the only edge that moved is the intended
        one.'
  status: pending
- name: dnag-transcription-recovers
  classification: primary
  gate_class: acceptance_criterion
  question: With no regulator on its only transcript, is dnaG transcribed?
  description: 'dnaG''s deficit against its idx_rprotein peers closes by at least 80% in log space, from
    47.4x.


    Stricter than the 50% asked of the network-wide fix, deliberately. Removing the sole regulator from
    TU00352 leaves promoter_init_probs equal to basal_prob exactly, so dnaG should transcribe at its fitted
    rate with nothing left to suppress it. A partial recovery would mean something beyond the LexA edge
    is limiting, and 80% is set high enough to detect that rather than absorb it.


    Threshold provenance: theory. The mechanism predicts near-total recovery, so the band is set where
    a partial one would fail.'
  measure:
    kind: derived
    path: fraction of dnaG's log-space peer deficit closed after removing the LexA edge from TU00352
    detail: 1 - log(deficit_after)/log(47.4), corrected arm, last generation.
  pass_if:
    low: 0.8
    high: 1.0
    provenance:
      kind: theory
      note: Bounded above by 1.0. 80% because the mechanism predicts near-total recovery -- removing the
        only regulator leaves basal_prob untouched -- so a partial result should FAIL rather than pass.
  status: pending
- name: lineage-completes
  classification: primary
  gate_class: acceptance_criterion
  question: Does the cell live?
  description: 'Lineages complete at least 8 generations, against the 4-5 they currently reach.


    The payoff, and the first end-to-end test of this investigation''s central claim. Same band as the
    two retired or blocked fix studies so all three are comparable. replisome-gate-sufficiency''s DnaG-ablation
    arm reached 12/12 once the gate stopped waiting on DnaG; this supplies DnaG instead of removing the
    requirement, so it should do at least as well.


    Threshold provenance: theory. 8 is past the 4-5 stall and short of 12, so a partial rescue counts.'
  measure:
    kind: derived
    path: minimum generations divided across seeds with the LexA edge removed from dnaG's TU00352
    detail: minimum divided-generation count across seeds, corrected arm.
  pass_if:
    low: 8
    high: 12
    provenance:
      kind: theory
      note: Spans 1.5x; anchored at 8 so a partial rescue is recognised. Same band as the sibling fix
        studies.
  status: pending
- name: rescue-is-not-a-global-growth-artefact
  classification: primary
  gate_class: acceptance_criterion
  question: Is any rescue attributable to dnaG?
  description: 'Generation time stays within 50% of the paired control''s, and the idx_rprotein peers''
    median transcription stays within 1.5x of the control''s.


    Carried from ppgpp-off-rescue, where it fired and correctly voided a rescue claim. A single-edge intervention
    should barely perturb anything else -- and unlike the earlier studies, that is now a strong prediction
    rather than a hope, because only one number in the cache changes.


    Threshold provenance: theory. The same 50% band, so the studies read on one scale.'
  measure:
    kind: derived
    path: generation-time ratio, corrected arm over control, after removing the LexA edge on dnaG's TU00352
    detail: median tau corrected over median tau control, generations 1-3.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided at roughly 50%, matching ppgpp-off-rescue.
  status: pending
  control: negative
- name: dnag-deficit-baseline
  classification: supporting
  gate_class: regression_pin
  question: Does the control arm still show the defect?
  description: 'The control arm reproduces dnaG''s peer deficit at 47.4x within a factor of 3.


    POST-HOC: measured in pc00010-repression-arithmetic. A pin so a drift in the control is caught before
    the corrected arm is read against it -- important here because the corrected cache is a MODIFIED copy,
    so this is a within-cache-family comparison rather than a within-cache one.'
  measure:
    kind: derived
    path: dnaG peer deficit in the control arm at the dnaG locus
    detail: peer-median over dnaG of actual/basal, control arm, last generation.
  pass_if:
    op: <=
    value: 142.2
    provenance:
      kind: post_hoc
      note: 3x the 47.4x measured previously; a drift pin.
  status: pending
