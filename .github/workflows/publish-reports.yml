name: Publish investigation reports

# Regenerate every investigation's self-contained HTML report and publish it to
# the gh-pages branch at investigations/<slug>.html. The report is built by the
# vivarium-workbench SPA client-side, so we serve the dashboard headlessly and
# drive its "Generate report" button via Playwright
# (scripts/publish_investigation_reports.py).
#
# This is a DEPLOY job (post-merge to main), not a PR gate — a failure here
# never blocks a merge. It only ever writes investigations/*.html on gh-pages;
# the hand-maintained viewers, comparison reports, and gallery index there are
# left untouched.

on:
  push:
    branches: [main]
    paths:
      # Only republish when something that changes a report changed.
      - 'workspace/**'
      # Root workspace.yaml is NOT under workspace/** — list it explicitly so
      # layout/registry changes republish the reports too.
      - 'workspace.yaml'
      - 'reports/figures/**'
      - 'scripts/publish_investigation_reports.py'
      - '.github/workflows/publish-reports.yml'
  workflow_dispatch:

concurrency:
  group: publish-reports
  cancel-in-progress: true

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Investigation reports embed the loom Explorer — require the bundle so a
    # missing/broken build fails loudly rather than publishing without it.
    # NOTE: retained deliberately through the #878 migration, and it must stay
    # at JOB level. This is read by workbench's hatch_build.py build hook (not at
    # render time), so it takes effect when the "Ensure the publish CLI is
    # current" step BUILDS workbench from git: a missing loom bundle becomes a
    # hard build failure instead of a silent skip that would ship reports with
    # no Explorer.
    env:
      VIVARIUM_WORKBENCH_REQUIRE_LOOM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies
        run: uv sync --extra dev || uv sync

      - name: Ensure the publish CLI is current (latest main)
        # This DEPLOY job renders reports with workbench's server-side
        # generator (vivarium_workbench.lib.investigation_report), so it needs
        # vivarium-workbench even though v2ecoli's RUNTIME dropped it as a
        # dependency (viewer moved to pbg-ptools). Mirror the green
        # publish-dashboard.yml exactly: ad-hoc install workbench@main, and run
        # the generator inside the activated venv (below) rather than via `uv
        # run`, which would re-sync to uv.lock and undo this install. The runtime
        # stays decoupled — only this deploy job pulls workbench.
        #
        # No browser is involved any more: the Playwright + Chromium install was
        # dropped when the report stopped being built client-side (workbench
        # #878). That also removes the `uv run` re-sync this step used to have
        # to be ordered after.
        run: |
          uv pip install --reinstall-package vivarium-workbench "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-workbench.git@main"

      - name: Generate investigation reports
        id: gen
        # Spawns `vivarium-workbench serve`, drives each investigation's report
        # export headlessly, writes reports/published/investigations/<slug>.html.
        # Keep going on a per-report failure so good reports still publish; the
        # script's exit code is recorded for the final status gate.
        run: |
          set +e
          # Activated venv (not `uv run`): `uv run` re-syncs to uv.lock, undoing
          # the ad-hoc workbench@main install and dropping `vivarium-workbench serve`.
          source .venv/bin/activate
          python scripts/publish_investigation_reports.py \
            --workspace . --out reports/published
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish generated reports to gh-pages
        # Surgical: copy ONLY the freshly-generated investigations/*.html onto
        # gh-pages via a worktree. Never deletes — a report that failed to
        # regenerate keeps its previous published copy. Commits only on a diff.
        run: |
          set -euo pipefail
          shopt -s nullglob
          generated=(reports/published/investigations/*.html)
          if [ ${#generated[@]} -eq 0 ]; then
            echo "no reports were generated; nothing to publish"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          mkdir -p /tmp/ghp/investigations
          cp reports/published/investigations/*.html /tmp/ghp/investigations/
          # Regenerate the landing-page investigation list (between the
          # auto-investigations markers in index.html) so the root gallery lists
          # every investigation with a published report — no hand-curation.
          python3 scripts/inject_index_fragment.py \
            reports/published/investigations_index.html /tmp/ghp/index.html
          cd /tmp/ghp
          git add investigations/*.html index.html
          if git diff --cached --quiet; then
            echo "no report content changed; skipping commit"
          else
            git commit -m "gh-pages: republish investigation reports + landing list (automated, ${GITHUB_SHA::7})"
            git push origin gh-pages
            echo "published $(ls investigations/*.html | wc -l) investigation reports"
          fi

      - name: Fail only if NO reports were published
        # Run AFTER publishing. The generator exits non-zero only when NOTHING
        # published (total breakage / server never came up); a partial run exits
        # 0 and ships every report that rendered. So one stubborn investigation
        # (e.g. a heavy report whose client-side generation hangs on the current
        # workbench) no longer reds the whole deploy — the good reports still go
        # out. Individual failures are printed to the log for visibility.
        run: |
          code="${{ steps.gen.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::no investigation reports were published (publish_investigation_reports.py exit $code)"
            exit 1
          fi
