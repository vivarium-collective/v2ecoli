schema_version: 4
name: sm-02-utility-and-limits
investigation: surrogate-modeling
title: "Utility & limits — what a cheap emulator buys, and where emulation ends"
created: '2026-06-16'
status: evaluated

design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: passed
expert_review_status: pending

claim: |
  The honest by-product of sm-01 — a cheap LINEAR emulator of coarse growth —
  is genuinely useful: it pays back its 8 training simulations after ~8
  evaluations and sweeps 5,000 trajectories in 0.02 s (vs ~24 h on the WCM,
  ~3.8e6× per trajectory). Its limits are explicit: it emulates a smooth,
  low-dimensional observable view, not the cell's high-dimensional hidden state.
confidence: Accepted

question: |
  Given that the linear emulator (not the neural net) is the model that works
  for coarse growth, is it actually worth building — i.e. does it amortize
  against the cost of generating its training data — and what are its limits?

report:
  title: sm-02-utility-and-limits — amortized value of the cheap emulator
  verdict: pass
  confidence: high
  evidence_quality: measured emulator + simulator timings; amortized break-even; learnability limit from sm-01
  objective: |
    Quantify the practical value of the emulator that sm-01 found actually works
    (linear), and state its limits honestly, so "fast" is meaningful rather than
    an apples-to-oranges speedup.
  setup: |
    code/utility_demo.py fits the linear emulator on the compact dataset, sweeps
    5,000 initial conditions × 250 steps (timed), and computes the amortized
    cost: (8 training sims) + N·(emulator rollout) vs N·(WCM rollout), giving the
    break-even N. Simulator per-step time is the measured baseline rate.
  result: |
    - Linear emulator: 5,000 × 250-step trajectories in 0.02 s (~0.005 ms/traj).
    - Full WCM: ~17 s per 250-step trajectory → the same sweep ≈ 24 h.
    - Per-trajectory speedup ≈ 3.8e6×; break-even after ~8 evaluations
      (i.e. the emulator pays back its 8 training sims almost immediately).
    Limits (from sm-01): the emulator is valid only for the smooth, low-dim
    observables; the broad 11.5k-observable panel is unlearnable from the
    observable view (0% beat persistence), and emulation says nothing about
    events outside the training distribution (e.g. division — a documented
    follow-up).
  interpretation: |
    The expensive part of surrogate modeling is generating training data, not the
    emulator. Once you've paid for a handful of baseline simulations, a cheap
    emulator of a smooth observable is worth building even when a neural net adds
    nothing — it turns a 24-hour sweep into 0.02 s. The discipline is to scope it
    to what's actually emulable and to amortize honestly.
  decision: |
    PASS — the cheap emulator amortizes after ~8 evaluations and its limits are
    stated explicitly.

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      seed: 0
  variants:
    - name: linear-emulator-sweep
      perturbation: "Linear emulator over 5,000 sampled initial conditions × 250 steps."
      expected_contrast: "Seconds vs. ~24 h on the WCM; break-even after a handful of evals."
      measured_contrast: "0.02 s sweep; break-even ~8 evaluations; ~3.8e6× per traj."

      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  model_settings: []
tests:
  - name: cheap-emulator-amortizes-and-is-honest-about-limits
    classification: primary
    status: passed
    question: |
      Does the cheap emulator amortize its training-data cost within a small number
      of evaluations (break-even < 100)?
    measure:
      kind: authored
      detail: "Break-even N where (8 training sims + N·emulator) <= N·WCM."
      measured_value: 8.0
    pass_if:
      op: lt
      low: 100.0
    cites_note: "Methodological: an emulator is worth building if it amortizes quickly."

runs:
  - name: utility-breakeven
    status: completed
    kind: benchmark
    canonical: true
    description: |
      code/utility_demo.py: linear-emulator sweep timing + amortized break-even vs
      measured WCM per-trajectory cost.
    dispatch: serial
    emitter:
    result: PASS
    outcomes:
      cheap-emulator-amortizes-and-is-honest-about-limits:
        result: PASS
        detail: "Break-even ~8 evals; 5,000-traj sweep in 0.02 s vs ~24 h on the WCM."
    computed_outcomes:
      _status: store_unresolved

embed_visualizations:
  - name: "Utility & break-even — cheap emulator vs. the simulator (interactive)"
    url: /reports/figures/sm-02-utility-and-limits/utility_breakeven.html
    description: "Cumulative wall-clock vs. number of evaluations (log-log) for the linear emulator (+ 8 training sims) vs. the full WCM, with the ~8-evaluation break-even marked. Headline: 5,000 trajectories in 0.02 s vs ~24 h."

pipeline_gate:
  gate_status: passed

conclusion_verdicts:
  - claim: "A cheap emulator of a smooth observable is worth building once training data exists."
    verdict: supported
    basis: "Break-even ~8 evaluations; ~3.8e6× per-trajectory speedup."
  - claim: "Emulation extends to the cell's high-dimensional hidden state."
    verdict: refuted
    basis: "sm-01: 0% of broad observables beat persistence; not learnable from the view."

robustness:
  n_replicates: 1
  seeds: [0]
  parameter_sweep: true
  swept_param: "5,000 sampled initial conditions"

falsifiability: |
  The utility claim fails if the emulator does not amortize within a small number
  of evaluations, or if its per-trajectory cost is not far below the WCM's.

simulation_set:
  - name: utility-breakeven
    kind: benchmark
    status: ran
    base_model: v2ecoli.composites.ecoli_baseline
    duration_steps: 0
    seeds: 0
    details: "Linear emulator sweep + amortized break-even vs measured WCM cost."
    metrics:
      - breakeven_n_evaluations
      - per_traj_speedup
    pass_fail_tests:
      - cheap-emulator-amortizes-and-is-honest-about-limits
inputs:
  - artifact: sm-01-nn-surrogate
    from: sm-01-nn-surrogate
