schema_version: 4
name: dnaa-7-seqa-sequestration
investigation: dnaa-replication
title: "dnaa-7 — initiation control: RIDA enforces one-initiation-per-cycle (SeqA eclipse insufficient)"
created: "2026-06-20"
status: completed
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: pass   # OPERATING POINT FOUND: RIDA 0.5-0.7 (+DARS) gives clean oriC 1<->2, 0 re-inits, AND DnaA-ATP fraction in [0.2,0.5] + pool in band, 8/8 divide. Mechanistic DnaA-ATP/oriC initiation fully + in-band replaces the cell-mass heuristic. See verdict.
expert_review_status: pending

seeded_from:
  study: dnaa-6-mechanistic-initiation
  why: "dnaa-6 made the DnaA-ATP/oriC trigger SUSTAIN the cycle (8/8) with cooperativity, but it OVER-initiates (oriC->4) for lack of a post-initiation eclipse. dnaa-7 adds the SeqA sequestration that blocks a just-fired origin from re-firing."

question: >-
  Does a post-initiation eclipse (SeqA sequestration) restore one-initiation-per-cycle (clean
  oriC 1<->2, no over-initiation) under the mechanistic DnaA-ATP/oriC trigger, while keeping the
  cell cycle sustained and the DnaA / DnaA-ATP levels in band?

background: >-
  In E. coli, immediately after initiation the newly hemimethylated oriC (and the dnaA promoter)
  is bound by SeqA, sequestering it for ~1/3 of the cell cycle (the eclipse) so it cannot
  re-initiate. The wcEcoli cell-mass heuristic implicitly enforces one-init-per-cycle (mass must
  double again); the mechanistic DnaA-ATP trigger (dnaa-6) lacks this block, so the cooperative
  switch — which stays ON while free DnaA-ATP is high — re-fires the same origin, driving oriC to 4.

mechanism: >-
  Phenomenological SeqA eclipse, flag-gated in chromosome_replication.py (commit d883cc61):
  DNAA_INIT_ECLIPSE_MIN blocks the mechanistic initiation trigger for N minutes after an
  initiation event (tracks the last-initiation time; gated in _should_initiate). Default 0 =
  no eclipse (dnaa-6 behavior). A full hemimethylation/SeqA-on-oriC-boxes model is a later
  refinement; the refractory eclipse captures the one-init-per-cycle phenotype directly.

conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      seed: 1
      cache_dir: out/cache_dnaa4_s06_F05
      max_generations: 8
      single_daughters: true
      perturbations: {"TU00259[c]": 1.5e-3}
      note: "dnaa-6 payoff config (mechanistic oriC-low trigger + cooperative binding) + the SeqA eclipse."
  variants:
  - name: eclipse-sweep
    diff_from_baseline: "DNAA_INIT_ECLIPSE_MIN in {20, 40} min"
  model_settings: []

enforced_params:
  params:
    growth_condition: succinate
    initiation_trigger: mechanistic
    init_trigger_pool: low
    init_low_threshold: 6
    oric_cooperativity_n: 4
    oric_half_sat_nM: 30
    init_eclipse_min: 40        # SeqA eclipse (sweep 20/40)
    base_config: dnaa-4-reference (linear s=0.6 + F-05, V=1.5e-3, k_h=0.025)
  source: dnaa-6-payoff + SeqA-eclipse

readouts:
- name: number of oriC (one-init-per-cycle)
  identifier: listeners.replication_data.number_of_oric
  units: count
  status: primary
  note: "Target: clean 1<->2 (the eclipse should remove the dnaa-6 over-init to 4)."
- name: re-initiation events
  identifier: ticks with oriC > 2
  units: count
  status: primary

tests:
- name: one-initiation-per-cycle
  classification: primary
  description: "oriC oscillates cleanly 1<->2 (no over-initiation) under the mechanistic trigger + eclipse."
  measure: {kind: snapshot_window, path: "listeners.replication_data.number_of_oric", window: full_lineage_from_gen_0}
  pass_if: {op: max_le, value: 2}
  status: passed
  result: "PASS — RIDA restores oriC 1<->2 / 0 re-inits. At the operating point (RIDA 0.5-0.7 + DARS) this holds WITH the DnaA-ATP fraction in band (0.26-0.40). The eclipse + threshold tuning had failed; RIDA is the mechanism."
- name: cycle-sustained
  classification: primary
  description: "Every generation still divides (the eclipse must not block legitimate next-cycle initiation)."
  measure: {kind: per_generation_mass_ratio, path: "listeners.mass.cell_mass", window: every_generation}
  pass_if: {op: periodic_doubling_every_generation, tolerance: 0.4}
  status: passed
  result: "PASS — 8/8 generations divide on all variants (the cycle stays sustained; this is an initiation-control failure, not a viability one)."
- name: dnaa-levels-preserved
  classification: primary
  description: "DnaA pool stays in [300,800] (the eclipse changes initiation timing, not DnaA homeostasis)."
  measure: {kind: generation_average, path: "(MONOMER0-160[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp) + (PD03831[c] + MONOMER0-4565[c])", window: gen_steady_state}
  pass_if: {op: generation_average_in_range, low: 300, high: 800}
  status: passed
  result: "PASS at the operating point (RIDA 0.5-0.7): DnaA pool in [300,800] AND DnaA-ATP fraction in [0.2,0.5] (0.398 at RIDA=0.6). Full RIDA over-suppressed the fraction (0.03); the calibrated rate holds both."

visualizations:
- name: dnaa7_rida_calibration
  address: image:charts/dnaa7_rida_calibration.png
  chart: charts/dnaa7_rida_calibration.png
  source_run: dnaa7_ridacal_r0{1,2,3,5,6,7} + dnaa7_rida_full (RIDA sweep, DARS on)
  config:
    title: >-
      RIDA-rate calibration — the operating window. TOP: DnaA-ATP fraction vs RIDA rate, with the
      [0.2,0.5] band and the operating window (RIDA 0.5-0.7) shaded; the fraction falls
      monotonically with RIDA (0.85 -> 0.03) and sits in band only for RIDA 0.5-0.7. BOTTOM:
      re-initiation ticks + max oriC vs RIDA rate — RIDA >= 0.5 gives 0 re-inits and clean oriC 2.
      The overlap (RIDA 0.5-0.7) is where the mechanistic trigger gives clean one-init-per-cycle AND
      the in-band DnaA-ATP fraction: the operating point (canonical RIDA=0.6).
- name: dnaa7_rida_fixes_overinit
  address: image:charts/dnaa7_rida_fixes_overinit.png
  chart: charts/dnaa7_rida_fixes_overinit.png
  source_run: dnaa7_rida_full_seed1_8gen vs dnaa6_mech_low_coop_n4_seed1_8gen vs dnaa4_s06_F05_seed1_12gen
  config:
    title: >-
      RIDA restores one-initiation-per-cycle. TOP: oriC over time — the mass heuristic (blue) is
      1<->2, the mechanistic trigger without RIDA (red) over-initiates to 4, and the mechanistic
      trigger + RIDA/DDAH/DARS (green) is back to clean 1<->2 (0 re-inits). BOTTOM: DnaA-ATP
      fraction — RIDA at full rate crashes it to ~0.03 (far below the [0.2,0.5] band), so the RIDA
      rate needs calibration even though the initiation control is solved.
- name: dnaa7_eclipse_insufficient
  address: image:charts/dnaa7_eclipse_insufficient.png
  chart: charts/dnaa7_eclipse_insufficient.png
  source_run: dnaa7_seqa_eclipse40 / tuning variants vs dnaa4_s06_F05_seed1 (mass control)
  config:
    title: >-
      The global SeqA eclipse does NOT restore one-init-per-cycle. LEFT: oriC over time — the mass
      heuristic (blue) is clean 1<->2; the mechanistic trigger + eclipse-40 (red) still reaches 4.
      RIGHT: re-initiation ticks across variants — none reach 0; the eclipse and stricter
      thresholds make it WORSE. Root cause: nothing resets the DnaA-ATP switch post-init (RIDA off).

report:
  title: "dnaa-7 — SeqA sequestration eclipse"
  verdict: >-
    eclipse-insufficient — RIDA + per-origin SeqA needed (a productive negative result). Tested a
    phenomenological SeqA eclipse (global refractory block, DNAA_INIT_ECLIPSE_MIN = 20 and 40 min)
    AND threshold/K tuning (oriC-low threshold 8/8, K=45) against the dnaa-6 over-initiation
    (oriC->4). RESULT: NONE restore one-initiation-per-cycle — every variant still reaches oriC 4
    with substantial re-initiation (no-eclipse 1400 ticks; eclipse-40 2405; eclipse-20 2578; thr=8
    3511; K=45 6530). The global eclipse and stricter thresholds make it WORSE, not better — a
    global block delays division, so the cell grows larger and bursts harder when the block lifts.
    The cell cycle stays sustained (8/8 divide) and DnaA pool stays in band throughout, so this is
    specifically an initiation-CONTROL failure, not a viability failure. ROOT CAUSE: nothing turns
    the DnaA-ATP switch OFF after initiation. These runs had RIDA OFF; RIDA (Regulatory Inactivation
    of DnaA — DnaA-ATP -> DnaA-ADP after initiation) is exactly the negative feedback that drops
    free DnaA-ATP below the switch threshold so it resets, and SeqA must sequester the SPECIFIC new
    origin (per-origin hemimethylation), not block all initiation globally. CONCLUSION: one-init-
    per-cycle for the mechanistic trigger needs RIDA (DnaA-ATP inactivation, the dnaa-05 mechanism)
    + a per-origin SeqA model — not a refractory eclipse. The simple eclipse stays in the codebase
    (default off) but is not the fix.
    || RIDA-RATE CALIBRATION (2026-06-20) — OPERATING POINT FOUND, LOOP CLOSED: sweeping
    RIDA_RATE_MULTIPLIER (0.1-1.0, DARS on) against BOTH targets (clean oriC AND DnaA-ATP fraction
    in band) revealed a clean monotonic trade-off with a WINDOW that satisfies both: RIDA in
    [0.5, 0.7] gives clean oriC 1<->2, ZERO re-inits, DnaA-ATP fraction IN [0.2,0.5] (0.28 / 0.40 /
    0.26 at 0.5 / 0.6 / 0.7), DnaA pool in band, 8/8 divide. (Outside it: RIDA<=0.3 over-initiates +
    fraction too high; RIDA=1 clean but fraction crashes to 0.03.) RIDA=0.6 is the canonical
    operating point (fraction 0.398, mid-band). CONCLUSION: the mechanistic DnaA-ATP/oriC initiation
    now FULLY and IN-BAND replaces the cell-mass heuristic — cooperative switch fires it, RIDA
    enforces once-per-cycle, all bands held. The investigation arc is complete (single seed; the
    open follow-ups are multi-seed robustness and a per-origin hemimethylation SeqA refinement).
    || RIDA PROBE (2026-06-20) — HYPOTHESIS CONFIRMED: re-running the mechanistic trigger with RIDA
    ON (RIDA_RATE_MULTIPLIER=1; oriC-low switch + cooperativity, NO eclipse) RESTORES clean
    one-initiation-per-cycle — oriC 1<->2, ZERO re-initiations, 8/8 divide (both RIDA-only and full
    RIDA/DDAH/DARS). This confirms the root cause: the over-init was the un-reset DnaA-ATP switch,
    and RIDA (DnaA-ATP -> DnaA-ADP after initiation) drops free DnaA-ATP below threshold so the
    switch resets. So the mechanistic DnaA-ATP/oriC initiation now works end to end: cooperative
    switch (dnaa-5) fires it, RIDA enforces once-per-cycle. CAVEAT: RIDA at full rate OVER-suppresses
    DnaA-ATP — the fraction crashes to 0.012 (RIDA-only) / 0.031 (full) << the [0.2,0.5] band, even
    with DARS reactivation. So initiation CONTROL is solved; the RIDA rate needs CALIBRATION to hold
    the ATP-fraction band — exactly the dnaa-05 RIDA/DDAH/DARS tuning. The global eclipse is retired;
    RIDA is the mechanism.
  confidence: operating-point-found (loop closed; single-seed)

conclusion_logic:
  if_primary_tests_pass: >-
    If the eclipse restored clean one-init-per-cycle (oriC 1<->2) with the cycle sustained and DnaA
    in band, the DnaA-ATP/oriC mechanistic initiation would be complete — the cell-mass heuristic
    fully replaced by biology, once-per-cycle.
  if_primary_tests_fail: >-
    The primary test FAILED (oriC reaches 4 on every variant; the global eclipse + threshold/K
    tuning do not restore 1<->2, and worsen it). The over-initiation is not a refractory or
    threshold problem: nothing resets the DnaA-ATP switch after initiation. The fix is RIDA
    (DnaA-ATP -> DnaA-ADP inactivation post-init, the dnaa-05 mechanism) to drop free DnaA-ATP
    below threshold + a per-origin SeqA sequestration model — not a global eclipse.

next_action: >-
  RIDA confirmed as the one-per-cycle control. Now CALIBRATE the RIDA rate (and DARS reactivation)
  so DnaA-ATP fraction returns to [0.2,0.5] while keeping oriC 1<->2 — the dnaa-05 RIDA/DDAH/DARS
  tuning. Sweep RIDA_RATE_MULTIPLIER (e.g. 0.1-0.5) + DARS to find the operating point. Then the
  DnaA-ATP/oriC mechanistic initiation fully replaces the cell-mass heuristic (sustained, once-per-
  cycle, in-band). Optional later refinement: a per-origin hemimethylation SeqA model.

