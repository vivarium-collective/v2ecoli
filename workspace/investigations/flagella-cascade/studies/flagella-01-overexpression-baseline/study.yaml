schema_version: 4
name: flagella-01-overexpression-baseline
title: "Overexpression Baseline — Regulation OFF vs ON"
question: >-
  Is the flagella_regulation port byte-neutral when the feature is OFF, and how
  over-expressed are flagellar components in the unregulated WCM baseline it
  establishes as the reference for the cascade studies?
description: |
  Establishes Maya's Specific Aim 2 motivation in v2ecoli: with no transcriptional
  regulation, the whole-cell model overproduces flagellar components relative to
  biological levels (her prelim reports ~48 flagella). This study characterizes the
  unregulated baseline AND proves that adding the flagella_regulation infrastructure
  is a true no-op when the feature is OFF — so any change downstream is attributable
  to the regulatory cascade, not to the port itself.
topic: regulation
tags: [flagella, baseline, overexpression, seam-neutrality, feature-off, aim2, ported-from-vecoli-biofilm]
created: '2026-06-20'

# This study is the ROOT of the transcription-arm DAG: it establishes the
# byte-neutral baseline + overexpression reference that 02 (transcription
# regulation) is measured against. Depends only on the ParCa cache.
pipeline_gate:
  prerequisites:
  - parca
  enables:
  - flagella-02-transcription-regulation   # 01 gates the transcription arm

status: in_progress
phase: Evaluate

design_status: complete
implementation_status: complete
simulation_status: ran             # feature-off neutrality verified during the port
evaluation_status: partial
gate_status: pending
expert_review_status: requested    # Maya Abdalla reviewed 2026-07-24 (feedback imported)

# Tracked simulation backing this study's figures (Simulations DB).
runs:
- name: flagella-01-overexpression-baseline__regOFF__seed0__600s
  kind: simulation
  canonical: true
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  description: baseline composite, features=[] (regulation OFF), seed 0, out/cache, 600 s
  status: completed
  result: PASS
  outcomes:
    feature-off-neutral:
      result: CONFIRMED
      detail: "init_prob_override == 0 on every promoter for the whole run"

findings:
- id: flagella-01-feature-off-byte-neutral
  kind: computational
  status: confirms
  statement: >-
    With flagella_regulation OFF the port is byte-neutral — init_prob_override stays
    0 on every promoter across the run and the cell grows/divides exactly as pre-port
    main, so any downstream change is attributable to the cascade, not the port.
  evidence:
    observed: "0 nonzero overrides after the run; feature-off signature matches the shipped-fixture control"
    expected: "init_prob_override == 0 everywhere; bit-identical to pre-port main"
- id: flagella-01-unregulated-overexpression
  kind: computational
  status: confirms
  statement: >-
    The unregulated WCM over-produces flagellar components relative to biological
    levels — the motivation the cascade is meant to address (MODEL reproduces the
    documented problem).
  evidence:
    observed: "~48 complete flagella in the unregulated baseline (Maya's prelim figure)"
    expected: "far above the biological handful of flagella per cell"
- id: flagella-01-count-direction-confounded
  kind: computational
  status: inconclusive
  statement: >-
    Under the investigation-wide "regulation ON = feature + full initial-state
    override" definition (2026-07-28), a fresh 4-seed x 3-gen calibrated ensemble
    shows the regulated lineage carrying FEWER complete flagella than the
    unregulated one in 12/12 seed-generations — but this is NOT a clean
    re-confirmation of Maya's original overexpression-reduction hypothesis. OFF
    still starts from the default cache's ~30-45 already-flagellated state while
    ON starts from the override's 4, and the two trajectories CONVERGE across
    generations (ON rising, OFF falling) — consistent with ON simply recovering
    from a lower starting point rather than steady-state regulatory suppression.
  evidence:
    observed: "4-seed x 3-gen ensemble: ON means 20.5/28.0/31.0 vs OFF means 49.25/43.25/39.5 per generation; ON < OFF in 12/12 seed-generations"
    expected: "ambiguous by design — the confound (differing initial conditions) is not yet resolved by more generations or a same-IC comparison"
    divergence: "supersedes the prior override-free ensemble finding (ON means 62.5/54.8/59.0 vs OFF 49.5/44.2/40.8, ON > OFF in 11/12) — that answered a different question (regulation alone, same initial condition) and should not be quoted interchangeably with this one"

visualizations:
- address: image:charts/01_overexpression_and_neutrality.svg
  chart: charts/01_overexpression_and_neutrality.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies.py --cache-dir out/cache_full
  description: |
    TWO runs are shown here on purpose (this answers "why is there a regulation-ON
    line in the baseline study?"): the study's job is to (a) characterize the
    unregulated baseline AND (b) prove the port is a no-op when off, so we run the
    SAME composite twice — regulation OFF (the baseline) and regulation ON (for
    reference) — and compare.
    Left — unregulated flagellar components (complete flagella CPLX0-7452 + the
    motor/HBB FLAGELLAR-MOTOR-COMPLEX) over a 600 s run with regulation OFF.
    Right — complete-flagella count, regulation OFF vs ON, so you can see the
    baseline against the regulated case side by side. "Regulation ON" here means
    the flagella_regulation feature PLUS Maya's full 4-value initial-state
    override (4 flagella, 0 motor, 500 FliA, 800 FlgM) — the investigation-wide
    ON definition as of 2026-07-28. At t=600s: OFF=33, ON=8 — ON starts from a
    much lower flagella count (the override) so this single short run mostly
    reflects that starting-point gap, not yet a steady-state regulatory effect
    (see the multigen and ensemble figures below for the fuller picture).
    Regenerated against out/cache_full (the flagella Steps and overrides depend
    on full-mode ParCa — the fast-mode fixture is missing the FLGM-FLIA-CPLX
    reaction and the init_prob_override field outright, so this study no longer
    runs on it at all). Feature-off init_prob_override stays 0 throughout (seam
    neutral), and that neutrality result is cache-independent.
- address: image:charts/02_multigen_flagella_and_mass.svg
  chart: charts/02_multigen_flagella_and_mass.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_multigen.py --generations 2 --cache-dir out/cache_full
  description: |
    Again two runs — regulation OFF vs ON — over TWO full cell generations on the
    CALIBRATED full-mode cache (generations shaded; division = dashed). "Regulation
    ON" means the flagella_regulation feature PLUS Maya's full 4-value
    initial-state override (4 flagella, 0 motor, 500 FliA, 800 FlgM) — the
    investigation-wide ON definition as of 2026-07-28; "OFF" is the stock WCM on
    the default (already-flagellated) cache. Left — complete flagella per
    generation: regulation ON sits BELOW OFF (OFF g1=47,g2=40; ON g1=18,g2=24) —
    but ON is RISING (18->24) while OFF is falling, consistent with ON simply
    recovering from its much lower starting point (4 flagella vs OFF's ~30) rather
    than a settled regulatory effect; see the canonical seed-band figure for the
    fuller multi-seed/multi-generation picture and its caveats. Right — dry-mass
    sawtooth (division at ~700 fg).
- address: image:charts/04_ensemble_seed_band.svg
  chart: charts/04_ensemble_seed_band.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_ensemble.py --seeds 0 1 2 3 --generations 3 --cache-dir out/cache_full
  description: |
    CANONICAL count figure — calibrated full-mode cache, 4 seeds x 3 generations.
    Mean ± seed range of complete flagella per generation (OFF vs ON) plus per-seed
    trajectories. "Regulation ON" = flagella_regulation feature + Maya's full
    4-value initial-state override (investigation-wide definition as of
    2026-07-28); "OFF" = stock WCM on the default already-flagellated cache (no
    override — kept that way deliberately as the unregulated reference). The
    regulated (ON) band sits BELOW the unregulated (OFF) band at every generation
    (ON means 20.5/28.0/31.0 vs OFF means 49.25/43.25/39.5; ON < OFF in 12/12
    seed-generations).
    READ THIS BEFORE CITING THE DIRECTION: this is NOT a clean regulation effect.
    OFF and ON start from different initial flagella counts (~30-45 vs the
    override's 4) by construction, and the per-generation means CONVERGE (ON:
    20.5 -> 28.0 -> 31.0 rising; OFF: 49.25 -> 43.25 -> 39.5 falling) — consistent
    with ON simply catching up from a lower start rather than a steady-state
    suppression that would hold the gap constant or widen it. This supersedes
    (does not contradict) the PRIOR override-free ensemble finding (ON means
    62.5/54.8/59.0 vs OFF 49.5/44.2/40.8, ON > OFF in 11/12) — that answered a
    different question (regulation alone, matched initial condition). Neither
    ensemble cleanly isolates the regulatory effect from the initial-condition
    effect; see investigation.yaml's COUNT VERDICT for the full discussion.

baseline:
- name: wcm-unregulated
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    seed: 0
    cache_dir: out/cache_full      # full-mode ParCa — the flagella Steps + overrides
                                    # require it (fast-mode fixture lacks the
                                    # FLGM-FLIA-CPLX reaction and init_prob_override field)
    features: []                   # regulation OFF — the unregulated baseline

purpose:
  question: |
    (a) How over-expressed are flagellar components in the unregulated WCM baseline?
    (b) Is the flagella_regulation port byte-neutral when the feature is off?
        ("Byte-neutral" = with the feature OFF, the model produces bit-for-bit
        identical output to pre-port main — adding the flagella code changes
        NOTHING you can observe until you switch it on. This is what lets us
        attribute every downstream difference to the cascade, not to the port.)
  mechanism: |
    With features=[] the two flagella Steps are not wired and the promoter
    init_prob_override field stays 0.0 everywhere, so transcript_initiation's
    substitution (guarded on > 0) never fires — identical initiation probabilities
    to pre-port main. Flagellar component counts (CPLX0-7452, flagellin, motor) are
    read straight from the unregulated baseline for comparison against the regulated
    runs in flagella-02 / flagella-03.
  expected_outcome: |
    init_prob_override == 0 for every promoter across the run; cell grows/divides
    normally; flagellar component counts sit at the (over-expressed) unregulated
    level that the cascade is intended to bring down.

behavior_tests:
  - id: feature-off-neutral
    statement: |
      With flagella_regulation OFF, promoters.init_prob_override is 0 for every
      promoter across a 30 s run and the cell grows normally.
    status: passing      # verified during the port (0 nonzero overrides after 30 s)
  - id: parity-attributable-to-data-not-code
    statement: |
      The feature-off signature on the rebuilt cache matches the shipped-fixture
      signature (control), confirming the ~1% delta vs the committed golden is
      pre-existing golden drift, not this port.
    status: passing      # verified via the shipped-fixture control
  - id: regulation-reduces-flagella-across-generations
    statement: |
      Across cell generations, the flagella_regulation lineage (regulation ON =
      feature + full initial-state override) carries fewer complete flagella
      (CPLX0-7452) than the unregulated lineage at each generation.
    status: passing        # 2026-07-28: literally true again under the new full-
                           # override ON definition (4-seed x 3-gen: ON < OFF in
                           # 12/12), but see the caveat test below before citing
                           # this as "the cascade reduces overexpression."
  - id: count-direction-is-confounded-not-a-clean-regulatory-effect
    statement: |
      The ON < OFF count gap seen under the full-override ON definition is
      confounded with the initial-condition difference (OFF starts ~30-45,
      ON starts at 4) and should NOT be read as a clean demonstration that
      regulation reduces flagella count: the per-generation means CONVERGE
      (ON rising, OFF falling) rather than holding a steady gap.
    status: passing        # confirmed: ON means 20.5/28.0/31.0 (rising) vs OFF
                           # means 49.25/43.25/39.5 (falling) across 3 generations
    caveat: |
      Resolving this needs either more generations (does ON's rise cross OFF?)
      or a same-initial-condition comparison (OFF also given the override) —
      neither has been run yet.
  - id: regulation-increases-flagella-calibrated-override-free
    statement: |
      On the calibrated full-mode cache, WITHOUT the initial-state override
      (regulation ON = feature only), the regulated lineage carries MORE complete
      flagella than the unregulated one, robustly across seeds.
    status: superseded     # 2026-07-28: this was true under the PRIOR "ON = feature
                           # only" definition (4-seed x 3-gen: ON means
                           # 62.5/54.8/59.0 vs OFF 49.5/44.2/40.8; ON>OFF in 11/12).
                           # That definition is no longer the investigation's
                           # standard "regulation ON" (see full-override tests
                           # above) -- kept here for historical record, not
                           # re-run under the current definition.

# Two-tier acceptance (Maya's suggestion — separate "did the MODEL behave" from
# "is it BIOLOGICALLY right"). For the baseline study, biological success is
# faithfully reproducing the KNOWN overexpression problem, not fixing it.
success_criteria:
  model:
    - Feature OFF is byte-neutral — init_prob_override == 0 on every promoter for the
      whole run; the cell grows and divides exactly as pre-port main (verified).
    - The composite runs to division without error with the flagella code present.
  biology:
    - Reproduces the documented unregulated overexpression (~48 complete flagella,
      far above the biological handful) — the motivation the cascade must address.
    - FUTURE — a calibrated model would bring counts toward the biological few; this
      baseline only establishes the gap (see the COUNT VERDICT in investigation.yaml
      and this study's own ensemble chart/findings for the current, unresolved state).

notes: |
  Maya's prelim (Aim 2 rationale): "current expression of flagella is exceedingly
  high compared to biological levels and manual adjustments like multipliers,
  adjustments to stoichiometry, and overrides are a plausible approach to minimize
  expression ... however, manual tuning is not a biologically and mechanistically
  sufficient solution." This study is the no-regulation reference the cascade
  studies are measured against.

  Glossary (for reviewers):
    - features=[] — the composite's opt-in feature list is empty, i.e. regulation
      OFF (stock WCM). features=['flagella_regulation'] switches the SUM-gate ON.
    - "stale" (where it appears on a chart/cache note) — outdated: generated from an
      earlier cache/run and superseded, kept only for provenance.
    - Are the tests/claims editable? Yes — every behavior_test and success_criterion
      here is hand-authored YAML in this study.yaml; edit it directly. Tests are a
      mix of STANDARD categories (shared across studies — see the investigation's
      testing_standard) and claims UNIQUE to each study.
