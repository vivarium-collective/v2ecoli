schema_version: 4
name: dnaa-4-autoregulation
investigation: dnaa-replication   # owning investigation (back-reference)
title: Study 4 — Test Autoregulation   # reader-friendly (Rashmi 2026-06-14); was: DnaA negative autoregulation — self-stabilizing the DnaA pool without the V override
created: '2026-06-10'
status: completed   # 2026-06-20 complete: established reference config (linear s=0.6 + F-05); multi-seed (0/1/2) done; gate partial only on the seed-sensitive DnaA-ATP fraction (a noted caveat, homeostasis robust). 2026-06-10 scoped, first diagnostic done. The next mechanism study, off the back of dnaa-3 (box-binding adopted) and the verified autoregulation gap. Wiring the DnaA-ATP→dnaA-promoter negative recruitment edge (coupled to the adopted dnaA-promoter box occupancy) so DnaA self-stabilizes in [300,800] without the manual V override, to dissolve the dnaa-1/dnaa-2 V tension and per-gen drift at the root.

# Canonical 6-axis status
design_status: done             # scoping done (SCOPING.md); autorepression-edge mechanism designed + wired
implementation_status: done     # DnaA-ATP→TU00259 negative recruitment edge wired (linear s=0.6 + F-05 canonical)
simulation_status: ran
evaluation_status: evaluated
gate_status: partial
expert_review_status: needs_review   # the autoregulation gap was Rashmi's own flag (her box-binding handoff); this study takes it up

seeded_from:
  study: dnaa-3-box-binding
  reason: |
    Builds directly on the adopted active box-binding (PR #162). DnaA's binding to
    its own promoter (the 2 dnaA-promoter boxes) is now modeled and emitted; that
    occupancy is the feedback signal autorepression needs.

pipeline_gate:
  prerequisites:
    - dnaa-3-box-binding
  enables:
    - dnaa-5-cooperativity
  gate_status: partial

question: |
  Can DnaA negative autoregulation hold the DnaA pool self-stabilized in the
  literature [300,800] band across generations without the manual V override
  (Mechanism A) — by wiring DnaA-ATP repression of its own promoter into the
  transcription recruitment (synth_prob = basal + delta_prob × dnaA-promoter
  occupancy) — and does this dissolve the dnaa-1/dnaa-2 V tension (0.8e-3 vs 1e-3)
  and the per-gen drift at their root?

background: |
  Verified gap (2026-06-10): the runtime recruitment is dynamic
  (transcript_initiation: p_i = max(0, basal_i + Σ delta_prob[i,j]·bound_TF_j)),
  but the dnaA promoter has no DnaA-ATP recruitment edge (target_tf[TU00259[c]]
  = None and delta_prob[TU00259[c], MONOMER0-160] = 0), so no feedback path
  exists, and the V override additionally replaces the dnaA synth prob outright.
  A naive post-hoc patch failed (DnaA collapsed to ~17; basal didn't propagate,
  no edge to carry the signal). First diagnostic (2026-06-10): in the adopted
  box-binding run the dnaA-promoter boxes are occupied and vary (mean 1.41/2,
  range 0.5-2.0), so the feedback signal exists and option (b) is viable.

mechanism: |
  Wire a negative DnaA-ATP → dnaA-promoter (TU00259[c]) recruitment edge so the
  dnaA synth prob is modulated down as DnaA occupies its own promoter. Two sources
  for the bound-fraction:
    (a) the standard recruitment TF machinery (p_promoter_bound for DnaA-ATP),
        cheapest test; must force the edge to survive the ParCa L1 fit;
    (b) principled: drive it from Rashmi's adopted dnaA-promoter box occupancy
        (promoter_high_bound), unifying box-binding with regulation. Preferred,
        and the first diagnostic shows the signal is present.
  Calibrate basal (max unrepressed rate) + repression strength (anchor on the
  −2.31 log2 FC ≈ 5×) so the feedback equilibrium lands DnaA in-band. Drop the V
  override for this study.

conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    inherited_from: dnaa-3-box-binding   # the adopted active box-binding mechanism (PR #162)
    params:
      condition: succinate
      seed: 0
      single_daughters: true
      max_generations: 8
      V_override: none   # the point: feedback sets the dnaA level, not a fixed V
  variants:
    - name: basal-x-strength-sweep
      description: |
        2-D calibration of basal (max unrepressed dnaA synth) × repression strength,
        to find the combo whose feedback equilibrium holds DnaA in [300,800].
      params:
        basal_synth_prob: sweep
        repression_strength: sweep
    - name: signal-source
      description: |
        (a) standard TF p_promoter_bound for DnaA-ATP vs (b) coupled to the adopted
        dnaA-promoter box occupancy. Diagnostic confirmed (b) has a usable signal
        (occupancy mean 1.41/2, range 0.5-2.0).
      params:
        source: a-vs-b
  model_settings:
    - name: autorepression-edge
      detail: "DnaA-ATP→TU00259 negative recruitment edge: synth_prob = basal + delta_prob × dnaA-promoter occupancy; restored from the −2.31 log2 FC, forced to survive the L1 promoter fit."
    - name: repression-signal-source
      detail: "dnaA-promoter occupancy from the adopted box-binding listener (promoter_high_bound) drives the bound-TF fraction (option b)."
    - name: no-V-override
      detail: "No genetic_perturbations on TU00259[c] — the feedback sets the dnaA level (vs the fixed V override in dnaa-1/dnaa-2)."
    - name: canonical-run-parameters
      detail: |
        Canonical reference (F-07; Rashmi/Haochen commit eb4ea39): linear autoregulation s=0.6 + F-05
        (kinetic apo+ATP charging) at V=1.5e-3 reproduces a clean band pass and clean cell cycle
        (run dnaa4_s06_F05_seed1_12gen; figures dnaa4_linear_s06_F05_trajectory/_regions). Reproduce:
        DNAA_AUTOREG_FORM=linear DNAA_AUTOREG_STRENGTH=0.6 DNAA_HYDROLYSIS_RATE_PER_MIN=0.025 + the F-05
        cache patch (integrate_dt_mask[24]=True) + --perturbation "TU00259[c]=1.5e-3". K_d values (below)
        unchanged.
        ──────────────────────────────────────────────────────────────────────────────────────────
        Prior exploration (superseded by F-07): the Hill s=0.7 3-seed runs (dnaa4_s07_seed{0,1,2},
        succinate, 16 generations), per Rashmi 2026-06-14:
          • dnaA expression V = 1.5e-3, the TU00259[c] synthesis-probability override (--perturbation "TU00259[c]=1.5e-3"). Note: the runs do use this fixed base V; the autoregulation scales it down, so the realized scheme is "base V=1.5e-3 × Hill feedback", not the pure no-V-override the design aspired to.
          • DnaA-box binding K_d (dnaa_box_binding.py KD_HIGH_M / KD_LOW_M):
              – high-affinity pools — chromosomal_high (302 sites), oriC_high (3 sites), dnaA-promoter_high (2 sites): K_d = 3 nM, for BOTH DnaA-ATP and DnaA-ADP (loosened 1→3 nM in dnaa-4 so the dnaA-promoter de-occupies at low [DnaA]).
              – oriC_low (8 sites): K_d = 100 nM, DnaA-ATP only.
          • DnaA-ATP intrinsic hydrolysis rate k_h = 0.025 /min (DnaA-ATP→DnaA-ADP; DNAA_HYDROLYSIS_RATE_PER_MIN=0.025, lowered from the 0.046 default per Rashmi's handoff).
          • Autoregulation (prior Hill exploration): Hill form, s = 0.7, K = 0.5, n = 4; dnaA synth scaled by (1 − s·fⁿ/(Kⁿ+fⁿ)), f = dnaA-promoter occupancy. Band partial (2/3 seeds; F-06 found s=0.65 stalled division). Superseded by the linear s=0.6 + F-05 reference above (F-07, which reaches a clean band pass and clean cycle).
        Hill-exploration env: DNAA_AUTOREG_STRENGTH=0.7 DNAA_AUTOREG_FORM=hill DNAA_AUTOREG_HILL_K=0.5 DNAA_AUTOREG_HILL_N=4 DNAA_HYDROLYSIS_RATE_PER_MIN=0.025 … --perturbation "TU00259[c]=1.5e-3" --generations 16 --seed {0,1,2}

readouts:
  - name: total DnaA pool
    identifier: bulk PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c]
    units: molecules/cell
    status: primary
  - name: per-generation DnaA drift
    identifier: per-gen mean of total DnaA across the lineage
    units: molecules/cell
    status: primary
  - name: dnaA-promoter occupancy → synth prob (the feedback loop)
    status: measured
    identifier: listeners.replication_data.promoter_high_bound  vs  actual dnaA synth prob
    units: fraction / probability
    notes: The repression signal and the synthesis it modulates — the autoregulation loop itself.
  - name: oriC count + cell mass
    status: measured
    identifier: listeners.replication_data.number_of_oric · listeners.mass.cell_mass
    units: count / fg
    notes: Cell-cycle integrity — oriC 1↔2, periodic mass-doubling, preserved under feedback.
  - name: dnaA initiation rate
    status: measured
    identifier: dnaA initiations per minute
    units: per min
    notes: 'Stretch: does feedback hit ~1/min and keep the pool in-band (no constitutive V did both)?'

planned_runs:
  - name: autoreg-feedback-no-V
    status: planned
    n_steps: ~8 generations (succinate, seed 0, on the adopted box-binding cache)
    details: Wire the autorepression edge + drop the V override → does DnaA self-stabilize in [300,800] via feedback?
  - name: basal-strength-calibration
    status: planned
    n_steps: 2-D sweep (basal × repression strength), short lineages
    details: Find the (basal, strength) combo whose feedback equilibrium lands DnaA in-band; confirm on a full 8-gen run.

simulation_set:
  - name: autoreg-feedback-no-V
    kind: multi-gen-lineage
    status: planned
    base_model: v2ecoli baseline + adopted box-binding + autorepression edge
    duration_steps: ~8 generations
    seeds: [0]
    metrics: [total-DnaA-in-band, per-gen-drift, dnaA-promoter-occupancy, oriC, init-rate]
    pass_fail_tests: [dnaa-pool-self-stabilizes-in-band-no-V, cell-cycle-preserved]

visualizations:
  - name: dnaa4_s06_F05_3seed_comparison
    address: charts/dnaa4_s06_F05_3seed_comparison.png
    status: rendered
    config:
      title: >-
        Multi-seed confirmation (F-08): per-generation means for the linear-s=0.6 + F-05 reference
        across seeds 0/1/2 (12 gens each). Top, total DnaA pool: all three seeds hold in [300,800]
        every steady gen g4-11 (homeostasis robust 3/3). Bottom, DnaA-ATP fraction: in [0.2,0.5]
        only on seed 1 (0.261); seed 0 ramps toward band (0.156), seed 2 low/erratic (0.085); the
