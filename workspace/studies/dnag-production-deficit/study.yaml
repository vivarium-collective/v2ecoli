conclusion: |
  The DnaG deficit is a translation-side execution gap, and the dedup hypothesis is
  refuted.

  Walking the production chain resolves three candidates into one. Transcription is
  NOT the lossy step: TU00352 sits at the 91.9th percentile of 3277 transcripts, 30x
  the median. Degradation is exactly the default rate. Translation efficiency is the
  1.5th percentile of 4309 monomers, 2.27e-05 against a median of 2.30e-04. The
  operon confirms the localisation independently: rpsU, dnaG and rpoD share one
  transcript and one mRNA pool, yet their model/literature ratios span 3.55x
  (rpsU 1.81x over, dnaG 0.64x, rpoD 0.51x), which transcription cannot produce.

  The larger gap is against the model's own target rather than against experiment.
  ParCa fits DnaG at 38 copies, a reasonable 0.64x of the four-dataset literature
  median of 59. The simulation then delivers a mean of 1.76 and sits at zero for
  61.6% of a healthy 12-generation lineage: 22x below the parameterisation it was
  given. A repair aimed only at recalibrating DnaG upward would miss this, because
  even a perfect fit would leave the simulation ~20x short.

  This is what makes the gate unusable. It demands 2 DnaG per origin against a
  supply that is absent most of the time, which is why study 2's mechanistic arm
  stalled in 8 of 8 seeds and why removing DnaG from the requirement restored 12/12.
  Whether that deficit is WHY the option ships disabled is an inference we cannot
  settle: the process schema defaults it to True, the cache overrides it to False,
  and this repository records no rationale.

  The cost to the investigation is its founding hypothesis. Study 1 traced the arrest
  to DnaG and the standing assumption was that the rpsU-promoter dedup starved it.
  dnaG's transcript turns out to be among the most transcribed in the model. The
  dedup remains a genuine structural defect -- it still prevents dnaG from being
  regulated independently of rpsU and rpoD -- but it is not the route by which DnaG
  becomes scarce, and repairing it would not raise DnaG.

  A methodological note worth keeping. Comparing against Schmidt alone would have
  shown the model OVER-producing DnaG by 6x, the exact opposite of the truth; Schmidt
  reads 6 copies where Soufi, Mori and Li read 53, 66 and 98. That error was made
  during scoping, from the two proteomics tables the repo ships, and corrected only
  by pulling all four datasets.

  Next: HolA (1.9th percentile) and HolB (5.7th) sit in the same translation tail as
  DnaG, so this may be a systematic property of low-abundance proteins rather than a
  DnaG-specific accident. Whether the low efficiency is inherited from the Li 2014
  input or introduced by how ParCa applies it is the question that decides the fix.
conclusion_verdicts:
  regression_compatibility:
    verdict: confirmed
    basis: No model code or data was changed. The study is a deterministic read of the ParCa cache, the four proteomics datasets, and a lineage already simulated for replisome-gate-sufficiency.
  biological_validation:
    verdict: not_met (execution gap, not calibration)
    basis: The simulation delivers 4.6% of ParCa's own fitted DnaG count, failing the one acceptance criterion that was genuinely open at design time. ParCa's fit is only 0.64x the literature median, so the model's disagreement is primarily with itself rather than with experiment.
  explanatory_gain:
    verdict: confirmed
    basis: The study replaces the investigation's standing explanation with a measured one. It refutes the dedup/transcription hypothesis (91.9th percentile), localises the loss to a per-cistron step via an internal operon control (3.55x spread on one mRNA pool), identifies translation efficiency as the anomalous step (1.5th percentile), and separates a modest calibration shortfall (0.64x) from a large execution gap (22x) that any repair must address separately.
claim: "DnaG is scarce because of a translation-side execution gap, not the transcription-unit dedup: its transcript is 30x the median, but the simulation delivers 4.6% of ParCa's own fitted count."
