          band that the discrimination check cannot grade.
    lineage-completes-with-restored-tus:
      low: 8
      high: 12
      provenance:
        kind: theory
        note: Spans 1.5x; anchored at 8 so a partial rescue is recognised, matching the retired study's
          band.
    restoration-is-not-a-global-growth-artefact:
      low: 0.67
      high: 1.5
      provenance:
