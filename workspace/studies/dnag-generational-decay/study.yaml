    ppgpp-conc-rises-across-generations:
      op: '>='
      value: 1.2
      provenance:
        kind: theory
        note: Smallest rise that could drive the observed decay through the squared Hill term.
    ppgpp-predicts-the-decay:
      low: 0.67
      high: 1.5
      provenance:
        kind: theory
        note: 'Two-sided on predicted/observed. A one-sided bound would let a prediction that grossly
          UNDER-shoots the decay count as agreement. Zero free parameters: synth_prob is fitted and untouched,
          and ppGpp_conc is measured.'
    decay-survives-within-class-normalisation:
      low: 0.67
      high: 1.5
      provenance:
        kind: theory
        note: Reframed from an absolute ratio to a RATIO-OF-RATIOS so it reads on the same 0.67-1.5 scale
          as the other discriminators and spans 3x. The absolute form ([1.5, 100]) was both unbounded
          in practice and 3x wider than the audit permits, and it conflated 'dnaG decayed' with 'dnaG
          decayed relative to its class' -- which is precisely the H1-vs-H4 distinction this axis exists
