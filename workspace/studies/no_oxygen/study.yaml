conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      media: minimal_minus_oxygen
  model_settings: []
confidence: Accepted
findings:
- id: no_oxygen-vs-vecoli-result
  kind: computational
  status: partial
  statement: 'v2ecoli reproduces vEcoli on no_oxygen (4-seed gen-1, Welch t-test):
    cell, dry, protein and RNA mass within tolerance (4/5 within_tol); growth rate
    shows a non-significant drift. 2 of 4 seeds hit a pre-existing anaerobic-FBA numerical
    edge case (BIOTIN homeostatic target near zero); graded on the clean seeds.'
  evidence:
    from_card: statistical
    observed: growth +6.7% (p=0.50, not significant); RNA +1.0%; cell +1.0%; dry +1.0%;
      protein +0.5% -- 4/5 within_tol, overall drift.
inputs:
- artifact: sim_data
  from: parca
  into: cache_dir
pipeline_gate:
  enables: []
