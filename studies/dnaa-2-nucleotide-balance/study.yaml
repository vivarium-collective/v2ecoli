    notes: Cell-cycle integrity — one initiation per generation, oriC oscillating 1↔2.
  - name: cell mass
    status: measured
    identifier: listeners.mass.cell_mass
    units: fg
    notes: Periodic sawtooth; per-generation doubling time ~70 min on succinate (Rashmi's reproduction).
  - name: cellular bulk ATP[c] / ADP[c]
    status: measured
    identifier: bulk__count[ATP[c], ADP[c]]
    units: molecules/cell
