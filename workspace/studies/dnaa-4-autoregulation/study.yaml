  - name: dnaa4_linear_s06_F05_regions
    address: charts/dnaa4_linear_s06_F05_regions.png
    status: rendered
    config:
      title: >-
        Per-chromosome DnaA-box occupancy by region across gen 7 of the linear-s=0.6 + F-05 reference
        (k_h=0.025/min): oriC low-affinity stays low (2-3/8, over-binding resolved), high-affinity
        full, clean fork passage to two daughter chromosomes. Reproduces page 2 of Rashmi's PDF.
  - name: dnaa4_effect_thermostat
    address: charts/dnaa4_effect_thermostat.png
    status: rendered
    config:
      title: >-
        The homeostasis result (form-independent): steady DnaA setpoint vs constitutive expression
        rate V. With autoregulation off the pool tracks V and runs out of band; with it on the
