model_change: |
  ADOPTED: Rashmi's ACTIVE DnaA-box binding mechanism (v2ecoli PR #162, merged),
  ported into this study via a flat_overrides/dna_sites.tsv true-override. It
  replaces the read-only occupancy observer used earlier in this study.

  - Binding is solved as an active Langmuir equilibrium that DEPLETES the free
    DnaA-ATP pool (vs the read-only observer, which only wrote
    listeners.dnaA_binding and never mutated the pool).
  - Per-pool free / bound-ATP / bound-ADP counts emitted on
    listeners.replication_data (chromosomal_high, oriC_high, oriC_low, promoter_high).
  - All box pools double across replication (315↔630; low-affinity 8→16 per oriC via
    fork-passage release), fixing the read-only deriver's hard-coded low-aff pool.
  - The dnaA expression knob V was tuned to 0.8e-3 (from 1e-3) to hold the total DnaA
    pool within [300,800] on the canonical run.
  Follow-ups recorded (not done here): remove the now-redundant read-only listener and
  re-point the historical charts; and the deeper item Rashmi flagged — DnaA
  self-autoregulation is dropped at runtime (delta_prob TU00259[c] self-edge = 0),
  which is the dnaa-4 question.

design_pivot_required:
- id: adopt-active-box-binding
  status: accepted   # 2026-06-10 — Rashmi's active mechanism (PR #162) reviewed, verified, and adopted
  question: >-
    The read-only occupancy observer pinned oriC-low occupancy ~0.8 (free DnaA-ATP
    stayed several-fold above the 100 nM K_d for the whole cycle, never drawn down)
    and its 8 low-affinity sites were a hard-coded pool that did not double at
    replication. Replace it with Rashmi's ACTIVE depleted-pool Langmuir mechanism?
  alternatives:
  - "Keep the read-only observer (over-binding unresolved; low-aff pool under-doubled)."
  - "Adopt the active mechanism (PR #162) — the Langmuir solve depletes the free pool, so oriC-low fills gradually, and all boxes double 315<->630 at replication."
  requested_response: Confirm the adopted mechanism is correct and should stand.
  notes: >-
    ADOPTED + verified on our side: over-binding RESOLVED (oriC-low gradual ~0.3→0.7
    vs read-only ~0.8), box-doubling FIXED (315↔630), cell cycle clean (8/8 divisions,
    oriC 1↔2). The read-only-era charts are historical/superseded.
- id: defer-atp-fraction-to-dnaa-4
  status: open
  question: >-
    No constitutive V satisfies both the DnaA pool band [300,800] and the inherited
    DnaA-ATP-fraction band [0.2,0.5] (the V-tension): tuning V down to hold the pool
    drives the ATP fraction to 0.127, below the band, and active binding sequesters
    DnaA-ATP onto boxes. Defer closing the fraction to a regulated-V lever (dnaa-4
    negative autoregulation) rather than force a constitutive V?
  alternatives:
  - Force a constitutive V to hit the ATP-fraction band (breaks the [300,800] pool band).
  - Defer to dnaa-4 negative autoregulation (feedback-controlled dnaA synthesis).
  requested_response: Confirm deferral of the ATP fraction to dnaa-4 is the right scoping.
  notes: >-
    This deferral was the basis of the earlier 'partial' verdict — the adopted
    mechanism met its core goals; the ATP fraction was a known constitutive-V tension,
    not a refutation of the mechanism. RESOLVED 2026-06-16: the dnaa-4 autoregulation
    mechanism (linear s=0.6 + F-05) returns the fraction to band (0.284) on the
    current-config re-run, so the deferral is closed and the verdict is now a clean pass.

# ── Reference documents (staged under workspace/references/dnaa/) ──────────────
references:
- name: molecular-information-replication-initiation
  path: ../../workspace/references/dnaa/molecular_information_replication_initiation.pdf
  role: |
    Biology source. 11 oriC boxes (3 high-aff R1/R2/R4; 8 low-aff R5M, τ2, I1,
    I2, C3, C2, I3, C1), affinity ranges (high ≈1 nM; low >100 nM), nucleotide
    specificity (high bind ATP+ADP; low prefer ATP), dnaA-promoter box layout.
- name: oric-sequence
  path: ../../workspace/references/dnaa/oric_sequence.pdf
  role: |
    462-bp oriC sequence with all 11 boxes annotated. Source for the 8
    low-affinity box coordinates (see inputs_to_supply).
- name: parameters-wcm-stage1-heuristics
  path: ../../workspace/references/dnaa/parameters_wcm_stage1_heuristics.pdf
  role: |
    Stage-1 heuristic parameters (rows 13-17 cover DnaA-box params).

# ── Box catalog: the four pools (315 sites total) ─────────────────────────────
box_catalog:
  total_sites: 315
  pools:
  - name: chromosomal_high
    n_sites: 302
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    source: |
      307 consensus DnaA boxes (TTWTNCACA, Schaper-Messer) computed at
      ParCa-build time on the K-12 genome, MINUS the 3 oriC high-aff + 2
      dnaA-promoter high-aff sites broken out into their own pools = 302.
  - name: oric_high
    n_sites: 3
    sites: [R1, R2, R4]
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    coords_signed: {R1: -55, R2: 50, R4: 124}     # known anchors (spec)
  - name: oric_low
    n_sites: 8
    sites: [R5M, "τ2", I1, I2, C3, C2, I3, C1]
    kd_nM: 100     # Haochen first-step; higher-order site interactions deferred to a later study
    binds: [DnaA-ATP]
    state_counts: [free, bound_ATP]
  - name: promoter_high
    n_sites: 2
    sites: [box1, box2]
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    coords_signed: {box1: -41917, box2: -42883}     # relative to oriC (spec)

# ── Haochen's first-step assumptions (from spec.md) ───────────────────────────
key_assumptions:
- All 307 consensus DnaA boxes (TTWTNCACA) are high-affinity (K_d ≈ 1 nM).
- oriC has 3 high-affinity + 8 low-affinity boxes; low-affinity K_d ≈ 100 nM.
- DnaA-ATP and DnaA-ADP binding to boxes is FAST EQUILIBRIUM (only K_d matters; absolute k_fwd/k_rev magnitudes degenerate after the steady-state solve).
- DNA binding does NOT alter the DnaA-ATP intrinsic hydrolysis rate (bf8b82e k ≈ 0.046/min applies uniformly to bound and free DnaA-ATP).
- Higher-order interactions between low-affinity sites are DEFERRED to a later study.
- High-affinity pools track bound-ATP and bound-ADP separately so the correct nucleotide form can be released later by downstream regulatory studies (extrinsic DnaA-ATP/ADP conversion + sequestration; per Haochen's spec).
- 'DISCREPANCY (recorded): the Stage-1 parameter brief lists oriC low-affinity K_d as a 50→1 nM range; dnaa-3 uses Haochen''s first-step K_d ≈ 100 nM, with higher-order site interactions deferred to a later study. The spec assumption governs.'

