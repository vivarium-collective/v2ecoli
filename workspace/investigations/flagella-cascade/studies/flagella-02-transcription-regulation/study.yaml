findings:
- id: flagella-02-gate-writes-overrides
  kind: computational
  status: confirms
  statement: >-
    With the feature ON the Kalir & Alon SUM-gate writes nonzero init_prob_override
    onto the flagella Class II/III promoters within the first ticks, and
    transcript_initiation substitutes it where > 0 — the MODEL mechanism fires.
  evidence:
    observed: "17 nonzero promoter overrides after 10 s (feature ON)"
    expected: "nonzero overrides on the 7 Class II + 9 Class III flagellar TUs once the gate is wired"
- id: flagella-02-classII-before-classIII
  kind: computational
  status: confirms
  statement: >-
    Mean Class II init_prob_override sits above Class III for the whole run and the
    ordering is re-established after a cell division — the experimentally observed
    Class II -> Class III hierarchy (BIOLOGY-level success).
  evidence:
    observed: "600 s single-gen: Class II 1.532e-4 vs Class III 4.338e-5; 2-gen: ordering re-established in the daughter"
    expected: "Class II (FlhDC-weighted) > Class III (FliA-weighted) — Kalir & Alon, Cell 2004"
- id: flagella-02-temporal-lag-needs-low-IC
  kind: computational
  status: inconclusive
  statement: >-
    A clean TEMPORAL lag (Class III rising later, not merely lower) is not fully
    resolved even under the current full-override ON condition (4 flagella at t=0)
    within a single 600 s window — see the low-IC findings below for the clearer
    900 s demonstration of the onset delay.
  evidence:
    observed: "regulation ON (feature + override) starts at 4 flagella, 500 FliA, 800 FlgM at t=0"
    expected: "Class III ~ 0 until FlgM export frees FliA — visible from a pre-assembly start"
- id: flagella-02-flgm-secreted
  kind: computational
  status: confirms
  statement: >-
    Type-III secretion depletes cytoplasmic FlgM in proportion to complete flagella,
    and the FlgM-FliA equilibrium releases free FliA — the anti-sigma-factor gate
    fires (MODEL mechanism).
  evidence:
    observed: "FlgM (G369-MONOMER[c]) 800 -> 278 over 600 s with complete flagella present"
    expected: "FlgM falls when flagella are present; free FliA rises as FlgM is cleared"
- id: flagella-02-flia-bounded
  kind: computational
  status: confirms
  statement: >-
    Free FliA stays within a bounded band rather than running away — the flgM
    Class III negative-feedback loop caps it (BIOLOGY-level: the runaway
    sigma-28 seen without the loop is prevented). Under the full-override IC,
    FliA is NET SEQUESTERED (declining) over the first 600 s, since FlgM (800
    at t=0) is still substantial and continues pulling free FliA into the
    FLGM-FLIA-CPLX; the actual release (rising FliA as FlgM depletes further)
    only becomes visible over a longer window — see chart 01 (900 s: FliA
    500 -> 580, a net rise once FlgM has fallen further).
  evidence:
    observed: "600 s: free FliA 500 -> 288 (still declining, FlgM still 278); 900 s (chart 01): FliA 500 -> 580 (net risen, bounded)"
    expected: "bounded free FliA, not unbounded growth (Stefan et al. 2015) -- direction depends on the window length relative to FlgM depletion"
- id: flagella-02-assembly-gated-onset
  kind: computational
  status: supports
  statement: >-
    From the standard low-flagella regulation-ON initial condition (full 4-value
    override) the Class III override starts at exactly 0 and rises only as FlgM
    is secreted — the assembly-gated Class II -> Class III onset delay that the
    default already-flagellated cache hides.
  evidence:
    observed: "900 s full-override run (chart 01): FlgM 800 -> 117, Class III override 0.0e+00 -> 6.09e-05, rising gradually from exactly 0"
    expected: "Class III delayed until basal-body completion exports FlgM"
- id: flagella-02-full-override-no-equilibrium-error
  kind: computational
  status: confirms
  statement: >-
    Applying all 4 of Maya's original vEcoli override values (including direct
    FliA/FlgM overrides, not just the reduced flagella/motor-only approximation
    above) runs cleanly against a full-mode ParCa cache for 900 s, with no
    equilibrium-solver error. The rate constants for FLGM-FLIA-CPLX_RXN are also
    byte-identical between v2ecoli and vEcoli (kf=1, kr=2E-7 in both
    flat_overrides/equilibrium_reaction_rates.tsv files), so this isn't a
    calibration difference either — the reduced override above was an unnecessary
    precaution, most likely written against the fast-mode cache (which fails
    immediately with an unrelated missing-field error, easily mistaken for "the
    solver went negative").
  evidence:
    observed: "comp.run(900) completes with no exception; FlgM 800->117, FliA 500->580, Class III override 0.0e+00->6.09e-05"
    expected: "(if the reduced-override precaution were necessary) equilibrium solver goes negative at steady state"
- id: flagella-02-override-literature-grounding
  kind: literature
  status: supports
  statement: >-
    FlgM0=800 matches published measurements closely; FliA0=500 is same-order-of-
    magnitude but somewhat above the directly measured range. Chevance & Hughes
    1998 (Genes Dev, Salmonella) measured FlgM at ~400 nM in wild-type cells and
    "at least twice that" (>=800 nM) in an FlgM-export-defective mutant -- the
    correct comparison for our IC, since it represents a cell that has NOT yet
    secreted FlgM. Converting nM to molecules/cell at typical bacterial cell
    volumes (0.7-1.5 fL) gives ~340-720+ molecules/cell for that export-deficient
    state, and 800 sits right at/near that upper end. FliA0=500 compares against
    Jishage & Ishihama 1996 (J Bacteriol, quantitative immunoblot): sigma-28/FliA
    is maintained at 50% of sigma-70's level (500-700 molecules/cell, exponential
    phase) => FliA ~ 250-350 molecules/cell measured -- 500 is ~1.4-2x above this.
    A dedicated FliA0 x FlgM0 grid scan (36 cells, see notes) directly tested
    whether this gap matters: FliA0=250 (in the measured range) produces the same
    qualitative checkpoint behavior as FliA0=500 (81% vs 76% sequestered at
    t=30s), so the elevated FliA0 does not change the story, even though it is
    not itself tightly literature-justified.
  evidence:
    observed: "FlgM: 800 vs ~340-720+ (export-deficient estimate); FliA: 500 vs ~250-350 (measured); FliA0=250 vs 500 behave qualitatively identically in the grid scan"
    expected: "override values should be same-order-of-magnitude with real measurements, and small deviations should not change qualitative conclusions"
- id: flagella-02-flagella-count-unbounded-runaway
  kind: computational
  status: contradicts
  statement: >-
    CAUTION for any claim about flagella COUNT beyond a short window: the standard
    ecoli-complexation process that forms CPLX0-7452[j] has NO cap on the number
    of independent complete flagella that can form -- it is a plain stoichiometric
    Gillespie SSA (v2ecoli/processes/complexation.py) over
    complexation_reactions.tsv's CPLX0-7452_RXN, limited only by subunit monomer
    availability (FlgE/FliC/FliD/motor components), not by any nucleation-site or
    basal-body-count species. Worse, there is an explicit POSITIVE FEEDBACK loop:
    more flagella -> faster FlgM export (ecoli-flagella-flgm-secretion:
    exported = n_flagella * secretion_rate * dt) -> more free FliA released ->
    more Class III transcription -> more subunit monomers -> more flagella, with
    nothing throttling it. Extending the FliA0 x FlgM0 grid scan's window from
    15 min to a full 42 min generation exposed this directly: flagella count at
    the override IC (500/800) went 4 -> 8 (15 min, matches the short-window
    chart 01 result exactly) -> 18 (42 min), with the growth rate ACCELERATING
    over time (not saturating around the real ~5-10 flagella/cell peritrichous
    count). This is a genuine model limitation, not a validated prediction --
    checked and confirmed that migrating to the NFsim rule-based assembly
    (study 04) would NOT fix it either, since its BNGL rule set has the identical
    structural gap (see flagella-04's new finding). The real biological cap
    (FlhDC-set nucleation/basal-body site limit) is not implemented in either
    assembly pathway currently in this repo.
  evidence:
    observed: "500/800 override, flagella_regulation ON: t=15min flagella=8 (matches chart 01's 900s result); t=42min flagella=18, growth rate increasing over the second half of the run, not plateauing"
    expected: "(if the model correctly capped assembly) flagella count should saturate near the real peritrichous count (~5-10) and stop increasing once nucleation sites are exhausted"
- id: flagella-02-missing-flhdc-complex-degradation
  kind: literature+computational
  status: contradicts
  statement: >-
    REFINEMENT (2026-08-05) of the runaway finding above: real E. coli caps
    flagellar number primarily via growth-rate-coupled ClpXP-mediated
    proteolytic degradation of the FlhD4C2 master regulator complex, NOT
    (primarily) a geometric/nucleation-site limit -- Sisti et al. 2017
    (Sci Rep, strain RP437) show flagella count is growth-rate dependent
    (mean 7.8/cell fast growth vs 2.4/cell slow growth), that "growth-rate
    control of flagellar assembly principally occurs at the level of flhDC
    transcription," and that deleting clpP OR constitutively expressing flhDC
    (bypassing degradation) both eliminate this control. v2ecoli implements
    NEITHER half of this: (1) no ClpXP process exists anywhere in the repo
    (repo-wide grep for ClpX/ClpP process code: zero hits -- only unrelated
    gene-list rows); (2) more fundamentally, the ASSEMBLED FlhD4C2 complex
    (CPLX0-3930) is never degraded by anything at all -- protein_degradation.py
    only degrades individual monomers (explicit TODO at line 50-51 acknowledges
    complexes are not modeled for degradation), so once FlhD/FlhC assemble into
    CPLX0-3930 there is no decay sink for it, only reverse complexation. This
    is directly consistent with what we observe: FlhDC does not decay, it only
    grows (353->406 over 600s, see flagella-02-flia-bounded evidence above).
    This is a MORE mechanistically satisfying candidate fix than an invented
    nucleation-site cap (raised as an open question in study 04) -- it is a
    real, specific, literature-characterized mechanism, and the gap (complexes
    excluded from degradation) is already acknowledged as a TODO in the code,
    not something that needs to be invented. It acts upstream (throttling
    Class II/III transcriptional drive) rather than downstream (throttling
    assembly), so it is complementary to, not a replacement for, a possible
    NFsim nucleation cap -- either could plausibly help on its own; the real
    fix may need both.
  evidence:
    observed: "CPLX0-3930 (FlhD4C2) has no degradation reaction anywhere in v2ecoli; FlhD (EG10322-MONOMER) deg_rate=1.93e-05/s, FlhC (EG10321-MONOMER) deg_rate=1.56e-03/s (~80x faster) from the generic N-end-rule table, not FlhDC-specific; observed FlhDC count only rises (353->406/600s), never decays"
    expected: "(per Sisti et al. 2017) FlhD4C2 should be actively, growth-rate-coupled degraded via ClpXP -- removing this control (their clpP deletion / constitutive flhDC experiments) is exactly what removes flagellar number regulation, which is the state this model is currently in by omission"
- id: flagella-02-flhdc-degradation-implemented-necessary-not-sufficient
  kind: computational
  status: partial
  statement: >-
    IMPLEMENTED AND TESTED (2026-08-05): added a new Step,
    ecoli-flhdc-degradation (v2ecoli/processes/flagella_flhdc_degradation.py),
    applying first-order decay to CPLX0-3930 (FlhD4C2) at
    k=0.00289/s (~4 min half-life, literature-anchored estimate from Claret &
    Hughes 2000's Proteus FlhD/FlhC measurements -- see the process module
    docstring for full provenance). Wired into the flagella_regulation
    feature, first in its step order (v2ecoli/composites/ecoli_baseline.py),
    with its config registered in sim_data.py's get_flhdc_degradation_config
    and added to core.py's _CACHE_CONFIG_NAMES (required regenerating
    out/cache_full via save_cache() -- the cache bundle is a hardcoded
    allowlist of pre-resolved configs, new config-getters are NOT picked up
    automatically). RESULT: the fix works exactly as intended for FlhDC
    itself -- it now decays from 353 to a stable ~173-174 equilibrium and
    STAYS there for the full 42 min run (previously grew unbounded to 625).
    BUT flagella count and free FliA are barely changed (flagella 4->19 at
    42 min, vs 4->18 without the fix; FliA climbs to 3355, similar order of
    magnitude as before) -- FlhDC degradation alone does NOT fix the
    flagella-count-unbounded-runaway symptom. Mechanistic reason: the
    SUM-gate's X = FlhDC/(K_flhDC+FlhDC) term is still deep in its saturated
    regime even at the new, lower FlhDC level (X=173/223=0.776 vs 625/675=
    0.926 before) -- not a large enough drop to meaningfully throttle Class
    II transcription. The dominant runaway engine is the SEPARATE FlgM-
    secretion positive-feedback loop (more flagella -> more FlgM exported ->
    more free FliA -> more Class III transcription, including flgM itself
    -> more subunits -> more flagella), which keeps running regardless of
    exactly how saturated the Class II input is. CONCLUSION: FlhDC
    degradation is real, correct, necessary biology worth keeping (it fixes
    FlhDC's own dynamics, a genuine prior gap) but is NOT SUFFICIENT alone --
    a cap on the assembly/complexation step itself (the nucleation-site idea
    raised in study 04) is still needed to control flagella count. This is
    direct empirical evidence that both fixes are needed together, not
    either/or.
  evidence:
    observed: "With ecoli-flhdc-degradation active: t=0 FlhDC=353/flagella=4 -> t=300s FlhDC=173 (plateaus, stays 173-174 through t=2400s) but flagella still climbs 4->8->10->13->17->19 and FliA still climbs 500->3355 over the same 42 min window"
    expected: "(if FlhDC degradation alone were sufficient) flagella count and FliA should plateau near realistic values once FlhDC reaches its new lower equilibrium, not continue climbing at a similar rate to the un-fixed run"
- id: flagella-02-nucleation-cap-implemented-and-confirmed-working
  kind: computational
  status: confirms
  statement: >-
    IMPLEMENTED AND CONFIRMED WORKING (2026-08-05): added a second new Step,
    ecoli-flagella-nucleation-cap
    (v2ecoli/processes/flagella_nucleation_cap.py), enforcing a hard ceiling
    (max_flagella=10, a round number just above Sisti et al. 2017's observed
    peak mean of 7.8/cell) on CPLX0-7452 count -- reversing
    CPLX0-7452_RXN for any excess, mass-conservingly returning the consumed
    subunits (FLAGELLAR-MOTOR-COMPLEX, FlgE, FlgK, FlgL, FliC, FliD) to their
    free pools rather than deleting them.
    HIT AND FIXED A REAL ORDERING BUG along the way: the cap's step was
    initially anchored the same way as the other 3 flagella_regulation steps
    (insert_before 'ecoli-transcript-initiation'), which put it in an
    EARLIER execution layer than 'ecoli-complexation' (layer 12 vs 16) --
    since complexation is what actually forms new CPLX0-7452 complexes, the
    cap was always checking a stale, one-cycle-behind count, and
    complexation's same-tick production silently outran/canceled its
    correction (empirically: converged to a false plateau ABOVE the cap,
    e.g. stuck at 11 then 12, never enforcing 10). Root-caused by
    instrumenting the Step directly (printing hbb_count and the returned
    bulk update on every call) rather than continuing to guess. Fixed by
    adding after_steps/before_steps support to build_execution_layers
    (v2ecoli/composites/ecoli_baseline.py) so the cap could be anchored on
    insert_after('ecoli-complexation') instead, seeing the fresh
    post-complexation count every cycle. (Also fixed a smaller bug on the
    way: the bulk_array update format for multiple species in one call must
    be a single (index_array, delta_array) pair, not a list of separate
    (idx, delta) tuples -- see complexation.py:164 for the reference
    pattern; this alone did not fix the ordering bug but was a real
    correctness issue too.)
    RESULT after both fixes: flagella count climbs 4->5->8->10 then HOLDS
    EXACTLY AT 10 for the remaining 36 minutes of a 42 min run (t=600s
    through t=2400s), matching the realistic peritrichous range. FlhDC
    still plateaus at ~173 as before. Motor complex (FLAGELLAR-MOTOR-
    COMPLEX) also settles into its own plateau (~194) rather than growing
    unboundedly. Free FliC (flagellin) monomers -- the open question from
    when this fix was scoped -- do NOT blow up once the cap engages; they
    steadily DECREASE (5405->3876->2097->1003->688 over the same window),
    consistent with the whole-cell model's shared, finite translation
    resources (ribosomes, RNAP) naturally limiting oversupply once assembly
    demand is capped, without needing an additional invented synthesis
    throttle.
  evidence:
    observed: "500/800 override, both fixes active: t=600s flagella=10, t=2400s flagella=10 (held exactly, 36 min plateau); FlhDC~173 throughout; free FliC 5405->688 (decreasing, not exploding)"
    expected: "flagella count should reach and hold near the real ~5-10/cell range rather than climbing indefinitely; free monomer pools should not need a separate ad hoc throttle if shared translation-resource competition is a sufficient natural check"
- id: flagella-02-nucleation-cap-removed-superseded-by-flit-checkpoint
  kind: computational
  status: supersedes
  statement: >-
    REMOVED (2026-08-06), per Maya's explicit instruction: "i dont want the
    artificial cap at all". The nucleation cap above worked empirically but
    rested on an arbitrary modeling choice (max_flagella=10 as a hard
    ceiling, not a measured biological limit) -- exactly the kind of "too
    inflated" result Maya flagged. It is superseded by a real,
    literature-grounded mechanism: ecoli-flit-flhdc-checkpoint
    (v2ecoli/processes/flagella_flit_flhdc_checkpoint.py), implementing the
    FliT-mediated negative-feedback checkpoint on FlhD4C2 (Utsey & Keener
    2020 fast-equilibrium reduction; FliT chaperone biology from Yamamoto &
    Kutsukake 2006, Tomoyasu et al. 2003, Yakhnin et al. PMC4239645). This
    required a real ParCa reaction-network edit (FliT homodimerization +
    FliT:FliD equilibrium binding, both competing with CPLX0-7452_RXN for
    the same free-FliD pool) rather than a bolt-on Step -- see the
    parca_overrides.tsv / flat_overrides changes and a fresh full ParCa
    rebuild (out/sim_data_full_flit). flagella_nucleation_cap.py and its
    associated script/chart (run_multigen_nucleation_cap_check.py,
    charts/multigen_nucleation_cap_check.svg) were deleted. Whether the real
    mechanism alone reproduces a realistic, self-limiting flagella count
    (without any hard ceiling) is not yet empirically confirmed -- that is
    the immediate next open question, not something assumed by this removal.
  evidence:
    observed: "Cap removed from ecoli_baseline.py's flagella_regulation feature, sim_data.py, core.py cache-name list; flagella_nucleation_cap.py, run_multigen_nucleation_cap_check.py, and its chart deleted from the repo."
    expected: "n/a -- this is a design decision, not an empirical result; the empirical question (does flagella count self-limit without a hard cap) is still open pending a test run with out/cache_full rebuilt from out/sim_data_full_flit"
- id: flagella-02-real-stoichiometry-and-gillespie-replacement
  kind: computational
  status: supersedes
  statement: >-
    (2026-08-06) The vendored CPLX0-7452_RXN (flagellum) and FLAGELLAR-MOTOR-
    COMPLEX_RXN used ParCa's null-stoichiometry default (-1 copy of every
    reactant) for essentially every component -- corrected to real, cited
    values (FliC ~20,000 per filament, PMC7696725; FliF/FlgH/FlgI 26-34-fold
    cryo-EM symmetry; FliG/FliM/FliN 34/34/111, PMC10128058; full table in
    CHANGES_2026-08-06.md). This exposed a real numerical limitation:
    Gillespie SSA's propensity calculation (a product of per-reactant
    combinatorial terms) overflows at this scale -- confirmed empirically
    (a single coefficient of 60 is safe; 5+ simultaneous double-digit
    coefficients, or one coefficient of 20,000, are not). Fixed by excluding
    these 3 reactions from ecoli-complexation (complexation.py's
    RUNTIME_EXCLUDED_REACTIONS, applied to BOTH the runtime process and
    ParCa's own internal use of the same dataclass) and replacing them with
    dedicated deterministic/kinetic Steps: flagella_motor_switch_assembly.py,
    flagella_motor_complex_assembly.py (both instant/deterministic -- the
    move was purely numerical, not biological), and
    flagella_filament_nucleation.py + flagella_filament_elongation.py (a new
    nascent_flagellum unique molecule with persistent filament_length,
    growing per Renault et al. 2017's real dL/dt=a/(b+L) injection-diffusion
    rate law -- genuinely gradual, rate-limited biology, not just a
    numerical workaround).
  evidence:
    observed: "Full ParCa rebuild (out/sim_data_full_flit_v2) completes without the prior 'total propensity is NaN' failure; nascent_flagellum tracks real, gradual filament growth in test runs."
    expected: "n/a -- structural/numerical fix, not an empirical biology claim"
- id: flagella-02-fliC-synthesis-gap-found-partially-fixed
  kind: computational
  status: confirms
  statement: >-
    (2026-08-06) With correct stoichiometry in place, directly measured
    (not estimated) fliC's real-time synthesis rate during an active Class
    III override: ~0.71 molecules/s, sustained over a 1800s near-zero-pool
    window -- vs. ~46/s peak demand back-calculated from Renault et al.
    2017's growth curve, a ~65x gap. Root cause: the Class III override
    (override = Y * basal_prob, flagella_transcription_regulation.py) caps
    out AT basal_prob (ParCa's population-average, non-motile-induced fitted
    rate) since Y saturates toward but never exceeds 1 -- it structurally
    cannot exceed that ceiling no matter how much FliA accumulates. Fixed
    fliC's ParCa-fitted expression 10x via a new
    flat_overrides/rna_expression_adjustments.tsv entry (registered through
    parca_overrides.tsv's adjustments__rna_expression_adjustments key --
    the SAME per-cistron expression-adjustment mechanism already used for
    10 other genes in the base reconstruction, applied in ParCa Step 2 so
    the whole downstream fit stays internally consistent). 10x, not the
    full 65x, was chosen as the defensible ceiling: all mRNA genes share
    one FIXED total transcription-probability budget
    (transcript_initiation.py's is_mrna rescale), and 65x would put fliC
    alone at ~13.5% of the cell's ENTIRE mRNA output -- judged unrealistic,
    would starve hundreds of co-expressed genes. 10x -> ~2.3% of the
    budget, argued plausible given flagellin's known high abundance in
    motile cells.
  evidence:
    observed: "Post-fix, real-time synthesis measured at ~6.0 molecules/s (sustained, 360s near-zero-pool window) -- an ~8.5x real improvement, consistent with the 10x prediction. Residual gap to ~46/s target: ~7.6x, left open by design."
    expected: "n/a -- measured calibration gap and a scoped, budget-constrained partial fix, not a claim the gap is fully closed"
- id: flagella-02-filament-completion-needs-133min-minimum
  kind: computational
  status: supports
  statement: >-
    (2026-08-07) Directly answers "is FliC's ~20,000-subunit-per-filament
    requirement feasible" -- solved Renault et al.'s own rate law for the
    MINIMUM time to grow one filament to 20,000 subunits assuming UNLIMITED
    FliC (no synthesis bottleneck at all): 7996s / 133.3 min (~2.22 hr).
    A single ~42 min generation (the model's own D-period division timer)
    is far shorter than this floor, so zero completions in any
    single-generation test is expected, not evidence the stoichiometry
    itself is unrealistic. Recommendation: do not reduce the 20,000
    coefficient (it is real, cited structural biology, PMC7696725, not a
    parameter choice) -- either extend test windows or continue closing the
    synthesis gap instead.
  evidence:
    observed: "Renault growth law: L(t)=sqrt(b^2+2at)-b, a=26450, b=575; solved for t at L=20000 -> 7996.2s"
    expected: "n/a -- analytical result derived directly from the model's own already-validated rate law"
- id: flagella-02-division-disabled-diagnostic-completion-achievable
  kind: computational
  status: confirms
  statement: >-
    (2026-08-07) Isolates whether the fliC synthesis gap is an asymptotic
    stall (growth can never catch up) or just a timing problem, by
    monkeypatching Division.next_update to a no-op for one single-cell run
    only (fully reverted after -- run_diagnostic_no_division.py). Result:
    completion IS achievable given unconstrained time -- 9 flagella
    completed over 5hr (18000s), first ones between the 180 and 210-minute
    checkpoints, consistent with the 133-min analytical floor above. Once
    completions start, free FliC rebounds sharply (11 -> 120,325) as
    elongation demand drops. CAVEAT: dry_mass grew unbounded in this
    diagnostic (ending ~18,131 fg, ~26x normal ~700 fg division mass) since
    ribosome/RNAP counts scale with cell size in this model -- later
    completions (5-9, from ~240 min on) are likely inflated by this
    artificially oversized cell having far more synthesis capacity than any
    real dividing lineage would ever have at once; the FIRST completions
    (~180-210 min, cell only ~8x oversized) are the cleaner signal.
    IMPLICATION: under current calibration, no single real (dividing) cell
    can complete a flagellum within its own ~42 min lifetime -- completion,
    if it happens in the real model, can only come from inherited,
    in-progress construction accumulating across MULTIPLE generations (see
    the next finding for why that could not yet be tested cleanly).
  evidence:
    observed: "t=12600s (210min): completed_ever=3; t=18000s (300min): completed_ever=9, max_len=19883/20000"
    expected: "n/a -- direct diagnostic measurement, not a literature comparison"
- id: flagella-02-multigen-blocked-by-division-mass-homeostasis-gap
  kind: computational
  status: contradicts
  statement: >-
    (2026-08-07) Attempted to test whether inherited, in-progress
    construction (surviving real division via divide_nascent_flagellum's
    whole-unit binomial inheritance) actually completes and converges
    toward a realistic flagella count over SEVERAL real generations --
    both as a single followed lineage (linear compute cost, pruning to one
    daughter per division via comp.apply({"agents": {"_remove": [...]}}),
    NOT raw dict deletion which corrupts process_bigraph's internal
    step/process registry) and as an extended expanding population (all
    daughters kept, doubling each generation). BOTH independently hit the
    same wall past ~3-4 real generations (~150-180 min): dry_mass at
    division declines monotonically (e.g. one lineage: 706.7 -> 598.9 ->
    531.0 -> 476.7 -> 472.6 fg) alongside floods of GLP_NOFEAS/numerical-
    instability warnings from the metabolism FBA solver. Ruled out as
    causes: (a) manual state-splicing bugs (persisted after switching to
    the real Division step's own daughter-construction machinery), (b) a
    biased daughter-selection rule (persisted after switching from a fixed
    ID-ordering rule to a genuine random coin-flip per division), (c)
    environment/nutrient depletion or population-size-dependent resource
    sharing (ruled out via code inspection -- ecoli_baseline wires no
    shared/pooled environment store; each agent's environment/boundary is
    a private, non-depleting copy). MOST LIKELY explanation (not yet
    fixed, logged as a known limitation -- see investigation.yaml
    open_decisions): division fires on a FIXED D-period timer after
    replication completes (division.py, self.d_period=True path) with NO
    mass-threshold check at the division step itself -- so an underweight
    cell simply divides smaller rather than waiting to catch up. An
    underweight daughter's FBA problem (calibrated around ~700fg) becomes
    more likely to go infeasible; infeasible ticks can push bulk pools
    negative, and allocator.py explicitly does NOT heal negative pools by
    design ("the negative pool is the upstream's to heal") -- so
    corruption persists and compounds each generation. This is a property
    of the core WCM, not flagella-specific and not introduced this
    session; every result generated WITHIN ~3 generations (~2hr) this
    session remains trustworthy, but multi-generation flagella-count
    convergence could not be cleanly tested past that window.
  evidence:
    observed: "lineage_multigen_5gen.npz (real Division machinery, randomized daughter selection): division dry_mass 706.7/598.9/531.0/476.7/472.6 fg across 5 generations, monotonic decline; population run (run_flit_checkpoint_multigen.py, 14400s target) showed the identical pattern (513.7-565.0 fg divisions + GLP_NOFEAS floods) once it reached ~6 agents / gen 4"
    expected: "division mass should fluctuate around a roughly constant steady-state value across generations (ordinary binomial variance), not decline monotonically"
- id: flagella-02-reduced-target-confirms-completion-then-freeze
  kind: computational
  status: supports
  statement: >-
    (2026-08-08) Maya's proposal: since real completions need >=133min
    (finding flagella-02-filament-completion-needs-133min-minimum) and the
    trustworthy multi-gen window is only ~3 generations (~2hr), temporarily
    lower the completion TARGET (not the real cited stoichiometry -- one
    diagnostic run only, config_overrides, complexation_reactions_
    modified.tsv untouched) so real completions happen fast enough to
    observe within that window. Result, in two parts. PART 1 (positive,
    new): within the clean window (generations 1-2, first ~46min), the
    mechanism genuinely works -- 5 real completions, total flagella count
    climbing 4->9 (completed_ever 0->5). This is the first direct evidence
    the FliT checkpoint + assembly pipeline produce actual completions, not
    an asymptotic stall, once completion speed itself isn't the limiting
    factor. PART 2 (new symptom of the known division-mass-homeostasis
    limitation, investigation.yaml open_decisions): right as that
    limitation's corruption set in (~generation 3, divisions at 582/593fg,
    below the normal ~700fg), completions STOPPED ENTIRELY -- total_flag
    frozen at exactly 9 for the remaining ~70min of the run, even as
    filament_length kept growing well PAST its own 2,000-subunit
    completion target (up to 8,387, >4x over) without ever being marked
    complete. So the original question (does flagella count self-limit
    over generations) is still not answered -- the run ran out of clean
    window before that could be observed either way -- but this adds a
    second, more specific piece of evidence about the underlying
    corruption: it doesn't just depress division mass, it appears to
    silently break completion-triggering logic too, once it sets in. Not
    flagella-specific -- read as evidence the corruption is a general
    per-cell state problem, not narrowly about mass.
  evidence:
    observed: "diagnostic_reduced_target_2000_7200s.npz: t=600-2400s (gen 1) completed_ever 1->4; t=3000s (gen 2) completed_ever=5, total_flag=9; t=3000s-7200s (gen 3+, post-corruption) completed_ever frozen at 5, total_flag frozen at 9, while max_len climbed 4156->8387 (target=2000)"
    expected: "if the mechanism works and isn't time-limited, completions should continue at a similar rate throughout a clean run; a frozen completion count while filament_length keeps climbing past target is not expected under any model of the flagella mechanism alone"

