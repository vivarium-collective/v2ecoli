schema_version: 3
name: flagella-03-flgm-flia-feedback
title: "Aim 2A — FlgM secretion gate & FliA negative feedback (bounded sigma-28)"
description: |
  The timing/feedback half of Maya's Aim 2A. FliA (sigma-28) activity is held below
  threshold by the anti-sigma factor FlgM until a hook-basal body completes; the
  type-III secretion system then exports FlgM, releasing FliA to fire Class III.
  This study verifies the FlgM secretion gate and the flgM negative-feedback loop
  keep free FliA within a plausible band rather than running away.
topic: regulation
tags: [flagella, flgM, fliA, sigma28, secretion, negative-feedback, anti-sigma, aim2a, ported-from-vecoli-biofilm]
created: '2026-06-20'

status: in_progress
phase: Evaluate

design_status: complete
implementation_status: complete    # FlgMSecretion Step + FLGM-FLIA-CPLX equilibrium in cache
simulation_status: ran             # completed 600 s run persisted to the Simulations DB
                                   # (run flagella-03-flgm-flia-feedback__regON__seed0__600s,
                                   # feature ON, out/cache_full) plus the low-IC gated-cascade run.
evaluation_status: partial
gate_status: pending
expert_review_status: requested    # Maya Abdalla reviewed 2026-07-24 (feedback imported)

# On "no variants have been run" (Maya): correct and not a contradiction — the
# flagella_regulation feature here is part of the study's BASELINE config
# (baseline: wcm-flagella-regulation below), not a variant sweep. A "variant" in
# this framework is a perturbation OFF the baseline; this study has run its
# baseline but defines no variants yet. Candidate variants (FlgM export rate,
# initial FliA/FlgM pools) are listed under success_criteria.biology as follow-ups.

visualizations:
- address: image:charts/01_flgm_secretion_flia_release.svg
  chart: charts/01_flgm_secretion_flia_release.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies.py
  description: |
    IMPORTANT — which initial condition this is (answers Maya's "am I running
    without my overrides?"): this figure uses the DEFAULT v2ecoli cache, which
    starts ALREADY FLAGELLATED (~30 complete flagella, high FlgM ~1481, high FliA).
    It does NOT use Maya's low-flagella overrides ({CPLX0-7452[j]:4,
    FLAGELLAR-MOTOR-COMPLEX[j]:0, EG11355-MONOMER[c]:500, G369-MONOMER[c]:800}) —
    those drive the SEPARATE low-IC figure below (02_lowIC_gated_cascade). That is
    why FlgM drops sharply here: ~30 flagella are already present at t=0, so type-III
    export runs at full rate immediately, depleting FlgM in the first ~100 s; after
    that FlgM is near-zero and the trace is flat (nothing left to secrete) — the
    "jump then flat" Maya saw is exactly this already-flagellated start, not a
    missing-override bug. Left — FlgM (G369-MONOMER, orange) depletes as flagella
    export it, and the FlgM-FliA equilibrium releases free FliA / sigma-28 (green);
    the right axis (complete flagella) now uses integer ticks (no more "31.25
    flagella" — that was a matplotlib autolocator artifact, flagella are whole
    molecules). Right subplot — free FliA relative to its initial pool: it rises but
    stays bounded (does not run away) thanks to the flgM Class III negative-feedback
    loop.
- address: image:charts/02_multigen_flgm_flia.svg
  chart: charts/02_multigen_flgm_flia.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_multigen.py --generations 2
  description: |
    FlgM (G369-MONOMER) and free FliA (EG11355-MONOMER) across TWO generations
    (generations shaded; division dashed). FlgM is held low by ongoing type-III
    secretion and free FliA stays bounded across the division boundary — the flgM
    negative-feedback loop carries through into the daughter cell.
    Technical context (what was run — Maya asked for this to be filled in):
    composite v2ecoli.composites.baseline.baseline with features=['flagella_regulation'],
    seed 0, cache out/cache_full (calibrated), 2 generations via run_studies_multigen.py
    --generations 2, single followed lineage (daughter-1 carried forward), division
    at the ~700 fg dry-mass threshold.
- address: image:charts/02_lowIC_gated_cascade.svg
  chart: charts/02_lowIC_gated_cascade.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/studies/flagella-03-flgm-flia-feedback/run_low_flagella_gate.py --seconds 900 --sample 30
  description: |
    "lowIC" = LOW Initial Condition. This IS the run with Maya's overrides
    (flagellum_initial_value.json: 4 complete flagella, 0 motor, 500 free FliA,
    800 FlgM) — the counterpart to the default-cache figure above. With only 4
    flagella, FlgM export is slow, FliA stays sequestered, and the Class III
    override rises only gradually as FlgM is secreted — exposing the assembly-gated
    Class II -> Class III TIMING (the onset delay) that the default already-
    flagellated cache hides by starting past it. So the two figures are
    complementary: default cache (above) = steady-state magnitudes with FlgM already
    being cleared; low-IC (here) = the transient onset from a pre-assembly state.

baseline:
- name: wcm-flagella-regulation
  composite: v2ecoli.composites.baseline.baseline
  params:
    seed: 0
    cache_dir: out/cache
    features: ['flagella_regulation']

purpose:
  question: |
    Does the FlgM secretion gate (exported ∝ complete flagella) deplete cytoplasmic
    FlgM (G369-MONOMER[c]), shift the FlgM-FliA equilibrium to release free FliA
    (EG11355-MONOMER[c]), and keep FliA bounded via the flgM negative-feedback loop?
  mechanism: |
    ecoli-flagella-flgm-secretion: exported = min(FlgM, round(n_flagella * 0.1 * dt)).
    FLGM-FLIA-CPLX equilibrium sequesters FliA; as FlgM falls, FliA is released.
    flgM is itself driven as a Class III gene (override = Y): as free FliA rises,
    flgM transcription rises, making more FlgM to re-sequester FliA — the cap that
    prevents the runaway FliA seen without this loop (Stefan et al. 2015,
    PLoS Comput Biol 11:e1004028).
  expected_outcome: |
    Cytoplasmic FlgM falls when flagella are present; free FliA rises then
    plateaus within a plausible band relative to its initial pool rather than
    growing without bound.

behavior_tests:
  - id: flgm-secreted-when-flagella-present
    statement: |
      With complete flagella (CPLX0-7452[j]) > 0, cytoplasmic FlgM (G369-MONOMER[c])
      decreases over the run.
    status: passing      # verified: FlgM 1481 -> 39 over 300 s
  - id: fliA-released-and-bounded
    statement: |
      Free FliA (EG11355-MONOMER[c]) rises as FlgM is secreted but stays within a
      plausible band (does not run away) thanks to the flgM negative-feedback loop.
    status: passing      # 600 s run: FlgM 1481->5, free FliA 3000->4039 (~1.35x, bounded)

success_criteria:
  model:
    - FlgM (G369-MONOMER[c]) is depleted by type-III secretion when complete
      flagella are present, and the FlgM-FliA equilibrium releases free FliA
      (verified — FlgM 1481 -> 5).
    - Free FliA rises but stays bounded (~1.35x initial) rather than running away —
      the flgM negative-feedback loop holds (verified).
  biology:
    - The secretion gate reproduces the anti-sigma-factor logic — FliA (sigma-28) is
      held sequestered until basal-body completion exports FlgM, then released — the
      molecular clock that orders Class III after Class II.
    - FUTURE (Maya's biological-success target) — the released free-FliA band matches a
      literature-calibrated level, and the gate responds correctly to perturbations
      of FlgM export rate / initial FliA:FlgM stoichiometry (candidate variants).

notes: |
  Ported from Maya Abdalla's vEcoli `biofilm` branch. Best demonstrated from a
  low-flagella initial condition (Maya's flagellum_initial_value.json analog: 4
  flagella, 500 FliA, 800 FlgM) so the assembly-gated release of FliA is visible;
  the default v2ecoli cache starts already flagellated (~30). Quantitative FliA
  band requires a --mode full ParCa calibration.
