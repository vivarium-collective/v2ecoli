        CLEAN once-per-generation (Rashmi's re-tune request): dwell 30 s + SeqA eclipse 40 min (on
        hydrolysis 0.025 + threshold 8 + async, n=4/K=30) gives oriC strictly 1<->2 — one initiation round
        per cycle — with the DnaA-ATP fraction and total DnaA in band, seed-robust (seeds 1/2 clean; seed 0
        keeps ~13% oriC=3, consistent with the expected overlapping round when tau < C+D).

report:
  title: "dnaa-9 — asynchronous initiation (DnaA-ATP band via hydrolysis; over-replication problem)"
  verdict: >-
    COMPLETE (2026-07-02): with the EXTRINSIC DnaA-ATP mechanisms (RIDA/DDAH/DARS) OFF, two of Rashmi's
    targets are met by simple knobs and the third (asynchrony) is implemented, revealing a clean problem.
    (1) DnaA-ATP FRACTION: the hydrolysis rate is the lever, as Rashmi found — DNAA_HYDROLYSIS_RATE_PER_MIN
    0.046->0.025 lifts the total DnaA-ATP fraction into [0.2,0.5] (0.23-0.26, seeds 0/1/2). This CORRECTS
    the earlier (RIDA-based) analysis: the fraction is tuned by hydrolysis, not by adding RIDA — my prior
    "hydrolysis isn't a lever" reading was an artifact of leaving RIDA on in the reference, which masked
    it. (2) FULL-OCCUPANCY TRIGGER: threshold 8 fires at peak oriC-low occupancy 1.00. (3) ASYNCHRONY:
    a new flag-gated per-origin initiation path makes each oriC bind DnaA and initiate independently
    (oriC shows 3+, not a synchronous 2->4 jump). BUT async ALONE OVER-REPLICATES: with no re-initiation
    control the origins re-fire continuously — oriC runs to 3/4/5 and total DnaA climbs above [300,800]
    on all seeds. This is the intended, informative negative result: it isolates the missing physics as a
    re-initiation FREQUENCY control (SeqA sequestration), delivered in dnaa-10. RIDA/DDAH/DARS remain off.

next_action: >-
  dnaa-10: add SeqA (the per-origin post-initiation eclipse) to throttle re-initiation and confirm it
  restores controlled asynchronous once-per-cycle with the DnaA-ATP fraction still in band via hydrolysis.

