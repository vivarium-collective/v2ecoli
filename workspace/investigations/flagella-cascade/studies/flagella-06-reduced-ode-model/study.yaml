schema_version: 4
name: flagella-06-reduced-ode-model
title: "Reduced ODE Model — Regulatory + Assembly Dynamics, Decoupled from the WCM"
question: >-
  Does the real FliT:FlhDC checkpoint (Utsey & Keener 2020) + Kalir & Alon
  SUM-gate + real assembly/elongation kinetics (Renault et al. 2017),
  modeled as a standalone system of ODEs with NO whole-cell-model division/
  metabolism/FBA machinery, produce realistic, self-limiting flagella-count
  dynamics over many generations -- directly testing the question three
  separate WCM-embedded diagnostics (study 02) could not answer, each
  blocked by a different infrastructure limitation unrelated to the
  regulatory mechanism itself (fliC supply, motor-complex supply, the
  general division/mass-homeostasis bug logged in investigation.yaml).
description: |
  Added 2026-08-10, after study 02's multi-generation diagnostics
  repeatedly hit WCM-level infrastructure limits before the actual
  regulatory question (does the FliT checkpoint produce self-limiting
  flagella count?) could be answered. Rather than continuing to fight
  those limits inside the full whole-cell model, this study builds a
  standalone, decoupled model of just the regulatory + assembly system --
  the same modeling choice Kalir & Alon (2004) and Utsey & Keener (2020)
  themselves made in their own papers (neither embedded their models in a
  whole-cell simulation). No process-bigraph composite, no ParCa cache, no
  cell division/metabolism/FBA -- plain Python + scipy.integrate, reusing
  the REAL parameter values imported directly from the actual WCM source
  files (v2ecoli/processes/flagella_*.py) rather than re-derived
  approximations, so the two models can't silently drift out of sync.

  This is a genuinely different tool for a genuinely different question:
  study 02 established that the MECHANISM is grounded in real, cited
  stoichiometry and kinetics, and that the WCM's own infrastructure (not
  the flagella mechanism) is what's currently blocking the multi-
  generation question. This study uses that same validated mechanism to
  actually ANSWER the multi-generation question cheaply (seconds instead
  of hours), at the cost of losing whole-cell context (real resource
  competition with the rest of the cell's physiology).
topic: regulation
tags: [flagella, ode, reduced-model, kalir-alon, sum-gate, flit-checkpoint,
       utsey-keener, self-limiting-dynamics, decoupled-from-wcm, aim2a]
created: '2026-08-10'

