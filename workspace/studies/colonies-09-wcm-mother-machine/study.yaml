schema_version: 4
name: colonies-09-wcm-mother-machine
investigation: colonies
title: "Whole-cell baseline (v2ecoli) in a mother machine \u2014 device run"
description: "Run the REAL v2ecoli whole-cell BASELINE \u2014 the full 55-process\
  \ EcoliWCM \u2014 as\none whole cell per channel inside the mother-machine device\
  \ geometry (narrow\ndead-end channels + a flow channel that washes out cells crossing\
  \ the top),\nletting them grow and divide naturally. Renders the running animation\
  \ and the\nsame phenotype figures as the cheap-agent device studies, so the whole-cell\n\
  tier can be compared, in the same confined-channel device, against the simple\n\
  viva-munk agents (colonies-05) on the identical measurement pipeline.\n\nHeavier\
  \ than the daughter-machine whole-cell run (colonies-08): N whole cells\nrun simultaneously\
  \ (one per channel). Kept small (2 channels) and bounded\n(whole-cell colonies leak\
  \ per-cell RAM, OOM ~gen 3). Phenotype distributions\nare PRELIMINARY (small n);\
  \ conclusions held for experimental data (colonies-10)\nand full distributions need\
  \ HPC. The value is the whole-cell baseline running\ninside the confined-channel\
  \ device.\n"
