schema_version: 4
name: metabolism_redux_acetate
investigation: whole-cell-model-comparison
title: v2ecoli reproduces vEcoli with MetabolismRedux (acetate)
condition: acetate
question: Does v2ecoli reproduce vEcoli on acetate when both engines swap FBA Metabolism for MetabolismRedux?
comparison:
  seeds: 6
  generations: 1
  max_steps_per_gen: 15000
  cards:
  - config
  - parca
  - standard
  - statistical
  - trajectory
  - distribution
  - metabolism
  - composition
from_vecoli_config: configs/metabolism_redux_acetate.json
report_cards:
- viz/report_card/config.html
- viz/report_card/parca.html
- viz/report_card/standard.html
- viz/report_card/statistical.html
- viz/report_card/trajectory.html
- viz/report_card/distribution.html
- viz/report_card/metabolism.html
- viz/report_card/composition.html
pipeline_gate:
  enables: []
runs:
- composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  name: metabolism_redux_acetate-comparison
  kind: analysis
  canonical: true
  description: v2e-compare study metabolism_redux_acetate
status: evaluated
tests:
- name: config-vs-vecoli
  kind: report_card
  card: config
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (config card)?
- name: parca-vs-vecoli
  kind: report_card
  card: parca
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (parca card)?
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (standard card)?
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/whole-cell-model-comparison/metabolism_redux_acetate
    group: statistical
- name: trajectory-vs-vecoli
  kind: report_card
  card: trajectory
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (trajectory card)?
- name: distribution-vs-vecoli
  kind: report_card
  card: distribution
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (distribution card)?
- name: metabolism-vs-vecoli
  kind: report_card
  card: metabolism
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (metabolism card)?
- name: composition-vs-vecoli
  kind: report_card
  card: composition
  classification: primary
  question: Does v2ecoli reproduce vEcoli on metabolism_redux_acetate (composition card)?
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      condition: acetate
      swap: ecoli-metabolism-redux
confidence: Accepted
findings:
- id: metabolism_redux_acetate-vs-vecoli-result
  kind: computational
  status: confirms
  statement: "Measured (6 seeds requested, 4 effective vEcoli, gen-1, matched timepoints): parca (t=0 initial-state match) within_tol. Statistical card (Welch t-test) overall verdict drift -- driven solely by growth-rate -- all four masses within_tol. Matched gen-1 median |delta|: cell 0.53%, dry 0.53%, protein 1.09%, rna 2.19%, growth 12.1%. No mismatch on any axis; active_RNAP/active_ribosome are ungraded (not in the local reader's observable set)."
  evidence:
    from_card: statistical
    observed: parca within_tol; cell/dry/protein/rna mass all within_tol (median |delta| 0.53%/0.53%/1.09%/2.19%); growth-rate median |delta| 12.1% (sole driver of the drift verdict).
inputs:
- artifact: sim_data
  from: parca
  into: cache_dir

