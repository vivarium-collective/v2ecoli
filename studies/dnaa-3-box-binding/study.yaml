schema_version: 4
name: dnaa-3-box-binding
investigation: dnaa-replication   # owning investigation (back-reference)
title: DnaA binding to DnaA boxes (chromosomal + oriC + dnaA-promoter)
created: '2026-06-03'
status: planned   # prepared from dnaa-3-spec (Haochen); design complete, not yet implemented/run
# Build a dynamic DnaA-box occupancy mechanism on top of the dnaa-2 V=1e-3
# succinate baseline. We are NOT replacing the initiation mechanism yet — this
# study adds the binding substrate (boxes + occupancy) that later studies
# (later regulatory + mechanistic-initiation studies) build on.
# Spec: studies/dnaa-3-box-binding/spec.md (Haochen, supplied 2026-06-03).
design_status: complete            # mechanism + pools + validation fully specified in spec.md
implementation_status: in_progress # 2026-06-03: Build started — infra mapped, build_plan below; reactions/pools not yet wired
simulation_status: not_run
evaluation_status: not_run
gate_status: pending
expert_review_status: pending      # Haochen authored the spec/first-step assumptions (design INPUT), but the implementation + results are not yet expert-reviewed — nothing to approve until it's built and run

seeded_from:
  study: dnaa-2-nucleotide-balance
  reason: |
    Builds directly on the dnaa-2 V=1e-3 succinate baseline (bf8b82e integrate_dt
    mechanism + DnaA-ATP intrinsic hydrolysis). dnaa-3 adds DnaA-box occupancy on
    top of that DnaA-ATP/ADP/apo pool without changing initiation.

question: |
  With DnaA binding to its 315 boxes (4 affinity pools: 302 chromosomal-high,
  3 oriC-high, 8 oriC-low, 2 promoter-high) in fast equilibrium on top of the
  dnaa-2 V=1e-3 succinate baseline, does the cell cycle stay unchanged (8/8
  divisions, oriC 1↔2, 0 re-init) and the DnaA-ATP fraction stay in the Boesen
  [0.2,0.5] band — i.e. does adding the binding sink leave the validated dnaa-2
  behaviour intact while exposing the bound/free + per-nucleotide partitioning
  that later regulatory studies need?

objective: |
  Add a dynamic DnaA-box occupancy mechanism: distribute the DnaA-ATP / DnaA-ADP
  pool (from dnaa-2) across the 315 chromosomal + oriC + dnaA-promoter DnaA boxes
  according to affinity, in fast equilibrium, while preserving the dnaa-2 cell
  cycle (8/8 divisions, oriC 1↔2, no re-init, DnaA-ATP fraction in band).

purpose:
  question: |
    With DnaA binding to its 315 boxes (4 affinity pools) in fast equilibrium on
    top of the dnaa-2 baseline, does the cell cycle stay unchanged (8/8 divisions,
    oriC 1↔2, 0 re-init) and the DnaA-ATP fraction stay in the Boesen [0.2,0.5]
    band — i.e. does adding the binding sink leave the validated dnaa-2 behaviour
    intact while providing the bound/free partitioning later studies need?
  mechanism: |
    DnaA binds 315 boxes in four pools, each a fast equilibrium governed only by
    K_d (absolute k_fwd/k_rev are degenerate after the steady-state solve):
      - chromosomal high-affinity (302 sites): K_d ≈ 1 nM, binds DnaA-ATP OR DnaA-ADP
      - oriC high-affinity (3 sites: R1, R2, R4): K_d ≈ 1 nM, binds DnaA-ATP OR DnaA-ADP
      - oriC low-affinity (8 sites): K_d ≈ 100 nM, DnaA-ATP ONLY
      - dnaA-promoter high-affinity (2 sites: box 1, box 2): K_d ≈ 1 nM, ATP OR ADP
    High-affinity pools track bound-ATP and bound-ADP SEPARATELY (3 counts: free /
    bound-ATP / bound-ADP) so the correct nucleotide form can be released in later
    studies. The low-affinity pool tracks 2 counts (free / bound-ATP). DNA binding
    does NOT alter the DnaA-ATP intrinsic hydrolysis rate (bf8b82e k≈0.046/min
    applies uniformly to bound and free DnaA-ATP).
  expected_outcome: |
    The dnaa-2 cell cycle is preserved (8/8 divisions, oriC 1↔2, 0 re-init) and the
    DnaA-ATP fraction stays in [0.2,0.5]. The chromosomal high-affinity pool (302
    sites) is the dominant sink. Box count doubles across replication (315 at birth
    → 630 at termination → 315 per daughter).

# ── Reference documents (staged under workspace/references/dnaa/) ──────────────
references:
  - name: molecular-information-replication-initiation
    path: ../../workspace/references/dnaa/molecular_information_replication_initiation.pdf
    role: |
      Biology source. 11 oriC boxes (3 high-aff R1/R2/R4; 8 low-aff R5M, τ2, I1,
      I2, C3, C2, I3, C1), affinity ranges (high ≈1 nM; low >100 nM), nucleotide
      specificity (high bind ATP+ADP; low prefer ATP), dnaA-promoter box layout.
  - name: oric-sequence
    path: ../../workspace/references/dnaa/oric_sequence.pdf
    role: |
      462-bp oriC sequence with all 11 boxes annotated. Source for the 8
      low-affinity box coordinates (see inputs_to_supply).
  - name: parameters-wcm-stage1-heuristics
    path: ../../workspace/references/dnaa/parameters_wcm_stage1_heuristics.pdf
    role: |
      Stage-1 heuristic parameters (rows 13-17 cover DnaA-box params).

# ── Box catalog: the four pools (315 sites total) ─────────────────────────────
box_catalog:
  total_sites: 315
  pools:
    - name: chromosomal_high
      n_sites: 302
      kd_nM: 1
      binds: [DnaA-ATP, DnaA-ADP]
      state_counts: [free, bound_ATP, bound_ADP]
      source: |
        307 consensus DnaA boxes (TTWTNCACA, Schaper-Messer) computed at
        ParCa-build time on the K-12 genome, MINUS the 3 oriC high-aff + 2
        dnaA-promoter high-aff sites broken out into their own pools = 302.
    - name: oric_high
      n_sites: 3
      sites: [R1, R2, R4]
      kd_nM: 1
      binds: [DnaA-ATP, DnaA-ADP]
      state_counts: [free, bound_ATP, bound_ADP]
      coords_signed: {R1: -55, R2: 50, R4: 124}   # known anchors (spec)
    - name: oric_low
      n_sites: 8
      sites: [R5M, "τ2", I1, I2, C3, C2, I3, C1]
      kd_nM: 100   # Haochen first-step; cooperativity (and the 50→1 nM range) deferred
      binds: [DnaA-ATP]
      state_counts: [free, bound_ATP]
    - name: promoter_high
      n_sites: 2
      sites: [box1, box2]
      kd_nM: 1
      binds: [DnaA-ATP, DnaA-ADP]
      state_counts: [free, bound_ATP, bound_ADP]
      coords_signed: {box1: -41917, box2: -42883}   # relative to oriC (spec)

# ── Haochen's first-step assumptions (from spec.md) ───────────────────────────
key_assumptions:
  - All 307 consensus DnaA boxes (TTWTNCACA) are high-affinity (K_d ≈ 1 nM).
  - oriC has 3 high-affinity + 8 low-affinity boxes; low-affinity K_d ≈ 100 nM.
  - DnaA-ATP and DnaA-ADP binding to boxes is FAST EQUILIBRIUM (only K_d matters;
    absolute k_fwd/k_rev magnitudes degenerate after the steady-state solve).
  - DNA binding does NOT alter the DnaA-ATP intrinsic hydrolysis rate (bf8b82e
    k ≈ 0.046/min applies uniformly to bound and free DnaA-ATP).
  - Cooperativity between low-affinity sites is DEFERRED to a later study.
  - High-affinity pools track bound-ATP and bound-ADP separately so the correct
    nucleotide form can be released later by downstream regulatory studies
      (extrinsic DnaA-ATP/ADP conversion + sequestration; per Haochen's spec).
  - 'DISCREPANCY (recorded): the Stage-1 parameter brief lists oriC low-affinity
    K_d as a cooperative 50→1 nM range; dnaa-3 uses Haochen''s first-step
    K_d ≈ 100 nM with cooperativity deferred. The spec assumption governs.'

