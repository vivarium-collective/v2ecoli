<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colony &amp; Microfluidic Phenotype Quantification — report</title>
<style>
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --sunken:#F4F2ED;
  --ink:#1F1D1B; --ink-2:#57534E; --ink-3:#8A857D;
  --line:#E7E4DE; --line-2:#D8D4CC;
  --accent:#0F766B; --accent-soft:#0F766B22;
  --pass:#1A7F5A; --fail:#B42318; --warn:#A16207; --cal:#0E7490;
  --pass-soft:#1A7F5A18; --fail-soft:#B4231814; --warn-soft:#A1620714;
  --chip:#F1EFEA;
  --shadow:0 1px 2px rgba(30,25,20,.04),0 1px 0 var(--line);
  --serif:"Iowan Old Style","Palatino Nova",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}}
:root[data-theme="dark"]{
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-padding-top:64px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.9em}
.serif{font-family:var(--serif)}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.switch{display:flex;gap:4px;margin-left:auto;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.switch button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:none;border:none;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch-label{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.switch-label+.switch{margin-left:10px}
.themebtn{background:none;border:1px solid var(--line);color:var(--ink-2);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}

/* ---- masthead ---- */
.masthead{padding:44px 0 8px}
.masthead .eyebrow{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0;
  letter-spacing:-.01em;text-wrap:balance;max-width:20ch}
.provline{color:var(--ink-3);font-size:13px;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.provline .sep{opacity:.5}

/* ---- verdict banner ---- */
.verdict{margin:28px 0 8px;padding:24px 26px 24px 30px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--pass);border-radius:12px;box-shadow:var(--shadow)}
.verdict.is-fail{border-left-color:var(--fail)}
.verdict .vhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.verdict .vtext{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink);margin:0;max-width:none}
.verdict .what{color:var(--ink-2);font-size:14.5px;margin-top:14px;max-width:none}

/* status chip */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:4px 11px;border-radius:999px;text-transform:uppercase}
.status.pass{color:var(--pass);background:var(--pass-soft)}
.status.fail{color:var(--fail);background:var(--fail-soft)}
.status.warn{color:var(--warn);background:var(--warn-soft)}
.status .g{width:7px;height:7px;border-radius:999px;background:currentColor}

/* ---- stat strip ---- */
.stats{display:flex;flex-wrap:wrap;gap:0;margin:22px 0;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden}
.stats .stat{flex:1;min-width:120px;padding:16px 18px;border-right:1px solid var(--line)}
.stats .stat:last-child{border-right:none}
.stats .num{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stats .lbl{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.stats .num.pass{color:var(--pass)}.stats .num.fail{color:var(--fail)}

/* ---- section headers ---- */
.sec-h{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px}
.sec-h h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line)}

/* ---- glance table ---- */
.glance{width:100%;border-collapse:collapse;font-size:14px}
.glance th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line-2)}
.glance td{padding:11px 12px;border-bottom:1px solid var(--line)}
.glance tr:hover td{background:var(--sunken)}
.glance .idx{color:var(--ink-3);font-family:var(--mono);width:26px}
.glance a.st{font-weight:600;color:var(--ink)}
.glance a.st:hover{color:var(--accent);text-decoration:none}
.glance .flag{color:var(--warn);font-size:11.5px;font-weight:700;margin-left:8px}

/* ---- sticky nav ---- */
.subnav{position:sticky;top:56px;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:36px}
.subnav .wrap{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{font-size:12.5px;color:var(--ink-2);padding:5px 10px;border-radius:7px;white-space:nowrap;font-weight:500}
.subnav a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.subnav a.exec{font-weight:600}

/* ---- study card ---- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px;margin:24px 0;box-shadow:var(--shadow);scroll-margin-top:112px}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--pass)}
.card.is-fail::before{background:var(--fail)}
.card.is-control{border-style:dashed;border-color:var(--line-2)}
/* collapsed cards are wholly clickable — signal it clearly */
.card.collapsed{cursor:pointer;padding-bottom:44px;transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease}
.card.collapsed:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(30,25,20,.10),0 1px 0 var(--line);transform:translateY(-1px)}
.card.collapsed::after{content:"Click to expand ▾";position:absolute;right:24px;bottom:16px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);pointer-events:none}
.card.collapsed:hover::after{color:var(--accent)}
.card.collapsed:hover .ctoggle{color:var(--accent)}
.card-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px;cursor:pointer;user-select:none}
.card-h .ctoggle{color:var(--ink-3);font-size:15px;padding-top:5px;transition:transform .15s,color .15s;line-height:1}
.card.collapsed .card-h .ctoggle{transform:rotate(-90deg)}
.card-h .cnum{font-family:var(--mono);color:var(--ink-3);font-size:14px;padding-top:5px}
/* collapse behaviour */
.card.collapsed .study-detail{display:none}
.card:not(.collapsed) .study-summary{display:none}
.study-summary{margin-top:10px}
.summary-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.summary-snip{color:var(--ink-2);font-size:13.5px;max-width:none;margin-top:6px}
.studies-toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
.studies-toolbar button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.studies-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.card-h .ctitle{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;flex:1;line-height:1.2}
.card-h .cright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control-kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}
.claim{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin:8px 0 2px;max-width:none;font-style:italic}
.biology{color:var(--ink-2);font-size:14px;margin:8px 0 4px;max-width:none}

/* spine stage */
.stage{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:none}
.stage>.kicker{display:block;margin-bottom:12px}
.substage{margin:14px 0}
.substage .slabel{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.kv{color:var(--ink);font-size:14.5px}
.kv .rationale{color:var(--ink-2);font-size:13.5px;margin-top:4px;max-width:none}
.decision-line{font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;
  border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.pass{color:var(--pass);background:var(--pass-soft)}
.chip.fail{color:var(--fail);background:var(--fail-soft)}
.chip.decision{background:none;border:1px solid var(--accent);color:var(--accent)}
.chip.mod{background:none;border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:11.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* mini table for tests */
.ttable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.ttable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable tr:last-child td{border-bottom:none}
.ttable .tname{font-weight:600}
.ttable .texp{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.ttable .tv{text-align:right;white-space:nowrap}

/* decision box */
.decbox{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--sunken);
  border-radius:10px;margin-top:6px}
.decbox>div:last-child{flex:1 1 auto;min-width:0}
.decbox .dverdict{font-size:14px}
.decbox .dnarr{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:none}

/* figures */
figure{margin:12px 0 4px}
figure svg{max-width:100%;height:auto;display:block}
figure img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.spine-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.spine-badge.v-passed{color:var(--pass);background:var(--pass-soft)}
.spine-badge.v-failing{color:var(--fail);background:var(--fail-soft)}
.spine-badge.v-blocked,.spine-badge.v-needs_calibration{color:var(--warn);background:var(--warn-soft)}
.spine-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.spine-legend-item{font-size:11.5px;color:var(--ink-2)}
.study-verdict-dag,.acceptance-rollup,.ac-gating-matrix{margin-top:4px}
.ac-gating-matrix .gap,.acceptance-rollup td{font-size:13.5px}
figcaption{color:var(--ink-2);font-size:12.5px;margin-top:8px;max-width:none}
.fig-scroll{overflow-x:auto}
.loom-embed{margin:12px 0 4px}
.loom-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);height:440px;resize:vertical;min-height:240px}
/* An inlined local: visualization runs in its own iframe so its scripts execute
   and its (often full-document) CSS can't leak into the report. onload sizes it
   to content; this is the pre-resize default. */
.viz-frame{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:460px;display:block}
/* An interactive (Plotly) figure rendered inline in the main document, sharing
   the report's one Plotly.js. Bordered like the iframe path it replaces. */
.embedded-plotly .plotly-holder{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;overflow:hidden}
.embedded-plotly .plotly-holder>div{max-width:100%}
.loom-iframe{width:100%;height:100%;border:0;display:block}
.loom-fallback{margin-top:6px}
.loom-fallback>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
.loom-fallback[open]>summary{margin-bottom:6px}

/* expander */
details.exp{margin-top:10px;border-top:1px dotted var(--line-2);padding-top:8px}
details.exp>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::before{content:"▸ ";color:var(--ink-3)}
details.exp[open]>summary::before{content:"▾ "}
details.exp .body{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:none}

/* appendix */
.appendix{margin:52px 0 24px}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cat-table td,.cat-table th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cat-table th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.cat-table .m{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}

/* breadcrumb + prev/next + study grid */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);padding:26px 0 2px}
.crumb a{color:var(--ink-2);font-weight:600}
.crumb .cur{color:var(--ink)}
.crumb .chev{opacity:.5}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin:28px 0 8px}
.prevnext a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.prevnext a:hover{border-color:var(--accent);text-decoration:none}
.prevnext a.next{text-align:right;align-items:flex-end}
.prevnext .dir{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.prevnext .nm{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.gcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--accent);text-decoration:none}
.gcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pass)}
.gcard.is-fail::before{background:var(--fail)}
.gcard .gh{display:flex;align-items:baseline;gap:8px}
.gcard .gn{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.gcard .gt{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.2}
.gcard .grole{color:var(--ink-2);font-size:12.5px}
.gcard .gclaim{color:var(--ink-2);font-size:13px;line-height:1.5;font-style:italic}
.gcard .gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.gcard .garrow{color:var(--accent);font-size:13px;font-weight:600}
/* per-section feedback bubble */
.fbsection{position:relative}
.fbbubble{position:absolute;right:-6px;top:-4px;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .12s,transform .12s,color .12s,border-color .12s;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.fbsection:hover>.fbbubble{opacity:.85}
.fbbubble:hover{opacity:1 !important;transform:scale(1.08);color:var(--accent);border-color:var(--accent)}
.fbbubble.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fbbubble.has::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:1.5px solid var(--surface)}
.fbeditor-wrap{margin-top:12px;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px}
.fbeditor-wrap .fbrow{margin-top:0;padding-top:0;border-top:none}
@media(max-width:640px){.fbbubble{opacity:.6}}
/* feedback */
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-2)}
.fbrow .fblabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fbdisp{display:flex;gap:4px}
.fbdisp button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.fbdisp button.on-ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.fbdisp button.on-rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.fbrow input.fbnote{flex:1;min-width:180px;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fbrow input.fbnote:focus{outline:none;border-color:var(--accent)}
.fbfloat{position:fixed;right:22px;bottom:22px;z-index:60;background:var(--accent);color:#fff;border:none;
  border-radius:999px;padding:12px 18px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,118,107,.4);display:flex;align-items:center;gap:8px}
.fbfloat .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;font-size:12px}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(20,18,15,.5);display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--serif);font-size:20px;margin:0;padding:20px 22px 6px}
.modal .sub{color:var(--ink-2);font-size:13px;padding:0 22px 12px}
.modal textarea{flex:1;margin:0 22px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:280px;resize:vertical}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px}
.modal .mfoot button{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .mfoot button.primary{background:var(--accent);color:#fff;border-color:transparent}
footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0 60px;color:var(--ink-3);font-size:12.5px}

"per-cell 73.2 ms vs reference 73.6 ms"}}}, {"simulation": "nsweep-n4", "seed": 0, "duration_s": 60, "started_at": "2026-05-16T22:28Z", "wall_seconds": 18.5, "peak_rss_mb": 2946, "n_cells_initial": 4, "n_cells_final": 4, "steady_state": {"avg_tick_ms": 290.9, "per_cell_ms": 72.7, "avg_pymunk_ms": 0.14, "max_tick_ms": 310.8}, "outcomes": {"per-cell-cost-within-2x-reference": {"result": "PASS", "ratio": 0.99, "note": "per-cell 72.7 ms vs reference 73.6 ms"}}}, {"simulation": "nsweep-n8", "seed": 0, "duration_s": 60, "started_at": "2026-05-16T22:29Z", "wall_seconds": 36.0, "peak_rss_mb": 4712, "n_cells_initial": 8, "n_cells_final": 8, "steady_state": {"avg_tick_ms": 562.9, "per_cell_ms": 70.4, "avg_pymunk_ms": 0.2, "max_tick_ms": 603.2}, "outcomes": {"per-cell-cost-within-2x-reference": {"result": "PASS", "ratio": 0.96, "note": "per-cell 70.4 ms vs reference 73.6 ms (slight decrease, Python startup amortization)"}}}], "conclusion": "Phase = Decide. Pipeline-open to colonies-02-hpc-deployment with the caveats\nbelow.\n\nBuild-phase fixes required to get here:\n\n1. viva-munk apply_updates_with_realize unpacked 2 values from\n   bigraph_schema.core.realize, which now returns 3 (escape_merges), so every\n   structural `_add` crashed. Patched (viva-munk branch\n   rename-multi-cell-to-viva-munk, commit \"fix: handle 3-tuple return from\n   bigraph_schema core.realize\").\n2. v2ecoli/colony.py wired only `mass`/`volume`/`exchange` outputs on initial\n   cells. `_handle_division` writes to `agents`, but with no `agents` wire the\n   update had nowhere to land, so mothers stayed put. Fixed by mirroring the\n   full daughter wiring (`agent_id`/`location`/`angle` inputs, `length`/`agents`\n   outputs).\n3. v2ecoli/bridge.py `_handle_division` hard-coded\n   `interval=self.config.get('interval', 60.0)` for daughters; `interval` is\n   not in `config_schema`, so the fallback always won and daughters ticked once\n   per 60s instead of inheriting the mother's 1s cadence. Fixed by passing\n   `interval` through.\n\nAfter all three fixes, a pure-WC N=2 colony with both initial cells\nforce-divided produces 4 hydrated daughters that all advance.\n\nPerf findings (steady-state, N ∈ {1, 2, 4, 8}, 60-tick window):\n\n- Per-cell wall is flat at 70-74 ms across N=1..8 (slight decrease with N as\n  Python/import overhead amortizes); per-cell-cost-within-2x-reference passes\n  at all N.\n- pymunk is essentially free (\u003c0.2 ms/tick even at N=8). All cost is the inner\n  EcoliWCM composite (55 biological steps × N cells, walked sequentially in one\n  Python thread).\n- RSS grows ~450 MB per added cell, atop a ~1 GB Python baseline.\n\nBottleneck at scale is the GIL: process-bigraph composites are single-threaded,\nso one process uses ~1 CPU core regardless of cell count. Scaling to many cells\nmeans scaling processes, not cells-per-process.\n\nHPC node sizing (64-core / 256 GB target):\n\n- RAM-limited ceiling per node: 256 GB / 0.45 GB ≈ 570 cells (RAM-bound, single\n  process — not practical at speed).\n- CPU-limited realtime ceiling per process: ~13 cells (13 × 73 ms ≈ 950 ms,\n  ~realtime).\n- Recommendation: 8 cells/process × 64 processes = 512 cells/node uses\n  64 × (1 GB + 8 × 0.45 GB) = ~290 GB, just over budget. Drop to\n  6 cells/process × 64 = 384 cells/node, fits 256 GB with ~10% headroom;\n  per-process tick wall ~440 ms (~2× realtime).\n\nNot validated here (handed to colonies-02):\n\n- Cross-node scaling, distributed environment field.\n- Process-bigraph composite parallelism within a single process (unsupported;\n  needs engine work).\n- Multi-generation drift in per-tick cost (daughters' internal composites may\n  bloat over many divisions).\n- Per-cell ParCa cache contention if processes share cache_dir.\n\nMemory (2026-07-26 leak hunt): the per-tick RSS growth in the long N=1 run\n(finding F-06) is now characterised, not an unbounded native leak. It is\nlocalized to the inner WCM's elongation step (~82%) + mass-listener (~17%),\nwith only ~0.2 MB/tick truly retained (scipy LSODA work arrays) and the rest\nmacOS allocator arena churn. On Linux (glibc) the growth is 0.017 MB/tick\nunfixed and 0.000 with periodic malloc_trim(0), versus ~1.6 MB/tick on the\nmacOS mini, so memory on the HPC target is bounded and the cells-per-node\nbudget stands. The \"unbounded native leak\" framing was substantially a macOS\nmeasurement artifact.\n\nRole: this study is Part A - enabling compute infrastructure (correct\ndivision, flat per-cell cost, Linux-bounded memory) for the phenotype-first\ncolonies investigation. The memory behaviour is a characterised, Linux-bounded,\nmitigated footnote, not the result and not an HPC blocker.\n", "purpose": {"question": "Is the pure whole-cell colony composite ready to scale on HPC? Can N\nparallel EcoliWCMs grow and divide cleanly for ≥2 generations inside one\ncomposite, and how does wall-time / RAM / per-tick cost scale with N on one\nmachine — well enough to project a cells-per-HPC-node budget?\n", "mechanism": "The `colony` composite generator (v2ecoli/composites/colony.py) wires N\ncopies of EcoliWCM (v2ecoli/bridge.py) into a pymunk 2D physics environment.\nEach EcoliWCM holds an internal Composite of the 55-process baseline. At cell\ndivision the bridge returns a structural update (_remove mother, _add two\ndaughter EcoliWCMs) that the outer composite engine must hydrate. We sweep\nN ∈ {1,2,4,8} and instrument per-tick costs.\n", "expected_outcome": "After the Build fix, a pure-WC N=2 colony runs past first division to 4\nticking cells without the manual-hydration workaround in\nreports/colony_report.py. In the N-sweep, per-cell wall stays within ~2× of\nthe N=1 cost (no super-linear blow-up from coupling/contention), peak RSS\nscales close to linear, and we can name the dominant bottleneck (GIL, pymunk\nserial step, or RAM-per-cell).\n"}, "findings": [{"id": "F-01-per-cell-wall-flat", "kind": "computational", "status": "confirms", "statement": "Per-cell wall time is flat at 70–74 ms across N ∈ {1, 2, 4, 8} (slight\ndecrease with N as Python/import overhead amortizes). Composite scales\nlinearly on one machine.\n", "evidence": {"from_runs": ["nsweep-n1", "nsweep-n2", "nsweep-n4", "nsweep-n8"], "from_test": "per-cell-cost-within-2x-reference", "observed": {"n1": 73.6, "n2": 73.2, "n4": 72.7, "n8": 70.4}, "units": "ms/tick/cell"}, "expected": {"summary": "per-cell wall stays within 2× of the N=1 reference; flat is the strongest pass condition."}, "provenance": {"run_ids": [3, 4, 5, 6], "model_commit_hash": "2f950d9", "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs.db", "analysis_script": "studies/colonies-01-hpc-readiness/sims/run.py", "random_seeds": [0]}, "next_action": "Use 73 ms/tick/cell as the projection input for colonies-02-hpc-deployment.\n"}, {"id": "F-02-gil-bottleneck", "kind": "computational", "status": "novel", "statement": "The GIL is the dominant bottleneck at colony scale. Process-bigraph\ncomposites are single-threaded by design — one process uses ~1 CPU core\nregardless of how many cells it holds. Scaling means more processes, not\nmore cells/process.\n", "evidence": {"from_run": "nsweep-n8", "observed": "pymunk_step_ms ≈ 0.1 ms/tick (free); ecoli_ms grows linearly with N", "units": "ms/tick"}, "explanation": "All 55 inner WCM steps are walked sequentially in one Python thread.\npymunk is free even at N=8, so any super-linear cost would have to be in\nthe EcoliWCM update — but per-cell stays flat. The only ceiling visible\nis total wall vs realtime per process, which crosses ~1.0 around N≈13.\n", "provenance": {"run_ids": [6], "model_commit_hash": "2f950d9", "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs.db"}, "next_action": "Seed gil-aware-engine-research follow-up.\n"}, {"id": "F-03-per-cell-rss", "kind": "computational", "status": "confirms", "statement": "Per-cell RSS is ADDITIVE and sim_data is shared WITHIN a process: each\nextra cell costs far less than a fresh sim_data load, because\nv2ecoli/core.py::_load_cache_bundle_cached is @lru_cache'd by cache_dir and\necoli_baseline deep-copies only initial_state per cell. Original N-sweep (commit\n2f950d9, emit_cells=True): ~450 MB/cell atop a ~1 GB baseline → 384 cells/node.\nHARDENING re-measurement (2026-07-27, current main, bounded\nColonyPhenotypeRecorder + emit_cells=False): ~291 MB/cell atop an ~888 MB\nbaseline; the gc-visible numpy footprint stays flat (+39 MB) as N goes 1→4,\ndirectly confirming sim_data is shared by reference and the per-cell increment\nis mutable state, not a duplicated bundle. Per-cell RSS DROPPED ~450→~291 MB\nbecause the bounded phenotype recorder replaced the in-RAM cells-map\naccumulation. Reconciled current-main budget: ~700 cells/node (see\nexpected.summary), superseding both the stale 384 and the unsupported ~1000 in\nthe investigation executive.\n", "evidence": {"from_run": "nsweep-n8", "from_test": "per-cell-cost-within-2x-reference", "observed": {"n1_mb": 1508, "n2_mb": 2013, "n4_mb": 2946, "n8_mb": 4712}, "slope_mb_per_cell": 450, "units": "MB", "hardening_remeasurement_2026_07_27": {"note": "current main, bounded recorder, emit_cells=False; N grown 1→2→4 by\nforced division within one process (sim_data lru-shared).\n", "plateau_n1_mb": 1179, "plateau_n2_mb": 1462, "plateau_n4_mb": 2051, "baseline_mb": 888, "slope_mb_per_cell": 291, "numpy_delta_n1_to_n4_mb": 39, "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs/percell_rss.csv"}}, "expected": {"summary": "Additive in N within one process (sim_data lru-shared). HPC budget with\ntopology made explicit: deployment uses Ray actors (one OS process each) to\nlift the single-process GIL ceiling, so EACH actor pays its own ~888 MB\nsim_data+imports baseline; cells within an actor add ~291 MB each and share that\nactor's sim_data. Packing K cells per actor on 64 actors / 256 GB:\n888 + 291·K ≤ 4096 MB/actor → K ≤ 11, and K·57 ms ≤ 1000 ms realtime (K=11 →\n627 ms, under the GIL ceiling) → ~704 cells/node on current main (was 384 at\n450 MB/cell pre-recorder). One-cell-per-actor (max GIL headroom) is RAM-bound at\n~215 cells/node. The unsupported ~1000 in the investigation executive is\nreconciled to this ~700 figure.\n"}, "provenance": {"run_ids": [3, 4, 5, 6], "model_commit_hash": "2f950d9", "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs.db", "hardening_analysis_script": "studies/colonies-01-hpc-readiness/sims/percell_rss.py"}}, {"id": "F-04-pymunk-negligible", "kind": "computational", "status": "confirms", "statement": "pymunk 2D physics is essentially free at the N values we tested\n(≤ 0.2 ms/tick at N=8). All wall-time cost is the inner EcoliWCM.\n", "evidence": {"from_run": "nsweep-n8", "observed": "pymunk_step_ms ≤ 0.2", "units": "ms/tick"}, "provenance": {"run_ids": [6], "model_commit_hash": "2f950d9"}}, {"id": "F-05-build-phase-bugs", "kind": "methodological", "status": "novel", "statement": "Three independent bugs blocked daughter hydration through the engine\nand had to be fixed before the Decide phase could run.\n", "explanation": "(1) viva-munk apply_updates_with_realize unpacked 2 values from\nbigraph_schema.core.realize, which now returns 3 (escape_merges) —\nevery structural _add crashed.\n(2) v2ecoli/colony.py wired only mass/volume/exchange outputs on\ninitial cells; _handle_division writes to `agents` with no wire,\nso mother updates had nowhere to land.\n(3) v2ecoli/bridge.py _handle_division hard-coded `interval=60.0` for\ndaughters; `interval` is not in config_schema, so daughters ticked\nonce per 60s instead of inheriting the mother's 1s cadence.\n", "evidence": {"from_run": "build-smoke-n2", "from_test": "daughters-hydrated", "observed": "After all three fixes, pure-WC N=2 force-divided to 4 hydrated daughters that all advance on the next tick."}, "provenance": {"run_ids": [2], "model_commit_hash": "2f950d9", "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs.db"}}, {"id": "F-06-rss-growth-over-time", "kind": "computational", "status": "novel", "statement": "RSS grows continuously during a single long N=1 run at ~5 MB/sim-second\n(1126 MB at tick 0 → 7016 MB by tick 1050, before division). Originally read as\neither accumulating state in the EcoliWCM internal composite or a leak;\nvisible only in long runs, not in the 60s N-sweep windows.\n\nCharacterised by the 2026-07-26 leak hunt (supersedes the leak framing): the\ngrowth is localized to the inner WCM's polypeptide-elongation step (~82%) +\nmass-listener (~17%), and is NOT an unbounded native leak. Only ~0.2 MB/tick is\ntruly retained (tracemalloc-visible: scipy LSODA integrator work arrays held\nper solve); the remainder is macOS allocator arena churn — large per-tick numpy\nworking arrays that are freed but not returned to the OS. Linux validation (glibc\ncontainer) showed RSS growth of only 0.017 MB/tick with no fix and 0.000 with\nperiodic malloc_trim(0), versus ~1.6 MB/tick on the macOS mini. On the Linux HPC\ntarget the colony's memory is bounded, so the cells-per-node budget stands; the\n~5 MB/s reading here was substantially a macOS measurement artifact.\n", "evidence": {"from_run": "bio-1cell-natural-division", "observed": "rss_mb climbs monotonically across the pre-division window", "units": "MB/sim-second"}, "next_action": "Source identified (elongation + mass-listener; scipy LSODA retention);\ngrowth is Linux-bounded. Residual ~0.2 MB/tick scipy retention is a small\noptimization target (solver reuse / method change / periodic malloc_trim),\ntracked in the multi-gen-perf-drift follow-up.\n", "provenance": {"run_ids": [7], "model_commit_hash": "9addea3", "raw_data_artifact": "studies/colonies-01-hpc-readiness/runs.db"}}], "conclusion_logic": {"if_primary_tests_pass": {"implementation_status": "colony composite is HPC-ready: daughter hydration works through\nthe engine, per-cell cost stays bounded as N grows on one machine.\n", "pipeline_unblocks": ["colonies-02-hpc-deployment can size HPC nodes from the recorded peak_rss_mb and per_cell_update_ms numbers."]}, "if_primary_tests_fail": {"diagnose": ["If daughters-hydrated FAILS, the engine's structural-update path for nested processes is the root issue. Look at how `_add` is consumed and whether the daughter's `address: local:EcoliWCM` gets instantiated.", "If per-cell-cost-within-2x-reference FAILS, profile which timer grew super-linearly (per_cell_update_ms — GIL contention; pymunk_step_ms — O(N²) physics broadphase; total wall but not per-cell — scheduler overhead)."], "block_downstream": "colonies-02 should not start."}}, "limitations": ["Single-machine only; cross-node HPC scaling is colonies-02's job.", "90 min sim window is one full doubling plus a buffer for the second division, not an N-generation run.", "Per-cell EcoliWCM internal cache is shared (same cache_dir path); RAM extrapolation may underestimate HPC RAM if HPC runs use per-cell caches.", "pymunk is single-threaded; GIL contention may dominate before any HPC-relevant bottleneck shows up."], "pipeline_gate": {"proceed_condition": "Build-phase acceptance test passes (N=2 pure-WC → 4 daughters,\nno manual hydration) AND the N-sweep completes for at least\nN ∈ {1,2,4}. N=8 is best-effort on a laptop and may be deferred\nto the HPC follow-up.\n", "blocks_until_resolved": "If daughter EcoliWCMs cannot be hydrated through the composite\nengine's structural _add path, the colonies-02 HPC deployment\nstudy should NOT start — there is no point sizing nodes for a\ncomposite that loses cells at every division. Resolution choices:\n(a) fix the bridge's structural-update emission so the engine\nhydrates daughters natively, (b) fix the engine's _add handling\nfor process nodes, or (c) accept the manual-driving pattern\nand re-design the HPC plan around per-cell processes outside\nthe composite.\n"}, "slug": "colonies-01-hpc-readiness", "figures_embedded": [{"name": "percell-rss-budget", "data_uri": "data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLT ms/tick/cell in\nthe merged 2026-07-26 remote re-run), Ray process-parallelism that lifts the\nsingle-process GIL ceiling (~3.5x cells-per-core, F-04/F-06), and a now\ncharacterised, Linux-bounded memory profile. It is not the scientific payload\n(that is Part B: whether WCM single-cell phenotypes survive colony embedding +\ndivision and match microfluidic-device data across the tier ladder).\n\nThe earlier \"per-cell RSS leaks without bound, OOMs ~gen 3, so the 384/node\nbudget is untrustworthy\" conclusion was WRONG and is retracted. The\n2026-07-26 leak hunt localized the per-tick growth to the inner WCM's\nelongation step (~82%) + mass-listener (~17%), decomposing into ~0.2 MB/tick\nof truly retained scipy LSODA work arrays and a much larger macOS\nallocator-arena retention of freed numpy buffers. Linux validation (colima\nglibc) grew 0.017 MB/tick with no fix and 0.000 with periodic malloc_trim(0),\nversus ~1.6 MB/tick on the macOS mini. So on the Linux HPC target memory is\nbounded; the leak is a characterised, mitigated footnote (residual target:\nthe ~0.2 MB/tick LSODA arena via solver reuse or periodic trim), not the story.\n\nGate: unblocked. The block existed only because of the presumed unbounded\nnative leak; the corrected diagnosis (localized + Linux-bounded) removes it,\nand the remaining behavior tests are satisfied by recorded data --\nnatural-division-2-generations (F-01), per-cell-wall-drift-within-20pct (F-02,\n1.8% drift), ray-lifts-gil-ceiling (F-04), ray-biology-consistency (F-06).\nper-cell-rss-drift-bounded is satisfied on the Linux target by\nmechanism-validation (glibc container), not a mini-measured pass; the residual\nscipy retention is noted honestly. HPC deployment (colonies-03) may proceed.\n", "purpose": {"question": "Starting from one whole-cell E. coli agent dividing naturally through 3-4\ngenerations (1 → 2 → 4 → 8), does per-cell compute cost (wall + RSS) stay\nflat, or drift as daughter EcoliWCM internal composites accumulate history?\nAnd does running the growing colony under the process-bigraph Ray protocol\n(one OS process per cell / sharded actor pool) lift the single-process GIL\nceiling colonies-01 measured (~13 cells/process at realtime)?\n", "mechanism": "The `colony` composite (v2ecoli/composites/colony.py) wires N copies of\nEcoliWCM (v2ecoli/bridge.py) into one pymunk 2D environment from viva-munk.\nAt division the bridge emits a structural update (_remove mother, _add two\ndaughter EcoliWCMs) hydrated natively by the engine (the colonies-01\ndaughter-hydration fix). Sequential runs walk all inner 55-process WCM steps\non one GIL-bound thread. The Ray protocol (process_bigraph/protocols/ray.py —\nRayProtocol sharded actor pool via `ray:EcoliWCM` + Composite\nparallel_processes=True) runs each cell's update in its own OS process, so\nindependent cells solve concurrently across cores.\n", "expected_outcome": "(H1, drift) Per-cell wall drifts \u003c=20% across gens 0-3; if >20%, the inner\ncomposite is accumulating dead nodes / growing allocations (resolves F-06).\n(H2, RSS) Per-cell RSS stays bounded once startup is amortized; the\n~5 MB/sim-s climb is pre-division warmup, not an unbounded leak. (H3, Ray)\nUnder Ray, total wall stays sub-realtime well past the ~13-cell single-process\nceiling, with biology (masses, division timing) consistent vs the sequential\nrun modulo RNG.\n"}, "findings": [{"id": "F-01-natural-multigen-division", "kind": "computational", "status": "confirms", "statement": "One whole-cell agent divides naturally (no forced same-tick division)\nthrough >=3 generations: 1 -> 2 -> 4 -> 6 -> 8 -> 10 -> 12 -> 14 cells\n(7 division events) in the sequential run, with all cells advancing on\nsubsequent ticks. Resolves the colonies-01 PASS-narrow caveat (which\nvalidated FORCED division only). Daughter EcoliWCMs hydrate natively\nvia the bridge _remove/_add structural update.\n", "evidence": {"from_runs": ["seq-1cell-4div"], "from_test": "natural-division-2-generations", "observed": {"division_ticks": [2338, 4706, 4707, 6975, 6976, 7075, 7101], "cells_final": 14}, "units": "tick (1 tick = 1 sim-s)"}, "expected": {"summary": "one cell divides to 2 then both daughters to 4, all advancing."}, "provenance": {"run_ids": ["seq-1cell-4div"], "model_commit_hash": "854ff2e4", "raw_data_artifact": "studies/colonies-02-parallel-multigen-perf/runs/ticks.parquet", "analysis_script": "studies/colonies-02-parallel-multigen-perf/sims/run.py", "random_seeds": [0]}, "next_action": "Natural multi-gen division is a usable substrate; memory is Linux-bounded (F-03), so it is HPC-ready enabling infrastructure."}, {"id": "F-02-per-cell-wall-flat", "kind": "computational", "status": "confirms", "statement": "Per-cell EcoliWCM wall does not drift across generations. The cleanest\ncomparison (low-RSS static N-sweep, 60-tick windows): per-cell wall is\nflat at 54-59 ms across N in {1,2,4,8,16} (65->54 ms, a slight decrease\nas overhead amortizes). In the growing sequential run the 1-cell gen\n(55.3 ms) vs 2-cell gen (56.3 ms/cell) differ by only +1.8%. Apparent\ninflation to ~80 ms/cell at 14 cells is swap pressure (F-03) + O(N)\npymunk collision cost, not WCM-internal accumulation. Resolves F-06\nfor wall time: no per-cell wall drift.\n", "evidence": {"from_runs": ["seq-1cell-4div", "nsweep-local"], "from_test": "per-cell-wall-drift-within-20pct", "observed": {"seq_gen0_ms": 55.3, "seq_gen1_per_cell_ms": 56.3, "drift_pct": 1.8, "nsweep_local_per_cell_ms": {"n1": 65, "n2": 59, "n4": 59, "n8": 58, "n16": 54}}, "units": "ms/tick/cell"}, "expected": {"summary": "per-cell wall drifts \u003c=20% across generations 0-3."}, "provenance": {"run_ids": ["seq-1cell-4div", "nsweep:local"], "model_commit_hash": "854ff2e4", "raw_data_artifact": "studies/colonies-02-parallel-multigen-perf/runs/nsweep.parquet", "analysis_script": "studies/colonies-02-parallel-multigen-perf/sims/nsweep.py", "random_seeds": [0]}, "next_action": "Use ~55-60 ms/tick/cell (sequential) as the per-cell wall projection input."}, {"id": "F-03-per-cell-rss-unbounded-leak", "kind": "computational", "status": "confirms", "statement": "CORRECTED by the 2026-07-26 leak hunt + Linux validation (supersedes the\nearlier \"unbounded native leak\" reading recorded below). Per-process RSS\nattribution on the mini localized the per-tick growth to the inner WCM's\npolypeptide-elongation step (~82%) plus the mass-listener (~17%) -- it is\nNOT an unbounded native leak. It decomposes into two parts: (1) a small\nreal retention of ~0.2 MB/tick (tracemalloc-visible), the scipy LSODA\nintegrator work arrays (rwork/iwork) held per solve_ivp(method=\"LSODA\")\nin the equilibrium / two-component / tRNA-charging ODEs -- ~0.6 GB over a\n~3000-tick cell cycle, a small named optimization target (solver reuse /\nmethod change / periodic trim); and (2) allocator ARENA retention -- the\nscary ~1.4 MB/tick was the elongation step's large per-tick numpy working\narrays (buildSequences/polymerize, ~1.3 MB) which are freed but macOS does\nnot return to the OS, so mini RSS climbs (invisible to tracemalloc). Linux\nvalidation (colima glibc container, faithful reproduction of both sources)\ngrew 0.017 MB/tick WITHOUT any fix and 0.000 with periodic malloc_trim(0),\nversus ~1.6 MB/tick on the macOS mini. So on the Linux HPC target the\ncolony's memory is BOUNDED; the OOM / unbounded-leak framing below was\nsubstantially a macOS measurement artifact. The macOS-mini figures in\n`observed` (7.7 MB/sim-s, ~19 GB at first division, 27.5 GB peak, OOM at\ntick 8161) are retained as the original mini measurements, now understood\nas arena churn, not a Linux-relevant leak. Also corrected: an intermediate\n\"emitter is 94% of the leak\" reading was a warm-process artifact and is\nWRONG -- the growth is intrinsic to comp.run() (elongation), as above.\n", "evidence": {"from_runs": ["seq-1cell-4div"], "from_test": "per-cell-rss-drift-bounded", "observed": {"macos_mini_single_cell_leak_mb_per_s": 7.7, "macos_mini_single_cell_rss_at_first_division_gb": 19, "macos_mini_peak_rss_gb": 27.5, "macos_mini_oom_tick": 8161, "no_emitter_control_mb_per_tick": 7.06, "elongation_share_pct": 82, "mass_listener_share_pct": 17, "real_retention_scipy_lsoda_mb_per_tick": 0.2, "linux_glibc_mb_per_tick_no_fix": 0.017, "linux_glibc_mb_per_tick_with_malloc_trim": 0.0, "macos_mini_mb_per_tick": 1.6}, "units": "MB (macos_mini_* are macOS allocator-arena artifacts; linux_* are the HPC-target measurements)"}, "expected": {"summary": "per-cell RSS stabilizes after startup (the ~5 MB/sim-s climb is warmup)."}, "provenance": {"run_ids": ["seq-1cell-4div"], "model_commit_hash": "854ff2e4", "raw_data_artifact": "studies/colonies-02-parallel-multigen-perf/runs/ticks.parquet", "analysis_script": "studies/colonies-02-parallel-multigen-perf/sims/run.py", "random_seeds": [0]}, "next_action": "No longer blocks colonies-03-hpc-deployment: memory is Linux-bounded\n(0.017 MB/tick on glibc, 0.000 with malloc_trim). Residual optimization\ntarget is the ~0.2 MB/tick scipy LSODA arena (solver reuse / periodic\ntrim); enable malloc_trim on the HPC target for headroom.\n"}, {"id": "F-04-ray-lifts-gil-ceiling", "kind": "computational", "status": "confirms", "statement": "The process-bigraph Ray protocol (ray:EcoliWCM, parallel_processes=True)\nlifts the single-process GIL ceiling. Static N-sweep median wall (realtime\nratio): local scales linearly 65/118/237/466/865 ms (ratio 0.07->0.87)\nfor N=1/2/4/8/16, crossing realtime near N~18 (the colonies-01 ceiling).\nRay scales sub-linearly 54/59/81/115/245 ms (ratio 0.05->0.25): per-cell\nwall drops 54->15 ms as cells solve concurrently across cores. At N=16\nRay is 3.5x faster and only 0.25 realtime, with headroom to ~50-60 cells\nbefore realtime. Confirmed in the growing colony too: 2 cells cost the\nsame total wall (~59 ms) as 1 cell.\n", "evidence": {"from_runs": ["nsweep:local", "nsweep:ray", "ray-1cell-4div"], "from_test": "ray-lifts-gil-ceiling", "observed": {"local_wall_ms": {"n1": 65, "n2": 118, "n4": 237, "n8": 466, "n16": 865}, "ray_wall_ms": {"n1": 54, "n2": 59, "n4": 81, "n8": 115, "n16": 245}, "local_realtime_cross_n": 18, "ray_realtime_cross_n_est": 55}, "units": "ms/tick (realtime budget = 1000 ms)"}, "expected": {"summary": "Ray total wall stays sub-realtime past the sequential ~13-cell ceiling."}, "provenance": {"run_ids": ["nsweep:local", "nsweep:ray", "ray-1cell-4div"], "model_commit_hash": "854ff2e4", "raw_data_artifact": "studies/colonies-02-parallel-multigen-perf/runs/nsweep.parquet", "analysis_script": "studies/colonies-02-parallel-multigen-perf/sims/nsweep.py", "random_seeds": [0]}, "next_action": "CPU/GIL is no longer the ceiling under Ray (~3.5x sequential\ncells-per-core). RAM is a bounded, budgetable overhead on Linux (F-03, F-05),\nnot a runaway per-generation leak.\n"}, {"id": "F-05-ray-ram-is-binding-constraint", "kind": "computational", "status": "confirms", "statement": "Under Ray the binding constraint flips from CPU/GIL to aggregate RAM,\nand RAM is worse than sequential. The ~7.7 MB/sim-s per-cell leak (F-03)\nis transport-independent: it moves into the actor process (one actor\nreached ~19 GB by tick 2338, mirroring sequential). The Ray protocol also\npre-spawns a ~13-actor pool, each carrying a ~590 MB WCM baseline (~7.6 GB\nfixed overhead). At just 2 live cells the two daughter actors were each\n~10 GB and climbing (~34 GB distinct actor RSS), so a growing colony OOMs\nthe machine even faster than sequential. The main process stays flat\n~0.7 GB (WCM offloaded). RSS sawtooths at division (mother actor returns\nto pool).\nRefined by the 2026-07-26 leak hunt (see F-03): the per-actor climb that\ndrove the ~19/34 GB figures is the same macOS allocator-arena artifact and\nis Linux-bounded (0.017 MB/tick on glibc), so on the HPC target aggregate\nactor RAM does NOT run away with generation age. The real, transport-\nspecific Ray cost is the FIXED pool baseline recorded here -- ~590 MB/idle\npool r-cell-rss-bounded-after-fix", "classification": "primary", "description": "Per-cell RSS is bounded on the Linux HPC target (not the macOS mini, where\nfreed arenas are retained by the allocator). MET at the mechanism level:\na faithful Linux/glibc reproduction grows 0.017 MB/tick unmitigated and\n0.000 MB/tick with periodic malloc_trim(0), versus ~1.6 on the macOS mini.\nValidated in a colima glibc container; NOT yet confirmed by a full-colony\nend-to-end HPC-node lifetime run.\n"}, {"name": "biology-unchanged-by-fix", "classification": "primary", "description": "The fix does not alter recorded biology: first division still at tick\n2338, per-cell mass at division within RNG of the colonies-02 run.\n"}], "conclusion": "Role: Part A enabling infrastructure. This study set out to localize an\napparent unbounded native leak that appeared to block HPC deployment; the\n2026-07-26 leak hunt shows the leak is characterised, localized, and\nLinux-bounded — a footnote, not the story.\n\nFindings: the per-tick RSS growth is localized to the inner WCM's\npolypeptide-elongation step (~82%) + mass-listener (~17%) (F-06, satisfies\nleak-localized). The truly-retained part is small (~0.2 MB/tick = scipy LSODA\nwork arrays); the ~1.4 MB/tick that read as an unbounded native leak on the\nmacOS mini is allocator arena retention of elongation's per-tick numpy arrays —\na macOS artifact. On the Linux/glibc HPC target the growth is bounded\n(0.017 MB/tick unmitigated, 0.000 with periodic malloc_trim(0)), so the\ncells-per-node RAM budget is trustworthy. This reconciles F-01/F-02 (real but\nminor Python-emitter win) and F-04/F-05 (the \"C-level\" and \"Numba/LLVM\"\nreadings were macOS observations, not the load-bearing per-tick driver).\n\nGate: passed — the \"unbounded native leak\" blocker on\ncolonies-04-hpc-deployment is resolved by localization + Linux boundedness.\nHonest caveat: the boundedness is mechanism-validated in a colima glibc\ncontainer, NOT yet confirmed by a full-colony end-to-end HPC-node lifetime run;\nthat in-situ run, plus the optional malloc_trim / scipy-LSODA solver-reuse\noptimizations, remain open engineering items rather than gate blockers.\n", "purpose": {"question": "Where does the RSS growth in a single EcoliWCM come from, and is it bounded\non the Linux HPC target so per-cell RSS budgets are trustworthy? (Answered:\nlocalized to elongation + mass-listener; small real retention is scipy LSODA\nwork arrays; the rest is macOS arena churn; on Linux/glibc it is bounded.)\n", "mechanism": "Final (2026-07-26 leak hunt, supersedes the earlier RAMEmitter and\nNumba/LLVM hypotheses): per-process RSS attribution on the mini localizes the\nper-tick growth to the inner WCM's polypeptide-elongation step (~82%) +\nmass-listener (~17%). Two distinct components:\n  (1) Real retention ~0.2 MB/tick (tracemalloc-visible): scipy LSODA\n      integrator work arrays (scipy/integrate/_ode.py rwork/iwork) held per\n      solve, from solve_ivp(method=\"LSODA\") in the equilibrium /\n      two-component / tRNA-charging ODEs. Over a ~3000-tick cell cycle that\n      is ~0.6 GB/cell — a small, named optimization target (solver reuse /\n      method change / periodic trim).\n  (2) Allocator arena retention (the scary ~1.4 MB/tick on the macOS mini):\n      elongation allocates large per-tick numpy working arrays\n      (buildSequences/polymerize, ~1.3 MB) that are freed but macOS does not\n      return to the OS, so RSS climbs — invisible to tracemalloc. A macOS\n      allocator artifact, not a leak.\nAn intermediate session claim that \"the emitter is 94% of the leak\" was a\nwarm-process measurement artifact and is WRONG; the growth is intrinsic to\ncomp.run() (elongation).\nMitigation: periodic malloc_trim(0) on the Linux target returns freed arenas\n(0.000 MB/tick with, 0.017 without); solver reuse addresses the small real\nretention. A bounded per-cell phenotype panel is streamed to zarr by\nColonyPhenotypeRecorder (a process, not an emitter — processes get a cheap\nview rather than deep-copying the cells map).\n", "expected_outcome": "A per-process/tracemalloc profile attributes >=~80% of growth to named sites\n(met: elongation ~82% + mass-listener ~17%; real retention = scipy LSODA work\narrays). On the Linux/glibc target RSS is bounded (0.017 MB/tick unmitigated,\n0.000 with periodic malloc_trim), versus the macOS-only arena artifact. The\nfix does not alter biology (read-only sink / allocator behavior, no feedback\ninto state). Not yet run: a full-colony end-to-end HPC-node lifetime confirming\nthe bound in situ.\n"}, "findings": [{"id": "F-01-leak-is-inner-ram-emitter", "kind": "computational", "status": "confirms", "behavior_test": "leak-localized", "verdict": "PASS", "statement": "The colonies-02 ~7.7 MB/sim-s per-cell RSS leak is the inner per-cell\nRAMEmitter, not chromosome_history and not \"emitter-independent\". Each\nembedded cell's inner Composite (built by baseline() in the EcoliWCM\nbridge) gets a default RAMEmitter whose no-override branch\n(_helpers.py) captures `bulk` (~25k-molecule array) + four unique-\nmolecule node arrays every tick into an unbounded history list that is\nnever read. colonies-02's no-emitter probe nulled only the outer colony\nemitter, missing the per-cell inner emitters.\n", "evidence": "Live profiler measured the inner RAMEmitter history at ~5.15 MB/row,\ngrowing 1:1 with ticks (9.9 MB @ 2 rows -> 9324 MB @ 1802 rows), tracking\nthe RSS climb. Confirmed by reading process_bigraph Emitter.inputs() ==\nconfig['emit'] (the emitter only stores its emit_schema ports).\n"}, {"id": "F-02-minimal-capture-bounds-rss", "kind": "computational", "status": "confirms", "behavior_test": "per-cell-rss-bounded-after-fix", "verdict": "PASS (single-cell bridge path); multi-cell colony no-OOM = confirmatory follow-up", "statement": "Setting the inner RAMEmitter to 'minimal' capture (global_time +\nlisteners only) for embedded cells bounds per-cell RSS. A single\nEcoliWCM built through the bridge (set_ram_emitter_capture('minimal'))\nholds RSS essentially flat.\n", "evidence": "Bridge-path profile_leak.py (commit bd1a11fe) RSS: 1.3 GB @ 21 min ->\n1.7 GB @ 48 min -> 1.9 GB @ 62 min (~0.25 MB/s, legitimate cell growth),\nvs the unfixed path +24 GB by tick 1800 (~7.7 MB/s). ~30x reduction;\nno monotonic emitter-driven climb.\n", "next_action": "Confirmatory (not load-bearing): run colonies-02 seq-1cell-4div to full\nduration on the mini to show the multi-cell colony completes >=3\ngenerations without OOM. The fix is per-cell, so N bounded cells follow.\n"}, {"id": "F-03-fix-cannot-alter-biology", "kind": "computational", "status": "confirms", "behavior_test": "biology-unchanged-by-fix", "verdict": "PASS (by construction; empirical re-confirm pending)", "statement": "The fix only narrows what the inner RAMEmitter records (a read-only\nhistory sink); the emit_schema does not feed back into simulation state,\nso division timing and masses are unchanged by construction. The full\ncolony re-run (first division still tick 2338) is the empirical\nre-confirmation, deferred with the no-OOM run above.\n"}, {"id": "F-04-dominant-colony-leak-is-c-level", "kind": "computational", "status": "refutes", "verdict": "REFINED by F-06 — C-level growth confirmed, but localized (elongation+mass-listener) and Linux-bounded, not a multi-gen HPC blocker", "statement": "The inner-RAMEmitter fix (F-01/F-02) is real and bounds a single bare WCM,\nbut it is not the dominant leak for a multi-cell colony. Re-running\ncolonies-02 on current main with all three contributory fixes live\n(#239 inner emitter, emit_cells=False outer emitter, viva-munk #11 pymunk\nshape churn) still leaks ~0.5-1 MB/tick/cell: the count=6 plateau climbed\n5.1 -> 22.3 GB at a constant 6 cells and OOMs ~gen 3, unchanged from before\nthe fixes.\nRefined by the 2026-07-26 leak hunt: the \"C-level dominant leak\" call stands as a macOS observation but is not an unbounded native leak. Per-process attribution localizes it to elongation (~82%) + mass-listener (~17%); the C-level growth is macOS allocator arena retention of elongation's per-tick numpy arrays plus ~0.2 MB/tick of retained scipy LSODA work arrays. On Linux/glibc it is bounded (0.017 unmitigated, 0.000 with malloc_trim). See F-06.", "evidence": "tracemalloc(4) over 150 ticks at 2 forced-division cells: RSS climbed\n1396 -> 1586 MB (+1.3 MB/tick), leak reproduced, yet tracemalloc\naccounted for only ~1-2 MB of retained Python allocations (largest single\nsite +0.08 MB; all transient WCM compute: counts_deriver/translation_deriver\nnp.bincount, scipy-sparse .dot). So the dominant allocator is C-level /\nnative (numpy/scipy array buffers or a C-extension retaining or fragmenting\nmemory), invisible to tracemalloc (it tracks only CPython's allocator, not\nnumpy's). gc object-count scans likewise found only small symptoms\n(pymunk Segments -> #11), not the megabytes.\n", "next_action": "Needs a NATIVE heap profiler (macOS `leaks`/`malloc_history` with\nMALLOC_STACK_LOGGING, or jemalloc/tcmalloc heap profiling), not Python\ntooling. Until then the colony is RAM-blocked for multi-generation runs and\ncolonies-04-hpc-deployment stays blocked. The 3 Python-level fixes remain\nvalid wins (merged).\n"}, {"id": "F-05-native-leak-localized-to-llvm-numba", "kind": "computational", "status": "confirms", "verdict": "REFINED by F-06 — LLVM/Numba was a small one-time true-leak signal, not the per-tick driver; per-tick growth is elongation+mass-listener, Linux-bounded (#253 not load-bearing)", "statement": "The dominant per-tick growth is native and localized to the LLVM/Numba JIT\nlayer. A controlled staged run (colonies-02 sims/mem_measure.py) shows\nnumpy-object bytes flat within each cell-count plateau while native memory\nclimbs (decomposition figure), and macOS `leaks` (MallocStackLogging) finds\nthe true unreachable leak with stacks in llvmlite's LLVM pass pipeline\n(LLVMPY_buildFunctionSimplificationPipeline). So the WCM's JIT compilation\nis the source, not the emitters (#239), the outer emitter (emit_cells), the\npymunk shapes (viva-munk #11), or a retained numpy array.\nRefined by the 2026-07-26 leak hunt: the LLVM/Numba JIT stacks that macOS `leaks` surfaced were a one-time/small true-leak signal (~13 MB), not the per-tick driver. The per-tick growth is intrinsic to comp.run() elongation (~82%) + mass-listener (~17%): macOS arena retention of per-tick numpy arrays plus ~0.2 MB/tick of scipy LSODA work arrays. It is Linux-bounded. So #253 (JIT recompilation) is not the load-bearing fix; the actionable targets are periodic malloc_trim(0) and scipy-LSODA solver reuse. See F-06.", "evidence": "leaks @2cells/400ticks: ~846 MB live, ~13 MB true leak, top stacks all\nLLVM PassBuilder (GVN/JumpThreading/LoopUnswitch/LICM). numpy-bytes delta\n~0 within plateaus; tracemalloc \u003c2 MB of a +151 MB/300-tick growth.\nFigures: colonies-02 charts/03_memory_decomposition.svg (native vs numpy),\ncharts/01_rss_vs_tick_by_ncells.svg (per-tick slope by N).\n", "next_action": "Tracked as engineering issue #253: find where the WCM (re)compiles @njit\nfunctions per tick/cell and make them module-level + cache=True so they\ncompile once and are shared; confirm with NUMBA_DISABLE_JIT=1 flattening the\ngrowth. Separately, the per-cell footprint (each cell = an independent\nbaseline composite loading its own sim_data, ~1+ GB/cell, colonies-02\ncharts/02) is a distinct, bounded RAM limiter worth a shared-sim_data design.\n"}, {"id": "F-06-leak-localized-and-linux-bounded", "kind": "computational", "status": "confirms", "behavior_test": "leak-localized", "verdict": "PASS", "statement": "The colony per-tick RSS growth is localized and Linux-bounded, not an\nunbounded native leak (this is the corrected diagnosis that reconciles\nF-01/F-02/F-04/F-05). Per-process RSS attribution on the mini pins the growth\nto the inner WCM's polypeptide-elongation step (~82%) + mass-listener (~17%).\nTwo components: (1) a small real retention ~0.2 MB/tick (tracemalloc-visible)\n= scipy LSODA integrator work arrays (rwork/iwork) held per solve from\nsolve_ivp(method=\"LSODA\") in the equilibrium / two-component / tRNA-charging\nODEs (~0.6 GB over a ~3000-tick cycle); (2) the scary ~1.4 MB/tick =\nmacOS allocator arena retention of elongation's large per-tick numpy working\narrays (buildSequences/polymerize, ~1.3 MB), freed but not returned to the OS,\ninvisible to tracemalloc — a macOS artifact. The earlier \"emitter is 94% of\nthe leak\" reading was a warm-process artifact and is wrong.\n", "evidence": "Linux/glibc validation (colima container, faithful reproduction of both\nsources): RSS grew 0.017 MB/tick WITHOUT any fix and 0.000 MB/tick WITH\nperiodic malloc_trim(0), versus ~1.6 MB/tick on the macOS mini. Per-process\nattribution: elongation ~82%, mass-listener ~17%. tracemalloc localizes the\n~0.2 MB/tick retained component to scipy/integrate/_ode.py work arrays.\n", "next_action": "Two optional, bounded optimizations (neither is an HPC blocker): periodic\nmalloc_trim(0) on the Linux target to drive residual arena growth to ~0, and\nscipy-LSODA solver reuse (or method change) to remove the ~0.2 MB/tick real\nretention. Open verification item: a full-colony end-to-end HPC-node lifetime\nrun to confirm the bound in situ (mechanism-validated in-container so far).\n"}], "pipeline_gate": {"proceed_condition": "Met: the 2026-07-26 hunt localizes >=~80% of the growth to named sites\n(elongation ~82% + mass-listener ~17%; real retention = scipy LSODA work\narrays) and shows the growth is Linux-bounded (0.017 MB/tick unmitigated,\n0.000 with malloc_trim). Gate proceeds.\n", "blocks_until_resolved": "Resolved for HPC purposes: the \"unbounded native leak\" was substantially a\nmacOS allocator artifact. On the Linux/glibc HPC target per-cell RSS is\nbounded (mechanism-validated in a colima glibc container), so the\ncells-per-node budget is trustworthy. colonies-04-hpc-deployment is u <script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], stores=topo.stores||[];
  const rows=[]; (function fl(ns,d){ (ns||[]).forEach(n=>{ rows.push({d,n}); fl(n.children,d+1); }); })(stores,0);
  if(!rows.length && !procs.length) return '';
  const rowH=23, headH=28, padX=14, colGap=44;
  const storeW=Math.max(240,...rows.map(r=>padX+r.d*16+(String(r.n.name).length)*7+(String(r.n.type||'').length)*6.2+70));
  const procH=64;
  const procW=Math.max(250,...procs.map(p=>Math.max(String(p.name).length*8+28,
      String(p.address||'').length*6.2+20,
      (('in: '+(p.inputs||[]).join(', ')).length)*6.0+20,
      (('out: '+(p.outputs||[]).join(', ')).length)*6.0+20)));
  const storesH=headH+rows.length*rowH+8, procsH=headH+procs.length*(procH+10);
  const H=Math.max(storesH,procsH)+14, W=storeW+colGap+procW+padX;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">STATE · BIGRAPH</text>`;
  rows.forEach((r,i)=>{ const y=headH+i*rowH, x=padX+r.d*16, leaf=!(r.n.children&&r.n.children.length);
    if(r.d>0) sv+=`<line x1="${x-8}" y1="${y+ (rowH-4)/2}" x2="${x}" y2="${y+(rowH-4)/2}" stroke="var(--line-2)"/>`;
    sv+=`<rect x="${x}" y="${y}" width="${storeW-x-6}" height="${rowH-5}" rx="5" fill="${leaf?'var(--sunken)':'var(--surface)'}" stroke="var(--line)"/>`;
    sv+=`<text x="${x+9}" y="${y+13}" fill="var(--ink)" font-family="var(--mono)" font-size="11.5">${esc(r.n.name)}</text>`;
    if(r.n.type) sv+=`<text x="${storeW-12}" y="${y+13}" text-anchor="end" fill="var(--accent)" font-size="10.5" font-family="var(--mono)">${esc(r.n.type)}</text>`;
  });
  const px=storeW+colGap;
  sv+=`<text x="${px}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  procs.forEach((p,i)=>{ const y=headH+i*(procH+10);
    sv+=`<rect x="${px}" y="${y}" width="${procW}" height="${procH}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<text x="${px+12}" y="${y+21}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`;
    if(p.address) sv+=`<text x="${px+12}" y="${y+36}" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(p.address)}</text>`;
    sv+=`<text x="${px+12}" y="${y+50}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc((p.inputs||[]).join(', ')||'—')}</tspan></text>`;
    sv+=`<text x="${px+12}" y="${y+62}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc((p.outputs||[]).join(', ')||'—')}</tspan></text>`;
  });
  sv+=`</svg>`;
  const cap=`Static topology of <span class="mono">${esc(topo.composite||'')}</span> — ${procs.length} process${procs.length==1?'':'es'} over ${rows.length} state node${rows.length==1?'':'s'}.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}
// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open']};
  const [c,l]=map[kind]||map.warn; return `<span class="status ${c}"><span class="g"></span>${l}</span>`;
}
function gateOf(s){ // pass/fail
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';
  return 'warn';
}
function isControl(s){ return gateOf(s)==='fail' && (s.confidence==='Refuted'||s.confidence==='Accepted') && !!s.conclusion; }
function loopOutcome(s){
  const r=(s.runs||[]).map(r=>r.outcomes&&r.outcomes['LOOP-OUTCOME']).find(Boolean);
  return r||null;
}

/* ---------- SVG visualizations ---------- */
// V1 capability coverage matrix: rows=requires, cols=chosen modules(+build-new), fill where provided
function vizCapMatrix(s,inv){
  const req=s.requires||[]; const mods=(s.sourcing&&s.sourcing.modules)||[];
  const cat=inv.catalog||{};
  if(!req.length) return '';
  const cols = mods.length?mods:['(build-new)'];
  const cw=Math.max(96,...cols.map(c=>c.length*7.2+24)), rh=30, lh=150, top=54;
  const W=lh+cols.length*cw+16, H=top+req.length*rh+10;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  cols.forEach((c,i)=>{ const x=lh+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" font-weight="600" fill="var(--ink)">${esc(c)}</text>`;
    sv+=`<text x="${x}" y="36" text-anchor="middle" fill="var(--ink-3)" font-size="10">provides</text>`;});
  req.forEach((r,ri)=>{ const y=top+ri*rh;
    const covered=cols.some(c=>(cat[c]||[]).includes(r));
    sv+=`<text x="${lh-12}" y="${y+rh/2+4}" text-anchor="end" fill="${covered?'var(--ink)':'var(--fail)'}" font-weight="${covered?400:700}">${esc(r)}</text>`;
    cols.forEach((c,ci)=>{ const x=lh+ci*cw, provides=(cat[c]||[]).includes(r);
      sv+=`<rect x="${x+6}" y="${y+4}" width="${cw-12}" height="${rh-9}" rx="5" fill="${provides?'var(--accent)':'var(--sunken)'}" stroke="${provides?'none':'var(--line)'}"/>`;
      if(provides) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="11" font-weight="700">✓</text>`;
    });

  });

  const uncovered=req.filter(r=>!cols.some(c=>(cat[c]||[]).includes(r)));

    : `Every required capability is provided by the chosen module(s): <span class="mono">requires ⊆ provided</span> holds.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// V6 agent-vs-policy outcome bar (investigation)

// V4 margin ladder (study, build)
function vizMarginLadder(traj){

    sv+=`<text x="${x}" y="33" text-anchor="middle" fill="var(--ink-3)" font-size="9.5">${it.n_pass}/${it.n_hard}</text>`;});

// V5 iteration timeline
function timelineSteps(traj){
  if(!traj||!traj.iterations) return '';
  const steps=traj.iterations.map(it=>{
    const d=it.decision||{}; const act=d.action||d.kind||'';
    let label=act;
    if(d.mechanism) label='install '+d.mechanism;
    else if(d.value) label=(d.action||'')+' '+d.value;
    else if(act==='done') label='DONE';
    else if(act==='blocked'||act==='install') label=act;
    const reason=d.reasoning||d.note||'';
    return {it:it.iteration,label,reason,np:it.n_pass,nh:it.n_hard};
  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}
