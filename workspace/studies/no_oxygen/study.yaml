schema_version: 4
name: no_oxygen
investigation: whole-cell-model-comparison
title: v2ecoli reproduces vEcoli on no_oxygen
condition: no_oxygen
question: Does v2ecoli reproduce vEcoli on the no_oxygen condition?
comparison:
  seeds: 4
  generations: 4
report_cards:
- viz/report_card/summary.html
- viz/report_card/parca.html
- viz/report_card/statistical.html
- viz/report_card/standard.html
- viz/report_card/trajectory.html
- viz/report_card/distribution.html
- viz/report_card/metabolism.html
- viz/report_card/composition.html
runs:
- composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  name: no_oxygen-comparison
  kind: analysis
  canonical: true
  description: v2e-compare study no_oxygen
  status: completed
  result: PASS
  outcomes:
    statistical-vs-vecoli:
      result: WITHIN_TOL
      detail: 'report card ''statistical'': ungraded'
status: evaluated
tests:
- name: summary-vs-vecoli
  kind: report_card
  card: summary
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (summary card)?
- name: parca-vs-vecoli
  kind: report_card
  card: parca
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (parca card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/whole-cell-model-comparison/no_oxygen
    group: parca
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/whole-cell-model-comparison/no_oxygen
    group: statistical
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (standard card)?
- name: trajectory-vs-vecoli
  kind: report_card
  card: trajectory
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (trajectory card)?
- name: distribution-vs-vecoli
  kind: report_card
  card: distribution
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (distribution card)?
- name: metabolism-vs-vecoli
  kind: report_card
  card: metabolism
  classification: primary
  question: Does v2ecoli reproduce vEcoli on no_oxygen (metabolism card)?
- name: composition-vs-vecoli
