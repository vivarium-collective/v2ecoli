readouts:
  - name: DnaA-ATP fraction
    status: primary
    identifier: bulk MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
    units: fraction
    notes: |
      DnaA-ATP / (apo + DnaA-ATP + DnaA-ADP), read directly from the three bulk
      species (no bespoke listener). Evaluated vs the Boesen 2024 [0.2, 0.5] band.
  - name: DnaA-form counts
    status: measured
    identifier: bulk PD03831[c] (apo) · MONOMER0-160[c] (DnaA-ATP) · MONOMER0-4565[c] (DnaA-ADP)
    units: molecules/cell
    notes: apo / DnaA-ATP / DnaA-ADP and their total; total vs the [300, 800] band. apo ≈ 0.
  - name: oriC count
    status: measured
    identifier: listeners.replication_data.number_of_oric
