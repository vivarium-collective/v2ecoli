schema_version: 4
name: dnag-promoter-availability
title: Does dnaG lose its promoters?
investigation: transcription-rewiring
study_type: mechanism_localisation
phase: Decide
created: '2026-09-03'
status: complete
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: failed
expert_review_status: not_requested
question: dnag-generational-decay established that dnaG's transcription collapses ~3e+05-fold by generation
  3 while its ppGpp basal probability RISES 14% -- so the defect is downstream of the ppGpp vector. transcript_initiation
  computes promoter_init_probs indexed BY PROMOTER and sets p_i to 0 for a TU that lacks a chromosomal
  promoter. Does dnaG lose its promoters, and does that account for the collapse?
parent_studies:
- study: dnag-generational-decay
  condition: complete
  relation: leads-to
- study: silent-transcription-units
  condition: ran
  relation: supports
units_and_time:
  tick: 1 s of simulated time; generations delimited by division events.
  quantities:
    promoter_copy_number: count of promoter unique-molecule records per TU (dimensionless integer)
    actual_rna_synth_prob: dimensionless per-TU probability, per timestep
    per-promoter probability: actual synthesis divided by promoter count (dimensionless)
behavior_tests:
- name: deriver-outputs-are-non-empty
  classification: primary
  gate_class: acceptance_criterion
  question: Does the repaired rna_synth_prob deriver actually emit its outputs?
  description: 'promoter_copy_number is a length-3277 array on at least 99% of emitted timesteps.


    The gate on req-1, and it is listed as a TEST rather than left to the requirement because this study''s
    every other axis reads a quantity that is currently EMPTY on 100% of timesteps. Silence here is indistinguishable
    from a promoter count of zero, which is precisely the hypothesis under test -- so an unrepaired deriver
    would manufacture a spurious confirmation. Checked FIRST for that reason.


    Threshold provenance: definitional. The array either has the TU dimension or it does not.'
  measure:
    kind: derived
    path: fraction of timesteps where transcript_initiation's promoter_copy_number observable is full
      length (n_TU), dnaG and ppGpp arms alike
    detail: fraction of timesteps with a full-length promoter_copy_number array, ppGpp-on arm, generations
      1-4.
  pass_if:
    low: 0.99
    high: 1.0
    provenance:
      kind: theory
      note: 'Expressed as a band because the quantity is a FRACTION, bounded above by 1.0 by construction,
        so ''>= 0.99'' and the interval [0.99, 1.0] are the same statement; the band form simply makes
        the upper bound explicit. Definitional either way: the array carries the TU dimension or the observable
        does not exist.'
  status: passed
  result: PASS
  measured_value: 1.0
  evaluated_by: agent
- name: dnag-has-zero-promoters-at-generation-4
  classification: primary
  gate_class: acceptance_criterion
  question: Does dnaG actually reach the zero-promoter state the code special-cases?
  description: 'dnaG has ZERO promoter records on at least half of generation-4 timesteps.


    Reformulated from a gen4/gen1 count ratio, which was both unbandable (a band anchored at 0 always
    has half-width equal to its midpoint, so it can never satisfy the discrimination check) and the wrong
    question. transcript_initiation''s mechanism is not ''fewer promoters'' but a SWITCH: p_i <- 0 for
    a TU that lacks a chromosomal promoter. The occupancy fraction tests that switch directly, is naturally
    bounded in [0,1], and cleanly separates the hypotheses -- H1 drives it toward 1, H2 toward 0.


    Threshold provenance: theory. Half is the weakest version of ''dnaG is usually without a promoter''
    that could plausibly produce a floor rather than a gradient in transcript_initiation''s promoter_init_probs.'
  measure:
    kind: derived
    path: fraction of generation-4 timesteps where dnaG's promoter_copy_number entry is 0, feeding transcript_initiation's
      promoter_init_probs zero-promoter branch
    detail: fraction of timesteps in generation 4 on which promoter_copy_number[TU00352[c]] == 0, median
      over seeds.
  pass_if:
    low: 0.5
    high: 1.0
    provenance:
      kind: theory
      note: 'Bounded in [0,1] by construction, spans 2x, and discriminates: H1 (promoter loss) drives
        the occupancy fraction toward 1, H2 (per-promoter probability collapse) toward 0.'
  status: failed
  result: FAIL
  measured_value: 0.0
  evaluated_by: agent
- name: peers-keep-their-promoters
  classification: primary
  gate_class: acceptance_criterion
  question: Is promoter loss specific to dnaG?
  description: 'The 41 idx_rprotein peers'' median promoter copy number changes by less than 1.5x over
    generations 1-4.


    The discriminating control. dnaG''s peers hold their transcription steady (their synthesis RISES 1.474x
    while dnaG collapses), so if promoter loss is the mechanism they must NOT be losing promoters. If
    they lose promoters too, promoter count cannot be what distinguishes dnaG and the hypothesis is dead
    regardless of what dnaG''s own count does.


    Threshold provenance: theory. Two-sided, mirroring the equivalent control in dnag-generational-decay.'
  measure:
    kind: derived
    path: idx_rprotein peer median promoter_copy_number entering promoter_init_probs, generation 4 over
      generation 1, ppGpp unchanged
    detail: median promoter copy number across the 41 peer TUs per generation, gen4/gen1.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided so the control cannot be satisfied by the peers COLLAPSING -- the one-sided form
        of this exact control was a real defect caught in dnag-generational-decay's audit.
  status: failed
  control: negative
  result: FAIL
  measured_value: 0.4597
  evaluated_by: agent
- name: promoter-loss-explains-the-collapse
  classification: primary
  gate_class: acceptance_criterion
  question: Does promoter count account for the collapse, or only part of it?
  description: 'Decomposing dnaG''s synthesis collapse into (promoter count) x (per-promoter probability),
    the promoter-count factor accounts for at least two-thirds of the collapse in log space.


    The quantitative discriminator, and the axis most likely to REFUTE the hypothesis. dnaG''s synthesis
    falls ~3e+05-fold. A promoter count is a small integer, so unless it reaches exactly zero it cannot
    supply five orders of magnitude on its own -- and the observed floor is 1.3e-11 rather than exactly
    0, which is already evidence against the strongest form. A PASS means promoter loss is the mechanism;
    a FAIL localises the collapse to the per-promoter probability instead and sends the next study to
    the delta_prob/bound_TF term.


    Threshold provenance: theory. Two-thirds in log space is the standard for ''accounts for most of''
    used when a residual is tolerated but the factor must dominate.'
  measure:
    kind: derived
    path: log promoter_copy_number fold-change over log actual_rna_synth_prob fold-change for dnaG, decomposing
      transcript_initiation's promoter_init_probs into count x per-promoter probability, at fixed ppGpp
    detail: ratio of log-fold change in promoter count to log-fold change in synthesis, dnaG, generations
      1-4.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: 'Two-sided: below 0.67 promoter loss is not the dominant factor; above 1.5 it OVER-predicts
        the collapse, which would mean the decomposition is wrong rather than confirmed.'
  status: failed
  result: FAIL
  measured_value: 0.0633
  evaluated_by: agent
- name: dnag-promoter-count-at-generation-1
  classification: supporting
  gate_class: regression_pin
  question: How many promoters does dnaG start with, given the TU dedup?
  description: 'dnaG''s generation-1 mean promoter copy number is recorded, with the pin allowing 0 to
    8.


    POST-HOC in the sense that no value has ever been observed -- the listener has been empty on every
    timestep ever emitted -- so this is a pin that ESTABLISHES a baseline rather than defending one. It
    matters because TU00352[c] is the transcript whose three promoters (rpsUp1/2/3) the known TU dedup
    collapses into a single TU record; if dnaG carries markedly fewer promoter copies than its peers from
    the start, that is the dedup''s quantitative cost, measured for the first time.'
  measure:
    kind: derived
    path: dnaG mean promoter_copy_number at generation 1
    detail: mean promoter copy number for TU00352[c], generation 1, median over seeds.
  pass_if:
    op: <=
    value: 8
    provenance:
      kind: post_hoc
      note: No prior observation exists; a permissive pin that records a first measurement, not a gate.
  status: passed
  result: PASS
  measured_value: 2.0388
  evaluated_by: agent
