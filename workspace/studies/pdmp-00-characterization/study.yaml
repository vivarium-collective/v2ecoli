- Three media conditions (M9-glucose / M9-acetate / M9-glucose+aa) span the metabolic
  regime well enough to set downstream interface tolerances.
- "N=64 replicates per condition would put the standard error of the mean at ~12.5%\
  \ of \u03C3 (basis for the canonical target; only N=32 has run so far)."
- Per-process RNG seeding (crc32(process_name, master_seed)) is the correct fix for
  the bit-identical-ensemble bug.
