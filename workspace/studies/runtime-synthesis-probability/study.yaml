findings:
- id: F-01
  kind: computational
  status: confirms
  statement: The probability actually in force is 93x lower for the cohort (4.88e-06) than for the 294
    comparison transcripts (4.53e-04). The deficit is an ASSIGNMENT defect.
  evidence:
    from_run: runtime-synthesis-probability__sweep
    from_test: runtime-probability-is-depressed
    observed: 0.01076
  expected:
    summary: Cohort in-force probability below half the comparison median.
  provenance:
    run_ids:
    - runtime-synthesis-probability__sweep
  tier: mechanism
  summary: 'This is the decomposition the study was built for. The transcripts are

    under-supplied because the probability the process uses is itself depressed, not

    because a normal probability is being ignored.


    It also explains why four studies of static ParCa attributes found nothing: the

    in-force probability is 25x below TU00352''s own basal_prob (1.21e-04), so reading

    basal_prob was reading a number the process never uses. That was the error in

    dnag-production-deficit, and this measurement is its root cause.

    '
- id: F-02
  kind: computational
  status: contradicts
  statement: Transcripts are also drawn less efficiently than the comparison group given the probability
    in force (0.380 vs the 0.5 bar), so a secondary selection effect exists on top of the assignment defect.
  evidence:
    from_run: runtime-synthesis-probability__sweep
    from_test: realized-tracks-runtime-probability
    observed: 0.37972
  expected:
    summary: Cohort drawn at least half as efficiently as the comparison group.
  provenance:
    run_ids:
    - runtime-synthesis-probability__sweep
  tier: mechanism
  summary: 'A real but much smaller second effect. The assignment gap is ~93x; this is

    ~2.6x, so assignment dominates by more than an order of magnitude.


    The threshold is left where it was pre-registered. With only six cohort members a

    ratio of 0.380 is within reach of sampling noise, so this is recorded as a

    genuine but weakly-powered signal rather than a confident second defect -- and

    the honest reading is that it needs a larger cohort before it can carry weight.

    '
- id: F-03
