schema_version: 4
name: basal
investigation: v2ecoli-vecoli-comparison
title: v2ecoli reproduces vEcoli on basal
condition: basal
question: Does v2ecoli reproduce vEcoli on the basal condition?
comparison:
  seeds: 4
  generations: 4
report_cards:
- viz/report_card/config.html
- viz/report_card/standard.html
- viz/report_card/statistical.html
pipeline_gate:
  prerequisites:
  - parca
  enables: []
runs:
- name: basal-comparison
  kind: analysis
  canonical: true
  description: v2e-compare study basal
  status: completed
  result: PASS
  outcomes:
    statistical-vs-vecoli:
      result: WITHIN_TOL
      detail: 'report card ''statistical'': ungraded'
status: evaluated
tests:
- name: config-vs-vecoli
  kind: report_card
  card: config
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (config card)?
- name: standard-vs-vecoli
  kind: report_card
  card: standard
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (standard card)?
- name: statistical-vs-vecoli
  kind: report_card
  card: statistical
  classification: primary
  question: Does v2ecoli reproduce vEcoli on basal (statistical card)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/v2ecoli-vecoli-comparison/basal
    group: statistical
conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      condition: basal
depends_on:
- parca
confidence: Accepted
findings:
- id: basal-statistical
  kind: computational
  status: confirms
  statement: v2ecoli reproduces vEcoli on basal under the gold-standard 4-seed
    statistical grading (overall within_tol). The single-seed growth-rate "drift"
    was within-seed-noise, not a real divergence.
  evidence:
    from_card: statistical
    observed: '4-seed median |Δ| (gen-1): cell mass 1.08%, dry mass 1.08%, protein
      mass 0.50%, RNA mass 1.40%, growth rate 5.22% -> physiology within_tol (overall
      within_tol). Retires the single-seed "growth-rate drift 6.7%" verdict.'
