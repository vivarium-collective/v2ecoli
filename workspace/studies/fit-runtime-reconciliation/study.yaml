schema_version: 4
name: fit-runtime-reconciliation
title: Fit-runtime reconciliation
created: '2026-09-03'
status: complete
phase: Decide
study_type: diagnostic
investigation: transcription-rewiring
question: ParCa's fitted DnaG count implies a transcription rate 6.85x higher than the ppGpp runtime delivers. Is that disagreement specific to dnaG or general across the transcriptome, and is it explained by ParCa fitting against basal_prob while the runtime transcribes according to the ppGpp-adjusted vector?
biological_summary: 'This is the last open defect in the chain. Eight studies established that the

  initiation gate stalls the lineage, DnaG is the limiting pool, its sole

  transcript is barely made, and the protein shortfall follows quantitatively

  from the transcription deficit with no missing mechanism. What remains is that

  ParCa and the running model disagree about how much dnaG should be transcribed.


  Two facts frame the question. probability-in-force-reference showed the cache''s

  basal_prob is not the vector the runtime uses: ppgpp_regulation is on by

  default and TranscriptInitiation substitutes a ppGpp-adjusted vector, which for

  dnaG differs from basal_prob by roughly fourfold. dnag-protein-mass-balance

  then showed ParCa''s fitted count implies 6.85x more transcription than the run

  delivers. If ParCa fits against basal_prob while the runtime transcribes

  according to the replacement, the two would disagree by exactly the ratio

  between those vectors, and the defect would be structural rather than specific

  to any gene.


  That framing makes one question decisive before any other: whether the

  disagreement is dnaG-specific or transcriptome-wide. A global mismatch means

  the fit and the runtime are systematically misaligned and dnaG is merely where

  it became visible -- the same shape as every earlier stage of this

  investigation, where a quantity that looked DnaG-specific turned out to be a

  property of how the model is wired. A dnaG-specific mismatch means something

  particular to this transcript.


  The study is built so the global answer is reachable, because it is the one

  that would generalise the defect well beyond replication, and because this

  investigation has repeatedly found the general explanation after first

  believing the specific one.

  '
assumptions:
- text: ParCa's fitted monomer counts imply a transcription rate recoverable by inverting the same mass balance that dnag-protein-mass-balance validated against 200 held-out control proteins.
  verified_in_v2ecoli: true
- text: The ppGpp-adjusted vector recovered by building the composite is the one TranscriptInitiation consumes at runtime.
  verified_in_v2ecoli: false
pipeline_gate:
  prerequisites:
  - study: dnag-protein-mass-balance
    condition: tests-passed
    relation: leads-to
    outputs_used:
    - The 6.85x implied-vs-delivered transcription discrepancy for dnaG
    - The mass balance validated at 74.5% on held-out controls
  - study: probability-in-force-reference
    condition: tests-passed
    relation: model-input
    outputs_used:
    - The recovered in-force ppGpp vector and its divergence from basal_prob
  enables: []
  proceed_condition: The disagreement is characterised as global or dnaG-specific, and either attributed to the basal-versus-ppGpp substitution or shown to need another explanation.
  gate_evaluator:
    result: failed
    blocked_by:
    - population-discrepancy-tracks-vector-ratio
    evaluated_by: code
    diverges_from_authored: false
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants: []
  model_settings: []
baseline:
- name: baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []
units_and_time:
  tick: 1 tick = 1 s of simulated time (composite time_step=1)
  quantities:
    implied transcription rate: transcripts per second, from inverting the mass balance at ParCa's fit
    delivered transcription rate: transcripts per second, measured from the run
    discrepancy: implied divided by delivered, dimensionless
behavior_tests:
- name: discrepancy-is-dnag-specific
  classification: primary
  gate_class: acceptance_criterion
  question: Is the fit-runtime disagreement particular to dnaG, or transcriptome-wide?
  description: 'dnaG''s implied-over-delivered ratio is at least 3x the population median across transcripts with a measurable rate.

    The decisive axis, and the one whose failure is more interesting than its pass. A FAIL means the fit and the runtime are systematically misaligned across the transcriptome and dnaG is merely where it became visible -- which would generalise the defect well beyond replication and would match the shape of every earlier stage of this investigation.

    Threshold provenance: theory. 3x separates a gene-specific outlier from a population-wide offset without assuming the offset''s size; nothing is cited for it.'
  measure:
    kind: derived
    detail: dnaG's implied/delivered ratio divided by the median implied/delivered ratio over all transcripts with a non-zero delivered rate.
  pass_if:
    op: '>='
    value: 3.0
    provenance:
      kind: theory
      note: Separates a gene-specific outlier from a population-wide offset.
  status: pending
- name: basal-vs-ppgpp-substitution-explains-it
  classification: primary
  gate_class: acceptance_criterion
  question: Is the gap just the ratio between the two probability vectors?
  description: 'For dnaG, the implied-over-delivered ratio agrees with the basal_prob-over-ppGpp-vector ratio within a factor of 2.

    The mechanistic hypothesis. If ParCa fits against basal_prob while the runtime transcribes according to the ppGpp-adjusted replacement, the two should disagree by precisely the ratio between those vectors. A PASS attributes the whole defect to that substitution and makes the repair obvious: fit and run against the same vector.

    A FAIL means the substitution accounts for only part of it and something else contributes, which would be a genuinely new finding rather than a restatement.

    Threshold provenance: theory. A factor of 2 is loose enough to tolerate the mass-balance approximation, which was validated only to 74.5% within 2x, and tight enough that an unrelated cause would not pass.'
  measure:
    kind: derived
    detail: ratio of (dnaG implied/delivered) to (dnaG basal_prob / dnaG ppGpp vector), expressed as max(r, 1/r).
  pass_if:
    op: <
    value: 2.0
    provenance:
      kind: theory
      note: Matches the mass balance's own demonstrated precision.
  status: pending
- name: population-discrepancy-tracks-vector-ratio
  classification: primary
  gate_class: acceptance_criterion
  question: Does the same explanation hold across the transcriptome?
  description: 'Across transcripts with a measurable rate, the correlation between log(implied/delivered) and log(basal_prob/ppGpp vector) is at least 0.5.

    Generalises the mechanistic axis from one gene to the population. A strong correlation would show the substitution drives the disagreement everywhere, not just where it was noticed, and would make this a single structural defect rather than a collection of per-gene accidents.

    Threshold provenance: theory. 0.5 is a moderate correlation, chosen because the mass balance is approximate and per-transcript noise is expected; requiring more would penalise the instrument rather than test the claim.'
  measure:
    kind: derived
    detail: Pearson correlation of log(implied/delivered) against log(basal_prob / ppGpp vector) over transcripts with non-zero delivered rate and positive vectors.
  pass_if:
    op: '>='
    value: 0.5
    provenance:
      kind: theory
      note: Moderate bar; the balance is approximate and noise is expected.
  status: pending
- name: balance-still-predicts-controls
  classification: control
  gate_class: acceptance_criterion
  question: Is the inverted balance still trustworthy here?
  description: 'The mass balance predicts at least 70% of control monomers within a factor of 2, as it did in dnag-protein-mass-balance.

    Instrument check. Every quantity in this study is derived by inverting that balance, so if it has stopped working under this study''s conditions no axis is interpretable. Carried forward deliberately: in the predecessor study an earlier, dimensionally-wrong balance scored 0% on this control and that is the only reason the error was caught.

    Threshold provenance: identical to the predecessor''s, for comparability.'
  measure:
    kind: derived
    detail: fraction of control monomers predicted within a factor of 2.
  pass_if:
    op: '>='
    value: 0.7
    provenance:
      kind: theory
      note: Same bar as dnag-protein-mass-balance, for direct comparability.
  status: pending
- name: dnag-discrepancy-remains-near-7x
  classification: supporting
  gate_class: regression_pin
  description: 'dnaG''s implied-over-delivered ratio remains between 3x and 15x.

    POST-HOC: measured at 6.85x in dnag-protein-mass-balance. A pin so a change that alters the figure this study is built on is noticed here.'
  measure:
    kind: derived
    detail: dnaG implied/delivered transcription rate.
  pass_if:
    op: <
    value: 15.0
    provenance:
      kind: post_hoc
      note: Measured in the predecessor study; pin only.
  status: pending
preregistered:
  declared_before_runs: true
  registered_at: '2026-09-03T19:22:37Z'
  criteria:
  - test: discrepancy-is-dnag-specific
    prior: Open. A failure would mean the fit and runtime are systematically misaligned transcriptome-wide and dnaG is merely where it showed.
  - test: basal-vs-ppgpp-substitution-explains-it
    prior: Open. A pass attributes the defect to fitting and running against different probability vectors.
  - test: population-discrepancy-tracks-vector-ratio
    prior: Open. Generalises the mechanism from one gene to the transcriptome.
  - test: balance-still-predicts-controls
    prior: The instrument check; a failure voids every other axis.
  predictions:
  - 'CARRIED IN as pins, measured in prior studies and not re-derived here: dnaG''s implied/delivered discrepancy is 6.85x; its transcription deficit against the in-force reference is 5.40x; the ppGpp vector differs from basal_prob by a median |log ratio| of 0.683 across the top 300.'
  - 'NOT computed at design time: the population distribution of the implied/delivered ratio, its correlation with the vector ratio, or dnaG''s position within that distribution.'
  thresholds:
    discrepancy-is-dnag-specific:
      op: '>='
      value: 3.0
      provenance:
        kind: theory
        note: Separates a gene-specific outlier from a population-wide offset.
    basal-vs-ppgpp-substitution-explains-it:
      op: <
      value: 2.0
      provenance:
        kind: theory
        note: Matches the mass balance's own demonstrated precision.
    population-discrepancy-tracks-vector-ratio:
      op: '>='
      value: 0.5
      provenance:
        kind: theory
        note: Moderate bar; the balance is approximate and noise is expected.
    balance-still-predicts-controls:
      op: '>='
      value: 0.7
      provenance:
        kind: theory
        note: Same bar as dnag-protein-mass-balance, for direct comparability.
readouts:
- name: delivered-transcription-rate
  store_path: listeners.transcript_elongation_listener.count_rna_synthesized
  description: Per-TU synthesis, giving the rate the model actually delivers.
  units: transcripts per second
  status: available
- name: monomer-counts
  store_path: listeners.monomer_counts
  description: Total per-monomer protein, the observable the mass balance is calibrated against. Verified populated in dnag-protein-mass-balance.
  units: copies per cell
  status: available
- name: in-force-probability-vector
  store_path: derived
  description: The ppGpp-adjusted vector, recovered by building the composite and reading the resolved synth_prob off the constructed PpgppInitiation step. Not emitted; see probability-in-force-reference for why emitting it is not an option.
  units: dimensionless
  status: derived-needed
planned_runs:
- name: reuse-silent-tu-sweep
  status: complete
  n_steps: 0
  details: No new simulation. Reuses the 3 seed x 3 generation sweep, which carries both required listeners.
