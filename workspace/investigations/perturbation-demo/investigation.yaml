schema_version: 4
name: perturbation-demo
title: "Perturbation demo \u2014 gene knockouts and media shifts on the baseline whole\
  \ cell"
question: How do you apply a gene knockout or a media change to the v2ecoli baseline,
  minimally?
executive:
  what_is_this: "A minimal, self-contained demonstration of the two lightweight perturbation\n\
    levers built directly into the `baseline` composite. Both reuse the existing\n\
    ParCa cache \u2014 no re-fit \u2014 so each perturbation is a one-line variant:\n\
    \n  - `knockouts`: translation-level gene knockouts. Each named gene's\n    translation\
    \ efficiency is zeroed on the cached polypeptide-initiation\n    config, so no\
    \ protein is made \u2014 a functional knockout with no ParCa\n    re-fit. (Folded\
    \ in from the former KO_baseline composite.)\n  - `media`: an in-cache media shift.\
    \ The environment's initial media_id is\n    set to any condition in the cache's\
    \ saved_media, so the media_update step\n    moves the cell onto that condition\
    \ on the first tick and metabolism\n    responds (e.g. amino-acid-rich media grows\
    \ faster).\n\nThe single study `ko-and-media` runs the wild-type baseline against\
    \ a lacY\nknockout and an amino-acid-rich medium, side by side. This is a starting\n\
    point / how-to for perturbing the whole cell \u2014 not a rigorous result. For\
    \ a\nrigorously-calibrated media condition, run a per-condition ParCa cache\n\
    instead (see the v2ecoli-vecoli-comparison investigation's succinate study).\n"
members:
- ko-and-media
