  expected: generation time within 50% of control.
  observed: ''
  result: PENDING
limitations:
- Only 9 of the model's 23 TFs have positioned sites in the export, so 14 -- including crp, arcA and hns
  -- keep their cistron-content assignment. This is a PARTIAL fix by construction, and the network it
  produces is a hybrid of two attribution schemes.
- The export gives site positions but no mechanism, so activation by looping or action on an upstream
  promoter would be misassigned. Marked a high-risk assumption.
- Remapping without refitting leaves alphas calibrated for the old attribution. Adequate to test the mechanism,
  not shippable.
- The rpsUp3-to-TU00435 identification underpinning the whole study is an inference from a site-name offset
  (0.5 bp agreement), not a declared mapping. The outstanding Pathway Tools licence would supply regulation.dat
  and settle it directly.
- 'Even a full rescue would show promoter-specific attribution is SUFFICIENT here, not that the other
  three defects are harmless: the constraint boundary, the dedup and the 2.13x activator residual all
  remain.'
- Phase B was not run because the disruption control failed, so this study says nothing about whether
  removing the LexA edge would rescue the lineage. That remains untested.
claim: The promoter-specific rule removes the LexA edge that silences dnaG, exactly as predicted -- but
  strips 89.5% of the adjudicated network, so it cannot be applied generally from this data.
conclusion: 'Phase A settles the approach without a simulation, and the answer is a qualified no.

  The rule works where it was aimed: applied uniformly, with no special-casing and stated in full beforehand,
  it removes the LexA edge on TU00352 -- the prediction recorded before running -- and adjudicates 93%
  of the edges it can reach.

  But the disruption control FAILS at 0.1049 against a band of [0.65, 1.0]: it strips 89.5% of adjudicated
  edges. That is a different model, not a correction, and any Phase B rescue would have been uninterpretable.
  Phase B is not run.

  The cause is diagnosed and is not the tolerance -- distances are bimodal, p10 = 0.5 bp against p50 =
  14376 bp, and loosening the window a hundredfold barely moves retention. Two readings survive: the model''s
  assignments are largely unsupported, or the export is incomplete and the rule strips real regulation
  where a site is missing. The bimodality and the coverage both favour incompleteness, and this file cannot
  settle it. Presenting the 89.5% as evidence against the model would be the wrong conclusion from an
  absence.

  dnaG is unaffected by that ambiguity, because its evidence is a PRESENT site matching TU00435 to 0.5
  bp rather than a missing one. So a TARGETED correction at this locus is supported by the data; a network-wide
  one is not, and needs the complete regulation table the outstanding Pathway Tools licence would provide.'
confidence: Refuted
attribution_rule:
  recorded_at: '2026-09-04T20:15:00Z'
  recorded_before_applying: true
  rule: '1. PARSE. For each binding site whose name states ''N bases upstream|downstream of <promoter>'',
    compute the promoter''s TSS as site_centre - N (downstream counted positive, upstream negative). site_centre
    = (Left+Right)/2.

    2. MATCH. An edge (TF, TU) is RETAINED iff that TF has at least one such site whose implied TSS lies
    within +/-5 bp of the TU''s start coordinate.

    3. REMOVE. An edge is REMOVED iff the TF has at least one positioned, offset-stating site somewhere
    in the genome but none matching that TU''s start.

    4. ABSTAIN. An edge is UNADJUDICATED and left EXACTLY as the model has it iff the TF has no positioned,
    offset-stating site at all. This covers the 14 of 23 model TFs absent from the export.

    5. UNIFORM. Applied to every covered TF with no special-casing of dnaG, LexA or the rpsU-dnaG-rpoD
    locus.'
  tolerance_justification: +/-5 bp accommodates the half-base offsets EcoCyc states (e.g. '4.5 bases downstream')
    and coordinate rounding between the two artefacts. It is a factor of four smaller than the 22.5 bp
    gap to the nearest non-matching TU at the dnaG locus, so it discriminates rather than absorbs.
  rejected_alternative: A COORDINATE-WINDOW rule was tried first and REJECTED, and the rejection is the
    honest part. The window was derived BLIND from the distribution of stated offsets across 2576 sites
    with the dnaG locus EXCLUDED, giving a central-95% range of -297.8 to +117.2 bases, i.e. [-300, +120].
    Applied to the dnaG locus that window RETAINS the LexA edge on TU00352, whose site sits at +83 --
    unremarkable against a median offset of -49.8. So a positional window cannot discriminate here, and
    had I picked a plausible-looking narrow window instead of deriving one, I would have got the answer
    I wanted for the wrong reason. The name-based rule uses EcoCyc's own attribution instead of re-deriving
    it from coordinates.
  coverage: 59.2% of the 4356 sites state an offset from a named promoter (TSS computable); a further
    11.6% name a promoter without an offset (promoter known, TSS not, so unadjudicable under this rule);
    29.2% name no promoter.
  predictions:
  - The LexA edge on TU00352 is REMOVED; TU00435 would match if it existed in the model, but the dedup
    discarded it, so dnaG's surviving TU ends with NO LexA edge and is unrepressed.
  - TU00434, at 22.5 bp from the implied TSS, does NOT match -- so even restoring it would not carry LexA
    under this rule. That contradicts what I assumed when scoping tu-dedup-promoter-collapse.
  - Most edges should be unchanged, because most TUs have a single promoter and the two attribution schemes
    then agree. If the rule removes most of the network it is disruptive and axis 3 fails.
runs:
- name: promoter-specific-regulation__phase-A
  status: complete
  canonical: false
  started_at: '2026-09-04T20:45:00Z'
  started_at_iso: '2026-09-04T20:45:00Z'
  note: 'PHASE A ONLY -- static attribution, no cache edit and no simulation. The rule and its rejected
    coordinate-window alternative were committed (0468efcf) BEFORE any edge was re-attributed. Phase B
    is NOT run and will not be: the disruption control failed.'
  outcomes:
    attribution-rule-adjudicates-most-covered-edges: &id001
      result: PASS
      measured_value: 0.9327
      evaluated_by: agent
      operator: derived/band [0.7, 1.0]
      gate_class: acceptance_criterion
      detail: 610 of the 654 edges whose TF has positioned, offset-stating sites were adjudicated (0.9327);
        44 failed only because the TU had no usable start coordinate. 808 further edges abstained because
        their TF is absent from the export. Adjudication is feasible.
    misattributed-lexa-edges-are-removed: &id002
      result: PASS
      measured_value: 1.0
      evaluated_by: agent
      operator: derived/band [0.99, 1.0]
      gate_class: acceptance_criterion
      detail: The rule, applied uniformly and with no special-casing, REMOVES the LexA edge on TU00352
        -- the outcome predicted before it was run. 28 of LexA's 40 adjudicated edges are removed. The
        rule reproduces the judgement the EcoCyc coordinates imply without having been built to.
    most-edges-are-unchanged: &id003
      result: FAIL
      measured_value: 0.1049
      evaluated_by: agent
      operator: derived/band [0.65, 1.0]
      gate_class: acceptance_criterion
      detail: 'THE CONTROL FIRES, decisively. Only 10.5% of adjudicated edges are retained; the rule strips
        89.5% of them. That is not a correction, it is a different model, and it voids any rescue Phase
        B could have produced -- exactly the failure mode this axis was carried over from ppgpp-off-rescue
        to catch.

        The cause is diagnosed and is NOT the tolerance. Distances are BIMODAL: p5 and p10 are 0.5 bp
        while p25 is 1568 bp, p50 is 14376 bp and p75 is 103123 bp. Loosening the tolerance from 5 bp
        to 500 bp moves retention only 0.1049 -> 0.1770. So a tenth of edges match a site exactly and
        the rest have no site of that TF anywhere near them.'
    lexa-site-position: &id004
      result: PASS
      measured_value: 3210729
      evaluated_by: agent
      operator: derived/<= 3210729
      gate_class: regression_pin
      detail: LexA's site at the locus reads 3210729-3210749 as recorded.
  computed_outcomes:
    attribution-rule-adjudicates-most-covered-edges: *id001
    misattributed-lexa-edges-are-removed: *id002
