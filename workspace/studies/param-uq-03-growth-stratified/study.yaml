conclusion_verdicts:
  - claim: "Elongation-knob influence on growth is stage-dependent across the cell cycle."
    verdict: supported
    basis: "Per-θ-bin Sobol across a full-lineage n=24 ensemble: basal_elongation_rate across-stage range 0.47, kS range 0.43 — both far above the 0.1 stage-dependence threshold. Sensitivity is decisively non-uniform across θ."
  - claim: "The dominant growth-rate knob HANDS OFF mid-cycle: basal_elongation_rate leads the early cycle, kS the mid-late cycle."
    verdict: supported (preliminary)
    basis: "basal dominates θ 0.0–0.5 (peak 0.78 at θ≈0.15); kS dominates θ 0.5–0.8 (peak 0.58); the curves cross near θ≈0.5, smoothly anti-correlated. Robust as a ranking/handoff; absolute magnitudes preliminary (decoy leaks at n=24)."
  - claim: "The replication knob (chrom basal_elongation_rate) contributes materially at any cell-cycle stage."
    verdict: not_supported
    basis: "chrom stays ≤0.24 across all θ-bins (across-stage range 0.19), with only a mild mid-cycle bump within the decoy noise band — not distinguishable from null at this budget."
  - claim: "The θ-binned decomposition is quantitatively resolved (adversarial-null passes)."
    verdict: refuted (preliminary)
    basis: "The inert decoy leaks 0.06–0.32 (population 0.19 > 0.05 null) despite low PCE test error (~3–9%): growth's total variance is modest, so the Sobol attribution is not clean at n=24. Absolute magnitudes + by-seed argmax (which flips) are not converged; the stage-dependence + handoff are above the noise floor."
  - claim: "PR #505 makes config_overrides survive cell division (both generations perturbed)."
    verdict: supported
    basis: "Validated on the mini: at the same seed, gen-2 daughter growth is 0.000213 at basal=15 vs 0.000251 at basal=28 (18% swing, directionally correct). Without the fix, gen-2 would revert to the cached default and show no knob dependence."

