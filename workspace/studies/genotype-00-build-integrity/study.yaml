schema_version: 4
name: genotype-00-build-integrity
investigation: genotype-perturbation-response
title: Does a ParCa-level knockout reconstruct into a self-consistent sim_data?
created: '2026-08-04'

# Canonical 6-axis status. Designed and specified; NOT implemented. The genotype can
# now be DECLARED (v2ecoli#457), but the knockout's manifest cannot yet be PRODUCED --
# the ecoli-sources KO generator does not exist. See model_settings.
design_status: complete
implementation_status: not_started
expert_review_status: not_requested

question: >-
  When a gene is deleted from the chromosome and the ParCa is rebuilt on the perturbed
  genome, does the resulting sim_data stay self-consistent? Concretely: is every retained
  feature's sequence exactly what it should be, does the feature inventory change by
  exactly the expected amount, does every coordinate still lie inside the shortened
  chromosome, and does the fit converge with its parameters in range - before any
  physiological reading is attempted.

# --- Why this study exists, and why it is graded when the rest of the
# --- investigation is descriptive -------------------------------------------
#
# Correctness of the coordinate transform itself is NOT this study's job. That is
# pytest over a pure function (tests/test_parca_gene_deletion.py, v2ecoli#455) --
# the study `tests:` vocabulary has no operator that can express "a feature at
# 450-550 truncates to 450-499", and the check needs no run.
#
# What the unit tests cannot reach is the layer above: a genotype built end to end
# through the generator and ParCa, on the real chromosome, where operon structure
# makes overlapping and nested features ordinary rather than hand-picked. That
# needs a build, grades continuous quantities, and is what generalizes to a
# genome-wide panel. It is also the layer where an error is most expensive,
# because everything downstream reads sim_data as ground truth.

assumptions:
  - text: >-
      A ParCa build is deterministic given its inputs, so the same genotype bundle
      reconstructs to the same sim_data. This is what lets a manifest hash serve as the
      genotype identity and lets builds be cached rather than repeated.
    verified_in_v2ecoli: false
  - text: >-
      ★ The round-trip invariant must be TWO-BRANCH, and the obvious one-branch form is
      vacuous for the defect it most needs to catch. "Every retained feature's sequence is
      unchanged" is wrong twice: features straddling the deletion are SUPPOSED to lose those
      bases, and once that is relaxed the check still cannot see an off-by-one splice,
      because an off-by-one preserves every length. The working form asserts byte-identity
      only for features whose length is unchanged, and for shrunk features asserts the
      sequence equals the original with exactly the deleted span excised.
    verified_in_v2ecoli: true # tests/test_parca_gene_deletion.py, v2ecoli#455
  - text: >-
      Coordinates in the EcoCyc-derived flat files are 1-based INCLUSIVE - a feature spanning
      [L, R] occupies genome_sequence[L-1:R]. Verified two ways: getter_functions.py:194
      slices exactly that way, and of 174 '+'-strand genes 157 start with ATG under that
      reading versus 0 under the 0-based one. Load-bearing, because feature LENGTHS stay
      correct under an off-by-one while the sequence silently shifts.
    verified_in_v2ecoli: true
  - text: >-
      A knockout that fails to build is a RESULT, not a failed study. For an essential gene
      the ParCa fit may not converge at all, which is a legitimate and informative outcome
      qualitatively unlike the translation-level knockout's. The tests below are written so
      that a non-converging fit is recorded rather than treated as infrastructure failure.
    verified_in_v2ecoli: false

conditions:
  baseline:
    # The build-ParCa study pattern (cf. showcase-1-parca): the object being built IS
    # the composite. NOTE that showcase-1-parca additionally passes `mode: full`, which
    # the generator does NOT accept; that study carries an allowlisted
    # params-are-generator-accepted failure. Not copied here.
    #
    # `bundle_manifest` is the genotype declaration, landed in v2ecoli#457. Empty
    # string is not a placeholder: it is the generator's documented way of naming the
    # installed default bundle, i.e. THIS BUILD IS THE WILD TYPE. Stated explicitly
    # rather than omitted, so the baseline asserts its genotype instead of inheriting
    # one by default.
    composite: v2ecoli.composites.parca.parca
    params:
      cpus: 8
      cache_dir: out/cache-genotype-00-wt
      bundle_manifest: ''
  variants:
    - name: single-gene-knockout
      role: perturbation
      composite: v2ecoli.composites.parca.parca
      params:
        cpus: 8
        cache_dir: out/cache-genotype-00-ko
        # The knockout's own manifest. Left empty ONLY because the generator that
        # emits it does not exist yet (see the ko-generator gate below) -- not because
        # this build is wild type. Until it carries a real path this variant is still
        # indistinguishable from its baseline, so the study remains unrunnable; the
        # difference from before #457 is that the gap is now a missing VALUE rather
        # than a missing mechanism.
        bundle_manifest: ''
      perturbation: >-
        ParCa-level knockout - the gene is spliced out of the chromosome before
        reconstruction, so downstream coordinates shift and the fit sees a genome without it.
      expected_contrast: >-
        The chromosome is shorter by exactly the gene's length; the gene is absent from
        sim_data rather than present at zero abundance; features straddling the deletion are
        truncated; every other feature's sequence is untouched. Physiology is deliberately
        NOT read here.
  model_settings:
    # The genotype-identity gate that stood here is GONE, resolved by v2ecoli#457: the
    # parca generator now accepts bundle_manifest / bundle_overrides, so the genotype is
    # declared in conditions.*.params above rather than described as a missing capability
    # here. InitializeStep additionally cross-checks the declared manifest against the
    # bundle the injected raw_data was actually built from, and warns on mismatch -- so a
    # sim_data can no longer be silently attributed to a genotype it was not built from,
    # which is the provenance claim every study below rests on.
    #
    # What #457 does NOT buy, stated so the remaining gates are read correctly: the
    # declaration is structural. Naming a manifest does not make the runner build from it
    # -- that needs the study runner to drive ParCa, explicitly out of scope there.
    - name: target-gene
      gate: satisfied
      detail: >-
        SATISFIED - first target is EG10526 (lacY), and it builds: a fast-mode ParCa on the
        lacY knockout bundle completed all 9 steps in 104 s, exit 0, with
        mechanistic_fit_status ok for supply, export and uptake (2026-08-13, main @
        60f3e4b8). The 7-8 dangling references the generator leaves by design (D17) did not
        break the build.

        Rationale for the choice, unchanged: EG10526 is the gene the landed
        translation-level study
        (ko-and-media) already uses, so the two knockout mechanisms share a reference point,
        and it sits inside the lac operon, which exercises the straddling-feature branch of
        the round-trip invariant. On the real KB a lacY deletion truncates one transcription
        unit and shortens four others. A non-operonic gene would leave the second branch of
        the invariant untested.
    - name: effective-build-from-the-declared-manifest
      gate: satisfied
      detail: >-
        SATISFIED by v2ecoli#482, verified 2026-08-13 on main @ 60f3e4b8. Declaring a
        genotype is not the same as building from it, and until #482 it was not:
        step_01_initialize.py warned "the fit will proceed against the injected raw_data;
        the declared manifest is provenance only", so a run would have built the wild type
        and merely noted a mismatch.

        #482 added _resolve_raw_data(): when no KnowledgeBaseEcoli is injected it builds
        one, honouring the declared bundle_manifest via SourceBundle(base_manifest=...).
        The chain is parca generator param -> _build_step_slots -> step_01_initialize.py
        -> SourceBundle. The v2ecoli-parca CLI honours the same manifest. The residual
        warning now fires only when an INJECTED raw_data disagrees with the declaration,
        which is a mismatch alarm rather than a statement that declaration is inert.

        Verified against a real lacY (EG10526) knockout bundle: genome spliced by exactly
        1254 bp (the 361926-363179 span), the gene tombstoned with null coordinates, all
        downstream features shifted by exactly 1254.

        Something must construct raw_data FROM the declared manifest when a study runs.
        Verified 2026-08-07 that v2ecoli#468 did NOT close this - that PR fixed override
        precedence inside SourceBundle (a variant's generated key now wins over
        parca_overrides) and touched only sources.py plus its tests. Both are needed and
        neither substitutes for the other: #468 makes a variant's files survive once you
        build from them; this gate is about building from them at all.

        Recorded as its own gate because a reader scanning this list would otherwise
        conclude the KO generator is the last blocker on the build path, and it is not.
    - name: ko-generator
      gate: satisfied
      detail: >-
        SATISFIED. The ecoli-sources KO generator that emits the perturbed bundle +
        manifest landed as ecoli-sources#12 and is reachable from v2ecoli: the pin in
        pyproject.toml moved to rev 2dfabd52 in v2ecoli#471. Merging in ecoli-sources does
        not make code reachable from v2ecoli until the pin moves, so both halves were
        required.

        This study was its acceptance target, and the generator passes it: knockout()
        writes the six coupled canonical keys and compose_variant_bundle() produces a
        manifest that ParCa builds from (see the effective-build gate above).

report_cards:
  - genotype_build_integrity

# The card generates its own knockout bundle and builds raw_data for both arms, so
# the four structural axes need no ParCa run. `mode` and `parca_state` are omitted
# deliberately: without a built state the fit axes stay UNGRADED, which is the honest
# outcome. Supply a full-mode parca_state to grade them - a fast-mode state must not
# be graded (see the run-mode limitation).
report_card_refs:
  genotype_build_integrity:
    gene_ids:
      - EG10526

inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir

tests:
  - name: perturbed-genome-reconstructs-without-coordinate-or-sequence-corruption
    classification: primary
    question: >-
      After the deletion, is every retained coordinate-bearing feature's sequence exactly
      what it should be?
    measure:
      kind: derived
      detail: >-
        Two-branch round-trip over all coordinate-bearing features (genes, transcription
        units, DNA sites; ~12.8k on the real KB). Unchanged length ⇒ sequence must be
        byte-identical to the wild-type read. Shrunk ⇒ sequence must equal the wild-type
        read with exactly the deleted span excised. Report the count in each branch as well
        as the corruption count, so a pass cannot be vacuous - zero shrunk features means
        the second branch was never exercised and the target gene was a poor choice.
    pass_if:
      op: '=='
      value: 0   # corrupted features

  - name: chromosome-length-changes-by-exactly-the-deleted-span
    classification: supporting
    question: Does the genome shorten by exactly the gene's length, no more and no less?
    measure:
      kind: derived
      detail: >-
        len(wild_type.genome_sequence) - len(knockout.genome_sequence), against
        right_end_pos - left_end_pos + 1 for the target gene. Note this check is NOT
        sufficient on its own: an off-by-one splice preserves length exactly, which is why
        the round-trip test above is the primary and this is supporting.
    pass_if:
      op: '=='
      value: 0   # discrepancy between observed and expected shortening

  - name: all-coordinates-stay-within-the-shortened-chromosome
    classification: supporting
    question: >-
      Does every surviving feature satisfy 1 <= left <= right <= genome_length after the
      shift?
    measure:
      kind: derived
      detail: >-
        Count features violating the bound, across genes, transcription units and DNA sites.
        Catches a shift applied in the wrong direction or to the wrong side of the cut.
    pass_if:
      op: '=='
      value: 0   # out-of-range features

  - name: deleted-gene-is-functionally-absent-from-sim_data
    classification: primary
    question: >-
      Is the gene excluded from the transcribed and translated sets, rather than still
      being expressed at some level?
    measure:
      kind: derived
      detail: >-
        Membership of the deleted gene in the two sets the knowledge base uses to mean
        "on the chromosome": valid_gene_ids (getter_functions.py, genes with positions
        that are not pseudogenes/phantom genes) and all_mRNA_cistrons (translation.py).
        Expect exclusion from both.

        ★ NOT id-absence. The knockout TOMBSTONES the deleted gene - it nulls the
        coordinates and keeps the row - so the gene id legitimately persists in `genes`
        and in sim_data.process.replication.gene_data. An axis asserting the id appears
        nowhere would FAIL ON CORRECT BEHAVIOUR, which is the mirror image of a vacuous
        test and just as useless.

        The tombstone is the KB's existing vocabulary for "not on the chromosome" - 21
        of 4,747 shipped genes are permanently in that state - and both sets above
        already filter on exactly that null-coordinate check. Removing the row instead
        would leave a dangling cistron, since the deletion does not touch rnas/proteins.

        Functional absence is also the claim that actually distinguishes this from a
        translation-level knockout, which leaves the gene transcribed and consuming RNAP
        capacity. So this axis now tests the mechanism rather than a proxy for it.
    pass_if:
      op: '=='
      value: 0   # memberships remaining across valid_gene_ids + all_mRNA_cistrons

  - name: parca-fit-completes-and-fitted-parameters-stay-in-range
    classification: primary
    question: >-
      Does the fit converge on the perturbed genome, and do its fitted parameters - the
      mechanistic amino-acid supply kcats in particular - stay in a plausible range?
    measure:
      kind: derived
      detail: >-
        Condition count fitted, cache-bundle artifact presence, and the fitted AA-supply
        kcats against their wild-type values. RFC-007 flags ParCa-level changes as
        interacting with mechanistic amino-acid supply parameter fitting, and Riley
        identified this as the specific un-stress-tested area; genotype-03 probes it with
        AA-pathway genes, and this axis is the general build-time detector. A
        non-converging fit is RECORDED as the outcome, not treated as a broken study - for
        an essential gene it may be the correct answer.

        Count fitted conditions as len(cell_specs), NOT len(conditions). Measured
        2026-08-13 on main @ 60f3e4b8: a fast-mode build has conditions = 51 but
        cell_specs = 7 (basal, with_aa, acetate, succinate, no_oxygen, and the two
        CPLX-125 arms). `conditions` is the full condition LIST and reads 51 in both
        modes, so an axis implemented against it would pass at 51 on a fast build and
        never discriminate. cell_specs holds the conditions actually fitted, which is the
        quantity this axis means.

        Mode is therefore load-bearing and must be recorded with any result from this
        axis. See the run-mode limitation below.
    pass_if:
      op: in_range
      # Band deliberately unset: what counts as an in-range kcat shift is exactly what the
      # first builds will tell us. Setting it now would be a guess wearing a number.

readouts:
  - name: feature-sequence-round-trip
    status: derived-needed
    description: >-
      Per-feature comparison of wild-type vs knockout sequence at the feature's own
      coordinates, bucketed by unchanged-length / shrunk / removed.
  - name: chromosome-length
    status: derived-needed
    description: Genome length before and after the deletion.
  - name: feature-inventory
    status: derived-needed
    description: >-
      Counts of genes, transcription units and DNA sites before and after.

      DNA sites are counted EXCLUDING ids matching `G0-DNAA-*`. Those 13 rows
      (oriC and dnaA-promoter DnaA boxes) are supplied by v2ecoli's
      `flat_overrides/dna_sites.tsv`, not by the ecoli-sources base table. A
      knockout variant generates the `dna_sites` key, and a generated key takes
      precedence over the whole-file override (v2ecoli#466/#468), so the 13 rows
      are absent from every knockout build. The count therefore falls by 13
      regardless of which gene is deleted - measured identical for lacY
      (EG10526), pgi (EG10702) and tpiA (EG11015) - which makes it a constant
      property of the build path, not an effect of the perturbation. Including
      them would attribute a fixed -13 offset to the knockout.

      The exclusion keeps this readout measuring what it claims to measure. It
      does not address the absence itself, which is tracked separately and is
      out of scope for this study.
  - name: deleted-gene-set-membership
    status: derived-needed
    description: >-
      Whether the deleted gene appears in valid_gene_ids and in all_mRNA_cistrons, plus
      the tombstone's own state (row present, coordinates null). Reported together so a
      pass is legible: the id SHOULD still be found in `genes`, and SHOULD NOT be found
      in either functional set.
  - name: fitted-aa-supply-kcats
    status: derived-needed
    description: >-
      Mechanistic amino-acid supply kcats from the fitted sim_data, knockout vs wild type.

# No `report_cards:` declaration yet, deliberately. The build-integrity card does not
# exist, and on the Gen-2 path `report_cards:` is a NAME-membership eligibility test
# (flush.py + report_cards/__init__.py), so listing a card here would assert that a
# renderable card exists. Following the precedent set by
# metabolism-biomass-yield-s1-diagnostic: declaring a card we cannot render would be a
# false claim. Add the name once the card is authored.
#
# Two upstream seams to expect when that happens:
#   - the Gen-2 flush writes <study>/viz/report_card/<name>.verdict.json while the
#     report_card_axis evaluator reads <card_dir>/report_card_verdict.json, so the
#     card -> acceptance-criteria join needs a duplicate or symlink;
#   - 10 studies on main list HTML PATHS in report_cards:, which silently disables
#     Gen-2 for them. Use names here.

model_change: >-
  None to the simulation. The change under test is upstream of it: the knowledge base is
  reconstructed from a perturbed genome. The chromosome-deletion path this study exercises
  lands in v2ecoli#455.

implementation_requirements:
  - name: genotype declaration on the build surface
    effort: M
    status: done
    detail: >-
      A way for a study to name the genotype it builds - a bundle manifest hash or an
      equivalent - reaching the parca composite. DONE in v2ecoli#457 (bundle_manifest /
      bundle_overrides on the parca generator, threaded to InitializeStep with a
      declared-vs-injected cross-check). Was the blocking item; no longer is.
  - name: ecoli-sources KO generator
    effort: L
    detail: >-
      Emits the perturbed bundle + complete manifest for a chromosome-level knockout. This
      study is its acceptance target.
  - name: build-integrity report card
    effort: M
    detail: >-
      Gen-2 ReportCardStep rendering the axes above, so the verdict is a card rather than a
      one-off script. Reusable by every genotype study downstream.
  - name: wild-type reference build
    effort: S
    detail: >-
      The unperturbed sim_data every comparison above is taken against. Available from the
      existing full-ParCa path.

alternative_hypotheses:
  - >-
      A corrupted build could come from the generator rather than the deletion transform -
      a malformed bundle or a manifest pointing at the wrong files. Distinguished by running
      the same invariant directly on the knowledge base, without the generator, which is
      what the unit tests in v2ecoli#455 do.
  - >-
      A fit that fails to converge may reflect the gene's essentiality rather than a broken
      build. Distinguished by the sequence and coordinate axes: those pass or fail
      independently of whether the fit converges.

falsifiability: >-
  Any corrupted feature, out-of-range coordinate, or unexpected length change fails this
  study outright. The invariants are exact rather than banded - there is no tolerance to
  argue about - which is why this study can be graded while the rest of the investigation
  stays descriptive.

limitations:
  - >-
      Establishes that the build is internally consistent, NOT that the resulting physiology
      is sensible. Everything about how the cell behaves is downstream and belongs to
      studies 01-06.
  - >-
      A single-genotype build integrity check does not establish the transform is correct in
      general. Genome-wide confidence needs the panel, and ultimately the tranche-B runner.
  - >-
      The AA-kcat axis has no band yet, so it is a recorded observation rather than a graded
      criterion on the first pass.
  - >-
      Run mode is load-bearing and the two tiers answer different questions. A fast-mode
      build (~104 s measured) fits 7 of 51 conditions and is sufficient for the structural
      readouts - sequence round-trip, chromosome length, feature inventory, and
      deleted-gene set membership were all measured on one. A full-mode build (several
      hours, per docs/generate_full_parca.md) fits all conditions and is required before
      any claim about FITTED PARAMETER VALUES, because the CLI's own --allow-partial-fit
      help flags step 9's mechanistic fits as failing on "numerically-marginal kinetics
      (e.g. debug mode's truncated TF set)" - the exact regime a fast build is in. So
      fast-mode kcat magnitudes are not trustworthy and must not be graded.

      The practical consequence is that this study can screen a genotype panel cheaply in
      fast mode and reserve full-mode builds for genotypes advancing to physiology. That
      is what makes a panel or a genome-wide screen tractable at all: the alternative
      prices every genotype at hours.
