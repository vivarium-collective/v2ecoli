schema_version: 4
name: mcs-10-multiseed-robustness
investigation: multiscale-complexity-showcase
title: "Statistical control — headline claims across a seed ensemble"
created: '2026-09-04'
status: investigating
confidence: Investigating
gate_status: running

cites:
  - {key: CooperHelmstetter1968, claim: "origins-per-cell scale with growth rate"}
  - {key: TaheriAraghi2015, claim: "interdivision-time CV ~10-30% and adder homeostasis"}

question: >-
  Every quantitative claim in the arcs (origins-scale-with-growth, the ppGpp
  anti-correlation, interdivision-time CV, the growth-law directions) began as a
  single-seed point estimate on 2-4 cells. Do the HEADLINE claims survive resampling —
  i.e., are the effects larger than the seed-to-seed scatter — when each condition is run
  as a seed ensemble and reported with confidence bands rather than a single number?

hypothesis: >-
  The cross-condition EFFECTS (origins 2.4->4.2, ppGpp 75->18, growth 0.90->1.28) are much
  larger than the within-condition seed scatter, so the Arc 1 scaling and the capstone
  coordination survive multi-seed resampling with non-overlapping confidence intervals;
  the Arc 3 interdivision-time CV estimate (~7%) tightens around a value still below the
  biological 10-30% band (confirming the structural gap is not a single-seed artifact).

objective: >-
  Run a seed ensemble (>=6 seeds) at both Arc-1 conditions (minimal/basal and rich/with_aa),
  multi-generation, and re-report origins-per-cell, ppGpp, growth rate, ribosome content and
  interdivision-time CV as mean +/- CI. Replace the single-seed point estimates in mcs-01,
  mcs-03 and the capstone with these bands; state which effects survive and which do not.

pipeline_gate:
  prerequisites:
    - {study: mcs-01-ppgpp-replication-coupling, condition: tests-passed}
    - {study: mcs-03-single-cell-heterogeneity, condition: tests-passed}

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants:
    - name: seed-ensemble-basal
      detail: ">=6 seeds, 3 generations, minimal/basal (out/cache). Post-burn-in mother-line cells."
    - name: seed-ensemble-with-aa
      detail: ">=6 seeds, 3 generations, rich/with_aa (out/cache-with_aa)."
  model_settings:
    - {name: seed-ensemble, detail: "seeds 20-25 per condition; run_condition_multigen_parquet.py per seed"}

inputs:
  - artifact: sim_data
    from: parca
    into: cache_dir

readouts:
  - "origins_per_cell mean +/- 95% CI at basal and with_aa (Cooper-Helmstetter scaling with error bars)"
  - "ppgpp_conc and growth_rate mean +/- CI at both conditions (the anti-correlation with bands)"
  - "interdivision-time CV across the pooled ensemble (Arc 3 estimate with a confidence interval)"

expected_behavior:
  - name: headline-claims-survive-resampling
    observable: origins_per_cell
    condition: "basal vs with_aa ensembles"
    rationale: "The origins-scaling and ppGpp-anti-correlation effects should exceed seed scatter (non-overlapping CIs)."
  - name: cv-estimate-tightens-below-band
    observable: interdivision_time_cv
    condition: "pooled ensemble"
    rationale: "The ~7% CV should tighten around a value still below 10-30%, confirming the structural gap is robust, not a single-seed fluke."

tests:
  - name: headline-claims-survive-resampling
    classification: primary
    question: "Do the origins-scaling and ppGpp-anti-correlation effects have non-overlapping confidence intervals between conditions?"
    measure: {kind: derived, detail: "per-seed condition means -> between-condition CI overlap test (observables.py per seed, pooled)."}
  - name: cv-estimate-tightens-below-band
    classification: primary
    question: "Does the pooled interdivision-time CV sit below 0.10 with a tight CI?"
    measure: {kind: derived, detail: "arc3_heterogeneity.py over the pooled multi-seed hive."}

planned_runs:
  - name: mcs10-ensemble-basal
    status: planned
    n_steps: "6 seeds x 3 gens"
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    details: "Basal seed ensemble (out/cache), seeds 20-25, 3 generations each, parquet hives out/mcs10_basal_seed*."
  - name: mcs10-ensemble-with-aa
    status: planned
    n_steps: "6 seeds x 3 gens"
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    details: "Rich/with_aa seed ensemble (out/cache-with_aa), seeds 20-25, 3 generations each, parquet hives out/mcs10_with_aa_seed*."

simulation_set:
  - name: mcs10-ensemble-basal
    kind: simulation
    status: running
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    duration_steps: "3 generations"
    seeds: [20, 21, 22, 23, 24, 25]
    metrics: [origins_per_cell, ppgpp_conc, growth_rate, ribosome_conc, interdivision_time_cv]
    pass_fail_tests: [headline-claims-survive-resampling, cv-estimate-tightens-below-band]
  - name: mcs10-ensemble-with-aa
    kind: simulation
    status: running
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    duration_steps: "3 generations"
    seeds: [20, 21, 22, 23, 24, 25]
    metrics: [origins_per_cell, ppgpp_conc, growth_rate, ribosome_conc]
    pass_fail_tests: [headline-claims-survive-resampling]

runs: []

claim: >-
  Designed statistical control (running). Replaces the single-seed point estimates behind
  the Arc 1 scaling, the ppGpp anti-correlation and the Arc 3 CV with multi-seed confidence
  bands, so a reviewer can see which effects exceed seed-to-seed scatter.

findings: []

biological_summary: >-
  The arcs' headline numbers were single-seed point estimates on a handful of cells. This
  study runs each Arc-1 condition as a >=6-seed ensemble and re-reports origins, ppGpp,
  growth and the interdivision-time CV as mean +/- CI, so the cross-condition effects can be
  judged against the within-condition scatter — the control a skeptical reviewer asks for
  first.

behavior_tests:
  - name: headline-claims-survive-resampling
    classification: primary
    measure: "between-condition CI overlap for origins-per-cell and ppGpp"
    pass_if: "non-overlapping 95% CIs between basal and with_aa"
    expected: "effects exceed seed scatter"
    observed: "(ensemble running)"
    verdict: pending
  - name: cv-estimate-tightens-below-band
    classification: primary
    measure: "pooled interdivision-time CV with CI"
    pass_if: "CV CI upper bound < 0.10"
    expected: "below the 10-30% band, tightly"
    observed: "(ensemble running)"
    verdict: pending

conclusion: >-
  ## Plan
  A >=6-seed ensemble at basal and with_aa re-establishes the headline claims with confidence
  bands. The ensemble is running; results replace the single-seed estimates in mcs-01/mcs-03
  and the capstone, and state explicitly which effects survive resampling.
