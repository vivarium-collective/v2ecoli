  regression_compatibility:
    verdict: confirmed
    basis: No model code, data or simulation. A deterministic re-analysis of the existing silent-transcription-units
      sweep using columns it already emitted.
  biological_validation:
    verdict: partial
    basis: Three of four primary axes pass and attribute the deficit to probability assignment. The secondary
      selection axis fails its pre-registered bar (0.380 vs 0.5), a ~2.6x effect against a ~93x assignment
      gap, weakly powered at n=6.
  explanatory_gain:
    verdict: confirmed
    basis: 'Resolves a question four prior studies could not: the deficit is in probability assignment,
      not selection, and not regulation (zero TFs bound; actual tracks target to 0.1%). It also explains
      the investigation''s own methodological failure by showing the in-force probability is 25x below
      basal_prob, so every diagnosis that read basal_prob read a number the process never uses.'
