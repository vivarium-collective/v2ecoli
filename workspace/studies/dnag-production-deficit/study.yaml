findings:
- id: F-01
  kind: computational
  status: contradicts
  statement: 'The simulation delivers 4.6% of the DnaG count ParCa fitted for it (mean 1.76 vs 38 copies) -- a 22x gap against the model''s own target.'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: simulation-reproduces-parca-target
    observed: 0.046271
  expected:
    summary: The simulation should reproduce ParCa's fitted count within 2x.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    This is an execution gap, not a calibration gap, and the distinction
    decides where a repair belongs. ParCa's fit of 38 copies is 0.64x the
    four-dataset literature median of 59, which is unremarkable. The running
    simulation then delivers 1.76. So the model is not failing to match
    experiment so much as failing to reproduce the parameterisation it was
    given.

    Any fix aimed only at recalibrating DnaG upward would be aimed at the wrong
    quantity: even hitting the literature median exactly in ParCa would still
    leave the simulation ~20x short, because the loss happens after the fit.
  next_action: 'Trace why translated output falls so far below the fitted target: compare mRNA copy number and ribosome occupancy on TU00352 against what the fitted efficiency implies.'
  next_action_type: escalate_model
- id: F-02
  kind: biological
  status: contradicts
  statement: 'dnaG is not starved of transcription: TU00352 sits at the 91.9th percentile of 3277 transcripts, 30x the median. The dedup hypothesis is refuted as an explanation of the DnaG deficit.'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: transcription-is-not-the-lossy-step
    observed: 91.852304
  expected:
    summary: The dedup hypothesis predicts dnaG's transcript is below the median; this tests the opposite direction.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    The investigation's standing hypothesis was that collapsing the rpsU
    promoters into a single transcription unit starves dnaG. The test was
    written so that hypothesis predicts a FAILURE, and it passed instead:
    basal_prob 1.21e-04 against a median of 4.01e-06.

    This does not vindicate the dedup. Collapsing three promoters into one is
    still a structural misrepresentation, and it still prevents dnaG from being
    regulated independently of rpsU and rpoD. What it does establish is that the
    dedup is not the route by which DnaG becomes scarce, so repairing the
    transcription-unit architecture would not by itself raise DnaG.

    Recording this matters more than the pass: it redirects the investigation
    away from a hypothesis it had been carrying since study 1.
  next_action: Retire the transcription-starvation route as the explanation for low DnaG. Keep the TU00352 architecture as a separate regulatory-coupling concern, which it remains.
  next_action_type: retire_hypothesis
- id: F-03
  kind: biological
  status: confirms
  statement: 'rpsU, dnaG and rpoD share one transcript yet their model/literature ratios span 3.55x (rpsU 1.81x over, rpoD 0.51x under), so the loss is per-cistron and downstream of transcription.'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: operon-partners-diverge
    observed: 3.554638
  expected:
    summary: If the partners tracked together the loss would be shared, not per-cistron.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
    The operon is the study's internal control. Because the three cistrons
    draw on one mRNA pool, any divergence between their protein levels cannot
    come from transcription. rpsU is over-produced while its two partners are
    under-produced, which localises the loss to a per-cistron step without
    relying on any single absolute count being correct.

    Combined with the chain percentiles -- transcription 91.9th, degradation at
    exactly the median default, translation 1.5th of 4309 monomers -- the step is
    translation. dnaG's efficiency is 2.27e-05 against a median of 2.30e-04,
    about ten-fold low, and HolA (1.9th) and HolB (5.7th) sit in the same tail.
    That the other two scarce replisome subunits share the anomaly suggests
    something systematic about this class of protein rather than a DnaG-specific
    accident.
- id: F-04
  kind: biological
  status: partial
  statement: 'ParCa''s fitted DnaG (38) is 0.64x the four-dataset literature median of 59 (Schmidt 6, Soufi 53, Mori 66, Li 98).'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: dnag-below-literature
    observed: 0.644068
  expected:
    summary: ParCa's fitted count should sit near the literature median.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: observation
  summary: |
    A modest shortfall, and much smaller than the execution gap in F-01.

    The dataset spread is the point worth carrying forward. Schmidt reads DnaG at
    6 copies while Soufi, Mori and Li read 53, 66 and 98. A comparison against
    Schmidt alone would suggest the model OVER-produces DnaG by 6x -- the exact
    opposite of the truth. That error was made during this study's scoping, from
    the two proteomics tables shipped in the repo, and corrected only by pulling
    all four datasets.
- id: F-05
  kind: biological
  status: confirms
  statement: 'DnaG is absent for 61.6% of a healthy 12-generation lineage (median 0, mean 1.76, max 11 across 114,572 timesteps).'
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: dnag-not-maintained-across-generations
    observed: 0.615674
  expected:
    summary: A protein required every replication cycle should be present.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: observation
  summary: |
    Not a low steady level but intermittent presence: for most of the cell
    cycle there is no DnaG in the model at all. Measured per generation so a
    progressive decline would be visible; the deficit is constant across the
    lineage rather than worsening, so this is a steady-state property and not
    depletion over generations.

    This is the permissive arm -- gating off, lineage healthy, 12/12 generations
    divided -- so the absence is normal production, not a consequence of the
    stall.
- id: F-06
  kind: biological
  status: confirms
  statement: Supply sits below the initiation gate's demand of 2 copies per origin for 61.6% of the lineage, which is the mechanical reason mechanistic replisome gating cannot be left enabled.
  evidence:
    from_run: dnag-production-deficit__analysis
    from_test: supply-below-gate-demand
    observed: 0.615674
  expected:
    summary: Supply should meet the gate's per-origin demand.
  provenance:
    run_ids:
    - dnag-production-deficit__analysis
  tier: mechanism
  summary: |
