discovery_implications:
  resolved_uncertainties:
  - "The production composite per-tick wall is ~52 ms (74 ms single-tick), of which\
    \ ~76% is spent outside process_update (this bucket includes real numpy/scipy\
    \ numeric work, e.g. Poisson logpmf, not all of it marshalling) \u2014 and no\
    \ single Process dominates."
  - The cProfile hotspots are 13,817 isinstance + 4,213 __array_finalize__ + 52 process_update
    calls per tick (genuine counts); much of the per-tick cost is outside process_update,
    though that bucket includes real numpy/scipy numeric work, so it is not purely
    marshalling.
  - 'Column-centric prototypes give constant-in-N per-trajectory wall and a per-tick
    speedup of 1.5x on a realistic TranscriptInitiation-shaped workload (3.1x / 2.8x
    on toys): measured microbenchmarks and an extrapolation not validated on the 55-process
    WCM. The "~1500x at N=1e3 x 30 ticks (26 min -> ~1 s)" is an illustrative projection
    = toy factor x N (the script hardcodes 3x -> 3000x; the prose uses the 1.5x recalibration
    -> ~1500x), not a measured speedup: the column-centric vectorized runtime was
    never built and never timed; only the pbg sequential side was measured (at N=1,2,4).'
  remaining_uncertainties:
  - The column-centric runtime is validated as prototypes + a projection, not as a
    built runner that reproduces the Phase-2 PDMP trajectory distribution to within
    5 sigma MC; numerical equivalence of the vectorized path is unproven.
  - Whether the column-centric refactor preserves the deterministic (pairwise/Kahan)
    FP summation order needed for reproducible ABC posteriors across hardware is untested.
  alternate_hypotheses:
  - id: per-process-jit-wins
    statement: Per-Process Catalyst.jl JIT compilation is the main performance lever,
      recovering most of the per-tick cost.
    why_plausible: JIT-compiling reaction propensities is the standard speedup for
      stochastic chemical kinetics.
    mechanism_elements_affected:
    - runtime-architecture
    - per-tick-compute
    discriminating_observables:
    - fraction of per-tick wall in per-Process compute vs framework marshalling
    - measured speedup of per-Process JIT vs column-centric vectorization
    evidence_for: []
    evidence_against:
    - "~76% of per-tick time is outside process_update (this bucket includes real\
      \ numpy/scipy numeric work, not all of it marshalling); on that basis per-Process\
      \ compilation (which only touches the in-process compute) is extrapolated to\
      \ buy at most ~10% \u2014 an estimate not validated on the 55-process WCM."
  mechanism_update_proposals:
  - mechanism_node_or_edge: runtime-architecture
    update_type: replace
    rationale: Adopt a column-centric (pre-allocated per-observable arrays indexed
      by trajectory x time) vectorized runtime with N-way lockstep stepping; do NOT
      pursue per-Process Catalyst.jl JIT as the primary lever. Remaining work is engineering,
      not investigation.
    requires_expert_approval: true
  followup_study_proposals:
  - id: pdmp-04-column-centric-equivalence
    title: Numerical-equivalence validation of the column-centric runner vs the Phase-2
      PDMP
    study_type: validation
    source_trigger: architectural_decision
    proposed_experiment: Build the column-centric runner and verify W2(p_compiled,
      p_phase2) <= 5 sigma MC with deterministic pairwise/Kahan summation; confirm
      1/sqrt(N) posterior variance scaling on an ABC test posterior.
    expected_information_gain: high
    expert_gate_required: true
