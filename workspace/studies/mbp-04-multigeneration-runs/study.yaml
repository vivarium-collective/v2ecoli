biological_summary: 'Carbon ledger: glucose-C in -> biomass-C (~0.46 gC/gDW) + CO2-C (~half of aerobic glucose-C; omitting it is a guaranteed ~50% failure) + acetate/lactate/formate/ethanol/pyruvate/succinate-C (aerobic overflow per Vemuri 2006). Nitrogen ledger (narrow): NH4+ in -> biomass-N (~0.12 gN/gDW). Both residuals are REPORTED, NOT GRADED: |<0.02| (carbon) / |<0.10| (nitrogen) is the intent for the settled value, but the criteria reduce with max_abs over the full window, which the startup transient of the ledger dominates (measured 5.383 / 9.482), and the nitrogen constant is ~11% low against sim_data (~0.135 vs 0.12 gN/gDW). Headline observable is the growth->limitation regime transition.'
