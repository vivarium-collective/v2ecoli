schema_version: 4
name: colonies-02-parallel-multigen-perf
title: "Parallel multi-generation colony \u2014 natural-division perf & Ray scaling"
description: "Rerun the colony from one whole-cell agent, dividing naturally (no forced\n\
  same-tick division), keeping both daughters, as it doubles 1 \u2192 2 \u2192 4 \u2192\
  \ 8.\nTrack the per-cell compute hit (wall, RSS) generation-by-generation to resolve\n\
  colonies-01's open F-06 anomaly (RSS climbing ~5 MB/sim-s in long runs) and its\n\
  PASS-narrow caveat (only forced division was validated). Run the same growing\n\
  colony under the process-bigraph Ray protocol (sharded RayProtocol / actor\npool)\
  \ to test whether process-level parallelism lifts the single-process\n~13-cells\
  \ GIL ceiling. Produce a compute-requirements profile seeding\ncolonies-03-hpc-deployment.\n"
topic: scaling
tags:
- colony
- multi-cell
- perf
- scaling
- parallel
- ray
- natural-division
- requires-pymunk
- requires-viva-munk
created: '2026-06-15'
status: evaluated
phase: Evaluate
design_status: complete
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
visualizations:
- name: colony-animation
  address: gif:colony.gif
  description: "A colony growing from ONE whole-cell agent by NATURAL division (no\
    \ forcing):\neach cell elongates as its dry mass accumulates toward the division\
    \ threshold\n(~one cell cycle \u2248 2400 ticks), then splits into two daughters\
    \ that reset and\nregrow \u2014 1 -> 2 -> 4 -> 6 cells over ~5300 ticks (subsampled\
    \ 1 frame/40 ticks).\nFixed physics: jitter_per_second=1e-4 (the old 0.5 flung\
    \ cells around the\nframe) + coherent fg body mass + the viva-munk in-place shape\
    \ update. Capsules\nare cells; daughters are hue-shifted variants of their mother\
    \ (phylogeny\ncoloring). Capped at gen 2 to stay under the F-04 native RAM ceiling.\n\
    Regenerate via\n`python .../colonies-02-parallel-multigen-perf/sims/make_gif.py`.\n"
- name: rss-vs-tick-by-ncells
  address: image:charts/01_rss_vs_tick_by_ncells.svg
  chart: charts/01_rss_vs_tick_by_ncells.svg
  render: python sims/make_memory_figs.py
  description: "Process RSS vs tick from a controlled staged run (N=1\u21922\u2192\
    4, force-divided for\ntiming; sims/mem_measure.py \u2192 runs/mem_measure.csv).\
    \ The two memory factors\nare visible in one figure: the step-up at each division\
    \ = the per-cell\nfootprint, and the upward slope within each constant-N plateau\
    \ = per-tick RSS\ngrowth (annotated MB/tick). NOTE: this slope was measured on\
    \ the macOS mini,\nwhere it is dominated by allocator-arena churn; on Linux/glibc\
    \ it is bounded\n(0.017 MB/tick, 0.000 with malloc_trim). See F-03.\n"
- name: footprint-and-leak-by-ncells
  address: image:charts/02_footprint_and_leak_by_ncells.svg
  chart: charts/02_footprint_and_leak_by_ncells.svg
  render: python sims/make_memory_figs.py
  description: 'Left: per-cell footprint (GB/cell). Each colony cell is an independent
    full

    baseline whole-cell composite that loads its own sim_data, so RAM scales ~1+

    GB per cell (bounded, but the dominant cells-per-node limiter). Right: the

    per-tick RSS-growth rate (within-plateau slope, MB/tick). Measured on the

    macOS mini, where the slope is allocator-arena churn; Linux-bounded (F-03),

    so not the cells-per-node limiter it appears here.

    '
- name: memory-decomposition
  address: image:charts/03_memory_decomposition.svg
  chart: charts/03_memory_decomposition.svg
  render: python sims/make_memory_figs.py
  description: 'RSS split into numpy-object bytes (gc-visible) vs native/C. numpy
    stays flat

    within each plateau while native grows, so the growth is not a retained

    Python/numpy object. The 2026-07-26 hunt (F-03) attributed it to the

    elongation step (~82%) + mass-listener (~17%): ~0.2 MB/tick of truly

    retained scipy LSODA work arrays plus macOS allocator-arena retention of

    freed numpy buffers (invisible to tracemalloc). Linux-bounded. See

    colonies-03 F-05 + issue #253.

    '
baseline:
- name: colony-1cell-natural
  composite: v2ecoli.composites.ecoli_colony.ecoli_colony
  params:
    seed: 0
    cache_dir: out/cache
    n_cells: 1
    env_size: 30
    physics_interval: 1.0
    ecoli_interval: 1.0
purpose:
  question: "Starting from one whole-cell E. coli agent dividing naturally through\
    \ 3-4\ngenerations (1 \u2192 2 \u2192 4 \u2192 8), does per-cell compute cost\
    \ (wall + RSS) stay\nflat, or drift as daughter EcoliWCM internal composites accumulate\
    \ history?\nAnd does running the growing colony under the process-bigraph Ray\
    \ protocol\n(one OS process per cell / sharded actor pool) lift the single-process\
    \ GIL\nceiling colonies-01 measured (~13 cells/process at realtime)?\n"
  mechanism: "The `colony` composite (v2ecoli/composites/colony.py) wires N copies\
    \ of\nEcoliWCM (v2ecoli/bridge.py) into one pymunk 2D environment from viva-munk.\n\
    At division the bridge emits a structural update (_remove mother, _add two\ndaughter\
    \ EcoliWCMs) hydrated natively by the engine (the colonies-01\ndaughter-hydration\
    \ fix). Sequential runs walk all inner 55-process WCM steps\non one GIL-bound\
    \ thread. The Ray protocol (process_bigraph/protocols/ray.py \u2014\nRayProtocol\
    \ sharded actor pool via `ray:EcoliWCM` + Composite\nparallel_processes=True)\
    \ runs each cell's update in its own OS process, so\nindependent cells solve concurrently\
    \ across cores.\n"
  expected_outcome: '(H1, drift) Per-cell wall drifts <=20% across gens 0-3; if >20%,
    the inner

    composite is accumulating dead nodes / growing allocations (resolves F-06).

    (H2, RSS) Per-cell RSS stays bounded once startup is amortized; the

    ~5 MB/sim-s climb is pre-division warmup, not an unbounded leak. (H3, Ray)

    Under Ray, total wall stays sub-realtime well past the ~13-cell single-process

    ceiling, with biology (masses, division timing) consistent vs the sequential

    run modulo RNG.

    '
build_tasks:
- id: jitter-mass-diagnostic
  motivation: "colony.gif shows excessive cell movement. Two coupled causes:\n(1)\
    \ colony.py passes jitter_per_second=0.5, ~5000x viva-munk's 1e-4\n    schema\
    \ default; jitter is a Gaussian impulse applied per substep\n    (multibody.apply_jitter_force)\
    \ and velocity change = impulse/mass.\n(2) EcoliWCM emits dry_mass ~380 (fg, raw\
    \ number) -> body.mass=380,\n    but build_microbe's initial body is density=0.02\
    \ -> mass ~0.056.\n    If the WCM mass does not actually land (or units are off),\
    \ the\n    effective body mass is tiny and the high jitter flings cells.\n"
  action: '5-tick diagnostic: print body.mass per cell each tick (does WCM

    dry_mass reach the pymunk body?) and per-tick displacement. Decide

    the fix: (a) lower jitter_per_second to the viva-munk default range,

    and/or (b) correct the mass->pymunk coupling (scale dry_mass to a

    consistent physics mass unit, or drive density from cell geometry).

    '
- id: ray-wiring
  motivation: 'Run the growing colony under the updated process-bigraph Ray protocol.

    Cells are `local:EcoliWCM` today (incl. daughters added by

    _handle_division in bridge.py). To parallelize, both initial cells AND

    dynamically-added daughters must use the Ray address.

    '
  action: 'Wire EcoliWCM through RayProtocol: register_process_class("EcoliWCM", ..),

    switch cell address to `ray:EcoliWCM`, build with parallel_processes=True,

    and update bridge._handle_division so daughter specs inherit the Ray

    address. Per-actor ParCa cache loading via register_type_provider so each

    actor hydrates its own sim_data (relates to the parca-cache-contention

    open question). Verify daughters hydrate as Ray actors, not local procs.

    '
pipeline_gate:
  prerequisites:
  - colonies-01-hpc-readiness
  enables:
  - colonies-03-hpc-deployment
  proceed_condition: 'colonies-01-hpc-readiness.gate_status == passed (satisfied)
    AND

    per_cell_ms / per_cell_rss recorded as projection inputs.

    '
  blocks_until_resolved: 'RESOLVED (2026-07-26). The prior block -- that the F-06 RSS
    climb might

    be an unbounded leak OOMing before gen 3 -- was a macOS allocator-arena

    artifact. On the Linux HPC target memory is bounded (F-03: 0.017 MB/tick

    on glibc, 0.000 with malloc_trim), natural multi-generation division runs

    unattended (F-01), and daughters hydrate under Ray (F-06). The

    cells-per-node budget colonies-03 will validate is therefore trustworthy;

    HPC deployment may proceed.

    '
simulation_set:
- name: seq-1cell-4div
  description: 'Sequential (single-threaded) baseline. One cell, natural division,

    ~3 generations. Per-tick wall, per-cell wall, pymunk_step_ms, RSS,

    live_cell_count, generation index recorded each tick. This is the

    drift reference and the F-06 resolution run.

    '
  perturbation:
    n_cells: 1
    parallel_processes: false
    jitter_per_second: 0.0001
    init_mass: 200.0
  duration_min: 180
  seeds:
  - 0
- name: ray-1cell-4div
  description: 'Same natural-division colony under the process-bigraph Ray protocol

    (ray:EcoliWCM, parallel_processes=True, sharded actor pool). Measures

    whether per-cell wall stays flat AND whether total wall stays

    sub-realtime past the single-process GIL ceiling as the colony grows.

    '
  perturbation:
    n_cells: 1
    parallel_processes: true
    jitter_per_second: 0.0001
    init_mass: 200.0
  duration_min: 180
  seeds:
  - 0
- name: ray-nsweep-static
  description: 'Optional confirmation: hold N static at {2,4,8,16} under Ray and

    measure total wall vs N. Sequential crossed realtime at N~13; Ray

    should push that ceiling out by ~n_cores. Short windows (60 ticks).

    '
  perturbation:
    n_cells_sweep:
    - 2
    - 4
    - 8
    - 16
    parallel_processes: true
  duration_min: 5
  seeds:
  - 0
behavior_tests:
- name: natural-division-2-generations
  classification: primary
  description: "One cell divides NATURALLY (no --force-divide) to 2, then both\ndaughters\
    \ divide to 4 \u2014 all cells advancing on subsequent ticks.\nResolves colonies-01's\
    \ PASS-narrow (forced-division-only) caveat.\n"
- name: per-cell-wall-drift-within-20pct
  classification: primary
  description: 'Per-cell wall (ms/tick/cell) drifts <=20% across generations 0-3 of

    the natural-division colony. Directly resolves F-06 for wall time.

    '
- name: per-cell-rss-drift-bounded
  classification: primary
  description: 'Per-cell RSS is bounded on the Linux HPC target rather than climbing

    unbounded. Reframed by the 2026-07-26 leak hunt (F-03): the scary mini

    climb was macOS allocator-arena churn (Linux-bounded to 0.017 MB/tick on

    glibc, 0.000 with malloc_trim); the only true retention is ~0.2 MB/tick of

    scipy LSODA work arrays. Mechanism-validated on Linux, not a mini-measured

    pass. Resolves F-06 for RAM.

    '
- name: ray-lifts-gil-ceiling
  classification: primary
  description: 'Under the Ray protocol, total wall for the growing colony stays

    sub-realtime past the sequential ~13-cell ceiling (target: scales

    with cores), with division timing + masses consistent vs sequential.

    '
- name: ray-biology-consistency
  classification: secondary
  description: 'Ray and sequential runs produce the same colony trajectory (cell

    count over time, per-cell mass at division) modulo RNG ordering.

    '
compute_requirements_profile:
  records:
  - per_cell_wall_ms_by_generation
  - per_cell_rss_mb_by_generation
  - total_wall_vs_realtime_ratio_seq_vs_ray
  - ray_actor_count_and_per_actor_rss
  - cells_per_core_at_realtime_seq_vs_ray
  seeds_downstream:
  - colonies-03-hpc-deployment
conclusion: |
  This study delivers Part A enabling compute infrastructure for the colonies
  investigation: correct natural multi-generation division (F-01), a flat
  per-cell wall cost (~55-60 ms/tick/cell sequential, F-02; ~57 ms/tick/cell in
  the merged 2026-07-26 remote re-run), Ray process-parallelism that lifts the
  single-process GIL ceiling (~3.5x cells-per-core, F-04/F-06), and a now
  characterised, Linux-bounded memory profile. It is not the scientific payload
  (that is Part B: whether WCM single-cell phenotypes survive colony embedding +
  division and match microfluidic-device data across the tier ladder).

  The earlier "per-cell RSS leaks without bound, OOMs ~gen 3, so the 384/node
  budget is untrustworthy" conclusion was WRONG and is retracted. The
  2026-07-26 leak hunt localized the per-tick growth to the inner WCM's
  elongation step (~82%) + mass-listener (~17%), decomposing into ~0.2 MB/tick
  of truly retained scipy LSODA work arrays and a much larger macOS
  allocator-arena retention of freed numpy buffers. Linux validation (colima
  glibc) grew 0.017 MB/tick with no fix and 0.000 with periodic malloc_trim(0),
  versus ~1.6 MB/tick on the macOS mini. So on the Linux HPC target memory is
  bounded; the leak is a characterised, mitigated footnote (residual target:
  the ~0.2 MB/tick LSODA arena via solver reuse or periodic trim), not the story.

  Gate: unblocked. The block existed only because of the presumed unbounded
  native leak; the corrected diagnosis (localized + Linux-bounded) removes it,
  and the remaining behavior tests are satisfied by recorded data --
  natural-division-2-generations (F-01), per-cell-wall-drift-within-20pct (F-02,
  1.8% drift), ray-lifts-gil-ceiling (F-04), ray-biology-consistency (F-06).
  per-cell-rss-drift-bounded is satisfied on the Linux target by
  mechanism-validation (glibc container), not a mini-measured pass; the residual
  scipy retention is noted honestly. HPC deployment (colonies-03) may proceed.
findings:
- id: F-01-natural-multigen-division
  kind: computational
  status: confirms
  statement: 'One whole-cell agent divides naturally (no forced same-tick division)

    through >=3 generations: 1 -> 2 -> 4 -> 6 -> 8 -> 10 -> 12 -> 14 cells

    (7 division events) in the sequential run, with all cells advancing on

    subsequent ticks. Resolves the colonies-01 PASS-narrow caveat (which

    validated FORCED division only). Daughter EcoliWCMs hydrate natively

    via the bridge _remove/_add structural update.

    '
  evidence:
    from_runs:
    - seq-1cell-4div
    from_test: natural-division-2-generations
    observed:
      division_ticks:
      - 2338
      - 4706
      - 4707
      - 6975
      - 6976
      - 7075
      - 7101
      cells_final: 14
    units: tick (1 tick = 1 sim-s)
  expected:
    summary: one cell divides to 2 then both daughters to 4, all advancing.
  provenance:
    run_ids:
    - seq-1cell-4div
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/ticks.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/run.py
    random_seeds:
    - 0
  next_action: Natural multi-gen division is a usable substrate; memory is Linux-bounded
    (F-03), so it is HPC-ready enabling infrastructure.
- id: F-02-per-cell-wall-flat
  kind: computational
  status: confirms
  statement: 'Per-cell EcoliWCM wall does not drift across generations. The cleanest

    comparison (low-RSS static N-sweep, 60-tick windows): per-cell wall is

    flat at 54-59 ms across N in {1,2,4,8,16} (65->54 ms, a slight decrease

    as overhead amortizes). In the growing sequential run the 1-cell gen

    (55.3 ms) vs 2-cell gen (56.3 ms/cell) differ by only +1.8%. Apparent

    inflation to ~80 ms/cell at 14 cells is swap pressure (F-03) + O(N)

    pymunk collision cost, not WCM-internal accumulation. Resolves F-06

    for wall time: no per-cell wall drift.

    '
  evidence:
    from_runs:
    - seq-1cell-4div
    - nsweep-local
    from_test: per-cell-wall-drift-within-20pct
    observed:
      seq_gen0_ms: 55.3
      seq_gen1_per_cell_ms: 56.3
      drift_pct: 1.8
      nsweep_local_per_cell_ms:
        n1: 65
        n2: 59
        n4: 59
        n8: 58
        n16: 54
    units: ms/tick/cell
  expected:
    summary: per-cell wall drifts <=20% across generations 0-3.
  provenance:
    run_ids:
    - seq-1cell-4div
    - nsweep:local
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/nsweep.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/nsweep.py
    random_seeds:
    - 0
  next_action: Use ~55-60 ms/tick/cell (sequential) as the per-cell wall projection
    input.
- id: F-03-per-cell-rss-unbounded-leak
  kind: computational
  status: confirms
  statement: 'CORRECTED by the 2026-07-26 leak hunt + Linux validation (supersedes the

    earlier "unbounded native leak" reading recorded below). Per-process RSS

    attribution on the mini localized the per-tick growth to the inner WCM''s

    polypeptide-elongation step (~82%) plus the mass-listener (~17%) -- it is

    NOT an unbounded native leak. It decomposes into two parts: (1) a small

    real retention of ~0.2 MB/tick (tracemalloc-visible), the scipy LSODA

    integrator work arrays (rwork/iwork) held per solve_ivp(method="LSODA")

    in the equilibrium / two-component / tRNA-charging ODEs -- ~0.6 GB over a

    ~3000-tick cell cycle, a small named optimization target (solver reuse /

    method change / periodic trim); and (2) allocator ARENA retention -- the

    scary ~1.4 MB/tick was the elongation step''s large per-tick numpy working

    arrays (buildSequences/polymerize, ~1.3 MB) which are freed but macOS does

    not return to the OS, so mini RSS climbs (invisible to tracemalloc). Linux

    validation (colima glibc container, faithful reproduction of both sources)

    grew 0.017 MB/tick WITHOUT any fix and 0.000 with periodic malloc_trim(0),

    versus ~1.6 MB/tick on the macOS mini. So on the Linux HPC target the

    colony''s memory is BOUNDED; the OOM / unbounded-leak framing below was

    substantially a macOS measurement artifact. The macOS-mini figures in

    `observed` (7.7 MB/sim-s, ~19 GB at first division, 27.5 GB peak, OOM at

    tick 8161) are retained as the original mini measurements, now understood

    as arena churn, not a Linux-relevant leak. Also corrected: an intermediate

    "emitter is 94% of the leak" reading was a warm-process artifact and is

    WRONG -- the growth is intrinsic to comp.run() (elongation), as above.

    '
  evidence:
    from_runs:
    - seq-1cell-4div
    from_test: per-cell-rss-drift-bounded
    observed:
      macos_mini_single_cell_leak_mb_per_s: 7.7
      macos_mini_single_cell_rss_at_first_division_gb: 19
      macos_mini_peak_rss_gb: 27.5
      macos_mini_oom_tick: 8161
      no_emitter_control_mb_per_tick: 7.06
      elongation_share_pct: 82
      mass_listener_share_pct: 17
      real_retention_scipy_lsoda_mb_per_tick: 0.2
      linux_glibc_mb_per_tick_no_fix: 0.017
      linux_glibc_mb_per_tick_with_malloc_trim: 0.0
      macos_mini_mb_per_tick: 1.6
    units: MB (macos_mini_* are macOS allocator-arena artifacts; linux_* are the
      HPC-target measurements)
  expected:
    summary: per-cell RSS stabilizes after startup (the ~5 MB/sim-s climb is warmup).
  provenance:
    run_ids:
    - seq-1cell-4div
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/ticks.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/run.py
    random_seeds:
    - 0
  next_action: 'No longer blocks colonies-03-hpc-deployment: memory is Linux-bounded

    (0.017 MB/tick on glibc, 0.000 with malloc_trim). Residual optimization

    target is the ~0.2 MB/tick scipy LSODA arena (solver reuse / periodic

    trim); enable malloc_trim on the HPC target for headroom.

    '
- id: F-04-ray-lifts-gil-ceiling
  kind: computational
  status: confirms
  statement: 'The process-bigraph Ray protocol (ray:EcoliWCM, parallel_processes=True)

    lifts the single-process GIL ceiling. Static N-sweep median wall (realtime

    ratio): local scales linearly 65/118/237/466/865 ms (ratio 0.07->0.87)

    for N=1/2/4/8/16, crossing realtime near N~18 (the colonies-01 ceiling).

    Ray scales sub-linearly 54/59/81/115/245 ms (ratio 0.05->0.25): per-cell

    wall drops 54->15 ms as cells solve concurrently across cores. At N=16

    Ray is 3.5x faster and only 0.25 realtime, with headroom to ~50-60 cells

    before realtime. Confirmed in the growing colony too: 2 cells cost the

    same total wall (~59 ms) as 1 cell.

    '
  evidence:
    from_runs:
    - nsweep:local
    - nsweep:ray
    - ray-1cell-4div
    from_test: ray-lifts-gil-ceiling
    observed:
      local_wall_ms:
        n1: 65
        n2: 118
        n4: 237
        n8: 466
        n16: 865
      ray_wall_ms:
        n1: 54
        n2: 59
        n4: 81
        n8: 115
        n16: 245
      local_realtime_cross_n: 18
      ray_realtime_cross_n_est: 55
    units: ms/tick (realtime budget = 1000 ms)
  expected:
    summary: Ray total wall stays sub-realtime past the sequential ~13-cell ceiling.
  provenance:
    run_ids:
    - nsweep:local
    - nsweep:ray
    - ray-1cell-4div
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/nsweep.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/nsweep.py
    random_seeds:
    - 0
  next_action: 'CPU/GIL is no longer the ceiling under Ray (~3.5x sequential

    cells-per-core). RAM is a bounded, budgetable overhead on Linux (F-03, F-05),

    not a runaway per-generation leak.

    '
- id: F-05-ray-ram-is-binding-constraint
  kind: computational
  status: confirms
  statement: 'Under Ray the binding constraint flips from CPU/GIL to aggregate RAM,

    and RAM is worse than sequential. The ~7.7 MB/sim-s per-cell leak (F-03)

    is transport-independent: it moves into the actor process (one actor

    reached ~19 GB by tick 2338, mirroring sequential). The Ray protocol also

    pre-spawns a ~13-actor pool, each carrying a ~590 MB WCM baseline (~7.6 GB

    fixed overhead). At just 2 live cells the two daughter actors were each

    ~10 GB and climbing (~34 GB distinct actor RSS), so a growing colony OOMs

    the machine even faster than sequential. The main process stays flat

    ~0.7 GB (WCM offloaded). RSS sawtooths at division (mother actor returns

    to pool).

    Refined by the 2026-07-26 leak hunt (see F-03): the per-actor climb that

    drove the ~19/34 GB figures is the same macOS allocator-arena artifact and

    is Linux-bounded (0.017 MB/tick on glibc), so on the HPC target aggregate

    actor RAM does NOT run away with generation age. The real, transport-

    specific Ray cost is the FIXED pool baseline recorded here -- ~590 MB/idle

    pool actor over a ~13-actor pool (~7.6 GB fixed) plus ~154 MB/cell steady

    state (colonies-01 static sweep) -- not an unbounded per-cell leak. CPU/GIL

    is the constraint Ray lifts (F-04); RAM is a bounded, budgetable overhead.

    '
  evidence:
    from_runs:
    - ray-1cell-4div
    - nsweep:ray
    from_test: ray-biology-consistency
    observed:
      single_actor_rss_at_first_division_gb: 19
      actor_pool_size: 13
      per_actor_baseline_mb: 590
      two_cell_distinct_actor_rss_gb: 34
      main_proc_rss_gb: 0.7
    units: GB
  expected:
    summary: per-cell RSS bounded so Ray scales out across cores.
  provenance:
    run_ids:
    - ray-1cell-4div
    - nsweep:ray
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/nsweep.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/nsweep.py
    random_seeds:
    - 0
  next_action: 'colonies-03 cells-per-node under Ray: budget the FIXED overhead

    (~590 MB/idle-pool-actor + ~154 MB/cell steady state), not a per-generation

    leak; memory is Linux-bounded (F-03) so Ray scale-out is viable. Optionally

    enable malloc_trim on the target for headroom.

    '
- id: F-06-ray-biology-consistency-exact
  kind: computational
  status: confirms
  statement: 'Ray and sequential produce the same colony trajectory. First division

    occurs at tick 2338 under both transports (exact, not just modulo RNG):

    the EcoliWCM is deterministic given its seed and the transport does not

    alter seeding, so division timing and per-cell mass are transport-

    invariant. Per-cell wall under Ray at 2 cells is 29.7 ms (vs 59.8 ms at

    1 cell): the two cells solve concurrently.

    '
  evidence:
    from_runs:
    - seq-1cell-4div
    - ray-1cell-4div
    from_test: ray-biology-consistency
    observed:
      seq_first_division_tick: 2338
      ray_first_division_tick: 2338
      ray_per_cell_ms_n1: 59.8
      ray_per_cell_ms_n2: 29.7
    units: tick
  expected:
    summary: Ray and sequential agree on cell count over time + mass at division.
  provenance:
    run_ids:
    - seq-1cell-4div
    - ray-1cell-4div
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/runs/ticks.parquet
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/run.py
    random_seeds:
    - 0
  next_action: Ray is a faithful drop-in for the biology; only its RAM profile differs
    (F-05).
- id: F-07-physics-jitter-mass-fix
  kind: computational
  status: confirms
  statement: 'The colonies-01 excessive-cell-movement artifact has two coupled causes,

    both confirmed by a 12-tick 2-cell diagnostic sweep over

    (jitter_per_second, init_mass): (1) jitter_per_second=0.5 is ~5000x

    viva-munk''s 1e-4 default; (2) build_microbe''s density(0.02)-seeded body

    mass is ~0.04 (tiny), so jitter impulse/mass flings the cell. Legacy

    (0.5, None): mean move 9-10 um/tick. Either fix alone tames it to

    ~0.13 um/tick; the chosen (1e-4, 200) fixes both motion and fg-unit

    coherence (body mass ~200 fg). These are the run.py / study.yaml defaults.

    '
  evidence:
    from_runs:
    - physics-diagnostic
    from_test: (build_task) jitter-mass-diagnostic
    observed:
      legacy_0p5_None_move_um: 9.0
      fix_1e-4_200_move_um: 0.13
      fix_body_mass_fg: 200
    units: um/tick
  expected:
    summary: lowering jitter and/or seeding a realistic fg mass collapses cell movement.
  provenance:
    run_ids:
    - physics-diagnostic
    model_commit_hash: 854ff2e4
    raw_data_artifact: studies/colonies-02-parallel-multigen-perf/diagnostics/physics_diag.csv
    analysis_script: studies/colonies-02-parallel-multigen-perf/sims/diagnose_physics.py
    random_seeds:
    - 0
  next_action: Defaults (jitter=1e-4, init_mass=200) adopted in run.py and simulation_set.
