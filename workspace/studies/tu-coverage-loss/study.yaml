implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Build the source-TU to model-TU coverage map per gene.
  detail: 'Join transcription_units.tsv (3766 TUs, gene lists as JSON) against the model''s rna_data ids,
    per gene: source TU count, surviving TU count, and whether every survivor carries the same repressing
    TF. Genes whose symbols do not resolve must be counted and reported, not dropped -- the join is the
    study''s main methodological risk.'
- id: req-2
  status: not_started
  blocking: false
  summary: Reuse the per-cistron transcription measurement.
  detail: actual_rna_synth_prob_per_cistron is emitted since the deriver repair, so orphan and single-TU
    silencing can be read from dnag-promoter-availability's sweep with no new runs.
alternative_hypotheses:
- name: H1 structural exposure
  discriminator: single-tu-genes-are-more-exposed-to-repression
  statement: Losing alternative promoters converts promoter-specific regulation into gene-wide silencing;
    single-TU genes are markedly more silenceable. The dnaG-versus-rpsU contrast generalises.
- name: H2 coincidence
  discriminator: single-tu-genes-are-more-exposed-to-repression
  statement: dnaG's exposure is a one-off and single-TU genes are no more silenceable than others; the
    TU gap is a coverage nuisance rather than a mechanism.
- name: H3 the loss is targeted at essential machinery
  discriminator: essential-genes-are-not-preferentially-orphaned
  statement: TU loss concentrates on essential genes, as the rpsU-dnaG-rpoD locus hints at having lost
    5 of its 8 TUs. Would make the model systematically fragile where it can least afford to be.
falsifiability: 'H2 is a real possibility and the relative-risk axis is powered to detect it: a 3x minimum
  effect was chosen so a marginal enrichment cannot be read as a structural claim. The essential-gene
  control can independently show the loss is random with respect to importance.'
simulation_set: []
planned_runs:
- name: coverage-plus-reuse
  status: planned
  n_steps: 0
  details: NO NEW SIMULATION. Coverage axes read transcription_units.tsv and the cache; silencing axes
    reuse dnag-promoter-availability's 6-seed sweep via actual_rna_synth_prob_per_cistron, available only
    because the rna_synth_prob deriver repair landed before it ran.
robustness:
  n_replicates: 6
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  parameter_sweep: false
  note: Coverage is deterministic; the silencing axes use the 6 independent seeds.
controls:
- name: essential-genes-are-not-preferentially-orphaned
  kind: negative
  hypothesis: If TU loss is random with respect to importance, 179 orphans is a coverage gap rather than
    a structural fragility.
  expected: essential-gene orphan/single-TU rate within 1.5x of the all-gene rate.
  observed: ''
  result: PENDING
limitations:
- The gene-to-TU join is by identifier across two artefacts; unresolved genes are counted and reported,
  but systematic naming mismatches would bias which genes are examined.
- '''Essential'' is taken from the model''s own class lists (idx_rprotein, idx_rnap, replication cistrons),
  not from an external essentiality dataset, so it is a proxy.'
- 'The study measures exposure and silencing. It does NOT establish that the omitted TUs should have been
  kept: the model may exclude them for reasons this study does not examine.'
- Silencing is read from a stalling lineage, so a gene silent here need not be silent in healthy growth.
claim: ''
conclusion: ''
confidence: Planned
