schema_version: 2
name: metabolism-biomass-yield
title: Is v2ecoli's central carbon metabolism physically correct?
created: '2026-07-29'
status: active
question: >-
  Does the v2ecoli baseline conserve carbon and respect the thermodynamic ceiling on
  biomass yield? The basal population_phenotype_basal vs_literature card grades
  physiology.biomass_yield at 0.826 gDW/g glucose against a measured band of 0.355-0.444
  and a first-principles ceiling of 0.538, a verdict of first_principles_violation that
  has stood committed since 2026-06-17. This investigation is named for that failing axis
  and carries no hypothesis about mechanism.

executive:
  what_is_this: >-
    A model-correctness thread on v2ecoli's central carbon metabolism, opened because the
    baseline produces more biomass per gram of glucose than carbon and energy balance
    permit. The object of evaluation is the model - a defect with a fix at the end - as
    distinct from the sibling metabolism-overflow investigation, which evaluates a method.
  verdict_status: characterized
  verdict: >-
    CONFIRMED and LOCALISED. A fresh 4x8 run on a recorded commit gives Yxs 0.831 gDW/g
    glucose - 1.87x the top of the measured band and 1.55x the first-principles ceiling -
    reproducing the committed fixture's 0.826 to within 0.67%, so the violation is real and
    not an artefact of the fixtures' unrecorded provenance. The same run localises it: carbon
    accounting stays self-consistent at baseline (implied biomass carbon 0.455 gC/gDW, inside
    the physically plausible range), while respiration is nearly absent (O2:glucose 0.096,
    RQ 3.43 against ~1) and 94.5% of glucose carbon is retained as biomass. The baseline
    defect is therefore ENERGETIC - biomass built without paying its ATP cost - and distinct
    from the mass-bookkeeping failure that appears under a binding uptake cap. The fix should
    be scoped around maintenance-ATP and respiratory capacity, not around mass accounting.
  decisions_needed:
    - question: Is the baseline yield violation one defect with the binding-cap carbon creation, or two?
      status: >-
        RESOLVED (2026-07-29, S1) - two distinct defects. Carbon conserves at baseline while
        yield violates the ceiling; a single bookkeeping bug would break conservation
        everywhere and does not.
      context: >-
        The overflow study's finding concludes the violation points at the same bookkeeping
        problem as carbon-created-under-binding-uptake-cap. That is the hypothesis S1 tests,
        not its premise. The signatures differ: at a slack cap carbon closure is 1.11 (books
        nearly close) while yield is ~2x the ceiling; under a binding cap closure degrades to
        7.93 and carbon is created. A pure bookkeeping bug should break conservation
        everywhere, so the baseline behaviour points instead at an energetic defect.
      resolution: >-
        S1 measured implied biomass carbon at 0.4549 gC/gDW on 20 cells at commit 84383530 -
        squarely inside the 0.45-0.50 gC/gDW a real E. coli has - so the model is not creating
        carbon at baseline. It is failing to burn any: O2:glucose 0.096, CO2:glucose 0.331,
        RQ 3.43, 94.5% of glucose carbon to biomass. Two defects, and only the baseline one is
        in scope for this investigation. CAVEAT: S1 computes biomass carbon by difference,
        which fixes the closure ratio at 1.0 by construction and moves the information into
        the implied carbon content; that content is the evidence. It is therefore not a
        like-for-like comparison against the overflow's 1.11 / 7.93, which use an independent
        biomass-carbon estimate. Strong positive evidence, not proof. Making it like-for-like
        needs the overflow runner's closure estimator, which lives only on that branch.

scientific_argument:
  main_claim: >-
    The v2ecoli baseline violates the first-principles ceiling on biomass yield while still
    conserving carbon, which localises the baseline defect to the energetic side of
    metabolism rather than to mass bookkeeping.
  evidence_for:
    - >-
      S1, fresh 4x8 run at commit 84383530, 20 post-burn-in cells, direct mass balance:
      Yxs = 0.8313 gDW/g glucose (CV 1.44%) against a measured band of 0.355-0.444 and a
      theoretical_max of 0.538 - 1.87x the top of the band and 1.55x the ceiling.
    - >-
      The committed fixture reproduces: 0.8313 fresh vs 0.8257 baked, a 0.67% difference
      inside the ensemble CV, so the 2026-06-17 verdict is not an artefact of the fixtures'
      unrecorded provenance.
    - >-
      Carbon conserves at baseline: implied biomass carbon 0.4549 gC/gDW sits inside the
      0.45-0.50 range a real E. coli has, so this is not mass creation.
    - >-
      The baseline barely respires: O2:glucose 0.096, CO2:glucose 0.331, RQ 3.43 against ~1
      for full oxidation, leaving 94.5% of glucose carbon in biomass and almost none burned
      for maintenance and ATP.
  caveats:
    - >-
      The 0.826 figure comes from committed fixtures stamped reconstructed: True,
      commit: None, sweep_dir: None, baked: unknown. The code and sweep that produced it
      were never recorded, so it cannot be attributed to any particular revision. Removing
      that ambiguity is S1's first duty.
    - >-
      The equivalence reference mode cannot see this defect. v2ecoli is a port of v1 with
      byte-level equivalence demonstrated, so if both share the defect the card returns
      within_tol on a thermodynamically forbidden number. Correctness evidence has to come
      from the literature / first-principles side.

acceptance_criteria:
  - study: metabolism-biomass-yield-s1-diagnostic
    behavior: biomass-yield-remeasured-on-recorded-commit
  - study: metabolism-biomass-yield-s1-diagnostic
    behavior: carbon-closure-discriminates-one-defect-from-two

members:
  - population_phenotype_basal
  - metabolism-biomass-yield-s1-diagnostic
  - metabolism-biomass-yield-s1b-anaerobic-contrast

glossary:
  - term: Biomass yield (Yxs)
    definition: |-
      Grams of dry cell weight produced per gram of glucose consumed, here computed by direct mass balance as dDW / integral(q_glc * DW) dt over post-burn-in cells.
  - term: First-principles ceiling (theoretical_max)
    definition: |-
      The maximum Yxs a carbon- and energy-balanced cell can achieve, 0.538 gDW/g glucose from Varma 1993 (FBA, fully aerobic, no maintenance energy). A model above it is forbidden, not merely unusual.
  - term: Carbon closure
    definition: |-
      The ratio of carbon accounted for on the output side (CO2, secreted acetate, biomass) to carbon entering as glucose. A value near 1 means the books balance; the binding-cap overflow condition reaches 7.93, meaning carbon is created.
  - term: RQ (respiratory quotient)
    definition: |-
      CO2 evolved per O2 consumed. Full glucose oxidation gives ~1; the v2ecoli baseline gives ~3.6, indicating it barely respires.
