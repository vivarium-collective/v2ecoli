  - 1
  - 2
  parameter_sweep: false
  note: Reused sweep. The comparison is a population-level correlation and a single gene's position within it; seeds enter only through the rate estimates.
controls:
- name: balance-still-predicts-controls
  kind: positive
  hypothesis: The mass balance validated in the predecessor study should still predict control proteins here. If it does not, every derived quantity is void.
  expected: at least 70% of controls within a factor of 2.
  observed: ''
  result: PENDING
alternative_hypotheses:
- claim: The fit and the runtime are systematically misaligned across the transcriptome, and dnaG is simply where it became visible.
  discriminated_by: discrepancy-is-dnag-specific failing.
  status: untested
- claim: ParCa fits against basal_prob while the runtime uses the ppGpp-adjusted vector, so the gap is exactly the ratio between them.
  discriminated_by: basal-vs-ppgpp-substitution-explains-it and population-discrepancy-tracks-vector-ratio.
  status: untested
- claim: The substitution explains part of the gap and something else contributes.
  discriminated_by: the substitution axis failing while the population correlation is nonetheless positive.
  status: untested
- claim: The discrepancy is an artefact of the inverted mass balance.
  discriminated_by: balance-still-predicts-controls.
  status: untested
falsifiability: The dnaG-specific framing is overturned if the population median discrepancy is comparable to dnaG's, which would make the defect transcriptome-wide. The substitution explanation is overturned if the implied/delivered ratio does not track the basal-to-ppGpp vector ratio, either for dnaG or across the population. Everything is void if the balance stops predicting controls.
limitations:
- Every quantity is derived by inverting a mass balance validated only to 74.5% within a factor of 2, so a factor-of-2 agreement is the finest distinction this study can honestly draw.
- The ppGpp vector is recomputed rather than read, since it is not emitted.
- Showing that fit and runtime disagree by the vector ratio identifies the mismatch; it does not establish which of the two is correct.
- Single medium and condition, and the ppGpp adjustment is condition-dependent by construction.
- The sweep is reused rather than repeated.
conclusion_logic:
  if_primary_tests_pass: The disagreement is dnaG-specific and equals the ratio between basal_prob and the ppGpp vector, so the repair is to fit and run against the same vector.
  if_primary_tests_fail:
    summary: If the discrepancy is not dnaG-specific, the fit and runtime are systematically misaligned transcriptome-wide, which is a larger defect than this investigation has so far described. If it is specific but does not track the vector ratio, the substitution is not the cause and another explanation is needed.
    diagnose:
    - question: Is the fit-runtime mismatch global or dnaG-specific?
      note: Answered by this study's first and third axes together.
discovery_implications:
  resolved_uncertainties:
  - 'Whether the gap is dnaG-specific: yes. 6.85x against a population median of 0.55.'
  - 'Whether the basal/ppGpp substitution explains it: yes for dnaG, within 1.72x.'
  - 'Whether it explains the transcriptome generally: no. Correlation 0.318.'
  remaining_uncertainties:
  - What drives the fit-runtime relationship for the other ~3455 monomers.
  - Which of the two vectors is the CORRECT one to fit against -- this study identifies the mismatch but not which side should change.
  followup_study_proposals:
  - id: FU-01
    title: Should ParCa fit against the ppGpp vector?
    motivation: 'This study shows the fit and the runtime use different probability vectors but not

      which is correct. If ParCa should fit against the in-force vector, the repair is a

      ParCa change; if the runtime should not substitute, it is a process change. That

      decision governs every downstream number in this investigation.

      '
