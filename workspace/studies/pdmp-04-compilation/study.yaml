schema_version: 4
name: pdmp-04-compilation
investigation: v2ecoli-pdmp
title: "Phase 4 \u2014 Compilation and Performance"
claim: "Profiling shows ~76% of per-tick time is spent outside process_update, but\
  \ that bucket includes real\nnumpy/scipy numeric work (e.g. Poisson logpmf), so\
  \ it is not all marshalling overhead. The headline\n\"total speedup at N=10\xB3\"\
  \ is an illustrative projection (a hand-picked toy factor \xD7 N), not a measurement\n\
  \u2014 the column-centric vectorized runtime was never built or timed, only the\
  \ pbg side was measured (at\nN=1,2,4), and the per-Process Catalyst.jl JIT \u2264\
  10% figure is an unvalidated extrapolation.\n"
confidence: Investigating
status: running
phase: Design
topic: pdmp
tags:
- pdmp
- phase-4
- compilation
- catalyst-jl
- modelingtoolkit
- column-centric
- gpu
- jumpprocesses-jl
- hpc
- xarray-emitter
created: '2026-05-24'
question: "Can the Phase 2 PDMP be exported to a high-performance compiled representation\
  \ (Catalyst.jl /\nModelingToolkit with symbolic Jacobians and automatic sensitivity\
  \ equations) on a column-centric\nVivarium runtime, achieving \u226510\xB3 parallel\
  \ single-cell trajectories on a GPU or multi-core CPU with\nnear-zero per-step marshalling\
  \ overhead \u2014 turning the throughput bottleneck the DUF report identified\n\
  into a non-issue for downstream inference?\n"
hypothesis: "(a) The PDMP, expressed in Process Bigraph schemas, admits an automatic\
  \ export to Catalyst.jl /\nModelingToolkit producing LLVM-optimized simulation with\
  \ symbolic Jacobians and forward-mode\nsensitivity equations. (b) Replacing v2ecoli's\
  \ row-centric nested-dictionary state with pre-allocated\ncolumn-centric tensors\
  \ removes essentially all per-step marshalling overhead identified in Phase 0.\n\
  (c) Vivarium's API can be inverted so processes declare local state, ODE vector\
  \ fields, and jump\npropensities, with the runtime handling topology traversal and\
  \ time-stepping. (d) The combined runtime\nachieves \u226510\xB3 parallel single-cell\
  \ trajectories on GPU or multi-core CPU with throughput an order of\nmagnitude or\
  \ more above the v2ecoli baseline.\n"
objective: "Implement the PB \u2192 Catalyst.jl export, refactor Vivarium state to\
  \ column-centric pre-allocated tensors,\ninvert the Vivarium API to declarative\
  \ process specs (local state + ODE vector field + jump\npropensities), and deploy\
  \ the compiled runner on GPU and multi-core CPU. Benchmark \u226510\xB3 parallel\n\
  trajectories vs. the v2ecoli baseline and the Phase 2 PDMP runner, and report the\
  \ ABC wall-clock\nimprovement handed to Phase 3 / Phase 5.\n"
description: "Phase 4 of the v2ecoli \u2192 PDMP roadmap. The DUF report Sec. 4.2.1\
  \ notes that \"submodel definitions and\nsimulation modules are currently inseparable\"\
  \ in v2ecoli and that the runtime \"exhibits orders of\nmagnitude of overhead, relative\
  \ to competitive numerical solvers\" \u2014 the dominant cause being\nmarshalling\
  \ overhead from the row-centric nested-dictionary state. Catalyst.jl + ModelingToolkit\
  \ +\nJumpProcesses.jl is the reference target: an established Julia stack for compiled\
  \ reaction-network\nsimulation with symbolic Jacobians and GPU-friendly state. The\
  \ PB \u2192 Catalyst.jl bridge \u2014 codifying the\nPB process interface as a Catalyst-compatible\
  \ reaction-network spec \u2014 is the primary new deliverable;\nthe column-centric\
  \ refactor of Vivarium can proceed in parallel with Phases 1\u20132.\n\n# Numerical\
  \ considerations\nNumerical equivalence. The hardest test is whether the compiled\
  \ runner produces the same trajectory\nensemble as the Phase 2 runner: W\u2082(p_compiled,\
  \ p_phase2) \u2264 5\xB7\u03C3_MC, where \u03C3_MC is the standard error of\nthe\
  \ Phase 2 self-W\u2082 at the same N (5\u03C3 is conservative \u2014 it covers genuine\
  \ FP-order differences without\nfiring on stochastic noise). Tested on N=10\u2074\
  \ trajectories across all Phase 0 conditions.\n\nPrecision. FP32 on GPU promises\
  \ 2\xD7 throughput but corrupts long-run ABC posteriors via catastrophic\ncancellation\
  \ in propensity sums. Default FP64; FP32 only where (a) bit-equivalence vs FP64\
  \ passes and\n(b) downstream ABC posteriors are invariant under the switch.\n\n\
  FP summation order. Parallel reductions over per-trajectory log-likelihoods must\
  \ use deterministic\n(pairwise or Kahan) summation so results are independent of\
  \ GPU thread scheduling; non-deterministic\natomic-add reductions are banned (they\
  \ break SBC reproducibility across hardware).\n\nConvergence orders. ODE: order-5\
  \ embedded Runge-Kutta (default) or BDF for stiff segments, verified on\nVan der\
  \ Pol + Brusselator before deployment. SSA jumps: exact. \u03C4-leaping: weak order\
  \ 1, strong order\n0.5, tested on the analytical M/M/1 queue.\n\nThroughput vs variance.\
  \ The relevant metric is posterior-estimate-variance per wall-clock second, not\n\
  raw trajectories/second; we report both trajectories/sec at fixed precision and\
  \ ABC posterior variance\n\xD7 wall-clock time. Doubling trajectories should roughly\
  \ halve posterior variance (1/\u221AN); if not, the\nparallelism has hidden correlations\
  \ to investigate.\n\n# Emitter\nCompiled-runner output goes through a Julia \u2192\
  \ XArrayEmitter bridge that batches per-trajectory results\ninto chunked zarr writes\
  \ (chunks: {trajectory: 64, time: -1}) at the python boundary, avoiding\nper-trajectory\
  \ I/O at 10\xB3+ parallelism. The bridge preserves bit-equivalence with the Phase\
  \ 2 emitter\nso the W\u2082 equivalence test [[uq-compiled-vs-reference-w2-5sigma]]\
  \ can compare paired zarr stores.\n"
expected_behavior:
- name: catalyst-export-works
  en: The PDMP exports to a Catalyst.jl / ModelingToolkit model with symbolic Jacobians
    and automatic sensitivity equations; the compiled artefact runs and reproduces
    interface statistics of the Phase 2 PDMP runner within tolerance.
  given:
    condition: end-to-end-export
  measure:
    kind: observable-comparison
    observable: compiled-model-artefact
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: column-centric-state
  en: Per-step marshalling overhead is reduced to a small fraction (target <10%) of
    essential numerical computation, vs. the majority share measured in Phase 0.
  given:
    condition: compiled-runner
  measure:
    kind: observable-comparison
    observable: per-step-marshalling-fraction
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: vivarium-api-inversion
  en: Process definitions consist of (local state schema, ODE vector field, jump propensities)
    only; the runtime handles topology traversal and time-stepping. No process module
    contains its own step() loop.
  given:
    condition: every-process
  measure:
    kind: observable-comparison
    observable: declarative-process-spec
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: 10cubed-parallel-trajectories
  en: "\u226510\xB3 parallel single-cell trajectories run with throughput at least\
    \ one order of magnitude above v2ecoli baseline. (Gating criterion.)"
  given:
    condition: gpu OR multi-core-cpu
  measure:
    kind: observable-comparison
    observable: parallel-throughput-benchmark
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: uq-compiled-vs-reference-w2-5sigma
  en: "W\u2082(p_compiled, p_phase2) \u2264 5\xB7\u03C3_MC across N=10\u2074 trajectories\
    \ for every Phase 0 condition. Confirms compilation doesn't change the *distribution*\
    \ of trajectories within stochastic noise."
  given:
    condition: N10000-per-Phase0-condition
  measure:
    kind: observable-comparison
    observable: w2-compiled-vs-phase2
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: uq-deterministic-fp-summation
  en: Parallel reductions (per-trajectory log-likelihoods, summary statistics) use
    pairwise or Kahan summation and give bit-identical results across runs with the
    same seed and input. No atomic-add reductions.
  given:
    condition: repeated-runs-identical-seed
  measure:
    kind: observable-comparison
    observable: parallel-reduction-result-stability
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: uq-1-over-sqrt-N-variance-scaling
  en: "Doubling trajectory count halves ABC posterior variance (within MC noise) \u2014\
    \ the 1/\u221AN scaling expected of independent MC. Deviations indicate hidden\
    \ correlations in the parallel runner that compromise inference validity."
  given:
    condition: abc-on-synthetic
  measure:
    kind: observable-comparison
    observable: posterior-variance-vs-N
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
- name: uq-precision-mode-validated
  en: Any FP32 deployment passes both (a) bit-equivalence test on a held-out trajectory
    subset vs FP64 reference and (b) ABC posterior KL divergence < 0.01 vs FP64-derived
    posterior.
  given:
    condition: where-fp32-claimed
  measure:
    kind: observable-comparison
    observable: fp32-vs-fp64-posterior-equivalence
  expect:
    op: within-tolerance
    note: Acceptance band set when this study enters Build (design-stage).
  status: stub
