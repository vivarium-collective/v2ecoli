schema_version: 2
name: parameter-uq
title: "Parameter UQ — global sensitivity of v2ecoli"
created: '2026-06-12'
status: running

question: |
  Which sim_data parameters drive variance in v2ecoli single-cell observables?
  Starting with the ribosome-elongation subsystem, forward uncertainty
  quantification (PCRV-sampled PCE surrogate + analytic Sobol indices) identifies
  which elongation knobs most control mass/growth variance, setting a template for
  a systematic global-sensitivity sweep across the full parameter space.

hypothesis: |
  Among ribosome-elongation parameters, the energetic cost of elongation
  (gtpPerElongation) — not raw elongation speed — is the dominant lever on
  single-cell mass/growth, because GTP availability couples translation to the
  cell's energy budget. Forward UQ should surface a single dominant driver
  (total-order Sobol ≥ 0.5) rather than a diffuse, evenly-shared sensitivity.

executive:
  what_is_this: |
    A forward UQ investigation using the pbg-uq package to identify dominant
    sources of parameter-driven variance in the v2ecoli whole-cell baseline.
    Each study samples a set of sim_data parameters from a uniform prior, runs
    per-sample baseline simulations (1 generation, XArray emitter), fits an
    order-2 Polynomial Chaos Expansion (PCE) surrogate via PyTUQ, and extracts
    analytic Sobol sensitivity indices. The first study (param-uq-01-elongation)
    targets three ribosome-elongation parameters; subsequent studies will expand
    the analysis to other subsystems.
  verdict: |
    In the ecoli-polypeptide-elongation process, GTP cost per elongation
    (gtpPerElongation) is the dominant driver of mass/growth variance among the
    three elongation knobs tested, with a total-order Sobol index of ≈0.88.
    The other two knobs (basal_elongation_rate ≈0.14, ribosomeElongationRate
    ≈0.07) have substantially smaller contributions. The PCE surrogate (order 2,
    8 training + 2 test samples) fits the observable responses with low relative
    error.
  verdict_status: passed
  verdict_detail: |
    param-uq-01-elongation is complete and evaluated: the GTP-dominant result is
    confirmed at gate_status = passed. Expansion to additional subsystems
    (transcription, metabolism, replication) is planned in subsequent studies.
  decisions_needed:
  - question: Expand the elongation prior to ≥20 training samples / order-3 PCE?
    context: |
      The order-2 surrogate over 8 training points gives a robust qualitative
      ranking but coarse index magnitudes. A denser budget would tighten the
      0.88 / 0.14 / 0.07 estimates before they inform calibration.

scientific_argument:
  main_claim: |
    GTP cost per elongation is the dominant parameter-driven source of single-cell
    mass/growth variance in the v2ecoli ribosome-elongation subsystem.
  evidence_for:
  - "Analytic total-order Sobol index of gtpPerElongation ≈ 0.88 (order-2 PCE, 8+2 PCRV samples) — 6× basal_elongation_rate and 12× ribosomeElongationRate."
  - "Result reproduced across two independent observable-collection paths (direct zarr DataTree read and RunReader) with identical indices."
  - "The PCE surrogate fits the held-out test samples with low relative error, so the variance attribution is well-supported by the surrogate."
  evidence_against:
  - "Small training budget (8 points) + order-2 assumption: index magnitudes are coarse, though the qualitative ranking is stable."
  - "1-generation runs and an independence prior (no elongation-rate / GTP-cost covariance) may not capture multi-generation or correlated effects."
  key_figures:
  - "uq_report.html — self-contained Sobol bar chart + PCE response explorer (attached to param-uq-01-elongation)."
  caveats:
  - "Scope is three elongation knobs under the baseline glucose condition; not yet a full-parameter-space sweep."

at_a_glance:
- study: param-uq-01-elongation
  role: "Establishes the forward-UQ template and finds GTP-cost dominance in ribosome elongation."

biological_story: |
  Translation is one of the cell's largest energy sinks: every amino acid added
  to a nascent peptide consumes GTP. This investigation asks which dial on the
  elongation machinery most shapes how much a cell grows. Forward uncertainty
  quantification — sampling each parameter across a plausible range, building a
  fast polynomial surrogate of the whole-cell response, and decomposing the
  output variance by input — points clearly at the energetic cost per elongation
  (gtpPerElongation) over the raw elongation speeds. In other words, under the
  baseline condition the model's mass/growth output is governed more by how
  expensive each peptide-bond is than by how fast ribosomes move. That makes
  GTP-cost a priority target for any calibration aimed at mass/growth fidelity,
  and a natural first node in a broader parameter-sensitivity map of v2ecoli.

studies:
- param-uq-01-elongation

acceptance_criteria:
- study: param-uq-01-elongation
  behavior: gtp-per-elongation-dominant-driver
