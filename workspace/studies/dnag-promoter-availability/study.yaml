  criteria:
  - test: deriver-outputs-are-non-empty
    prior: Does the repaired rna_synth_prob deriver actually emit its outputs?
  - test: dnag-has-zero-promoters-at-generation-4
    prior: Does dnaG actually reach the zero-promoter state the code special-cases?
  - test: peers-keep-their-promoters
    prior: Is promoter loss specific to dnaG?
  - test: promoter-loss-explains-the-collapse
    prior: Does promoter count account for the collapse, or only part of it?
implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Repair the rna_synth_prob deriver — ALL of its outputs are currently empty.
  detail: 'Diagnosed 2026-09-03. Every field written by the rna_synth_prob_listener deriver is empty on
    100% of emitted timesteps: promoter_copy_number, gene_copy_number, bound_TF_indexes, bound_TF_coordinates,
    bound_TF_domains, n_bound_TF_per_TU, n_bound_TF_per_cistron, expected_rna_init_per_cistron, actual_rna_synth_prob_per_cistron,
    target_rna_synth_prob_per_cistron. Fields written by transcript_initiation itself (actual_rna_synth_prob,
    target_rna_synth_prob, n_actual_bound) ARE populated, so the emitter works and the problem is specific
    to this deriver: it sits in FLOW_ORDER and in the composite, and derivers/rna_synth_prob.py:127 computes
    np.bincount(TU_indexes, minlength=n_TU), but the update never lands. Root-cause before patching --
    do NOT simply re-emit from a second site, because a duplicate writer would mask whatever is discarding
    the first. This repairs ten observables at once, not just this study''s.


    RESOLVED 2026-09-03. Root cause: the deriver''s first-tick guard required n_bound_TF_per_TU to be
    full length, but that field is OPTIONAL -- TfBinding emits it only when emit_n_bound_TF_per_TU is
    set, which defaults to False because the matrix is n_TU x n_TF (~900 KB/tick). The guard was therefore
    never satisfied on a default build, so update() returned {} on every tick of every simulation ever
    run. One performance toggle for a single heavy debug listener was disabling nine unrelated observables.
    Fix: drop the optional field from the guard and gate only n_bound_TF_per_cistron, the sole output
    that needs it, on its availability. Verified: nine fields now populate on 361/361 timesteps, and an
    A/B at identical parameters is BIT-IDENTICAL across the full 3277-TU actual_rna_synth_prob array (max
    |diff| = 0.0), so the repair is observational and does not perturb any prior result.'
- id: req-2
  status: complete
  blocking: true
  summary: Fix the generation-1 seed defect (carried from dnag-generational-decay req-1).
  detail: 'run_condition_multigen_parquet.py''s no-perturbation generation-1 path calls build_composite
    without seed=, so generation 1 always runs at seed 0. This study needs new runs and reads a per-generation
    trajectory across seeds, so correlated generation-1 states would bias it.


    RESOLVED 2026-09-03: build_composite now receives seed=args.seed. Verified that seeds 0 and 1 yield
    distinct TranscriptInitiation RNG streams. A no-op at seed 0 by construction (baseline()''s default
    was 0), which is what made the deriver A/B above a clean test of the deriver change alone.'
- id: req-3
  status: not_started
  blocking: false
  summary: Extend generational_decay.py to carry promoter counts.
  detail: Add promoter_copy_number and the derived per-promoter probability to the per-generation record
    returned by v2ecoli/library/generational_decay.py, so every axis reads one aggregation.
alternative_hypotheses:
- name: H1 promoter loss
  discriminator: promoter-loss-explains-the-collapse
  statement: dnaG's promoters disappear from the unique store across generations; p_i goes to 0 and the
    TU contributes nothing. Predicts dnag-has-zero-promoters-at-generation-4 PASSES and the decomposition
    attributes most of the collapse to the count.
- name: H2 per-promoter probability collapse
  discriminator: promoter-loss-explains-the-collapse
  statement: 'Promoter count is roughly steady and the per-promoter probability collapses instead, sending
    the next study to the delta_prob/bound_TF term. Predicts dnag-has-zero-promoters-at-generation-4 FAILS
    or the decomposition attributes little to the count. Favoured a priori: a small-integer count cannot
    supply 5 orders of magnitude unless it hits exactly zero, and the observed floor is 1.3e-11, not 0.'
- name: H3 class-level promoter loss
  discriminator: peers-keep-their-promoters
  statement: The whole rProtein class loses promoters, which would mean promoter count cannot explain
    what distinguishes dnaG from peers whose synthesis RISES. Predicts peers-keep-their-promoters FAILS.
falsifiability: 'The hypothesis this study is named for is the one it is most likely to refute, and that
  is deliberate: a promoter count is a small integer and cannot supply five orders of magnitude unless
  it reaches exactly zero, whereas the observed floor is 1.3e-11 rather than 0. promoter-loss-explains-the-collapse
  is written to detect that failure quantitatively rather than let a directional ''promoters fell'' reading
  stand in for an explanation.'
simulation_set:
- name: ppgpp-on-mechanistic
  kind: single
  is_baseline: true
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides: &id006
      ecoli-chromosome-replication.mechanistic_replisome: true
  note: Identical to dnag-generational-decay's arm so the two studies' generations are comparable.
planned_runs:
- name: promoter-trajectory
  status: running
  n_steps: 6
  details: '6 seeds x 5 generations, mechanistic gate ON, AFTER req-1 and req-2 land. NEW RUNS ARE UNAVOIDABLE:
    promoter_copy_number is empty in every existing parquet, so unlike dnag-generational-decay''s Phase
    A there is no reuse path. Runs stall at generation 4-5 by construction, so each is ~30 min; ~1.5 h
    at 2 concurrent (one sim costs ~5.5 GB RSS; a 16 GB machine fits 2 -- check for sims in OTHER worktrees
    before launching).'
robustness:
  n_replicates: 6
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  parameter_sweep: false
  note: 6 properly seeded replicates, which this study can have because req-2 is blocking here. Promoter
    counts are small integers, so seed-to-seed variance matters more than it did for a probability.
controls:
- name: peers-keep-their-promoters
  kind: negative
  hypothesis: If the peers lose promoters too, promoter count cannot be what distinguishes dnaG.
  expected: peer median promoter count changes by less than 1.5x over generations 1-4.
  observed: Peers fall 2.09-2.23 -> 1.000 in all 6 seeds (0.460), identically to dnaG, while their transcription
    rises. The control fires.
  result: FAIL
- name: deriver-outputs-are-non-empty
  kind: positive
  hypothesis: An unrepaired deriver emits empty arrays, which are indistinguishable from a promoter count
    of zero -- i.e. from this study's own hypothesis. The observable must be shown to exist before it
    is read.
  expected: promoter_copy_number is full-length on >= 99% of timesteps.
  observed: Full-length on 100% of timesteps, all seeds, all generations.
  result: PASS
limitations:
- The lineage stalls at generation 4-5, so the trajectory is 4-5 points and cannot separate an abrupt
  promoter loss from a steep gradual one.
- promoter_copy_number counts promoter RECORDS per TU. If the dedup means dnaG's three native promoters
  are represented by one record, the count understates the biology in a way this study measures but does
  not correct.
- Every quantity is read from a stalling lineage, so a mechanism found here is a mechanism of the failure
  and need not describe healthy growth.
- req-1 repairs ten observables at once. If the repair changes what any of them report, prior studies
  that relied on their ABSENCE (silent-transcription-units left an axis ungraded for exactly this reason)
  may need revisiting.
- '''Collapse generation'' uses a 1e-9 threshold chosen by the agent after seeing the data; it is not
  pre-registered and the timing observation built on it is an observation only.'
- All six lineages stall by generation 4-5, so the trajectory is 4-5 points and cannot distinguish an
  abrupt collapse from a very steep gradual one.
claim: dnaG never lacks a promoter and its promoter count tracks its unaffected class-mates exactly, so
  promoter availability explains 6% of a 100,000-fold collapse. The defect is in the per-promoter probability.
conclusion: 'Refuted, as the design anticipated and said so in advance. dnaG has zero promoters on 0.0000
  of ~120,000 timesteps across 6 seeds, so the p_i <- 0 branch the hypothesis rests on is never reached;
  promoter count accounts for 6.3% of the collapse in log space; and the discriminating control fires,
  because the peers lose promoters identically while their transcription rises. The 2 -> 1 promoter loss
  is real but generic -- gene dosage as tau stretches to 200 min -- and it is a red herring for this question.
  Two incidental results stand: dnaG is NOT promoter-poor despite the TU dedup (2.04 against a peer median
  of 2.17), closing a standing suspicion; and the stall clock is insensitive to collapse timing, which
  undercuts the tempting story that dnaG''s collapse causes the stall.

  By elimination the collapse now sits in the per-promoter probability itself -- the delta_prob/bound_TF
  term of promoter_init_probs, or the normalisation applied after it. The repaired deriver emits bound_TF_indexes,
  bound_TF_coordinates and bound_TF_domains, so that term is directly observable for the first time and
  the next study can measure it rather than reason about it.'
confidence: Refuted
preliminary_observations:
- note: 'FIRST EVER promoter-count measurement, from the req-1 verification smoke (generation 1 only,
    6-minute cap, single seed): dnaG TU00352[c] holds a CONSTANT 2 promoters (min 2, max 2) and is never
    at zero, and the idx_rprotein peer median is also exactly 2.000 (all-TU median 1.662). Recorded as
    the regression pin''s baseline and as context, NOT as a result: this study''s hypothesis concerns
    promoter LOSS by generation 4 across 6 seeds, and one truncated generation-1 run cannot speak to it.
    It is, however, consistent with H2 being favoured a priori -- at generation 1 dnaG carries no promoter
    deficit relative to its peers whatsoever.'
