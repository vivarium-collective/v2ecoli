- name: dnaa1_v11_equilibration
  address: image:charts/dnaa1_v11_equilibration.png
  config:
    title: >-
      dnaa-1 EQUILIBRATION TEST at V=1.1e-3 (the canonical V; Mechanism A,
      seed 1, COMPLETED 15-generation run out/dnaa1_v1p1e-3_long, resumed from
      the dnaa-0 gen-3 dill). DnaA monomer cycle-mean (+ per-gen trough→peak
      envelope) vs generation 1-15 against the accepted band [300,800].
      THE QUESTION it settles: the original 7-gen V=1.1e-3 run showed the
      cycle-mean still RAMPING (gens 4-7: 484/573/804/842) with gens 6-7
      creeping over 800, so it was unclear whether V=1.1e-3 equilibrates IN
      band or keeps drifting over. RESULT (VERDICT B): V=1.1e-3 does NOT
      equilibrate in band. The cycle-mean keeps climbing past 800 — gen6 804,
      gen7-8 842, peaking at gen9 976 / gen11 970 (within-cycle peaks ~1300) —
      then RELAXES back down to 485 by gen 15 (gens 10-15 slope -95/gen). It is
      neither a clean in-band plateau nor a monotonic runaway: it OVERSHOOTS
      then undershoots. So the 7-gen apparent in-band-ness (steady-gen mean 676)
      was a PRE-EQUILIBRATION ARTIFACT — read before the pool had finished
      ramping. Cell cycle stays healthy throughout: all 15 gens divide (mass
      ratio ~1.8-2.2) and oriC oscillates 1↔2 with NO reinitiation to 4. FBA
      GLP_NOFEAS warnings PEAK at gen 9 (7 occurrences, tracking the DnaA
      overshoot) and VANISH by gens 11-15 — they do not worsen at later gens.
      Implication: no single constitutive V closes both band + ~1/min rate; a
      different lever (e.g. feedback/autoregulation) is needed.
    inputs_map:
      dnaa_cycle_mean: bulk (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c]) per-gen mean on canonical all-zeros lineage
      dnaa_trough_peak: same bulk pool, per-gen min/max envelope
      divides_per_gen: listeners.mass.cell_mass end/start ratio per generation (≥1.4 = doubling)
      oric_pattern: listeners.replication_data.number_of_oric (steady = {1,2}; reinit = 4)
  chart: charts/dnaa1_v11_equilibration.svg
  source_run: dnaa1_v1p1e-3_long
  source_runs: [dnaa1_v1p1e-3_long]
  render: >-
    cd ../.. && python scripts/render_dnaa1_v11_equilibration.py
    --stats studies/dnaa-1-expression/charts/dnaa1_v11_equilibration.stats.json
    --out studies/dnaa-1-expression/charts

