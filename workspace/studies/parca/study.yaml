schema_version: 4
name: parca
investigation: whole-cell-model-comparison
title: ParCa initial-state agreement — v2ecoli vs vEcoli
condition: basal
question: Do v2ecoli and vEcoli start from the same ParCa-fit initial state (basal)?
baseline:
  - name: ecoli_baseline
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    description: v2-native candidate arm (fork-free) — the model under test.
  - name: vecoli
    composite: v2ecoli.composites.vecoli.vecoli
    params:
      condition: basal
      cache_dir: out/compare_harness/vecoli_parca
    description: vEcoli (v1) reference arm — the live vEcoli simulation this study grades v2ecoli against, run on the same condition. Running it requires the vEcoli reference env (V2E_VECOLI_DIR + fork sim_data cache); declared here so the comparison's reference model is visible in the Model tab.
comparison:
  seeds: 1
  generations: 1
  cards:
    - parca
report_cards:
  - viz/report_card/parca.html
tests:
  - name: parca-vs-vecoli
    kind: report_card
    card: parca
    classification: primary
    question: Does v2ecoli reproduce vEcoli on parca (parca card)?
    measure:
      kind: report_card_axis
      card: docs/report_cards/whole-cell-model-comparison/parca
      group: parca
runs:
  - composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    name: parca-comparison
    kind: analysis
    canonical: true
    description: v2e-compare study parca
    status: completed
    result: PASS
    outcomes:
      parca-vs-vecoli:
        result: PASS
        detail: 'report card ''parca'': within_tol'
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    # condition:basal was legacy; ecoli_baseline defaults to media:minimal
    params: {}
  model_settings: []
status: evaluated
confidence: Accepted
findings:
  - id: parca-parca
    kind: computational
    status: confirms
    statement: 'v2ecoli and vEcoli start from the same ParCa-fit initial state on basal: all 4 mass observables within tolerance.'
    evidence:
      from_card: parca
      observed: 4 within tolerance (cell mass (fg), dry mass (fg), protein mass (fg), RNA mass (fg))
