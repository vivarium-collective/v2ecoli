schema_version: 4
name: v2ecoli-vecoli-comparison
title: v2ecoli ↔ vEcoli comparison
question: Does v2ecoli reproduce vEcoli across nutrient conditions?
comparison:
  v2ecoli:
    repo: https://github.com/vivarium-collective/v2ecoli
    commit: ''
  vecoli:
    repo: https://github.com/CovertLab/vEcoli
    commit: ''
  vecoli_dir_env: V2E_VECOLI_DIR
  v2_cache: out/cache_full
  ve_cache: out/compare_harness/vecoli_parca
  defaults:
    cards:
    - config
    - standard
    - statistical
    seeds: 4
studies:
- parca
- basal
- metabolism_redux
- with_aa
- succinate
- no_oxygen
- acetate
- statistical
executive:
  what_is_this: |
    Does v2ecoli reproduce vEcoli across nutrient conditions? Each study runs both engines from matched ParCa initial states and grades v2ecoli against a live vEcoli reference on the standard observables -- cell, dry, protein and RNA mass, and growth rate. GOLD STANDARD: grading gates on the multi-seed STATISTICAL card (Welch t-test over 4 seeds) plus the ParCa t=0 card; the single-seed 'standard' card is illustrative only. The old single-seed 'refuted'/'drift' verdicts were retired as OVERSTATED (one seed can't separate a real divergence from ~8-9% seed noise) -- but re-grading on 4 seeds did NOT clear the comparison. It LOCALIZED a real divergence.

    RESULT (4-seed, gen-1, all 5 conditions graded): basal reproduces cleanly (within_tol -- this is the condition ParCa was fit to). Off-basal, v2ecoli's growth-rate + RNA(ribosome) response to nutrient quality is COMPRESSED toward the basal setpoint, MONOTONIC in doubling time (distance from basal): with_aa (dt 25min, rich AA) v2 grows ~-16% SLOWER with ~-21% LESS RNA (both p<0.01, sign REVERSED); basal (dt 44) clean; succinate (dt 82) ~+18% faster (borderline p=0.06); no_oxygen (dt 100) ~+14% faster (borderline p=0.08); acetate (dt 136, poorest carbon) ~+40% FASTER (p=0.049, significant). v2 over-responds when slower-than-basal and under-responds on rich AA.

    KEY DISCRIMINATING FINDING -- PROTEIN MASS REPRODUCES IN EVERY CONDITION (within_tol: Δ+0.3% to -4.0%, always the smallest deviation and never significant), even where growth rate and RNA(ribosome) mass diverge by 14-40%. This is not incidental -- it is the diagnostic that localizes the divergence. If v2's translation throughput or global biomass accounting were wrong, protein mass would move with (or ahead of) the others; instead protein is conserved while RNA/rRNA and growth diverge together. That isolates the defect to the rRNA / ribosome-ALLOCATION axis -- i.e. the ppGpp growth-law that sets how much stable-RNA (ribosome) capacity is built per nutrient state -- and rules OUT the elongation/translation machinery and the mass/biomass bookkeeping. Combined with the bidirectional, basal-anchored gradient, protein-conservation is the strongest single pointer that the issue is nutrient->ppGpp->rRNA setpoint realization, not translation.

    ROOT CAUSE (traced end-to-end, CONFIRMED): the divergence is v2ecoli's INITIAL RNAP-COMPLEX COUNT (APORNAP-CPLX[c], sim_data.molecule_ids.full_RNAP) not scaling with nutrient condition -- it is compressed toward the basal value. Measured pre-overlay full_RNAP bulk: basal v2 2791 vs vEcoli 2753 (+1.4%, matched); acetate 829 vs 572 (+44.9%); with_aa 2820 vs 7726 (-63.5%, i.e. vEcoli scales RNAP to 2.8x basal for rich AA but v2 stays near basal). Initial active_RNAP = rnapFractionActiveDict[condition] x full_RNAP; the active fraction is BIT-IDENTICAL between engines, so the active-RNAP divergence (acetate +45.7%, with_aa -63.5%, basal +1.4%) comes entirely from this compressed RNAP pool. Because RNAP drives transcription including rRNA, this produces the compressed RNA + growth-rate divergence with the correct signs, while ribosomes (matched ~1% -> translation fine) keep PROTEIN MASS reproducing. This is the mechanism behind the protein-conservation finding.

    RULED OUT along the way: the ppGpp->rRNA and ppGpp->ribosome-elongation coupling CODE is numerically identical; the per-condition ppGpp setpoint get_ppGpp_conc(doubling_time), doubling-time map, rnapFractionActiveDict, and aa-supply fit are identical / within ~1.5%; and the stochastic low-copy SpoT sampling artifact (v2 SpoT 12 vs vEcoli 1) is FULLY CONTROLLED by --match-initial-state (bulk overlay matches 16321/16321 incl. ppGpp/RelA/SpoT/charged-tRNA). So it is NOT the coupling, NOT the ppGpp setpoint, and NOT SpoT. WHY --match-initial-state does not rescue it: the overlay corrects BULK only, and it runs AFTER the unique active_RNAP molecule is created from the wrong pre-overlay count -- so even "matched" runs start with the wrong active transcription machinery.

    CONFIRMED (fix experiment, 2026-07-24): extending --match-initial-state to also overlay vEcoli's UNIQUE initial state (new --match-unique-state flag: active_RNAP/active_ribosome/nascent RNA/chromosome, dtype-safe, skips v2-only DnaA_box.pool_label) and pointing the reference at GENUINE vEcoli sim_data COLLAPSES the divergence. acetate mismatch (growth +40.2%, p=0.049) -> drift (growth +5.4%, p=0.76; cell/dry/RNA/protein all within_tol) = basal's own noise level. with_aa mismatch (growth -16.1% p=0.003, RNA -21.3% p=0.001) -> within_tol on ALL 5 axes (growth +1.7%, RNA -0.0%). So once the initial RNAP machinery is matched, v2's dynamics track vEcoli exactly -- the coupling is correct and the initial RNAP pool is the ENTIRE cause. (Note: the original gold-standard runs passed --match-initial-state WITHOUT --match-vecoli-simdata, so the reference resolved to v2's OWN sim_data -- a near-no-op; the divergence was measured on effectively unmatched initial states.)

    DEEPEST LAYER: the compressed RNAP pool traces to v2's per-condition RNAP-subunit EXPRESSION FRACTION (from calculate_ppgpp_expression(condition)), itself compressed toward basal: basal matched (v2/ve ~1.00), with_aa v2/ve 0.69 (under-expresses), acetate 1.21 / succinate 1.17 / no_oxygen 1.19 (over-expresses). It is EXPRESSION, not complexation, and RNAP-specific (ribosomal expression scales fine -> protein conserved). The ppGpp-expression CODE is identical to vEcoli; the cached fitted bound/free ppGpp-expression VECTORS for the RNAP genes differ (they coincide at the basal ppGpp setpoint, diverge off it).

    FIX direction: (a) HARNESS workaround -- --match-unique-state (built + validated); seeds v2 from vEcoli, hides the fit difference. (b) SURGICAL (recommended) -- correct v2's cached ppGpp bound/free expression for the RNAP-subunit genes so calculate_ppgpp_expression scales them like vEcoli; makes v2 reproduce off-basal UNAIDED. (c) ROOT -- reconcile the ParCa ppGpp-expression fit step. Not a coupling patch. All 5 conditions re-graded on the gold standard. MetabolismRedux swap remains investigated-but-blocked on a pbg step-cascade runtime issue (not a science mismatch).

