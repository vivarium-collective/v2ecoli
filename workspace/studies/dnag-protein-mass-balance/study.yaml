conclusion: 'There is no missing mechanism. The 4x residual was an artefact of the comparison,

  and the DnaG chain closes at the corrected magnitude.


  A mass balance calibrated on 200 control monomers -- with DnaG held out -- predicts

  5.55 copies against an observed 7.996, a ratio of 0.694. The measured transcription

  rate, translation efficiency, degradation and dilution account for DnaG''s protein

  count without any additional term. The instrument is sound: 74.5% of controls fall

  within a factor of two, median ratio 1.000.


  The residual came from comparing incommensurable quantities on the wrong observable.

  A fitted steady-state count and a time-averaged simulated one are different things,

  and the 1.76 figure used throughout studies 3 to 7 was the free-monomer BULK count

  sampled from the permissive arm. Measured as total protein on this sweep DnaG is

  7.996 copies, so the gap against ParCa''s 38 is 4.75x rather than 21.6x -- which the

  5.40x transcription deficit already covers.


  One axis fails, and it is the informative one. ParCa''s fit implies a transcription

  rate 6.85x higher than the model delivers. The 38-copy expectation is malformed the

  same way basal_prob was: it assumes a rate the ppGpp path never supplies. The model

  is not failing to convert transcription into protein; it is failing to transcribe at

  the rate its own fit assumed. That 6.85x agrees closely with the independently

  measured 5.40x deficit -- a consistency check the study did not set out to provide.


  The double-counting objection is confirmed by construction rather than argued: the

  runtime reads translation_efficiencies from the same cache array the fit consumed.


  Three observable errors surfaced here, all one class -- a convenient measurement

  standing in for the correct one. Protein: monomer_counts, not free-monomer bulk.

  mRNA: the rna_counts listener, not the bulk store, where 3220 of 3277 transcripts

  read zero and nothing discriminates. Production: transcription rate, not the standing

  mRNA pool, which is identically zero here.


  The mRNA correction cuts the other way and should be stated plainly: measured

  properly, TU00352 really is at zero mRNA 100% of the time while 1844 of 3134 TUs

  carry mRNA. Study 3''s finding survives and is STRONGER than when it was made -- it

  reached the right conclusion on an observable that could not have supported it.

  '
