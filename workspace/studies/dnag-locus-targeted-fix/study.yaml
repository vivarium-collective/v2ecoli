implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Zero the LexA entry for TU00352 in a COPY of the cache.
  detail: 'Remove exactly one nonzero delta_prob entry -- row TU00352, column 14 (PC00010) -- from a copied
    sim_data_cache.dill, leaving basal_prob and everything else untouched. No ParCa refit: the magnitudes
    are already fitted and only this attribution is wrong. Verify the copy differs from the original in
    exactly one entry before running anything.


    DONE and VERIFIED: out/cache_lexafix differs from out/cache in exactly ONE delta_prob entry, (row
    2837 = TU00352[c], column 14 = PC00010), value -1.2128e-04 removed. basal_prob is bit-identical. Axis
    1 therefore measures 1.0.'
- id: req-2
  status: complete
  blocking: true
  summary: Re-verify the control on matched seeds.
  detail: The corrected cache is a modified copy, so its fingerprint differs from ea05ac9b23b1d843 and
    this is a cache-family comparison rather than a within-cache one. The control arm must be re-run on
    the same seeds rather than compared against dnag-promoter-availability's existing numbers.
assumptions:
- assumption: Removing the edge without refitting is adequate.
  basis: basal_prob was fitted WITH this edge present, so TU00352's alpha is very slightly mis-calibrated
    afterwards. The effect is one edge among 1462 and the alternative is a full refit; adequate to test
    whether the mechanism rescues, not the shippable fix.
  risk: medium
- assumption: LexA genuinely does not act on TU00352's promoter.
  basis: EcoCyc places its only site here 4.5 bases downstream of rpsUp3, matching TU00435 to 0.5 bp,
    with TU00352's start 88.5 bp away. But the export gives position, not mechanism -- a site acting by
    looping could still reach an upstream promoter.
  risk: high
simulation_set:
- name: lexa-edge-removed
  kind: single
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
