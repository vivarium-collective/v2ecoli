tests:
  - name: pc-recovers-known-edges
    classification: primary
    description: "PC algorithm, given the Phase 0 reference ensemble + simulated knockouts of ≥5 genes, recovers ≥80% of the known causal edges in the v2ecoli ground-truth graph (the edges we put in by construction when designing the model). Confirms the discovery machinery is working on a problem where the answer is known."
    measure:
      source: scripts/run_pc_discovery.py
      observable: recovered DAG edges vs ground-truth WCM graph
      reduce: "Recall = |recovered ∩ truth| / |truth|"
    pass_if:
      operator: greater-than
      threshold: 0.8
      field: recall
    requires_simulation: pc-recovery-ground-truth
    cites:
      - spirtes2000
  - name: intervention-eig-beats-observational
    classification: primary
    description: "Expected information gain (EIG) per run with interventional gene-knockout design is ≥10× the EIG of pure-observational baseline. Observational alone cannot distinguish Markov-equivalent DAGs; interventions are the gain."
    measure:
      source: scripts/compute_eig.py
      observable: EIG_interventional / EIG_observational
      reduce: ratio
    pass_if:
      operator: greater-than
      threshold: 10.0
      field: eig_ratio
    requires_simulation: phase5-eig-comparison
    cites:
      - lindley1956
  - name: bh-fdr-discovery-calibrated
    classification: supporting
    description: "With BH-FDR correction at α=0.05 on per-gene Bayes factors, the false discovery rate over a held-out null subset stays below the nominal α (measured by including ≥10 known-null genes as positive controls)."
    measure:
      source: scripts/run_per_gene_inference.py
      observable: fraction of declared-discoveries that are known-null
      reduce: empirical FDR
    pass_if:
      operator: less-than
      threshold: 0.05
      field: empirical_FDR
    requires_simulation: phase5-fdr-validation
    cites:
      - benjamini1995
