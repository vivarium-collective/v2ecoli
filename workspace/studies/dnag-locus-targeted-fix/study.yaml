  note: The unmodified cache, re-run on matched seeds.
planned_runs:
- name: paired-lineage
  status: planned
  n_steps: 6
  details: 3 seeds x 2 arms x 12 generations. ~30-60 min per run. Check for sims in other worktrees before
    choosing concurrency; disk is at 56 GB with out/ holding 51 GB.
robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: 3 independent seeds per arm, enough to separate a 12-generation completion from a 4-5 stall.
controls:
- name: rescue-is-not-a-global-growth-artefact
  kind: negative
  hypothesis: A single-edge change should barely perturb anything else; if growth shifts broadly the rescue
    is not about dnaG.
  expected: generation time within 50% of control.
  observed: ''
  result: PENDING
limitations:
- 'No refit: TU00352''s alpha was fitted with the edge present and is slightly mis-calibrated after removal.
  Adequate to test the mechanism, not shippable.'
- The corrected cache is a modified copy, so this is a cache-family comparison; the control is re-run
  rather than reused.
- A rescue would show the misattributed edge is SUFFICIENT to cause the stall, not that the other defects
  are harmless -- the dedup, the constraint boundary and the 2.13x activator residual all remain.
- 'It also would NOT show the model is then correct: biologically LexA should repress rpsUp3, so dnaG
  ought to lose roughly a third of its supply under SOS. Removing the edge entirely leaves it unrepressed,
  which is closer to right than total silencing but still wrong.'
