findings:
- id: insim-binding-fires-readonly-cycle-preserved
  kind: computational
  status: novel
  statement: |
    The PROVIDED DnaA-box binding listener runs IN-SIM inside the composite and is
    cleanly read-only: it writes only listeners.dnaA_binding and never mutates the
    DnaA pool or the box flags, so the cell cycle matches the dnaa-2 succinate
    baseline (oriC 1<->2; divisions every generation). The real per-tick in-sim
    values — free DnaA-ATP/ADP, DnaA-ATP fraction, and oriC low/high occupancy —
    are recorded under runs[dnaa3-insim-readonly].real_insim_numbers and (for the
    full cell cycle) runs[dnaa3-readonly-artifact].real_insim_numbers, taken directly
    from the emitted parquet. Over the full cycle the low-affinity sites stay HIGH
    (~0.8, free DnaA-ATP above the K_d throughout) — reported honestly as an open
    observation within the provided mechanism; no cap, sink, added pool, or outside
    source is introduced.
  evidence:
    from_run: dnaa3-insim-readonly (in-sim listener, parquet listeners.dnaA_binding)
  provenance:
    run_ids:
    - dnaa3-insim-readonly
    verified_by: scripts/run_condition_multigen_parquet.py + cache_dnaa3 (ParCa --mode full)
- id: readonly-full-cycle-over-binding-open-observation
  kind: computational
  status: novel
  statement: |
    REAL numbers from the FULL-cell-cycle read-only observer artifact
