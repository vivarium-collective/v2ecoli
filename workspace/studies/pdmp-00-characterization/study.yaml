tests:
- name: ensemble-rng-seeding-divergence
  classification: primary
  description: Two baseline runs at master_seed=0 and master_seed=1, holding all else
    equal, produce trajectories whose ATP[c] and dry_mass time series diverge, with
    coefficient of variation across N=4 seeds > 1% at t=100s. Without this property,
    every multi-seed ensemble in this investigation is a single trajectory in disguise.
  measure:
    source: scripts/run_phase0_pilot_ensemble.py
    observable: ATP[c]_count
    reduce: std/mean across seeds
    units: fraction (dimensionless)
  pass_if:
    operator: greater-than
    threshold: 0.01
    field: cv_pct
  requires_simulation: phase0-pilot-N4
  cites:
  - v2ecoli_baseline
  - casella1992
- name: reference-ensemble-N64
  classification: primary
  description: "For each of the 3 Phase 0 conditions (M9-glucose, M9-acetate, M9-glucose+aa),\
    \ an N=64 stochastic ensemble \xD7 \u22651 generation \xD7 600 model-seconds exists\
    \ as a zarr store on disk. MCSE on every reported interface observable < 10% of\
    \ the smallest pairwise inter-condition effect size. Gating criterion for the\
    \ investigation: every downstream phase validates against this dataset."
  measure:
    source: .pbg/runs/phase0-reference/store.zarr
    observable: interface_dataset
    reduce: MCSE / min_pairwise_effect_size
    units: ratio (dimensionless)
  pass_if:
    operator: less-than
    threshold: 0.1
    field: mcse_ratio
  requires_simulation: phase0-reference-3x64
  cites:
  - casella1992
  - geyer1992
- name: markov-blanket-covers-all-major-processes
  classification: primary
  description: "Each of {metabolism, transcription, translation, replication, division,\
    \ membrane} has a written Markov-blanket schema enumerating parents, children,\
    \ and co-parents \u2014 formatted as a Process-Bigraph interface schema with input/output\
    \ port typing. No subprocess is left unschematized."
  measure:
    source: investigations/v2ecoli-pdmp/markov_blankets/
    observable: schema_coverage
    reduce: len(written_schemas) / len(major_subprocesses)
  pass_if:
    operator: equal
    threshold: 1.0
    field: coverage_fraction
  requires_simulation: none (design deliverable)
  cites:
  - pearl1988
  - koller2009
- name: marshalling-overhead-dominates
  classification: supporting
  description: "Per-step profiling shows that store\u2194process marshalling consumes\
    \ > 35% of per-step wall time across \u22651000 step samples, with bootstrap 95%\
    \ CI tight enough to distinguish from FBA LP and emitter I/O. Motivates the Phase\
    \ 4 column-centric runtime refactor; falsifies the alternative hypothesis that\
    \ essential biological computation is the bottleneck."
  measure:
    source: scripts/run_phase0_pilot_ensemble.py --profile
    observable: per_step_compute_breakdown
    reduce: marshalling_ms / total_ms
    units: fraction (dimensionless)
  pass_if:
    operator: greater-than
    threshold: 0.35
    field: marshalling_fraction
  requires_simulation: phase0-profile-instrumented
  cites: []
  cites_note: Engineering heuristic threshold (marshalling > 35% of per-step wall
    time) motivating the Phase-4 column-centric refactor; an internal performance
    criterion, not a literature-sourced band. No published source exists for this
    fraction; recorded as a provenance gap, not invented. (A later Phase-4 probe independently
    measured ~76% framework overhead, but that is internal evidence, not a citation.)
- name: growth-rate-condition-monotone
  classification: diagnostic
  description: 'Mean growth rate (1/h) ordered across the 3 conditions matches biology:
    M9+glucose+aa > M9+glucose > M9+acetate. Sanity check that the ParCa condition
    cache wiring works; if this fails, downstream Phase 1+ comparisons are meaningless.'
  measure:
    source: .pbg/runs/phase0-reference/store.zarr
    observable: instantaneous_growth_rate
    reduce: mean over time, sorted by condition
    units: 1/h
  pass_if:
    operator: ordering
    expected:
    - M9+acetate
    - M9+glucose
    - M9+glucose+aa
  requires_simulation: phase0-reference-3x64
  cites:
  - macklin2020
embed_visualizations:
- name: v2ecoli baseline 100 steps
  url: /reports/figures/pdmp-00/v2ecoli_baseline_100step.html
  description: Per-study visualization rendered from reports/figures/pdmp-00/v2ecoli_baseline_100step.html.
    Inlined into the downloaded report as iframe srcdoc. Representative single-cell
    baseline (~14% of one doubling cycle).
discovery_implications:
  resolved_uncertainties:
  - The per-process RNG-seeding bug (diagnosed via a 3-seed pilot that produced CV
    0.000% across seeds) is fixed (each stochastic process seeds from crc32(process_name,
    master_seed)); multi-seed ensembles now diverge (CV > 1% at t=100 s), so every
    downstream ensemble is a genuine sample, not one trajectory in disguise.
  - A fresh N=6 x 250 model-second M9-glucose pilot ensemble (.pbg/runs/phase0-traj/)
    ran successfully on the merged branch with trajectories that genuinely diverge
    across seeds (ATP[c] CV ~ 0.029%); a single-condition pilot, explicitly not the
    3-condition x N=64 x 600 s canonical reference, which is not committed in this
    checkout and is being re-run. Earlier cross-condition ATP ratios (glucose:acetate
    3.85x, +aa:glucose 1.97x) are from a prior uncommitted run and await the re-run
    before being re-asserted.
  remaining_uncertainties:
  - 'Multi-generation zarr trajectories via XArrayEmitter are not yet produced (composite.run()
    does not auto-attach the emitter; task #39); only single-generation endpoint +
    per-tick listener JSON exists today, so the multi-gen lineage statistics Phase
    2 needs are missing.'
  - The typed PB Markov-blanket interface schemas (6 subprocesses) and the per-step
    marshalling-vs- essential compute profile are specified as planned readouts but
    not yet emitted as deliverables.
  alternate_hypotheses:
  - id: essential-compute-dominates
    statement: Per-step wall time is dominated by essential biological computation
      (the FBA LP solve), not by store-process marshalling, which would refute the
      Phase-4 column-centric motivation.
    why_plausible: The 55-process WCM runs a multi-objective FBA LP every tick, and
      LP solves are classically the expensive step in constraint-based metabolic models.
    mechanism_elements_affected:
    - per-step-compute-profile
    - marshalling-overhead
    discriminating_observables:
    - marshalling_ms / total_ms fraction over >=1000 step samples with bootstrap 95%
      CI
    - FBA-LP-solve bucket vs marshalling bucket
    evidence_for: []
    evidence_against:
    - 'Phase 4 sprint 2 later measured 13,817 isinstance + 4,213 __array_finalize__
      calls/tick (76% framework overhead): marshalling, not the LP, dominates.'
  mechanism_update_proposals:
  - mechanism_node_or_edge: per-process-rng-seeding
    update_type: revise
    rationale: Each stochastic process must seed its RNG from hash(master_seed, process_name)
      rather than inheriting a single cache-derived seed; without this the WCM is
      not a valid stochastic- ensemble generator. Adopted in v2ecoli/composites/baseline.py.
    requires_expert_approval: false
  followup_study_proposals:
  - id: pdmp-00-multigen-zarr
    title: Multi-generation XArrayEmitter reference ensemble
    study_type: data_generation
    source_trigger: open_deliverable
    proposed_experiment: Wire XArrayEmitter into composite.run() and re-run the 3
      x N=64 ensemble over >=3 generations with max_generations=8, emitting per-(condition,
      replicate, generation) zarr stores for streaming distribution comparison.
    expected_information_gain: high
    expert_gate_required: false
  - id: pdmp-00-interface-schemas
    title: Typed PB Markov-blanket interface schemas for all six subprocesses
    study_type: design_deliverable
    source_trigger: open_deliverable
    proposed_experiment: Write Process-Bigraph interface schemas (parents/children/co-parents
      with port typing) for metabolism, transcription, translation, replication, division,
      membrane; gate on full coverage (no unschematized subprocess).
    expected_information_gain: medium
    expert_gate_required: false
findings:
- id: rng-seed-diversity-fixed
  kind: computational
  status: confirms
  statement: Per-process RNG seeding (crc32(process_name, master_seed)) makes multi-seed
    ensembles genuinely diverge; v2ecoli's bare `seed` only seeded the allocator,
    leaving ensembles bit-identical.
  evidence:
    from_test: test_baseline_diverges_under_different_seeds
    observed: N=6 x 250s M9-glucose pilot ATP[c] CV ~ 0.029% across seeds (>0); tests/test_seed_diversity.py
      PASS
  next_action: Extend to the committed 3-condition reference ensemble for the full
    interface standard.
  next_action_type: replicate
- id: phase0-reference-ensemble-real
  kind: computational
  status: confirms
  statement: 'A real 3-condition Phase-0 reference ensemble exists (M9-glucose / acetate
    / +aa, N=32 x 600s each), replacing the previously-uncommitted 192-run claim.
    Scope: N=32, not the N>=64 canonical gating target, so the investigation gate
    is not met by this ensemble.'
  evidence:
    from_run: phase0-traj{,-acetate,-with_aa} (N=32 x 600s, 96 runs)
    observed: 96 trajectory runs (N=32 x 3 conditions); cell/dry/water masses finite
      and ordered by doubling time. Raw per-seed stores are gitignored / NOT committed;
      the committed artifacts are phase0_ensemble_provenance.json + the phase0_*REAL/AUTO
      figures.
  provenance:
    run_ids:
    - phase0-traj
    - phase0-traj-acetate
    - phase0-traj-with_aa
