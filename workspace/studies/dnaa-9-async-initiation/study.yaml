        Asynchronous initiation over-replicates without a re-init control. The hydrolysis rate puts the
        DnaA-ATP fraction in [0.2,0.5] (top) and the trigger fires at full oriC-low occupancy (1.0), but
        because each oriC initiates independently with nothing throttling re-initiation, oriC runs to
