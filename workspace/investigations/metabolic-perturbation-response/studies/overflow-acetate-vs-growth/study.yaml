schema_version: 4
name: overflow-acetate-vs-growth
investigation: metabolic-perturbation-response   # owning investigation (back-reference)
title: "Does v2ecoli reproduce the aerobic acetate-overflow curve (acetate vs growth rate) — Basan 2015?"
created: '2026-06-15'
status: in-progress
kind: confirmatory   # tests a pre-declared experimental relationship (Basan 2015 overflow curve)

# Canonical 6-axis status. Baseline-FBA arm run + graded (2026-07-22); the two
# Millard arms are still unbuilt, and the titration premise needs revisiting
# (see `caveats` below) before the verdict carries much weight.
design_status: in-progress
implementation_status: partial      # baseline-FBA arm only; Millard arms unbuilt
simulation_status: run              # 6-cap light sweep, 1 seed x 2 gens
evaluation_status: evaluated        # baseline arm graded: mismatch (no overflow)
gate_status: planned
expert_review_status: pending

question: |
  Across a glucose-uptake-rate titration, does v2ecoli reproduce the aerobic
  acetate-overflow response — acetate secretion rising ~linearly with growth rate
  above a critical threshold (Basan 2015) — and how do the FBA baseline, the
  Millard kinetic ODE, and the v2ecoli+Millard FBA-bridge arms compare?

report:
  title: "overflow-acetate-vs-growth — v2ecoli acetate response vs Vemuri 2006 / Basan 2015"
  verdict: mismatch          # baseline-FBA arm: no overflow across the sweep
  confidence: low            # see `caveats` — the titration does not move growth rate
  evidence_quality: preliminary
  caveats: |
    Two findings from the 2026-07-22 run limit how much this verdict carries.

    1. THE TITRATION DOES NOT TITRATE GROWTH. Across a 5.6x glucose-uptake range
       (caps 1-6; the cap binds exactly at 1-4, goes slack above ~5.6) the emergent
       growth rate moves only 0.954 -> 0.925 /h, non-monotonically. Division runs on
       the D-period replication clock (`d_period=True`, the vEcoli default), where the
       dry-mass threshold is deliberately ignored (v2ecoli/steps/division.py:181-190),
       so mean division time — and hence the mu this study reads out — is set by
       replication timing, not carbon supply. The acetate-vs-growth-rate framing
       assumes carbon uptake drives mu; in this model it does not. The graded x-range
       is therefore ~0.03 /h wide, all of it above the reference onset (lac 0.408).

    2. CARBON BALANCE FAILS UNDER A BINDING CAP. At cap=1 the model takes up
       6.0 mmolC/gDCW/h as glucose and secretes 11.6 mmolC/gDCW/h as CO2 — about 2x
       the carbon in, while still growing — tripping the assumption-free
       `violation_C_created` flag. CO2 output RISES as glucose is restricted
       (11.62 / 5.00 / 1.82 at caps 1 / 2 / 6). Biomass yield tracks the same
       non-physicality: 5.30 / 2.59 / 0.92 gDW/g glucose at caps 1 / 2 / 6, against a
       literature range of 0.36-0.54 and a thermodynamic ceiling near 0.5. Undiagnosed.

    The verdict below (acetate = 0.0 at every cap, so "no overflow") is the PREDICTED
    baseline-FBA outcome and is consistent with the basal card, but it is graded on a
    degenerate sweep. Read it as "overflow physiology is absent", not as a quantitative
    curve comparison.
  objective: |
    Sweep the carbon-uptake knob (glucose uptake rate / glucose concentration)
    and read out the acetate-secretion and O2 response as a function of the
    resulting growth rate, for three arms (baseline FBA / Millard kinetic ODE /
    v2ecoli+Millard FBA-bridge). Grade each arm's response CURVE against the
    Basan 2015 acetate-vs-growth-rate curve with the planned `curve_response`
    criterion (onset growth-rate threshold + overflow slope). A CHARACTERIZATION
    of where the model reproduces overflow physiology — state + trend, not a
    pass/fail.
  setup: |
    PLANNED. Control knob = glucose uptake rate, swept via a bespoke runner
    (declarative sweeps are not yet runnable in the framework, so a
    `canonical_runs` script executes the titration). Reference x-axis = growth
    rate (an emergent model output at each knob setting), matching how Basan
    reports the curve — and matching the causal direction of Basan's experiment,
    which titrates transporter EXPRESSION (Pu-ptsG, inducer 3MBA) → carbon uptake
    → emergent growth rate (a chemostat would invert this: clamp growth, let
    uptake follow). Arms reuse the composites from ketchup-baseline-comparison:
    baseline FBA (v2ecoli.composites.baseline), the Millard kinetic ODE, and the
    live FBA-bridge (millard_fba_bridge_harness). Reference = the ecoli-sources
    `perturbation__overflow__acetate_vs_growth` slot: Vemuri 2006 (MG1655
    glucose-limited chemostat) is the PRIMARY graded curve — it co-measures glucose
    uptake, so the acetate-carbon yield Y_ac = (2·acetate)/(6·glucose) is raw per
    point; Basan 2015 `ptsG_glucose` (NCM3722) rides along as context via the SI
    closed form, plus an independent MG1655 ¹³C anchor. Grading is shape-first on the
    dimensionless Y_ac, which cancels per-OD vs per-gDCW on both sides — so the
    OD600→gDCW factor flagged in inputs/notes/basan2015.md is NOT needed (resolved
    2026-06-24; that note is superseded).
    Key test: overflow is a constraint phenomenon — plain growth-max FBA respires
    fully and excretes no acetate (the ketchup baseline finding), so this grades
    whether v2ecoli encodes the proteome/respiration limit that makes overflow
    emerge (baseline-FBA predicted no overflow; the kinetic/bridge arms may differ).
  # report_cards: <built at Evaluate — docs/report_cards/metabolic_perturbation/overflow_acetate_vs_growth/>

bibliography:
  bib_keys:
  - basan2015

assumptions:
- text: |
    The acetate exchange flux (ACET[p], listeners.fba_results.external_exchange_fluxes)
    is the model observable for overflow; growth rate is read from the mass listener.
  verified_in_v2ecoli: false   # to confirm at Build
- text: |
    A glucose-uptake-rate (or glucose-concentration) titration moves the model
    along a growth-rate axis comparable to Basan's, on the existing glucose ParCa
    cache — no new data bundle needed for this condition. (Mirrors Basan's
    transporter-titration causal direction: set uptake → growth emerges.)
  verified_in_v2ecoli: false   # to confirm at Build
- text: |
    The OD600→gDCW factor used to convert Basan's reported Jac (mM/OD600/h) to the
    model's acetate exchange flux (mmol/gDCW/h) is an EXTERNAL assumption (not in
    Basan 2015) — either import a sourced NCM3722 factor or grade in per-OD units
    by converting the model side. See inputs/notes/basan2015.md.
  verified_in_v2ecoli: false   # build-time decision

conditions:
  # Arms reused from ketchup-baseline-comparison. The GUR titration itself is
  # executed by a planned bespoke canonical_runs runner (sweep gap), not as
  # enumerated dashboard variants.
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      cache_dir: out/cache
  variants:
  - name: fba-bridge
    composite: v2ecoli.composites.millard_fba_bridge_harness.millard_fba_bridge_harness
    params:
      cache_dir: out/cache
      seed: 0
  model_settings:
  - name: glucose-uptake-titration
    gate: required
    detail: "The swept control knob: glucose uptake rate (or glucose concentration) titrated across a range on the existing glucose ParCa cache (out/cache). Executed by a planned canonical_runs sweep runner — declarative simulation_set sweeps are not yet runnable in the framework."
  - name: millard-arm
    gate: optional
    detail: "Millard 2017 central-carbon kinetic ODE arm (the flux source behind the FBA-bridge). Included to test whether the kinetic core induces overflow the baseline FBA misses."
  - name: basan2015-reference-curve
    gate: required
    detail: "Reference: Basan 2015 Fig-1 acetate-vs-growth source data (investigation input basan2015-acetate-vs-growth, POPULATED — inputs/datasets/basan2015_acetate_vs_growth.csv). Grade against the `uptake_titration` series (`ptsG_glucose` = NQ1243 Pu-ptsG, the direct glucose-uptake-titration match; `lacY_lactose` secondary). The `carbon_source` / `carbon_source_aa` series are earmarked for the future carbon-source study, not graded here. The curve_response criterion grades onset λac (≈0.7–0.8 h⁻¹) + overflow slope. Units: mM/OD600/h → mmol/gDCW/h needs an external OD600→gDCW factor (see inputs/notes/basan2015.md)."
  - name: curve-response-criterion
    gate: required
    detail: "NET-NEW grading: a `curve_response` criterion (planned, to be added to v2ecoli card_criteria.py and carved to main as a feature PR) emits a within_tol/drift/mismatch verdict for the 'overflow' card group from the swept (growth_rate, acetate) response vs the Basan curve. Surfaced to the framework via the existing report_card_axis workspace evaluator + report_card_verdict.json."

tests:
# Build-phase grading is not wired yet: report_card_axis returns 'ungraded'
# (gracefully) until docs/report_cards/.../overflow_acetate_vs_growth/report_card_verdict.json
# exists with an 'overflow' group populated by the curve_response criterion.
- name: v2ecoli-reproduces-acetate-overflow-onset
  classification: primary
  status: stub
  question: Does v2ecoli's acetate response show the Basan overflow onset (acetate rising above a critical growth rate)?
  measure:
    kind: report_card_axis
    card: docs/report_cards/metabolic_perturbation/overflow_acetate_vs_growth
    group: overflow
    detail: "Overflow group graded by the planned curve_response criterion (onset growth-rate threshold + overflow slope) vs the Basan 2015 acetate-vs-growth curve, across the baseline / Millard / FBA-bridge arms. Group verdict = worst axis."
  cites: [basan2015]
  pass_if:
    op: report_card_group_within_tol   # advisory label; the report_card_axis evaluator returns the outcome

pipeline_gate:
  prerequisites: []
  enables: []
  gate_status: planned

# Bespoke sweep runner (declarative simulation_set sweeps aren't runnable in the
# framework). At each glucose-uptake cap it runs the basal-card ensemble
# (run-to-division, Ray), then extracts μ (build_cell_records doubling_time) +
# exchange phenotype (extract_vectors) and derives biomass yield + carbon balance.
# Knob = the V2ECOLI_GLC_UPTAKE_CAP_AEROBIC env var (external_state.py).
# STATUS: extraction validated against the existing basal sweep (--from-sweep);
# the live run path (env-var cap -> ensemble) is not yet end-to-end validated.
canonical_runs:
- name: gur-titration
  default: true
  label: "GUR titration (baseline): sweep glucose-uptake cap -> doubling-time mu + acetate + yield + carbon balance"
  script: workspace/investigations/metabolic-perturbation-response/studies/overflow-acetate-vs-growth/sims/run_gur_titration.py
  args: ["--caps", "1,2,3,4,5,6", "--n-seeds", "3", "--generations", "3", "--gen-lb", "1"]

runs: []
