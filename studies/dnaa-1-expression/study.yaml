        # cache's baked 0.0017 is irrelevant to the chosen value below.
      n_steps: 34440    # 7 generations × 82 min/cycle × 60 s/min
      single_daughters: true
      max_generations: 7
      initial_state_path: out/steady_state_inputs/succinate_default_gen3_start.dill
      perturbations:
        "TU00259[c]": 1.1e-3   # Mechanism A: dnaA per-promoter init_prob — CANONICAL.
        # 7-point sweep + multiseed 2026-06-08 (Rashmi). At 1.1e-3, on Rashmi's
        # generation-average criterion, the DnaA pool (steady-gen cycle-mean 676)
        # is in [300,800] AND the dnaA init rate (gens 4-7 0.94/1.05/1.04/0.97,
        # mean 1.00/min) is on the ~1/min target — BOTH met. oriC clean 1↔2.
        # Set at run time via --perturbation 'TU00259[c]=1.1e-3' (OVERRODE
        # cache-baked 0.0017, recorded in run_config.perturbations). Supersedes
        # the interim 0.8e-3 (in-band but rate sub-physiological at 0.46-0.71/min).
        # HONEST: the strict whole-oscillation-≤800 is NOT met (per-cycle peak
