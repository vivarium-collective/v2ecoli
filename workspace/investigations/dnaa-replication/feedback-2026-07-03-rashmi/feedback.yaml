      text: "30s dwell is too much i think. Because it delays replication initation which causes the cell mass peaks to drift upwards compared to the previous plot where you had multiple initations. Try adding another gate for the presence of a positive bulk gradient for firing cooperativity. This would allow us to distinguish between parent and daughter chromosomes. You can also tune the stuck threshold accordingly to make it fire once per generation. According to the critical initiation mass threshold, cell mass per oriC for initiation was around ~730 fg. If all our cells are starting off with a mass higher than that, that would be an artificial lineage. Also, remove SeqA. I think the behavior can be achieved this way without adding seqA."
