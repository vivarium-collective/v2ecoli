schema_version: 4
name: ko-and-media
investigation: perturbation-demo
title: "Knockout and media perturbations on the baseline whole cell"
question: |
  How do a translation-level gene knockout (lacY) and an amino-acid-rich medium
  each move the v2ecoli baseline off its wild-type trajectory — and how do you
  express each as a one-line variant of the baseline composite?
status: evaluated

# Single-generation growth run (1500 steps, single cell, seed 0, pre-division) of
# all three arms. Direct composite runs (not the workbench run machinery), so no
# runs.db; the growth-trajectory figure + trajectories.json under figures/ are the
# artifacts.
report:
  verdict: pass
  confidence: high
  evidence_quality: 1500-step single-cell run of all three arms, seed 0
  # The growth-comparison figure renders on the dashboard from
  # reports/figures/ko-and-media/growth_comparison.html (auto-discovered embed);
  # the raw PNG + trajectories.json under this study's figures/ are the artifacts.
  result: |
    Dry mass over 1500 steps (see the Growth comparison figure):
    - wild-type:  380.62 -> 547.69  (+43.89%)
    - lacY-KO:    380.62 -> 547.69  (+43.89%)  — BYTE-IDENTICAL to wild-type.
        The knockout reaches the live PolypeptideInitiation process (exactly one
        translation efficiency zeroed = lacY) but is phenotypically SILENT in
        glucose-minimal (lac operon not needed): the two trajectories overlap
        exactly. The intended demonstration — the mechanism reaches the process
        without confounding growth.
    - rich-media: 380.62 -> 559.47  (+46.99%)  — grows faster.
        minimal_plus_amino_acids diverges above the minimal arms from ~step 450;
        amino-acid-rich medium relieves biosynthetic demand. In-cache media shift,
        no ParCa re-fit.
findings:
- id: ko-reaches-process-silent-in-glucose
  kind: computational
  status: confirms
  statement: "baseline(knockouts=['EG10526']) zeroes exactly the lacY translation
    efficiency on the live process; growth is unchanged in glucose-minimal
    (correct — lacY is dispensable without lactose)."
- id: rich-media-grows-faster
  kind: computational
  status: confirms
  statement: "baseline(media='minimal_plus_amino_acids') reaches +46.99% dry mass
    vs +43.89% for minimal over 1500 steps (diverges from ~step 450) — the
    in-cache media shift takes effect via media_update without a ParCa re-fit."

# Two minimal perturbation levers, one variant each. Both are plain baseline
# params (forwarded to the composite generator as-is), so a variant is just a
# `params:` block over the wild-type baseline — no separate composite, no ParCa
# re-fit. The wild-type baseline is the reference every contrast is taken against.
conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      seed: 0
    # Wild type: plain baseline — minimal-glucose medium, no knockouts.

  variants:
  - name: lacY-knockout
    perturbation: "translation-level knockout of lacY (EG10526)"
    params:
      seed: 0
      knockouts: [EG10526]   # lacY — lactose permease
    expected_contrast: |
      lacY protein is no longer synthesised (its translation efficiency is zeroed
      on the live PolypeptideInitiation process). In glucose-minimal this is
      phenotypically near-silent — the lac operon is not needed — which is the
      point: it shows the knockout mechanism reaches the process without
      confounding the demo with a growth collapse. Swap in a gene the condition
      needs to see a phenotype.
    # Equivalent direct call:
    #   baseline(seed=0, knockouts=["EG10526"])

  - name: rich-media
    perturbation: "growth medium minimal -> minimal_plus_amino_acids"
    params:
      seed: 0
      media: minimal_plus_amino_acids
    expected_contrast: |
      An amino-acid-rich medium relieves biosynthetic demand, so the cell grows
      faster than on minimal (verified: higher dry-mass accumulation over a short
      run). A lightweight in-cache media shift — the media_update step applies the
      condition on tick 1; no per-condition ParCa re-fit.
    # Equivalent direct call:
    #   baseline(seed=0, media="minimal_plus_amino_acids")

  model_settings: []

tests:
- name: ko-reaches-process
  classification: primary
  question: "Does the lacY knockout zero the translation efficiency on the live PolypeptideInitiation process?"
  measure:
    kind: composite_state
    path: agents.0.ecoli-polypeptide-initiation
  expect:
    op: eq
    note: "translation_efficiencies[lacY monomer] == 0 (unit-asserted in tests/test_ko_composites.py)"
- name: rich-media-grows-faster
  classification: primary
  question: "Does minimal_plus_amino_acids accumulate more dry mass than minimal over the run?"
  measure:
    kind: readout
    observable: listeners.mass.dry_mass
  expect:
    op: gt
    note: "dry-mass increment on rich media > minimal (directional; demonstration only)"
