implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Extract pPromoterBound['basal'] per TF and pair it with measured runtime occupancy.
  detail: pPromoterBound recovers from models/parca/parca_state.pkl.gz (23 TFs; median basal 0.444, LexA
    0.5192). Runtime occupancy comes from bound_TF_coordinates in dnag-promoter-availability's sweep,
    matched to each TU's replication_coordinate. Only TFs whose sites are observable that way can be paired
    -- the count of unpairable TFs must be reported, not silently dropped.
- id: req-2
  status: not_started
  blocking: true
  summary: State the occupancy-corrected expected value BEFORE computing it.
  detail: 'The correction to be graded: if alpha already embodies pPromoterBound worth of TF effect, then
    the quantity comparable to 2**log2FC is not 1 + delta/alpha but the ratio between the fully-bound
    and basal-occupancy states. Writing the formula into the record before evaluating it, exactly as deltav-conversion-diagnosis''s
    req-2 required, because that discipline is what let its failed prediction stand as a refutation rather
    than be quietly narrowed.'
alternative_hypotheses:
- name: H1 occupancy calibration offset
  discriminator: occupancy-correction-explains-the-overshoot
  statement: 'alpha is fitted with TFs at pPromoterBound occupancy, delta is applied at runtime occupancy,
    and comparing delta/alpha to 2**log2FC double-counts what alpha already contains. Predicts activators
    inflate and free repressors stay put. Leading candidate: LexA''s assumed 0.5192 against a measured
    0.963-1.000 is exactly this gap.'
- name: H2 a separate activator-specific defect
  discriminator: occupancy-correction-explains-the-overshoot
  statement: The occupancy correction fails to bring activators into band, meaning something in the activating
    branch of the fit is wrong for another reason. Predicts the correction axis FAILS while the repressor
    control PASSES.
- name: H3 the comparison target is wrong for activators
  discriminator: correction-preserves-repressor-fidelity
  statement: 2**log2FC is simply not what an activator's delta encodes, making the over-shoot an artefact
    of foldchange-to-delta-fidelity. Would likely also disturb repressors under the same correction, which
    the control detects.
falsifiability: 'The repressor control is what makes this study falsifiable rather than a fitting exercise:
  free repressors already sit at 0.9959, so any correction tuned until activators look right will break
  them and be caught. req-2 forces the correction to be written down first.'
simulation_set: []
planned_runs:
- name: reuse-promoter-sweep
  status: planned
  n_steps: 0
  details: NO NEW SIMULATION. Fit side from parca_state.pkl.gz; runtime occupancy from dnag-promoter-availability's
    6-seed sweep; the 564-entry join reused from foldchange-to-delta-fidelity.
robustness:
  n_replicates: 6
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  parameter_sweep: false
  note: Occupancy is stochastic, so the 6 independent seeds matter; the fit side is deterministic.
controls:
- name: correction-preserves-repressor-fidelity
  kind: negative
  hypothesis: A correction that fixes activators by breaking the already-faithful repressors is a refit,
    not a fix.
  expected: free repressors stay within [0.67, 1.5], from 0.9959.
  observed: ''
  result: PENDING
limitations:
- Only TFs whose binding sites are observable in bound_TF_coordinates can be paired with a pPromoterBound
  value; the unpairable count is reported but those TFs contribute nothing.
- Runtime occupancy is per-TU, inheriting the per-promoter limitation identified in pc00010-repression-arithmetic.
- All runtime occupancy is measured in a stalling lineage, so it may not represent healthy growth.
- If H3 holds, the fold-change comparison is wrong for activators and this study's premise -- inherited
  from foldchange-to-delta-fidelity -- is itself the error.
claim: ''
conclusion: ''
confidence: Planned
