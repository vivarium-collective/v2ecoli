findings:
- summary: Removing ppGpp regulation recovers 16.6x of dnaG's transcription deficit, from 47.4x below
    its ribosomal-protein peers to 2.85x.
  status: confirms
  evidence:
    from_test: dnag-transcription-recovers
    observed: 2.85
    units: fold deficit vs idx_rprotein peers
  explanation: Measured in the matched generation-1 window where both arms run tau=43.0 min and divide,
    so it is not an artefact of the off arm's pathological later generations; the ratio is stable at 2.87x
    over generations 1-3. dnaG sits at 0.686 of its fitted basal_prob with ppGpp off against 0.045 with
    it on. This is the direct mechanistic confirmation that the ppGpp substitution, not the ParCa fit,
    is what starves dnaG -- the middle link of the chain this investigation has been tracing.
- summary: 'The rescue nonetheless fails: no ppGpp-off lineage survives, and the arm is globally disrupted.'
  status: contradicts
  evidence:
    from_test: lineage-completes-with-ppgpp-off
    observed: 3
    units: generations divided
  explanation: '0 of 3 seeds reached 12 generations. Generation time degrades 3.0x by generation 3 against
    1.26x in the paired control, so the negative control fires and any DnaG-specific reading is confounded.
    ppGpp regulation is therefore not an optional overlay on the fitted basal_prob: the model depends
    on it for growth homeostasis, which removes ''revert to basal_prob'' as an available fix for the fit-runtime
    mismatch.'
- summary: 'RETRACTED: HolA''s negative gate margin does not make it limiting. A margin is not a binding
    constraint.'
  status: novel
  evidence:
    from_run: replisome-gate-sufficiency__dnag-ablation
    observed: 12
    units: generations completed with HolA still gated
  explanation: 'RETRACTED 2026-09-03 on the user''s challenge, and the retraction is evidenced. The original
    claim read ''DnaG is limiting first, not uniquely'' from HolA (delta) having the worst min-margin
    in off-arm generations 3-4. That inference is invalid: min-over-generation margin is pool depth sampled
    at arbitrary times, including times when no initiation was attempted. Initiation is triggered by MASS;
    the subunit gate is only a veto consulted at the moment mass fires. A pool is limiting only if it
    vetoes an initiation that would otherwise have occurred.

    Refuted directly by replisome-gate-sufficiency''s dnag-ablation arm, which dropped ONLY EG10239-MONOMER[c]
    and left HolA and HolB in the gate: 5 of 5 seeds completed 12 generations at tau 52-60 min, and HolA''s
    margin still went negative in 3 of 30 sampled generations without blocking anything.

    The correct test is causal, and it separates the two cleanly: removing DnaG''s requirement rescues
    the lineage, so DnaG IS limiting; HolA remained required across that same rescue, so it is not. To
    establish any future limiting claim, measure which pool is short at the timesteps where initiation
