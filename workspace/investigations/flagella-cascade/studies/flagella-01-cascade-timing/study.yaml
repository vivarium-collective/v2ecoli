schema_version: 3
name: flagella-01-cascade-timing
title: "Flagella Class II -> Class III cascade timing under the K&A SUM-gate"
description: |
  First study of the flagella-cascade investigation. Runs the baseline composite
  with the opt-in `flagella_regulation` feature and asks whether the Kalir & Alon
  SUM-gate + FlgM secretion gate reproduce the ordered Class II -> Class III
  transcriptional cascade, while leaving the rest of the cell unperturbed when the
  feature is off.
topic: regulation
tags: [flagella, transcription-regulation, kalir-alon, sigma28, flgM, fliA, flhDC, sum-gate, ported-from-vecoli-biofilm]
created: '2026-06-20'

status: in-progress
phase: Simulate

design_status: complete
implementation_status: complete    # both Steps ported, wired as flagella_regulation feature, cache rebuilt
simulation_status: partial         # smoke runs OK (feature on writes overrides; feature off neutral); timing sweep pending
evaluation_status: not_evaluated
gate_status: pending
expert_review_status: not_requested

baseline:
  composite: v2ecoli.composites.baseline.baseline
  params:
    seed: 0
    cache_dir: out/cache
    features: ['flagella_regulation']

purpose:
  question: |
    Does the ported cascade produce Class II init_prob_override rising before
    Class III, with Class III gated until complete flagella (CPLX0-7452) accumulate
    and FlgM (G369-MONOMER) is secreted, releasing free FliA (EG11355-MONOMER)?
  mechanism: |
    - ecoli-flagella-transcription-regulation (Step): X=[FlhDC]/(K+[FlhDC]),
      Y=[free FliA]/(K+[FliA]); Class II override = p_i/p_i_ref * basal_prob,
      Class III override = Y * basal_prob; written to promoters.init_prob_override.
    - ecoli-flagella-flgm-secretion (Step): exported = min(FlgM,
      round(n_flagella * 0.1 * dt)); depletes G369-MONOMER[c].
    - FLGM-FLIA-CPLX equilibrium (sim_data) sequesters FliA; secretion shifts it
      to release sigma-28, opening Class III. flgM is itself a Class III gene
      (negative feedback that caps FliA).
  expected_outcome: |
    Class III override trajectory lags Class II; free FliA stays bounded; with the
    feature off, init_prob_override stays 0 and global cell behavior is unchanged
    (the seam is a verified no-op).

behavior_tests:
  - id: feature-off-neutral
    statement: |
      With flagella_regulation OFF, promoters.init_prob_override is 0 for every
      promoter across a 30 s run, and the cell grows normally.
    status: passing      # verified during the port (0 nonzero overrides after 30 s)
  - id: gate-writes-overrides
    statement: |
      With the feature ON, the SUM-gate writes nonzero init_prob_override onto the
      flagella Class II/III promoters within the first few ticks.
    status: passing      # verified: 17 nonzero overrides after 10 s
  - id: classIII-lags-classII
    statement: |
      Over a multi-minute run, the mean Class III override rises later than the
      mean Class II override (timed cascade).
    status: planned
  - id: fliA-bounded
    statement: |
      Free FliA (EG11355-MONOMER[c]) does not run away — the flgM negative-feedback
      loop holds it within a plausible band relative to its initial pool.
    status: planned

notes: |
  Ported from Maya Abdalla's vEcoli `biofilm` branch. Cache rebuilt locally with
  fast-mode ParCa (matches the shipped fixture's mode); the committed ParCa
  fixture and parity golden are intentionally left untouched. A full --mode full
  ParCa re-run is the recommended calibration follow-up before any quantitative
  claims about absolute expression levels.
