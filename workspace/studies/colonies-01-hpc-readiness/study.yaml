  - wall_seconds
  - peak_rss_mb
  - per_tick_latency_ms
  - per_cell_update_ms
  - pymunk_step_ms
  applies_tests:
  - per-cell-cost-within-2x-reference
  status: gated
  blocked_by_requirements:
  - req-1-perf-harness
  - req-2-daughter-hydration-fix
- name: bio-1cell-natural-division
  base_model: v2ecoli.composites.ecoli_colony.ecoli_colony
  perturbation:
    n_cells: 1
  condition: pure-WC, 1 cell, run past one natural division
  duration_min: 75
  seeds:
  - 0
  readouts:
  - colony_cell_count
  - per_cell_dry_mass
  - division_events
  - wall_seconds
  - per_tick_latency_ms
  - per_cell_update_ms
  - pymunk_step_ms
  - peak_rss_mb
  applies_tests:
  - daughters-hydrated
  - per-cell-cost-within-2x-reference
  status: ready
model_change:
  base_model: v2ecoli.composites.ecoli_colony.ecoli_colony
  new_processes: []
  new_state_variables: []
  new_parameters: []
  modified_processes:
  - name: EcoliWCM._handle_division
    why: 'Current emission of {agents: {_remove, _add}} does not appear to

      hydrate daughter EcoliWCMs through the outer composite engine

      (reports/colony_report.py works around this by manually building

      standalone EcoliWCMs for daughter IDs). Fix is required for Build

      acceptance.

      '
    status: required
    requirement_id: req-2-daughter-hydration-fix
  new_listeners: []
  notes: 'No biological model changes. The only code work is (a) fix daughter

    hydration in the colony composite, (b) build the perf harness as a

    sim driver under sims/.

    '
key_assumptions:
- "Pure-WC colony at N=2 is feasible to run past 2 generations within ~90 min sim\
  \ time on a developer laptop (40-min doubling \xD7 2 + slack)."
- The dominant per-tick cost is the inner EcoliWCM update, not pymunk integration
  (validated by per-tick split in the harness).
- "Peak RSS measured with psutil after each run captures the steady-state RAM cost\
  \ per cell accurately enough for HPC extrapolation (\xB120%)."
- "Single-machine N-sweep extrapolates monotonically to per-node HPC sizing \u2014\
  \ i.e. no surprise breakdowns from network or filesystem at HPC scale that aren't\
  \ visible here. (This is the assumption colonies-02 will test directly.)"
readouts:
- name: colony_cell_count
  description: "Number of live agents in the colony at each tick (live cell IDs in\n\
    state['cells'] or state['agents'] \u2014 depends on the composite's wiring).\n"
  store_path: cells
  reduce:
    kind: dict_size
  units: cells
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: per_cell_dry_mass
  description: 'Per-cell dry mass series, from each cell''s `mass` store driven by

    EcoliWCM._read_outputs.

    '
  store_path: cells.<id>.mass
  units: fg
  status: available
- name: division_events
  description: 'Per-cell wall-clock + sim-time stamps of division events, recorded

    by the perf harness when it observes the {_remove, _add} structural

    update on the cells map.

    '
  store_path: derived
  units: events
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: wall_seconds
  description: End-to-end wall time of the run.
  store_path: derived
  units: seconds
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: peak_rss_mb
  description: Peak resident set size of the run process, via psutil.
  store_path: derived
  units: megabytes
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: per_tick_latency_ms
  description: 'Distribution of wall-time per composite tick (one row per tick in

    runs.db). Reduced to {p50, p95, p99, max} in the Decide report.

    '
  store_path: derived
  units: milliseconds
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: per_cell_update_ms
  description: 'Time spent inside each EcoliWCM.update() per tick, summed over cells.

    Captured by monkey-patching EcoliWCM.update in the harness, or by a

    lightweight timing decorator.

    '
  store_path: derived
  units: milliseconds
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
- name: pymunk_step_ms
  description: 'Time spent inside the pymunk physics step per tick. Same instrumentation

    pattern as per_cell_update_ms but on the multibody process.

    '
  store_path: derived
  units: milliseconds
  status: derived-needed
  blocked_by_requirements:
  - req-1-perf-harness
behavior_tests:
- name: daughters-hydrated
  classification: primary
  description: 'After the first division event in the build-smoke-n2 run, both

    daughter agent IDs appear in the cells map AND both continue to

    advance (mass changes, EcoliWCM.update called) on subsequent ticks

    without the manual standalone-WCM workaround that exists in

    reports/colony_report.py.

    '
  measure:
    kind: post_division_advance
    cells_path: cells
    advance_signal: mass_delta_nonzero
    window: post_first_division
  pass_if:
    op: all_daughters_advance
  units: bool
  requires_simulation: build-smoke-n2
- name: two-generations-complete
  classification: primary
  description: "Pure-WC N=2 colony reaches \u22654 live cells by end of run (both\n\
    mothers divided), with all four cells advancing on the final tick.\n"
  measure:
    kind: live_cell_count
    cells_path: cells
    advance_signal: mass_delta_nonzero
    window: final_tick
  pass_if:
    op: at_least
    threshold: 4
  units: cells
  requires_simulation: build-smoke-n2
- name: reference-perf-recorded
  classification: supporting
  description: "The N=1 reference run completed and recorded wall_seconds + peak_rss_mb\n\
    + per_tick_latency series \u2014 i.e. the perf harness is wired and writing\n\
    rows into runs.db.\n"
  measure:
    kind: harness_row_present
    table: runs
    sim_name: nsweep-n1
  pass_if:
    op: row_exists
  units: bool
  requires_simulation: nsweep-n1
- name: per-cell-cost-within-2x-reference
  classification: primary
  description: "For each N>1 sweep run, the per-cell wall-time (wall_seconds / N_cells_at_end)\n\
    is at most 2\xD7 the N=1 reference per-cell wall-time. Catches super-linear\n\
    blow-up that would block HPC scaling.\n"
  measure:
    kind: per_cell_wall_ratio
    reference_sim: nsweep-n1
    window: full
  pass_if:
    op: ratio_at_most
    ratio: 2.0
  units: dimensionless ratio
  requires_simulation: nsweep-n2
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: 'colony composite is HPC-ready: daughter hydration works
      through

      the engine, per-cell cost stays bounded as N grows on one machine.

      '
    pipeline_unblocks:
    - colonies-02-hpc-deployment can size HPC nodes from the recorded peak_rss_mb
      and per_cell_update_ms numbers.
  if_primary_tests_fail:
    diagnose:
    - 'If daughters-hydrated FAILS, the engine''s structural-update path for nested
      processes is the root issue. Look at how `_add` is consumed and whether the
      daughter''s `address: local:EcoliWCM` gets instantiated.'
    - "If per-cell-cost-within-2x-reference FAILS, profile which timer grew super-linearly\
      \ (per_cell_update_ms \u2014 GIL contention; pymunk_step_ms \u2014 O(N\xB2)\
      \ physics broadphase; total wall but not per-cell \u2014 scheduler overhead)."
    block_downstream: colonies-02 should not start.
limitations:
- Single-machine only; cross-node HPC scaling is colonies-02's job.
- 90 min sim window is one full doubling plus a buffer for the second division, not
  an N-generation run.
- Per-cell EcoliWCM internal cache is shared (same cache_dir path); RAM extrapolation
  may underestimate HPC RAM if HPC runs use per-cell caches.
- pymunk is single-threaded; GIL contention may dominate before any HPC-relevant bottleneck
  shows up.
implementation_requirements:
- id: req-1-perf-harness
  kind: harness
  title: studies/colonies-01-hpc-readiness/sims/run.py perf harness
  effort: M
  description: 'A driver that takes (sim_name, n_cells, duration_min, seed), builds

    the colony composite, runs it tick-by-tick, and writes per-tick rows

    to studies/colonies-01-hpc-readiness/runs.db with these columns:

    tick, sim_time, wall_ms, per_cell_update_ms_sum, pymunk_step_ms,

    live_cell_count, rss_mb. Also writes one row to a `runs` table per

    completed run with totals.

    '
  steps:
  - Decide DB schema (one ticks table, one runs table).
  - Wrap EcoliWCM.update + pymunk step with timing.
  - Use psutil for RSS sampling.
  - Add a --sim-name flag matching simulation_set entries.
  unblocks:
  - nsweep-* runs
  - all derived readouts
- id: req-2-daughter-hydration-fix
  kind: bridge_fix
  title: Hydrate daughter EcoliWCMs through the composite engine on structural _add
  effort: M
  description: 'Today reports/colony_report.py manually instantiates standalone EcoliWCMs

    for daughter cell IDs (~lines 520-540) because the structural _add

    inside EcoliWCM._handle_division doesn''t appear to make the engine run

    daughters as embedded processes. Fix the bridge OR the engine wiring

    so daughters tick normally after division.

    '
  steps:
  - Reproduce the issue with a minimal pure-WC N=2 run and capture exactly what the
    engine does (or doesn't do) at the division tick.
  - Decide whether the fix is in EcoliWCM._handle_division (different update shape)
    or in how the colony document declares `cells` (must accept process nodes via
    _add).
  - Verify the fix unblocks `daughters-hydrated` test.
  unblocks:
  - daughters-hydrated test
  - two-generations-complete test
  - all nsweep-n{2,4,8} runs
