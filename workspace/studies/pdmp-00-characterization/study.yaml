planned_runs:
- name: phase0-bootstrap
  status: ran
  n_steps: 10
  details: completed 2026-05-24; bootstrap-run-confirmed
- name: phase0-warmup-x1
  status: planned
  n_steps: 100
  details: single-condition warm-up; verify cycle dynamics + listener observables
    ramp correctly
- name: fix-per-process-rng-seeding
  status: fixed
  n_steps: (infrastructure fix, no simulation steps)
  details: "Fixed 2026-05-24. Per-process RNG seed derivation added in v2ecoli/composites/baseline.py\
    \ via _derive_process_seed(master_seed, base_name) = crc32(process_name, master_seed).\
    \ Mirrors the pattern already used in v2ecoli/steps/division.py:CellDivision.\
    \ Verified by tests/test_seed_diversity.py: seed=0 vs seed=1 produces divergent\
    \ trajectories while per-(seed) reproducibility is preserved (test_seed_determinism\
    \ still passes). Unblocks Phase 0 N\u226564 ensemble. Original bug: baseline's\
    \ `seed` parameter only seeded `allocator_rng` (baseline.py:408); the other 14\
    \ stochastic processes (TranscriptInitiation, Metabolism, Complexation, etc.)\
    \ inherited a single cache-derived seed from the ParCa cache, so multi-seed ensembles\
    \ collapsed to bit-identical trajectories."
- name: phase0-conditions-3
  status: planned
  n_steps: 600
  details: "1 generation \xD7 3 conditions; first cross-condition interface-statistic\
    \ comparison"
- name: phase0-ensemble-3x64
  status: running
  n_steps: 600
  details: "3 conditions \xD7 N=64 replicates; produces the canonical reference dataset\
    \ (Gating criterion). Re-running: the canonical 192-run ensemble is not committed\
    \ in this checkout. Earlier-reported per-condition results (M9-glucose 64/64 ATP\
    \ CV 0.64%; M9-acetate 64/64 ATP CV 0.87%, 1 seed crashed at t=141 on Negative\
    \ counts_unallocated; M9-glucose+aa 64/64 ATP CV 0.09%) are from a prior uncommitted\
    \ run and await re-run before being re-asserted. What is verified here today is\
    \ a fresh N=6 \xD7 250 s M9-glucose pilot (ATP[c] CV \u2248 0.029%), a single\
    \ condition, not the 3\xD764\xD7600 s reference. Per-condition ParCa caches built\
    \ via scripts/build_cache.py --media-condition {acetate|with_aa}. Multi-generation\
    \ pass + full XArrayEmitter zarr trajectories deferred to a follow-up (composite.run()\
    \ doesn't auto-attach the emitter; tracked as task #39)."
- name: phase0-profile-instrumented-baseline
  status: planned
  n_steps: 1000
  details: "Profile-instrumented single-cell baseline. Wraps every process invocation\
    \ with timeit + tracemalloc so per-step compute is decomposed into FBA-LP / RNG-draw\
    \ / store-marshalling / topology-traversal / emitter-I/O buckets. Will produce\
    \ a profile-decomposition figure with real means \xB1 std over \u22651000 step\
    \ samples once the diagnostic harness lands."
