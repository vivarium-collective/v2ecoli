- address: image:charts/01_nfsim_assembly.svg
  chart: charts/01_nfsim_assembly.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/studies/flagella-04-complexation-nfsim/run_nfsim_assembly.py --seconds 2400 --sample 120
  description: |
    Which model is this? (answers Maya's "NFsim run on what baseline WCM, with or
    without regulation?"): NEITHER — this is a STANDALONE NFsim + monomer-production
    composite, NOT coupled to the WCM baseline at all. There is no flagella_regulation
    on/off here because there is no WCM transcription in this run; monomers are fed by
