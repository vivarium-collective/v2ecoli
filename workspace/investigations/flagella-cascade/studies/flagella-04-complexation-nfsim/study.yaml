open_decisions:
  - id: nfsim-its-own-investigation
    raised_by: MA
    date: '2026-07-24'
    question: "Should we make NFsim its own investigation?"
    recommendation: |
      Keep it here for now as Aim 2B (it shares Maya's Aim-2 framing and the
      flagellar biology), but split it into a dedicated `flagella-nfsim-assembly`
      investigation ONCE it is coupled into the WCM -- at that point it becomes
      a distinct methods thread (rule-based vs Gillespie complexation) with its
      own acceptance criteria, rather than a standalone example. Tracked for
      the maintainers' call.
  - id: what-would-actually-cap-flagella-count
    raised_by: system
    date: '2026-08-05'
    question: >-
      Study 02 discovered the standard Gillespie complexation lets flagella
      count grow unboundedly (4 -> 18+ over 42 min, accelerating, via a
      positive feedback through FlgM secretion). This study just confirmed
      NFsim's BNGL rule set has the identical gap -- ordered assembly, no cap.
      Neither pathway currently in this repo implements the real biological
      constraint (FlhDC-set nucleation/basal-body site limit). What would it
      actually take to add one -- a finite, consumed nucleator/basal-body-site
      species in the reaction network (Gillespie or BNGL), or a feedback term
      that throttles monomer synthesis by existing flagella count, or something
      else? Is this in scope for Maya's Aim 2, or a separate methods
      contribution?
    recommendation: |
      Not yet decided -- flagging for Maya's input. Whichever pathway (NFsim
      integration or a capped Gillespie network) is chosen, the fix is the
      same conceptual addition either way: a limited nucleation resource that
      gets consumed by each new flagellum and isn't replenished, rather than
      an open-loop monomer-availability-only constraint.
    update_2026_08_05: |
      Literature check (Sisti et al. 2017, Sci Rep) found real flagellar
      number control is primarily UPSTREAM and transcriptional, not a
      geometric nucleation-site limit: ClpXP-mediated degradation of the
      assembled FlhD4C2 master regulator complex. v2ecoli implements neither
      half of this (no ClpXP process at all; protein_degradation.py
      explicitly excludes complexes like CPLX0-3930/FlhD4C2 from degradation
      entirely -- see flagella-02-missing-flhdc-complex-degradation in study
      02). This is a more mechanistically grounded, smaller-scoped candidate
      fix than an invented nucleation-site species -- it throttles the
      transcriptional drive upstream, complementary to (not a replacement
      for) a downstream assembly cap. Recommend trying FlhD4C2 complex
      degradation first, since it is real, specific, literature-characterized
      biology and a contained addition (one degradation reaction), before
      committing to a larger NFsim rule-set redesign.
    update_2026_08_05_part2: |
      TESTED: FlhD4C2 degradation was implemented and works correctly (FlhDC
      now decays to a stable ~173-174 equilibrium instead of growing
      unbounded to 625 -- see
      flagella-02-flhdc-degradation-implemented-necessary-not-sufficient in
      study 02). But it does NOT, on its own, fix flagella count -- still
      climbs 4->19 over 42 min, essentially unchanged from the un-fixed
      4->18. The SUM-gate's X=FlhDC/(K_flhDC+FlhDC) term stays deep in its
      saturated regime even at the new, lower FlhDC level (0.776 vs 0.926),
      not enough to meaningfully throttle Class II transcription -- the
      actual runaway engine is the separate FlgM-secretion feedback loop,
      which doesn't care how saturated Class II is as long as it's still on.
      CONCLUSION: this question is no longer hypothetical -- we now have
      direct empirical evidence that FlhDC degradation ALONE is insufficient,
      and a cap on the assembly/complexation step itself (this study's
      nucleation-site idea) is still needed. Keep the FlhDC degradation Step
      (it's correct, real biology) and treat the assembly-side cap as the
      next concrete piece of work, not an alternative to try instead.
    resolution_2026_08_05: |
      RESOLVED (Option A chosen over Option B -- see study 02's
      flagella-02-nucleation-cap-implemented-and-confirmed-working for full
      detail): implemented a ceiling Step
      (v2ecoli/processes/flagella_nucleation_cap.py) scoped to
      flagella_regulation rather than editing complexation_reactions.tsv
      inside the installed ecoli_sources package (Option B) -- confirmed
      working, flagella count now holds exactly at max_flagella=10 for the
      remaining 36 min of a 42 min run, instead of climbing unboundedly.
      Free FliC monomer levels, the open concern about this simpler
      approach, do NOT blow up -- they decrease once the cap engages,
      consistent with shared translation-resource competition providing a
      natural check. Note for the record: this was NOT a one-shot success --
      the first implementation had a real ordering bug (the cap's step
      landed in an earlier execution layer than ecoli-complexation, so it
      was always one cycle behind and complexation's production silently
      outran it), found only by directly instrumenting the Step rather than
      trusting the trajectory output. Option B (a real consumed
      nucleation-site species in the reaction network) remains the more
      "textbook correct" version if this ever needs revisiting, but Option A
      is confirmed sufficient for the runaway problem this was scoped to fix.

