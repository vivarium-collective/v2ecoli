capability_check: "req-1 RESOLVED 2026-09-03 (capability check, no outcomes inspected).\n\nThe ppGpp-adjusted basal vector is NOT emitted. The only ppGpp column in the\nexisting runs is listeners.growth_limits.ppgpp_conc; there is no\nppgpp_state.basal_prob column.\n\nBut the branch IS active, which settles the study's premise independently of the\nreadout. PpgppInitiation (v2ecoli/steps/ppgpp_initiation.py) writes\nppgpp_state.basal_prob, and it is wired into ecoli_baseline through the\nppgpp_regulation feature, which is in DEFAULT_FEATURES and defaults True. So every\nrun in this investigation took the branch that REPLACES the cache's basal_prob, and\nthe cache vector was never the reference in force.\n\nThe vector is reconstructible in principle: PpgppInitiation computes it as\nsynth_prob(ppgpp_conc, copy_number), where ppgpp_conc is emitted and both\nsynth_prob (transcription.synth_prob_from_ppgpp) and copy_number\n(replication.get_average_copy_number) live in the cache config. They are stored as\nfunction-registry wrappers ({_function, _data}) rather than raw callables, and\nseveral attempts to resolve them standalone via the core's method registry did not\nsucceed -- the process resolves them through its own initialisation path.\n\nTwo practical routes, in preference order:\n  (a) emit ppgpp_state in a short re-run. This is an emitter-configuration change,\n      not a model change, and yields the vector directly with no reconstruction.\n  (b) instantiate PpgppInitiation through the composite machinery so the method\n      wrappers resolve as they do at runtime, then call update().\n\nRoute (a) is preferred: it reads what the model actually used rather than\nrecomputing it, so it cannot silently diverge from the real value.\n"
blocker: "req-2 BLOCKED 2026-09-03. Both routes to the in-force vector are obstructed, and\nthe obstruction is structural rather than a matter of effort.\n\nROUTE (a) emit ppgpp_state. The ParquetEmitter's emit schema is hardcoded in\nv2ecoli/composites/_helpers.py:506-517. Adding ppgpp_state there works, but that\nfile is in the cache's hashed input set, so the edit immediately invalidated the\ncache:\n    StaleCacheError: inputs_hash mismatch; files differ: ['_helpers.py']\nRebuilding would change the cache fingerprint away from ea05ac9b23b1d843, which\nevery one of the six prior studies ran against. That breaks comparability across\nthe whole investigation for the sake of one observation. The edit was REVERTED and\nthe cache verified loadable again.\n\nROUTE (b) reconstruct via PpgppInitiation. The step instantiates from the\necoli-transcript-initiation config, but its initialize() only assigns\nself.synth_prob = parameters['synth_prob']; the {_function, _data} wrapper is\nresolved to a callable by the SCHEMA deserializer when the composite builds the\nstep, not by initialize(). Instantiating the step directly bypasses that, so\nsynth_prob stays a dict. core.deserialize does not exist; core.call_method did not\nresolve it either.\n\nREMAINING VIABLE ROUTE, untried: build the composite through the same path the\nrunner uses, then read the resolved synth_prob off the constructed PpgppInitiation\ninstance. That needs no source change and no cache rebuild, but it is more than a\nfew lines of scripting and was not attempted.\n\nUntil one of these lands, three of four axes are UNGRADABLE. They are left ungraded\nrather than substituted with a basal_prob proxy -- the proxy IS the error this study\nexists to correct.\n\nWhat is NOT blocked, and stands on source inspection alone: ppgpp_regulation is in\nDEFAULT_FEATURES and defaults True, PpgppInitiation is wired into ecoli_baseline,\nand transcript_initiation.py:547-556 replaces basal_prob when ppgpp_state is\nnon-empty. So the cache's basal_prob was not the reference in force in any prior\nrun, independent of whether the replacement vector can be read.\n"
