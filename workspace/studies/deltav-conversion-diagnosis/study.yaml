  parameter_sweep: false
  note: Deterministic static artefacts; replication is meaningless. Breadth comes from the 564 joined
    entries and 23 modelled TFs.
controls:
- name: negative-basal-clipping-is-not-the-cause
  kind: negative
  hypothesis: If distortion is concentrated on clipped-basal TUs, H3 rather than H1 is the mechanism.
  expected: clipped-basal prevalence among high-distortion entries within 2x of base rate.
  observed: ''
  result: PENDING
- name: conversion-path-reproduces-the-cache
  kind: positive
  hypothesis: If the identified path does not reproduce the stored deltaV, the diagnosis is of the wrong
    code.
  expected: '>= 99% of entries reproduced within 1e-9 relative.'
  observed: ''
  result: PENDING
limitations:
- If r_vector is not recoverable from the cache, req-1 requires re-running ParCa, which changes this study
  from an afternoon of analysis into a substantial job. Checked first.
- The corrected-fidelity axes rest on 2**log2FC being the right target, an assumption inherited from foldchange-to-delta-fidelity
  and marked high risk. If H4 holds they measure the wrong thing, which is why H4 is discriminated separately.
- 'The study can identify WHAT the conversion does wrong without establishing what it SHOULD do: the regression
  may be satisfying a constraint that is itself mis-specified upstream, and this study does not reach
  that far.'
- The cache deliberately predates the LexA-related ParCa fix recorded on another branch. Whether that
  fix touches this conversion is not checked here.
claim: ''
conclusion: ''
confidence: Planned
candidate_diagnosis:
  recorded_at: '2026-09-04T09:40:00Z'
  recorded_before_measuring: true
  statement: 'The distortion is an ACTIVE-CONSTRAINT artefact of the convex fit, not a transform error
    and not residual scatter.

    fit_sim_data_1.py:3578-3592 minimises norm(G@R - k) subject to 0 <= Z@R <= 1 and T@R >= 0, where Z@R
    is the initiation probability with ALL TFs bound. The lower bound therefore states alpha + sum(delta)
    >= 0, i.e. delta/alpha >= -1. When that constraint is ACTIVE the optimiser sits exactly on it, giving
    delta/alpha = -1 and a retained fraction of 0 -- total silencing -- regardless of what the target
    fold change asked for. The objective never sees the ratio delta/alpha; it matches absolute probabilities
    k, so nothing pulls a boundary-bound entry back toward 2**log2FC.'
  predictions:
  - 'BIDIRECTIONAL: the lower constraint (Z@R >= 0) binds for repressors, driving retained -> 0 (under-shoot);
    the upper constraint (Z@R <= 1) binds for strongly activated TUs, driving retained up (over-shoot).
    This is why activators are distorted MORE than repressors.'
  - 'MAGNITUDE-UNIFORM: a constraint either binds or it does not. Whether it binds depends on the TU''s
    whole regulatory context, not on any single |log2FC|, so distortion does not grow with fold-change
    magnitude.'
  - The 10 near-total-repression targets should sit at Z@R ~ 0, i.e. the lower constraint is active for
    them.
  - EG10620_RNA[c]'s ratio slightly BELOW -1 (-1.000009) is ECOS solver tolerance overshooting the boundary,
    not a distinct defect.
  - dnaG's -0.999999957 is the boundary itself, to solver precision -- NOT a coincidence and NOT floating-point
    cancellation.
  candidate_correction: 'Two options, stated now so neither is chosen by fitting to the answer.

    (A) Floor the constraint: replace 0 <= Z@R with eps <= Z@R for a small positive eps, so a fully-repressed
    TU retains a floor instead of collapsing to zero. Cheap, but arbitrary in eps and does not make the
    encoding faithful -- it only makes it non-lethal.

    (B) Constrain the RATIO: add delta/alpha == 2**log2FC - 1 for entries with a measured fold change,
    either as an equality constraint or as a penalty term in the objective. This is the correction that
    would make the encoding faithful, and it is the one the repair axes should be graded against.

    PREDICTION under (B): entries whose constraint was NOT active are already near-faithful and barely
    move; the network median improves mainly by repairing the boundary-bound entries.'
  note: Recorded per req-2 BEFORE measuring any of it. Axis 1 has passed (979/979 deltaV entries reproduced
    within 1e-9), so the code path is confirmed; nothing about fidelity has been evaluated at the time
    of writing.
