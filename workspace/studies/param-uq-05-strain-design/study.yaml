  - name: Sobol sensitivity by aggregation strategy
    chart: image
    address: image:charts/sobol_by_strategy.png
    config:
      title: "REAL (smoke) — Strain-design Sobol (exp vs trl_eff vs inert decoy) on GFP product level, aggregation strategies 1–3"
    render: |
      REAL smoke result (n=12+3 test, 3 seeds, 1 gen, 700 steps): grouped
      total-order Sobol bars for exp / trl_eff / inert-decoy on new-gene product
      level, one group per aggregation strategy. Strategy 1 (population) and
      strategy 3 (by-seed, whiskers = across-seed min–max) are real; strategy 2
      shows generation_1 only (no division in the smoke window → equals strategy 1).
      exp (~0.49) and trl_eff (~0.46) are co-dominant; the inert decoy sits at
      ~0.11 — ABOVE the 0.05 null band — flagging the GFP surrogate as
      under-resolved at this budget. The dotted line is the adversarial null band.
  - name: PCE response — product level vs strain-design knobs
    chart: image
    address: image:charts/pce_response_strain_design.png
    config:
      title: "REAL (smoke) — order-2 PCE surrogate: GFP product level vs exp and vs trl_eff (other at midpoint)"
    render: |
      REAL smoke result: order-2 PCE surrogate prediction of GFP product level
      across each knob's productive range (exp ∈ [1e3,1e4], trl_eff ∈ [0.5,2.0]),
      with the other knob at its midpoint, over the ensemble scatter. GFP rises
      (saturating) with exp and rises-then-plateaus with trl_eff — both knobs move
