implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: STATE THE ATTRIBUTION RULE IN FULL BEFORE APPLYING IT.
  detail: 'The rule must be written into this record before it touches any edge, because the LexA/TU00352
    answer is already known and a rule tuned to reproduce it would be worthless. It must specify: the
    window around a TU''s start within which an operator counts as acting on that promoter; how an operator
    lying INSIDE a transcript but downstream of its start is treated (occlusion versus no effect); strand
    handling; and what happens when a TF has sites at several promoters of one operon. It must then be
    applied uniformly to all 9 covered TFs with NO special-casing of dnaG. This is the same discipline
    deltav-conversion-diagnosis''s req-2 imposed, which is what let its failed prediction stand as a genuine
    refutation.


    SATISFIED: the rule, its tolerance justification, the REJECTED coordinate-window alternative and three
    predictions are recorded in the attribution_rule block above, before any edge was re-attributed.'
- id: req-2
  status: not_started
  blocking: true
  summary: Re-attribute delta_prob by REMAPPING, and decide whether a refit is needed.
  detail: 'The edges already carry correct, sign-constrained magnitudes; only their TU assignment is wrong.
    So the minimal change remaps deltaI (the TU index) for affected entries and needs NO ParCa refit --
    much cheaper than tu-dedup-promoter-collapse''s Phase B. It is not fully faithful: basal_prob was
    fitted WITH those edges in place, so removing one from a TU leaves its alpha slightly mis-calibrated.
    Record that as a known approximation and, if the rescue works, note that the faithful version refits.'
- id: req-3
  status: complete
  blocking: false
  summary: Resolve TF name matching case-insensitively and report the unmatched.
  detail: 'The export writes ''LexA'', transcription_factors.tsv writes ''lexA''; a case-sensitive join
    returns ZERO of 23 model TFs and a case-insensitive one returns 9. The 14 unmatched -- crp, arcA,
    hns, ihfA, metJ, narL, trpR, dnaA, baeR, bglJ, dcuR and three complex ids -- must be REPORTED and
    left on their existing cistron-content assignment, never silently dropped.


    RESOLVED: matching is case-insensitive; the 14 unmatched TFs abstain under rule 4.'
alternative_hypotheses:
- name: H1 promoter-specific attribution frees dnaG
  discriminator: lineage-completes
  statement: 'Re-attribution removes LexA from TU00352, which then has no regulator, so dnaG is transcribed
    at its fitted basal rate and the lineage completes. Predicts all primary axes pass. Favoured: the
    edge is demonstrably on the wrong promoter.'
- name: H2 the rule cannot be stated generally
  discriminator: attribution-rule-adjudicates-most-covered-edges
  statement: No uniform positional rule adjudicates most edges -- operators sit at ambiguous distances,
    or TU start coordinates are missing too often. The fix is then not implementable from this data, whatever
    is true of dnaG.
- name: H3 the rule is disruptive
  discriminator: most-edges-are-unchanged
  statement: Positional attribution reassigns much of the network, making it a different model rather
    than a correction and any rescue uninterpretable.
- name: H4 dnaG recovers but the lineage still stalls
  discriminator: lineage-completes
  statement: Transcription recovers while something else limits growth -- the 2.13x activator residual,
    or another subunit. A partial result worth having, and it would show the LexA edge is necessary but
    not sufficient.
falsifiability: The rule is stated before it is applied and must behave sensibly for 9 TFs, so it cannot
  be tuned to the dnaG answer that is already known -- that known answer is a PIN here, not a criterion.
  The disruption control can void the whole approach, and the feasibility gate can stop it before any
  simulation.
assumptions:
- assumption: Remapping delta_prob without refitting is an adequate first test.
  basis: The magnitudes are already fitted and sign-constrained; only attribution is wrong. But basal_prob
    was fitted WITH the misattributed edges, so alphas are slightly off after removal. Adequate to test
    whether the mechanism rescues dnaG; not the shippable fix.
  risk: medium
- assumption: An operator acts on promoters whose start lies downstream of it.
  basis: Standard for a repressor occluding initiation, and it is what distinguishes TU00435 (start inside
    the site) from TU00352 (start 88 bp upstream). But the export gives position only, not mechanism,
    so a site acting by DNA looping or on an upstream promoter would be misassigned by this rule.
  risk: high
