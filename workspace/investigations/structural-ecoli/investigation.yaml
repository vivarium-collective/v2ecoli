schema_version: 2
name: structural-ecoli
title: Structural E. coli
created: '2026-07-25'
status: in_progress

question: |
  What does the whole-cell molecular state look like in real 3D space at key
  points in the cell cycle — just after birth (post-equilibration) versus right
  before division? Can we pack the simulated molecular counts into a 3D cell and
  view declared-time snapshots in the Parsimony Viewer?

description: |
  Reconstructs a 3D structural view of the E. coli cell directly from a live
  baseline whole-cell run, using the ecoli_structural composite (baseline +
  an EcoliPackStep that packs the molecular state at declared simulation times).
  First study saves two snapshots — an initial state ~10 s in and a pre-division
  state — for the Analysis Tools Parsimony Viewer.

findings: |
  RECONCILED 2026-07-27 (hardening). The concept is demonstrated but the
  headline numbers are NOT reproducible or verified in the canonical
  environment — the earlier "confirmed, faithful 3D view" framing overclaimed.

  What a prior run (on a newer toolchain, seed 0, relax=true, division reached)
  REPORTEDLY produced, packing the top-40 species into a gram-negative envelope:
    - initial (t ≈ 10 s, post-birth):      287,013 placed instances (~314k molecules)
    - pre-division (scheduled division):    552,450 placed instances (~519k molecules)
  read as ~1.7-1.9x content growth at conserved 46-species composition and a
  ~1.5x envelope elongation (aspect ratio ≈ 1.7 → 2.5).

  These remain PLAUSIBLE but UNVERIFIED here, because:
    - The ~90-180 MB pack artifacts were never committed — nothing on disk to
      re-derive the numbers from (s01 dir holds only study.yaml).
    - The 3D pack pipeline cannot run in the canonical env: pbg-parsimony is
      pinned to a moving `branch = "main"` and the installed editable checkout is
      STALE — it lacks the `Ingredient(compartment=...)`, `build_pack(envelope=...)`
      and multi-chromosome `Chromosome(...)` API that v2ecoli/structural/build.py
      now requires (4 structural tests are RED on canonical main for this exact
      reason), AND the `parsimony` mesh/pack binary is absent from the machine
      entirely (no PARSIMONY_BIN/PARSIMONY_HOME, not on PATH).

  What IS verified green in the canonical env (no parsimony binary needed) — the
  reproducible core of the claim:
    - Snapshot scheduling: both declared snapshots fire once, at their declared
      times / at division_time (tests/test_pack_step.py).
    - Count conservation at the selection layer: counts -> ingredient selection
      conserves every selected species' count exactly, caps auto-expansion at
      top_n, deterministic (tests/structural/test_s01_acceptance_gate.py).

  This hardening's real deliverable: s01 previously had NO acceptance gate at all
  (asserted numbers, nothing testable). It now has a concrete, artifact-derived
  gate (v2ecoli/structural/acceptance.py + tests/structural/test_s01_acceptance_gate.py:
  both-snapshots-written, placed-vs-requested conservation, no-overpack,
  birth->division growth direction), reproducible sub-tests green, and the
  end-to-end pack gate wired to SKIP (never falsely pass) until the toolchain is
  pinned and present. See decisions_needed / followups to unblock reproduction.

  Method note: the pack step DOES run on the standard build path (v2ecoli #392
  fixed a bug that silently dropped the EcoliPackStep on the core=None build path
  — verified indirectly: the step's append + scheduling logic is green; the
  DROP would have prevented any snapshot from firing).

  Interactive viewer (Cloudflare R2, from the prior out-of-env run; not
  regenerable here until the toolchain is pinned):
  https://pub-eb913fbbdc584bd7add047c823570b13.r2.dev/structural-ecoli/index.html

executive:
  what_is_this: |
    Reconstruct the whole-cell E. coli molecular state as a 3D structural view
    directly from a live baseline run, packed into a gram-negative envelope at
    two declared cell-cycle times (birth ~10 s, pre-division) and viewed in the
    Parsimony Viewer. Single member study s01.
  verdict: |
    Concept demonstrated; headline numbers NOT reproducible/verified in the
    canonical env. Gap closed by this hardening: s01 went from "ran, no gate,
    uncommitted artifacts" to a defined, artifact-derived acceptance gate with
    the reproducible core (snapshot scheduling + selection-layer count
    conservation) verified GREEN, and the end-to-end pack gate implemented but
    skipping until the pack toolchain is pinned and present. The 287k/552k
    placed-instance numbers are from a prior run on a newer toolchain and were
    NOT re-derived — the packs were never committed and the pack pipeline
    (newer pbg-parsimony API + `parsimony` binary) is absent from the canonical
    environment (4 structural tests RED on main).
  verdict_status: reconciled_concept_shown_repro_blocked
  confidence: medium

decisions_needed:
  - id: pin-pack-toolchain-for-reproducibility
    status: open
    question: |
      The 3D pack pipeline is not reproducible from the pinned environment.
      pyproject pins pbg-parsimony to `branch = "main"` (a moving target) and the
      installed editable checkout is stale relative to the API
      v2ecoli/structural/build.py requires, so 4 structural tests are RED on
      canonical main; the `parsimony` mesh/pack binary is also not provisioned on
      the machine. Decide how to pin: (a) pin pbg-parsimony to a specific commit
      SHA that provides the compartment/envelope/multi-chromosome API, and
      (b) vendor or document the `parsimony` binary (PARSIMONY_BIN / build-from-
      source instructions) in the run environment so s01 can be re-run and gated.
    resolution_hint: |
      Bump pyproject's pbg-parsimony pin from branch to a SHA; refresh the
      editable checkout to it; set PARSIMONY_BIN (or PARSIMONY_HOME with a built
      target/release/parsimony) in the run env. Then the 4 RED structural tests
      and the end-to-end pack gate can go green.

followups:
  - id: reproducible-pack-run-and-gate
    rationale: |
      Once the toolchain is pinned (see decisions_needed), re-run the s01
      baseline condition end-to-end to division, produce both snapshots, and run
      tests/structural/test_s01_acceptance_gate.py::test_pack_gate_over_artifacts
      to gate the real packs (both-snapshots-written, placed-vs-requested
      conservation, no-overpack, growth-direction). Flip s01 simulation_status
      back to `ran` and evaluation_status to `evaluated` on the basis of that run.
  - id: commit-golden-pack-fixture
    rationale: |
      Commit a SMALL golden pack fixture (one snapshot, small top_n, no relax) so
      the placed-vs-requested conservation + occupancy numbers are inspectable
      from disk and the gate has a committed regression anchor — instead of
      relying on a >90 MB per-run artifact that is never committed.
  - id: calibrate-conservation-band
    rationale: |
      The count-conservation band [0.80, 1.0] in s01's behavior_tests is
      provisional. Calibrate the floor against the first real pack's actual
      placed/requested fraction (the staged packer legitimately drops some
      large assemblies for steric feasibility).

