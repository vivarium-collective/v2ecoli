schema_version: 4
name: pdmp-00-characterization
investigation: v2ecoli-pdmp
title: "Phase 0 \u2014 Characterization and Interface Extraction"
claim: "Fixing per-process RNG seeding (crc32(process_name, master_seed)) makes multi-seed\
  \ ensembles genuinely\ndiverge \u2014 v2ecoli's bare `seed` only seeded the allocator,\
  \ so ensembles were bit-identical (confirmed on\nan N=6 \xD7 250 model-second M9-glucose\
  \ pilot, .pbg/runs/phase0-traj/, ATP[c] CV \u2248 0.029%;\ntests/test_seed_diversity.py\
  \ passes). The canonical 192-run reference ensemble (3 conditions \xD7 N=64, 600\
  \ s)\nis not committed in this checkout and is being re-run.\n"
confidence: Investigating
status: running
phase: Decide
topic: pdmp
tags:
- pdmp
- phase-0
- characterization
- markov-blanket
- interfaces
- profiling
- xarray
- xarray-emitter
- zarr
- multi-gen
created: '2026-05-24'
question: What is the Markov blanket of every major v2ecoli subprocess (metabolism,
  transcription, translation, replication, division, membrane), and how should every
  WCM state variable be categorized (ODE-amenable, stochastic discrete, teleonomic,
  or coupling artifact) so that subsequent phases have a typed interface contract
  to validate against?
hypothesis: "Each major v2ecoli subprocess has a well-defined Markov blanket expressible\
  \ as a typed Process Bigraph interface schema, and per-step compute time is dominated\
  \ by marshalling overhead (nested-dict state traversal, type-coercion between stores\
  \ and process internals) rather than essential biological computation \u2014 motivating\
  \ the column-centric runtime refactor in Phase 4."
objective: "Run v2ecoli in diagnostic mode under \u22653 environmental conditions\
  \ (M9-glucose, M9-acetate, M9-glucose+amino-acid supplementation), categorize every\
  \ state variable, extract typed PB interface schemas for each major subprocess,\
  \ deploy the Xarray-format emitter to record full interface time-series, and profile\
  \ per-step compute to separate marshalling overhead from essential computation."
description: "Phase 0 of the v2ecoli \u2192 PDMP roadmap; its deliverables become\
  \ the validation standard for every later\nphase (a replacement subprocess is accepted\
  \ when its interface statistics match the Phase 0 reference\nXarray dataset within\
  \ tolerance). No biology is changed \u2014 v2ecoli runs as-is; the artefacts are\
  \ the typed\ninterface schema library, the reference Xarray datasets across the\
  \ \u22653 conditions, and the per-step\nprofiling report.\n\nConditions (tentative,\
  \ spanning the metabolic regime the DUF report Sec. 4.1.1 notes has \"approximately\
  \ a\ndozen\"): aerobic M9 + glucose (canonical reference), M9 + acetate (slower\
  \ growth, gluconeogenic flux), and\nM9 + glucose + amino-acid mix (faster growth,\
  \ partial relief on translation).\n\nThe reference datasets are ensembles, not single\
  \ trajectories: N=64 independent stochastic replicates per\n(condition, seed) put\
  \ the standard error of the mean at \u03C3/\u221AN \u2248 \u03C3/8 = 12.5% of \u03C3\
  , enough to set a\nWasserstein-2 tolerance band without overfitting to MC noise;\
  \ N is revisited after pilot N=8 batches and\nraised per-observable if MCSE exceeds\
  \ 10% of the inter-condition effect size. Per-step compute is profiled\nas mean\
  \ \xB1 std over \u22651000 step samples (bootstrap 95% CI) into five buckets: FBA\
  \ LP solve\n(`wholecell.utils.modular_fba`, glpk-linear), RNG draws, store\u2194\
  process marshalling, topology traversal, and\nemitter I/O. Each categorized variable\
  \ carries a numerical-sensitivity tier \u2014 Jacobian spectral-radius\ncontribution\
  \ (ODE-amenable), per-step CV (stochastic-discrete), or coupling-strength L\u221E\
  \ norm\n(coupling-artifact).\n\nAll runs use XArrayEmitter (workspace default; wired\
  \ in the dashboard via PR #70); the reference dataset is\na zarr store per (condition,\
  \ replicate, generation) opened downstream via xarray.open_zarr() with time-axis\n\
  chunking, and max_generations in workspace.yaml is set to 8 to cover the multi-generation\
  \ lineage\nstatistics Phase 2 will consume.\n"
expected_behavior:
- name: variables-categorized
  en: Every state variable in the WCM's process internals + stores is labelled ODE-amenable
    / stochastic-discrete / teleonomic / coupling-artifact. No "unknown" labels remain.
  given:
    condition: diagnostic-run-M9-glucose
  measure:
    kind: observable-comparison
    observable: state-variable-category-map
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: interface-schemas-typed
  en: Each of metabolism, transcription, translation, replication, division, membrane
    has a typed PB interface schema covering its Markov blanket.
  given:
    condition: all-major-subprocesses
  measure:
    kind: observable-comparison
    observable: process-bigraph-interface-schemas
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: reference-xarray-3-conditions
  en: "Reference zarr stores (produced by XArrayEmitter) exist for every interface\
    \ variable across \u22653 distinct environmental conditions, with N\u226564 replicates\
    \ \xD7 \u22653 generations each. Readable via xarray.open_zarr() with chunking\
    \ on the time axis. (Gating criterion for the investigation.)"
  given:
    condition: M9-glucose AND M9-acetate AND M9-glucose-aa
  measure:
    kind: observable-comparison
    observable: xarray-interface-dataset
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: profile-marshalling-vs-essential
  en: "Per-step compute is decomposed into marshalling overhead vs. essential computation,\
    \ motivating (or refuting) the Phase 4 column-centric runtime refactor. Each bucket\
    \ reported as mean \xB1 std over \u22651000 step samples with bootstrap 95% CI."
  given:
    condition: diagnostic-run
  measure:
    kind: observable-comparison
    observable: per-step-profile-report
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: uq-replicate-ensemble-N64
  en: "Each (condition, seed-family) reference dataset comprises N\u226564 independent\
    \ stochastic replicates. Per-observable MCSE reported; observables with MCSE >\
    \ 10% of inter-condition effect size are flagged and N is increased until threshold\
    \ met."
  given:
    condition: M9-glucose AND M9-acetate AND M9-glucose-aa
  measure:
    kind: observable-comparison
    observable: per-condition-replicate-count
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: uq-stiffness-classification
  en: "For each subprocess with continuous components, the local Jacobian eigenvalue\
    \ spread (max|\u03BB| / min|\u03BB|) is estimated numerically (finite-difference)\
    \ at the reference state. Subprocesses with \u03BA > 10\u2074 are flagged stiff\
    \ and inform solver choice in Phase 1."
  given:
    condition: per-major-subprocess
  measure:
    kind: observable-comparison
    observable: jacobian-spectrum-summary
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
- name: uq-bootstrap-cis-on-interface-stats
  en: "Every summary statistic in the reference dataset (mean, std, quantiles q05/q50/q95)\
    \ carries a bootstrap 95% confidence interval (\u226510\u2074 resamples). Downstream\
    \ phase tolerance bands are derived from these CIs, never set ad hoc."
  given:
    condition: per-variable
  measure:
    kind: observable-comparison
    observable: interface-summary-CI
  expect:
    op: within-tolerance
    note: Acceptance band set as this test is built out (design-stage readout).
  status: stub
