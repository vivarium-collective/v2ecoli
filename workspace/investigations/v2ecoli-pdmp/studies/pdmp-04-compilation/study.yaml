  description: 'Realistic TI-shaped workload: honest 1.5× per-tick recalibration (vs toys'' 3×) — a measured
    microbenchmark, an extrapolation not validated on the 55-process WCM. This 1.5× is the toy factor fed into
    the illustrative ~1500× = factor × N projection (not a measured speedup; column-centric runtime never built).'
- name: Phase 4 sprint 5 — real WCM baseline + illustrative N-scaling projection
  url: /reports/figures/pdmp-04/wcm_baseline_projection.html
  description: 'Real WCM benchmark (measured): pbg sequential at N=10³ × 30 ticks = 26 min. The "≈ 1 sec /
    ~1500× total speedup" is an ILLUSTRATIVE PROJECTION = toy factor × N (script hardcodes 3× → 3000×; prose
    uses 1.5× → ~1500×); the column-centric parallel runtime was never built or timed. Not a measured speedup.'
discovery_implications:
  resolved_uncertainties:
  - 'The production composite per-tick wall is ~52 ms (74 ms single-tick), of which ~76% is spent
    outside process_update (this bucket includes real numpy/scipy numeric work, e.g. Poisson logpmf,
    not all of it marshalling) — and no single Process dominates.'
  - 'The cProfile hotspots are 13,817 isinstance + 4,213 __array_finalize__ + 52 process_update calls
    per tick (genuine counts); much of the per-tick cost is outside process_update, though that bucket
    includes real numpy/scipy numeric work, so it is not purely marshalling.'
  - 'Column-centric prototypes give constant-in-N per-trajectory wall and a per-tick speedup of 1.5x on a
    realistic TranscriptInitiation-shaped workload (3.1x / 2.8x on toys) — measured microbenchmarks, an
    extrapolation not validated on the 55-process WCM. The "~1500x at N=1e3 x 30 ticks (26 min -> ~1 s)"
    is an ILLUSTRATIVE PROJECTION = toy factor x N (the script hardcodes 3x -> 3000x; the prose uses the
    1.5x recalibration -> ~1500x), NOT a measured speedup: the column-centric vectorized runtime was never
    built and never timed — only the pbg sequential side was measured (at N=1,2,4).'
  remaining_uncertainties:
  - 'The column-centric runtime is validated as prototypes + a projection, NOT as a built runner that
    reproduces the Phase-2 PDMP trajectory distribution to within 5 sigma MC — numerical equivalence of
    the vectorized path is unproven.'
  - 'Whether the column-centric refactor preserves the deterministic (pairwise/Kahan) FP summation order
    needed for reproducible ABC posteriors across hardware is untested.'
  alternate_hypotheses:
  - id: per-process-jit-wins
    statement: 'Per-Process Catalyst.jl JIT compilation is the right performance attack, recovering most
      of the per-tick cost.'
    why_plausible: 'JIT-compiling reaction propensities is the standard speedup for stochastic chemical
      kinetics.'
    mechanism_elements_affected:
    - runtime-architecture
    - per-tick-compute
    discriminating_observables:
    - fraction of per-tick wall in per-Process compute vs framework marshalling
    - measured speedup of per-Process JIT vs column-centric vectorization
    evidence_for: []
    evidence_against:
    - '~76% of per-tick time is outside process_update (this bucket includes real numpy/scipy numeric work,
      not all of it marshalling); on that basis per-Process compilation (which only touches the in-process
      compute) is extrapolated to buy at most ~10% — an estimate not validated on the 55-process WCM.'
  mechanism_update_proposals:
  - mechanism_node_or_edge: runtime-architecture
    update_type: replace
    rationale: 'Adopt a column-centric (pre-allocated per-observable arrays indexed by trajectory x time)
      vectorized runtime with N-way lockstep stepping; do NOT pursue per-Process Catalyst.jl JIT as the
      primary lever. Remaining work is engineering, not investigation.'
    requires_expert_approval: true
  followup_study_proposals:
  - id: pdmp-04-column-centric-equivalence
    title: Numerical-equivalence validation of the column-centric runner vs the Phase-2 PDMP
    study_type: validation
    source_trigger: architectural_decision
    proposed_experiment: 'Build the column-centric runner and verify W2(p_compiled, p_phase2) <= 5 sigma
      MC with deterministic pairwise/Kahan summation; confirm 1/sqrt(N) posterior variance scaling on an
      ABC test posterior.'
    expected_information_gain: high
    expert_gate_required: true
# --- v4 narrative spine (filled from existing study content; honest, no new results) ---
runtime:
  notes: 'simulation_status: not_started, gate: blocked. No compiled runtime has been built or benchmarked;
    the throughput / memory / equivalence numbers are targets, projected (memory from colonies-01 sizing),
    not measured here.'
assumptions:
- The PDMP can be compiled (Catalyst.jl/ModelingToolkit or JAX/Diffrax) to a symbolic-Jacobian form that runs ≥10× faster than the Python+glpk baseline.
- A column-centric (struct-of-arrays) state layout removes the marshalling overhead Phase 0 motivates.
- Deterministic floating-point summation (pairwise/Kahan) preserves numerical equivalence with the Phase-3 reference.
enforced_params:
- name: implementation_status
  value: not built — compilation + parallel runtime are planned
- name: gate
  value: blocked on the Phase-1/2/3 model being finalized for compilation
biological_summary: 'No biology is added: Phase 4 is a performance/runtime re-implementation of the
  already-defined PDMP whole-cell model, targeting many-trajectory / many-cell HPC throughput (≥1e3
  parallel trajectories, 1024 cells/node) needed by the inference (Phase 3) and colony (downstream) work.'
literature_anchors:
- key: loman2023
  relevance: Catalyst.jl — the symbolic reaction-network compilation toolchain targeted.
- key: jumpprocessesjl
  relevance: JumpProcesses.jl — compiled jump-process integration backend.
- key: xarray2017
  relevance: XArray/zarr — the column-centric, chunked state representation for compiled output.
model_change: 'No mechanistic change — a runtime/representation change: compile the PDMP to a fast backend
  and invert the per-step loop to a column-centric layout. Equivalence with Phase 3 must be proven.'
implementation_requirements:
- A Catalyst.jl/ModelingToolkit (or JAX/Diffrax) export of the PDMP with symbolic Jacobian + sensitivities.
- A column-centric runner + deterministic summation; a parallel throughput harness (N in {10,100,1000,10000}).
- A 1024-cell memory profile to verify the <256 GB/node budget directly (currently only projected).
design_pivot_required: 'No pivot yet — Phase 4 has not started. The design hinges on the upstream PDMP
  being stable enough to compile; that prerequisite (Phases 1–3) is not yet complete.'
conclusion_verdicts:
- claim: A compiled PDMP achieves ≥10× throughput vs the Python+glpk baseline.
  verdict: not_started
  basis: No compiled runtime built or benchmarked; threshold is a target, not a measurement.
- claim: Compilation preserves numerical equivalence with the Phase-3 reference (L∞ < 1e-4).
  verdict: not_started
  basis: No equivalence test has been run; gate blocked.
- claim: N=1024 cells fit under 256 GB on one HPC node.
  verdict: projected_only
  basis: Per-cell footprint projected from colonies-01 sizing; not yet verified with a 1024-cell ensemble.
