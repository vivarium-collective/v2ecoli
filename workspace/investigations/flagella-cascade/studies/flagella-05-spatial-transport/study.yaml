name: flagella-05-spatial-transport
title: "Spatial Transport — Flagellar Protein Movement"
question: >-
  (SCAFFOLDED, not yet implemented) How do flagellar assembly proteins move
  across compartments over time — cytosol -> inner membrane -> periplasm/
  projection -> extracellular via the type-III secretion export pathway — and
  can that transport be visualized/quantified as a spatial process rather than
  a snapshot?
description: |
  Placeholder slot reserved during the 2026-07-28 investigation-wide study
  renumbering (Maya's request). Not yet designed or implemented — this is a
  named slot, not a result. The natural starting point is study 02's Voronoi
  compartment plot (a static snapshot of where flagellar protein mass sits at
  a given time); this study would extend that into an actual TRANSPORT view —
  e.g. tracking individual proteins' compartment-mass trajectories over time as
  they're synthesized in the cytosol and exported through the flagellar
  type-III secretion system, rather than two independent snapshots.
