schema_version: 2
name: genotype-perturbation-response
title: "Genotype perturbation response: characterizing how v2ecoli responds to KO, KD, and OE of native genes"
created: '2026-07-21'
status: draft

# SCAFFOLD ONLY — no study here is runnable yet. Every study below depends on
# the genotype-perturbation machinery specced in
# docs/superpowers/specs/2026-07-21-genotype-perturbations-design.md; studies
# 02-05 additionally require that spec's Tranche C (ParCa-level KO/KD).
#
# SCOPE — this is a DESCRIPTIVE first pass, deliberately. The studies below
# characterize how the model responds to genotype perturbations; they are not
# structured as graded evaluations returning verdicts. Each carries several
# independent checks, any of which can surface a divergence worth acting on,
# and that is the intended yield: a ranked list of things to look at, not a
# pass/fail.
#
# The studies are kept at this level on purpose. Committing detailed conditions,
# tests, and grading bands before the machinery exists would mostly be
# speculative structure, rewritten once real readouts are in hand. Deepening
# comes after — see `going_deeper` at the bottom.
#
# This investigation is also scoped to the SCIENTIFIC question. The MECHANICAL
# question (does the machinery edit coordinates and expression vectors
# correctly?) is answered by the test matrix in the design spec, not here.
# Keeping them separate means the engineering can merge on its own terms and
# the biology gets scheduled rather than assumed.

question: |
  When a native gene is knocked out, knocked down, or overexpressed in v2ecoli,
  how does the cell respond? Specifically: what does the model do across a panel
  of genes whose essentiality is independently known; what happens when the
  perturbed genes feed the mechanistic amino-acid supply parameters; and how do
  the two available knockout mechanisms (translation-level and ParCa-level)
  differ in effect?

executive:
  what_is_this: |
    A five-study descriptive characterization of the genotype-perturbation
    machinery once it exists. The arc moves from a machinery sanity check into
    two panels with independent structure to check against, then into two
    targeted probes:
      - genotype-01-null-control [PLANNED] — a no-op perturbation and one
        well-characterized non-essential knockout; confirms the machinery moves
        the cell only where it should before anything is read into a result.
      - genotype-02-essentiality-panel [PLANNED] — a panel of single-gene
        knockouts spanning known-essential, known-non-essential, and
        known-conditional genes. Descriptive: characterize what the model does
        across the panel, using published essentiality as structure to read
        against rather than as a grading key.
      - genotype-03-aa-pathway-stress [PLANNED] — knockouts of amino-acid
        pathway genes, probing the mechanistic AA supply parameter-fitting
        interaction flagged in RFC-007. A targeted look at an anticipated
        failure mode, carried as two checks: a build-integrity check on the
        genotype's ParCa study (did the kcat recalculation stay sane), and a
        downstream physiology check.
      - genotype-04-ko-mechanism-comparison [PLANNED] — the same genes knocked
        out translationally and at the ParCa level; characterize where and how
        far the two mechanisms diverge.
      - genotype-05-knockdown-dose-response [PLANNED] — graded knockdown of a
        small gene set; characterize the shape of the response across the
        multiplier series.
  verdict_status: not-started
  decisions_needed:
  - question: "Which gene panel for the essentiality study, and at what size?"
    status: "OPEN"
    context: |
      An informative panel mixes confidently-essential, confidently-non-essential,
      and known-conditional genes rather than sampling uniformly, since the
      conditional cases are where a whole-cell model can say something a
      flux-balance model cannot. Panel size trades directly against seeds and
      generations per genotype; see `notes.run_shape`.
  - question: "What readouts best express 'the model treated this gene as essential'?"
    status: "OPEN — expected to be informed BY the descriptive pass, not before it"
    context: |
      A whole-cell model does not return a binary. Candidate readouts include
      failure to divide within the simulated window, doubling time beyond some
      band, and mass accumulation arrest. Rather than pick one up front, the
      descriptive pass should report several and show what they look like across
      known-essential and known-non-essential genes. Choosing the criterion is
      then grounded in observed separation instead of guessed — and it is a
      prerequisite for any later graded comparison.

scientific_argument:
  main_claim: |
    Descriptive investigation — no verdict claim is asserted. The intended
    output is a characterization of the model's genotype-perturbation response,
    plus a ranked list of divergences worth acting on.
  evidence_for: []
  caveats:
  - "No study here has been run; this is a scaffold. Everything below is a target."
  - "Published essentiality is used here as independent structure to read results against, not as a grading key. It is genuinely independent — the model is not fit to it — which is what would make a later graded comparison meaningful, and why it is worth reaching for even in a descriptive pass."
  - "Reference strain matters: published single-gene knockout collections are in BW25113, not MG1655. Strain mismatch is a real confounder for a minority of genes and should be recorded alongside results rather than silently absorbed."
  - "genotype-04 is a model-to-model comparison. There is no ground truth for which knockout mechanism is 'right', so it characterizes divergence and cannot return a correctness verdict — but the divergence itself is informative, since a translation-level knockout still transcribes mRNA and consumes RNAP capacity where a ParCa-level knockout removes the gene entirely."
  - "genotype-03 tests an anticipated failure mode, so a negative result there is an expected and useful outcome, not a project risk. It is scoped as its own study precisely so it cannot be quietly skipped."

at_a_glance:
  studies:
  - genotype-01-null-control: no-op perturbation plus one non-essential knockout; machinery sanity check before results are interpreted
  - genotype-02-essentiality-panel: single-gene knockout panel across known-essential / non-essential / conditional genes; characterize the model's response using published essentiality as structure to read against
  - genotype-03-aa-pathway-stress: knockouts of amino-acid pathway genes, probing the mechanistic AA supply parameter-fitting interaction flagged in RFC-007; checked at ParCa build time (fitting integrity) and downstream (physiology)
  - genotype-04-ko-mechanism-comparison: translation-level vs ParCa-level knockout of the same gene set; characterize the divergence, including the transcriptional burden the translational mechanism retains
  - genotype-05-knockdown-dose-response: graded knockdown over a multiplier series; characterize the shape of the response

studies:
- genotype-01-null-control
- genotype-02-essentiality-panel
- genotype-03-aa-pathway-stress
- genotype-04-ko-mechanism-comparison
- genotype-05-knockdown-dose-response

acceptance_criteria:
- {study: genotype-01-null-control, behavior: no-op-perturbation-matches-baseline-and-non-essential-ko-is-viable}
- {study: genotype-02-essentiality-panel, behavior: knockout-panel-response-characterized-against-published-essentiality}
- {study: genotype-03-aa-pathway-stress, behavior: aa-pathway-knockout-effect-on-supply-parameterization-characterized-at-build-and-physiology}
- {study: genotype-04-ko-mechanism-comparison, behavior: translation-vs-parca-knockout-divergence-characterized}
- {study: genotype-05-knockdown-dose-response, behavior: knockdown-response-shape-characterized-across-multiplier-series}

notes:
  aggregation: |
    Ensemble statistics aggregate per cell — time-average within a cell, then
    across N cells — never as statistics over raw timepoints. Where the run
    budget allows, decompose variance into by-seed and by-generation
    contributions; that decomposition doubles as a stationarity diagnostic and
    informs how to spend seeds against genotypes in later panels.
  run_shape: |
    RFC-007's full-sim screen parameters (12+ seeds, 8+ generations, averaging
    from generation 5 to allow burn-in) are the reference shape. A genotype
    panel will likely need to trade seeds and generations down to buy genotype
    breadth; that trade should be made against a measured variance decomposition
    rather than by assumption.
  study_structure: |
    Each genotype is run as a build-ParCa study — a study whose baseline
    composite is `parca`, pointed at the genotype's generated ecoli-sources
    bundle — following the `showcase-1-parca` pattern in the
    v2ecoli-baseline-showcase investigation (Eran's steer, 2026-07-21). A
    curated panel is then a set of such studies seeded from a common root, each
    with its own report card; genotype = bundle = ParCa build = study. This is
    the platform-native form of the perturbations-as-bundle-variants identity,
    and it means the curated studies here need no genome-wide runner — they are
    hand-authored `parca` composites (the runner is for programmatic scale, out
    of this investigation's scope; see the design spec's execution-model section).
    Two report-card kinds live on these studies: a build-integrity card (did the
    ParCa fit cleanly / cache complete / fitted params in range — the natural
    home for study 03's AA-fitting check) and the response cards that
    characterize physiology.

  going_deeper: |
    Deliberately deferred. Once the mechanisms are trusted — the machinery
    verified by the design spec's test matrix, and the descriptive pass above
    showing the model responds sensibly and revealing what the readouts actually
    look like — the natural next step is structured, graded comparison against
    literature and experimental data, with declared criteria and bands rather
    than characterization.
    There are several candidate directions for that, but writing them out now
    would be premature: which comparisons are worth the run budget depends on
    what the descriptive pass surfaces, and on which readouts turn out to
    separate cleanly. Revisit once these five have run.
