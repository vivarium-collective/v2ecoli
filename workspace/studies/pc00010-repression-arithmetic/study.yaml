    occupancy-explains-the-generational-collapse:
      low: 0.5
      high: 1.5
      provenance:
        kind: theory
        note: Two-sided; an occupancy model that over-predicts the collapse is as wrong as one that under-predicts
          it.
    the-near-total-repression-cohort-is-silenced:
      low: 8
      high: 10
      provenance:
        kind: theory
        note: Bounded above by 10 by construction; 8 is the weakest count that still shows a class rather
          than a scatter.
    unregulated-peers-are-unaffected:
      low: 0.67
      high: 1.5
      provenance:
        kind: theory
        note: Two-sided so the control cannot be satisfied by the peers collapsing alongside the targets.
    negative-initiation-probability:
      op: '>='
      value: 0.0
      provenance:
        kind: theory
        note: 'Definitional: probabilities are non-negative.'
    dnag-occupancy-at-generation-1:
      op: <=
      value: 0.99
      provenance:
        kind: post_hoc
        note: 0.963 measured in seed 0; pin only.
  criteria:
  - test: arithmetic-predicts-dnag-transcription
    prior: Does b*(1+delta) reproduce dnaG's measured transcription?
  - test: occupancy-explains-the-generational-collapse
    prior: Is the collapse just PC00010's occupancy rising?
  - test: the-near-total-repression-cohort-is-silenced
    prior: Is dnaG one of a class, or a special case?
  - test: unregulated-peers-are-unaffected
    prior: Is silencing confined to PC00010's targets?
  - test: negative-initiation-probability
    prior: Does any transcript receive a negative initiation probability?
implementation_requirements:
- id: req-1
  status: not_started
  blocking: false
  summary: Extend generational_decay.py with occupancy and the in-force delta/basal terms.
  detail: 'All six axes read one aggregation: per generation, per seed -- measured target, promoter count,
    per-timestep in-force basal (reconstructed from the emitted ppgpp_conc, validated to 1.0003 against
    the per-generation mean), and PC00010 occupancy per target TU derived from bound_TF_coordinates. No
    new emission is needed.'
- id: req-2
  status: complete
  blocking: false
  summary: 'NOT NEEDED: emitting ppgpp_state was attempted and abandoned.'
  detail: 'inforce-basal-vector proposed emitting ppgpp_state.basal_prob from the ppgpp-initiation step''s
    existing listeners port. It does not work: the listeners SCHEMA is declared centrally in composites/_helpers.py,
    which is in cache_version.INPUT_FILES, so a step output has no leaf to land in and is silently dropped.
    The edit was reverted. Emission proved unnecessary anyway -- reconstructing per-timestep from the
    emitted ppgpp_conc agrees with the per-generation mean to 1.0003, so the Jensen concern that motivated
    it is quantitatively negligible.'
alternative_hypotheses:
- name: H1 the arithmetic closes and occupancy is the whole story
  discriminator: occupancy-explains-the-generational-collapse
  statement: dnaG's transcription is b*(1-occupancy) to first order; the four-study 'generational decay'
    is a repressor going from 96.3% to 100% bound. Predicts both quantitative axes PASS.
- name: H2 a term is still missing
  discriminator: arithmetic-predicts-dnag-transcription
  statement: The measured value stays outside 2x of the prediction, meaning something beyond b, delta
    and occupancy is acting. The first pass showed predicted 4.3167e-08 against measured 2.2e-07, a 5x
    gap; if occupancy does not absorb it, this hypothesis is live.
- name: H3 a class-level representation defect
  discriminator: the-near-total-repression-cohort-is-silenced
  statement: 10 of PC00010's 45 targets retain <1e-6 and one is NEGATIVE (-9.25e-06). If those are silenced
    too, near-total repression is systematically mis-represented and the scope is far wider than dnaG.
falsifiability: Both quantitative axes compare a prediction assembled from independently measured terms
  against a measured outcome, so neither can be satisfied by restating the other. The cohort axis can
  refute the class-level reading, and the unregulated-peer control can refute the entire repressor chain
  in one measurement.
assumptions:
- assumption: The per-timestep reconstruction of the in-force basal is exact.
  basis: synth_prob is deterministic in ppgpp_conc (copy_number is derived from it internally via tau),
    and trna_attenuation -- the only other term that mutates basal_prob in ppgpp_initiation -- is off
    by default. Reconstructing per timestep rather than at a per-generation mean changes the value by
    a factor of 1.0003, so the nonlinearity is negligible at these concentrations.
  risk: low
- assumption: Coordinate matching identifies binding at dnaG's promoter.
  basis: bound_TF_coordinates is matched to the TU's replication_coordinate (-715213) within +/-1. This
    gave a clean signal -- only TF index 14 ever appears there, on 96.3% then 100% of timesteps -- but
    it is a positional join, not a promoter identity, and a second TU at the same coordinate would be
    indistinguishable.
  risk: medium
simulation_set:
- name: ppgpp-on-mechanistic
  kind: single
  is_baseline: true
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides:
      ecoli-chromosome-replication.mechanistic_replisome: true
  note: The arm dnag-promoter-availability already ran; this study reuses those runs.
planned_runs:
- name: reuse-promoter-availability
  status: planned
  n_steps: 0
  details: 'NO NEW SIMULATION. Every quantity is already emitted in dnag-promoter-availability''s 6-seed
    sweep: target_rna_synth_prob, promoter_copy_number, ppgpp_conc, and the bound_TF_* arrays the deriver
    repair restored. The in-force basal is reconstructed per timestep from ppgpp_conc. This study is analysis
    only, which is possible solely because the req-1 deriver repair landed before that sweep ran.'
robustness:
  n_replicates: 6
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  parameter_sweep: false
  note: The 6 independent seeds of dnag-promoter-availability. Occupancy is a stochastic binding outcome,
    so seed variance matters here more than in the previous study, where the collapse was universal.
controls:
- name: unregulated-peers-are-unaffected
  kind: negative
  hypothesis: If transcripts with no PC00010 site are silenced too, the repressor is not the mechanism.
  expected: unregulated rProtein peers retain transcription within 1.5x of their in-force basal.
  observed: ''
  result: PENDING
- name: the-near-total-repression-cohort-is-silenced
  kind: positive
  hypothesis: If the mechanism is real, PC00010's other near-totally-repressed targets should share dnaG's
    fate.
  expected: at least 8 of the 10 identified TUs below 1e-9 in the last generation.
  observed: ''
  result: PENDING
limitations:
- PC00010 is not identified biologically. It resolves in the cache as a 0CS-type TF formed by PC00010_RXN
  but appears in no flat file in the repo, and this study deliberately does not guess its identity from
  outside sources. Whether ~100% occupancy is biologically correct cannot be judged until it is named.
- Occupancy is inferred by matching bound_TF_coordinates to a TU's replication_coordinate. It is a positional
  join; a second promoter at the same coordinate would be indistinguishable.
- Everything is measured in a lineage that stalls by generation 4-5, so the terms are read from failing
  cells.
- 'The study explains HOW dnaG is silenced. It does not establish whether the delta of -0.999999957 or
  the ~100% occupancy is the thing that is wrong, and it cannot: that needs a reference for what dnaG''s
  expression should be, which this investigation does not have.'
claim: ''
conclusion: ''
confidence: Planned
