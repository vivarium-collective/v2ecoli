- summary: Two readings remain open and this data cannot separate them.
  status: novel
  evidence:
    from_run: promoter-specific-regulation__phase-A
  explanation: 'Either (a) the model''s TF-TU assignments are largely unsupported by binding-site
    evidence, or (b) the export is an incomplete subset and the rule strips real regulation wherever
    a site is missing. The bimodality favours (b), and so does the coverage: only 9 of 23 model TFs
    appear at all, 29.2% of sites name no promoter, and 11.6% name one without an offset. I cannot
