# Glossary of bioprocess terms used across the studies.
glossary:
  - term: OD600
    definition: |
      Optical density at 600 nm, the standard turbidity proxy for cell density;
      cosmetic here (biomass_concentration_gL is canonical), converted via
      od_to_gdw = 0.34 gDW/(L·OD) (Beulig 2025).
  - term: gDW / biomass_concentration_gL
    definition: |
      Grams dry weight per litre, the canonical population biomass observable,
      aggregated from per-cell mass listeners × cells_per_agent / reactor volume.
  - term: cells_per_agent (cpa)
    definition: |
      Representative-sampling scaling factor by which one simulated lineage
      stands in for cpa real cells under the 0D well-mixed assumption, letting a
      single-cell simulation reach reactor-scale biomass without spatial detail.
  - term: kLa
    definition: |
      Volumetric oxygen mass-transfer coefficient (1/h) setting how fast the
      reactor replenishes dissolved O2, with a geometry-aware default upstream
      (Van't Riet for stirred tanks).
  - term: batch vs fed-batch
    definition: |
      Batch is fixed initial medium with no feeding (the Beulig batch phase
      peaks at ~9.6 g/L); fed-batch feeds substrate over time to reach the
      ~50–80 gDW/L headline density and is not yet exposed upstream (deferred).
  - term: dissolved O2 (dO2)
    definition: |
      O2 concentration in the liquid phase; the shared store where reactor
      transport (+) and cell consumption (−) net out as additive deltas.

description: |
  Migrates and enhances v2ecoli for bench-scale bioprocess context, then
  couples it to `vivarium-collective/pbg-bioreactordesign` for the physical
  reactor side.

  **Scope.** Internal v2ecoli upgrades (time-varying environment, population
  aggregation, reactor coupler) plus a coupling adapter — not a reactor
  wrapper built from scratch; reactor physics comes from
  `pbg-bioreactordesign` consumed as a dependency. Out of scope: dynamic-FBA
  as the cell side (the upstream multiscale-bioprocess roadmap's choice, see
  references/expert/multiscale_bioprocess_roadmap.md); multi-cell colony
  composite as the primary path (deferred); CFD / spatial-mixing;
  WCM-internal mass-balance audits.

  **Fed-batch is deferred.** `pbg-bioreactordesign` does not yet expose
  fed-batch operations (feed schedules, dynamic volume), so until that lands
  upstream or a v2ecoli-side feed Step is added, the mbp-05 Beulig benchmark
  scopes to the batch portion of the dataset; the spec PR makes that scope
  call explicit. Adding fed-batch is expected to be a top-priority mbp-06 gap.

  **Reactor + coupling code lives in `v2ecoli/`** (planned packages
  `v2ecoli.composites.ecoli_time_varying_env`,
  `v2ecoli.composites.ecoli_population`,
  `v2ecoli.composites.reactor_bird_coupled`); the cell-side composite stays
  `v2ecoli.composites.ecoli_baseline` (single cell + Division Step).
  `pbg-bioreactordesign` is added as a workspace dependency in mbp-03.

  Studies, in dependency order (current `phase` shown; multi-axis status is
  canonical per each study.yaml):

  1. mbp-01-time-varying-environment — **Evaluate phase** — media /
     environment becomes externally driven (time-varying nutrient pool
     consumed by the existing Layer-1 Steps); plumbing + qualitative-extreme
     tests only (chris_feedback_2026_05_26 §3), with gradient-shape /
     quantitative-biology deferred to the `transport-kinetics-fidelity`
     candidate-future-study.
  2. mbp-02-population-aggregation — **Evaluate phase** — aggregates per-cell
     mass into reactor-scale biomass / OD600 / cell-count via
     `cells_per_agent` representative-sampling scaling
     (chris_feedback_2026_05_26 §4; Eran's choice over literal-sum to make
     240-min batch dynamics resolvable). OD600 is cosmetic;
     `biomass_concentration_gL` is canonical.
  3. mbp-03-bird-reactor-coupling — adapter to `pbg-bioreactordesign`'s
     **BiRDTransportProcess** (a transport-only sibling of
     `BiRDReactorProcess` with no internal biomass ODE; see
     `chris_feedback_2026_05_26.md` §5 for the Option-B rationale). BiRD owns
     transport physics, v2ecoli owns biomass; the keystone coupling, and the
     first impl PR to wire a real engine under the cell-side interface
     contract (`references/expert/cell_side_interface_contract.md`).
     **Cross-investigation dependency:** mbp-03 entering Build is gated on the
     upstream `pbg-bioreactor-transport-fork` PR landing in pbg-bioreactordesign
     (seeded as a candidate-future-study in mbp-06).
  4. mbp-04-multigeneration-runs — sustained coupled run (≥ 3 v2ecoli
     generations); mass-balance audit; regime transition into
     substrate-limited growth.
  5. mbp-05-palsson-benchmark — evaluation phase
     (`chris_feedback_2026_05_26.md` §10) rendering a structured comparison
     report (overlay panels + categorized divergences) against the Beulig
     2025 (mSystems; senior author Palsson) batch-phase prefix. Pass criteria
     are whether the comparison was executed and reported coherently, not
     whether biology matched within tolerance; divergences feed mbp-06's gap
     analysis as input.
  6. mbp-06-gap-analysis — evaluation phase, not construction: walks the
     mbp-01..05 artifacts, synthesizes gaps across five axes (v2ecoli biology
     / coupling / BiRD physics / Beulig scope / methodology), and feeds the
     next investigation iteration.
  7. mbp-07-millard-kinetic-metabolism — Evaluate phase — kinetic-metabolism
     (Millard 2017) drop-in cell engine (baseline_millard) + reactor coupling,
     validated against the FBA baseline and graded head-to-head against the
     Beulig WT batch prefix alongside the WCM-FBA and iML1515 arms (3-arm
     report cards).


# ─── Methodology discipline ─────────────────────────────────────────────────
# These fields are descriptive metadata for the investigation, not consumed
# by the dashboard / lint today — but they make the inherited methodology
# explicit so future agents can read it off the YAML rather than the prose
# in `references/expert/multiscale_bioprocess_roadmap.md`.

discipline:

  # The biological-BDD closed loop (inherited from upstream methodology):
  # CURATE knowledge → translate into structured CLAIMS → generate behavior
  # TESTS from claims → run SIMULATIONS → COMPARE → TRIAGE divergences →
  # UPDATE knowledge/claims/tests/model.
  #
  # In this investigation:
  #   - CURATE  : references/papers/ (raw) + references/expert/ (extracted).
  #               Currently: Beulig 2025 PDF + expert-doc stub; upstream
  #               roadmap pointer; cell-side interface contract.
  #   - CLAIMS  : references/claims.yaml (structured, queryable).
  #   - TESTS   : per-study `behavior_tests[]` with `acceptance_form` tag
  #               (qualitative_direction | quantitative_range) and `cites`
  #               linking to claims via bib_keys.
  #   - RUN     : per-study `simulation_set[]` (planned now, populated as
  #               runs land).
  #   - COMPARE : impl-PR self-validation; results in `acceptance_results`
  #               and `findings[]`.
  #   - TRIAGE  : per-study `failure_modes[]` (candidate causes + checks);
  #               mbp-05's `divergences-categorized-in-report-card` test
  #               enforces the discipline.
  #   - UPDATE  : within-phase via impl PR; across-phase via test-revision
  #               PRs (see scope_discovery below).
  bdd_loop: curate -> claims -> tests -> simulate -> compare -> triage -> update

  # Phase-as-construction-unit (upstream methodology).
  # Each study has a spec PR (sections 1-9 of upstream's 10-section schema,
  # mapped onto this workspace's v3 study.yaml shape) and an impl PR (sections
  # 5d findings + report). Acceptance tests join the regression suite on
  # impl-PR merge.
  phase_unit:
    spec_pr_label: "study-spec"
    impl_pr_label: "study-impl"
    regression_discipline: |
      Every accepted study's acceptance tests join the workspace's permanent
      regression suite. New studies must not break prior studies' tests
      (see `regression_tests.inherits_from` in each downstream study).
      Modifying or retiring a prior acceptance test goes through a separate
      `test-revision` PR (opened on the investigation's main branch, not on
      a feature impl branch) — the upstream methodology calls this out
      explicitly to prevent "relax a test to make a new feature pass."

  # Scope discovery during implementation.
  scope_discovery:
    default: defer_and_proceed   # explicitly-marked placeholder + open question + candidate-future-study
    escalation: halt_and_amend   # only when discovery prevents an in-scope acceptance test from passing
    rare: rewind                 # original spec PR superseded if the decomposition itself was wrong

  # Substitutability contract (the discipline that makes engine substitution a
  # named operation rather than ad-hoc rework). See the cell-side interface
  # contract document for the contract specification.
  substitutability_contract: references/expert/cell_side_interface_contract.md

  # Methodology rule from chris_feedback_2026_05_26 §12: mechanism (plumbing)
  # tests and biological-fidelity tests live in SEPARATE studies. They have
  # different failure semantics and different remediation paths (fix the wire
  # vs. enhance the model). Bundling them conflates the AI agent's response
  # when something fails. mbp-01's reframe (plumbing + qualitative-extreme
  # only; transport-kinetics-fidelity deferred) is the canonical example;
  # future Henry's-law, kLa-response, and any "biological observable X
  # responds to driver Y" tests must respect the same split.
  scope_discipline:
    rule: mechanism_and_biology_tests_separate_studies
    applies_to: [mbp-01, mbp-03, mbp-04, every future "X responds to Y" test]
    rationale_source: references/expert/chris_feedback_2026_05_26.md#12

  # Beulig-specific axes that distinguish this investigation from the
  # upstream multiscale-bioprocess plan (which uses dFBA, not a whole-cell
  # model).
  beulig_benchmark_axes:
    - axis: trajectory_match
      observables: [OD600, biomass_gL, glucose_gL, acetate_gL, dissolved_o2]
      scope: in_for_mbp_05
      regime: WT batch-phase prefix
    - axis: strain_specific
      observables: per-strain (WT / SGKO×31 / TRP / TRPp / MEL) trajectories
      scope: deferred_to_mbp_06_or_future
      regime: full Beulig dataset
    - axis: transcriptional_state
      observables: per-strain per-phase transcriptome (>470 samples)
      scope: deferred_to_mbp_06_or_future
      regime: unique to v2ecoli — upstream's dFBA path lacks transcripts
    - axis: resistance_persistence_tradeoff
      observables: stress / maintenance stimulons; bistable expression states
      scope: deferred_to_mbp_06_or_future
      regime: Beulig's headline mechanism — needs v2ecoli's regulation layer


# Narrative-spine executive panel — rendered at the top of the
# investigation report's Overview. Captures (a) the current verdict for a
# reviewer scanning at the top of the page, (b) Chris's 2026-05-28
# verification-pass affirmative observations, (c) the changeset closing
# his nine inline review items + the §11 framework root cause, and
# (d) the 2026-05-29 architecture work that advanced mbp-01 from Build
# to Evaluate-ready.
executive:
  what_is_this: |
    Puts the v2ecoli single-cell model inside a bench-scale bioreactor. Seven studies build up the coupling: a time-varying environment hook, population aggregation with representative-sampling scaling, BiRD reactor coupling, multigeneration runs, a sim-vs-Beulig comparison, gap analysis, and a Millard 2017 kinetic-metabolism drop-in with 3-arm Beulig report cards.
  verdict: |
    **Build phase complete for mbp-01 and mbp-02; ready for Evaluate
    tooling.** Reviewer feedback through 2026-05-28 is processed (digest +
    raw export under `references/expert/`): all 9 inline cleanup items closed
    in source, the §11 framework root cause seeded as an upstream
    pbg-superpowers gap, and the two architectural blockers Chris's first pass
    left open (env-store-topology + env-driver-molecule-id) resolved
    2026-05-29 by the EnvironmentMirror Step (commit `60cdbd3`). mbp-01 went
    from 1 passing / 5 skipped to **6 passing / 0 skipped**.

