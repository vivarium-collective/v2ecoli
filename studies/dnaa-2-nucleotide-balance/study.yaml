      → To be re-evaluated on the directed seed-1 8-gen run (Rashmi 2026-06-04).

  # Rashmi 2026-06-04 named FOUR behaviors that must be preserved; the two above
  # (DnaA counts in band, DnaA-ATP fraction in band) plus the two below (periodic
  # mass doubling, oriC = exactly one initiation per generation). All four are the
  # dnaa-2 acceptance set, to be evaluated on the seed-1 8-gen reproduction.
  - name: periodic-mass-doubling
    classification: primary
    question: Does cell mass show periodic doubling (sawtooth) across generations?
    measure:
      kind: per_generation_mass_ratio
      path: listeners.mass.cell_mass
    pass_if:
      op: periodic_doubling_every_generation
      tolerance: 0.15
    status: passed   # seed-1 8-gen: 8/8 divisions, periodic sawtooth
    result: |
      PASS on the directed seed-1 8-gen run (dnaa2-seed1-8gen): 8/8 generations
      divide, cell mass periodic sawtooth, τ 53-79 min.
  - name: oric-one-initiation-per-generation
    classification: primary
    question: Does oriC go 1→2 exactly once per generation (no re-initiation, never 4)?
    measure:
      kind: oric_initiations_per_generation
      path: listeners.replication_data.number_of_oric
    pass_if:
      op: exactly_one_initiation_per_generation   # oriC in {1,2}; one 1→2 transition per cycle
    status: passed   # seed-1 8-gen: oriC in {1,2} every gen, never 4
    result: |
      PASS on the directed seed-1 8-gen run: oriC stays in {1,2} in all 8 generations
      (one 1→2 initiation per cycle, never reaches 4, no re-initiation).

