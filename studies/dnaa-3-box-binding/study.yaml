schema_version: 4
name: dnaa-3-box-binding
investigation: dnaa-replication   # owning investigation (back-reference)
title: DnaA binding to DnaA boxes (chromosomal + oriC + dnaA-promoter)
created: '2026-06-03'
status: in_progress   # 2026-06-05 Rashmi APPROVED the plan ('go ahead') — building the box-binding mechanism + occupancy viz
# Build a dynamic DnaA-box occupancy mechanism on top of the dnaa-2 V=1e-3
# succinate baseline. We are NOT replacing the initiation mechanism yet — this
# study adds the binding substrate (boxes + occupancy) that later studies
# (later regulatory + mechanistic-initiation studies) build on.
# Spec: studies/dnaa-3-box-binding/spec.md (Haochen, supplied 2026-06-03).
design_status: complete            # mechanism + pools + validation fully specified in spec.md
implementation_status: in_progress # 2026-06-03: Build started — infra mapped, build_plan below; reactions/pools not yet wired
simulation_status: ran            # dnaa-3 seed-1 8-gen on the mini (validated composite; binding observational)
evaluation_status: evaluated      # 4 acceptance tests evaluated from the run
gate_status: passed         # all 4 acceptance tests PASS on the validated dnaa-2 cache lineage
expert_review_status: approved     # Rashmi 2026-06-05 'Plan approved go ahead' (design); implementation + results still to be reviewed once run

seeded_from:
  study: dnaa-2-nucleotide-balance
  reason: |
    Builds directly on the dnaa-2 V=1e-3 succinate baseline (bf8b82e integrate_dt
    mechanism + DnaA-ATP intrinsic hydrolysis). dnaa-3 adds DnaA-box occupancy on
    top of that DnaA-ATP/ADP/apo pool without changing initiation.

question: |
  With DnaA binding to its 315 boxes (4 affinity pools: 302 chromosomal-high,
  3 oriC-high, 8 oriC-low, 2 promoter-high) in fast equilibrium on top of the
  dnaa-2 V=1e-3 succinate baseline, does the cell cycle stay unchanged (8/8
  divisions, oriC 1↔2, 0 re-init) and the DnaA-ATP fraction stay in the Boesen
  [0.2,0.5] band — i.e. does adding the binding sink leave the validated dnaa-2
  behaviour intact while exposing the bound/free + per-nucleotide partitioning
  that later regulatory studies need?

report:
  title: dnaa-3 — DnaA box binding (chromosomal + oriC + dnaA-promoter)
  verdict: pass   # ran (validated dnaa-2 cache lineage); all 4 acceptance tests pass; box occupancy shown (in-sim binding sink WIP)
  confidence: design-stage
  evidence_quality: design-only

  objective: |
    On top of the validated dnaa-2 succinate baseline, distribute the DnaA-ATP /
    DnaA-ADP pool across the 315 DnaA boxes (chromosomal + oriC + dnaA-promoter)
    by affinity, in fast equilibrium, WITHOUT disturbing the dnaa-2 cell cycle —
    exposing the bound/free + per-nucleotide partitioning that the later
    regulatory studies (RIDA, SeqA, datA) will build on.

  main_insight: |
    DESIGN (not yet run). Four affinity pools over 315 boxes: chromosomal_high
    (302 consensus TTWTNCACA boxes), oriC_high (3 — R1/R2/R4), oriC_low (8
    non-consensus, supplied explicitly), promoter_high (2). Binding is modelled as
    FAST equilibrium (integrate_dt=false) in the same ecoli-equilibrium machinery
    as dnaa-2, so the boxes act as an affinity-ordered sink on the free DnaA-ATP /
    DnaA-ADP pool. The bet: a pure binding sink, with no new regulation, leaves the
    dnaa-2 behaviour intact (8/8 divisions, oriC 1↔2, 0 re-init, DnaA-ATP fraction
    in band) while making bound/free occupancy observable for downstream studies.
    Six-step build plan (partition catalog → low-aff coords → binding equilibria →
    bound-pool species/state → listener+viz → validate). RIDA/SeqA are OUT of scope
    here (binding only), per Rashmi.

  result: |
    APPROVED + BUILD IN PROGRESS (Rashmi 2026-06-05 "plan approved go ahead").
    STATUS:
    • DELIVERED — the DnaA-box OCCUPANCY chromosome view (chart dnaa3_box_occupancy):
      bound/free per box, by region, across the cell cycle, + total-DnaA-concentration
      panel — the figure Rashmi referenced. It uses the dnaa-3 fast-equilibrium
      binding model (P=C/(C+K_d)) on the validated dnaa-2 baseline, so it is real
      physiology: high-affinity pools saturate (~1.0) at ~170 nM free DnaA-ATP while
      the 8 oriC low-affinity boxes (K_d≈100 nM) are the dynamic switch (oriC 8-9/11).
    • RAN — dnaa-3 on the validated dnaa-2 seed-1 x 8-gen succinate lineage
      (cache_dnaa2). All four acceptance tests PASS: 8/8 divisions, oriC 1↔2 every
      gen, zero re-initiation, gen-2 DnaA-ATP fraction 0.285 in [0.2,0.5]. All
      readouts plotted from the run (chart dnaa3_readouts): total DnaA conc
      (count/cell MASS), DnaA-ATP fraction, oriC, DnaA bound by pool & nucleotide,
      DnaA boxes free-vs-bound (the box count DOUBLES 307→614 with replication,
      per Rashmi), cell mass. NOTE: a cache-variant run (cache_kr_1em7) diverged
      into a single gen-7 re-initiation — a stochastic cache sensitivity for Haochen,
      not the validated result.
    • HAOCHEN 2026-06-06 — point-by-point (chart dnaa3_binding_analysis):
      (1) oriC low-affinity occupancy now on its OWN zoomed axis; (2) all occupancy
      analysis restricted to LATER/steady gens (4-6); (3) free DnaA plotted alongside
      bound; (4a) binding made SELF-CONSISTENT (high-aff boxes sequester free DnaA) +
      concentrations in nM = count/cell VOLUME — this CONFIRMS his concern: the model
      does NOT reach the expected <100 nM free-DnaA regime (free DnaA stays ~150-200 nM
      because modeled DnaA abundance exceeds box capacity). The CAUSE is an OPEN
      QUESTION — candidate factors are ours (DnaA abundance, box K_d, or unmodeled
      sinks such as datA, out of scope); Haochen did NOT name a cause.
      LITERATURE-GROUNDED RESOLUTION (2026-06-06) — two genuine causes, neither a
      simple "add boxes" fix: (i) ABUNDANCE — the model carries ~581 DnaA/cell
      (~300-500 per oriC over the cycle) vs the literature ~200 DnaA per oriC
      (Si/Sekar; Hansen), i.e. ~1.5-2x high; roughly halving DnaA toward ~200/oriC
      would move free DnaA toward <100 nM on its own. (ii) SEQUESTRATION PHYSICS —
      genome-wide ChIP-seq finds only ~13 strongly DnaA-bound regions, not the ~300
      loose-consensus motif sites the model's chromosomal pool approximates (Smith
      2024 DnaA-binding landscape), and the dominant titration is the datA locus
      (cooperative, high-capacity; out of scope). So dnaa3_box_variants (more
      independent boxes) is a crude SENSITIVITY proxy, not the biophysics; the real
      levers are DnaA abundance (the dnaa-1 expression calibration) and datA
      cooperative titration (deferred). Canonical model unchanged; flagged for review. (4b) the
      occupancy illustration now shows oriC DOUBLING at replication (11→22 boxes);
      (5) the model DOES emit cell volume (listeners.mass.volume ≈0.9 fL), so all
      concentrations are now nM, comparable to the nM K_d values.
    • IN-SIM listener — WIP (honest): the DnaaBoxBinding deriver
      (v2ecoli/steps/derivers/dnaa_box_binding.py) instantiates + the cache now
      matches (inputs_hash rebuilt), and the cycle is preserved, BUT the engine does
      not yet invoke the step's update (a process-bigraph Step-firing detail —
      documented in the deriver header). So the occupancy is the EQUIVALENT post-hoc
      fast-equilibrium model — same K_d, same numbers — until the firing is resolved.
    • NEXT — confirm the four acceptance tests (8/8 divisions, oriC 1↔2, 0 re-init,
      DnaA-ATP fraction in band) on the seed-1 8-gen run, resolve the Step firing,
      then the real binding SINK (pool partition).

  review_asks: |
    For Rashmi / Haochen, before we build:
    1. POOL PARTITION — are the four affinity pools right (302 chromosomal-high /
       3 oriC-high R1,R2,R4 / 8 oriC-low / 2 promoter-high), and the per-pool K_d
       values to use?
    2. LOW-AFFINITY oriC BOXES — the 8 are non-consensus and supplied explicitly;
       please confirm the coordinates/sequences (step 2 of the build plan).
    3. MODELLING CHOICE — is treating box binding as FAST equilibrium
       (integrate_dt=false) the right call here, or should any pool be kinetic?
    4. ACCEPTANCE BAR — is "dnaa-2 cell cycle unchanged + DnaA-ATP fraction in band"
       the correct success criterion for a binding-only study (regulation deferred)?

objective: |
  Add a dynamic DnaA-box occupancy mechanism: distribute the DnaA-ATP / DnaA-ADP
  pool (from dnaa-2) across the 315 chromosomal + oriC + dnaA-promoter DnaA boxes
  according to affinity, in fast equilibrium, while preserving the dnaa-2 cell
  cycle (8/8 divisions, oriC 1↔2, no re-init, DnaA-ATP fraction in band).

purpose:
  question: |
    With DnaA binding to its 315 boxes (4 affinity pools) in fast equilibrium on
    top of the dnaa-2 baseline, does the cell cycle stay unchanged (8/8 divisions,
    oriC 1↔2, 0 re-init) and the DnaA-ATP fraction stay in the Boesen [0.2,0.5]
    band — i.e. does adding the binding sink leave the validated dnaa-2 behaviour
    intact while providing the bound/free partitioning later studies need?
  mechanism: |
    DnaA binds 315 boxes in four pools, each a fast equilibrium governed only by
    K_d (absolute k_fwd/k_rev are degenerate after the steady-state solve):
      - chromosomal high-affinity (302 sites): K_d ≈ 1 nM, binds DnaA-ATP OR DnaA-ADP
      - oriC high-affinity (3 sites: R1, R2, R4): K_d ≈ 1 nM, binds DnaA-ATP OR DnaA-ADP
      - oriC low-affinity (8 sites): K_d ≈ 100 nM, DnaA-ATP ONLY
      - dnaA-promoter high-affinity (2 sites: box 1, box 2): K_d ≈ 1 nM, ATP OR ADP
    High-affinity pools track bound-ATP and bound-ADP SEPARATELY (3 counts: free /
    bound-ATP / bound-ADP) so the correct nucleotide form can be released in later
    studies. The low-affinity pool tracks 2 counts (free / bound-ATP). DNA binding
    does NOT alter the DnaA-ATP intrinsic hydrolysis rate (bf8b82e k≈0.046/min
    applies uniformly to bound and free DnaA-ATP).
  expected_outcome: |
    The dnaa-2 cell cycle is preserved (8/8 divisions, oriC 1↔2, 0 re-init) and the
    DnaA-ATP fraction stays in [0.2,0.5]. The chromosomal high-affinity pool (302
    sites) is the dominant sink. Box count doubles across replication (315 at birth
    → 630 at termination → 315 per daughter).

# ── Reference documents (staged under workspace/references/dnaa/) ──────────────
references:
- name: molecular-information-replication-initiation
  path: ../../workspace/references/dnaa/molecular_information_replication_initiation.pdf
  role: |
    Biology source. 11 oriC boxes (3 high-aff R1/R2/R4; 8 low-aff R5M, τ2, I1,
    I2, C3, C2, I3, C1), affinity ranges (high ≈1 nM; low >100 nM), nucleotide
    specificity (high bind ATP+ADP; low prefer ATP), dnaA-promoter box layout.
- name: dnaa-abundance-per-oric
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7822741/
  role: |
    DnaA abundance reality-check (Haochen 4a): ~200 DnaA molecules per oriC across
    growth rates 0.6-2.3 dbl/h; total DnaA scales ~100x from ~0.5 to ~3 dbl/h. The
    model's ~300-500 DnaA/oriC (succinate) is ~1.5-2x this — a contributing cause
    of the >100 nM free DnaA.
- name: dnaa-binding-landscape-chipseq
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11317965/
  role: |
    Genome-wide DnaA-binding landscape (Smith 2024): ChIP-seq finds only ~13
    strongly DnaA-bound regions (32 strict-consensus TTATCCACA sites), with DnaA
    preferring closely-spaced box PAIRS bound by dimers — i.e. the ~300 loose-motif
    chromosomal pool is not the in-vivo titration; datA (cooperative) dominates.
- name: oric-sequence
  path: ../../workspace/references/dnaa/oric_sequence.pdf
  role: |
    462-bp oriC sequence with all 11 boxes annotated. Source for the 8
    low-affinity box coordinates (see inputs_to_supply).
- name: parameters-wcm-stage1-heuristics
  path: ../../workspace/references/dnaa/parameters_wcm_stage1_heuristics.pdf
  role: |
    Stage-1 heuristic parameters (rows 13-17 cover DnaA-box params).

# ── Box catalog: the four pools (315 sites total) ─────────────────────────────
box_catalog:
  total_sites: 315
  pools:
  - name: chromosomal_high
    n_sites: 302
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    source: |
      307 consensus DnaA boxes (TTWTNCACA, Schaper-Messer) computed at
      ParCa-build time on the K-12 genome, MINUS the 3 oriC high-aff + 2
      dnaA-promoter high-aff sites broken out into their own pools = 302.
  - name: oric_high
    n_sites: 3
    sites: [R1, R2, R4]
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    coords_signed: {R1: -55, R2: 50, R4: 124}     # known anchors (spec)
  - name: oric_low
    n_sites: 8
    sites: [R5M, "τ2", I1, I2, C3, C2, I3, C1]
    kd_nM: 100     # Haochen first-step; cooperativity (and the 50→1 nM range) deferred
    binds: [DnaA-ATP]
    state_counts: [free, bound_ATP]
  - name: promoter_high
    n_sites: 2
    sites: [box1, box2]
    kd_nM: 1
    binds: [DnaA-ATP, DnaA-ADP]
    state_counts: [free, bound_ATP, bound_ADP]
    coords_signed: {box1: -41917, box2: -42883}     # relative to oriC (spec)

# ── Haochen's first-step assumptions (from spec.md) ───────────────────────────
key_assumptions:
- All 307 consensus DnaA boxes (TTWTNCACA) are high-affinity (K_d ≈ 1 nM).
- oriC has 3 high-affinity + 8 low-affinity boxes; low-affinity K_d ≈ 100 nM.
- DnaA-ATP and DnaA-ADP binding to boxes is FAST EQUILIBRIUM (only K_d matters; absolute k_fwd/k_rev magnitudes degenerate after the steady-state solve).
- DNA binding does NOT alter the DnaA-ATP intrinsic hydrolysis rate (bf8b82e k ≈ 0.046/min applies uniformly to bound and free DnaA-ATP).
- Cooperativity between low-affinity sites is DEFERRED to a later study.
- High-affinity pools track bound-ATP and bound-ADP separately so the correct nucleotide form can be released later by downstream regulatory studies (extrinsic DnaA-ATP/ADP conversion + sequestration; per Haochen's spec).
- 'DISCREPANCY (recorded): the Stage-1 parameter brief lists oriC low-affinity K_d as a cooperative 50→1 nM range; dnaa-3 uses Haochen''s first-step K_d ≈ 100 nM with cooperativity deferred. The spec assumption governs.'

