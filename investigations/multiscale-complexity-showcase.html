<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiscale Complexity in a Whole-Cell E. coli — report</title>
<style>
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --sunken:#F4F2ED;
  --ink:#1F1D1B; --ink-2:#57534E; --ink-3:#8A857D;
  --line:#E7E4DE; --line-2:#D8D4CC;
  --accent:#0F766B; --accent-soft:#0F766B22;
  --pass:#1A7F5A; --fail:#B42318; --warn:#A16207; --cal:#0E7490;
  --pass-soft:#1A7F5A18; --fail-soft:#B4231814; --warn-soft:#A1620714;
  --chip:#F1EFEA;
  --shadow:0 1px 2px rgba(30,25,20,.04),0 1px 0 var(--line);
  --serif:"Iowan Old Style","Palatino Nova",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}}
:root[data-theme="dark"]{
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-padding-top:64px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.9em}
.serif{font-family:var(--serif)}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.switch{display:flex;gap:4px;margin-left:auto;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.switch button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:none;border:none;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch-label{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.switch-label+.switch{margin-left:10px}
.themebtn{background:none;border:1px solid var(--line);color:var(--ink-2);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}

/* ---- masthead ---- */
.masthead{padding:44px 0 8px}
.masthead .eyebrow{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0;
  letter-spacing:-.01em;text-wrap:balance;max-width:20ch}
.provline{color:var(--ink-3);font-size:13px;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.provline .sep{opacity:.5}

/* ---- verdict banner ---- */
.verdict{margin:28px 0 8px;padding:24px 26px 24px 30px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--pass);border-radius:12px;box-shadow:var(--shadow)}
.verdict.is-fail{border-left-color:var(--fail)}
.verdict .vhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.verdict .vtext{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink);margin:0;max-width:none}
.verdict .what{color:var(--ink-2);font-size:14.5px;margin-top:14px;max-width:none}

/* status chip */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:4px 11px;border-radius:999px;text-transform:uppercase}
.status.pass{color:var(--pass);background:var(--pass-soft)}
.status.fail{color:var(--fail);background:var(--fail-soft)}
.status.warn{color:var(--warn);background:var(--warn-soft)}
.status .g{width:7px;height:7px;border-radius:999px;background:currentColor}

/* ---- stat strip ---- */
.stats{display:flex;flex-wrap:wrap;gap:0;margin:22px 0;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden}
.stats .stat{flex:1;min-width:120px;padding:16px 18px;border-right:1px solid var(--line)}
.stats .stat:last-child{border-right:none}
.stats .num{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stats .lbl{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.stats .num.pass{color:var(--pass)}.stats .num.fail{color:var(--fail)}

/* ---- section headers ---- */
.sec-h{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px}
.sec-h h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line)}

/* ---- glance table ---- */
.glance{width:100%;border-collapse:collapse;font-size:14px}
.glance th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line-2)}
.glance td{padding:11px 12px;border-bottom:1px solid var(--line)}
.glance tr:hover td{background:var(--sunken)}
.glance .idx{color:var(--ink-3);font-family:var(--mono);width:26px}
.glance a.st{font-weight:600;color:var(--ink)}
.glance a.st:hover{color:var(--accent);text-decoration:none}
.glance .flag{color:var(--warn);font-size:11.5px;font-weight:700;margin-left:8px}

/* ---- sticky nav ---- */
.subnav{position:sticky;top:56px;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:36px}
.subnav .wrap{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{font-size:12.5px;color:var(--ink-2);padding:5px 10px;border-radius:7px;white-space:nowrap;font-weight:500}
.subnav a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.subnav a.exec{font-weight:600}

/* ---- study card ---- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px;margin:24px 0;box-shadow:var(--shadow);scroll-margin-top:112px}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--pass)}
.card.is-fail::before{background:var(--fail)}
.card.is-control{border-style:dashed;border-color:var(--line-2)}
/* collapsed cards are wholly clickable — signal it clearly */
.card.collapsed{cursor:pointer;padding-bottom:44px;transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease}
.card.collapsed:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(30,25,20,.10),0 1px 0 var(--line);transform:translateY(-1px)}
.card.collapsed::after{content:"Click to expand ▾";position:absolute;right:24px;bottom:16px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);pointer-events:none}
.card.collapsed:hover::after{color:var(--accent)}
.card.collapsed:hover .ctoggle{color:var(--accent)}
.card-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px;cursor:pointer;user-select:none}
.card-h .ctoggle{color:var(--ink-3);font-size:15px;padding-top:5px;transition:transform .15s,color .15s;line-height:1}
.card.collapsed .card-h .ctoggle{transform:rotate(-90deg)}
.card-h .cnum{font-family:var(--mono);color:var(--ink-3);font-size:14px;padding-top:5px}
/* collapse behaviour */
.card.collapsed .study-detail{display:none}
.card:not(.collapsed) .study-summary{display:none}
.study-summary{margin-top:10px}
.summary-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.summary-snip{color:var(--ink-2);font-size:13.5px;max-width:none;margin-top:6px}
.studies-toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
.studies-toolbar button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.studies-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.card-h .ctitle{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;flex:1;line-height:1.2}
.card-h .cright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control-kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}
.claim{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin:8px 0 2px;max-width:none;font-style:italic}
.biology{color:var(--ink-2);font-size:14px;margin:8px 0 4px;max-width:none}

/* spine stage */
.stage{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:none}
.stage>.kicker{display:block;margin-bottom:12px}
.substage{margin:14px 0}
.substage .slabel{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.kv{color:var(--ink);font-size:14.5px}
.kv .rationale{color:var(--ink-2);font-size:13.5px;margin-top:4px;max-width:none}
.decision-line{font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;
  border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.pass{color:var(--pass);background:var(--pass-soft)}
.chip.fail{color:var(--fail);background:var(--fail-soft)}
.chip.decision{background:none;border:1px solid var(--accent);color:var(--accent)}
.chip.mod{background:none;border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:11.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* mini table for tests */
.ttable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.ttable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable tr:last-child td{border-bottom:none}
.ttable .tname{font-weight:600}
.ttable .texp{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.ttable .tv{text-align:right;white-space:nowrap}

/* decision box */
.decbox{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--sunken);
  border-radius:10px;margin-top:6px}
.decbox>div:last-child{flex:1 1 auto;min-width:0}
.decbox .dverdict{font-size:14px}
.decbox .dnarr{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:none}

/* figures */
figure{margin:12px 0 4px}
figure svg{max-width:100%;height:auto;display:block}
figure img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.spine-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.spine-badge.v-passed{color:var(--pass);background:var(--pass-soft)}
.spine-badge.v-failing{color:var(--fail);background:var(--fail-soft)}
.spine-badge.v-blocked,.spine-badge.v-needs_calibration{color:var(--warn);background:var(--warn-soft)}
.spine-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.spine-legend-item{font-size:11.5px;color:var(--ink-2)}
.study-verdict-dag,.acceptance-rollup,.ac-gating-matrix{margin-top:4px}
.ac-gating-matrix .gap,.acceptance-rollup td{font-size:13.5px}
figcaption{color:var(--ink-2);font-size:12.5px;margin-top:8px;max-width:none}
.fig-scroll{overflow-x:auto}
.loom-embed{margin:12px 0 4px}
.loom-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);height:440px;resize:vertical;min-height:240px}
/* An inlined local: visualization runs in its own iframe so its scripts execute
   and its (often full-document) CSS can't leak into the report. onload sizes it
   to content; this is the pre-resize default. */
.viz-frame{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:460px;display:block}
/* An interactive (Plotly) figure rendered inline in the main document, sharing
   the report's one Plotly.js. Bordered like the iframe path it replaces. */
.embedded-plotly .plotly-holder{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;overflow:hidden}
.embedded-plotly .plotly-holder>div{max-width:100%}
.loom-iframe{width:100%;height:100%;border:0;display:block}
.loom-fallback{margin-top:6px}
.loom-fallback>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
.loom-fallback[open]>summary{margin-bottom:6px}

/* expander */
details.exp{margin-top:10px;border-top:1px dotted var(--line-2);padding-top:8px}
details.exp>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::before{content:"▸ ";color:var(--ink-3)}
details.exp[open]>summary::before{content:"▾ "}
details.exp .body{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:none}

/* appendix */
.appendix{margin:52px 0 24px}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cat-table td,.cat-table th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cat-table th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.cat-table .m{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}

/* breadcrumb + prev/next + study grid */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);padding:26px 0 2px}
.crumb a{color:var(--ink-2);font-weight:600}
.crumb .cur{color:var(--ink)}
.crumb .chev{opacity:.5}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin:28px 0 8px}
.prevnext a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.prevnext a:hover{border-color:var(--accent);text-decoration:none}
.prevnext a.next{text-align:right;align-items:flex-end}
.prevnext .dir{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.prevnext .nm{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.gcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--accent);text-decoration:none}
.gcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pass)}
.gcard.is-fail::before{background:var(--fail)}
.gcard .gh{display:flex;align-items:baseline;gap:8px}
.gcard .gn{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.gcard .gt{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.2}
.gcard .grole{color:var(--ink-2);font-size:12.5px}
.gcard .gclaim{color:var(--ink-2);font-size:13px;line-height:1.5;font-style:italic}
.gcard .gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.gcard .garrow{color:var(--accent);font-size:13px;font-weight:600}
/* per-section feedback bubble */
.fbsection{position:relative}
.fbbubble{position:absolute;right:-6px;top:-4px;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .12s,transform .12s,color .12s,border-color .12s;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.fbsection:hover>.fbbubble{opacity:.85}
.fbbubble:hover{opacity:1 !important;transform:scale(1.08);color:var(--accent);border-color:var(--accent)}
.fbbubble.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fbbubble.has::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:1.5px solid var(--surface)}
.fbeditor-wrap{margin-top:12px;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px}
.fbeditor-wrap .fbrow{margin-top:0;padding-top:0;border-top:none}
@media(max-width:640px){.fbbubble{opacity:.6}}
/* feedback */
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-2)}
.fbrow .fblabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fbdisp{display:flex;gap:4px}
.fbdisp button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.fbdisp button.on-ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.fbdisp button.on-rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.fbrow input.fbnote{flex:1;min-width:180px;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fbrow input.fbnote:focus{outline:none;border-color:var(--accent)}
.fbfloat{position:fixed;right:22px;bottom:22px;z-index:60;background:var(--accent);color:#fff;border:none;
  border-radius:999px;padding:12px 18px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,118,107,.4);display:flex;align-items:center;gap:8px}
.fbfloat .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;font-size:12px}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(20,18,15,.5);display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--serif);font-size:20px;margin:0;padding:20px 22px 6px}
.modal .sub{color:var(--ink-2);font-size:13px;padding:0 22px 12px}
.modal textarea{flex:1;margin:0 22px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:280px;resize:vertical}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px}
.modal .mfoot button{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .mfoot button.primary{background:var(--accent);color:#fff;border-color:transparent}
footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0 60px;color:var(--ink-3);font-size:12.5px}

<script id="data" type="application/json">{"slug": "multiscale-complexity-showcase", "title": "Multiscale Complexity in a Whole-Cell E. coli", "status": "planning", "question": "What emergent biological phenomena does v2ecoli produce that are invisible at any\nsingle scale, and appear only when molecular, cellular, and population scales are\ncoupled? Where the model diverges from cited biology, what is the smallest principled\ncorrection that closes the gap — and, just as importantly, can a disciplined loop tell\napart the three fates of a candidate defect: already-correct, structurally-limited, and\nfixable? The investigation's real object is not any single number but the epistemics of\ncorrecting a whole-cell model without fooling yourself.\n", "hypothesis": "The whole-cell model expresses genuine multiscale complexity in three distinct\nflavors: (1) cross-scale CONTROL — a single molecular signal (ppGpp) coordinates\nribosome allocation, replication initiation, and growth across scales; (2) nonlinear\nFLUX REALLOCATION — central-carbon metabolism reroutes under stress with emergent\nenergetic consequences; (3) ORDER FROM NOISE — stochastic molecular events produce\nstatistically lawful single-cell and population heterogeneity. The disciplined\ngap->fix->validate loop will, across these arcs, correctly sort each divergence into\nalready-correct, structural, or fixable, refuse an unprincipled fix, and — where a fix\nis warranted — land it with a held-out check.\n", "lead": "A whole-cell model is only interesting where its parts add up to something no part\npredicts. This investigation tours three such places — signaling that runs the whole\ncell, metabolism that reroutes under stress, and heterogeneity that emerges from noise\n— and at each one it does more than look: it finds where v2ecoli falls short of known\nbiology, decides whether the gap is real, structural, or fixable, makes the smallest\ndefensible correction when one is warranted, and shows the improvement and the insight\nthe fix exposes. The headline is a method as much as a result: a model-correction loop\nthat earns trust by rejecting the wrong fix (maintenance ATP) before landing the right\none (respiratory ATP supply).\n", "executive": {"what_is_this": "A biology-forward discovery showcase across three scales of the v2ecoli whole-cell model, framed around a single question a modeler actually faces: when the model disagrees with biology, is the gap already-correct, structural, or fixable — and how do you tell without fooling yourself? Each arc runs a gap -> fix -> validate -> insight loop on the real native ecoli_baseline composite; a capstone shows one nutrient axis moving every scale in concert; and a follow-up program carries each flagged gap to a landed fix and adds the causal and statistical controls a skeptic demands. Every run is real (native ParCa cache; exchange fluxes read live from the composite store); no fabricated fixes.", "verdict": "The load-bearing result is a METHOD: a disciplined loop that sorts a whole-cell model's divergences from biology into already-correct, structural, and fixable, and refuses an unprincipled fix. It produced all three outcomes on real biology.\nArc 1 (ppGpp -> replication) is NATIVELY CORRECT: origins per cell scale with growth (2.4 -> 4.2), ppGpp anti-correlates 4.1x, initiation mass is constant to 7% — the Cooper-Helmstetter/Donachie law, unforced. Arc 2 (metabolism energy balance) is the method's showcase: the biomass-yield defect is real (Yxs 0.816, RQ 2.94), but the prior investigation's scoped maintenance-ATP fix is REFUTED at the FBA (GAM x5, NGAM x10 leave yield/O2/growth flat), which re-localized the defect to ATP SUPPLY — and the mcs-05 follow-up then found the mechanism (ATP synthase running in reverse: synthesis 0, hydrolysis 7.48). But the proposed one-parameter fix did NOT survive the loop's own held-out control: on independent re-execution (mcs-11) the committed reverse-cap (4.5) does not robustly restore wth under carbon limitation — needs a carbon-quality ladder. Across acetate→succinate→glucose→+AA, v2ecoli's ribosome concentration climbs monotonically, reproducing the C-line direction (a robustness fix unblocked the media).", "behavior_tests": [{"name": "ribosome-fraction-rises-with-growth", "classification": "primary", "measure": "ribosome_conc across the carbon-quality ladder", "pass_if": "monotonic rise with growth rate (Scott 2010 C-line)", "expected": "increases with growth", "observed": "1.42 → 1.87 → 20.8 → 21.2 (acetate→succinate→glucose→+AA)", "verdict": "pass"}, {"name": "biotin-clamp-unblocks-conditions", "classification": "primary", "measure": "acetate/succinate FBA feasibility", "pass_if": "runs without the spurious negative-homeostatic-target crash", "expected": "conditions run", "observed": "clamp of FP-noise negatives (modular_fba.py) lets them run", "verdict": "pass"}], "runs": [{"name": "mcs07-carbon-quality-ladder", "composite": "v2ecoli.composites.ecoli_baseline.ecoli_baseline", "kind": "simulation", "canonical": true, "status": "completed", "result": "PASS", "description": "Ribosome_conc vs growth across a carbon-quality ladder: acetate, succinate (new caches, enabled by the biotin clamp fix), glucose (basal), +amino acids. acetate/ succinate are gen-1 (transient, ill-conditioned FBA); glucose/with_aa from Arc 1.", "computed_outcomes": {"ribosome-fraction-rises-with-growth": {"result": "PASS", "detail": "ribosome_conc rises MONOTONICALLY with growth rate: acetate 1.42 -> succinate 1.87 -> glucose 20.8 -> with_aa 21.2. Reproduces the Scott-Hwa C-line direction."}, "biotin-clamp-unblocks-conditions": {"result": "PASS", "detail": "acetate/succinate previously crashed (Homeostatic target -1.5e-6 for BIOTIN[c]); the clamp fix lets them run."}}, "outcomes": {"ribosome-fraction-rises-with-growth": {"result": "PASS"}, "biotin-clamp-unblocks-conditions": {"result": "PASS"}}, "emitter": "parquet"}], "conclusion": "## Final model A robustness fix clamps  "composite": "v2ecoli.composites.ecoli_baseline.ecoli_baseline", "kind": "simulation", "canonical": true, "status": "completed", "result": "FAIL", "description": "GAM (dark_atp x1.5, x5) and NGAM (x3, x10) scaled via patched cache config. Override VERIFIED to reach the FBA: model.ngam = 83.9 mmol/gDW/h at NGAM x10 (10x Feist).", "computed_outcomes": {"biomass-yield-in-measured-band": {"result": "FAIL", "detail": "Yield stays 0.82-0.83 across the whole sweep (GAM x1->x5, NGAM x1->x10). Never approaches the band. The FBA is INSENSITIVE to the maintenance-ATP bound."}, "growth-rate-preserved": {"result": "PASS", "detail": "HELD-OUT: growth stays 0.95-0.97/h across the sweep — but only because the fix has no effect at all, so 'preserved' here is not evidence the fix works."}}, "outcomes": {"biomass-yield-in-measured-band": {"result": "FAIL"}, "rq-approaches-one": {"result": "FAIL"}, "maintenance-atp-fix-moves-yield": {"result": "FAIL"}}, "emitter": "parquet"}], "conclusion": "## Result The scoped maintenance-ATP fix is REFUTED — GAM/NGAM changes leave yield/O2/growth flat. The defect is re-localized to ATP-supply stoichiometry, which its follow-up (mcs-05) then fixes. An adversarial study that succeeds by rejecting the wrong hypothesis.", "findings": [{"id": "maintenance-atp-fix-refuted-defect-is-atp-supply", "kind": "computational", "status": "contradicts", "statement": "The v2ecoli baseline builds 0.816 gDW biomass per gram of glucose (1.84x the measured band, 1.52x the first-principles ceiling) while barely respiring (O2:glucose 0.137, RQ 2.94 — impossible for pure aerobic respiration). Prior work SCOPED the fix to maintenance ATP (GAM/NGAM) and respiratory capacity. This study tests that directly and REFUTES it: scaling GAM to 5x and NGAM to 10x (83.9 mmol/gDW/h, an order of magnitude above the Feist iAF1260 literature value, and verified to reach the FBA via model.ngam) moves biomass yield less than 2% and leaves O2 uptake and growth essentially unchanged. The FBA is insensitive to the maintenance-ATP bound because ATP is already over-supplied: the cell meets any maintenance demand from a surplus, so the defect cannot be in ATP DEMAND. It is in ATP SUPPLY — the ATP-generation stoichiometry (a too-high effective P/O ratio / an over-efficient or short-circuited electron-transport chain), which also explains why the cell makes ATP with almost no O2 (RQ ~3). This advances the prior investigation from 'energetic defect, fix scoped to maintenance' to 'energetic defect, maintenance fix falsified, defect localized to oxidative-phosphorylation stoichiometry.'", "evidence": {"from_test": "biomass-yield-in-measured-band", "from_run": "arc2-maintenance-atp-sweep", "baseline": {"biomass_yield": 0.816, "RQ": 2.94, "O2_glucose": 0.137, "growth_per_h": 0.956}, "sweep_yield_range": [0.816, 0.831], "ngam_x10_model_value_mmol_gDW_h": 83.9, "feist_ngam_literature": 8.39, "measured_band": [0.355, 0.444], "theoretical_max": 0.538}, "expected": {"summary": "If the defect were insufficient maintenance ATP, raising GAM/NGAM would force glucose oxidation, drop yield into the band, and lift RQ toward 1. None of that happens."}, "next_action": "Localize the ATP-generation defect: audit the ETC / oxidative-phosphorylation reaction stoichiometry (effective P/O ratio) and any free-ATP loops in the FBA. This is a reaction-stoichiometry fix, not a parameter tweak, so it is out of scope for a 'small correction' and is flagged for a dedicated follow-up.", "next_action_type": "escalate_model", "provenance": {"run_ids": ["arc2-baseline-invivo-probe", "arc2-maintenance-atp-sweep"]}, "caveats": ["Single-cell in-process probe over a partial cell cycle; absolute yield validated against the multi-cell diagnostic (0.816 vs 0.831, ~2%).", "The sweep is a refutation, not an exhaustive search; a combined ETC-stoichiometry + maintenance change could still matter, but maintenance ALONE is falsified."]}], "pipeline_gate": {"enables": ["mcs-04-capstone-downshift"]}, "slug": lism-energy-balance --steps 2700"}], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "Follow-up (Arc 2) — locate & correct the ATP-supply defect", "confidence": "Investigating", "gate_status": "mixed", "question": "Arc 2 (mcs-02) confirmed the biomass-yield defect is ENERGETIC and, crucially, that it is INSENSITIVE to maintenance ATP (GAM x5, NGAM x10 leave yield/O2/growth flat) — ATP is over-supplied. Where in the FBA is ATP generated so cheaply that maintenance demand is irrelevant, and can a principled correction to the oxidative-phosphorylation / electron- transport stoichiometry (an over-high effective P/O ratio, or a free-ATP loop) restore RQ toward 1 and biomass yield into the measured band?", "claim": "Root cause found, fix landed, INTEGRATED and centred in-band. The ATP-supply defect localizes one level deeper than Arc 2: ATP synthase runs in REVERSE (hydrolysis 7.48, synthesis 0), so the model makes no respiratory ATP and over-supplies it by substrate-level phosphorylation — exactly WHY maintenance ATP was irrelevant (Arc 2). Capping ATP synthase's reverse (ATPase) flux forces net-forward (respiratory) operation; calibrating the cap to 4.5 and committing it to metabolism.py moves biomass yield 0.816 -> 0.390 (squarely in the measured 0.355-0.444 band, flipping the graded axis from first_principles_violation to passing) while RQ falls 2.94 -> 1.11 and growth is preserved (0.97/h) — both HELD-OUT. Respiration turns on (O2 0.89 -> 16.9) and acetate overflow appears, as biology requires. The loop is fully closed: refute the wrong fix (Arc 2) -> find the mechanism (reverse ATP synthase) -> apply, refine and integrate the correction -> validate on held-out metrics.  [RE-EXECUTION UPDATE (mcs-11): the in-band yield does NOT robustly reproduce — the reverse-cap admits a non-respiring FBA optimum (yield 0.819) at the same cap, so 0.390 is solve-path dependent. The ATP-synthase-reversal DIAGNOSIS stands; the one-parameter FIX is downgraded to not-robust and must force forward respiration.]", "biological_summary": "The energetic defect (mcs-02) traced to ATP synthase running in REVERSE — the cell dumps an ATP surplus instead of respiring. Capping the reverse (ATPase) flux forces net-forward operation: respiration turns on, RQ falls to ~1, biomass yield lands in the measured band, and aerobic acetate overflow (Basan 2015) appears — with growth preserved and no regression elsewhere.", "behavior_tests": [{"name": "atp-supply-defect-localized", "classification": "primary", "measure": "ATP synthase forward (synthesis) vs reverse (hydrolysis) flux in the FBA solution", "pass_if": "identify the cheap-ATP route", "expected": "a route that makes ATP without O2", "observed": "synthesis 0 / reverse 7.48 — ATP synthase runs backwards", "verdict": "pass"}, {"name": "corrected-yield-in-band", "classification": "primary", "measure": "biomass yield after the integrated fix (cap=4.5, committed to metabolism.py)", "pass_if": "0.355–0.444", "expected": "in band", "observed": "0.390 (one solve path) but NOT robust — re-execution also lands 0.819 at the same cap (see mcs-11); solve-path dependent", "verdict": "fail"}, {"name": "rq-approaches-one", "classification": "primary", "measure": "RQ after fix", "pass_if": "≈ 1", "expected": "~1", "observed": "1.11 (from 2.94); O2 uptake 0.89→16.9; acetate overflow appears", "verdict": "pass"}, {"name": "growth-physiological-after-fix", "classification": "primary", "measure": "growth rate (HELD-OUT — not tuned)", "pass_if": "physiological", "expected": "preserved", "observed": "0.974/h (from 0.956)", "verdict": "pass"}, {"name": "no-regression-other-axes", "classification": "primary", "measure": "growth, division time, cell mass, origins, composition vs pre-fix", "pass_if": "all hold within a few %", "expected": "no collateral damage", "observed": "growth −1.5%, τ unchanged, mass +2%, composition ≤3.6% — clean", "verdict": "pass"}], "runs": [{"name": "mcs05-etc-atp-budget-diagnostic", "composite": "v2ecoli.composites.ecoli_baseline.ecoli_baseline", "kind": "simulation", "canonical": true, "status": "completed", "result": "PARTIAL", "description": "In-process FBA-solution audit (basal, warmed 180s): read reaction_fluxes indexed by getReactionIDs(), plus the oxphos reaction stoichiometry, to find where ATP is made.", "computed_outcomes": {"atp-supply-defect-localized": {"result": "PASS", "detail": "ATP synthase (ATPSYN-RXN) forward-synthesis flux is 0.0 while its REVERSE (hydrolysis) flux is 7.48 — the cell makes ZERO respiratory ATP and instead runs ATP synthase backwards to pump protons. Effective respiratory P/O ~ 0. ATP is over-supplied by substrate-level phosphorylation. O2 uptake 0.89, RQ 2.94."}, "corrected-yield-in-band": {"result": "PARTIAL", "detail": "See the applied-fix run below — the fix is applied there, not in the diagnostic pass."}, "growth-physiological-after-fix": {"result": "PARTIAL", "detail": "See the applied-fix run below."}}, "emitter": "parquet"}, {"name": "mcs05-etc-fix-applied", "composite": "v2ecoli.composites.ecoli_baseline.ecoli_baseline", "kind": "simulation", "canonical": true, "status": "completed", "result": "PASS", "description": "APPLIED FIX: ATP synthase constrained to net-forward (reverse-reaction bound = 0) each FBA solve, basal, 22 min, burn-in 7. Verified independently on clean code (identical to a first run): FBA stayed feasible every tick (0 infeasible).", "computed_outcomes": {"atp-supply-defect-localized": {"result": "PASS", "detail": "With the reverse blocked, ATP synthase can no longer dissipate ATP — the cell must respire."}, "corrected-yield-in-band": {"result": "PARTIAL", "measured_value": 0.268, "detail": "Yxs 0.816 -> 0.268 gDW/g glucose: from 1.84x OVER the band (0.355-0.444) to just below it. The defect is corrected in direction (a huge move) but OVERSHOOTS the band — the raw reverse=0 constraint over-respires (glucose uptake hits its 20 mmol/gDW/h cap). A refined constraint (small reverse allowance) would centre "description": "Regression check: 3-generation basal run with the fix as the model default, compared axis-by-axis to the identical pre-fix run (Arc 1 basal). Feasible across all divisions.", "computed_outcomes": {"growth-physiological-after-fix": {"result": "PASS", "detail": "No regression: growth 0.896->0.883/h, tau 43-47 min unchanged, cell_mass +2%, origins/initiation held, composition within 3.6% (protein/RNA/DNA fractions). Only ppGpp/RelA signaling shifts (metabolism-adjacent). Yield/RQ fixed without collateral."}}, "outcomes": {"atp-supply-defect-localized": {"result": "PASS"}, "corrected-yield-in-band": {"result": "FAIL"}, "rq-approaches-one": {"result": "PASS"}, "growth-physiological-after-fix": {"result": "PASS"}, "no-regression-other-axes": {"result": "PASS"}}, "emitter": "parquet"}], "conclusion": "## Final model A calibrated cap on ATP synthase's reverse flux (atp_synthase_reverse_cap=4.5) is committed to v2ecoli/processes/metabolism.py. Yield 0.816→0.390 (in band), RQ 2.94→1.11, growth preserved, regression-clean. ## Result Root cause found, fix landed, integrated, held-out-validated, and regression-checked. The gap→fix→validate loop is fully closed.\n## Re-execution caveat\nThe reverse-cap FIX did not robustly reproduce on independent re-run (yield 0.395 vs 0.819 at the same cap 4.5 — FBA optimum degeneracy). The diagnosis is solid; the fix needs reformulation to FORCE forward ATP synthase, not merely bound the reverse. See mcs-11.\n## Code status\nThe reverse-cap code change (atp_synthase_reverse_cap in metabolism.py) has been REVERTED from the branch: mcs-11 showed it is not a robust correction (the defect is a thermodynamic FBA loop, not a flux bound), so it is documented here as a refuted attempt, not landed in the model. The mcs-06 chromosome_replication.py change (default-off) is retained.", "findings": [{"id": "atp-synthase-runs-in-reverse", "kind": "computational", "status": "contradicts", "statement": "Auditing the baseline FBA solution shows the root of the energetic defect: ATP synthase (ATPSYN-RXN) carries ZERO forward (synthesis) flux and 7.48 units of REVERSE (hydrolysis) flux — it is running backwards, spending ATP to pump protons rather than making ATP from respiration. The cell therefore makes essentially no ATP by oxidative phosphorylation (respiratory P/O ~ 0), consistent with its near-absent O2 use (0.89 mmol/gDW/h) and impossible RQ (2.94). ATP is instead over-produced by substrate-level phosphorylation and the surplus is dissipated through the reverse ATP synthase. This explains Arc 2's central puzzle — why raising maintenance ATP did nothing: the cell already has an ATP surplus it is actively throwing away, so demanding more of it just changes how much is dissipated, not the carbon/O2 flux. Both NADH dehydrogenase routes are present in the reaction set (NADH-DEHYDROG-A-RXN carries a small flux ~0.009; NADH-DEHYDROGENASE-QUINONE-RXN is idle). Correcting the behaviour (constraining ATP synthase to net-forward operation under aerobiosis, matching genome-scale iAF1260) is the principled fix, but it is a reaction-bound change that can render the FBA infeasible, so it is flagged for a dedicated pass rather than applied speculatively here.", "evidence": {"from_test": "atp-supply-defect-localized", "from_run": "mcs05-etc-atp-budget-diagnostic", "atp_synthase_forward_flux": 0.0, "atp_synthase_reverse_flux": 7.48, "o2_uptake_mmol_gDW_h": 0.888, "RQ": 2.94, "biomass_yield": 0.816}, "expected": {"summary": "Under aerobic glucose growth a healthy cell synthesises ATP via oxidative phosphorylation (ATP synthase FORWARD, P/O ~2-2.5, Feist iAF1260), consuming O2 in proportion to ATP demand — the opposite of what the model does."}, "next_action": "Dedicated fix pass: constrain ATPSYN-RXN to net-forward flux (or lower-bound the reverse direction to 0) under aerobic media and re-measure Yxs/RQ/growth; verify FBA feasibility.", "next_action_type": "escalate_model", "provenance": {"run_ids": ["mcs05-etc-atp-budget-diagnostic"]}, "caveats": ["Diagnostic localizes the mechanism; it does not itself apply or validate a fix."]}, {"id": "net-forward-atp-synthase-restores-respiration", "kind": "computational", "status": "confirms", "statement": "Applying, refining and INTEGRATING the fix the diagnostic pointed to corrects the energetic defect and lands biomass yield squarely in the measured band. Capping ATP synthase's reverse (ATPase) flux forces net-forward (respiratory) operation. A raw cap of 0 over-shot (yield 0.268, just below band, over-respiring at the glucose-uptake cap); sweeping the cap (0->0.268, 4->0.356, 5->0.435) and calibrating it to 4.5 CENTRES the yield. The correction is then committed to the model (metabolism.py: atp_synthase_reverse_cap, applied before every FBA solve) and validated natively: biomass yield falls from 0.816 to 0.390 gDW/g glucose — from 1.84x OVER the band to the middle of the measured 0.355-0.444 band, flipping the graded physiology.biomass_yield axis from first_principles_violation to passing. RQ falls from an impossible 2.94 to a physiological 1.11 and growth is PRESERVED (0.956 -> 0.974/h) — both HELD-OUT (only the yield-centering cap was tuned). O2 uptake rises 0.89 -> 16.9 (respiration ON) and, tellingly, acetate overflow now appears (secretion 13.4 mmol/gDW/h) — the model spontaneously reproduces the aerobic overflow of Basan 2015 once it actually respires. The FBA stays feasible throughout. This fully closes the gap->fix->validate loop the Arc 2 thread opened: the maintenance-ATP hypothesis was refuted (mcs-02), the true cause localized (reverse ATP synthase), and the correction applied, refined, integrated and held-out-validated.", "evidence": {"from_test": "corrected-yield-in-band", "from_run": "mcs05-etc-fix-refined-and-integrated", "before": {"biomass_yield": 0.816, "RQ": 2.94, "O2_glucose": 0.137, "o2_uptake": 0.89, "acetate": 0.0, "growth_per_h": 0.956}, "after": {"biomass_yield": 0.39, "RQ": 1.11, "O2_glucose": 1.23, "o2_uptake": 16.9, "acetate": 13.4, "growth_per_h": 0.974}, "calibrated_reverse_cap": 4.5, "measured_band": [0.355, 0.444], "fba_feasible": true, "committed_change": "v2ecoli/processes/metabolism.py — atp_synthase_reverse_cap (default 4.5)"}, "expected": {"summary": "A net-forward ATP synthase (Feist iAF1260) should respire O2 in proportion to ATP demand, giving RQ ~1 and a physiological yield with aerobic acetate overflow."}, "next_action": "Only the formal full-card re-bake remains (deferred to avoid moving committed fixtures mid-investigation); the regression check across the other axes is DONE (see the regression finding) and clean.", "next_action_type": "replicate", "provenance": {"run_ids": ["mcs05-etc-fix-applied", "mcs05-etc-fix-refined-and-integrated"]}, "caveats": ["RE-EXECUTION CAVEAT (mcs-11): on independent re-run the committed reverse-cap (4.5) did NOT robustly reproduce this in-band yield. At the same cap the FBA admits two optima — a respiring one (yield 0.395, via the explicit solve-wrapping diagnostic) and a NON-respiring one (yield 0.819, reverse pinned at 4.5, forward ATP synthase 0, via the committed-default path). Capping the reverse direction PERMITS but does not FORCE respiration, so the 0.390 result is solve-path dependent. The diagnosis (ATP synthase runs in reverse) is unaffected; the one-parameter fix must be reformulated to force forward respiration.", "The reverse cap (4.5) is calibrated to the measured yield band; RQ->1.1 and growth preservation are the held-out (untuned) validations.", "Validated with the single-cell in-process probe (same estimator/axis as the basal card, ~2% vs the committed diagnostic)."]}, {"id": "fix-does-not-regress-other-axes", "kind": "computational", "status": "confirms", "statement": "A regression check confirms the ETC fix corrects biomass yield WITHOUT collateral damage. A 3-generation basal run with the fix as the default was compared axis-by-axis to the identical pre-fix run (Arc 1's basal). Every non-metabolic a 2700"}, {"name": "mcs10-ensemble-with-aa", "cmd": "vwb run study mcs-10-multiseed-robustness --steps 2700"}], "rerun_hint": "vwb rerun \u003crun-id>"}}, {"title": "ETC fix: held-out check + root-cause trace to thermodynamic FBA loops", "confidence": "Accepted", "gate_status": "failed", "question": "Two loose ends from Arc 2 and the capstone. (1) The mcs-05 ETC fix centres biomass yield in the measured band, but the reverse-ATP-synthase cap (4.5) was CALIBRATED to that band — a skeptic will call it a fitted knob. Does the fix also reproduce an observable it was NOT tuned to, namely the aerobic acetate-overflow ONSET (Basan 2015: acetate secretion rising with growth rate above a threshold)? (2) The capstone showed cross-scale coordination across STEADY-STATE conditions but did not run the titular temporal rich->minimal downshift. Does a genuine downshift produce the transient ppGpp spike and flux reallocation dynamically?", "claim": "The held-out check did its job — and FALSIFIED the fix as characterized. With the committed ETC fix on, acetate secretion stayed at 0 and RQ at ~2.85 (no overflow, no respiration): the held-out observable the cap was never tuned to REVEALED that the committed default reads as un-fixed physiology (yield ~0.82). A controlled comparison pins the cause: at the same cap (4.5) the explicit solve-wrapping diagnostic lands a respiring optimum (yield 0.395, RQ 1.10) while the committed-default path lands a NON-respiring optimum (reverse pinned at 4.5, forward ATP synthase 0, yield 0.819). The reverse-cap does not UNIQUELY force respiration — the FBA is degenerate at that cap — so mcs-05's in-band yield is solve-path dependent, not robust. This is the meta-finding in action: the loop's own held-out control caught an over-claimed fix on re-execution. The temporal downshift is deferred.  [REFORMULATION: forcing forward respiration was then attempted systematically. No ATP-synthase flux bound can simultaneously force respiration, hit the measured yield, and preserve growth (in-band yield 0.41 requires growth 1.48/h vs ~0.97). The defect is STOICHIOMETRIC (P/O ratio), not a flux bound — the principled fix is a reaction-stoichiometry change, now precisely localized.]", "biological_summary": "The mcs-05 ETC fix centres biomass yield in-band, but the cap was calibrated to that band, so a skeptic can call it a fitted knob. This study checks the fix against acetate-overflow ONSET (Basan 2015) — a growth-dependent observable the cap was never tuned to — as the decisive held-out test, and additionally runs the genuine rich->minimal downshift to show the ppGpp spike and flux reallocation as a transient rather than a between-condition contrast.", "behavior_tests": [{"name": "acetate-overflow-onset-held-out", "classification": "primary", "measure": "acetate secretion vs growth with the ETC fix on (HELD-OUT — cap tuned to yield only)", "pass_if": "acetate rises with growth (overflow onset emerges)", "expected": "growth-dependent overflow", "observed": "acetate 0 / RQ 2.85 with the committed fix on — overflow ABSENT; fix not robustly reproduced (0.395 vs 0.819 at same cap)", "verdict": "fail"}, {"name": "downshift-transient-ppgpp-spike", "classification": "primary", "measure": "ppGpp / flux transient across a rich->minimal downshift", "pass_if": "transient ppGpp spike then re-equilibration", "expected": "dynamic stringent-response transient", "observed": "(deferred — temporal media-switch not run)", "verdict": "skip"}], "runs": [{"name": "mcs11-overflow-onset-heldout", "composite": "v2ecoli.composites.ecoli_baseline.ecoli_baseline", "kind": "simulation", "canonical": true, "status": "completed", "result": "FAIL", "emitter": "in-process", "description": "In-process metabolism probes with the committed ETC fix on (atp_synthase_reverse_cap=4.5), across conditions, plus a controlled comparison of the committed-default path vs the explicit solve-wrapping diagnostic at the same cap. Provenance: analysis/mcs05_reexecution_reproducibility.json.", "outcomes": {"acetate-overflow-onset-held-out": {"result": "FAIL"}, "downshift-transient-ppgpp-spike": {"result": "SKIP"}}}], "conclusion": "## Result\nThe held-out check FALSIFIED the mcs-05 fix as characterized: with the committed reverse-cap on, respiration is absent (acetate 0, yield 0.82). The reverse-cap admits a non-respiring FBA optimum, so the in-band yield (0.395) is solve-path dependent, not robust — the same cap gives 0.395 or 0.82. The ATP-synthase-reversal diagnosis stands; the one-parameter fix must be reformulated to force forward respiration. The temporal downshift is deferred. This is the loop catching its own over-claim.\n## Root cause (this pass)\nThe correction was attempted: forcing forward respiration, then a P/O (H+/ATP) stoichiometry change, then blocking the proton source. None works as a parameter/flux fix. The defect is a THERMODYNAMICALLY-INFEASIBLE proton futile cycle (succinate/proton, and others the FBA reroutes to) that generates proton-motive force for free — a missing FBA loop-law constraint. The principled fix is loopless / thermodynamic FBA, a solver-level change. The defect is now root-caused and precisely actionable, not a fitted knob.", "findings": [{"id": "etc-fix-not-robustly-reproducible", "kind": "computational", "status": "contradicts", "statement": "The held-out acetate-overflow-onset check falsifies the mcs-05 fix AS CHARACTERIZED. Run with the committed reverse-cap (4.5) on, the cell does not respire (acetate 0, RQ 2.85, yield 0.819) — the overflow the fix should produce is absent. A controlled two-path comparison at the SAME cap shows why: the explicit solve-wrapping path reaches a respiring optimum (yield 0.395, RQ 1.10, matching mcs-05), while the committed-default path reaches a non-respiring optimum (reverse flux pinned at the cap 4.5, forward ATP synthase 0). Capping the REVERSE direction to 4.5 permits but does not FORCE forward (respiratory) operation, so the FBA optimum — and the biomass yield — is solve-path dependent. The ATP-synthase-in-reverse DIAGNOSIS (mcs-05 finding 1) stands; the one-parameter reverse-cap FIX is not robust and must be reformulated to reward/force forward ATP synthase, not merely bound the reverse.", "evidence": {"from_run": "mcs11-overflow-onset-heldout", "from_test": "acetate-overflow-onset-held-out", "committed_default_cap4.5": {"yield": 0.819, "RQ": 2.85, "acetate": 0.0, "reverse_flux": 4.5, "forward_flux": 0.0}, "explicit_wrap_cap4.5": {"yield": 0.395, "RQ": 1.1}, "no_fix": {"yield": 0.819, "RQ": 2.85}, "artifact": "analysis/mcs05_reexecution_reproducibility.json"}, "expected": {"summary": "A robust respiratory fix should secrete acetate in a growth-dependent way (overflow) regardless of solve path; instead overflow is absent under the committed default."}, "next_action": "Reformulate the ETC fix to lower-bound FORWARD ATP synthase (or set an ATP-maintenance-linked respiratory demand) so respiration is forced, not merely permitted; re-run the overflow-onset held-out check.", "next_action_type": "escalate_model", "provenance": {"run_ids": ["mcs11-overflow-onset-heldout"]}, "caveats": ["The reverse ATP-synthase diagnosis is unaffected and solid; only the one-parameter cap FIX is falsified as non-robust."]}, {"id": "etc-fix-is-stoichiometric-not-flux-bound", "kind": "computational", "status": "confirms", "statement": "Following the mcs-11 non-reproducibility, the ETC fix was systematically reformulated to FORCE forward respiration. Three formulations were tested on the real composite: (1) lower-bounding the FORWARD ATP-synthase reaction alone does NOTHING — the reverse flux rises to match it (a futile cycle), so net stays reverse-hydrolysis and yield stays 0.815; (2) forcing net-forward via reverse=0 gives robust respiration (RQ 1.22, O2 up, acetate overflow, 0 infeasible) but yield 0.268, BELOW the band, with ATP synthase bypassed; (3) forcing net-forward THROUGH ATP synthase (forward-min + reverse=0) reaches the band (yield 0.41) ONLY at forward-min=12, where growth blows up to 1.48/h (vs the physiological ~0.97) with non-physiological O2/acetate (O2 ~104). Across the sweep, yield and growth rise together, so an in-band yield REQUIRES growth ~1.5. Conclusion: no ATP-synthase FLUX BOUND simultaneously forces respiration, reproduces the measured yield, and preserves growth. The defect is STOICHIOMETRIC — the effective oxidative-phosphorylation P/O ratio (ATP per O2 / per glucose) is mis-set — and the principled correction is a reaction-stoichiometry change (H+/ATP coupling, ETC proton pumping), NOT a flux bound. This localizes the Arc-2 defect one level deeper than mcs-05 and explains WHY the reverse-cap was degenerate: a flux bound cannot fix a stoichiometric error.", "evidence": {"from_run": "mcs11-overflow-onset-heldout", "forward_only": "no effect (futile cycle), yield 0.815", "reverse0": {"yield": 0.268, "RQ": 1.22, "growth": 0.972, "atpsyn_forward": 0.0}, "netforward_through_atpsyn": [{"fmin": 4, "yield": 0.268, "growth": 0.972}, {"fmin": 8, "yield": 0.327, "growth": 1.182}, {"fmin": 12, "yield": 0.41, "growth": 1.476}], "band": [0.355, 0.444], "physiological_growth": 0.97, "artifact": "analysis/etc_reformulation_result.json"}, "expected": {"summary": "A robust fix should force respiration AND reproduce the measured yield AND preserve growth simultaneously — no flux bound does all three, indicating a stoichiometric root cause."}, "next_action": "Correct the oxidative-phosphorylation stoichiometry (ATP-synthase H+/ATP ratio or ETC proton-pumping coefficients) toward the genome-scale (Feist iAF1260) value, then re-validate yield/RQ/growth together.", "next_action_type": "escalate_model", "provenance": {"run_ids": ["mcs11-overflow-onset-heldout"]}}, {"id": "root-cause-is-thermodynamic-futile-proton-cycles", "kind": "computational", "status": "confirms", "statement": "Tracing the ATP-supply defect to its root: the model synthesizes ATP via ATP synthase (flux ~7.5) while consuming almost no O2 (~0.9), so the proton-motive force is NOT respiratory. A per-reaction proton-balance audit finds the source — a succinate/proton FUTILE CYCLE: TRANS-RXN-300 exports succinate with 3 H+ (SUC[c]+3H+[c]->SUC[p]+3H+[p]) and TRANS-RXN0-517 re-imports it with 2 H+ (SUC[p]+2H+[p]->SUC[c]+2H+[c]); run together (~18 flux each) succinate is unchanged but 1 net H+ is pumped cytoplasm->periplasm per turn — proton-motive force generated for FREE, thermodynamically impossible. That free PMF drives ATP synthase, so the cell makes ATP without respiring (yield 0.82, RQ 2.94, no acetate overflow). Two controls prove this is the mechanism and that it is SYSTEMIC: (1) changing the ATP-synthase H+/ATP ratio (4->3->6) has NO effect on yield or O2 (rules out the P/O ratio); (2) blocking TRANS-RXN-300 does NOT fix it (yield stays 0.817) — the FBA reroutes to another free-proton pump (TRANS-RXN0-601 (reverse), a direct H+/H+ translocator, ~22 H+). The defect is a KNOWN class of genome-scale-FBA artifact: the LP has no thermodynamic loop-law constraints, so internal free-energy-generating proton cycles are feasible. The principled correction is LOOPLESS / THERMODYNAMIC FBA (loop-law constraints forbidding free-energy-generating internal cycles) — a solver-level change, not a parameter, stoichiometry, or single-reaction flux bound.", "evidence": {"from_run": "mcs11-overflow-onset-heldout", "futile_cycle": ["TRANS-RXN-300: SUC[c]+3H+[c]->SUC[p]+3H+[p] (flux ~18)", "TRANS-RXN0-517: SUC[p]+2H+[p]->SUC[c]+2H+[c] (flux ~18)", "net: +1 H+ pumped per turn, free PMF"], "hplusper_sweep_no_effect": {"h4": 0.817, "h3": 0.816, "h6": 0.817}, "block_trans300_no_effect": {"yield": 0.817, "reroute_to": "TRANS-RXN0-601 (reverse), ~22 H+"}, "artifact": "analysis/etc_root_cause.json"}, "expected": {"summary": "A thermodynamically-consistent FBA (loopless) cannot generate proton-motive force from an internal cycle, forcing the cell to respire (O2-coupled) to make ATP."}, "next_action": "Build a MetabolismLoopless process module that applies general loop-law / chemiosmotic constraints (only the ETC may net-pump protons) so no internal free-energy-generating cycle is feasible; validate yield/RQ/growth/acetate together across conditions, then offer it as a drop-in replacement for the current metabolism process. Prototype scaffold: analysis/loopless_test.py.", "next_action_type": "escalate_model", "provenance": {"run_ids": ["mcs11-overflow-onset-heldout"]}, "caveats": ["Prototype loopless constraint tested (analysis/loopless_test.py): a chemiosmotic loop-law constraint enforcing 'net proton translocation by transport \u003c= 0' (a pseudo-metabolite over 461 transport reactions + a relief source) was added at build time. It correctly ELIMINATES the primary succinate futile cycle (TRANS-RXN-300 flux 18.1 -> 0), confirming the approach binds — but the FBA reroutes to another free-proton source and the yield stays ~0.83. So a name/subset-targeted constraint is not enough; a GENERAL loopless / thermodynamic FBA (loop-law constraints over all internal cycles, or the full non-ETC proton-translocation set) is required. That is a dedicated metabolism-process module (a MetabolismLoopless drop-in replacement), correctly scoped as its own effort — not a parameter or a single constraint."]}], "slug": "mcs-11-etc-heldout-and-downshift", "model_topology": {"processes": [{"name": "post-division-mass-listener", "kind": "step", "address": "local:v2ecoli.steps.derivers.mass_deriver.PostDivisionMassDeriver", "inputs": ["bulk", "unique", "listeners", "global_time", "timestep"], "outputs": ["bulk", "unique", "listeners", "global_time", "timestep", "_layer_out_0"]}, {"name": "unique_update_1", "kind": "step", "address": "local:v2ecoli.steps.unique_update.UniqueUpdate", "inputs": ["active_RNAPs", "RNAs", "active_ribosome", "full_chromosomes", "chromosome_domains", "active_replisomes", "oriCs", "promoters", "genes", "chromosomal_segments", "DnaA_boxes", "_layer_in_1"], "outputs": ["active_RNAPs", <script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], stores=topo.stores||[];
  const rows=[]; (function fl(ns,d){ (ns||[]).forEach(n=>{ rows.push({d,n}); fl(n.children,d+1); }); })(stores,0);
  if(!rows.length && !procs.length) return '';
  const rowH=23, headH=28, padX=14, colGap=44;
  const storeW=Math.max(240,...rows.map(r=>padX+r.d*16+(String(r.n.name).length)*7+(String(r.n.type||'').length)*6.2+70));
  const procH=64;
  const procW=Math.max(250,...procs.map(p=>Math.max(String(p.name).length*8+28,
      String(p.address||'').length*6.2+20,
      (('in: '+(p.inputs||[]).join(', ')).length)*6.0+20,
      (('out: '+(p.outputs||[]).join(', ')).length)*6.0+20)));
  const storesH=headH+rows.length*rowH+8, procsH=headH+procs.length*(procH+10);
  const H=Math.max(storesH,procsH)+14, W=storeW+colGap+procW+padX;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">STATE · BIGRAPH</text>`;
  rows.forEach((r,i)=>{ const y=headH+i*rowH, x=padX+r.d*16, leaf=!(r.n.children&&r.n.children.length);
    if(r.d>0) sv+=`<line x1="${x-8}" y1="${y+ (rowH-4)/2}" x2="${x}" y2="${y+(rowH-4)/2}" stroke="var(--line-2)"/>`;
    sv+=`<rect x="${x}" y="${y}" width="${storeW-x-6}" height="${rowH-5}" rx="5" fill="${leaf?'var(--sunken)':'var(--surface)'}" stroke="var(--line)"/>`;
    sv+=`<text x="${x+9}" y="${y+13}" fill="var(--ink)" font-family="var(--mono)" font-size="11.5">${esc(r.n.name)}</text>`;
    if(r.n.type) sv+=`<text x="${storeW-12}" y="${y+13}" text-anchor="end" fill="var(--accent)" font-size="10.5" font-family="var(--mono)">${esc(r.n.type)}</text>`;
  });
  const px=storeW+colGap;
  sv+=`<text x="${px}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  procs.forEach((p,i)=>{ const y=headH+i*(procH+10);
    sv+=`<rect x="${px}" y="${y}" width="${procW}" height="${procH}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<text x="${px+12}" y="${y+21}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`;

    sv+=`<text x="${px+12}" y="${y+50}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc((p.inputs||[]).join(', ')||'—')}</tspan></text>`;
    sv+=`<text x="${px+12}" y="${y+62}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc((p.outputs||[]).join(', ')||'—')}</tspan></text>`;
  });

// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open']};

}
function gateOf(s){ // pass/fail
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';

}
function isControl(s){ return gateOf(s)==='fail' && (s.confidence==='Refuted'||s.confidence==='Accepted') && !!s.conclusion; }
function loopOutcome(s){
  const r=(s.runs||[]).map(r=>r.outcomes&&r.outcomes['LOOP-OUTCOME']).find(Boolean);

// V1 capability coverage matrix: rows=requires, cols=chosen modules(+build-new), fill where provided
function vizCapMatrix(s,inv){
  const req=s.requires||[]; const mods=(s.sourcing&&s.sourcing.modules)||[];
  const cat=inv.catalog||{};
  if(!req.length) return '';
  const cols = mods.length?mods:['(build-new)'];
  const cw=Math.max(96,...cols.map(c=>c.length*7.2+24)), rh=30, lh=150, top=54;
  const W=lh+cols.length*cw+16, H=top+req.length*rh+10;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  cols.forEach((c,i)=>{ const x=lh+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" font-weight="600" fill="var(--ink)">${esc(c)}</text>`;
    sv+=`<text x="${x}" y="36" text-anchor="middle" fill="var(--ink-3)" font-size="10">provides</text>`;});
  req.forEach((r,ri)=>{ const y=top+ri*rh;
    const covered=cols.some(c=>(cat[c]||[]).includes(r));
    sv+=`<text x="${lh-12}" y="${y+rh/2+4}" text-anchor="end" fill="${covered?'var(--ink)':'var(--fail)'}" font-weight="${covered?400:700}">${esc(r)}</text>`;
    cols.forEach((c,ci)=>{ const x=lh+ci*cw, provides=(cat[c]||[]).includes(r);
      sv+=`<rect x="${x+6}" y="${y+4}" width="${cw-12}" height="${rh-9}" rx="5" fill="${provides?'var(--accent)':'var(--sunken)'}" stroke="${provides?'none':'var(--line)'}"/>`;
      if(provides) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="11" font-weight="700">✓</text>`;
    });
    if(!covered) sv+=`<rect x="${lh-4}" y="${y+2}" width="${cols.length*cw+4}" height="${rh-4}" rx="6" fill="none" stroke="var(--fail)" stroke-dasharray="4 3"/>`;
  });

  const cap=uncovered.length? `Required capability <span class="mono">${esc(uncovered.join(', '))}</span> is not provided by the chosen module — the coverage argument <span class="mono">requires ⊆ provided</span> fails, and the audit refuses the reuse.`
    : `Every required capability is provided by the chosen module(s): <span class="mono">requires ⊆ provided</span> holds.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// V5 iteration timeline
function timelineSteps(traj){
  if(!traj||!traj.iterations) return '';
  const steps=traj.iterations.map(it=>{
    const d=it.decision||{}; const act=d.action||d.kind||'';
    let label=act;
    if(d.mechanism) label='install '+d.mechanism;
    else if(d.value) label=(d.action||'')+' '+d.value;
    else if(act==='done') label='DONE';
    else if(act==='blocked'||act==='install') label=act;
    const reason=d.reasoning||d.note||'';
    return {it:it.iteration,label,reason,np:it.n_pass,nh:it.n_hard};
  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}

/* ---------- model diagram (the "model SVG") ---------- */
function modelText(s){ const cm=(s.conclusion||'').match(/##\s*Final model\s*([\s\S]*?)(?:\n##|$)/i);
  return (cm?cm[1].trim():'')||s.biological_summary||''; }
function vizModelSVG(s, inv){
  if(s.sourcing){

      sv+=`<line x1="${x+bw/2}" y1="42" x2="${x+bw/2}" y2="${y}" stroke="var(--line-2)" stroke-width="1.5" marker-end="url(#ar)"/>`;
      if(i>0) sv+=`<line x1="${x-gap}" y1="${y+bh/2}" x2="${x}" y2="${y+bh/2}" stroke="var(--line-2)" stroke-dasharray="3 3"/>`;
    });

    sv+=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
