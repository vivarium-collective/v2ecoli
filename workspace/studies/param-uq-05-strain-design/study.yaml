    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end]
  - name: strain-design-ensemble-smoke
    kind: uq-ensemble
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {sampler: PCRV, knobs: [exp, trl_eff, inert_decoy], n_train: 12, n_test: 3, seeds: 3, generations: 1, steps: 700}
    description: |
      DONE (smoke). PCRV ensemble over (exp, trl_eff) + an adversarial inert decoy
      knob; order-2 PCE + analytic Sobol under aggregation strategies 1 & 3
      (strategy 2 single-generation only — no division in the 700-step window).
      45 records in 35.5 min. Results in results_smoke/sobol.json; figures in charts/.
    duration_steps: 700
    seeds: [0, 1, 2]
    metrics: [new_gene_product_level, instantaneous_growth_rate, sobol_indices_per_strategy, pce_test_error]
    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end, aggregation-strategies-1-3-decomposed, dominant-knob-identified-and-robust, adversarial-inert-knob-returns-null]
  - name: strain-design-ensemble-2gen
    kind: uq-ensemble
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {sampler: PCRV, knobs: [exp, trl_eff, inert_decoy], n_train: 12, n_test: 2, seeds: 2, generations: 2, steps: 4000}
    description: |
      DONE (preliminary — SUPERSEDED as headline by the n=24 resolving ensemble
      below). First run after fixing the division daughter-cache blocker (pass
      cache_dir into baseline() so daughters rebuild from the per-sample temp
      cache instead of default out/cache): 56 records = 28 gen-1 + 28 gen-2, every
      lineage divided at t≈2529s. Proved strategy 2 (by-generation) works. BUT at
      n=12 the order-2 PCE was UNDER-RESOLVED (inert decoy 0.24–0.51, ~61% GFP test
      error) and gave trl_eff > exp — a ranking the n=24 run REVERSES. Kept for the
      record (results_2gen/). Lesson: trust the ranking only when the adversarial
      decoy is under the 0.05 null band. See commit
      "fix(param-uq-05): thread per-sample cache_dir into division".
    duration_steps: 4000
    seeds: [0, 1]
    metrics: [new_gene_product_level, instantaneous_growth_rate, sobol_indices_per_strategy, pce_test_error]
    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end, aggregation-strategies-1-3-decomposed]
  - name: strain-design-ensemble-n24
    kind: uq-ensemble
    status: done
    base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    perturbation: {sampler: PCRV, knobs: [exp, trl_eff, inert_decoy], n_train: 24, n_test: 4, seeds: 3, generations: 2, steps: 4000}
    description: |
      DONE — the HEADLINE result. Resolving 2-generation ensemble: 24 train + 4
      test PCRV samples × 3 seeds × 2 generations × 4000 steps → 168 records
      (84 gen-1 + 84 gen-2; every train lineage divided). All three aggregation
      strategies from ONE ensemble. At this budget the order-2 PCE is RESOLVED:
      the inert decoy falls to 0.024 (< 0.05 null) and GFP held-out test error to
      ~23% (from ~61% at n=12), so the adversarial-null check PASSES and the Sobol
      values are trustworthy. Result: exp dominates product level (0.73 vs 0.37),
      argmax-robust across all seeds & generations — reversing the under-resolved
      n=12 ranking and confirming the pre-registered "exp dominates" hypothesis.
      Results in results_n24/sobol.json; charts/ re-rendered from it.
    duration_steps: 4000
    seeds: [0, 1, 2]
    metrics: [new_gene_product_level, instantaneous_growth_rate, sobol_indices_per_strategy, pce_test_error]
    pass_fail_tests: [strain-design-uq-pipeline-runs-end-to-end, aggregation-strategies-1-3-decomposed, dominant-knob-identified-and-robust, adversarial-inert-knob-returns-null]

