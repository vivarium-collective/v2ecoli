schema_version: 4
name: dnag-production-deficit
title: DnaG production deficit
created: '2026-09-03'
status: complete
phase: Decide
study_type: diagnostic
investigation: transcription-rewiring
question: Study 2 showed DnaG is the resource limiting replication initiation. Where in the production chain is DnaG lost, is the model reproducing its own fitted target, and is that deficit why mechanistic replisome gating cannot be enabled?
biological_summary: 'DnaG (DNA primase) synthesises the RNA primers every replication fork needs.

  Study replisome-gate-sufficiency established it is the binding constraint on

  initiation in v2ecoli: at every stall it is the only replisome pool below the

  gate''s demand, and removing it from the gate''s requirement restores full

  12-generation survival. This study asks the upstream question -- why is there

  so little of it -- by walking the chain from transcript to protein and

  locating the step where the shortfall appears.


  The chain has three candidate steps. Transcription: dnaG''s only transcript is

  TU00352, shared with rpsU and rpoD. Translation: each cistron carries its own

  efficiency, a ParCa input fitted from Li 2014 ribosome profiling. Degradation:

  a per-monomer rate. A shortfall at any one of them would produce the same

  phenotype, so naming the step requires measuring all three against every other

  gene rather than inspecting DnaG alone.


  The operon is what makes this diagnosable. rpsU, dnaG and rpoD share ONE

  transcript, so they draw on one mRNA pool. Any divergence in their protein

  counts therefore cannot come from transcription; it has to come from a

  per-cistron step downstream. That turns the operon into a natural internal

  control.


  There is also a distinction the study keeps separate throughout: agreement

  with experiment, and agreement with the model''s own fitted target. ParCa fits

  a per-monomer count that the simulation is supposed to reproduce. A model that

  disagrees with proteomics is miscalibrated; a model that disagrees with its own

  ParCa fit is not running the parameterisation it was given. These are different

  defects with different fixes, and conflating them would misdirect the repair.

  '
assumptions:
- text: ParCa's fitted per-monomer count is the target the running simulation is expected to reproduce at steady state.
  verified_in_v2ecoli: true
- text: The permissive arm of replisome-gate-sufficiency is a healthy, unperturbed 12-generation lineage, so its DnaG trajectory reflects normal production rather than a consequence of the gate.
  verified_in_v2ecoli: true
pipeline_gate:
  prerequisites:
  - study: replisome-gate-sufficiency
    condition: tests-passed
    relation: leads-to
    outputs_used:
    - DnaG identified as the limiting pool, unanimously across 8 seeds
    - The distilled evidence bundles, reused here as the multi-generation record
  enables:
  - silent-transcription-units
  proceed_condition: The lossy step is identified and the experiment-vs-own-target distinction is resolved, so a repair can be aimed at the right parameter.
  gate_evaluator:
    result: failed
    blocked_by:
    - simulation-reproduces-parca-target
    - dnag-transcript-is-synthesized
    - operon-partners-share-transcription
    evaluated_by: code
    diverges_from_authored: false
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants: []
  model_settings: []
baseline:
- name: baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []
units_and_time:
  tick: 1 tick = 1 s of simulated time (composite time_step=1)
  quantities:
    protein counts: molecule copies per cell (integer bulk counts)
    basal synthesis probability: dimensionless per-transcript initiation probability
    translation efficiency: dimensionless ParCa input (Li 2014 ribosome profiling)
    degradation rate: per-second first-order rate
    percentile: rank of dnaG's value among all genes, 0-100
behavior_tests:
- name: simulation-reproduces-parca-target
  classification: primary
  gate_class: acceptance_criterion
  question: Does the running model reproduce the count ParCa fitted for DnaG?
  description: 'Mean simulated DnaG is within 2x of ParCa''s own fitted per-monomer count. This is the axis that separates a calibration problem from an execution problem, and it is the one genuinely open question at design time: nothing in the reconnaissance measured the fitted target on this branch, only the simulated counts.

    Threshold provenance: theory. A factor of 2 is a generous band for a quantity the simulation is supposed to be reproducing directly, chosen so that ordinary stochastic and cell-cycle variation cannot fail it. It is not a literature value and nothing is cited for it.'
  measure:
    kind: derived
    detail: mean simulated DnaG divided by ParCa's fitted count.
  pass_if:
    op: '>='
    value: 0.5
    provenance:
      kind: theory
      note: Generous 2x band; a model reproducing its own fit should clear it easily.
  status: pending
- name: dnag-transcript-is-synthesized
  classification: primary
  gate_class: acceptance_criterion
  question: Is dnaG's transcript actually made during a simulation?
  description: |
    dnaG's transcripts synthesised per generation is greater than zero,
    measured from count_rna_synthesized DURING a run.

    REPLACES 'transcription-is-not-the-lossy-step', which ranked basal_prob and
    concluded dnaG was not starved. That axis was invalid twice over: basal_prob
    is OVERRIDDEN for idx_rprotein TUs like TU00352, and a static parameter
    cannot establish what a simulation does -- in a study whose own headline is a
    22x parameter-vs-behaviour gap.

    Threshold provenance: zero is definitional, not tuned. A gene whose only
    transcript is never synthesised receives no mRNA at all.
  measure:
    kind: derived
    detail: Transcripts synthesised for dnaG across all its TUs during one generation.
  pass_if:
    op: '>'
    value: 0
    provenance:
      kind: theory
      note: 'Definitional: zero synthesis means no mRNA, not a tuned cutoff.'
  status: pending
- name: operon-partners-share-transcription
  classification: primary
  gate_class: acceptance_criterion
  question: Do the cistrons on TU00352 receive comparable transcription?
  description: |
    Transcripts made for dnaG, rpsU and rpoD differ by less than 10-fold.

    REPLACES 'operon-partners-diverge', whose premise was false. That axis assumed
    the three cistrons 'share one mRNA pool, so divergence cannot come from
    transcription'. They do not share one pool: rpsU also has TU0-14460 and rpoD
    also has TU00472, while dnaG has TU00352 alone. The false premise is what made
    a transcriptional divergence look translational.

    Restated on TRANSCRIPTS ACTUALLY MADE, which needs no shared-pool assumption.
    A FAIL means the partners are supplied while dnaG is not -- the stranding this
    study is about.

    Threshold provenance: theory. 10-fold is generous for cistrons nominally on one
    operon; ratios are computed on counts+1 so a zero is well defined.
  measure:
    kind: derived
    detail: max/min of (transcripts synthesised + 1) across dnaG, rpsU and rpoD in one generation.
  pass_if:
    op: <
    value: 10.0
    provenance:
      kind: theory
      note: Generous band for cistrons nominally sharing an operon.
  status: pending
- name: dnag-below-literature
  classification: supporting
  gate_class: regression_pin
  description: 'ParCa''s fitted DnaG is below the four-dataset literature median.

    POST-HOC. Measured during reconnaissance before this study existed, so it is a pin against drift and NOT acceptance evidence. It is recorded because the four-dataset median is the honest comparison: Schmidt alone reads DnaG far lower than Soufi, Mori and Li, and a single-dataset check points the wrong way. That error was actually made during scoping and corrected.'
  measure:
    kind: derived
    detail: ParCa fitted DnaG divided by the four-dataset literature median.
  pass_if:
    op: <
    value: 1.0
    provenance:
      kind: post_hoc
      note: Observed during reconnaissance; pin only.
  status: pending
- name: dnag-not-maintained-across-generations
  classification: supporting
  gate_class: regression_pin
  description: 'DnaG spends most of the lineage at zero copies. Measured per generation so a decline is distinguishable from a constant deficit.

    POST-HOC: the pooled fraction was measured during reconnaissance. Pin only.'
  measure:
    kind: derived
    detail: fraction of timesteps with DnaG == 0 across a 12-generation lineage.
  pass_if:
    op: '>'
    value: 0.25
    provenance:
      kind: post_hoc
      note: Observed during reconnaissance; pin only.
  status: pending
- name: supply-below-gate-demand
  classification: primary
  gate_class: regression_pin
  description: 'The lineage sits below the initiation gate''s DnaG demand (2 copies per origin) for a substantial fraction of the time, which is the mechanical reason mechanistic replisome gating cannot be left enabled.

    POST-HOC relative to study 2, which already demonstrated the stall. Pin.'
  measure:
    kind: derived
    detail: fraction of timesteps below the gate's per-origin DnaG demand.
  pass_if:
    op: '>'
    value: 0.25
    provenance:
      kind: post_hoc
      note: Follows from study 2's stall; pin only.
  status: pending
preregistered:
  declared_before_runs: true
  registered_at: '2026-09-03T16:40:49Z'
  criteria:
  - test: simulation-reproduces-parca-target
    prior: Genuinely open at design time. The fitted target had not been measured on this branch; only the simulated counts had.
  - test: transcription-is-not-the-lossy-step
    prior: 'Stated so the investigation''s own dedup hypothesis is falsifiable: that hypothesis predicts this test fails.'
  - test: operon-partners-diverge
    prior: If the three cistrons on one transcript track together, the per-cistron explanation is wrong.
  predictions:
  - Reconnaissance during scoping had already measured the simulated counts (median 0, mean 1.76, 61.6% of timesteps at zero) and the chain percentiles. Those observations are recorded as regression_pin axes, NOT as acceptance criteria, because a threshold set after seeing a number cannot confirm it.
  controls:
  - operon-partners-diverge
  amended: |
    AMENDED 2026-09-03 after an expert challenge. Two acceptance axes were replaced
    because they measured a static ParCa parameter rather than simulated behaviour and
    reached the opposite conclusion. The replacements are graded on transcripts actually
    synthesised during a run.

    The amendment is recorded rather than silently applied: these two axes are NOT
    pre-registered in the original sense, because the replacement was written after the
    correcting measurement was seen. They are honest tests of the right quantity, but a
    reviewer should weigh them as post-hoc.
readouts:
- name: dnag-monomer-counts
  store_path: bulk.count
  description: Per-timestep EG10239-MONOMER[c] counts over a healthy 12-generation lineage, reused from replisome-gate-sufficiency's distilled bundles (permissive arm, 3 seeds, 114k timesteps).
  units: molecule copies per cell
  status: available
- name: production-chain-percentiles
  store_path: derived
  description: dnaG's basal synthesis probability, translation efficiency and degradation rate, each ranked against every other gene in the ParCa cache.
  units: percentile
  status: derived-needed
- name: proteomics-comparison
  store_path: derived
  description: Per-dataset DnaG counts (Schmidt 2016, Soufi/Maeck 2015, Mori 2021, Li 2014) and their median, via scripts/proteome_compare.py.
  units: molecule copies per cell
