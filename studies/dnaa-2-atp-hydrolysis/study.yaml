    notes: |
      Haochen: the model wrongly assumed FAST EQUILIBRIUM for DnaA + ADP ⇌
      DnaA-ADP. The reverse (DnaA-ADP → apo + ADP) is slow (k_r ≈ 1e-7/s);
      v2ecoli's ecoli-equilibrium integrates it to steady state each tick,
      pinning DnaA-ATP at ~0.997. Modelling DnaA-ADP dissociation as
