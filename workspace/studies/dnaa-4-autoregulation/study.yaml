  - name: dnaa4_linear_s06_F05_trajectory
    address: charts/dnaa4_linear_s06_F05_trajectory.png
    status: rendered
    config:
      title: >-
        Canonical reference (F-07): multi-generation trajectory of linear autoregulation s=0.6 + F-05
        (kinetic apo+ATP charging) at V=1.5e-3, k_h=0.025/min, seed 1, reproducing Rashmi/Haochen's
        reference PDF. Clean cell cycle (mass sawtooth, oriC 1<->2, 12/12 divided); DnaA total in
