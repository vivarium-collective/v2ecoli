findings:
- id: no_oxygen-statistical
  kind: computational
  status: partial
  statement: Under the gold-standard 4-seed statistical grading, no_oxygen is DRIFT —
    masses reproduce within tolerance; v2ecoli grows ~+14% faster (borderline, p=0.08)
    with a mild RNA over-shoot (+5.5%). Same OVER-growth direction as acetate/succinate
    (all slower-than-basal conditions), consistent with the compressed nutrient->growth
    response anchored at the basal fit point (doubling time 100min > basal 44min ->
    v2 over-responds). Not significant at n=4.
  evidence:
    from_card: statistical
    observed: '4-seed gen-1 (Welch t-test): protein mass within_tol (Δ+0.3%, p=0.97);
      cell mass within_tol (Δ+2.4%, p=0.75); dry mass within_tol (Δ+2.4%, p=0.75);
      RNA mass drift (Δ+5.5%, p=0.55); growth rate drift (Δ+14.4%, p=0.077, d=1.62).
      Overall drift; no axis reaches p<0.05.'
  _superseded_from_card: standard
