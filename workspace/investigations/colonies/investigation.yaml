schema_version: 2
name: colonies
title: Colony & Microfluidic Phenotype Quantification
created: '2026-05-16'
status: in_progress

question: |
  Do the emergent single-cell phenotypes of the whole-cell E. coli model —
  adder size-homeostasis, the inter-division-time distribution, and the growth
  rate — survive embedding into a physically-packed, dividing microcolony, and
  do they match microfluidic-device data, across a cost/fidelity ladder of cell
  models (simple viva-munk agent -> growth surrogate -> full 55-process WCM) run
  in the canonical devices (mother machine, daughter machine, free colony)?

hypothesis: |
  Single-cell phenotype is a property of the cell model, not the container: the
  WCM's adder size-homeostasis, inter-division-time CV, and growth rate are
  preserved when cells are embedded in a pymunk 2D colony that grows, packs, and
  divides, and they are reproduced (to tier-appropriate fidelity) by the cheaper
  simple-agent and growth-surrogate tiers. The compute foundation needed to run
  this — daughter hydration through the engine, natural division, coherent
  physics, and bounded memory — is infrastructure, not the result.

description: |
  A phenotype-quantification investigation: measure emergent colony/microfluidic
  phenotypes of whole-cell E. coli across a cost/fidelity ladder of cell models
  and device geometries, using one shared phenotype panel (growth rate,
  size-at-division, added length, inter-division time). It is organised as an
  enabling compute foundation (Part A) that makes the science (Part B) runnable.

  ## Part A — Compute foundation (enabling infrastructure)

  The colony composite wires N whole-cell agents (each embedding the 55-process
  EcoliWCM via the bridge) into one pymunk 2D environment. Part A made it
  single-machine-correct and cost-characterised:

  - Daughter hydration through the engine + natural division 1->2->4 (after
    fixing mother-removal over-counting and daughter placement), coherent physics
    (jitter 0.5 -> 1e-4, coherent mass). [colonies-01, colonies-02; colony GIF]
  - Per-cell wall is flat (~57 ms/tick/cell across N=1..8 on the 2026-07-26
    remote re-run @ f69f9690; pymunk is essentially free); the inner EcoliWCM is
    the whole cost, and the GIL is the single-process compute ceiling. The Ray
    protocol runs cells in separate OS processes and lifts that ceiling (~3.5x at
    N=16). [colonies-01, colonies-02]

  Memory — the correction. Earlier framing (colonies-02/03) called the colony
  "RAM-blocked by an unbounded native leak" and retracted the cells-per-node
  budget. A focused per-process + tracemalloc hunt (2026-07-26) localized the
  growth to the inner WCM's polypeptide-elongation step (82%) and mass-listener
  (17%), and showed it is NOT an unbounded leak:
    - the truly-retained part is small (~0.2 MB/tick), the scipy LSODA
      integrator's rwork/iwork held per solve (equilibrium / two-component /
      charging ODEs);
    - the rest — the scary ~1.4 MB/tick on the dev mini — is allocator ARENA
      RETENTION from the elongation step's large per-tick numpy working arrays:
      freed, but macOS doesn't return the pages, so RSS climbs (invisible to
      tracemalloc). On glibc / Linux — the HPC target — the growth collapses:
      the REAL 55-process colony, built for glibc in a Linux container, grew RSS
      0.225 MB/tick vs ~1.6 on the macOS mini (7x less; end-to-end validated), and
      a synthetic reproduction of just the arena churn grew 0.017 MB/tick (0.000
      with periodic malloc_trim(0)) — so the arena-churn component is fully
      reclaimed on Linux and the residual 0.225 is the real scipy-LSODA retention.
  So the "leak" was substantially a macOS measurement artifact. On the HPC
  (Linux) target the colony's memory is bounded (arena churn reclaimed by glibc +
  optional malloc_trim; residual ~0.2 MB/tick scipy retention is a small, named
  optimization target). The compute foundation is HPC-deployable; memory is a
  characterised limitation, not the story. [colonies-03; leak hunt 2026-07-26]

  ## Part B — Phenotype quantification (the science)

  Part B reuses Part A's device geometries (mother machine, daughter machine,
  free colony) and runs them across three cell-model tiers — a cheap simple
  viva-munk agent, a growth-only surrogate, and the full EcoliWCM — all measured
  through one shared phenotype panel. colonies-04 stands up the shared factory,
  geometry builders, and phenotype extractor and validates it with simple agents.
  colonies-05/06 run the two canonical viva-munk devices with simple agents
  (running animation + size-at-division / birth->division-time / added-size
  distributions; conclusions held for experimental data). colonies-08/09 run the
  full whole-cell tier inside the device geometries. The surrogate tier and real
  mother-machine-data comparison are planned follow-ons. Because the colony now
  streams a bounded per-cell phenotype panel to zarr (ColonyPhenotypeRecorder),
  the WCM-tier runs are length-bounded on the dev mini but unbounded on HPC.

executive:
  what_is_this: |
    Does whole-cell E. coli phenotype survive colony embedding, and match
    microfluidic-device data, across a cost/fidelity ladder of cell models? Runs
    N whole-cell (or cheaper) agents in one pymunk 2D device geometry and measures
    a shared phenotype panel (growth rate, size-at-division, added length,
    inter-division time). Part A (colonies-01..03) is the enabling compute
    foundation — correct division, characterised cost, bounded memory on Linux;
    Part B (colonies-04..09) is the phenotype science.
  verdict: |
    Compute foundation built and HPC-deployable; phenotype quantification
    underway. The colony grows and divides correctly (natural division 1->2->4),
    per-cell wall is flat (~57 ms/tick), pymunk is free, and Ray lifts the
    single-process GIL ceiling (~3.5x at N=16). The memory concern that earlier
    blocked HPC is corrected: the per-tick RSS growth is dominated by allocator
    arena churn from the elongation step's numpy arrays that glibc reclaims on the
    Linux HPC target (end-to-end validated: the real colony grew 0.225 MB/tick on
    Linux vs ~1.6 on the macOS mini, 7x less), leaving a ~0.225 MB/tick scipy-LSODA
    retention as the real residual. So memory
    is a characterised, mitigated limitation — not an unbounded blocker — and the
    cells-per-node budget stands (~1000 cells/node on 64-core/256GB, RSS re-derived
    from the re-run). Part B is running the device x tier x phenotype-panel matrix.

scientific_argument:
  main_claim: |
    Whole-cell single-cell phenotype (adder size-homeostasis, inter-division-time
    distribution, growth rate) is preserved under colony embedding and division
    and is quantifiable across a model-tier ladder and device geometries. The
    compute foundation that enables this is single-machine-correct, cost-flat, and
    memory-bounded on the Linux HPC target — the memory growth earlier read as an
    HPC blocker is largely a macOS allocator artifact.
  evidence_for:
  - Per-cell wall flat ~57 ms/tick/cell across N=1,2,4,8 (per-cell-cost-within-2x
    PASS; 2026-07-26 remote re-run). [colonies-01 F-01]
  - pymunk physics ~free (<=0.2 ms/tick at N=8); cost is the inner EcoliWCM. [colonies-01 F-04]
  - Natural division works after fixing mother-removal (id/key match) and daughter
    placement (viva-munk daughter_locations, no velocity kick) 1->2->4, daughters
    replace the mother in place. [colonies-02; colony-animation GIF]
  - The Ray protocol runs cells in separate OS processes, ~3.5x faster at N=16,
    lifting the single-process GIL ceiling. [colonies-02 ray-lifts-gil-ceiling PASS]
  - The per-tick RSS growth is localized to the elongation step (82%) + mass-listener
    (17%); the real colony on Linux/glibc grows 0.225 MB/tick vs ~1.6 on macOS (7x
    less; end-to-end container run), and the truly-retained residual is that
    ~0.225 MB/tick scipy-LSODA rwork (arena churn fully reclaimed on Linux).
    [colonies-03; leak hunt 2026-07-26]
  evidence_against:
  - The residual ~0.2 MB/tick scipy-LSODA retention is real and platform-independent;
    over a full cell cycle (~3000 ticks) that is ~0.6 GB per cell, so very long
    single-process WCM runs still need the solver-level fix or periodic trimming.
  - Full-colony (55-process) Linux boundedness is now validated END-TO-END: the real
    colony, built for glibc in a Linux container, grew RSS 0.225 MB/tick vs ~1.6 on
    the macOS mini (7x less) — confirming the arena-churn-is-a-macOS-artifact finding.
    The residual 0.225 MB/tick equals the real scipy-LSODA retention and persists on
    Linux (~0.6 GB/cell-cycle), so very long multi-generation WCM runs still want the
    solver-level fix (BDF-first in equilibrium/two-component) or periodic trimming; a
    run on an actual HPC node remains the last confirmation before a hard budget.
  caveats:
  - Single-machine, single-seed (0) compute measurements; cross-node scaling is a
    follow-up.
  - Part B phenotype distributions are held for comparison against experimental
    microfluidic data; the surrogate tier and real mother-machine data are planned.

biological_story: |
  The object is a growing microcolony of E. coli, every agent embedding the full
  whole-cell model (the 55-process baseline that grows, transcribes, translates,
  replicates its chromosome, and divides) in a 2D pymunk environment that resolves
  physical packing. A cell elongates as its dry mass accumulates to the division
  threshold (~one cell cycle), then splits into two daughters placed along its
  long axis that reset and regrow (see the colony-animation GIF). No biological
  model change was made; the compute work is infrastructural — daughter hydration,
  division counts and placement, realistic physics, streaming a bounded per-cell
  phenotype panel to zarr, and characterising the compute and memory cost of
  running many whole cells at once. The scientific payload is the phenotype
  quantification: does the whole-cell model reproduce the size-homeostasis
  (adder), inter-division-time, and growth-rate statistics that microfluidic
  devices measure — and do cheaper cell-model tiers reproduce them well enough to
  substitute at colony scale?

