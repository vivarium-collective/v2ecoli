discovery_implications:
  resolved_uncertainties:
  - The oriC low-affinity OVER-BINDING (read-only observer pinned ~0.8) is RESOLVED by Rashmi's adopted active depleted-pool Langmuir mechanism (PR #162) — the active solve depletes the free DnaA-ATP pool, so oriC-low occupancy fills GRADUALLY over the cycle (gen-5 ~0.3 at birth -> ~0.7 toward initiation; chart dnaa3_box_occupancy), not pinned. It is NOT all-filled at the start, matching the expected biology.
  - ALL DnaA boxes double at replication (315<->630, low-affinity 8->16 per oriC included), via fork-passage release — fixing the read-only deriver's hard-coded low-aff pool (chart dnaa3_active_binding_adopted panel 2).
  - On the in-band V=1e-3 (the value used before, not the overshooting 1.2e-3) the mechanism keeps a clean cell cycle (8/8 divisions, oriC 1<->2).
  remaining_uncertainties:
  - The total DnaA pool DRIFTS above the [300,800] band in later generations (V=1e-3: in-band gens 1-5, 931-1077 in gens 6-8) — the documented dnaa-1/dnaa-2 V-tension. No constitutive V holds it in-band across all gens; the next study (dnaa-4, DnaA negative autoregulation) is scoped to resolve it by making dnaA synthesis feedback-controlled.
  - The oriC initiation threshold — what DnaA-ATP occupancy robustly triggers initiation — remains for a later study.
