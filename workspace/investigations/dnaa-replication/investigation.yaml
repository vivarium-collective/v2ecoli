status: active   # 2026-06-09: dnaa-0 PASS; dnaa-1 PASS at CANONICAL V=0.8e-3 on the expert's IN-BAND + STEADY criterion — the DnaA pool oscillates WITHIN [300,800] (steady-gen cycle-mean ~362, peaks <800, troughs ~207) with steady dynamics (oriC 1↔2, every gen divides), exactly her ask; the ~0.6/min dnaA init rate is the known sub-physiological TRADEOFF (init-rate test PARTIAL). No CONSTITUTIVE V closes both band + ~1/min rate (7-point sweep + the 15-gen V=1.1e-3 equilibration run that overshoots) — closing both needs a regulated synthesis lever (Rashmi/Haochen). The earlier V=1.1e-3 pick is WITHDRAWN (its 7-gen "676 in-band" was a pre-equilibration artifact). Rashmi CONFIRMED 2026-06-09 ("0.8e would be okay to move forward") — dnaa-1 SIGNED OFF at V=0.8e-3; the regulated-synthesis lever is deferred (non-blocking). dnaa-2 (hydrolysis) is BEING REDONE on the corrected full-per-gen-history emitter (Rashmi 2026-06-09: the old PASS was stale on pre-fix truncated data). Seed-1 8-gen re-verify @ V=1e-3: still PASSES on the generation-average criterion — DnaA-ATP fraction avg 0.267 in [0.2,0.5] (hydrolysis mechanism HOLDS on clean data), mass-doubling 8/8, oriC 1↔2, total-DnaA all-gen avg 575. HONEST CHANGE: total-DnaA per-gen MEAN now ramps 73→…→880 (ABOVE the 800 ceiling in gens 6-8) — in-band only on the all-gen average; the old "all gens ≤660 in band" was a truncation artifact. This matches dnaa-1's V=1e-3 overshoot → a genuine V TENSION (dnaa-1 wants 0.8e-3 in-band pool; dnaa-2's fraction needs ~1e-3; 0.8e-3 destabilizes dnaa-2). MULTI-SEED (0+1+2) re-verify on the mini DONE — RESULTS STAND: DnaA-ATP fraction robust across all 3 seeds (0.268/0.267/0.302, in [0.2,0.5]); oriC 1↔2 + mass hold every seed; total-DnaA in-band on the all-gen average every seed (392/575/578), with the per-gen >800 overshoot SEED-VARIABLE (seeds 1&2 overshoot mid-run, seed 0 stays in band). Hydrolysis mechanism holds robustly. Rashmi RE-APPROVED dnaa-2 2026-06-10 ("this looks good. lets run the tests as well") — the 4 behaviour tests are evaluated on the canonical re-verify run + recorded (all PASS), so dnaa-2 is CLOSED PASS. ACTIVE FOCUS now dnaa-3 (DnaA-box binding), UN-GATED per her "move on to the next study": the read-only DnaA-box occupancy observer is built + runs on the dnaa-2 baseline; the OPEN QUESTION is the oriC low-affinity OVER-BINDING (free DnaA-ATP ~380-550 nM >> ~100 nM K_d), which the V-down sweep (chart dnaa3_v_sweep_overbinding: V cuts oriC-low occupancy 0.82→0.65→0.57 but is INSUFFICIENT — structurally pinned ~0.5-0.8 given K_d≈100 nM + the pool band) showed V alone cannot resolve — needs a different lever. RESOLVED 2026-06-10: Rashmi shared her ACTIVE box-binding branch; reviewed + VERIFIED + ADOPTED (PR #162, merged → v3; ported via a flat_overrides/dna_sites.tsv true-override). Her active Langmuir solve DEPLETES the free pool (the missing physics the read-only observer lacked) → OVER-BINDING RESOLVED: oriC-low occupancy mean 0.46 (vs read-only ~0.8); BOX-DOUBLING FIXED (315↔630, low-aff doubles 8→16 via fork-passage release); 8/8 clean divisions (chart dnaa3_active_binding_adopted). The read-only observer is superseded. dnaa-3 box-binding is now the active mechanism. RASHMI FEEDBACK 2026-06-10T12:42 INTEGRATED: re-ran the binding at the IN-BAND V=1e-3 (the value used before, not the overshooting 1.2e-3) — run dnaa3_adopt_v1e3_seed0 (8/8 divided); ALL boxes double 315↔630 (low-aff included — answered her Q1); oriC-low occupancy fills GRADUALLY over the cycle (~0.3 birth → ~0.7 init, NOT pre-filled — test #2 PASS); DnaA pool in-band gens 1-5, drifts >800 gens 6-8 (V-tension, test #1 PARTIAL → dnaa-4). Charts restored + re-rendered (time in minutes, division demarcation lines, no gridlines); findings/discovery de-staled; 2 tests added. NEXT (the deeper item Rashmi flagged): DnaA self-autoregulation. VERIFIED 2026-06-10 in our ParCa state: delta_prob[TU00259[c], MONOMER0-160] self-edge = 0 exactly; natural basal dnaA synth = 1.06e-5 (the V override 1e-3 is ~100× that). STOPGAP TRIED (patch basal+delta_prob, drop V override): FAILED — DnaA collapsed to ~17 (natural-rate scale). DIAGNOSIS: the runtime dnaA synth prob is a PRECOMPUTED STATIC value (cache configs.ecoli-transcript-initiation.synth_prob, set during ParCa + overridden by Mechanism A's V) — NOT dynamically recomputed from basal + delta_prob × DnaA-binding each tick. So late-patching transcription_regulation.basal_prob/delta_prob doesn't reach it. UNIFYING INSIGHT: the SAME static-synth-prob architecture is why (a) the V override is needed (to set DnaA in band) AND (b) autoregulation is absent (no feedback). Real fix = make dnaA transcription DYNAMICALLY feedback-controlled at runtime (recompute synth prob from basal + autorepression × actual DnaA-promoter occupancy — ideally her adopted dnaA-promoter boxes) + calibrate basal so feedback equilibrates in-band. This is a proper modeling study (→ dnaa-04 / a regulation study), not a quick patch. It would likely dissolve the V tension + drift at the root.

question: |
  Can v2ecoli reproduce DnaA-driven replication initiation in succinate at
  STEADY STATE — periodic oriC + cell-mass + DnaA dynamics across multiple
  generations — using ParCa's native succinate parameters with no imposed
  τ / C / D overrides?

hypothesis: |
  In succinate (τ ≈ 70–80 min, ParCa-default C = 40 min, D = 20 min,
  B = τ − C − D > 0), v2ecoli with a tuned dnaA RNA-synthesis probability
  (Mechanism A: sim_data.genetic_perturbations["TU00259[c]"] = 2e-3
  runtime overwrite) holds the DnaA monomer pool in the literature
  [300, 800] band across generations and produces a non-overlapping cell
  cycle that initiates replication exactly once per cycle. The cycle
  proceeds: cell starts with 1 oriC, replication initiates once near the
  end of B-period, oriC briefly doubles to 2, replication completes after
  C-period, D-period elapses, division fires, daughters start the same
  cycle again — never reaching 4 oriC simultaneously.

lead: |
  This investigation REPLACES the prior dnaa-replication work entirely.
  Prior context (Round 1–3.8 framing, glycerol cache, imposed τ/C/D,
  intrinsic-hydrolysis dnaa-02, RIDA mechanisms, etc.) is deliberately
  retired per the 2026-05-29 reviewer feedback (see
  feedback-2026-05-29-fresh-start/feedback.pdf). The fresh start uses
  succinate (which already has a saved ParCa sim_data state) and is
  gated study-by-study: dnaa-2..N stay blocked until dnaa-0 and dnaa-1
  pass.

executive:
  what_is_this: |
    v2ecoli + DnaA-driven chromosome replication initiation under the succinate
    growth condition, built study-by-study. The first five studies now hold together:
    dnaa-0 (succinate periodic steady state) PASS; dnaa-1 (DnaA expression) PASS at
    V=0.8e-3 on the expert's in-band + steady criterion (pool oscillates WITHIN [300,800],
    oriC 1↔2, every gen divides; the ~0.6/min init rate is the known sub-physiological
    tradeoff — init-rate test PARTIAL, flagged as needing a REGULATED lever); dnaa-2
    (DnaA-ATP/ADP nucleotide balance + intrinsic hydrolysis) PASS, multi-seed, fraction
    in the Boesen [0.2,0.5] band via Haochen's kinetic-hydrolysis mechanism; dnaa-3
    (DnaA-box binding) PASS — the active Langmuir binding depletes the free pool and
    fixes box-doubling, RESOLVING the earlier over-binding; dnaa-4 (DnaA self-
    autoregulation) is the regulated lever dnaa-1 called for — it dissolves the V-tension
    at the root. A per-generation parquet-emit truncation bug (fixed 2026-06-08) had
    biased the early reads; every PASS above is on the corrected full-per-gen history.
    Each study has an explicit acceptance criterion in biological observables (oriC
    periodicity, DnaA pool steady state, DnaA-ATP fraction band). Further mechanistic
    studies (RIDA/DDAH/DARS, seqA sequestration, cooperativity, validation) are scaffolded
    as a roadmap but not yet worked.
  verdict: |-
    Five linked studies now hold together, and the V-tension that ran through the early
    ones is resolved at the root by DnaA self-autoregulation.

    dnaa-0 PASS (succinate periodic steady state, oriC 1↔2 from gen 3). dnaa-1 PASS at
    V=0.8e-3 on the expert's IN-BAND + STEADY criterion (steady-gen cycle-mean ~362,
    peaks <800, troughs ~207; oriC clean 1↔2, every gen divides) — with the ~0.6/min init
    rate the KNOWN sub-physiological TRADEOFF (init-rate test PARTIAL). A 7-point V-sweep
    + a 15-gen equilibration run established that NO constitutive V closes both the in-band
    pool AND the ~1/min rate (both rise together with V), so dnaa-1 explicitly called for a
    REGULATED lever. dnaa-2 PASS (multi-seed 0/1/2): Haochen's kinetic-hydrolysis mechanism
    drives the DnaA-ATP fraction off the ~0.997 fast-equilibrium pin and into the Boesen
    [0.2,0.5] band (avg ~0.27), mass-doubling 8/8, oriC 1↔2.

    dnaa-3 (DnaA-box binding) PASS: the adopted ACTIVE Langmuir binding (Rashmi's mechanism,
    PR #162) depletes the free DnaA-ATP pool — the physics the read-only observer lacked —
    so the earlier over-binding (free DnaA-ATP ~380-550 nM, oriC-low occupancy ~0.8) is
    RESOLVED, and box-doubling is fixed (low-aff sites double 8→16 via fork-passage release).
    Under the current dnaa-4 reference the box-binding re-run passes ALL 6 acceptance tests,
    including the DnaA-ATP-fraction band (0.284), with oriC-low occupancy down to 0.04-0.17
    and free DnaA-ATP ~5-11 nM (<< the 100 nM K_d).

    dnaa-4 (DnaA self-autoregulation) — the regulated lever, mechanism-validated homeostasis.
    CANONICAL REFERENCE (F-07; Rashmi/Haochen commit eb4ea39): LINEAR autoregulation s=0.6 +
    F-05 (kinetic apo+ATP charging) at V=1.5e-3, k_h=0.025/min — a CLEAN band pass (every
    steady gen g4-11 in [300,800]), clean cell cycle (12/12 divided, oriC 1↔2), DnaA-ATP
    fraction 0.261, matching Rashmi's reference PDF. This SUPERSEDES the earlier Hill
    exploration (Hill s=0.7 brought only 2/3 seeds in-band; s=0.65/F-06 stalled division).
    Feedback holding free DnaA-ATP low is also what lets dnaa-3 pass its fraction band — so
    autoregulation dissolves the dnaa-1/2/3 V-tension at the root, exactly as deferred.

    MULTI-SEED (seeds 0/1/2, 12-gen): the autoregulated HOMEOSTASIS is ROBUST — clean cell cycle
    (12/12, oriC 1↔2, 0 re-inits) and total-DnaA pool in [300,800] (steady g4-11) on all three
    seeds. The DnaA-ATP-FRACTION band, however, is SEED-SENSITIVE — in band only on seed 1 (0.261);
    seed 0 (0.156, ramping toward band late) and seed 2 (0.085, erratic) fall below 0.2 — so dnaa-4
    stays PARTIAL on the fraction (homeostasis confirmed, fraction band seed-1-specific).

    MECHANISTIC INITIATION (dnaa-5/6/7) — the headline extension: replace the inherited cell-mass
    initiation heuristic with biology-driven DnaA-ATP/oriC initiation, built as a gated chain.
    dnaa-6 first-pass (trigger on oriC-high saturation, no cooperativity) COLLAPSED — under-
    initiation, runaway growth — proving the binding must be switch-like first. dnaa-5 added
    COOPERATIVE DnaA-ATP filament assembly at oriC (a Hill switch on the oriC-low pool): the
    occupancy now snaps to full (validated; preserves the DnaA/ATP bands + cycle at n=4, K=30).
    dnaa-6 PAYOFF (trigger re-pointed to the oriC-low cooperative switch + cooperativity) then
    SUSTAINS the cell cycle — 8/8 generations divide, the collapse resolved: DnaA-ATP/oriC
    initiation CAN drive the cycle in place of the heuristic. The remaining issue was OVER-
    initiation (oriC->4); dnaa-7 RESOLVED it — a global SeqA refractory eclipse + threshold/K tuning
    FAILED (worsened it), but RIDA (Regulatory Inactivation of DnaA, DnaA-ATP->ADP after initiation)
    RESTORES clean one-initiation-per-cycle (oriC 1<->2, 0 re-inits, 8/8 divide) because it resets
    the DnaA-ATP switch post-initiation. So the full DnaA-ATP/oriC mechanistic initiation now works
    end to end (cooperative switch fires it, RIDA enforces once-per-cycle) and replaces the cell-mass
    heuristic. One open knob: the RIDA RATE over-suppresses DnaA-ATP at full strength (fraction ~0.03
    << [0.2,0.5]), so RIDA/DARS need calibration (the dnaa-05 mechanism) to hold the ATP band. Other
    roadmap items (validation, per-origin hemimethylation SeqA) remain.
  verdict_status: in-progress
  verdict_detail: |-
    Both foundational studies PASS. dnaa-0: v2ecoli reaches the succinate
    periodic steady state (oriC 1↔2 from gen 3, transient 4 in gens 1–2;
    reviewer-confirmed). Both acceptance tests re-verified from the parquet
    (2026-05-31, scripts/verify_dnaa0_acceptance.py): oriC max ≤2 from gen 3,
    cell_mass CV birth 0.021 / peak 0.045. dnaa-1 — PASS 2026-06-09 at the CANONICAL
    V=0.8e-3 on the expert's IN-BAND + STEADY criterion. A 7-point V-sweep (Rashmi's request
    — "tune the v value to get the DnaA levels to oscillate between 300-800... my guess
    would be 1e-3") plus a 15-gen equilibration run and a multiseed, set per-run via the
    recorded --perturbation 'TU00259[c]=V' override on one shared cache
    (out/cache_dnaa1_mechA_1.7e-3, each run OVERRODE the baked 0.0017), full per-gen
    history, seed 1. V=0.8e-3 is the ONLY V whose DnaA pool oscillates WITHIN [300,800] —
    the whole oscillation, steady-gen (4-7) cycle-mean 336.5/337.5/359.5/414.8 (pooled
    ~362), peaks <800 (max 553), troughs ~207 — AND keeps steady-state dynamics (oriC clean
    1↔2 every gen, every gen divides), which is exactly the expert's ask. The dnaA init rate
    at V=0.8e-3 is ~0.6/min (gens 4-7 0.65/0.46/0.57/0.71) — sub-physiological vs the ~1/min
    target: the KNOWN TRADEOFF, recorded as PARTIAL on the init-rate test. ESTABLISHED: no
    single CONSTITUTIVE V closes both the in-band pool AND the ~1/min rate — the rate hits
    ~1/min only at V≈1.0-1.1e-3, where the pool does NOT equilibrate in band (the completed
    15-gen V=1.1e-3 run out/dnaa1_v1p1e-3_long shows the cycle-mean climbs over 800 — peak
    976 @gen9, gens 6-12 ≥800 — then relaxes to 485 by gen15). Both the pool and the rate
    rise together with V, so closing both needs a REGULATED / cell-cycle-coupled DnaA
    synthesis lever (for Rashmi/Haochen). The earlier V=1.1e-3 pick is WITHDRAWN: its 7-gen
    "676 in-band" reading was a pre-equilibration artifact, caught mid-ramp before the pool
    finished climbing over the ceiling. oriC clean 1↔2 every gen, every gen divides, and the
    steady-state dynamics are seed-robust (multiseed seeds 0-3). Pending Rashmi's
    confirmation of the V=0.8e-3 pick. The earlier
    "in-band 665-710" PASS at V=1.7e-3 was a truncated-emit artifact (only ~43 s/gen, the
    post-division trough, was emitted before the now-fixed division history-wipe bug).

    2026-05-31 reviewer round (Rashmi): (1) dnaa-0 + dnaa-1 now carry explicit
    `runs:` provenance + canonical 6-axis status, so the report shows them as
    ran/evaluated/passed rather than "pending" (they previously declared
    completion but recorded no runs — a derive-on-read status gap, now also
    guarded by a new report-linter check). (2) dnaa-1's RNA-synth probability
    re-tuned 2e-3 → 1.7e-3 to reduce the pre-division DnaA peak overshoot
    (~28% → ~10–15% over the 800 ceiling), CV 7.2% → 2.3%, oriC still clean;
    the residual peak excursion is intrinsic (the DnaA pool doubles per cycle).
    (3) dnaa-2 canonical lineage pinned to seed 0 — seed 2 showed a within-cycle
    reinitiation at its 4th generation (oriC 1→2→4); seeds 0 & 3 stay clean.

    dnaa-2 (DnaA-ATP/ADP nucleotide balance + intrinsic hydrolysis) — PASS.
    The earlier ~0.997 DnaA-ATP pin was diagnosed (Haochen) as a FAST-EQUILIBRIUM
    artefact, not a parameter error: v2ecoli integrated the DnaA-ADP binding to
    steady state each tick, instantly reverting hydrolysis-made DnaA-ADP. Haochen's
    bf8b82e mechanism (commit ADOPTED) keeps the DnaA-ADP reaction bidirectional but
    flags it integrate_dt=true (kinetic, literal k_r=1×10⁻⁷/s) and adds DnaA-ATP
    intrinsic hydrolysis (k=0.046/min) as a one-way kinetic reaction. This drives
    the DnaA-ATP fraction OFF the pin and INTO the Boesen [0.2,0.5] band.
    DIRECTED RUN (Rashmi 2026-06-04) — SEED 1 × 8 GENERATIONS, evaluated on her
    GENERATION-AVERAGE criterion (2026-06-04: initial gens may not strictly fall in
    band while stabilizing — use the average). All four must-preserve behaviours PASS:
    periodic mass doubling (8/8 divisions); oriC 1↔2 one-init/gen (in {1,2} every gen);
    total DnaA in [300,800] on the generation average (avg 535; within-cycle peaks
    >800 pre-division are the expected accumulate-then-divide behaviour); DnaA-ATP
    fraction in [0.2,0.5] on the generation average (all-gen avg 0.26, steady-gen avg
    0.222). Canonical figure charts/dnaa2_reverify_multiseed.png. SECONDARY (not a
    blocker): per-gen averages trend to the low edge of the band in later gens — a
    total-DnaA dependence (diagnosis figure), with k_r the future-tuning lever for Haochen.

    dnaa-3 (DnaA-box binding) — PREPARED FOR REVIEW. Haochen's spec wraps DnaA
    binding to 315 boxes in 4 affinity pools (302 chromosomal-high, 3 oriC-high, 8
    oriC-low, 2 promoter-high) in fast equilibrium on the dnaa-2 baseline, without
    changing initiation. Design complete + a 6-step build plan; the 307-box
    chromosome map + the dnaa-2 baseline figure are attached. NOW BUILT + RUN
    (the read-only listener; see the 2026-06-07/08 update below).

    dnaa-3 (2026-06-07/08): the in-sim DnaA-box binding fires correctly inside the simulation as the PROVIDED read-only occupancy listener (4 affinity pools, fast equilibrium, full box set; three wiring fixes: bulk port type, read-only output topology, emitter overwrite-vs-accumulate). It reports free DnaA-ATP and per-pool occupancy with the dnaa-2 cell cycle preserved exactly. CORRECTION (Rashmi 2026-06-08): an earlier pass had added a box-capacity cap=32 justified by outside ChIP-seq (Smith 2024) plus a DnaA sink and abundance/datA literature — none of which were provided. These have been WITHDRAWN; only the provided mechanisms are modeled. The multi-generation read-only run (7 gens, full per-gen history) and the full plot set Rashmi requested are now DONE (oriC, cell mass, all DnaA forms bound+free, concentrations, ATP/ADP fraction across generations; box occupancy at a steady-state generation). HONEST FINDING: the over-binding PERSISTS within the provided model. The DnaA-ATP fraction is in band (0.23), but free DnaA-ATP stays ~380-550 nM — ≈4× the 100 nM oriC-low K_d — for 100% of every cycle across all 7 generations, so oriC-low occupancy holds ~0.8 throughout (high-affinity pools saturate). So contrary to the 2026-06-08 expectation, the correct DnaA-ATP fraction does NOT by itself leave the low-affinity sites modestly occupied; the over-binding is a real open question within the provided mechanisms (nothing in the provided read-only model lowers free DnaA-ATP), and we are NOT re-introducing a cap/sink to force it down. The withdrawn ideas (Smith ChIP-seq, abundance, datA) are recorded as proposed_inputs for Rashmi to Accept or Decline in the report.
