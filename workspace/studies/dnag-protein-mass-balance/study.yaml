controls:
- name: mass-balance-works-for-controls
  kind: positive
  hypothesis: A first-order mass balance should predict the counts of proteins whose transcripts behave
    normally. If it cannot, it cannot be used to judge DnaG.
  expected: within a factor of 2 for at least 70% of comparison monomers.
  observed: ''
  result: PENDING
alternative_hypotheses:
- claim: The residual is an artefact of comparing a time-averaged count against a fitted steady-state
    one, ignoring dilution and degradation.
  discriminated_by: mass-balance-predicts-observed-protein.
  status: untested
- claim: ParCa's 38-copy expectation is malformed because it assumes a transcription rate the ppGpp path
    does not deliver.
  discriminated_by: parca-expectation-matches-delivered-transcription.
  status: untested
- claim: The double-counting objection is wrong because the fitted and runtime translation efficiencies
    differ, making translation a legitimate term.
  discriminated_by: fitted-and-runtime-translation-efficiency-agree.
  status: untested
- claim: A mechanism is genuinely missing and the residual is a real defect.
  discriminated_by: All three axes above failing while the control passes.
  status: untested
falsifiability: The missing-mechanism framing is overturned if the mass balance reproduces the observed
  count, which would make the residual an artefact of the comparison. It is also overturned if ParCa's
  expectation proves inconsistent with the delivered transcription, which would make the 21.6x gap partly
  an artefact of the expectation. The study itself is invalidated if the balance cannot predict ordinary
  proteins.
limitations:
- A first-order mass balance ignores burst kinetics and the discrete, low-copy regime DnaG occupies --
  it sits at zero 62% of the time, where a continuous steady-state approximation is least trustworthy.
- The sweep is reused rather than repeated.
- Agreement within a factor of 2 would show the balance is consistent with the observation, not that the
  modelled mechanism is biologically correct.
- Single medium and condition.
- Three quantities are carried in from prior studies as pins and cannot be tested here, only relied upon.
conclusion_logic:
  if_primary_tests_pass: 'The mass balance reproduces the observed protein from measured rates, so no
    mechanism is missing: the 4x residual was an artefact of comparing a time-averaged count against a
    fitted steady-state one, and the corrected 5.4x transcription deficit is sufficient to explain DnaG''s
    scarcity after all.'
  if_primary_tests_fail:
    summary: If the balance fails on DnaG but passes the control, a mechanism is genuinely missing and
      the residual is real. If ParCa's expectation is inconsistent with delivered transcription, the gap
      is partly an artefact of the expectation. If the fitted and runtime efficiencies differ, translation
      becomes available as an explanation after all.
    diagnose:
    - question: Is the 4x residual an artefact of the comparison or a missing mechanism?
      note: Answered by the primary axes together with the control.
    - question: What did dnag-protein-mass-balance's failure leave unresolved, and where was it taken
        up?
      seeded_study: fit-runtime-reconciliation
      note: Chronological successor in this investigation's chain. The existing diagnose entry above records
        what this study answered INTERNALLY; this one records where the remaining question went next.
discovery_implications:
  resolved_uncertainties:
  - 'Whether a mechanism is missing: no. The balance predicts DnaG out-of-sample at 0.694.'
  - 'What the 4x residual was: the wrong protein observable (bulk 1.76 vs total 7.996) plus a steady-state-vs-time-average
    comparison.'
  - 'Whether the double-counting objection holds: yes, by construction.'
  remaining_uncertainties:
  - Why ParCa fits a transcription rate 6.85x above what the model delivers.
  - Whether other studies' figures need restating on the corrected observables.
  followup_study_proposals:
  - id: FU-01
    title: Why does ParCa fit a transcription rate the model cannot deliver?
    motivation: 'The fit implies 6.85x more transcription than the ppGpp path supplies,

      closely matching the independent 5.40x deficit. Fit and runtime disagree

      about the same quantity, which is the remaining defect.

      '
