discovery_implications:
  resolved_uncertainties:
  - 'The inference substrate is built and runs end-to-end: per-tick emission for both initiation
    Processes, an aggregate LikelihoodCollector, XArrayEmitter persistence to per-replicate zarr,
    mean-to-mean epsilon calibration, SMC sequential refinement, and a 2D multi-parameter sweep.'
  - 'The emitted aggregate likelihood is self-calibrated log P(simulated | simulated_param), NOT the
    ABC-correct log P(observed | proposed); switching to count-based ABC distances is the architectural
    fix.'
  - 'On a self-generated 3x3 (Ts, Ps) toy grid (N=4 replicates, 60 s), count-based distances separate the
    truth node from its next-nearest CELL better than aggregate log-likelihood: the combined count vector
    reaches a 3.06x grid-separation ratio (vs 2.39x for aggregate log-likelihood). These are grid-separation
    diagnostics, not a posterior or credible interval. No script computes a "row-separation" metric — the
    earlier "~150x row-separation" figure was not actually computed.'
  remaining_uncertainties:
  - 'SBC rank-uniformity (chi^2 p > 0.05 over >=1000 draws) and >=85% empirical coverage of 90% credible
    intervals — the gate that converts "we have likelihoods" into "inference-ready likelihoods" — have
    not been demonstrated on the count-based pipeline.'
  - 'The pbg scalar-pruning quirk (task #14) was only worked around (pin-via-consumer declarations in
    sprints 1 and 13); the root cause at the merger layer is unresolved.'
  alternate_hypotheses:
  - id: aggregate-ll-sufficient
    statement: 'Aggregate log-likelihood is a sufficient ABC distance, and the apparent superiority of
      count vectors is an artifact of the 2D sweep''s anti-diagonal ridge rather than a general
      identifiability win.'
    why_plausible: 'Under a 1-parameter sweep the aggregate metric still ranks truth highest; the ridge
      only appears when Ts and Ps trade off.'
    mechanism_elements_affected:
    - abc-distance-metric
    - parameter-identifiability
    discriminating_observables:
    - truth-vs-next-nearest separation, aggregate-LL vs combined-count-vector, across 1D and 2D sweeps
    - presence of the anti-diagonal ridge under per-channel distance
    evidence_for: []
    evidence_against:
    - 'The 2D (Ts, Ps) sweep shows reducing transcription while raising translation partially cancels
      under aggregate LL (anti-diagonal ridge); per-channel distance breaks the ridge.'
  mechanism_update_proposals:
  - mechanism_node_or_edge: abc-distance (aggregate-LL -> count-based)
    update_type: replace
    rationale: 'Adopt the combined count vector sqrt(d_rna^2 + d_ribosome^2) as the candidate ABC distance;
      on the self-generated 3x3 toy grid it is ~28% better-separated (truth-vs-next-nearest CELL, 3.06x vs
      2.39x) than aggregate log-likelihood. Grid-separation diagnostic only — not validated as a posterior or
      a "canonical" distance.'
    requires_expert_approval: true
  followup_study_proposals:
  - id: pdmp-03-sbc-coverage
    title: SBC rank-uniformity + credible-interval coverage on the count-based pipeline
    study_type: calibration
    source_trigger: open_gate
    proposed_experiment: 'Run >=1000 SBC draws through the count-based ABC-SMC pipeline; gate on chi^2
      rank-uniformity p > 0.05 and >=85% empirical coverage of the 90% credible intervals.'
    expected_information_gain: high
    expert_gate_required: false
  - id: pdmp-03-pbg-merger-fix
    title: Root-cause fix for the pbg scalar-pruning merger quirk (task #14)
    study_type: infrastructure
    source_trigger: workaround_debt
    proposed_experiment: 'Fix scalar listener-field pruning at the pbg merger layer so pin-via-consumer
      workarounds are unnecessary; regression-test against the sprint-1 and sprint-13 cases.'
    expected_information_gain: medium
    expert_gate_required: false
findings:
- id: abc-smc-sbc-validated-on-count-surrogate
  kind: computational
  status: confirms
  statement: 'Phase-3 increment 1: a real ABC-SMC (importance weights + Gaussian perturbation kernel +
    adaptive-epsilon schedule) recovers a transcription-init rate from count-level observations, validated
    by Simulation-Based Calibration AND a posterior-predictive check. The forward model is a
    negative-binomial count surrogate calibrated ONCE to real WCM rna_init_event statistics (mu0=12593,
    Poisson limit). This replaces the prior grid-diagnostic phase3_abc_* scripts with the cited-but-missing
    run_abc_smc / run_sbc / run_ppc. HONEST SCOPE: validated on the WCM-calibrated count LIKELIHOOD (single
    parameter, K=150 SBC), NOT the full WCM in the ABC loop (deferred to the Phase-4 compiled runtime) and
    NOT the K=1000 multi-modality full gate. A real methodological finding fell out: the WCM Poisson
    posterior is sharp (~300x tighter than a toy), so ABC needs n_generations=12 to converge -- SBC
    correctly REJECTED an under-converged ng=6 run before passing at ng=12 (the gate is doing its job).'
  evidence:
    from_run: 'phase3 ABC-SMC/SBC/PPC on the WCM-calibrated count surrogate (run_abc_smc/run_sbc/run_ppc)'
    observed: 'recovery theta_true=1.2 -> post_mean 1.1995, 90% CI [1.1984, 1.2006]; SBC K=150 chi2_p=0.576 (uniform, PASS); PPC 90% coverage=0.907 (PASS)'
  provenance:
    run_ids: [phase3-surrogate-calibration, phase3-abc-smc-recovery, phase3-sbc-k150, phase3-ppc]
  next_action: 'Extend to multi-modality summaries + full-WCM-in-the-loop (needs Phase-4 compiled runtime) for the K=1000 inference-ready gate.'
