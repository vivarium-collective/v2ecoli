  - name: pc-recovery-pilot-millard
    status: scaffold-pilot-done
    n_steps: 40 obs + 6 interventions (v1) or 80 obs at mixed times (v2)
    details: "PILOT 2026-05-25/26. Two iterations:\nv1 (scripts/run_causal_pc_pilot.py, 2026-05-25): correlation-only skeleton + interventional orientation. 40 obs + 6 knockouts at steady state. Result: 55.6% recall, 13.9% precision, but the \"recall\" was misleading. Diagnosis (during v2): Millard reaches a unique deterministic steady state regardless of IC perturbation; marginal pairwise |r| ≈ 1.0 across all metabolites (rank-1 observation matrix). v1 \"matched\" by chance on rank-1 data, not real causal structure.\nv2 (scripts/run_causal_pc_v2.py, 2026-05-26): proper PC algorithm with partial-correlation conditional-independence tests (Fisher z-transform p-values) at |S| up to 2, v-structure orientation via sepsets. Data-generation fix: capture at mixed transient timepoints (200/500/1000s) + larger per-species IC perturbations (3x noise) so the observation matrix is genuinely multi-dimensional. Result on 80 obs: 33% directed recall (3/9), 16% precision.\nFinding: the PC algorithm does work on Millard, but requires transient-state observations. Steady-state observations are rank-1 / uninformative for deterministic systems. For pdmp-05.tests. pc-recovers-known-edges (80% recall), the path forward is either (a) richer time-course observations (multiple snapshots per replicate, not just one) or (b) more aggressive interventions that drive the system to truly distinct attractors."
