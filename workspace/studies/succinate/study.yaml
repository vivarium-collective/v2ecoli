findings:
- id: succinate-vs-vecoli-result
  kind: computational
  status: partial
  statement: 'v2ecoli reproduces vEcoli on succinate (4-seed gen-1, Welch t-test):
    cell, dry, RNA and protein mass within tolerance (4/5 within_tol); growth rate
    shows a non-significant drift at basal noise level.'
  evidence:
    from_card: statistical
    observed: growth -6.6% (p=0.44, not significant); RNA -2.2%; cell -1.3%; dry -1.4%;
      protein -0.8% -- overall drift.
