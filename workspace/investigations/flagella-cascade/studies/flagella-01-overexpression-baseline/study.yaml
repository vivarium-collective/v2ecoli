schema_version: 3
name: flagella-01-overexpression-baseline
title: "Aim 2 motivation — uncontrolled flagellar overexpression & seam neutrality"
description: |
  Establishes Maya's Specific Aim 2 motivation in v2ecoli: with no transcriptional
  regulation, the whole-cell model overproduces flagellar components relative to
  biological levels (her prelim reports ~48 flagella). This study characterizes the
  unregulated baseline AND proves that adding the flagella_regulation infrastructure
  is a true no-op when the feature is OFF — so any change downstream is attributable
  to the regulatory cascade, not to the port itself.
topic: regulation
tags: [flagella, baseline, overexpression, seam-neutrality, feature-off, aim2, ported-from-vecoli-biofilm]
created: '2026-06-20'

status: in_progress
phase: Evaluate

design_status: complete
implementation_status: complete
simulation_status: ran             # feature-off neutrality verified during the port
evaluation_status: partial
gate_status: pending
expert_review_status: not_requested

visualizations:
- address: image:charts/01_overexpression_and_neutrality.svg
  chart: charts/01_overexpression_and_neutrality.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies.py
  description: |
    TWO runs are shown here on purpose (this answers "why is there a regulation-ON
    line in the baseline study?"): the study's job is to (a) characterize the
    unregulated baseline AND (b) prove the port is a no-op when off, so we run the
    SAME composite twice — regulation OFF (the baseline) and regulation ON (for
    reference) — and compare.
    Left — unregulated flagellar components (complete flagella CPLX0-7452 + the
    motor/HBB FLAGELLAR-MOTOR-COMPLEX) over a 600 s run with regulation OFF.
    Right — complete-flagella count, regulation OFF vs ON, so you can see the
    baseline against the regulated case side by side. (On the fast-mode cache the
    OFF-vs-ON direction shown here is a calibration artifact — the CALIBRATED
    answer is the canonical seed-band figure below.) Feature-off
    init_prob_override stays 0 throughout (seam neutral), and that neutrality
    result is cache-independent.
- address: image:charts/02_multigen_flagella_and_mass.svg
  chart: charts/02_multigen_flagella_and_mass.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_multigen.py --generations 2
  description: |
    Again two runs — regulation OFF vs ON — over TWO full cell generations on the
    CALIBRATED full-mode cache (generations shaded; division = dashed). "Regulation
    ON" means the flagella_regulation feature is enabled (the Kalir & Alon SUM-gate
    is wired and writing promoter overrides); "OFF" is the stock WCM. Left —
    complete flagella per generation: regulation ON sits ABOVE OFF (OFF g1=46,g2=43;
    ON g1=61,g2=50) — the calibrated direction (see the canonical seed-band figure).
    Right — dry-mass sawtooth (division at ~700 fg). NOTE: regenerated from
    out/cache_full; on the fast cache the order was reversed (the artifact).
- address: image:charts/04_ensemble_seed_band.svg
  chart: charts/04_ensemble_seed_band.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/run_studies_ensemble.py --seeds 0 1 2 3 --generations 3 --cache-dir out/cache_full
  description: |
    CANONICAL count figure — calibrated full-mode cache, 4 seeds x 3 generations.
    Mean ± seed range of complete flagella per generation (OFF vs ON) plus per-seed
    trajectories. The regulated (ON) band sits ABOVE the unregulated (OFF) band at
    every generation (ON means 62.5/54.8/59.0 vs OFF 49.5/44.2/40.8; ON > OFF in
    11/12 seed-generations). The cascade as implemented INCREASES flagella — the
    fast-mode "reduction" was a calibration artifact.

baseline:
- name: wcm-unregulated
  composite: v2ecoli.composites.baseline.baseline
  params:
    seed: 0
    cache_dir: out/cache
    features: []                   # regulation OFF — the unregulated baseline

purpose:
  question: |
    (a) How over-expressed are flagellar components in the unregulated WCM baseline?
    (b) Is the flagella_regulation port byte-neutral when the feature is off?
        ("Byte-neutral" = with the feature OFF, the model produces bit-for-bit
        identical output to pre-port main — adding the flagella code changes
        NOTHING you can observe until you switch it on. This is what lets us
        attribute every downstream difference to the cascade, not to the port.)
  mechanism: |
    With features=[] the two flagella Steps are not wired and the promoter
    init_prob_override field stays 0.0 everywhere, so transcript_initiation's
    substitution (guarded on > 0) never fires — identical initiation probabilities
    to pre-port main. Flagellar component counts (CPLX0-7452, flagellin, motor) are
    read straight from the unregulated baseline for comparison against the regulated
    runs in flagella-02 / flagella-03.
  expected_outcome: |
    init_prob_override == 0 for every promoter across the run; cell grows/divides
    normally; flagellar component counts sit at the (over-expressed) unregulated
    level that the cascade is intended to bring down.

behavior_tests:
  - id: feature-off-neutral
    statement: |
      With flagella_regulation OFF, promoters.init_prob_override is 0 for every
      promoter across a 30 s run and the cell grows normally.
    status: passing      # verified during the port (0 nonzero overrides after 30 s)
  - id: parity-attributable-to-data-not-code
    statement: |
      The feature-off signature on the rebuilt cache matches the shipped-fixture
      signature (control), confirming the ~1% delta vs the committed golden is
      pre-existing golden drift, not this port.
    status: passing      # verified via the shipped-fixture control
  - id: regulation-reduces-flagella-across-generations
    statement: |
      Across two cell generations, the flagella_regulation lineage carries fewer
      complete flagella (CPLX0-7452) than the unregulated lineage at each generation
      — the cascade reduces overexpression and the gap persists through division.
    status: refuted        # holds ONLY on the fast (mis-calibrated) cache; the
                           # calibrated 4-seed x 3-gen ensemble reverses it.
  - id: regulation-increases-flagella-calibrated
    statement: |
      On the calibrated full-mode cache, the regulated lineage carries MORE complete
      flagella than the unregulated one, robustly across seeds — refuting the
      overexpression-reduction hypothesis for the cascade as implemented.
    status: passing        # 4-seed x 3-gen calibrated ensemble: ON means
                           # 62.5/54.8/59.0 vs OFF 49.5/44.2/40.8; ON>OFF in 11/12.

# Two-tier acceptance (Maya's suggestion — separate "did the MODEL behave" from
# "is it BIOLOGICALLY right"). For the baseline study, biological success is
# faithfully reproducing the KNOWN overexpression problem, not fixing it.
success_criteria:
  model:
    - Feature OFF is byte-neutral — init_prob_override == 0 on every promoter for the
      whole run; the cell grows and divides exactly as pre-port main (verified).
    - The composite runs to division without error with the flagella code present.
  biology:
    - Reproduces the documented unregulated overexpression (~48 complete flagella,
      far above the biological handful) — the motivation the cascade must address.
    - FUTURE — a calibrated model would bring counts toward the biological few; this
      baseline only establishes the gap (see the count verdict in flagella-02).

notes: |
  Maya's prelim (Aim 2 rationale): "current expression of flagella is exceedingly
  high compared to biological levels and manual adjustments like multipliers,
  adjustments to stoichiometry, and overrides are a plausible approach to minimize
  expression ... however, manual tuning is not a biologically and mechanistically
  sufficient solution." This study is the no-regulation reference the cascade
  studies are measured against.

  Glossary (for reviewers):
    - features=[] — the composite's opt-in feature list is empty, i.e. regulation
      OFF (stock WCM). features=['flagella_regulation'] switches the SUM-gate ON.
    - "stale" (where it appears on a chart/cache note) — outdated: generated from an
      earlier cache/run and superseded, kept only for provenance.
    - Are the tests/claims editable? Yes — every behavior_test and success_criterion
      here is hand-authored YAML in this study.yaml; edit it directly. Tests are a
      mix of STANDARD categories (shared across studies — see the investigation's
      testing_standard) and claims UNIQUE to each study.
