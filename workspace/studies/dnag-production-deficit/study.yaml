schema_version: 4
name: dnag-production-deficit
title: DnaG production deficit
created: '2026-09-03'
status: complete
phase: Decide
study_type: diagnostic
investigation: transcription-rewiring
question: Study 2 showed DnaG is the resource limiting replication initiation. Where in the production chain is DnaG lost, is the model reproducing its own fitted target, and is that deficit why mechanistic replisome gating cannot be enabled?
biological_summary: 'DnaG (DNA primase) synthesises the RNA primers every replication fork needs.

  Study replisome-gate-sufficiency established it is the binding constraint on

  initiation in v2ecoli: at every stall it is the only replisome pool below the

  gate''s demand, and removing it from the gate''s requirement restores full

  12-generation survival. This study asks the upstream question -- why is there

  so little of it -- by walking the chain from transcript to protein and

  locating the step where the shortfall appears.


  The chain has three candidate steps. Transcription: dnaG''s only transcript is

  TU00352, shared with rpsU and rpoD. Translation: each cistron carries its own

  efficiency, a ParCa input fitted from Li 2014 ribosome profiling. Degradation:

  a per-monomer rate. A shortfall at any one of them would produce the same

  phenotype, so naming the step requires measuring all three against every other

  gene rather than inspecting DnaG alone.


  The operon is what makes this diagnosable. rpsU, dnaG and rpoD share ONE

  transcript, so they draw on one mRNA pool. Any divergence in their protein

  counts therefore cannot come from transcription; it has to come from a

  per-cistron step downstream. That turns the operon into a natural internal

  control.


  There is also a distinction the study keeps separate throughout: agreement

  with experiment, and agreement with the model''s own fitted target. ParCa fits

  a per-monomer count that the simulation is supposed to reproduce. A model that

  disagrees with proteomics is miscalibrated; a model that disagrees with its own

  ParCa fit is not running the parameterisation it was given. These are different

  defects with different fixes, and conflating them would misdirect the repair.

  '
assumptions:
- text: ParCa's fitted per-monomer count is the target the running simulation is expected to reproduce at steady state.
  verified_in_v2ecoli: true
- text: The permissive arm of replisome-gate-sufficiency is a healthy, unperturbed 12-generation lineage, so its DnaG trajectory reflects normal production rather than a consequence of the gate.
  verified_in_v2ecoli: true
pipeline_gate:
  prerequisites:
  - study: replisome-gate-sufficiency
    condition: tests-passed
    relation: leads-to
    outputs_used:
    - DnaG identified as the limiting pool, unanimously across 8 seeds
    - The distilled evidence bundles, reused here as the multi-generation record
  enables: []
  proceed_condition: The lossy step is identified and the experiment-vs-own-target distinction is resolved, so a repair can be aimed at the right parameter.
  gate_evaluator:
    result: failed
    blocked_by:
    - simulation-reproduces-parca-target
    evaluated_by: code
    diverges_from_authored: false
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants: []
  model_settings: []
baseline:
- name: baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []
units_and_time:
  tick: 1 tick = 1 s of simulated time (composite time_step=1)
  quantities:
    protein counts: molecule copies per cell (integer bulk counts)
    basal synthesis probability: dimensionless per-transcript initiation probability
    translation efficiency: dimensionless ParCa input (Li 2014 ribosome profiling)
    degradation rate: per-second first-order rate
    percentile: rank of dnaG's value among all genes, 0-100
behavior_tests:
- name: simulation-reproduces-parca-target
  classification: primary
  gate_class: acceptance_criterion
  question: Does the running model reproduce the count ParCa fitted for DnaG?
  description: 'Mean simulated DnaG is within 2x of ParCa''s own fitted per-monomer count. This is the axis that separates a calibration problem from an execution problem, and it is the one genuinely open question at design time: nothing in the reconnaissance measured the fitted target on this branch, only the simulated counts.

    Threshold provenance: theory. A factor of 2 is a generous band for a quantity the simulation is supposed to be reproducing directly, chosen so that ordinary stochastic and cell-cycle variation cannot fail it. It is not a literature value and nothing is cited for it.'
  measure:
    kind: derived
    detail: mean simulated DnaG divided by ParCa's fitted count.
  pass_if:
    op: '>='
    value: 0.5
    provenance:
      kind: theory
      note: Generous 2x band; a model reproducing its own fit should clear it easily.
  status: pending
- name: transcription-is-not-the-lossy-step
  classification: primary
  gate_class: acceptance_criterion
  question: Is the dedup hypothesis right that dnaG is starved of transcription?
  description: 'TU00352''s basal synthesis probability sits ABOVE the median transcript (percentile > 50). The investigation''s standing hypothesis is that collapsing the rpsU promoters into one transcription unit starves dnaG of transcription; that hypothesis predicts this test FAILS.

    Stated in the direction that makes the dedup hypothesis falsifiable rather than in the direction that confirms it. A pass refutes the transcription story and redirects the investigation downstream.

    Threshold provenance: theory. The median is the natural dividing line between "starved" and "not starved" and requires no tuning.'
  measure:
    kind: derived
    detail: percentile of TU00352 basal_prob among all 3277 transcripts.
  pass_if:
    op: '>'
    value: 50
    provenance:
      kind: theory
      note: The median transcript is the non-arbitrary boundary for "starved".
  status: pending
- name: operon-partners-diverge
  classification: supporting
  gate_class: acceptance_criterion
  question: Do cistrons on one transcript reach different protein levels?
  description: 'rpsU, dnaG and rpoD share TU00352, so they draw on one mRNA pool. If their model/literature ratios differ by more than 2x, the divergence cannot come from transcription and must come from a per-cistron step downstream. This is the study''s internal control: it localises the loss without relying on any absolute count being right.

    Threshold provenance: theory, and can fail. If all three partners track together, the loss is shared and the per-cistron explanation is wrong.'
  measure:
    kind: derived
    detail: max/min of the model-to-literature ratio across rpsU, dnaG, rpoD.
  pass_if:
    op: '>'
    value: 2.0
    provenance:
      kind: theory
      note: A 2x spread is the smallest divergence that a shared mRNA pool cannot explain.
  status: pending
- name: dnag-below-literature
  classification: supporting
  gate_class: regression_pin
  description: 'ParCa''s fitted DnaG is below the four-dataset literature median.

    POST-HOC. Measured during reconnaissance before this study existed, so it is a pin against drift and NOT acceptance evidence. It is recorded because the four-dataset median is the honest comparison: Schmidt alone reads DnaG far lower than Soufi, Mori and Li, and a single-dataset check points the wrong way. That error was actually made during scoping and corrected.'
  measure:
    kind: derived
    detail: ParCa fitted DnaG divided by the four-dataset literature median.
  pass_if:
    op: <
    value: 1.0
    provenance:
      kind: post_hoc
      note: Observed during reconnaissance; pin only.
  status: pending
- name: dnag-not-maintained-across-generations
  classification: supporting
  gate_class: regression_pin
  description: 'DnaG spends most of the lineage at zero copies. Measured per generation so a decline is distinguishable from a constant deficit.

    POST-HOC: the pooled fraction was measured during reconnaissance. Pin only.'
  measure:
    kind: derived
    detail: fraction of timesteps with DnaG == 0 across a 12-generation lineage.
  pass_if:
    op: '>'
    value: 0.25
    provenance:
      kind: post_hoc
      note: Observed during reconnaissance; pin only.
  status: pending
- name: supply-below-gate-demand
  classification: primary
  gate_class: regression_pin
  description: 'The lineage sits below the initiation gate''s DnaG demand (2 copies per origin) for a substantial fraction of the time, which is the mechanical reason mechanistic replisome gating cannot be left enabled.

    POST-HOC relative to study 2, which already demonstrated the stall. Pin.'
  measure:
    kind: derived
    detail: fraction of timesteps below the gate's per-origin DnaG demand.
  pass_if:
    op: '>'
    value: 0.25
    provenance:
      kind: post_hoc
      note: Follows from study 2's stall; pin only.
  status: pending
preregistered:
  declared_before_runs: true
  registered_at: '2026-09-03T16:40:49Z'
  criteria:
  - test: simulation-reproduces-parca-target
    prior: Genuinely open at design time. The fitted target had not been measured on this branch; only the simulated counts had.
  - test: transcription-is-not-the-lossy-step
    prior: 'Stated so the investigation''s own dedup hypothesis is falsifiable: that hypothesis predicts this test fails.'
  - test: operon-partners-diverge
    prior: If the three cistrons on one transcript track together, the per-cistron explanation is wrong.
  predictions:
  - Reconnaissance during scoping had already measured the simulated counts (median 0, mean 1.76, 61.6% of timesteps at zero) and the chain percentiles. Those observations are recorded as regression_pin axes, NOT as acceptance criteria, because a threshold set after seeing a number cannot confirm it.
  controls:
  - operon-partners-diverge
readouts:
- name: dnag-monomer-counts
  store_path: bulk.count
  description: Per-timestep EG10239-MONOMER[c] counts over a healthy 12-generation lineage, reused from replisome-gate-sufficiency's distilled bundles (permissive arm, 3 seeds, 114k timesteps).
  units: molecule copies per cell
  status: available
- name: production-chain-percentiles
  store_path: derived
  description: dnaG's basal synthesis probability, translation efficiency and degradation rate, each ranked against every other gene in the ParCa cache.
  units: percentile
  status: derived-needed
- name: proteomics-comparison
  store_path: derived
  description: Per-dataset DnaG counts (Schmidt 2016, Soufi/Maeck 2015, Mori 2021, Li 2014) and their median, via scripts/proteome_compare.py.
  units: molecule copies per cell
  status: derived-needed
robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: The simulated arm reuses 3 permissive seeds (114k timesteps) from replisome-gate-sufficiency rather than re-running an identical lineage. The chain and proteomics measurements are deterministic reads of the ParCa fixture and the datasets, so seeds do not apply to them.
controls:
- name: operon-partners-diverge
  kind: positive
  hypothesis: rpsU, rpoD and dnaG share one transcript. If their protein levels diverge, the loss is per-cistron; if they track together, it is shared and the per-cistron explanation is refuted.
  expected: A spread greater than 2x in model-to-literature ratio.
  observed: ''
  result: PENDING
alternative_hypotheses:
- claim: dnaG is starved of transcription because the dedup collapsed the rpsU promoters into a single transcription unit.
  discriminated_by: transcription-is-not-the-lossy-step. If TU00352 sits above the median transcript, transcription is not the lossy step and this is refuted.
  status: untested
- claim: DnaG is degraded unusually fast.
  discriminated_by: The degradation percentile in the chain measurement.
  status: untested
- claim: The model is simply calibrated below experiment, and the simulation faithfully reproduces that low target.
  discriminated_by: simulation-reproduces-parca-target, which compares the simulation against ParCa's own fit rather than against literature.
  status: untested
falsifiability: The diagnosis is overturned if TU00352 turns out to sit below the median transcript (transcription is the lossy step after all), if the three operon partners track together (the loss is shared, not per-cistron), or if the simulation does reproduce ParCa's fitted count (there is no execution gap and the deficit is calibration alone).
limitations:
- Single condition and medium. Translation efficiency is condition-dependent and nothing here speaks to other growth conditions.
- The simulated arm reuses 3 seeds from a prior study rather than a fresh lineage; it is the same cache and composite, but it is reuse, not replication.
- Identifying translation efficiency as the anomalous step does NOT establish that the Li 2014 value is wrong. It localises the deficit; whether the input or its application is at fault is a separate question.
- Whether the mechanistic replisome option ships disabled BECAUSE of this deficit is an inference about intent. This repo documents no rationale, so the study can show the option is unusable at these counts but cannot show that is why it was turned off.
- proteome_compare.py lives in the sibling checkout and is invoked by path; it is not vendored here.
conclusion_logic:
  if_primary_tests_pass: The loss is downstream of transcription and per-cistron, and the simulation is not reproducing its own fitted target, so the repair is aimed at translation efficiency and at the execution gap rather than at the transcription-unit architecture.
  if_primary_tests_fail:
    summary: If transcription IS the lossy step, the dedup hypothesis stands and the repair belongs in the transcription-unit architecture. If the operon partners track together, the loss is shared and neither explanation holds.
    diagnose:
    - question: Which step of the production chain carries the loss?
      note: Answered by the chain percentiles in this study's own measurement.
discovery_implications:
  resolved_uncertainties:
  - 'Where DnaG is lost: translation, not transcription (91.9th vs 1.5th percentile), confirmed independently by a 3.55x divergence among cistrons sharing one transcript.'
  - 'Whether the dedup explains the deficit: it does not. Refuted.'
  - 'Whether the deficit is calibration or execution: primarily execution. ParCa fits 0.64x of literature; the simulation delivers 0.046x of ParCa.'
  remaining_uncertainties:
  - Whether dnaG's low translation efficiency is inherited from the Li 2014 input or introduced by how ParCa applies it.
  - What loses the remaining ~20x between ParCa's fit and the simulated counts.
  - Whether HolA and HolB, in the same translation tail, share the same cause -- i.e. whether this is a class property of low-abundance proteins.
  - Whether the mechanistic replisome option ships disabled because of this deficit; not answerable from this repository.
  followup_study_proposals:
  - id: FU-01
    title: Is the low translation efficiency inherited or introduced?
    motivation: |
      dnaG's translation efficiency is 1.5th percentile, and efficiency is a ParCa
      input fitted from Li 2014 ribosome profiling. If the low value is inherited
      from the data the fix is upstream; if ParCa introduces it, the fix is in the
      fitting. This decides where the repair belongs and is the direct successor to
      this study.
  - id: FU-02
    title: What loses the 22x between ParCa's fit and the simulation?
    motivation: |
      Even a perfect ParCa fit would leave the simulation ~20x short, so a term
      downstream of the fit is losing most of the protein. Locating it would explain
      the deficit fully rather than partially, and it is the larger of the two gaps.
  - id: FU-03
    title: Do HolA and HolB share DnaG's translation anomaly?
    motivation: |
      HolA (1.9th percentile) and HolB (5.7th) sit in the same tail. If the anomaly
      is shared, this is a class property of low-abundance proteins rather than a
      DnaG accident, which would widen the consequence well beyond replication.
