title: "Daughter machine (viva-munk) \u2014 device run + phenotype distributions"
description: "Run the canonical viva-munk DAUGHTER MACHINE \u2014 a single cell in\
  \ a chamber\nwith an absorbing right wall, so the lineage grows leftward as daughters\
  \ are\npushed out \u2014 populated by viva-munk's simple grow/divide agents. The\n\
  simulation runs now and produces (a) an animated GIF of the device running and\n\
  (b) distribution figures for the core single-cell phenotypes: size at\ndivision,\
  \ time between birth and division, and added size before division (the\nadder plot).\n\
  \nSimulations run now; biological conclusions are HELD for experimental data (a\n\
  planned comparison study, colonies-09). This study establishes the measurement\n\
  + visualization pipeline against cheap agents.\n"
