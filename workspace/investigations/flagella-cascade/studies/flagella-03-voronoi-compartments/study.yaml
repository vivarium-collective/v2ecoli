schema_version: 4
name: flagella-03-voronoi-compartments
title: "Voronoi Compartments — Flagellar Protein Localization"
question: >-
  Where does flagellar-assembly protein mass sit across the cell's compartments
  (cytosol [c], inner membrane [i], projection/periplasm-facing [j], outer
  membrane [o], membrane [m], periplasm [p], extracellular [e]), and how much
  of each compartment's total biomass do the tracked flagellar proteins account
  for?
description: |
  Voronoi-treemap visualization of all tracked flagellar-assembly proteins,
  sectioned by their EcoCyc compartment label and overlaid on each
  compartment's total mass (from the v2ecoli mass listener). Ported from
  vivarium-collective/vEcoli-spatial-voronoi
  (ecoli/analysis/single/flagella_compartment_voronoi.py), which implements
  the Nocaj & Brandes (2012) Voronoi-treemap algorithm
  (wholecell/utils/voronoi_plot_main.py, ported verbatim to
  v2ecoli/library/voronoi_treemap.py). Each top-level region is one compartment,
  sized by that compartment's total biomass; each sub-polygon inside it is one
  flagellar protein, sized by its own mass, with the remainder of the
  compartment (everything else living there) shown as a same-colored
  "compartment" filler region.
topic: regulation
tags: [flagella, spatial, voronoi, compartments, aim1, ported-from-vecoli-spatial-voronoi]
created: '2026-07-28'

# Uses the same baseline composite + cache as the transcription-regulation
# study, but is otherwise an independent spatial/visualization angle — no
# dependency on it.
pipeline_gate:
  prerequisites:
  - flagella-01-overexpression-baseline
  enables: []

status: in_progress
phase: Evaluate

design_status: complete
implementation_status: complete    # voronoi_treemap.py ported verbatim; driver script new
simulation_status: ran
evaluation_status: partial
gate_status: pending
expert_review_status: not_requested

runs:
- name: flagella-03-voronoi__seed0__1200s
  kind: analysis
  canonical: true
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  description: >-
    baseline composite, features=[flagella_regulation], seed 0, out/cache_full,
    1200 s, snapshots at t=0s, t=600s, and t=1200s.
  status: completed
  result: PASS

findings:
- id: flagella-03-monomer-ids-confirmed
  kind: computational
  status: confirms
  statement: >-
    All 28 flagellar-assembly monomer EcoCyc IDs used by the original
    vEcoli-spatial-voronoi analysis exist unchanged in v2ecoli's ParCa-derived
    monomer_data, and all 8 compartment mass-listener fields it reads
    (extracellular_mass, periplasm_mass, cytosol_mass, outer_membrane_mass,
    projection_mass, membrane_mass, inner_membrane_mass, flagellum_mass) are
    already computed identically in v2ecoli/steps/derivers/mass_deriver.py —
    a faithful, unmodified port from vEcoli.
  evidence:
    observed: "28/28 monomer IDs found in out/cache_full's monomer_data; all 8 listener fields present"
    expected: "vEcoli-spatial-voronoi's protein/compartment set should carry over unchanged since v2ecoli tracks the same EcoCyc bulk molecules"
- id: flagella-03-cytosol-dominates
  kind: computational
  status: confirms
  statement: >-
    At both snapshots the cytosol compartment's total mass vastly dominates the
    other compartments (>98% of all compartment mass shown), consistent with
    the cytosol being the general-purpose bulk-protein compartment rather than
    flagella-specific — the tracked flagellar proteins are a tiny fraction of
    each compartment's total mass everywhere except the flagellum compartment
    itself (which has none of the small-molecule monomers tracked here, since
    the assembled CPLX0-7452 complex lives in `unique`, not `bulk`).
  evidence:
    observed: "t=600s: cytosol=1405.07 fg vs next-largest inner_membrane=14.57 fg; periplasm=20.32 fg, outer_membrane=17.71 fg, extracellular=1.99 fg, projection=1.40 fg, membrane=8.99 fg"
    expected: "cytosol >> other compartments, since it is the default location for untargeted bulk molecules"

visualizations:
- address: image:charts/01_flagella_protein_compartments.svg
  chart: charts/01_flagella_protein_compartments.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/studies/flagella-03-voronoi-compartments/run_flagella_voronoi.py --seconds 1200 --snapshot-at 600 --cache-dir out/cache_full
  description: |
    THREE Voronoi-treemap panels: t=0s (initial state, before any simulated
    expression), t=600s, and t=1200s. Each top-level region is one compartment
    (extracellular orange, periplasm purple, cytosol green, outer_membrane
    brown, projection pink, membrane red, inner_membrane light blue), sized by
    that compartment's TOTAL mass from the v2ecoli mass listener. Inside each
    compartment region, sub-polygons show the individual tracked
    flagellar-assembly proteins present there (e.g. FliC/FlgK/FlgL/FliD in
    extracellular; FLGB/FLGC/FLGF/FLGH/FLGI/FliQ/FliO/FliL in projection;
    FLIF/FLIG/FLIM/FlhA/FlhB/FliR/FliP/MotA/MotB in inner_membrane), each sized
    by its own protein mass, with the remainder of that compartment's mass
    (everything else living there, not flagella-specific) shown as a
    same-colored filler region so the compartment's true relative size is
    preserved. Label font is small (font_size=3) on purpose — the polygons are
    small enough that a larger font overlaps and becomes illegible; zoom in on
    the rendered SVG to read individual protein labels. The `flagellum`
    compartment (the assembled CPLX0-7452 complex) is not decomposed into
    individual sub-proteins here, since it lives in `unique` state, not `bulk`
    — it would need its own subunit-mass accounting to show sub-polygons; see
    the flagellum_mass total in the underlying data.

baseline:
- name: wcm-flagella-regulation
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    seed: 0
    cache_dir: out/cache_full
    features: ['flagella_regulation']

purpose:
  question: |
    Does a Voronoi-treemap visualization correctly section all tracked
    flagellar-assembly proteins by their EcoCyc compartment label, with each
    compartment's region sized by its true total mass (not just the
    flagella-protein subset), so the relative scale of flagellar investment
    per compartment is visually honest rather than exaggerated?
  mechanism: |
    Per protein: mass_fg = (bulk_count * monomer_molecular_weight) / n_avogadro,
    read from the live composite's bulk store and sim_data.process.translation
    .monomer_data. Per compartment: total_fg from the mass listener
    (listeners.mass.<compartment>_mass, v2ecoli/steps/derivers/mass_deriver.py).
    The Voronoi-treemap algorithm (Nocaj & Brandes 2012) partitions a canvas
    into polygons whose AREA is proportional to each site's assigned value,
    iteratively adjusting site positions/weights until area error < 15%.
  expected_outcome: |
    Compartment region sizes reflect true relative total mass (cytosol should
    dominate); flagellar-protein sub-polygons should be a small fraction of
    their compartment except possibly within compartments that are themselves
    flagella-specific.

behavior_tests:
  - id: monomer-ids-resolve
    statement: |
      All 28 flagellar monomer EcoCyc IDs resolve to valid bulk indices against
      out/cache_full with no KeyError/missing-field error.
    status: passing      # verified: 28/28 found
  - id: compartment-listeners-present
    statement: |
      All 8 compartment mass-listener fields this analysis reads are present
      and nonzero on the live composite state.
    status: passing      # verified: all 8 nonzero at both snapshots
  - id: voronoi-layout-converges
    statement: |
      The Voronoi-treemap layout converges (area error < 15%) within a small
      number of retries for both snapshot dictionaries.
    status: passing
    caveat: |
      The underlying algorithm's site-placement is stochastic and occasionally
      fails to converge on a given draw (raises AttributeError deep in
      _compute_boundaries when a polygon comes back None) — the driver script
      wraps the plot call in a retry loop (5 attempts) to absorb this; it has
      not needed more than 1 retry in testing so far.

success_criteria:
  model:
    - The plot renders without error for a real simulated cell state, sectioned
      correctly by compartment label with correct relative region sizes
      (verified).
  biology:
    - FUTURE — quantify what FRACTION of each compartment's mass the tracked
      flagellar proteins actually represent over the cell cycle, and whether
      that fraction changes as the SUM-gate cascade progresses (Class II -> III).
    - FUTURE — extend to the assembled flagellum complex itself (currently
      shown only as an undecomposed compartment total, since it's a `unique`
      store entity, not individual bulk monomers).

notes: |
  Ported from vivarium-collective/vEcoli-spatial-voronoi
  (ecoli/analysis/single/flagella_compartment_voronoi.py +
  ecoli/analysis/single/voronoi_plot_function_copy.py, the latter copied
  essentially verbatim to v2ecoli/library/voronoi_treemap.py — it is a
  self-contained numpy/scipy/matplotlib geometry library with no vEcoli-specific
  dependencies). The source repo also has fimbriae- and altered-compartment
  variants of this analysis (fimbriae_compartment_voronoi.py,
  altered_compartments_flagella_voronoi.py) not ported here — candidate
  follow-ups if useful.
