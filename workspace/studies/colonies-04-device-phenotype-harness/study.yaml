    from: parca
  - artifact: colonies-03-wcm-rss-leak
    from: colonies-03-wcm-rss-leak
conditions:
  baseline:
    name: free-colony-simple
    composite: v2ecoli.composites.ecoli_colony.ecoli_colony
    params:
      seed: 0
      n_cells: 2
      env_size: 30
    note: "The free-colony geometry populated with simple viva-munk grow_divide\nagents. This study also exercises the mother-machine and daughter-machine\ngeometries via v2ecoli.colony_bench (geometry builders that place any\ncell-model tier — simple / surrogate / wcm — into a device); those are not\nregistered composite generators, but the phenotype panel (growth rate,\nsize-at-division, added length, inter-division time) is extracted uniformly\nacross all three geometries.\n"
  model_settings: []
