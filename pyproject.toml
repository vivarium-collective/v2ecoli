[build-system]
requires = ["setuptools>=68", "cython", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "v2ecoli"
version = "0.1.0"
description = "Whole-cell E. coli model on process-bigraph (partitioned architecture)"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.38",
    "viva-superpowers",
    # Shared source of truth for workspace-layout logic (WorkspacePaths,
    # find_workspace_root, study_dir, package_slug). Replaces v2ecoli's own
    # divergent study-dir resolvers + root-walkers. Git source pinned below.
    "viva-workspace",
    "pbg-copasi",
    "pbg-parsimony",
    "pbg-bioreactordesign",
    "pbg-ketchup",
    # Transitive dep of viva-superpowers (the Actionable Investigation Graph
    # types); declared directly so [tool.uv.sources] below resolves its git
    # source (uv applies sources to direct deps, not arbitrary transitive ones).
    "investigation-contracts",
    "vEcoli[dev]>=1.1.0",
    "viva-munk>=0.0.1",
    # viva-munk's __init__.py imports from spatio_flux.processes.particles
    # AND spatio_flux.visualizations at module-import time. We pin via
    # [tool.uv.sources] below to the git main, which carries the
    # visualizations submodule (the PyPI release surface drifts).
    "spatio-flux",
    "plum-dispatch>=2.5",
    "dill>=0.3",
    "numpy",
    # Ceiling: SciPy 1.18 refactored ``scipy.interpolate`` to delegate through a
    # new ``_delegate_to`` attribute, which breaks unpickling the ``CubicSpline``
    # objects embedded in the shipped ParCa blob (``models/parca/parca_state.pkl.gz``);
    # pickled interpolators are not portable across that boundary. Cap at <1.18
    # until the blob migrates off pickle (bigraph-schema ``.pbg``; see
    # ``v2ecoli/processes/parca/data_loader.py`` + ``models/parca/README.md``).
    # Floor: 1.14 predates BOTH breaking changes this repo already carries
    # compat shims for — the array-API ``PPoly``/``CubicSpline`` refactor at
    # 1.15 (``_scipy_compat.py``) and the vendored
    # ``scipy._lib.array_api_compat`` removal at 1.16 (``data_loader.py``).
    # Below 1.14 is untested here and unpinned before this change (see
    # PARCA_REVIEW A9); locked/installed is 1.17.1, comfortably inside
    # [1.14, 1.18).
    "scipy>=1.14,<1.18",
    "pymunk",
    # ParCa (v2ecoli/processes/parca/) runtime dependencies
    "cvxpy",
    "biopython",
    "sympy",
    "pandas",
    "plotly>=5.0",
    "ecoli-sources",
    "numba>=0.59",  # floor: numba<0.59 pins llvmlite<0.42 which has no Python 3.12 wheel
    "unum",
    "requests",
    # Emitters are now BASE/default deps (no longer optional extras): v2ecoli
    # always imports & registers BOTH the Parquet and XArray emitters so they
    # appear in the vivarium-workbench emitters list. Parquet remains the
    # default (workspace.yaml runtime.default_emitter = parquet); XArray is
    # merely available. [parquet] pulls in duckdb/polars/pyarrow/fsspec/tqdm;
    # [xarray] pulls in xarray/zarr/zarrs. The implementations live in
    # viva-emitters (the renamed pbg-emitters); v2ecoli.library.{parquet,xarray}_emitter
    # are shims. viva-emitters ships on PyPI (0.2.3+), so a plain PEP 508 dep — no
    # git source, no `pbg-emitters` name-check trap (the renamed repo builds as
    # viva-emitters). [parquet] pulls duckdb/polars/pyarrow/fsspec/tqdm; [xarray]
    # pulls xarray/zarr/zarrs.
    "viva-emitters[parquet,xarray]>=0.2.3",
    # S3 backend for fsspec (a viva-emitters[parquet] dep). Both ParquetEmitter
    # (url_to_fs) and the XArray/zarr store (zarr.open_group) already accept an
    # s3:// out_uri/store natively — s3fs is the one missing piece that lets an
    # s3:// URI actually resolve instead of failing with "unknown protocol"
    # (backlog item 33/35: per-generation chain-dispatch jobs write directly to
    # a per-seed S3 prefix rather than relying solely on the container
    # entrypoint's end-of-job `aws s3 sync`).
    "s3fs>=2024.1",
    # NeuralProcess surrogate of the baseline (investigations/surrogate-modeling).
    # Pulls torch; surfaced in the dashboard Registry via build_core() + the
    # dashboard.registry.include allow-list in workspace.yaml.
    "pbg-torch @ git+https://github.com/vivarium-collective/pbg-torch.git@main",
]

[project.optional-dependencies]
# Test-only deps. `uv sync --extra dev` pulls these in.
dev = ["pytest-timeout>=2.3", "pytest-xdist>=3.6"]
# The Parquet and XArray emitter deps moved into base [project.dependencies]
# above (they are now default/always-installed). These groups are kept as
# empty back-compat aliases so `pip install v2ecoli[parquet]` /
# `v2ecoli[xarray]` still resolve.
parquet = []
xarray = []
emitters = ["v2ecoli[parquet,xarray]"]
# Parallel multiseed runs: one Ray worker process per seed (see
# v2ecoli.library.parallel_seeds + workspace.yaml runtime.parallel: ray).
ray = ["ray>=2.10"]
# All-atom solvated relaxation of AlphaFold structures before 3D packing
# (structural-ecoli). openmm is heavy, so this is opt-in:
#   uv sync --extra relax
# Without it, relaxed structural runs degrade gracefully to raw AlphaFold structures.
relax = ["pbg-openmm"]

[project.scripts]
v2ecoli-parca = "v2ecoli.cli.parca:main"
v2ecoli-colony = "v2ecoli.cli.colony:main"
v2ecoli-workflow = "v2ecoli.workflow.run:main"
v2ecoli-workflow-run = "v2ecoli.workflow.build:main"
v2ecoli-analyze = "v2ecoli.workflow.analysis_runner:main"
v2e-compare = "scripts.compare_cli:main"

[tool.setuptools.package-data]
# Ship the v2ecoli override files; bulk KB data is provided by the ecoli-sources bundle.
"v2ecoli.processes.parca.reconstruction.ecoli" = ["flat_overrides/*", "parca_overrides.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests", "v2ecoli/tests"]
markers = [
    "fast: runs without simulation cache (type tests, unit tests)",
    "slow: runs full simulations (60s+)",
    "behavior: model-behavior tests resumed from a saved checkpoint (seconds, not minutes)",
    "sim: calls composite.run() — longer than pure-state tests. CI routes these to a parallel behavior-tests job.",
    "wcm: heavy full-WCM colony runs; excluded from CI",
]
# Per-test wall-clock cap. Safety net for any future hang in sim code.
# ``thread`` method interrupts C-level hangs (LSODA); note it calls
# os._exit(1) on timeout, so it kills the whole pytest run — tests
# should complete well under the cap.
timeout = 120
timeout_method = "thread"

# Only the real Python packages ship in the v2ecoli distribution. Without an
# explicit ``include`` the flat-layout finder also picks up sibling research
# dirs (workspace/, studies/, reports/, …) as top-level packages; the
# bigraph-schema process-discovery resolver then maps the ``v2ecoli`` dist to
# whichever bogus top-level name sorts last (e.g. ``workspace``), so it scans
# the wrong package and registers zero of v2ecoli's Visualization Steps.
[tool.ruff]
# Lint gate is scoped to PROJECT-OWN code only. The ported wcEcoli/vEcoli model
# math — v2ecoli/processes/, the ported modules under v2ecoli/library/ and
# v2ecoli/steps/ — is upstream science we mirror, not ours to relint, so it is
# excluded here (belt-and-suspenders; CI also passes the project-own dirs
# explicitly: v2ecoli/composites v2ecoli/workflow pbg_v2ecoli reports scripts).
extend-exclude = [
    "v2ecoli/processes",
    "v2ecoli/library",
    "v2ecoli/steps",
]

[tool.ruff.lint]
# F = pyflakes (undefined names, broken/unused imports, unused vars, bad
# f-strings); E722 = bare `except:`. Deliberately narrow — this is a
# breakage gate, not a style gate.
select = ["F", "E722"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["v2ecoli*", "pbg_v2ecoli*"] } }


[tool.uv.sources]
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
bigraph-schema = { git = "https://github.com/vivarium-collective/bigraph-schema.git", branch = "main" }
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
viva-workspace = { git = "https://github.com/vivarium-collective/viva-workspace.git", branch = "main" }
# Transitive consumers (pbg-bioreactordesign, viva-munk, spatio-flux) still
# require the "pbg-superpowers" name; resolve it to the deprecation shim that
# lives in the viva-superpowers repo's shim/ subdir (re-exports viva_superpowers).
pbg-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main", subdirectory = "shim" }
pbg-copasi = { git = "https://github.com/vivarium-collective/pbg-copasi.git", branch = "main" }
pbg-parsimony = { git = "https://github.com/vivarium-collective/pbg-parsimony.git", branch = "main" }
pbg-openmm = { git = "https://github.com/vivarium-collective/pbg-openmm.git", branch = "main" }
pbg-bioreactordesign = { git = "https://github.com/vivarium-collective/pbg-bioreactordesign.git", branch = "main" }
pbg-ketchup = { git = "https://github.com/vivarium-collective/pbg-ketchup.git", branch = "main" }
pbg-torch = { git = "https://github.com/vivarium-collective/pbg-torch.git", branch = "main" }
investigation-contracts = { git = "https://github.com/vivarium-collective/investigation-contracts.git", branch = "main" }
viva-munk = { git = "https://github.com/vivarium-collective/Viva-munk.git", branch = "main" }
spatio-flux = { git = "https://github.com/vivarium-collective/spatio-flux.git", branch = "main" }
ecoli-sources = { git = "https://github.com/vivarium-collective/ecoli-sources.git", rev = "2dfabd522003cfe62f1bc7eeee615a2041aff3ad" }
