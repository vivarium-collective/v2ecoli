inputs_in_place:
  - 307 high-affinity DnaA box catalog computed at ParCa-build (Schaper-Messer
    consensus on the K-12 genome). Includes the 3 oriC high-aff (R1 −55, R2 +50,
    R4 +124) and the 2 high-aff dnaA-promoter sites (box1 −41917, box2 −42883).
  - Static dnaA autorepression via fold_changes_nca.tsv (dnaA→dnaA = −2.31 log2 FC).
    The 5 weaker dnaA-promoter boxes are intentionally NOT modeled (autorepression
    already covers self-regulation — do not double-count).
  - bf8b82e DnaA-ATP intrinsic hydrolysis (k ≈ 0.046/min) active in the equilibrium.

inputs_to_supply:
  - id: oric-low-affinity-coordinates
    title: 8 low-affinity oriC box coordinates (R5M, τ2, I1, I2, C3, C2, I3, C1)
    status: provisional
    method: |
      Extract precise positions from oric_sequence.pdf using R1 (−55), R2 (+50),
      R4 (+124) as signed-coordinate anchors. Order along oriC (from the sequence
      map): R1 · R5M · τ2 · I1 · I2 · R2 · C3 · C2 · I3 · C1 · R4 — so 4 low-aff
      boxes (R5M, τ2, I1, I2) lie between R1 and R2, and 4 (C3, C2, I3, C1)
      between R2 and R4.
    provisional_coords_signed:
      # PROVISIONAL — interpolated from the rendered oric_sequence figure using the
      # R1/R2/R4 anchors (signed ≈ figure_pos − 255). MUST be confirmed by exact
      # sequence matching against oriC 3925744–3925989 at ParCa build before use.
      R5M: -10
      "τ2": 3
      I1: 15
      I2: 30
      C3: 67
      C2: 85
      I3: 97
      C1: 110
    note: |
      Treat the coordinates above as approximate ordering aids, NOT final. The REQ
      below (extract-low-aff-coords) closes this by pulling exact positions from the
      raw oriC sequence.

# ── Conditions: reuse the dnaa-2 V=1e-3 succinate baseline ─────────────────────
conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    inherited_from: dnaa-2-nucleotide-balance
    params:
      seed: 1                       # spec validation uses seed=1 (dnaa-2 canonical reproduction)
      cache_dir: out/cache_dnaa2    # full-ParCa succinate fit + genetic_perturbations TU00259[c]=1e-3
      single_daughters: true
      max_generations: 8
      resume_dill: out/steady_state_inputs/succinate_default_gen3_start.dill
  variants:
    - name: box-binding-reference
      description: |
        315-box 4-pool DnaA binding at the spec K_d's (chromosomal-high 302 @1nM,
        oriC-high 3 @1nM, oriC-low 8 @100nM ATP-only, promoter-high 2 @1nM) on the
        dnaa-2 V=1e-3 succinate burned-in baseline. The single reference config for
        this first step; cooperativity + low-aff Kd sweeps are deferred.
      params:
        kd_high_nM: 1
        kd_low_nM: 100
        seed: 1
  model_settings:
    - name: dnaa-box-binding
      detail: "315 boxes, 4 pools (302 chromosomal_high + 3 oriC_high + 8 oriC_low + 2 promoter_high), fast equilibrium by K_d"
    - name: nucleotide-form-tracking
      detail: "High-aff pools track free/bound-ATP/bound-ADP; low-aff pool tracks free/bound-ATP"
    - name: dnaa-nucleotide-feature
      detail: "MUST stay disabled — the dormant dnaa_nucleotide opt-in conflicts with bf8b82e"

runtime:
  subprocess_timeout_s: 7200
  max_generations: 8
  single_daughters: true

readouts:
  - name: DnaA-ATP fraction
    status: primary
    identifier: bulk MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
    notes: Carried over from dnaa-2; must stay in Boesen [0.2,0.5] (gen-3 ~0.2-0.5).
  - name: oriC count
    status: primary
    identifier: listeners.replication_data.number_of_oric
    notes: Cell-cycle integrity — 1↔2, unchanged from dnaa-2.
  - name: DnaA bound (high-aff, ATP)
    status: measured
    identifier: sum(chromosomal_high.bound_ATP + oriC_high.bound_ATP + promoter_high.bound_ATP)
  - name: DnaA bound (high-aff, ADP)
    status: measured
    identifier: sum(chromosomal_high.bound_ADP + oriC_high.bound_ADP + promoter_high.bound_ADP)
  - name: DnaA bound (low-aff, ATP)
    status: measured
    identifier: oric_low.bound_ATP
  - name: total DnaA boxes available
    status: measured
    identifier: sum over 4 pools (free + bound)
    notes: 315 at birth → 630 at replication termination → 315 per daughter (raw count).

# ── Validation (spec table): dnaa-3 must preserve dnaa-2 behaviour ─────────────
tests:
  - name: cycles-divided-8-of-8
    classification: primary
    description: All 8 generations divide (cell cycle preserved vs dnaa-2 baseline).
    measure: {kind: count_over_lineage, field: divisions}
    pass_if: {op: '==', value: 8}
    baseline_value: 8
  - name: oric-pattern-1-or-2
    classification: primary
    description: oriC oscillates 1↔2 (unchanged from dnaa-2).
    measure: {kind: snapshot_window, field: number_of_oric}
    pass_if: {op: in_set, values: [1, 2]}
    baseline_value: "1↔2"
  - name: re-init-events-zero
    classification: primary
    description: No re-initiation events (unchanged from dnaa-2).
    measure: {kind: count_over_lineage, field: reinit_events}
    pass_if: {op: '==', value: 0}
    baseline_value: 0
  - name: dnaa-atp-fraction-in-band-gen3
    classification: primary
    description: DnaA-ATP fraction at gen 3 in the Boesen [0.2,0.5] band.
    measure: {kind: snapshot_window, field: dnaA_ATP_over_total_ratio, generation: 3}
    pass_if: {op: range, low: 0.2, high: 0.5}
    baseline_value: "~0.26 (dnaa-2)"

# ── Visualizations — the chromosome box-map is REAL (WCM genome data); the 4 ──
#    trajectory panels below are PLANNED (built once the mechanism runs).
visualizations:
  - name: chromosome_replication_animation
    address: image:charts/chromosome_replication.gif
    config:
      title: >-
        ANIMATED full succinate cell cycle (seed 1, ~71 min, 123 frames) — the live
        chromosome context dnaa-3's DnaA boxes sit on. Three phases, labelled per
        frame: (1) pre-initiation — single chromosome, RNAPs on the rim; (2)
        replication bubble EXTENDING — green bubble grows from oriC as the two
        replisomes (gold triangles) travel toward Ter, with RNAPs on both the mother
        rim AND the bubble arcs; (3) the chromosome DIVIDES INTO TWO complete
        chromosomes at replication completion. oriC green, Ter red, RNAPs blue.
        Rendered from per-timestep unique-molecule coordinates persisted to parquet
        (V2ECOLI_EMIT_UNIQUE) via the existing _draw_replication_bubbles renderer.
  - name: chromosome_dnaa_boxes
    address: image:charts/chromosome_dnaa_boxes.png
    config:
      title: >-
        E. coli K-12 chromosome — all 307 consensus DnaA boxes (TTWTNCACA,
        Schaper-Messer 1995), extracted from the v2ecoli whole-cell-model genome
        exactly as Replication._build_motifs() computes them. oriC, datA, DARS1,
        DARS2 marked. These 307 are the dnaa-3 chromosomal-high pool substrate;
        the 8 oriC low-affinity + 2 promoter-high sites are added on top.
  - name: dnaa2_baseline_starting_point
    address: image:charts/dnaa2_baseline_starting_point.png
    config:
      title: >-
        BASELINE (where dnaa-3 starts) — the dnaa-2 succinate run that dnaa-3 builds
        box-binding on top of. Figure shown = the current on-disk seed-0 6-gen run
        (divides 6/6, oriC clean 1↔2, DnaA-ATP cycle-mean 0.283 in [0.2,0.5], total
        DnaA in [300,800], [ATP]:[ADP]≈20). NOTE (Rashmi 2026-06-04): the CANONICAL
        baseline is moving to SEED 1 × 8 GENERATIONS (her clean reproduction) — dnaa-3
        validates against that. dnaa-3 must PRESERVE all four behaviours: periodic
        mass doubling, oriC 1→2 one-init-per-gen, DnaA counts in band, DnaA-ATP in band.
        x-axis in minutes (cumulative), generation boundaries dotted (Rashmi conv).

# ── Visualizations (4, from spec) — PLANNED (built in build-step listener-and-viz) ──
# Kept as planned_visualizations (not `visualizations:`) so the dashboard does not
# try to render unregistered classes — these are specs for viz to be authored.
planned_visualizations:
  - name: dnaa-atp-partition-across-cell
    units: concentration (count / cell_mass)
    traces:
      - DnaA-ATP bound to high-affinity boxes (chromosomal_high + oriC_high + promoter_high bound-ATP)
      - DnaA-ATP bound to low-affinity boxes (oriC_low bound)
      - DnaA-ATP free in cytoplasm (free bulk pool)
    invariant: traces sum to total DnaA-ATP concentration at every tick.
  - name: dnaa-adp-partition-across-cell
    units: concentration (count / cell_mass)
    traces:
      - DnaA-ADP bound to high-affinity boxes (chromosomal_high + oriC_high + promoter_high bound-ADP)
      - DnaA-ADP free in cytoplasm (free bulk pool)
    invariant: traces sum to total DnaA-ADP concentration (no low-aff trace — low-aff is ATP-only).
  - name: total-dnaa-boxes-over-time
    units: raw count
    traces: [total boxes = free + bound across all 4 pools]
    note: 315 at birth → 630 at replication termination → 315 per daughter; raw count so the doubling is visible.
  - name: total-dnaa-bound-concentration
    units: concentration (count / cell_mass)
    traces: [sum of all bound (high-aff ATP+ADP across 3 pools + low-aff ATP) / cell_mass]
    note: dominated by the chromosomal_high sink across the cycle.

# ── Build plan (codebase map, 2026-06-03) ─────────────────────────────────────
# What ALREADY exists in v2ecoli (reuse, don't rebuild):
#   - Equilibrium process + per-reaction integrate_dt two-phase solve:
#       v2ecoli/processes/equilibrium.py + parca/.../dataclasses/process/equilibrium.py
#     Reactions in flat/equilibrium_reactions.tsv; rates+integrate_dt in
#     flat/equilibrium_reaction_rates.tsv (DnaA rows: MONOMER0-160_RXN false,
#     MONOMER0-4565_RXN true, DNAA-INTRINSIC-HYDROLYSIS-RXN true).
#   - Consensus DnaA-box catalog: sequence_motifs.tsv "DnaA_box" (TTWTNCACA, 8
#     variants) → Replication._build_motifs() computes motif_coordinates["DnaA_box"]
#     by scanning flat/sequence.fasta; boxes instantiated as unique molecules
#     (schema DNAA_BOX_ARRAY: coordinates|domain_index|DnaA_bound) in
#     initial_conditions.py. All boxes currently ONE tier, DnaA_bound=false at birth.
#   - Genome sequence flat/sequence.fasta (len 4,641,652); oriC flat/dna_sites.tsv
#     G0-10506 = 3925744-3925975 (verified: oriC seq programmatically extractable;
#     R1 TTATCCACA / R2 TTATACACA anchors locate; signed-coord frame runs OPPOSITE
#     to genome direction — R1(-55) sits at a HIGHER genome coord than R2(+50)).
#   - replication_data listener already emits total_DnaA_boxes + free_DnaA_boxes
#     (v2ecoli/steps/derivers/replication_data.py); no per-pool breakdown yet.
#
# What must be CREATED (the dnaa-3 mechanism):
build_plan:
  - step: partition-catalog-into-4-pools
    detail: |
      Split the single "DnaA_box" catalog into chromosomal_high (302), oriC_high
      (3: R1/R2/R4), oriC_low (8), promoter_high (2: box1/box2). High-aff = the
      302 chromosomal consensus matches minus the 5 broken-out sites; oriC_high +
      promoter_high are the 5 named consensus sites; oriC_low is the 8 supplied
      coordinates (extract-low-aff-coords). Carry a per-box affinity tier + pool tag.
    touches: [sequence_motifs.tsv or new dnaa_box_tiers.tsv, replication.py (_build_motifs), DNAA_BOX_ARRAY schema]
  - step: extract-low-aff-coords
    detail: |
      8 low-aff oriC boxes are NON-consensus → not in the consensus catalog; supply
      explicitly. Align literature box sequences to the oriC window of
      flat/sequence.fasta (which MATCHES oric_sequence.pdf), using R1/R2/R4 consensus
      hits to fix the frame. Order: R5M·τ2·I1·I2 (between R1 & R2) · C3·C2·I3·C1
      (between R2 & R4). Replaces inputs_to_supply.provisional_coords_signed.
  - step: add-box-binding-equilibria
    detail: |
      Add fast-equilibrium binding reactions (integrate_dt=false) to
      equilibrium_reactions.tsv + _rates.tsv: per pool, DnaA-ATP(+ADP for high-aff)
      + free-site ⇌ bound-site, K_d = 1 nM (high) / 100 nM (low). Convert K_d →
      forward/reverse rates (degenerate magnitudes; pick on-rate ~1e8 /M/s scale).
      Hydrolysis k=0.046/min applies to bound DnaA-ATP too (uniform).
    touches: [flat/equilibrium_reactions.tsv, flat/equilibrium_reaction_rates.tsv]
  - step: register-bound-pool-species-and-state
    detail: |
      High-aff pools need free/bound-ATP/bound-ADP counts; low-aff free/bound-ATP.
      Either as bulk species pools or as DnaA_bound→(bound-ATP|bound-ADP) state on
      the unique boxes. Box count must double across replication (315→630→315) — the
      existing chromosome_structure.py fork logic already duplicates boxes.
    touches: [internal_state.py / bulkMolecules.py, chromosome_structure.py]
  - step: listener-and-viz
    detail: |
      Emit per-pool free/bound-ATP/bound-ADP on replication_data; build the 4
      visualizations (ATP partition, ADP partition, total boxes raw count, total
      bound conc) with the sum-invariant checks.
    touches: [replication_data.py, v2ecoli/visualizations/]
  - step: validate
    detail: |
      Run V=1e-3 succinate 8-gen seed=1 burned-in (Rashmi's directed dnaa-2 reproduction, ~35 min). Check
      the 4 tests: 8/8 divisions, oriC 1↔2, 0 re-init, DnaA-ATP fraction gen-3 in
      [0.2,0.5]. The 302-site chromosomal_high sink must not over-titrate free DnaA.

# ── Implementation requirements ───────────────────────────────────────────────
implementation_requirements:
  - id: REQ-1
    title: Four-pool DnaA-box binding in the equilibrium process (315 sites)
    kind: model
    effort: L
    status: open
  - id: REQ-2
    title: Per-pool nucleotide-form state counts (high-aff free/ATP/ADP; low-aff free/ATP)
    kind: model
    effort: M
    status: open
  - id: extract-low-aff-coords
    title: Extract exact 8 low-affinity oriC box coordinates from the raw oriC sequence
    kind: tooling
    effort: S
    status: open
    detail: |
      Replace the provisional figure-interpolated coords (inputs_to_supply) with
      exact positions by matching the low-aff box motifs against oriC
      3925744–3925989, anchored on R1/R2/R4.
  - id: REQ-4
    title: Four box-occupancy visualizations + invariant checks (sums match totals)
    kind: tooling
    effort: M
    status: open

gotchas:
  - Promoter weak boxes (the 5 of boxes a–c / 3,4) are deliberately EXCLUDED —
    static autorepression (fold_changes_nca.tsv) handles dnaA self-regulation;
    modelling them here would double-count.
  - Cooperativity deliberately DEFERRED (R4-anchored right half; R1+IHF-anchored
    left half) to a later study.
  - Do NOT enable the dormant `dnaa_nucleotide` opt-in feature — it is an
    alternative partitioning implementation that conflicts with bf8b82e.

conclusion_logic:
  if_primary_tests_pass: |
    The DnaA-box binding sink (315 sites, 4 pools, fast equilibrium) leaves the
    dnaa-2 cell cycle intact (8/8 divisions, oriC 1↔2, 0 re-init) and the DnaA-ATP
    fraction in [0.2,0.5], while exposing bound/free + per-nucleotide partitioning.
    dnaa-3 passes → unblocks the downstream regulatory + mechanistic-initiation
    studies that act on bound DnaA.
  if_primary_tests_fail: |
    If adding the binding sink perturbs the cycle (divisions <6, oriC ≠ 1↔2,
