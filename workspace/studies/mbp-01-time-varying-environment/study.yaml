    metabolism within one tick. The env-store topology and molecule-ID-convention gaps were RESOLVED via a tick-leading 
    mirror Step writing to boundary.external. The study's own resolution note records all 5 plumbing/extreme tests 
    passing alongside the static-mode regression (32 passed / 15 skipped). Quantitative transport-kinetics fidelity is 
    explicitly DEFERRED to a downstream transport-kinetics-fidelity study (mbp-06 axis A).
