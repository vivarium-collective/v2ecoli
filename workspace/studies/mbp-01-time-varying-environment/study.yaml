tests:
- name: cell-mass-monotone-pre-division
  classification: primary
  description: Per-cell cell_mass must grow monotonically through the first generation under env_driver_mode=static. 
    Validates that the static-mode env-driver is a no-op against the unmodified baseline.
  measure:
    path: listeners__mass__cell_mass
    source: static-env-baseline-multigen parquet hive
    observable: per-cell dry mass over the lineage trajectory (fg)
    units: fg
  pass_if:
    operator: in-range
    low: 400.0
    high: 1500.0
  requires_simulation: static-env-baseline-multigen
  cites:
  - agmon2022
  backs:
    behavior_test: static-env-baseline-unchanged
  cites_note: 'No machine-linkable bib_key: the 400-1500 fg band is the v2ecoli baseline single-cell dry-mass range (model-internal
    regression guard), not an external literature value.'
- name: growth-rate-positive
  classification: supporting
  description: Instantaneous growth rate stays positive throughout the run — confirms metabolism is producing mass under
    the static env driver.
  measure:
    path: listeners__mass__instantaneous_growth_rate
    source: static-env-baseline-multigen parquet hive
    observable: per-cell μ instantaneous from mass listener
    units: 1/s
  pass_if:
    operator: greater-than
    threshold: 0.0
    field: min_value
  requires_simulation: static-env-baseline-multigen
  cites:
  - agmon2022
  backs:
    behavior_test: static-env-baseline-unchanged
  cites_note: 'No machine-linkable bib_key needed: trivial biological floor (instantaneous growth rate > 0 under replete static
    medium); no external source applies.'
- name: glc-declines-under-linear-decline-driver
  classification: primary
  description: Under env_driver_mode=synthetic_trajectory with a linear_decline spec (GLC 5 mM → 0 over 60 sim-min), 
    boundary.external.GLC at the cell tracks the driver trajectory monotonically downward. Multi-tick counterpart to the
    1-tick test_external_glucose_updates_propagate_within_one_step plumbing assertion — proves propagation persists 
    across generations and division boundaries.
  measure:
    path: boundary__external__GLC
    source: linear-decline-glc-multigen parquet hive
    observable: boundary.external.GLC at the agent over time (mM)
    units: mM
  pass_if:
    operator: in-range
    low: 0.0
    high: 5.0
  requires_simulation: linear-decline-glc-multigen
  cites:
  - agmon2022
  backs:
    behavior_test: external_glucose_updates_propagate_within_one_step
  cites_note: 'No machine-linkable bib_key: the 0-5 mM band equals the synthetic linear_decline driver spec (5 mM -> 0); plumbing/propagation
    check, not a literature value.'
- name: glc-stays-zero-under-zero-clamp-driver
  classification: primary
  description: Under env_driver_mode=synthetic_trajectory with a clamp_to_value=0 spec for GLC, boundary.external.GLC is
    held at 0 throughout the run. Multi-tick counterpart to test_zero_substrate_blocks_uptake.
  measure:
    path: boundary__external__GLC
    source: zero-clamp-glc-multigen parquet hive
    observable: boundary.external.GLC at the agent over time (mM)
    units: mM
  pass_if:
    operator: in-range
    low: 0.0
    high: 1.0e-06
  requires_simulation: zero-clamp-glc-multigen
  cites:
  - agmon2022
  backs:
    behavior_test: zero-substrate-blocks-uptake
  cites_note: 'No machine-linkable bib_key: the 0 to 1e-6 mM band is a numerical-zero tolerance for the clamp_to_value=0 driver;
    plumbing check, not a literature value.'
