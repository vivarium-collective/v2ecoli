  Ported from Maya Abdalla's vEcoli `biofilm` branch.

  Feature-name provenance: the v2ecoli feature name `flagella_regulation` was taken
  directly from the name of Maya's vEcoli config / run script for this model.

  Generators: make_cascade_report.py, run_full_override_gate.py (produces
  chart 01, this study's lead figure) — both in this study dir — plus the
  shared run_studies.py / run_studies_multigen.py drivers at the investigation
  root (charts 02-05). run_low_flagella_gate.py was retired/deleted 2026-07-28
  (its chart, formerly 06, was superseded by chart 01's complete override).

  FliA0 x FlgM0 grid scan (2026-08-04/05, exploratory -- not yet a numbered
  chart): run_fliA_flgm_heatmap.py in this study dir. Sweeps FliA0 in
  {100,250,500,750,1000,1500} x FlgM0 in {200,400,600,800,1200,1600} (36 cells,
  flagella=4/motor=0 fixed, seed 0), run twice -- once at 900s and once at a
  full 42 min (2520s) generation. Outputs fliA_flgm_grid_results.json (raw
  trajectories, --resume flag supported since the equilibrium solver can crash
  mid-batch) and charts/fliA_flgm_heatmap.svg (3 panels: FliA fold-change,
  absolute FliA count, flagella count). Motivated
  flagella-02-override-literature-grounding and
  flagella-02-flagella-count-unbounded-runaway above. 4 of 36 cells hit the
  equilibrium-solver error at 42 min (FliA0/FlgM0 = 500/600, 750/1200,
  1000/400, 1000/1600) -- same cells crashed reproducibly across two separate
  runs, so this is a real failure region, not a fluke.

  Are the tests/claims editable? Yes — every behavior_test and success_criterion
  here is hand-authored YAML in this study.yaml; edit it directly.
