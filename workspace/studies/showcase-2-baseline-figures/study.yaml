- name: doubling time distribution
  address: image:charts/doubling_time_hist.png
  config:
    title: Distribution of doubling times across the ensemble (divided gens cluster at ~43–52 min)
  chart: histogram
  source_run: showcase2-baseline-ensemble
  render: doubling_time_hist (multivariant) over the clean sweep — the two short bars are the truncated final-generation cells
# --- Replication & cell cycle ---
- name: chromosome replication
  address: image:charts/replication.png
  config:
    title: Chromosome replication across the seed-0 3-generation lineage (oriC 2→4→2, twice)
  chart: line
  source_run: showcase2-baseline-ensemble
  render: replication (multigeneration over seed 0) over the clean sweep — 3-gen dry-mass sawtooth, oriC/fork cycling per division
- name: chromosome-state snapshots
  address: image:charts/chromosome_snapshots.png
  config:
    title: Chromosome-state snapshots across one replication round — oriC, replisomes, replication bubbles, and RNAPs on the circular chromosome
    caption: >-
      Three timepoints from the seed-0 lineage rendered on the circular
      chromosome. Each rim is anchored by oriC (green dot, top) and Ter (red
      square, bottom). RNAPs (blue dots) sit at their transcription
      coordinates; replisomes (gold triangles) mark the active replication
      forks; replication bubbles (green arcs) trace the newly-synthesized
      daughter strand from oriC out to each fork. Panel (i) — between rounds:
      two segregated chromosomes, no active forks (RNAPs + oriC only). Panel
      (ii) — mid-replication: a single chromosome with one replication bubble,
      forks roughly halfway from oriC to Ter. Panel (iii) — multifork: both
      daughter chromosomes have already re-initiated (4 replisomes, nested
      bubbles near oriC), the overlapping-rounds regime of fast growth. This
      complements the time-series replication panel by showing the spatial
      layout of the replication machinery on the chromosome itself.
  chart: image
  source_run: showcase2-baseline-chromo
  render: scripts/render_chromosome_snapshots.py over .pbg/runs/showcase2-baseline-chromo (seed-0 3-gen lineage emitted with V2ECOLI_EMIT_UNIQUE=1) — reuses _plot_chromosome_map; RNAP-on-bubble falls back to all-on-rim (chromosome_domain.child_domains is excluded from parquet)
# --- Metabolism / FBA ---
- name: central carbon metabolism (FBA flux vs Toya 2010)
  address: image:charts/central_carbon_metabolism_scatter.png
  config:
    title: Central-carbon metabolism — model FBA flux vs Toya 2010 (Pearson R = 0.6990)
  chart: scatter
  source_run: showcase2-baseline-ensemble
  render: central_carbon_metabolism_scatter (multiseed) over the clean sweep — model mean WCM reaction flux vs Toya 2010 C13-MFA measured flux, Pearson R = 0.6990 (p = 2.1e-4, n = 23 reactions)
- name: reaction-flux heatmap
  address: image:charts/ptools_rxns.png
  config:
    title: Metabolic reaction-flux heatmap (reaction × timepoint, seed 0 gen 1, log10 |flux|)
  chart: heatmap
  source_run: showcase2-baseline-ensemble
  render: ptools_rxns (single, seed 0 gen 1) over the clean sweep — matplotlib heatmap (vl_convert overflows on the ~4500-row mark_rect spec)
# --- Gene expression / proteome ---
- name: proteome vs Schmidt 2015 / Wisniewski 2014
  address: image:charts/protein_counts_validation.png
