schema_version: 2
name: metabolic-perturbation-response
title: "Does v2ecoli reproduce known metabolic perturbation-response phenotypes vs curated experimental claims?"
created: '2026-06-15'
status: in-progress

# A behavioral-report-card investigation, generalizing the PR #134 basal report
# card from the model's basal STATE to its RESPONSE under a metabolic
# perturbation — across the same observable families: physiology, metabolic
# fluxes, and (TBD) gene expression. Each study applies a metabolic perturbation
# (a swept control knob like glucose uptake rate, a discrete change like a carbon
# source, or a metabolic gene knockout) and grades the resulting response against
# a curated experimental claim about that response. Sits in the metabolism
# investigation cluster (ketchup-baseline-comparison, multiscale-bioprocess, the
# Millard / pdmp kinetic-metabolism work) and reuses their arms + report-card grader.
#
# Grading: a perturbation response is graded with whatever report-card criterion
# fits its shape — the existing rel_tol / ttest (physiology shifts), r2 /
# flux_scatter (metabolic-flux + expression responses), plus one NET-NEW criterion
# for a swept dose-response RELATIONSHIP (`curve_response`: onset threshold + slope
# vs an experimental curve), needed first by the overflow study. New criteria are
# carved out as feature PRs against main once proven and surfaced to the framework
# via the existing `report_card_axis` workspace evaluator (pbg_v2ecoli/evaluators.py)
# + a report_card_verdict.json per study.

question: |
  How do v2ecoli's observables — physiology, metabolic fluxes, and (TBD) gene
  expression — RESPOND to metabolic perturbations (swept environmental conditions
  like glucose uptake rate or carbon source, and metabolic genetic perturbations
  like knockouts), and do those responses match curated experimental claims —
  graded by a report-card criterion and tracked for regression as conditions
  accrue? The first condition is aerobic acetate overflow: does v2ecoli reproduce
  the acetate-secretion-vs-growth-rate relationship (Basan 2015)?

executive:
  what_is_this: |
    A report-card investigation that grades v2ecoli's RESPONSE to metabolic
    perturbations — across physiology, metabolic fluxes, and (TBD) gene expression
    — against curated experimental claims about those responses. Generalizes the
    PR #134 basal card from basal STATE to perturbation RESPONSE. Each study = one
    perturbation + its experimental reference, graded with the criterion that fits
    the response shape (the overflow case is a swept dose-response, graded by the
    net-new `curve_response`; others use rel_tol / ttest / flux_scatter / r2).
    Planned condition ladder:
      • overflow-acetate-vs-growth — sweep glucose uptake rate; grade the acetate
        (+ O2) response vs growth rate against Basan 2015. (study 1)
      • (planned) carbon-source swaps — discrete environmental perturbations.
      • (planned) metabolic gene knockouts — genetic perturbations.
  verdict_status: in-progress
  verdict_detail: |
    Study 1 (overflow) has its baseline-FBA arm run and graded as of 2026-07-22;
    the framework piece (`curve_response`) is built and tested. Posture unchanged:
    characterize the agreement first (state + trend, regression-guarded);
    model-improvement attempts are invited, opportunistic follow-up studies, not a
    baked deliverable.

    Headline: the baseline FBA shows NO aerobic acetate overflow anywhere in a
    glucose-uptake titration (acetate 0.0 at all six caps; card verdict mismatch),
    confirming the ketchup-baseline-comparison prior. But the run also falsified
    the study's own design assumption — the uptake knob titrates uptake without
    moving growth rate, because division runs on the replication clock — and
    surfaced a hard carbon-balance violation under a binding cap. Those two are
    now the investigation's centre of gravity: a model that creates carbon cannot
    be meaningfully asked a carbon-partitioning question. The remaining arms
    (Millard kinetic ODE, FBA-bridge) are unbuilt.
  decisions_needed:
  - question: "Does the v2ecoli baseline FBA exhibit ANY aerobic acetate overflow, or is acetate identically zero across the glucose-uptake sweep?"
    status: "RESOLVED 2026-07-22 — identically zero. Acetate = 0.0 mmol/gDCW/h at all six glucose-uptake caps (1-6); the card grades mismatch, 'no overflow'. See overflow-acetate-vs-growth finding `overflow-absent-across-titration`."
    context: |
      The motivating prior is the ketchup-baseline-comparison characterization:
      v2ecoli's baseline secretes no acetate (0.0 per 100 glucose) where the
      KETCHUP cores secrete ~+71. The overflow study turns that single-point
      observation into a graded response curve over a glucose-uptake titration,
      across the baseline-FBA / Millard / FBA-bridge arms.

      RESOLUTION: the prior held exactly. The baseline-FBA arm secretes no acetate
      anywhere in the titration, so the single-point observation generalises to the
      whole response curve. Caveat carried forward: the sweep's growth-rate axis
      spans only ~0.03 /h (see `gur-knob-does-not-titrate-growth`), so this answers
      "is overflow present" but not "is the overflow CURVE right". The Millard and
      FBA-bridge arms remain unbuilt and unanswered.
  - question: "Where does the uncounted carbon come from under a binding uptake cap, and is it the same defect as the basal card's biomass-yield violation?"
    status: "OPEN (new 2026-07-22) — surfaced by the overflow run; candidate for a dedicated metabolism-correctness investigation rather than a study in this one."
    context: |
      The GUR titration showed the model creating carbon under a binding cap: at
      cap=1 it takes up 6.0 mmolC/gDCW/h and secretes 11.83, CO2 output RISING as
      glucose is restricted, with carbon closure degrading 1.11 -> 7.93 as the cap
      tightens. Biomass yield tracks it (0.92 -> 5.30 gDW/g glucose vs a 0.355-0.538
      literature band). The basal vs_literature card already reports a yield
      violation at the slack cap, so both cards are plausibly reporting one
      underlying bookkeeping defect. See findings `carbon-created-under-binding-uptake-cap`
      and `biomass-yield-exceeds-thermodynamic-limit`. SCOPE DECISION PENDING — this
      is a model-correctness question, not a perturbation-response one, and it gates
      the overflow study rather than depending on it.

scientific_argument:
  main_claim: |
    v2ecoli's metabolic perturbation responses — physiology, metabolic fluxes, and
    (TBD) gene expression — can be graded against curated experimental claims with
    report-card criteria fitting each response's shape, giving an auditable,
    regression-trackable characterization of where the model reproduces and
    diverges from known physiology — starting with aerobic acetate overflow.
  evidence_for:
  - "DONE (baseline-FBA arm, 2026-07-22) — overflow-acetate-vs-growth: a 6-point glucose-uptake titration, graded by curve_response against Vemuri 2006 (primary) / Basan 2015 (context). Verdict mismatch: acetate 0.0 at every cap, no overflow. The method works end-to-end — knob -> run -> extract -> grade -> verdict."
  - "PARTIAL — the same run falsified the study's growth-rate axis (the knob does not move mu) and tripped an assumption-free carbon-creation flag, showing the report-card machinery also surfaces model-correctness defects, not just agreement/disagreement with a reference."
  - "PLANNED — the Millard kinetic-ODE and FBA-bridge arms of the same study."
  caveats:
  - "This is a CHARACTERIZATION (does the model reproduce the experimental response?), graded as state + trend — not a model pass/fail. A model↔experiment gap is a calibration target the report INVITES work on, not a defect verdict."
  - "Resolution (recalibrating the model to close a gap) is an opportunistic follow-up study seeded from a gap finding, never a precondition of the characterization."
  - "Scoped to METABOLIC perturbations; the perturbation-response-card method (the report-card criteria, including the net-new `curve_response`) is reusable infra, and non-metabolic panels would be sibling investigations."

biological_story: |
  When a fast-growing E. coli takes up glucose faster than its respiratory chain
  can fully oxidize the carbon, it spills the excess as acetate — aerobic
  "overflow" metabolism — even with oxygen present. The amount of acetate
  secreted rises with growth rate above a threshold, a clean, repeatedly-measured
  relationship (Basan 2015). That makes overflow an ideal first metabolic
  perturbation-response test: sweep the carbon-uptake knob, read out the acetate
  (and O2) response, and compare the model's curve to the measured one.

  The condition ladder extends the same shape to other metabolic perturbations:
  discrete carbon-source swaps (does the model shift exchange phenotype correctly
  when fed succinate vs glucose?) and metabolic gene knockouts (does removing a
  central-carbon gene move fluxes/growth as measured?). Each is a perturbation
  paired with a curated experimental reference, read out across physiology /
  metabolic fluxes / (TBD) gene expression, graded with the criterion that fits
  its response shape, and tracked for regression as the panel grows.

at_a_glance:
  studies:
  - overflow-acetate-vs-growth: "(study 1, baseline-FBA arm DONE 2026-07-22 — verdict mismatch, no overflow at any of 6 glucose-uptake caps; Millard / FBA-bridge arms unbuilt) sweep glucose uptake rate; grade the acetate-carbon yield vs growth rate against Vemuri 2006 / Basan 2015. Two unplanned findings dominate: the knob does not move growth rate, and carbon balance fails under a binding cap."

# Investigation-scoped inputs (pbg-superpowers 0.14 investigation inputs). The
# curated experimental claims this investigation grades against live here, so the
# data + its claim travel with the investigation. Datasets are intentionally
# empty placeholders until the actual extracted curves are added.
inputs:
  datasets:
  - name: basan2015-acetate-vs-growth
    path: inputs/datasets/basan2015_acetate_vs_growth.csv
    supports_claims:
    - "Aerobic acetate excretion is ~0 below a threshold growth rate (λac ≈ 0.7–0.8 h⁻¹) and rises ~linearly with growth rate above it (Basan et al. 2015, Nature; Fig. 1 / Extended Data Table 1)."
    - "Acetate overflow is an innate response that depends on the degree of carbon influx, not on the carbon source — shown by titrating transporter expression (Pu-ptsG / LacY) within a single carbon source (Basan 2015)."
    status: populated   # extracted from Basan 2015 Fig-1 source data (supplement MOESM62)
    units_note: "Acetate as reported in mM/OD600/h; OD600→gDCW conversion to the model's mmol/gDCW/h is an external assumption (not in Basan 2015) — see inputs/notes/basan2015.md."
  references:
  - basan2015
  expert_docs:
  - inputs/notes/basan2015.md

studies:
- overflow-acetate-vs-growth

acceptance_criteria:
- {study: overflow-acetate-vs-growth, behavior: v2ecoli-reproduces-acetate-overflow-onset}
