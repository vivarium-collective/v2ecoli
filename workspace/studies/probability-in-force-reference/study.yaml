conclusion: 'The deficit is real, and it was overstated roughly ninefold.


  Three studies measured the transcription shortfall as a ratio against the cache''s

  basal_prob. That vector is not the reference the model consults: ppgpp_regulation is

  in DEFAULT_FEATURES and defaults True, PpgppInitiation writes a replacement, and

  transcript_initiation.py:547-556 substitutes it whenever ppgpp_state is non-empty.

  The two vectors differ substantially -- median |log ratio| 0.683 across the top 300,

  and the cache vector sums to 0.5307 where the in-force one sums to 1.0000.


  Measured against the correct reference the cohort sits at 0.156 and the comparison

  group at 0.944, a deficit of 0.165 or about sixfold. Against basal_prob the same

  measure gives 0.019, about fiftyfold. So the phenomenon survives -- the transcripts

  really are under-supplied -- but roughly nine tenths of the headline magnitude this

  investigation has been quoting was an artefact of the denominator.


  The reconstruction is validated rather than assumed. The vector is RECOMPUTED, not

  read, so the study grades whether it predicts the transcripts known to behave: the

  294 comparison mRNAs transcribe at 0.944 of it. Against basal_prob they sit at 1.85,

  which is not consistent with basal_prob being in force. That contrast is also the

  strongest available evidence that the ppGpp branch is taken at runtime.


  The configured regulators do not account for the suppression additively (mismatch

  2.693), even though delta_sum/basal is exactly -1.0 for TU00352 and TU00062 --

  regulators wired to null those genes. Under ppGpp the TF effect is multiplicative,

  so the additive null is the only one this study tests; the multiplicative path

  remains open and is the obvious successor question.


  One axis is UNGRADED and deliberately so. Confirming the branch is active by its

  specified measurement needs ppgpp_state emitted, which means editing a

  cache-hashed source file and invalidating a cache six studies share. Leaving the

  axis ungraded was preferred to re-specifying it onto a proxy -- substituting a

  convenient measurement for the intended one is the precise error this study exists

  to correct.


  Propagated: studies dnag-production-deficit, runtime-synthesis-probability and

  probability-assignment-trace carry corrections replacing their ~25x, ~93x and ~52x

  figures with the ~6x measured here.

  '
