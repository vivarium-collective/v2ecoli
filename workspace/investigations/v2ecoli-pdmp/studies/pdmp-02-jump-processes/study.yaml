    source_trigger: negative_finding
    proposed_experiment: 'Define and run a trajectory-distribution W2/KS criterion on count-level
      listeners (transcript/protein initiation counts) vs the v2ecoli baseline, replacing the cell_mass
      gate the closeout invalidated.'
    expected_information_gain: high
    expert_gate_required: true
  - id: pdmp-02-exponential-clock-validation
    title: Anderson-Darling Exp(1) exponential-clock + OU first-passage division validation
    study_type: validation
    source_trigger: open_deliverable
    proposed_experiment: 'Verify the cumulative hazard integral of lambda is Exp(1)-distributed over
      >=1e4 inter-event intervals (A-D, alpha=0.05) and validate the first-passage division trigger
      against an OU analytical CDF (KS < 0.02).'
    expected_information_gain: medium
    expert_gate_required: false
findings:
- id: trajectory-match-gate-failed-cellmass-wrong-observable
  kind: computational
  status: contradicts
  statement: 'The Phase-2 trajectory-distribution-match gate FAILED on cell_mass: the Poisson tau-leap
    Wasserstein-2 grows monotonically rather than converging. The decisive (negative) finding is that
    cell_mass is the WRONG observable for jump-process variance -- the consumption_matched homeostat
    washes per-tick variance out by construction -- redirecting Phase-3 inference onto count-level listeners.'
  evidence:
    from_run: 'phase2-progress (Poisson tau-leap vs baseline)'
    observed: 'cell_mass Poisson W2 grows 9.73 -> 15.35 -> 49.46 (monotonic; gate NOT met)'
  expected:
    range: [0.0, 9.73]
  provenance:
    run_ids: [phase2-progress]
  next_action: 'Re-anchor the distribution-match test on count-level listeners (rnap_data / ribosome_data / monomer_counts).'
  next_action_type: refine_representation
- id: jump-variance-lives-at-count-level
  kind: computational
  status: confirms
  statement: 'Empirical confirmation of the Phase-2 redirect: across 4 seeds at 250 steps, every
    AGGREGATE observable (cell_mass, dry_mass, total monomer, ATP[c] count) washes out to ~0.028%
    cross-seed CV, while the DIRECT jump-event count (cumulative transcription-initiation events,
    rnap_data.rna_init_event) shows 0.85% CV -- ~30x higher. So the jump-process stochasticity is
    real but lives at the per-event count level, not in aggregate mass/pool observables the
    consumption_matched homeostat regulates -- which is exactly why Phase-3 inference must anchor on
    count-level listeners.'
  evidence:
    from_run: 'baseline N=4 x 250 steps tick-by-tick (scripts/phase2_count_variance.py)'
    observed: 'CV: cell_mass 0.0285%, dry_mass 0.0288%, monomer 0.0273%, ATP 0.0283%, cumulative rna_init 0.846% (~30x)'
  provenance:
    run_ids: [phase2-count-variance-diagnostic]
  next_action: 'Build the count-level distribution-match gate (rna_init / monomer counts) as the Phase-2/3 acceptance criterion.'
  next_action_type: refine_representation
# --- v4 narrative spine (filled from existing study content; honest, no new results) ---
runtime:
  notes: 'Not yet run as a jump-process implementation (simulation_status: not_started, gate: blocked).
    The committed diagnostics use v2ecoli baseline runs: a Phase-0 N=4 × 8000-step multi-gen ensemble
    (~74 min) for inheritance/division, and an N=4 × 250-step tick-by-tick run for count-level variance.'
assumptions:
- Discrete-time WCM updates can be re-expressed as a continuous-time jump process (transcription, translation, division, competition jumps) with exponential inter-event clocks.
- A trajectory-distribution match (Wasserstein-2) against the baseline ensemble is the right acceptance gate — but the right OBSERVABLE is count-level, not aggregate mass (see findings).
- First-passage-time division and binomial inheritance are the load-bearing stochastic structures to reproduce.
enforced_params:
- name: implementation_status
  value: not built — jump-process layer is planned; current evidence is baseline-run diagnostics
- name: gate
  value: blocked on the Phase-1 metabolism substitution + a count-level distribution-match gate
biological_summary: 'Aims to represent the cell''s discrete molecular events (transcription/translation
  initiation, division, resource competition) as a continuous-time stochastic jump process rather than
  fixed-timestep updates. The key empirical finding so far is biological: aggregate observables (cell/dry
  mass, pools) wash out per-event variance via homeostatic regulation (~0.03% cross-seed CV), while the
  direct event counts (rna_init) carry ~30× more variance — so the stochasticity lives at the count level.'
