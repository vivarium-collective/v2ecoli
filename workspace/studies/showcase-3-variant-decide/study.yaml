schema_version: 4
name: showcase-3-variant-decide
investigation: v2ecoli-baseline-showcase   # owning investigation (back-reference)
title: "Which perturbation best demonstrates v2ecoli's response — reviewers to choose"
created: '2026-06-09'
status: design   # legacy back-compat; canonical axes below

# v4 schema (vivarium_workbench.lib.investigations._validate_study_v4_redesign):
#   REQUIRED top-level: schema_version, name, question, conditions, tests, status
#   REQUIRED in conditions: baseline {composite, params}, variants [...], model_settings [...]

# Canonical 6-axis status. This is a DECISION study: design is complete, but the
# variant is intentionally un-chosen, so the sim is NOT run and the gate / expert
# review are pending the reviewer's choice.
design_status: complete
implementation_status: not_run
simulation_status: not_run
evaluation_status: not_run
gate_status: pending
expert_review_status: pending

question: |
  Which perturbation best demonstrates v2ecoli's response — reviewers to
  choose? Building on the wild-type baseline (showcase-2), this study stops at
  a DECISION: it commits no variant. Four candidate perturbations are proposed;
  reviewers pick which one (or more) best demonstrates v2ecoli's perturbation
  response. No simulation runs until a variant is chosen.

report:
  title: showcase-3 — reviewer variant decision (no variant committed)
  verdict: pending
  confidence: design-stage
  evidence_quality: design-only

  objective: |
    Hand reviewers an explicit, OPEN choice: which perturbation should we run on
    top of the wild-type baseline to demonstrate v2ecoli's response? This study
    deliberately commits no variant (conditions.variants lists four PROPOSED, uncommitted candidates); it presents
    four candidates and stays un-run until a reviewer selects one.

  result: |
    [NO RUN — decision study. The sim does not run until a variant is chosen.
    See decisions_needed and discovery_implications.followup_study_proposals for
    the four candidate perturbations.]

  decision: |
    OPEN — reviewers to choose which perturbation (or perturbations) best
    demonstrates v2ecoli's response. The four candidates are below.

  decisions_needed:
    - question: "Which variant should we run to demonstrate v2ecoli's perturbation response?"
      status: "OPEN — reviewers to choose"
      context: |
        Four candidate perturbations on top of the showcase-2 wild-type baseline.
        No option is preferred; the reviewer chooses (and may pick more than one).
          1. ppgpp_regulation toggle OFF — disable the ppGpp regulatory layer; a
             clean global single-switch knock-out.
          2. parameter sweep via linspace — sweep a transcription/translation knob
             (e.g. a global RNAP or ribosome elongation-rate factor) across a
             linspace; a dose-response demonstration.
          3. media / condition change — switch the growth condition (e.g.
             glucose→succinate or +amino-acids). FLAG: each condition needs its
             OWN full ParCa cache (~2.5 min/condition), multiplying the build cost.
          4. dnaA expression knob — the TU00259[c] transcription-init override
             (sim_data.genetic_perturbations["TU00259[c]"] = V) from the
             dnaa-replication investigation; a targeted single-gene perturbation.

  review_asks: |
    For reviewers, before any perturbation is run:
    1. WHICH VARIANT — which of the four candidates (ppGpp-off, linspace
       parameter sweep, media/condition change, dnaA expression knob) best
       demonstrates v2ecoli's response for this showcase? You may select more
       than one.
    2. READOUT — what is the primary readout you want to see for the chosen
       perturbation (growth rate, expression, a specific pathway flux, the DnaA
       pool, …)?
    3. COST TRADE-OFF — is the media/condition-change option worth its extra
       cost (a separate full ParCa cache per condition, ~2.5 min each) vs the
       single-cache options (ppGpp-off, linspace sweep, dnaA knob)?
    4. SCOPE — should the showcase run exactly one perturbation, or a small set,
       to demonstrate v2ecoli's response?

# --- v4 narrative-spine sections (decision study — filled from existing content) ---
study_card:
  phase: Decide
  one_liner: "A reviewer-decision gate: which perturbation should we run on top of the wild-type baseline to demonstrate v2ecoli's response? Four candidates proposed, none committed."
  status: design (open decision)
  headline: "OPEN — reviewers choose among ppGpp-off / linspace parameter sweep / media-condition change / dnaA expression knob. No simulation runs until a variant is chosen."

runtime:
  status: "not run — reviewer-decision study; no compute until a variant is selected"

readouts:
  - {name: decision-outcome, description: "Decision outcome: which candidate perturbation(s) the reviewer selects to run"}
  - {name: per-candidate-readout, description: "Per candidate, the proposed primary readout (growth rate, expression, a pathway flux, or the DnaA pool — to be chosen by the reviewer)"}

enforced_params:
  - {name: baseline, value: "showcase-2 validated wild-type baseline", why: "each candidate variant is a clean delta against a trusted reference"}

biological_summary: |
  This study commits no perturbation. It frames an explicit reviewer choice among
  four mechanistically-distinct levers — a global regulatory toggle (ppGpp), a
  dose-response parameter sweep (a transcription/translation knob), an
  environmental change (carbon source), and a targeted single-gene expression
  knob (dnaA / TU00259[c]) — each of which would exercise a different part of the
  v2ecoli whole cell's response. The biology of each candidate lives in the
  followup_study_proposals below.

literature_anchors:
  - {cite: macklin2020, note: "The Covert-lab whole-cell model; the wild-type baseline (showcase-2) each candidate perturbation would be applied on top of."}

model_change: |
  None yet — the model change is the OPEN decision. Each candidate would alter a
  different knob (ppgpp_regulation toggle, a swept transcription/translation
  factor, the growth condition / media, or sim_data.genetic_perturbations
  ["TU00259[c]"]); see followup_study_proposals.

implementation_requirements: |
  Single-cache for ppGpp-off / linspace sweep / dnaA knob (reuse the showcase-1
  glucose cache); the media-condition change needs its OWN full ParCa cache per
  condition (~2.5 min each) — the cost trade-off flagged for reviewers.

design_pivot_required: true   # the study is intentionally a decision/pivot gate — a reviewer choice is REQUIRED before any run

conclusion_verdicts:
  - {claim: "the reviewer-perturbation choice is open", verdict: pending, basis: "four candidates proposed; none committed — resolves when a reviewer selects one (or more)"}

simulation_set:
  - name: candidate-ppgpp-off
    kind: simulation
    status: planned # conditional on reviewer selection
    base_model: baseline
    duration_steps: "same multiseed/multigen ensemble as showcase-2"
    seeds: "set when the reviewer selects this candidate"
    metrics: [growth rate, ribosome/RNAP allocation, expression]
    pass_fail_tests: [reviewer-selects-perturbation-variant]
  - name: candidate-parameter-sweep-linspace
    kind: simulation
    status: planned
    base_model: baseline
    duration_steps: "one parameterized run per linspace point"
    seeds: "set when the reviewer selects this candidate"
    metrics: [growth rate, mass fractions vs swept value (dose-response)]
    pass_fail_tests: [reviewer-selects-perturbation-variant]
  - name: candidate-media-condition-change
    kind: simulation
    status: planned # FLAG: a separate full ParCa cache per condition (~2.5 min each)
    base_model: baseline
    duration_steps: "same ensemble in the new media"
    seeds: "set when the reviewer selects this candidate"
    metrics: [growth rate, central-carbon flux, mass composition]
    pass_fail_tests: [reviewer-selects-perturbation-variant]
  - name: candidate-dnaa-expression-knob
    kind: simulation
    status: planned
    base_model: baseline
    duration_steps: "same ensemble with the TU00259[c] override"
    seeds: "set when the reviewer selects this candidate"
    metrics: [DnaA pool, replication-initiation response]
    pass_fail_tests: [reviewer-selects-perturbation-variant]

planned_runs:
  - name: chosen-perturbation-run
    status: planned
    n_steps: "as showcase-2 (multiseed/multigen ensemble)"
    details: "Runs ONLY after a reviewer selects one (or more) of the four candidate perturbations below; until then this study is intentionally un-run."

conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    # No variant committed — this is a reviewer-decision study. The four
    # candidate perturbations live in decisions_needed +
    # discovery_implications.followup_study_proposals.
  variants:
  # PROPOSED, not committed — the reviewer chooses among these four. Listed here
  # so the study card shows the candidate perturbations (status: proposed).
    - name: ppgpp-regulation-off
      role: proposed (uncommitted)
      status: proposed
      detail: "Disable the ppGpp regulatory layer — a clean global single-switch knock-out."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: parameter-sweep-linspace
      role: proposed (uncommitted)
      status: proposed
      detail: "Sweep a transcription/translation knob (e.g. RNAP or ribosome elongation-rate factor) across a linspace — a dose-response."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: media-condition-change
      role: proposed (uncommitted)
      status: proposed
      detail: "Switch growth condition (e.g. glucose->succinate). FLAG: needs its own full ParCa cache per condition (~2.5 min each)."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    - name: dnaa-expression-knob
      role: proposed (uncommitted)
      status: proposed
      detail: "Targeted single-gene perturbation via sim_data.genetic_perturbations['TU00259[c]'] (the dnaa-replication Mechanism-A lever)."
      composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  model_settings: []

assumptions:
  - text: |
      The wild-type baseline (showcase-2) is validated before any perturbation is
      run, so each candidate variant is a clean delta against a trusted reference.
    verified_in_v2ecoli: false

tests:
  - name: reviewer-selects-perturbation-variant
    classification: decision
    status: pending
    question: Have reviewers selected which perturbation variant(s) to run to demonstrate v2ecoli's response?
    measure:
      kind: reviewer_decision
      detail: |
        Placeholder decision gate. Resolves when a reviewer picks one (or more) of
        the four candidate perturbations (ppGpp-off, linspace parameter sweep,
        media/condition change, dnaA expression knob). No quantitative pass/fail —
        the outcome is the chosen variant, which then becomes a committed run.
    pass_if:
      op: reviewer_selected_variant

discovery_implications:
  resolved_uncertainties: []
  remaining_uncertainties:
    - Which perturbation most clearly demonstrates v2ecoli's response is an OPEN reviewer choice; no variant is committed in this scaffold.
  followup_study_proposals:
    - id: variant-ppgpp-regulation-off
      title: ppGpp regulation toggle OFF
      study_type: perturbation
      source_trigger: reviewer-decision
      proposed_experiment: |
        On the showcase-2 wild-type baseline, disable the ppGpp regulatory layer
        (ppgpp_regulation = off) and run the same multiseed/multigen ensemble.
        Compare growth rate, ribosome/RNAP allocation, and expression against the
        baseline.
      expected_information_gain: high
      effort: low
      expert_gate_required: true
    - id: variant-parameter-sweep-linspace
      title: Parameter sweep via linspace (transcription/translation knob)
      study_type: parameter-sweep
      source_trigger: reviewer-decision
      proposed_experiment: |
        Sweep one transcription/translation knob (e.g. a global RNAP or ribosome
        elongation-rate factor) across a linspace of values on the baseline cache,
        one parameterized run per point, and plot the dose-response (growth rate /
        mass fractions vs the swept value).
      expected_information_gain: high
      effort: medium
      expert_gate_required: true
    - id: variant-media-condition-change
      title: Media / condition change (e.g. glucose→succinate or +amino-acids)
      study_type: condition-change
      source_trigger: reviewer-decision
      proposed_experiment: |
        Switch the growth condition and run the baseline ensemble in the new
        media. FLAG: each condition needs its OWN full ParCa cache (~2.5 min per
        condition), so this multiplies the build cost vs the single-cache options.
      expected_information_gain: high
      effort: high # a separate full ParCa cache per condition (~2.5 min each)
      expert_gate_required: true
    - id: variant-dnaa-expression-knob
      title: dnaA expression knob (TU00259[c] transcription-init override)
      study_type: gene-perturbation
      source_trigger: reviewer-decision
      proposed_experiment: |
        Apply the Mechanism-A runtime override
        sim_data.genetic_perturbations["TU00259[c]"] = V (carried over from the
        dnaa-replication investigation) on the baseline cache and run the ensemble;
        read the DnaA pool / replication-initiation response vs the baseline.
      expected_information_gain: medium
      effort: low
      expert_gate_required: true

pipeline_gate:
  gate_status: pending

runs: []

visualizations:
# PLANNED mockup — this is a reviewer-decision study with no run yet. The figure
# describes what the chosen perturbation WOULD produce once a reviewer selects a
# candidate; it is not rendered from data.
  - name: PLANNED — perturbation-vs-baseline delta (mockup)
    status: planned
    address: "planned:perturbation-vs-baseline-delta" # no rendered chart yet — decision study
    config:
      title: "PLANNED: chosen perturbation vs wild-type baseline — the readout the reviewer selects (growth / expression / flux / DnaA pool)"
      caption: >-
        Placeholder for the chosen-perturbation figure. Once a reviewer selects one
        (or more) of the four candidates (ppGpp-off / linspace sweep / media change
        / dnaA knob), this becomes a delta-vs-baseline chart on the reviewer's
        chosen primary readout. No data yet — the study is intentionally un-run.
    chart: planned-mockup

# Units Atlas — folded in from the retired units-atlas investigation so the
# unit-bearing readouts are visible in every baseline-showcase study.
embed_visualizations:
  - name: Units Atlas (interactive)
    url: /reports/figures/showcase-3-variant-decide/units_atlas.html
    description: Every declared unit-bearing baseline readout grouped by physical dimension with example magnitude + range.


# --- registry model (Study Pipeline Spec 1): declared artifact I/O; graph edges derive from inputs.from. Mirrors pipeline_gate.prerequisites. ---
inputs:
  - {artifact: baseline, from: showcase-2-baseline-figures}
