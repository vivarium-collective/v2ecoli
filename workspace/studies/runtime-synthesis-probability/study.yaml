schema_version: 4
name: runtime-synthesis-probability
title: Runtime synthesis probability
created: '2026-09-03'
status: complete
phase: Decide
study_type: diagnostic
investigation: transcription-rewiring
question: Study 4 showed a cohort of high-probability transcripts is realized ~51x below its assigned
  rate, with no static attribute explaining it. Is the probability actually in force at runtime depressed
  for these transcripts (an assignment defect), or is it normal and they are simply not selected (a sampling
  defect)?
biological_summary: 'Study silent-transcription-units established the effect and exhausted the

  static explanations. Six transcription units in the top 300 by assigned

  probability are transcribed at 0.000-0.020 of their assigned rate, while the

  294 comparable units are transcribed at 1.006x theirs. Neither the

  ribosomal-protein override (1 of 6) nor transcript length (r = -0.106) accounts

  for it, and nothing else in the ParCa cache distinguishes the group.


  That leaves runtime. The model emits three quantities per transcription unit

  per timestep that the cache does not expose: the synthesis probability actually

  in force, the target probability before or after regulatory adjustment, and the

  number of transcription factors bound. Together they decompose the deficit into

  two mutually exclusive explanations.


  If the probability in force is itself depressed, the transcripts are

  under-supplied by construction and the defect is in how that probability is

  assigned -- whether by the ribosomal-protein override, by regulation, or by

  some normalisation that redistributes probability away from them.


  If the probability in force is normal and they are still rarely transcribed,

  the assignment is fine and the defect is downstream, in how transcripts are

  selected or allocated from that probability. That is a different bug in a

  different part of the process, and it would mean the model does not transcribe

  according to the probabilities it computes.


  These require different repairs, which is why the study is built to separate

  them rather than to confirm either.

  '
assumptions:
- text: listeners.rna_synth_prob.actual_rna_synth_prob is the per-TU probability the transcription process
    actually uses when selecting transcripts, after every override and adjustment.
  verified_in_v2ecoli: false
- text: The permissive sweep from silent-transcription-units is an unperturbed lineage, so its runtime
    probabilities reflect normal operation.
  verified_in_v2ecoli: true
pipeline_gate:
  prerequisites:
  - study: silent-transcription-units
    condition: ran
    relation: leads-to
    outputs_used:
    - The six-TU cohort and its 294-member comparison group
    - The 3 seed x 3 generation sweep, reused here without re-running
  enables: []
  proceed_condition: The deficit is attributed to probability assignment or to transcript selection, so
    a repair can be aimed at the right part of the process.
  gate_evaluator:
    result: failed
    blocked_by:
    - realized-tracks-runtime-probability
    evaluated_by: code
    diverges_from_authored: false
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants: []
  model_settings: []
baseline:
- name: baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []
units_and_time:
  tick: 1 tick = 1 s of simulated time (composite time_step=1)
  quantities:
    actual_rna_synth_prob: dimensionless per-TU probability in force per timestep
    target_rna_synth_prob: dimensionless per-TU target probability per timestep
    n_bound_TF_per_TU: count of transcription factors bound
    realized share: transcripts made for a TU / all transcripts made
behavior_tests:
- name: runtime-probability-is-depressed
  classification: primary
  gate_class: acceptance_criterion
  question: Is the probability actually in force depressed for the cohort?
  description: 'The cohort''s median actual_rna_synth_prob is below half the comparison group''s median.

    This is the discriminating axis. A PASS means the transcripts are under-supplied by construction and
    the defect lies in probability assignment. A FAIL means the probability in force is normal, the deficit
    arises downstream in selection, and the repair is somewhere else entirely.

    Threshold provenance: theory. Half is a deliberately generous separator between "depressed" and "normal";
    the realized deficit is ~51x, so a genuine assignment defect should clear this easily and a normal
    probability should fail it clearly. Nothing is cited for it.'
  measure:
    kind: derived
    detail: median actual_rna_synth_prob over the 6 cohort TUs divided by the median over the 294 comparison
      TUs, pooled across the sweep.
  pass_if:
    op: <
    value: 0.5
    provenance:
      kind: theory
      note: Generous separator; a 51x realized deficit should clear it easily.
  status: passed
  result: PASS
  measured_value: 0.01076
  evaluated_by: agent
- name: realized-tracks-runtime-probability
  classification: primary
  gate_class: acceptance_criterion
  question: Given the probability in force, are the cohort's transcripts sampled fairly?
  description: 'The cohort''s (realized share / actual probability) is at least half the comparison group''s
    same ratio.

    The sampling test, and the complement of the axis above. If transcripts are selected in proportion
    to the probability in force, this ratio should be similar for both groups regardless of how depressed
    the cohort''s probability is. A FAIL means the cohort is under-sampled even relative to its own reduced
    probability, which would be a second, independent defect.

    Threshold provenance: theory. Half allows for ordinary stochastic variation in a small cohort while
    still catching a systematic under-sampling.'
  measure:
    kind: derived
    detail: (cohort median realized-share / cohort median actual prob) divided by the same quantity for
      the comparison group.
  pass_if:
    op: '>='
    value: 0.5
    provenance:
      kind: theory
      note: Tolerates stochastic variation; catches systematic under-sampling.
  status: failed
  result: FAIL
  measured_value: 0.37972
  evaluated_by: agent
- name: actual-tracks-target
  classification: primary
  gate_class: acceptance_criterion
  question: Is the depression introduced by regulation, or already in the target?
  description: 'For the cohort, median actual_rna_synth_prob is at least half of median target_rna_synth_prob.

    Separates two routes to a depressed probability. If actual tracks target, whatever suppresses these
    transcripts is already present in the target and the cause is upstream in how targets are computed.
    If actual is far below target, something between the two -- regulation, an override, or a renormalisation
    -- is removing their probability, which localises the bug precisely.

    Threshold provenance: theory. Half distinguishes "tracks" from "is suppressed relative to" without
    assuming a particular mechanism.'
  measure:
    kind: derived
    detail: median actual_rna_synth_prob / median target_rna_synth_prob over the cohort.
  pass_if:
    op: '>='
    value: 0.5
    provenance:
      kind: theory
      note: Distinguishes tracking from suppression; mechanism-agnostic.
  status: passed
  review_note: 'CORRECTED 2026-09-03 after the question ''how sure are you on the regulation?''.

    The exclusion of regulation was OVERSTATED and rests on one valid leg and one

    invalid one.


    VALID: no transcription factor is bound. Re-checked with a stronger statistic than

    the median originally used -- mean 0.0000, max 0.0000, any-binding on 0.0% of 7584

    timesteps, for both cohort and comparison. The ADDITIVE TF path cannot be firing.


    INVALID: ''actual tracks target to 0.1%, so nothing between target and use removes

    the probability.'' target_TU_synth_probs is returned by _synthesis_probabilities

    (transcript_initiation.py:764-769), which contains the ENTIRE assignment path

    including the delta_prob . bound_TF term. Both quantities are therefore

    POST-regulation and differ only by RNAP crowding (max_p, tu_is_overcrowded). The

    1.001 ratio shows crowding does not affect these transcripts; it says nothing

    whatever about regulation. The study''s own assumptions block flagged this as

    verified_in_v2ecoli: false and the conclusion leaned on it anyway.


    UNEXAMINED, and now the leading hypothesis: ppgpp_regulation is TRUE in this cache.

    When ppgpp_state carries a basal vector, transcript_initiation.py:547-556 REPLACES

    basal_prob with the ppGpp-adjusted vector and makes the TF effect multiplicative via

    an accessibility gain b^2/(b+K) whose own comment says it goes ''smoothly -> 0 for

    silent genes''. That path requires no TF binding, so zero TFs bound does not exclude

    it.


    Also newly noted: the configured delta_prob sum for these transcripts is almost

    exactly -basal_prob (TU00352 basal 1.213e-04, delta -1.213e-04; TU00062 1.631e-04,

    -1.631e-04), i.e. regulators wired to null the gene. That is the opposite of

    evidence that regulation is irrelevant here.


    Consequence: the ''25x below basal_prob'' framing may be measuring against the wrong

    reference vector entirely. Study probability-in-force-reference is designed to settle

    which vector is in force.

    '
  result: PASS
  measured_value: 1.001163
  evaluated_by: agent
- name: comparison-group-behaves-normally
  classification: control
  gate_class: acceptance_criterion
  question: Does the decomposition hold for transcripts known to behave?
  description: 'For the 294 comparison TUs, median actual_rna_synth_prob is within a factor of two of
    median target_rna_synth_prob.

    Positive control on the instrument rather than on the cohort. The comparison group is realized at
    1.006x its assigned probability, so its actual and target should agree closely. If they do not, the
    columns do not mean what this study assumes and every other axis is uninterpretable.

    Threshold provenance: theory; a factor of two is a loose sanity band for quantities that should be
    nearly identical.'
  measure:
    kind: derived
    detail: max of (median actual / median target) and its reciprocal, over the comparison group.
  pass_if:
    op: <
    value: 2.0
    provenance:
      kind: theory
      note: Loose sanity band on the instrument, not on the finding.
  status: passed
  result: PASS
  measured_value: 1.000982
  evaluated_by: agent
- name: cohort-remains-depressed
  classification: supporting
  gate_class: regression_pin
  description: 'The cohort''s realized/assigned ratio remains far below the comparison group''s, as measured
    in silent-transcription-units.

    POST-HOC: measured in the prior study (0.000-0.020 vs 1.006). A pin so a change that silently fixes
    the depression is noticed here.'
  measure:
    kind: derived
    detail: cohort max realized/assigned ratio, recomputed from the same sweep.
  pass_if:
    op: <
    value: 0.1
    provenance:
      kind: post_hoc
      note: Observed in the prior study; pin only.
  status: passed
  result: PASS
  measured_value: 0.019652
  evaluated_by: agent
preregistered:
  declared_before_runs: true
  registered_at: '2026-09-03T17:54:00Z'
  criteria:
  - test: runtime-probability-is-depressed
    prior: Open. Determines whether the defect is in probability assignment or in transcript selection;
      these need different repairs.
  - test: realized-tracks-runtime-probability
    prior: Open. If the cohort is under-sampled even relative to its own reduced probability, that is
      a second independent defect.
  - test: actual-tracks-target
    prior: Open. Localises a depressed probability to the target computation or to something applied after
      it.
  - test: comparison-group-behaves-normally
    prior: The control; a failure invalidates the instrument, not the cohort.
  predictions:
  - 'Confirmed before writing these axes: that actual_rna_synth_prob, target_rna_synth_prob and n_bound_TF_per_TU
    are emitted by the existing runs. That is a CAPABILITY check -- which columns exist -- and the cohort''s
    values in them were deliberately not inspected, so the thresholds above are genuine priors.'
  - 'Carried from silent-transcription-units and NOT re-derived here: the cohort is realized at 0.000-0.020
    of assigned against a comparison median of 1.006. cohort-remains-depressed is a regression pin for
    that reason.'
  controls:
  - comparison-group-behaves-normally
  thresholds:
    runtime-probability-is-depressed:
      op: <
      value: 0.5
      provenance:
        kind: theory
        note: Generous separator; a 51x realized deficit should clear it easily.
    realized-tracks-runtime-probability:
      op: '>='
      value: 0.5
      provenance:
        kind: theory
        note: Tolerates stochastic variation; catches systematic under-sampling.
    actual-tracks-target:
      op: '>='
      value: 0.5
      provenance:
        kind: theory
        note: Distinguishes tracking from suppression; mechanism-agnostic.
    comparison-group-behaves-normally:
      op: <
      value: 2.0
      provenance:
        kind: theory
        note: Loose sanity band on the instrument, not on the finding.
readouts:
- name: actual-synthesis-probability
  store_path: listeners.rna_synth_prob.actual_rna_synth_prob
  description: Per-TU probability in force per timestep. The primary observable; it is the only quantity
    that distinguishes an assignment defect from a sampling one.
  units: dimensionless
  status: available
- name: target-synthesis-probability
  store_path: listeners.rna_synth_prob.target_rna_synth_prob
  description: Per-TU target probability, for localising where a depression enters.
  units: dimensionless
  status: available
- name: tf-bound-per-tu
  store_path: listeners.rna_synth_prob.n_bound_TF_per_TU
  description: Transcription factors bound per TU. Context for whether regulation is plausibly responsible;
    not itself a graded axis.
  units: count
  status: available
- name: transcripts-synthesized-per-tu
  store_path: listeners.transcript_elongation_listener.count_rna_synthesized
  description: Realized synthesis, for the realized-vs-probability comparison.
  units: transcripts per generation
  status: available
