      high: 0.12
      provenance:
        kind: theory
        note: Derived, not chosen. De-convolving ppgpp-off-rescue's ALREADY-PUBLISHED cumulative windows
          (0.045 / 0.023 / 0.016 over generations 1, 1-2, 1-3) with that arm's recorded durations (tau
          43/46/54 min) implies per-generation ratios of g2/g1=0.054 and g3/g1=0.099. The band brackets
          both implied points and spans exactly 3x, the widest the discrimination check permits. Uses
