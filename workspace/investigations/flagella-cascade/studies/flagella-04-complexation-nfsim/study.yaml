schema_version: 4
name: flagella-04-complexation-nfsim
title: "Complexation via NFsim — Rule-Based Flagellar Assembly"
question: >-
  Does NFsim rule-based assembly build flagella through ordered, conditional
  intermediates (export apparatus -> motor/basal body -> hook -> complete flagellum)
  that stochastic Gillespie complexation cannot enforce?
description: |
  Maya's Specific Aim 2B: replace the stochastic Gillespie complexation (which fires
  as soon as substrates are available and cannot enforce ordered, conditional
  dependencies) with an NFsim rule-based assembly model. Brings in the existing
  flagella-assembly example from vivarium-collective/pbg-nfsim — a process-bigraph
  wrapper for BioNetGen/NFsim whose BNGL model encodes hierarchical complexation of
  ~30 flagellar proteins through 7 sequential reactions (237 rules).
topic: assembly
tags: [flagella, assembly, nfsim, bionetgen, rule-based, complexation, aim2b, pbg-nfsim, just-in-time]
created: '2026-06-20'

# Aim 2B runs PARALLEL to the transcription arm (01-03): it is a STANDALONE NFsim +
# monomer-production model, not coupled to the WCM/ParCa, so it has no prerequisite
# among the other studies. Its real prerequisite is the pbg-nfsim install. Coupling
# it into the WCM (so the SUM-gate would feed it) is the future edge that would make
# it depend on 02/03.
pipeline_gate:
  prerequisites: []
  enables: []

status: in_progress
phase: Simulate

design_status: complete
implementation_status: complete    # pbg-nfsim installed; driver brings in the example
simulation_status: ran             # production+complexation run, complete flagella assembled
evaluation_status: partial
gate_status: pending
expert_review_status: requested    # Maya Abdalla reviewed 2026-07-24 (feedback imported)

# Rule-based NFsim assembly run — dispatched via the REGISTERED composite
# `flagella_nfsim_assembly` (no more ad-hoc in-code Composite).
runs:
- name: nfsim-flagella-assembly-2400s
  kind: analysis
  canonical: true
  composite: v2ecoli.composites.flagella_nfsim_assembly.flagella_nfsim_assembly
  description: pbg-nfsim MonomerProduction + NFSimProcess flagellar assembly, 2400 s (standalone rule-based, not WCM-coupled)
  status: completed
  result: PASS
  outcomes:
    ordered-assembly:
      result: CONFIRMED
      detail: "export=2, motor=1, hook=12, complete flagella=9 at 2400 s"

findings:
- id: flagella-04-bionetgen-runs
  kind: computational
  status: confirms
  statement: >-
    The pbg-nfsim NFSimProcess runs the flagella BNGL (237 rules, 7 sequential
    reactions) under BioNetGen and returns observable trajectories (MODEL runs).
  evidence:
    observed: "BioNetGen executes; observable trajectories returned over the 2400 s run"
    expected: "NFsim wraps the flagella_complexation.bngl model and produces observables"
- id: flagella-04-ordered-assembly
  kind: computational
  status: confirms
  statement: >-
    Assembly intermediates appear in order (export apparatus -> motor -> hook) and
    complete flagella accumulate — the ordered, conditional construction that a plain
    Gillespie complexation cannot enforce (BIOLOGY-level: just-in-time hierarchy).
  evidence:
    observed: "2400 s: export=2, motor=1, hook=12, complete flagella=9, appearing in assembly order"
    expected: "basal body before hook before filament; complete flagella accumulate"
- id: flagella-04-not-wcm-coupled
  kind: computational
  status: inconclusive
  statement: >-
    This is a STANDALONE assembly model — it is not yet coupled into the WCM, so it
    does not test whether SUM-gate-regulated monomer supply drives ordered assembly
    end to end. That coupling is the unstarted full Aim 2B.
  evidence:
    observed: "monomers fed by a simple MonomerProduction step, not by WCM transcription"
    expected: "full Aim 2B would replace ecoli-complexation inside the WCM with NFsim"
- id: flagella-04-nfsim-does-not-cap-flagella-count-either
  kind: computational
  status: contradicts
  statement: >-
    IMPORTANT CORRECTION (2026-08-05): NFsim's ordered assembly does NOT solve
    the unbounded-flagella-count problem discovered in study 02
    (flagella-02-flagella-count-unbounded-runaway) -- checked directly against
    this study's own BNGL rule set before assuming migration would help. The
    terminal nucleation/completion rule in
    pbg-nfsim/pbg_nfsim/models/flagella_complexation.bngl (flagellar_export_
    apparatus() + flagellar_motor() -> Growing_flagella(), then -> flagella())
    fires every time an export apparatus and a motor complex coexist, with no
    consumed nucleator/basal-body-site species and no upper bound on flagella()
    count. The `n_flagella` parameter in that file LOOKS like a cap but is not
    one -- generate_flagella_bngl.py uses it only to size initial monomer pools
    and scale nucleation rate constants, never as a stoichiometric limiter.
    MonomerProduction also feeds monomers at a constant unconditional rate with
    no feedback throttle. Structurally this is the SAME open-loop
    supply -> assembly topology as the current Gillespie complexation, just
    with ordered intermediates instead of a single-step reaction. NFsim gives
    you assembly ORDER (basal body before hook before filament); it does not
    give you a CAP on total count -- those are different properties, and this
    study only ever claimed the former.
  evidence:
    observed: "flagella_complexation.bngl:444,455 -- terminal rule has no consumed limiting species; n_flagella (line 4) used only for pool-sizing/rate-scaling per generate_flagella_bngl.py:165,180, never as a reaction stoichiometric limit"
    expected: "(if NFsim fixed the runaway problem) the rule set would include a finite, consumed nucleation-site species that caps total flagella() count"

- id: flagella-04-model-ported-to-v2ecoli-with-corrected-stoichiometry
  kind: computational
  status: confirmed
  statement: >-
    (2026-08-12) The BNGL model (generate_flagella_bngl.py, flagella_complexation.bngl)
    previously lived inside pbg-nfsim's own package as a generic bundled example,
    sourced from an unrelated older codebase (vivarium-chemotaxis flagella_chromosome.py)
    with almost entirely unsourced -1 placeholder stoichiometry -- never checked
    against literature, and structurally out of order (export apparatus and
    C-ring modeled as independent parallel branches, matching v2ecoli's OWN
    pre-2026-08-11 error before that session's hierarchy fix). Ported into
    v2ecoli (this study's models/ directory) so the model can evolve alongside
    v2ecoli's own flagella reaction network and eventually couple to it directly
    (Maya's explicit direction: "I was thinking of putting it in v2ecoli because
    I want it to be coupled to the whole cell model"). pbg-nfsim itself reverted
    to its original clean, generic upstream state -- it now supplies only the
    runtime engine (NFSimProcess, MonomerProduction), not the science.
    Stoichiometry corrected to exactly match v2ecoli's current (v11) reaction
    network -- same citations: fliN 1->111 (PMC10128058), fliG 26->34, fliP:fliQ:fliR
    1:1:1->5:4:1 (Kuhlen et al. 2018), flhA 1->9 (PLOS One 10.1371/journal.pone.0252800),
    flgH/flgI/motA/motB/flgB/flgC/flgF/flgG/fliE/flgK/flgL all corrected from -1
    placeholders, fliF added to the C-ring reaction (MS-ring ordering fix), and
    the C-ring->export-apparatus->motor-complex hierarchy fixed to match v2ecoli's
    real assembly order (Minamino & Namba 2008; Chevance & Hughes 2008).
  evidence:
    observed: "Direct line-by-line comparison of every reaction's '# Subunits:' summary against v2ecoli's current complexation_reactions_added.tsv/complexation_reactions_modified.tsv confirmed an exact match."
    expected: "n/a -- literature-grounded correction + ownership move, not itself a hypothesis test."

- id: flagella-04-real-rate-constant-and-flic-exclusion
  kind: computational
  status: confirmed
  statement: >-
    (2026-08-12, same day) k_bind was an arbitrary placeholder (5e-1, no
    citation). Replaced with a real, literature-measured association rate
    constant for FlhA<->FlhB binding (k_on=8.5e4 M^-1 s^-1, McMurry et al. 2015
    PLOS One, doi:10.1371/journal.pone.0134884, Salmonella biosensor data),
    converted to stochastic units (k_stoch = k_on / (N_A * V), V=1fL standard
    E. coli convention) -- used both for that specific interaction and as the
    literature-grounded proxy default for every other binding step (no
    per-interaction kinetics exist in the literature for the others; searched
    directly, confirmed only structural characterization exists for the C-ring
    specifically). k_off (0.09 s^-1, same paper) is real but currently unused --
    this generator only emits irreversible rules.
    Separately: fliC/filament elongation was briefly set to -5000 (matching
    v2ecoli's target_length) and immediately hit the SAME combinatorial
    explosion v2ecoli itself solved -- 237 rules ballooned to 5,588 (486 KB)
    from FliC alone. Excluded from this model entirely rather than
    reimplementing v2ecoli's incremental elongation logic redundantly; the
    'flagellum reaction' endpoint here represents hook-basal-body complete,
    not a filament-bearing organelle. Real fix (588 rules, 64 KB) deferred:
    reuse v2ecoli's existing flagella_filament_elongation.py when real WCM
    coupling happens.
  evidence:
    observed: "Rule count confirmed via direct regeneration: 5,588 rules with fliC=-5000, 588 without. k_bind confirmed in generated BNGL parameters block: 1.411491e-04."
    expected: "n/a -- design decisions, not a hypothesis test."

- id: flagella-04-first-real-run-nucleation-too-frequent
  kind: computational
  status: confirmed
  statement: >-
    (2026-08-12, same day) First actual NFsim run of the corrected model
    (installed pbg-nfsim + bionetgen into v2ecoli's venv for the first time
    this investigation -- both untouched dependencies before now). 600s and
    2400s test runs: real simulation, real reaction events fired (98 and 256
    respectively), but ZERO complexes completed at any stage. Root cause:
    the ORIGINAL per-reaction nucleation rate formula (target_propensity/
    combinatorial, independent of k_bind) let new scaffolds nucleate far
    faster than any existing one could finish, given the now much larger real
    stoichiometry -- species diversity kept growing (31->34+ unique species)
    while nothing ever completed: many partial scaffolds competing for a
    finite monomer supply, none winning. This is the SAME real biological
    principle already established for v2ecoli's own flagella_filament_nucleation.py
    (Chang, Sung & Hong 2025, existing structures preferentially absorb
    material over nucleating new ones) -- just not yet applied here.
  evidence:
    observed: "4,530 total reaction events over a 2400s run, final assembly state all zeros, species count growing (31 then 34 unique species read from two successive NFsim sub-invocations)."
    expected: "n/a -- diagnostic finding, not a hypothesis test."

- id: flagella-04-nucleation-rate-fixed-real-assembly-confirmed
  kind: computational
  status: confirmed
  statement: >-
    (2026-08-12, same day) Fixed by tying nucleation rate to a small, FIXED
    fraction of k_bind (NUCLEATION_SUPPRESSION_FACTOR=1000, a design-level
    ratio choice -- no per-sub-assembly literature rate exists -- chosen to
    be qualitatively "much rarer than ordinary binding," same spirit as
    v2ecoli's real nucleation_rate but not a directly measured value) instead
    of the old target_propensity-based formula. Verified this is mechanistically
    correct with a REAL run: at 2400s, total events dropped from 4,530 to 2,309
    (fewer wasted nucleations) but still zero completions -- because even the
    SIMPLEST reaction (flhDC, needing only 2 free FlhC) isn't expected to
    nucleate even once within 2400s at this suppression level (calculated
    directly: free_flhC only reaches ~48 by then). Extended to realistic
    multi-hour timescales instead of loosening the suppression factor (a
    deliberate choice -- real flagellar assembly is genuinely slow, and
    this investigation already established that in the real WCM too):
      8 hours (28,800s): flagellar_export_apparatus 0->4 complete -- FIRST
        real completion of any stage, ever, in this model.
      48 hours (172,800s), same 1200s chunk size: flagellar_export_apparatus
        standing at 29 (many more produced+consumed), flagellar_motor 0->930,
        782,496 total reaction events. Real, at-scale assembly confirmed
        working exactly as intended.
  evidence:
    observed: "Direct reruns at 2400s, 28800s, and 172800s (chunked at 1200s), each showing progressively more real assembly -- see charts/01_nfsim_assembly.svg and charts/02_nfsim_assembly_stacked.svg (latest run)."
    expected: "Rare nucleation should let existing scaffolds dominate finite monomer supply, producing real completions given enough simulated time -- confirmed."

- id: flagella-04-hook-stuck-chunking-discards-scaffold-state
  kind: computational
  status: resolved
  statement: >-
    (2026-08-12, same day) Despite export apparatus and motor complex both
    working at real scale (930 motor complexes by 48 hours), flagellar_hook
    stayed at exactly 0 across every chunked run tried (2400s, 28800s,
    172800s all at various chunk sizes). Root cause CONFIRMED (not guessed):
    pbg_nfsim's NFSimProcess re-invokes a fresh, independent BioNetGen/NFsim
    subprocess for every complexation_interval chunk, and its own docstring
    states plainly: "Growing intermediates with counter states are not
    seedable and are lost between steps." Only simple molecules (free
    monomers, and fully-completed complexes) persist across chunk boundaries
    -- any Growing_X scaffold must nucleate AND fully complete within a
    SINGLE chunk's invocation to ever register, since progress can't
    accumulate incrementally across chunks the way monomer supply does.
    CONFIRMED the reaction network itself is not the problem: an isolated,
    unchunked standalone test (just FlgE production + the hook reaction,
    bypassing the wrapper entirely, run as ONE continuous 200,000s BioNetGen
    call) produced 1,904 complete hooks, first one by t=4000s. The
    mechanism is real and correct; something about how it interacts with
    pbg_nfsim's chunking specifically prevents hook from completing.
    Motor's apparent success is explained by its nucleation rule consuming
    'flagellar_export_apparatus' directly (a persisting, simple/complete
    species) as one of its two nucleating reactants -- so once enough
    export apparatus had accumulated across earlier chunks, motor's
    nucleation could fire almost immediately at the START of any given
    chunk, leaving most of that chunk's window for its ~178 sequential
    binds. Hook's nucleation (flgE()+flgE()) has no such head start.
    Tested whether giving hook MORE time per chunk helps: a SINGLE giant
    172,800s chunk (no chunking at all, closest to the isolated test's
    structure) unexpectedly made EVERYTHING worse -- export apparatus and
    motor, which reliably completed with 1200s chunks, also dropped to
    zero. This rules out "just needs a longer continuous window" as the
    fix. Leading (defensible, not yet fully confirmed) explanation: no
    random seed is set anywhere in pbg_nfsim's wrapper code (confirmed by
    direct code read), so each chunk invocation is an independently-
    randomized stochastic trajectory -- many short chunks effectively run
    many INDEPENDENT stochastic attempts (an accidental ensemble), each
    with its own fresh chance at a rare nucleation event landing;  one
    giant chunk is only a single trajectory, a single roll of the dice,
    for the whole window. Under this explanation hook hasn't completed
    simply because it hasn't yet gotten lucky in the specific chunks run so
    far, not because it structurally can't -- a 96-hour run at the same
    1200s chunk size (double the independent attempts of the 48-hour run)
    was launched to test this directly.

    RESULT (same day): PARTIALLY confirms, partially complicates the
    explanation. flagellar_motor scaled almost exactly with trial count
    (930 at 144 chunks -> 2,025 at 288 chunks, roughly 2x for roughly 2x
    the independent attempts) -- strong support for the "many independent
    stochastic trials" mechanism being real. But flagellar_hook stayed at
    EXACTLY 0 across both 144 and 288 chunks (1,606,993 total reaction
    events in the 96hr run). If hook had any meaningful nonzero per-chunk
    success probability like motor does, some nonzero count would be
    expected by now. This is a stronger, more specific signal than "just
    hasn't gotten lucky yet" -- something appears to make hook's per-chunk
    completion probability far lower than motor's, not just lower. Current
    best (unconfirmed) lead: motor's nucleation rule consumes an
    already-abundant, persisting COMPLETE species (flagellar_export_apparatus)
    as one of its two nucleating reactants, giving it a "head start" every
    chunk; hook's nucleation (flgE()+flgE()) has no such head start and
    must build its own initial momentum from scratch inside every single
    chunk, however abundant free_flgE has become by that point in the run.

    RESOLVED (same day, later): implemented option (b) from the
    recommendation below -- patched pbg_nfsim's NFSimProcess (upstream
    tool, not this study's model) to stop discarding Growing_X scaffold
    state between chunks. It now reads BNG's own end-of-run `.species`
    file (which lists every distinct species, including every partial
    scaffold occupancy state, with its exact count -- not just the
    aggregate named observables) and re-seeds that exact population as
    literal BNGL seed species on the next chunk, via a new
    `scaffold_species` port (`overwrite[map[float]]`) alongside the
    existing `observables` delta port. Verified end-to-end on the same
    isolated hook reaction used above, driven through the real
    NFSimProcess.update() loop at the SAME 1200s chunk size that
    previously produced 0 completions in the full model: with FlgE
    production throttled to require many chunks (k_prod slowed 100x so
    the isolated hook could not possibly complete within a single chunk),
    scaffold_species instance counts grew and PERSISTED across chunk
    boundaries (0 at chunk 0, 4 at chunk 20, still present at chunk 32)
    and the hook completed at chunk 32 (t=39,600s) -- genuinely requiring
    33 separate chunked update() calls to accumulate the needed state,
    something structurally impossible under the old wrapper regardless of
    how many chunks were run (confirmed: 0 across 432 chunks in the real
    96hr run).

    CONFIRMED ON THE FULL MODEL (same day, later still): re-ran
    run_nfsim_assembly.py --seconds 28800 --sample 1200 (8 simulated
    hours, only 24 chunks -- a fraction of the 96hr/288-chunk run that
    previously produced exactly 0 hooks) through the fixed wrapper. Also
    had to add explicit 'scaffold_species' input/output wiring to
    make_production_document()'s complexation process spec (this study's
    generate_flagella_bngl.py) -- the fixed process class alone wasn't
    enough, since the composite document only routed the 'observables'
    port to a store; without wiring 'scaffold_species' to a store too
    (['scaffold']), the new port existed but nothing carried its value
    between successive step invocations, so the old bug persisted even
    with the fix installed until this wiring gap was closed. With both
    pieces in place: flagellar_hook=255 and, notably, flagella (the
    hook-basal-body-complete terminal stage)=3 -- the terminal stage had
    never been observed to complete at all before this fix, at any
    chunk count or duration tried this session.

    LONGER RUN (same day, later still): 48 simulated hours (144 chunks,
    --seconds 172800 --sample 1200 -- the SAME chunk size/count as the
    pre-fix run that produced exactly 0 hooks) now gives flagella=1196
    (cumulative complete count), motor=140, hook=497 (current standing
    pools, both consumed and replenished over the run, hence lower than
    the cumulative flagella total). At 8 simulated hours the first
    flagellum didn't complete until t~380min and only 1 had formed by
    the end of that window -- completion is a late, then-compounding
    event once export apparatus/motor/hook are all flowing steadily,
    which the fix is what newly allows. Also added a small-multiples
    chart (charts/03_nfsim_assembly_small_multiples.svg, one panel per
    stage with its own y-axis) since the original stacked/overlaid views
    make hook's large standing pool visually swallow the much smaller
    motor/flagella curves -- motor (not hook) is the actual bottleneck on
    completion rate: the terminal reaction needs 1 motor + 1 hook + 11
    flgL + 11 flgK + 5 fliD per flagellum, and motor is by far the
    slowest of those to produce (9x FlhA plus the full export-apparatus
    chain upstream of it), so hook piles up waiting on motor supply
    rather than being itself limiting.

    CAVEAT, IMPORTANT (same day, later still): the flagella=1196 (48hr)
    and flagella=1/3 (8hr) counts above are NOT biologically meaningful
    and should not be read as WCM predictions. Two compounding reasons:
    (1) monomer supply in this standalone composite comes from
    default_production_rates() (see generate_flagella_bngl.py), whose
    own docstring states the rule plainly: "produce enough monomers for
    1 flagellum per 100s" -- an arbitrary placeholder with no connection
    to real transcription/translation kinetics, not a literature-derived
    rate. Over 172,800s that's a theoretical ceiling of ~1,728
    flagellum-equivalents of monomer, and 1,196 completions is simply
    the network running close to that self-imposed ceiling. (2) this
    composite (flagella_nfsim_assembly.py / run_nfsim_assembly.py) is
    entirely standalone -- NOT coupled to the real v2ecoli WCM in any
    way. No flagella_regulation, no ParCa, no transcription, no cell
    mass, and critically NO DIVISION: it is one continuous run
    accumulating monomers/complexes in a single pot for the full
    simulated duration, as if one cell ran forever without ever
    dividing. Real E. coli divides roughly every 20-60min and carries
    ~5-10 flagella per cell (peritrichous), not hundreds -- a 48hr
    span with zero divisions modeled is itself a large, separate source
    of inflation on top of the placeholder monomer rate, since a real
    lineage would redistribute/reset material at every division rather
    than accumulate in one pot indefinitely. What IS established and
    real: the scaffold-persistence engineering fix itself (see RESOLVED
    note above), which is orthogonal to and unaffected by either of
    these caveats. Next step (see task #33): couple monomer inputs to
    real WCM transcription/translation output and wire this into a
    divide-capable composite before quoting any absolute flagella count
    as a biological result.
  evidence:
    observed: "NFSimProcess.update() (pbg_nfsim/processes.py) confirmed to build a FRESH temp BNGL file and call bionetgen.run() independently every invocation, with deltas computed only from that invocation's own gdat[name][-1] -- no explicit seed parameter anywhere in the file. Isolated unchunked test: 1,904 complete hooks by t=200,000s (chart not yet saved -- ad hoc scratch diagnostic). Chunked 48hr run (144 chunks): 0 hooks, 930 motor, despite 782,496 total events. Chunked 96hr run (288 chunks): 0 hooks, 2,025 motor, 1,606,993 total events. Single 172,800s chunk: 0 for every stage including previously-working ones. AFTER FIX: isolated hook test through the real (patched) NFSimProcess.update() loop, same 1200s chunk size, k_prod throttled 100x so completion needs many chunks: scaffold instance count grew and persisted across chunk boundaries (0 -> 4 -> 3, never resetting) and hook completed at chunk 32/t=39,600s. Full model, run_nfsim_assembly.py --seconds 28800 --sample 1200 (24 chunks, vs. 288 chunks that produced 0 before): flagellar_hook=255, flagella=3 (terminal stage, never observed before this fix)."
    expected: "Resolved. Root cause (scaffold state discarded between chunks, both in the process class and in the composite's port wiring) directly matches the observed symptom (hook -- the stage requiring the deepest scaffold accumulation, 120 sequential binds -- was the one that never completed), and the fix produces the predicted result on both the isolated reaction and the full model."
  recommendation: |
    UPDATE (same day, later): option (b) below was implemented in
    pbg_nfsim and verified working on the isolated hook reaction -- see
    RESOLVED note above. Still needs a rerun of the FULL flagella model
    through the fixed wrapper, and a decision on whether to contribute
    the fix upstream to pbg_nfsim or keep it as a local editable-install
    patch v2ecoli depends on.

    Original analysis, kept for context: flagged clearly as an open
    engineering question in pbg_nfsim's chunking design, separate from
    the (confirmed correct) reaction network itself, which the isolated
    test proves works.
    Practical implication: THIS wrapper's chunked architecture is poorly
    suited to rare, multi-hundred-step completion chains that lack an
    already-abundant "seed" species to nucleate from, without either
    (a) a fundamentally different (much less aggressive, reaction-specific
    rather than uniform) nucleation rate for reactions like hook that start
    entirely from a single monomer species, (b) explicitly tracking and
    re-seeding Growing_X scaffold state across chunks (a real change to
    pbg_nfsim's NFSimProcess, since it currently treats all counter-state
    species as categorically unseedable), or (c) a wrapper architecture
    that runs ONE continuous NFsim process across the whole simulated
    window with proper mid-simulation state extraction instead of
    independent re-invocations per interval. All three are real changes to
    pbg_nfsim itself or to this model's rate design, out of scope for a
    same-day fix -- worth a decision on priority before further work.

