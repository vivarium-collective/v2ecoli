  - topic: gating discipline
    note: |
      Rashmi (2026-05-29): "do not attempt next studies until the first two pass and
      are validated." dnaa-0 + dnaa-1 PASS; dnaa-2 is QUALIFIED (strict per-gen band
      not clean on the on-disk run). dnaa-3 is being prepared/designed for review, not
