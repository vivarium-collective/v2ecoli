schema_version: 2
name: transcription-rewiring
title: Transcription rewiring — promoter-resolved transcription
created: '2026-09-01'
status: planning

question: >-
  Does resolving transcription by promoter rather than by transcription unit
  fix DnaG production, and with it the multi-generation replication arrest that
  appears once initiation has to acquire real replisome subunits?

hypothesis: >-
  The arrest is not a replication defect. It is a transcription defect that
  surfaces at the replisome. ParCa deduplicates transcription units by gene
  tuple, so the three promoters of the rpsU-dnaG-rpoD operon collapse into one
  TU. Regulation measured at one promoter is then applied to all of them, and
  dnaG is transcribed under the wrong regulatory context. DnaG falls far enough
  below its true abundance that replisomes cannot be assembled, and a lineage
  run with mechanistic_replisome=True arrests at a reproducible generation.
  Separating promoters from transcripts should restore DnaG without
  special-casing the operon.

description: >-
  Ordered as a causal chain, so each link is falsifiable on its own rather than
  standing or falling with the conclusion:

  1. mechanistic_replisome=True arrests a 12-generation lineage at a
  reproducible generation; the permissive setting does not.
  2. The arrest coincides with DnaG depletion, not with a shortage of some
  other replisome subunit.
  3. The model's DnaG abundance is low against independent proteomics
  (Schmidt 2016, Soufi 2015, Mori 2021, Li 2014), not merely low against one
  dataset.
  4. The cause is architectural — a transcription unit serves as both promoter
  and transcript, so operons with several promoters need several transcript
  species whose physical properties no measurement constrains.
  5. Promoter-resolved transcription restores DnaG and the lineage survives 12
  generations.

  Link 4 is the contribution. Links 1-3 establish that the architecture has a
  measurable cost; link 5 is the test.

studies:
- mechanistic-replisome-arrest
- replisome-gate-sufficiency
- dnag-production-deficit
executive:
  what_is_this: >-
    v2ecoli can normally start chromosome replication whenever it is due,
    because the model assumes the proteins that build a replisome are always on
    hand. Turn that assumption off — require the subunits to actually be
    present — and the cell line dies out after a few generations. This
    investigation asks why, and the answer appears to sit upstream of
    replication entirely: in how the model decides which stretches of DNA are
    transcribed, and under whose regulatory control.
  verdict: The replication arrest traces to DnaG, and DnaG is starved because its only transcript is never synthesised while its operon partners have alternatives -- so the transcription-unit architecture is implicated after all.
  verdict_status: in-progress
  verdict_detail: |
    Three studies, and the chain now closes end to end.

    Study 1 (mechanistic-replisome-arrest) reproduced the arrest but showed it was an
    artefact of the initiation gate testing == rather than >=: every subunit pool was in
    surplus. Its subunit-depletion hypothesis was refuted as unmeasurable, not false.

    Study 2 (replisome-gate-sufficiency) corrected the operator and re-asked the
    question. The lineage still stalls, 8/8 seeds at generation 4-5, and DnaG is the
    only pool short at every stall. Removing DnaG from the gate's requirement restores
    12/12 generations, which makes it the binding constraint causally, not just
    correlationally.

    Study 3 (dnag-production-deficit) asked why DnaG is scarce. Its first answer was
    wrong and was corrected after an expert challenge: it had ranked a static ParCa
    parameter instead of measuring transcription during a run. Measured properly,
    TU00352 is synthesised ZERO times per generation and its mRNA is absent at 100% of
    timesteps. dnaG depends on that transcript alone; rpsU also has TU0-14460 and rpoD
    also has TU00472, and those ARE used (1 and 461 transcripts respectively). So dnaG
    receives nothing while its operon partners are supplied normally.

    That restores the investigation's founding thesis. The transcription-unit
    architecture is implicated: dnaG is stranded on a transcript the model never uses.
    Two questions decide the repair -- why an idx_rprotein TU draws zero synthesis, and
    whether the rpsU-promoter dedup is what removed dnaG's alternative transcripts.

    Two traps are recorded so they are not repeated. basal_prob does NOT govern
    idx_rprotein TUs (TranscriptInitiation overrides it), and rpsU/dnaG/rpoD do NOT
    share a single mRNA pool, so no 'operon internal control' may assume they do.
  decisions_needed:
  - >-
    Whether keying transcription initiation by promoter is an acceptable
    divergence from upstream vEcoli, which keys everything by transcription
    unit. AGENTS.md requires this to be justified explicitly rather than
    assumed.

  - Whether to patch the initiation gate from == to >= on this branch and re-run the paired arms before pursuing the transcription-unit link. Until the operator is fixed, the mechanistic arm tests the operator rather than subunit availability, so the DnaG question is not testable here.
  - "Whether to treat the never-synthesised TU00352 as the investigation's primary target: establish why an idx_rprotein TU receives zero synthesis, and whether the dedup removed dnaG's alternative transcripts."
scientific_argument:
  main_claim: >-
    A transcription unit cannot serve as both promoter and transcript without
    forcing ParCa to invent per-transcript physical properties that no
    measurement constrains; separating the two removes that class of error and
    restores DnaG production.
  evidence_for:
  - >-
    The input data has a fixed resolution structure. Only initiation is
    promoter-resolved (Thomason 2015 dRNA-seq TSS); abundance (RNA-seq TPM) and
    decay (half-life tables) are gene-resolved. Several transcript species per
    operon therefore introduces state no measurement can constrain.
  - >-
    Splitting promoter from transcript is exactly conservative — summing
    promoter-keyed synthesis probabilities back over each transcript reproduces
    the TU-keyed array to 8.7e-19 — so the change can be made without
    perturbing aggregate behaviour.
  - >-
    87.5% of transcripts (2881 of 3277) have exactly one promoter, so the split
    is a no-op for most of the model and does real work only on the 417 operons
    with more than one.
  evidence_against:
  - >-
    The transcripts a multi-promoter operon produces are not strictly identical.
    They share a 3' end but differ in 5' UTR length, by 23-289 nt in the operons
    examined. The 5' UTR carries the ribosome binding site and can affect both
    stability and translation, so treating them as one species is itself an
    approximation.
  - >-
    Keying regulation by promoter diverges from upstream vEcoli. The divergence
    looks defensible but it is a real cost and has not been agreed.
  key_figures: []
  caveats:
  - >-
    Every initiation share on this branch is uniform (1/N). The Thomason-derived
    ratios exist only on the plasmids branch and were deliberately not carried
    over; they need re-deriving as promoter data. Uniform is exactly
    conservative, so this does not bias the conservation result, but the model
    carries no promoter-level measurement yet.
  - >-
    Earlier evidence for this chain came from a branch that also removed four
    Covert-lab regulation workarounds and added a dedup exemption. None of that
    is present here. Anything observed on this branch is attributable to the
    split alone — which is the point — but it also means earlier numbers cannot
    be quoted as if they were produced here.

acceptance_criteria:
- study: mechanistic-replisome-arrest
  behavior: lineage-arrests-under-mechanistic-replisome
inputs:
  references:
  - bib_key: schmidt2016
    title: Schmidt et al. 2016 -- quantitative E. coli proteome
    kind: dataset
    role: DnaG validation (reads 6 copies; the low outlier of the four)
    local_path: ~/Documents/Proteomics data/schmidt et al 2016
    used_by: scripts/proteome_compare.py (Table S6)
    status: provided
  - bib_key: soufi2015
    title: Maeck/Soufi et al. 2015 -- E. coli proteome
    kind: dataset
    role: DnaG validation (53 copies)
    local_path: ~/Documents/Proteomics data/maeck et al 2015
    used_by: scripts/proteome_compare.py (sheet S2)
    status: provided
  - bib_key: mori2021
    title: Mori et al. 2021 -- absolute proteome mass fractions
    kind: dataset
    role: DnaG validation (66 copies)
    local_path: ~/Documents/Proteomics data/mori et al 2021
    used_by: scripts/proteome_compare.py (EV9)
    status: provided
  - bib_key: li2014
    title: Li et al. 2014 -- ribosome profiling / translation efficiency
    kind: dataset
    role: DnaG validation (98 copies) AND the source of the translation-efficiency ParCa input this study identifies as the anomalous step -- so it is both a validation set and a model input, and must not be treated as independent confirmation of the quantity it parameterises
    local_path: ~/Documents/Proteomics data/Li et al 2014
    used_by: scripts/proteome_compare.py; ParCa translation_efficiencies
    status: provided
  notes: |
    Proteomics datasets live outside the repo in the user's local archive; paths are
    recorded rather than the data vendored. scripts/proteome_compare.py in the sibling
    v2ecoli checkout reads all four.

    The four-dataset median matters: Schmidt alone reads DnaG at 6 copies where the
    others read 53-98, so a single-dataset comparison inverts the conclusion.
