schema_version: 2
name: parameter-uq
title: "Parameter UQ — global sensitivity of v2ecoli"
created: '2026-06-12'
status: running

question: |
  Which sim_data parameters drive variance in v2ecoli single-cell observables?
  Starting with the ribosome-elongation subsystem, forward uncertainty
  quantification (PCRV-sampled PCE surrogate + analytic Sobol indices) identifies
  which elongation knobs most control mass/growth variance, setting a template for
  a systematic global-sensitivity sweep across the full parameter space.

hypothesis: |
  Among ribosome-elongation parameters, the energetic cost of elongation
  (gtpPerElongation) — not raw elongation speed — is the dominant lever on
  single-cell mass/growth, because GTP availability couples translation to the
  cell's energy budget. Forward UQ should surface a single dominant driver
  (total-order Sobol ≥ 0.5) rather than a diffuse, evenly-shared sensitivity.

executive:
  what_is_this: |
    A forward UQ investigation using the pbg-uq package to identify dominant
    sources of parameter-driven variance in the v2ecoli whole-cell baseline.
    Each study samples a set of sim_data parameters from a uniform prior, runs
    per-sample baseline simulations (1 generation, XArray emitter), fits an
    order-2 Polynomial Chaos Expansion (PCE) surrogate via PyTUQ, and extracts
    analytic Sobol sensitivity indices. The first study (param-uq-01-elongation)
    targets three ribosome-elongation parameters; subsequent studies will expand
    the analysis to other subsystems.
  verdict: |
    The forward-UQ pipeline (pbg-uq) is demonstrated end-to-end on the real
    v2ecoli baseline, but NO robust elongation-sensitivity ranking has been
    established yet. The hypothesis that GTP cost dominates is NOT supported: the
    earlier "gtpPerElongation ~0.88" reading was an artifact of an underdetermined
    fit (8 training samples < 10 PCE basis terms for order-2 over 3 params) and
    flips with the random seed. At an adequate budget (n=24, one clean replicate)
    the three knobs contribute comparably (total-order ribosome 0.60, gtp 0.50,
    basal 0.27) with large interactions, and cross-seed confirmation is blocked
    by an intermittent XArray-emitter bug.
  verdict_status: in-progress
  verdict_detail: |
    param-uq-01-elongation: pipeline feasibility PASSES; the biological
    sensitivity question is OPEN (gate blocked). Two blockers before a credible
    ranking: (1) an intermittent run_multigen_xarray warm-up shape-mismatch bug
    that zeros out observables for the rest of a process, corrupting ensembles;
    (2) an adequate, multi-replicate sample budget (n>=30, several seeds, and/or
    sparse bcs regression for the low-budget regime).
  decisions_needed:
  - question: Fix the emitter bug + run a robust n>=30 multi-seed ensemble before any sensitivity claim?
    context: |
      The current evidence cannot rank the elongation knobs. A defensible result
      needs the run_multigen_xarray shape bug fixed and a larger multi-seed budget.
  - question: Is this investigation worth pursuing as a biological result, or is it primarily a pbg-uq methods/feasibility demo?
    context: |
      The pipeline works; the open question is whether to invest the simulation
      budget to turn it into a trustworthy sensitivity map.

scientific_argument:
  main_claim: |
    The pbg-uq forward-UQ pipeline runs end-to-end on v2ecoli; a robust
    elongation-parameter sensitivity ranking is not yet established.
  evidence_for:
  - "Pipeline feasibility: PCRV -> per-sample baseline sim (XArray emitter) -> order-2 PCE (PyTUQ) -> analytic Sobol -> uq_report.html, demonstrated across multiple runs."
  - "At n=24 (one clean replicate, test rel-err 0.14) the three knobs are comparable (total-order ribosome 0.60 / gtp 0.50 / basal 0.27) — i.e. a result was computable when the budget was adequate."
  evidence_against:
  - "Under-determination at the demo budget: 8 training samples < 10 PCE basis terms -> the Sobol indices are unreliable and the dominant driver flips by seed (gtp @ seed 42 ~0.88 vs ribosome @ seed 0 ~0.70)."
  - "No robust single dominant driver at n=24; all three indices are comparable with large interaction effects (basal first-order 0.007 vs total 0.27)."
  - "An intermittent run_multigen_xarray warm-up shape-mismatch bug corrupted the n=24 seed-42 and seed-7 ensembles (test rel-err 1.7 / all-zero), blocking cross-seed confirmation."
  key_figures: []
  caveats:
  - "No trustworthy figures yet — figures will be rendered only from a robust, bug-free ensemble."
  - "Scope is three elongation knobs under the baseline glucose condition; not yet a full-parameter-space sweep."

at_a_glance:
- study: param-uq-01-elongation
  role: "Demonstrates the forward-UQ pipeline on v2ecoli; finds the elongation sensitivity ranking is NOT yet robust (under-budget + emitter bug)."

biological_story: |
  Translation is one of the cell's largest energy sinks, so it is natural to ask
  which elongation dial most shapes how much a cell grows. This investigation set
  out to answer that with forward uncertainty quantification. The honest status,
  though, is methodological: the pipeline runs end-to-end on the whole-cell model,
  but the first answer it produced ("GTP cost dominates") turned out to be an
  artifact of too few samples — with only 8 training points for a 10-coefficient
  surrogate, the fit is underdetermined and the apparent winner changes with the
  random seed. With more samples the three knobs look comparable, and an
  intermittent simulation bug prevented a clean cross-check. So the biological
  question — which elongation parameter, if any, dominates mass/growth variance —
  remains open, pending a fixed emitter and a larger, repeated sampling budget.

studies:
- param-uq-01-elongation

acceptance_criteria:
- study: param-uq-01-elongation
  behavior: single-elongation-knob-robustly-dominates
