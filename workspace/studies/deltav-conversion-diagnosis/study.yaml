implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Reproduce deltaV from r_vector, and identify what the fit was constrained to.
  detail: 'calculateRnapRecruitment (fit_sim_data_1.py:4022) reads deltaV from r[col_names_to_index[rnaIdNoLoc
    + ''__'' + tf]] and basal_prob from the matching ''__alpha'' column, where r = cell_specs[''basal''][''r_vector''],
    set at line 3705. The fold changes enter far upstream (lines ~758, 874, 3879) as constraints on that
    fit, NOT through any direct formula. So the question is not ''what transform is wrong'' but ''what
    was the regression asked to satisfy, and is deltaV/basal_prob the quantity that answers it''. req-1
    is to reproduce the stored deltaV from r_vector (axis 1) and to read the fit''s objective -- what
    residual it minimises and in what space -- WITHOUT yet evaluating fidelity.


    RESOLVED. r_vector (4739,) and r_columns both recover from models/parca/parca_state.pkl.gz -> cell_specs[''basal''],
    so NO ParCa re-run is needed and the main scoping risk is closed. Replaying calculateRnapRecruitment''s
    indexing reproduces 979 of 979 stored deltaV entries within 1e-9 relative and 100% of basal_prob.
    Only 3 TUs had a negative fitted alpha clipped to zero.'
- id: req-2
  status: complete
  blocking: true
  summary: State the candidate correction BEFORE measuring its effect.
  detail: 'The two repair axes are only meaningful if the correction is specified in advance. Once req-1
    identifies what the fit optimises, the candidate correction must be written into this study''s record
    BEFORE recomputing anything, otherwise ''the correction that restores fidelity'' is chosen by fitting
    to the answer. This requirement exists because that is precisely how studies 13-15 leaked: numbers
    measured during scoping could only be recorded post-hoc.


    SATISFIED: the candidate diagnosis and BOTH correction options are recorded in the candidate_diagnosis
    block above, with their predictions, before any fidelity measurement.'
- id: req-3
  status: not_started
  blocking: false
  summary: Reuse the join from foldchange-to-delta-fidelity.
  detail: The TF-target join (564 entries, with unjoined counts) is already implemented in that study's
    analyses/measure.py. Import it rather than re-deriving, so corrected and uncorrected fidelity are
    measured over an identical entry set.
alternative_hypotheses:
- name: H1 fit residual
  discriminator: candidate-explains-magnitude-uniformity
  statement: 'deltaV is a least-squares coefficient, not an encoding, so the distortion is fit error:
    the regression cannot satisfy all constraints simultaneously and distributes the residual. Predicts
    magnitude-uniform, sign-asymmetric distortion -- consistent with BOTH inherited constraints, which
    makes it the leading candidate a priori.'
- name: H2 space mismatch
  discriminator: candidate-explains-magnitude-uniformity
  statement: 'The fit works in log space while the runtime applies delta additively in probability space.
    DISFAVOURED a priori: this predicts error growing with |log2FC|, and foldchange-to-delta-fidelity
    measured 1.166 strong-vs-weak. Recorded so the refutation is explicit rather than assumed.'
- name: H3 negative-basal clipping
  discriminator: negative-basal-clipping-is-not-the-cause
  statement: basal_prob[basal_prob < 0] = 0 clips the intercept without clipping deltaV, so entries on
    clipped TUs get a delta divided by a zeroed basal. Cannot be the general cause -- dnaG's basal is
    1.2128e-04 and unclipped -- but may explain a subset, including some of the six negative-probability
    entries.
- name: H4 the fit is faithful and the comparison is wrong
  discriminator: conversion-path-reproduces-the-cache
  statement: 'deltaV/basal_prob is simply not the quantity 2**log2FC describes -- the regression targets
    a promoter-bound probability under a different baseline, and foldchange-to-delta-fidelity compared
    incommensurable numbers. This would make the ''defect'' an artefact of that study rather than of ParCa,
    and it must be taken seriously: it is the hypothesis under which this investigation''s last two studies
    are wrong.'
falsifiability: 'H4 is included deliberately: it is the hypothesis under which this investigation''s own
  recent conclusions are the error, and it is discriminated by reading what the fit was constrained to
  rather than by any measurement this study could tune. The two repair axes prevent a diagnosis that explains
  the symptoms without fixing the numbers, and req-2 forces the candidate correction to be stated before
  its effect is measured.'
assumptions:
- assumption: The cache's delta_prob came from calculateRnapRecruitment on this r_vector.
  basis: Asserted from source but NOT yet verified against the cache, which is exactly what axis 1 checks
    before anything downstream is trusted.
  risk: low
- assumption: 2**log2FC remains the right comparison for a corrected deltaV.
  basis: Inherited from foldchange-to-delta-fidelity and NOT independent of it. If H4 holds, this assumption
    is false and the corrected-fidelity axes are measuring the wrong thing -- which is why H4 is discriminated
    by reading the fit's objective rather than by these axes.
  risk: high
simulation_set: []
planned_runs:
- name: static-parca-analysis
  status: planned
  n_steps: 0
  details: NO SIMULATION. Reads the ParCa cache (fingerprint ea05ac9b23b1d843), r_vector via cell_specs
