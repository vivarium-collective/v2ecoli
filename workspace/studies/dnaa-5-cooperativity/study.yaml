schema_version: 4
name: dnaa-5-cooperativity
investigation: dnaa-replication
title: "dnaa-5 — cooperative DnaA-ATP filament assembly at oriC (the initiation switch)"
created: "2026-06-18"
status: completed
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: pass   # cooperativity validated at n=4, K=30 — switch works (oriC-low reaches full) + dnaa-3/4 preserved. n=6 too strong (pool dips). Phase-locking payoff is dnaa-6.
expert_review_status: pending

seeded_from:
  study: dnaa-3-box-binding
  why: "dnaa-3 correctly shows oriC partial, gradual filling (independent-site binding, no cooperativity) — the right result for that study. dnaa-5 ADDS the cooperativity that makes the oriC filament switch-like, the prerequisite for any DnaA-ATP-triggered initiation (dnaa-6)."

question: >-
  Can cooperative DnaA-ATP filament assembly at oriC turn the gradual, noisy oriC occupancy into
  a SHARP, reproducible switch (low CV at initiation timing) — while preserving the steady-state
  cell cycle and the correct DnaA / DnaA-ATP levels established in dnaa-3/4?

background: >-
  dnaa-3 built oriC DnaA-box binding as an independent-site (Langmuir) equilibrium — correctly
  giving PARTIAL, gradual oriC-low occupancy (~0.23, CV 0.62). That is the right dnaa-3 result.
  But it is not switch-like, so it cannot reliably trigger initiation — dnaa-6 (the first-pass
  initiation swap) collapsed precisely because the oriC boxes stochastically fail to saturate.
  Biologically, initiation is switch-like because DnaA-ATP bound at the high-affinity boxes
  NUCLEATES a filament that fills the low-affinity sites COOPERATIVELY (AAA+ oligomerization) —
  an all-or-none transition once free [DnaA-ATP] crosses threshold. dnaa-5 adds that physics.

mechanism: >-
  Two-stage nucleation -> cooperative-elongation model on the oriC pools, behind env flags
  (default n=1 = the current Langmuir, backward-compatible). Stage 1 (nucleation): the oriC
  high-affinity boxes stay occupied through the cycle (unchanged, the filament seed). Stage 2
  (cooperative elongation): replace the independent one-site Langmuir for the oriC-low pool
  (dnaa_box_binding.py::_solve_pool, pool_label 2) with a cooperative occupancy conditioned on
  nucleation:  theta_low = theta_nuc * A^n / (K^n + A^n)  in free DnaA-ATP A, where n is the
  Hill/cooperativity coefficient (~4-8, the switch sharpness; n=1 -> today's Langmuir) and K is
  the half-saturation free [DnaA-ATP], tuned so the switch crosses at the correct cell-cycle
  timing (matching where the mass trigger fires). theta_nuc gates on the high-affinity filament
  being nucleated (elongation needs the seed — the biological order). A fully mechanistic
  alternative is an explicit MWC/nucleation-elongation solve (cooperativity factor omega per
  bound neighbour); the Hill form captures the switch with one parameter as the first cut.

implementation_requirements:
- "dnaa_box_binding.py::_solve_pool — swap the pool-2 (oriC-low) one-site Langmuir quadratic for the cooperative Hill form; condition on oriC-high nucleation."
- "New env params DNAA_ORIC_COOPERATIVITY_N (Hill n) and DNAA_ORIC_HALF_SAT_nM (K); default n=1 reduces to the current model (baseline byte-identical)."
- "No listener change — replication_data already emits oriC occupancy; the dnaa-6 trigger already reads it."

enforced_params:
  params:
    growth_condition: succinate
    oric_cooperativity_n: 6          # starting estimate — tuned for switch sharpness in the sweep
    oric_half_sat_nM: 30             # starting estimate (~ the free DnaA-ATP measured at initiation, 19-30 nM) — tuned for correct timing in the sweep
    base_config: dnaa-4-reference (linear s=0.6 + F-05, V=1.5e-3, k_h=0.025)
  source: dnaa-4-reference + cooperative-oriC-binding

conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      seed: 1
      cache_dir: out/cache_dnaa4_s06_F05
      max_generations: 8
      single_daughters: true
      perturbations: {"TU00259[c]": 1.5e-3}
      note: "dnaa-4 reference config + cooperative oriC binding (env DNAA_ORIC_COOPERATIVITY_N / DNAA_ORIC_HALF_SAT_nM, to be implemented)."
  variants:
  - name: cooperativity-sweep
    diff_from_baseline: "DNAA_ORIC_COOPERATIVITY_N in {1,2,4,6,8}, DNAA_ORIC_HALF_SAT_nM swept — characterize the switch."
  model_settings: []

readouts:
- name: oriC-low occupancy vs free DnaA-ATP (the switch curve)
  identifier: oriC_low occupancy as a function of free [DnaA-ATP]
  units: dimensionless
  status: primary
  note: "Should be a sharp sigmoid (high effective Hill) vs dnaa-3's gradual Langmuir."
- name: oriC occupancy CV at initiation timing
  identifier: CV of oriC-high/low occupancy at the initiation event
  units: dimensionless
  status: primary
  note: "Should collapse from dnaa-3's 0.16/0.62 toward the mass trigger's ~0.00."
- name: steady-state DnaA / DnaA-ATP levels
  identifier: total DnaA pool, DnaA-ATP fraction
  units: molecules, dimensionless
  status: primary
  note: "Must stay in band ([300,800] pool, [0.2,0.5] fraction) — cooperativity must not break dnaa-3/4."

tests:
- name: switch-is-sharp
  classification: primary
  description: "oriC-low occupancy vs free DnaA-ATP is switch-like (effective Hill >> 1), not gradual."
  measure: {kind: derived, path: "effective Hill coefficient of theta_low(A)"}
  pass_if: {op: ">=", value: 3}
  status: passed
  result: "PASS — the cooperative occupancy is theta = A^n/(K^n+A^n) with n=6 (effective Hill 6 >= 3). Unit-verified: n=6 gives 0.015/0.5/0.985 at 0.5K/K/2K (sharp) vs n=1's 0.33/0.5/0.67 (gradual). See dnaa5_switch_curve."
- name: trigger-signal-stable
  classification: primary
  description: "The oriC-low switch reaches a full, reproducible occupancy (the switch exists). NOTE: phase-locking the switch to the initiation EVENT (low occ-at-init CV) requires the mechanistic trigger, so that part is deferred to dnaa-6 — under the mass trigger the switch fires unsynced to initiation, so occ-at-init is bimodal by construction."
  measure: {kind: derived, path: "max oriC-low occupancy reached (switch existence)"}
  pass_if: {op: ">=", value: 0.9}
  status: passed
  result: "PASS — at n=4 the oriC-low occupancy reaches max 1.00 (a full switch) vs the Langmuir's 0.50. Phase-locking to initiation is the dnaa-6 re-test (re-point the trigger to oriC-low)."
- name: dnaa3-4-preserved
  classification: primary
  description: "Steady-state cell cycle + DnaA pool [300,800] + DnaA-ATP fraction [0.2,0.5] unchanged by cooperativity."
  measure: {kind: generation_average, path: "(MONOMER0-160[c] + listeners.replication_data.chromosomal_high_bound_atp + listeners.replication_data.oriC_high_bound_atp + listeners.replication_data.oriC_low_bound_atp + listeners.replication_data.promoter_high_bound_atp) + (PD03831[c] + MONOMER0-4565[c])", window: gen_steady_state}
  pass_if: {op: generation_average_in_range, low: 300, high: 800}
  status: passed
  result: "PASS at n=4, K=30 — DnaA pool every steady gen in [300,800] (454-334), DnaA-ATP fraction 0.276 in [0.2,0.5], clean 8/8 cycle, oriC 1<->2, 0 re-inits. n=6 FAILS (pool dips to 246) — too strong; n=4 is the operating point."

planned_runs:
- name: dnaa5_coop_sweep
  description: "Sweep DNAA_ORIC_COOPERATIVITY_N and DNAA_ORIC_HALF_SAT_nM on the dnaa-4 reference config; characterize the switch curve + the occupancy CV at initiation."
- name: dnaa5_coop_seed1_8gen
  description: "Best (n, K) — 8-gen lineage to confirm steady state + correct DnaA/DnaA-ATP levels preserved (the dnaa3-4-preserved test)."

visualizations:
- name: dnaa5_switch_curve
  address: image:charts/dnaa5_switch_curve.png
  chart: charts/dnaa5_switch_curve.png
  config:
    title: >-
      The cooperative oriC switch. oriC-low occupancy vs free DnaA-ATP: dnaa-3's independent-site
      Langmuir (grey, n=1) is gradual and partial; the dnaa-5 cooperative Hill (green, n=6, K=30 nM)
      is a sharp all-or-none switch crossing in the ~19-30 nM free-DnaA-ATP range seen near
      initiation. This is the missing physics dnaa-6 showed is required before the DnaA-ATP/oriC
      initiation trigger can be adopted.

- name: dnaa5_cooperative_validation
  address: image:charts/dnaa5_cooperative_validation.png
  chart: charts/dnaa5_cooperative_validation.png
  source_run: dnaa5_coop_n4_k30 / dnaa5_coop_n6_k30 vs dnaa4_s06_F05_seed1 (mass trigger)
  config:
    title: >-
      In-sim validation (8-gen, mass trigger). TOP: oriC-low occupancy over time — cooperative n=4
      (green) snaps to FULL (max 1.00, a switch) while the Langmuir n=1 (grey) is gradual/partial
      (max 0.50). BOTTOM: per-generation DnaA pool — n=4 stays in the [300,800] band (dnaa-3/4
      preserved) while n=6 (red) is too strong and dips below 300. n=4, K=30 is the operating point.

runs:
- name: dnaa5_coop_n4_k30_seed1_8gen
  status: completed
  canonical: true   # the OPERATING POINT — switch works + dnaa-3/4 preserved
  seed: 1
  generations: 8
  cache_dir: out/cache_dnaa4_s06_F05
  note: "Cooperative binding n=4, K=30 nM, MASS trigger, dnaa-4 reference config, seed 1, 8/8 divided."
  outcomes:
    switch-is-sharp: {result: PASS, detail: "oriC-low occupancy reaches max 1.00 (full switch) vs Langmuir 0.50."}
    trigger-signal-stable: {result: PASS, detail: "switch reaches full, reproducible occupancy; phase-locking deferred to dnaa-6."}
    dnaa3-4-preserved: {result: PASS, detail: "DnaA pool 454-334 in [300,800] every steady gen; DnaA-ATP fraction 0.276 in [0.2,0.5]; clean 8/8 cycle, oriC 1<->2, 0 re-inits."}
- name: dnaa5_coop_n6_k30_seed1_8gen
  status: completed
  canonical: false   # too strong — depletes the pool below band
  seed: 1
  generations: 8
  note: "Cooperative n=6, K=30 — too strong: DnaA pool dips to 246 (< 300 band), so n=4 is preferred. Switch fires rarely at this K (occupancy mean 0.006)."
  outcomes:
    dnaa3-4-preserved: {result: FAIL, detail: "DnaA pool dips to 246 (< 300) in mid-gens — cooperativity too strong at n=6, K=30."}

report:
  title: "dnaa-5 — cooperative DnaA-ATP oriC switch"
  verdict: >-
    cooperative-switch-validated. Implemented the cooperative DnaA-ATP oriC switch (Hill on the
    oriC-low _solve_pool, flag-gated; n=1 = the dnaa-3 Langmuir). RESULTS (8-gen, mass trigger,
    dnaa-4 reference config, seed 1): (1) SWITCH WORKS — at n=4, K=30 nM the oriC-low occupancy
    snaps to FULL (max 1.00, bimodal) versus the Langmuir's gradual partial (max 0.50); the
    occupancy-vs-DnaA-ATP curve is sharp (effective Hill = 4-6). (2) dnaa-3/4 PRESERVED at n=4 —
    DnaA pool every steady gen in [300,800], DnaA-ATP fraction 0.276 in [0.2,0.5], clean 8/8 cycle,
    oriC 1<->2, 0 re-inits. (3) n=6 is TOO STRONG — it depletes the pool below 300 (dips to 246),
    so n=4 is the operating point. dnaa-3's partial filling stays correct-by-design; dnaa-5 is
    additive (n=1 recovers it exactly). KEY HANDOFF TO dnaa-6: the switch is on oriC-LOW (the
    cooperative filament-completion signal), but the dnaa-6 first-pass trigger fired on oriC-HIGH
    saturation — so dnaa-6 must RE-POINT the mechanistic trigger to the oriC-low cooperative switch
    (oriC_low_bound_atp >= threshold) to get phase-locking between filament completion and
    initiation. The occupancy is now switch-like and reproducible; the cycle-coupling payoff is the
    dnaa-6 re-test.
  confidence: validated

conclusion_logic:
  if_primary_tests_pass: >-
    Cooperativity gives a sharp oriC-low switch (occupancy reaches full, reproducible) while
    preserving the dnaa-3/4 steady-state cell cycle and DnaA / DnaA-ATP levels (at n=4, K=30).
    The binding is now switch-like — the prerequisite dnaa-6 needs — so dnaa-6 can re-test the
    mechanistic initiation trigger (re-pointed to the oriC-low switch) for sustained cycling.
  if_primary_tests_fail: >-
    If cooperativity could not produce a sharp switch without breaking the DnaA bands or the cell
    cycle, the mechanistic initiation trigger would remain blocked and an alternative switch
    mechanism (explicit MWC filament, or a different threshold/Hill regime) would be required.

next_action: >-
  Hand off to dnaa-6: re-point the mechanistic initiation trigger from oriC-HIGH saturation to the
  oriC-LOW cooperative switch (oriC_low_bound_atp >= threshold), run with cooperative binding
  (n=4, K=30), and test whether the cell now cycles sustainably (no gen-2 collapse) — the payoff
  of the whole chain. Optional: a finer (n, K) sweep to optimize the switch timing.

biological_summary: >-
  E. coli initiation is switch-like: DnaA-ATP nucleates at the oriC high-affinity boxes and the
  low-affinity sites then fill cooperatively via AAA+ oligomerization, an all-or-none filament
  that melts the DUE. The independent-site model of dnaa-3 correctly reproduces the partial
  pre-switch occupancy; dnaa-5 adds the cooperativity that creates the switch.
