- name: likelihood-dispersion-fit
  status: planned
  n_steps: (MLE)
  details: fit per-modality dispersion + CIs on held-out calibration data
- name: accumulator-numerical-stability
  status: planned
  n_steps: 10000
  details: 10⁴ test runs; zero underflows required
- name: abc-smc-synthetic-recovery
  status: scaffold-pilot-done
  n_steps: '30 particles × 3 rounds = 90 forward sims (~66s wall)'
  details: 'PILOT 2026-05-25. scripts/run_abc_smc_pilot.py runs a minimal iterated rejection-ABC with
    box-narrowing (NOT true SMC — no importance weights or transition kernel) on Millard with
    known-truth parameters. NOTE: the 2 inferred parameters are Millard COPASI kinetic parameters,
    unrelated to the PDMP jump processes this study is about. Setup: take 2 Millard kinetic parameters (PTS_4.kF, ENO.Vmax), generate
    "observations" by running Millard at default values, hide the true parameters, sample log-uniform
    priors around default ±50%, run 3 SMC rounds with top-25% acceptance. Round-by-round threshold:
    1.8e-4 → 1.8e-4 → 4.3e-5 (narrowing). Final-round min distance 5.5e-6. SCAFFOLD because: only 2 parameters,
    only 30 particles, only 3 rounds — full target is 100s of parameters + 1000s of particles + ≥8
    rounds. But the machinery works end-to-end + populates posterior-shrinks-with-data primary test
    with real data.'
- name: sbc-K1000-validation
  status: planned
  n_steps: 1000
  details: SBC pipeline; rank-histogram χ² uniformity (p > 0.05) + 90% CI ≥ 85% coverage (gating)
