        venue: v2ecoli
        target_slug: reactor_bird_coupled
        notes: Add medium byproduct-accumulation stores and a sim dissolved-O2 observable so the byproduct/DO axes become gradable.
      priority: 2
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
    - signature: pbg-bioreactor-fed-batch-support
      description: |-
        pbg-bioreactordesign has no fed-batch operations; the coupled runs are batch-prefix only. Reaching Beulig's 50-80 gDW/L fed-batch endpoint requires fed-batch feed operations upstream. Carried prior; routed to the upstream package (not a Beulig-scope deferral).
      axis: C
      provenance: carried_prior
      evidence:
        - source_kind: mandatory_findings_to_consider
          source_ref: mbp-06:pbg-bioreactor-fed-batch-support
      resolution_type: upstream_PR
      resolution_venue: pbg-bioreactordesign
      candidate_resolution:
        type: upstream_PR
        venue: pbg-bioreactordesign
        target_slug: pbg-bioreactor-fed-batch
        notes: Add fed-batch feed operations (multi-stream feeds, phase scheduling) to BiRDReactorProcess.
      priority: 1
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
    - signature: bird-o2-saturation-temperature-sign-bug
      description: |-
        pbg-bioreactordesign#2 — the dissolved-O2 saturation has the wrong temperature sign (masked at 298 K; biases c*(O2) high at the 310 K target). All arms compare against the same biased c* so the head-to-head is unaffected, but absolute DO magnitudes vs Beulig are biased until fixed upstream.
      axis: C
      provenance: this_investigation
      evidence:
        - source_kind: open_question
          source_ref: mbp-07:bird-o2-saturation-temperature-sign-bug
        - source_kind: external
          source_ref: pbg-bioreactordesign#2
      resolution_type: upstream_PR
      resolution_venue: pbg-bioreactordesign
      candidate_resolution:
        type: upstream_PR
        venue: pbg-bioreactordesign
        target_slug: pbg-bioreactordesign-issue-2
        notes: Fix the O2-saturation temperature-sign so c*(O2) is correct at 310 K.
      priority: 2
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
    - signature: beulig-batch-scale-deferred
      description: |-
        The graded runs are short/production-scope (single_daughters, 6900-9000 steps) and reach ~3 orders below the Beulig batch peak by design (cards note 'mismatch by design — execute-and-report'). Reaching the full Beulig batch trajectory is a scope deferral pending the population runner + fed-batch.
      axis: D
      provenance: this_investigation
      evidence:
        - source_kind: external
          source_ref: 'docs/report_cards/beulig_batch/vs_beulig/report_card_verdict.json (scope: single_daughters=True, steps_reached=6900)'
        - source_kind: behavior_test_result
          source_ref: mbp-07:wcm-growth-axes-graded-vs-beulig
      resolution_type: scope_decision
      resolution_venue: multiscale-bioprocess investigation
      candidate_resolution:
        type: scope_decision
        venue: multiscale-bioprocess investigation
        target_slug: mbp-population-both-daughters-runner
        notes: Defer full Beulig-scale comparison until the both-daughters population runner + fed-batch land; current runs are deliberately sub-scale.
        decision_authority: Eran + Chris (investigation owners)
      priority: 1
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
      decision_authority: Eran + Chris (investigation owners)
    - signature: beulig-missing-byproduct-and-DO-reference
      description: |-
        The Beulig batch samples carry no acetate/lactate byproduct columns and no dissolved-O2 reference (iML1515 card: 'no measured acetate in the Beulig batch samples'). Even with sim-side byproduct/DO stores added, these axes stay ungraded without richer reference data — a benchmark-scope limit, not only a sim gap.
      axis: D
      provenance: this_investigation
      evidence:
        - source_kind: external
          source_ref: 'docs/report_cards/beulig_batch/iml1515_vs_beulig/report_card_verdict.json (acetate ungraded: no measured acetate)'
        - source_kind: behavior_test_result
          source_ref: mbp-07:millard-substrate-axes-graded-vs-beulig
      resolution_type: scope_decision
      resolution_venue: multiscale-bioprocess investigation
      candidate_resolution:
        type: scope_decision
        venue: multiscale-bioprocess investigation
        target_slug: beulig-reference-data-enrichment
        notes: Source/parse richer Beulig reference columns (byproducts, DO) or formally defer those comparison axes.
        decision_authority: Eran (benchmark scope)
      priority: 3
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
      decision_authority: Eran (benchmark scope)
    - signature: beulig-strain-and-fedbatch-phase-scope
      description: |-
        SGKO / TRP / MEL strain extensions, fed-batch phases I-IV, and transcriptional-state matching against the >470 Beulig transcriptomes were deferred from mbp-05. WT batch-prefix only is graded here.
      axis: D
      provenance: this_investigation
      evidence:
        - source_kind: external
          source_ref: required_knowledge.candidate_future_studies:mbp-09-transcriptional-state-matching-beulig
        - source_kind: external
          source_ref: docs/report_cards/beulig_batch/iml1515_vs_beulig/report_card_verdict.json (n_samples=49 WT batch-phase only)
      resolution_type: further_investigation
      resolution_venue: v2ecoli
      candidate_resolution:
        type: further_investigation
        venue: v2ecoli
        target_slug: mbp-09-transcriptional-state-matching-beulig
        notes: Extend to engineered strains + fed-batch phases + transcriptome matching as later studies.
      priority: 2
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
    - signature: iml1515-not-apples-to-apples
      description: |-
        The iML1515 genome-scale arm predicts mu from MEASURED Beulig uptake (its glucose + O2 lower bounds are SET FROM the data), so its only graded prediction is mu (R2=-8.5 vs identity over 26 solves) — a different, arguably easier test than the WCM/Millard arms, which predict the whole trajectory from first principles. Methodology caveat for any cross-arm 'winner' claim.
      axis: E
      provenance: this_investigation
      evidence:
        - source_kind: external
          source_ref: 'docs/report_cards/beulig_batch/iml1515_vs_beulig/report_card_verdict.json (scope: uptake bounds set from measured rates)'
