[build-system]
requires = ["setuptools>=68", "cython", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "v2ecoli"
version = "0.1.0"
description = "Whole-cell E. coli model on process-bigraph (partitioned architecture)"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.38",
    "pbg-superpowers",
    "pbg-copasi",
    "pbg-parsimony",
    "pbg-ketchup",
    "vivarium-dashboard",
    "vEcoli[dev]>=1.1.0",
    "viva-munk>=0.0.1",
    # viva-munk's __init__.py imports from spatio_flux.processes.particles
    # AND spatio_flux.visualizations at module-import time. We pin via
    # [tool.uv.sources] below to the git main, which carries the
    # visualizations submodule (the PyPI release surface drifts).
    "spatio-flux",
    "plum-dispatch>=2.5",
    "dill>=0.3",
    "numpy",
    "scipy",
    "pymunk",
    # ParCa (v2ecoli/processes/parca/) runtime dependencies
    "cvxpy",
    "biopython",
    "sympy",
    "pandas",
    "plotly>=5.0",
    "ecoli-sources",
    "numba",
    "unum",
    "requests",
    # Emitters are now BASE/default deps (no longer optional extras): v2ecoli
    # always imports & registers BOTH the Parquet and XArray emitters so they
    # appear in the vivarium-dashboard emitters list. Parquet remains the
    # default (workspace.yaml runtime.default_emitter = parquet); XArray is
    # merely available. [parquet] pulls in duckdb/polars/pyarrow/fsspec/tqdm;
    # [xarray] pulls in xarray/zarr/zarrs. The implementations live in
    # pbg-emitters; v2ecoli.library.{parquet,xarray}_emitter are shims. PEP 508
    # direct-URL since pbg-emitters is not yet on PyPI — works with both pip
    # (CI) and uv; pip/uv union the two extras of the same package. Mirrored in
    # [tool.uv.sources] for uv-native resolution.
    "pbg-emitters[parquet] @ git+https://github.com/vivarium-collective/pbg-emitters.git@main",
    "pbg-emitters[xarray] @ git+https://github.com/vivarium-collective/pbg-emitters.git@main",
]

[project.optional-dependencies]
# Test-only deps. `uv sync --extra dev` pulls these in.
dev = ["pytest-timeout>=2.3", "pytest-xdist>=3.6"]
# The Parquet and XArray emitter deps moved into base [project.dependencies]
# above (they are now default/always-installed). These groups are kept as
# empty back-compat aliases so `pip install v2ecoli[parquet]` /
# `v2ecoli[xarray]` still resolve.
parquet = []
xarray = []
emitters = ["v2ecoli[parquet,xarray]"]
# Parallel multiseed runs: one Ray worker process per seed (see
# v2ecoli.library.parallel_seeds + workspace.yaml runtime.parallel: ray).
ray = ["ray>=2.10"]

[project.scripts]
v2ecoli-parca = "v2ecoli.cli.parca:main"
v2ecoli-colony = "v2ecoli.cli.colony:main"
v2ecoli-workflow = "v2ecoli.workflow.run:main"
v2ecoli-analyze = "v2ecoli.workflow.analysis_runner:main"

[tool.setuptools.package-data]
# Ship the v2ecoli override files; bulk KB data is provided by the ecoli-sources bundle.
"v2ecoli.processes.parca.reconstruction.ecoli" = ["flat_overrides/*", "parca_overrides.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: runs without simulation cache (type tests, unit tests)",
    "slow: runs full simulations (60s+)",
    "behavior: model-behavior tests resumed from a saved checkpoint (seconds, not minutes)",
    "sim: calls composite.run() — longer than pure-state tests. CI routes these to a parallel behavior-tests job.",
]
# Per-test wall-clock cap. Safety net for any future hang in sim code.
# ``thread`` method interrupts C-level hangs (LSODA); note it calls
# os._exit(1) on timeout, so it kills the whole pytest run — tests
# should complete well under the cap.
timeout = 120
timeout_method = "thread"

# Only the real Python packages ship in the v2ecoli distribution. Without an
# explicit ``include`` the flat-layout finder also picks up sibling research
# dirs (workspace/, studies/, reports/, …) as top-level packages; the
# bigraph-schema process-discovery resolver then maps the ``v2ecoli`` dist to
# whichever bogus top-level name sorts last (e.g. ``workspace``), so it scans
# the wrong package and registers zero of v2ecoli's Visualization Steps.
[tool.setuptools]
packages = { find = { where = ["."], include = ["v2ecoli*", "pbg_v2ecoli*"] } }

[tool.uv.sources]
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
bigraph-schema = { git = "https://github.com/vivarium-collective/bigraph-schema.git", branch = "main" }
pbg-superpowers = { git = "https://github.com/vivarium-collective/pbg-superpowers.git", branch = "main" }
pbg-copasi = { git = "https://github.com/vivarium-collective/pbg-copasi.git", branch = "main" }
pbg-parsimony = { git = "https://github.com/vivarium-collective/pbg-parsimony.git", branch = "main" }
pbg-ketchup = { git = "https://github.com/vivarium-collective/pbg-ketchup.git", branch = "main" }
pbg-emitters = { git = "https://github.com/vivarium-collective/pbg-emitters.git", branch = "main" }
vivarium-dashboard = { git = "https://github.com/vivarium-collective/vivarium-dashboard.git", branch = "main" }
viva-munk = { git = "https://github.com/vivarium-collective/Viva-munk.git", branch = "main" }
spatio-flux = { git = "https://github.com/vivarium-collective/spatio-flux.git", branch = "main" }
ecoli-sources = { git = "https://github.com/vivarium-collective/ecoli-sources.git", rev = "8d468b17a56a6b062c06d9f74ffc6bbe7e0ec2e4" }
