schema_version: 4
name: dnaa-11-basal-mechanistic
investigation: dnaa-replication
title: "Study 11 — Mechanistic Initiation in the Basal Condition (division distributions)"
created: "2026-07-23"
status: completed
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: fail   # 2026-07-23: the succinate calibration does NOT transfer to basal. Gen 1 fires + divides (4 seeds, ~42 min, ~710 fg), but the gen-2 daughter fails to re-initiate under POST_INIT_UNLOCK in the basal context, over-grows past ~1400 fg, and the lineage collapses at gen 2 (no run reached gen 3). A clear, informative condition-transfer failure that motivates dnaa-12 (regulated/condition-aware source).
expert_review_status: pending

seeded_from:
  study: dnaa-10-async-quantification
  why: >-
    dnaa-10 confirmed the mechanistic sat-init trigger in the SUCCINATE
    condition — it fires cleanly once per cycle and keeps division physiological
    (though the expected sister asynchrony was not resolved with the constant-
    production stand-in). Rashmi's next step (2026-07-23) is to
    confirm the SAME mechanism transfers to the BASAL (default minimal-glucose)
    growth condition and to characterise its time-to-division and
    size-at-division distributions there, since the basal condition is the
    reference operating point for the whole-cell model.

pipeline_gate:
  prerequisites:
    - dnaa-10-async-quantification
  enables:
    - dnaa-12-feedback-mechanisms
  gate_status: pending

question: >-
  Does the mechanistic DnaA-ATP/oriC sat-init initiation trigger, validated in
  succinate (dnaa-10), also drive a clean once-per-cycle replication cycle in
  the BASAL growth condition — and what are the resulting distributions of
  time-to-division and cell size at division under basal growth?

background: >-
  The basal condition (minimal glucose) is the canonical v2ecoli operating
  point. In this model the nutrient condition sets the metabolic/expression
  context rather than the intrinsic doubling time (see the project's "growth
  rate not condition-driven" finding), so the transfer test is whether the SAME
  sat-init mechanism and production-flux calibration from dnaa-10 still give a
  clean once-per-cycle replication cycle and a well-defined division
  distribution in the basal context, without re-tuning per condition.

mechanism: >-
  Identical to dnaa-10: SATURATION_TRIGGERED_INIT=1, stepped-Adair K_d ladder
  (100,100,50,10,3,3,3,3 nM), COOP_GRADIENT_GATE, POST_INIT_UNLOCK_S=60,
  hydrolysis 0.025/min, DnaA-ATP production flux 0.2/s, and the oriC proximity
  labelling — the SAME knobs, only the cache is basal
  (out/cache_dnaa5_oric_basal). Holding the calibration fixed across conditions
  is the point of the transfer test.

conditions:
  baseline:
    composite: v2ecoli.composites.baseline.baseline
    params:
      seed: 1
      cache_dir: out/cache_dnaa5_oric_basal
      max_generations: 6
      growth_condition: basal
      note: "Basal cache with oriC proximity labelling; same mechanism config as dnaa-10."
  variants:
    - name: sat-init-basal
      diff_from_baseline: "SATURATION_TRIGGERED_INIT=1 + full mechanism + production flux 0.2/s, on the basal cache."
      run: dnaa5_basal_mech_seed{1..4}
  model_settings: []

enforced_params:
  params:
    growth_condition: basal
    initiation_trigger: mechanistic-sat-init
    adair_kds_nM: [100, 100, 50, 10, 3, 3, 3, 3]
    post_init_unlock_s: 60
    hydrolysis_rate_per_min: 0.025
    atp_production_per_s: 0.2
    seeds: [1, 2, 3, 4]
    generations: 6
  source: dnaa-10 calibration, unchanged, on the basal cache

readouts:
  - name: time to division (tau)
    identifier: per-generation duration to the DIVISION event
    units: min
    status: primary
  - name: dry mass at division
    store_path: listeners.mass.dry_mass
    units: fg
    status: primary
  - name: number of oriC
    store_path: listeners.replication_data.number_of_oric
    units: count
    status: primary
  - name: cell age at initiation
    identifier: within-generation time of the oriC 1->2 transition
    units: min
    status: secondary

tests:
  - name: mechanism-transfers-to-basal
    classification: primary
    description: >-
      Under basal growth the sat-init trigger still fires once per generation
      (oriC 1<->2) and every generation divides — the mechanism is not
      succinate-specific.
    measure: {kind: snapshot_window, path: "listeners.replication_data.number_of_oric", window: full_lineage_from_gen_0}
    pass_if: {op: in_range, low: 1, high: 2}
  - name: basal-division-well-defined
    classification: primary
    description: >-
      Basal time-to-division forms a well-defined distribution with a
      physiological median (NOTE: in v2ecoli the nutrient condition changes the
      metabolic/expression context but not the intrinsic doubling time — see the
      project's "growth rate not condition-driven" finding — so this checks that
      the cycle is well-defined under basal, NOT that it is slower than
      succinate).
    measure: {kind: median, metric: tau_median_min}
    pass_if: {op: in_range, low: 30, high: 120}
  - name: division-size-physiological
    classification: primary
    description: >-
      Dry mass at division stays in a physiological band under basal growth (no
      runaway growth from missed initiation, no premature tiny divisions).
    measure: {kind: median, metric: size_median_fg}
    pass_if: {op: in_range, low: 200, high: 1200}

conclusion_logic:
  if_primary_tests_pass: >-
    The mechanistic sat-init trigger transfers to the basal context without
    re-tuning: it fires once per cycle, produces a well-defined division-time
    distribution, and holds a physiological division size. Combined with dnaa-10
    (succinate) this shows the DnaA-ATP/oriC mechanism is a
    growth-context-robust replacement for the cell-mass clock.
  if_primary_tests_fail: >-
    If basal fails to fire once-per-cycle or distorts division, the
    production-flux calibration is growth-condition-dependent — the mechanism
    would then need a condition-aware DnaA-ATP source (a specific next step,
    pointing toward the feedback study dnaa-12).

simulation_set:
  - name: sat-init-basal
    kind: lineage
    status: completed
    base_model: v2ecoli baseline + sat-init mechanism, basal cache
    duration_steps: "6 generations"
    seeds: [1, 2, 3, 4]
    metrics: [tau, dry_mass_at_division, number_of_oric, cell_age_at_initiation]
    pass_fail_tests: [mechanism-transfers-to-basal, basal-division-well-defined, division-size-physiological]
    note: "runs dnaa5_basal_mech_seed1..4."

visualizations:
  - name: dnaa11_division_distributions_basal
    address: image:charts/division_basal.png
    chart: charts/division_basal.png
    source_run: dnaa5_basal_mech_seed1..4
    config:
      title: >-
        Division dynamics under mechanistic sat-init initiation in the BASAL
        condition: time-to-division and dry-mass-at-division distributions plus
        size-vs-time, pooled over all divided generations across 4 seeds. Compare
        the tau distribution against the succinate panel in dnaa-10.

results:
  fleet: "4 seeds x (requested 6 gens) on the basal cache; every lineage collapsed at gen 2."
  gen1: {n_divisions: 4, tau_median_min: 42.1, size_median_fg: 710, note: "gen-1 fires cleanly and divides on all 4 seeds."}
  gen2_failure: >-
    On every seed the gen-2 daughter fails to re-initiate: the POST_INIT_UNLOCK
    daughter gate (60 s cumulative positive DnaA-ATP gradient) does not clear in
    the basal context, so oriC stays at 1, the cell over-grows past ~1400 fg
    (vs ~710 fg gen-1 division), never divides, hits the 130 min cutoff, and the
    lineage stops. No run reached gen 3.

tests_outcome:
  - {name: mechanism-transfers-to-basal, result: FAIL, note: "gen-1 fires (oriC 1->2, divides) but gen-2 daughter never re-initiates — not once-per-cycle beyond gen 1."}
  - {name: basal-division-well-defined, result: PARTIAL, note: "gen-1 tau 42 min in band, but only n=4 (gen-1 only); no steady-state distribution because the lineage collapses."}
  - {name: division-size-physiological, result: FAIL, note: "gen-1 size 710 fg in band, but gen-2 runs away to >1400 fg without dividing."}

report:
  title: "dnaa-11 — mechanistic initiation in basal (condition-transfer failure)"
  verdict: >-
    THE SUCCINATE CALIBRATION DOES NOT TRANSFER TO BASAL — an informative
    negative result. The identical sat-init mechanism + production-flux
    calibration that fires cleanly once-per-cycle in succinate (dnaa-10) fires
    and divides in basal ONLY in generation 1 (4 seeds, ~42 min, ~710 fg). In
    generation 2 the daughter origin never clears the POST_INIT_UNLOCK gate (60 s
    of continuous positive bulk DnaA-ATP gradient) in the slower basal context,
    so it fails to re-initiate, over-grows past ~1400 fg without dividing, and
    the lineage collapses — no seed reached generation 3. This pinpoints the
    transfer blocker precisely: the constant DnaA-ATP production flux is
    calibrated to succinate dynamics, and the daughter gradient gate that
    creates clean behaviour there over-suppresses re-initiation under basal
    growth. The fix is a growth-context-aware / regulated DnaA-ATP source rather
    than a fixed flux — exactly the dnaa-12 feedback study. NET: the mechanism
    is not yet condition-robust; the failure mode (daughter POST_INIT_UNLOCK
    over-suppression under a fixed production rate) is cleanly identified.
