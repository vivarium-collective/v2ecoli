  status: primary
  identifier: listeners.replication_data.number_of_oric
  notes: Cell-cycle integrity — 1↔2, unchanged from dnaa-2.
- name: DnaA bound (high-aff, ATP)
  status: measured
  identifier: sum(chromosomal_high.bound_ATP + oriC_high.bound_ATP + promoter_high.bound_ATP)
- name: DnaA bound (high-aff, ADP)
  status: measured
  identifier: sum(chromosomal_high.bound_ADP + oriC_high.bound_ADP + promoter_high.bound_ADP)
- name: DnaA bound (low-aff, ATP)
  status: measured
  identifier: oric_low.bound_ATP
- name: total DnaA boxes available
  status: measured
  identifier: sum over 4 pools (free + bound)
  notes: 315 at birth → 630 at replication termination → 315 per daughter (raw count).

# ── Validation (spec table): dnaa-3 must preserve dnaa-2 behaviour ─────────────
runs:
- name: dnaa3-insim-readonly
  status: completed
  kind: single-seed-multigen-lineage
  canonical: true
  run_dir: parquet-runs/dnaa3-insim-readonly
  cache_dir: out/cache_dnaa3
  resume_dill: out/steady_state_inputs/succinate_default_gen3_start.dill
  seed: 1
  description: |
    REAL IN-SIM read-only binding run, multi-generation (seed 1, >=6 gens). The
    PROVIDED dnaa_box_binding_listener (4 affinity pools, fast equilibrium, full
    box set, no box-capacity limit, no DnaA-pool mutation) runs INSIDE the
    composite on the dnaa-3 ParCa+cache
    (out/cache_dnaa3, --mode full), emitting per-tick DnaA-box occupancy to
    listeners.dnaA_binding in the parquet. The listener is strictly READ-ONLY
    (writes only listeners.dnaA_binding; bulk + DnaA_box + mass are pure reads),
    so the cell cycle matches the dnaa-2 succinate baseline exactly. This is the
    canonical occupancy source for the study figures.
    PROVENANCE: produced on the Mac mini at ~/code/v2e-invest/out/dnaa3_insim_readonly
    (6 gens, seed 1, all divided; tau 63/65/64/69/76/56 min). Copied locally to
    parquet-runs/dnaa3-insim-readonly/ (gitignored — only the *_summary.json is
    tracked). The parquet history emitted only the first tens of seconds of each
    generation (see real_insim_numbers.emit_caveat).
  real_insim_numbers:
    # FILLED FROM THE REAL RUN (read straight from the emitted parquet; not fabricated).
    # Steady reference = generation 5 (18 emitted ticks); whole-run = all 6 gens.
    steady_generation: 5
    free_DnaA_ATP_nM: {mean: 341.7, median: 343.6, whole_run_mean: 238, whole_run_median: 248}
    free_DnaA_ADP_nM: {mean: 1053.2}
    dnaA_ATP_fraction:          # ATP / (ATP + ADP + apo) from the bulk nucleotide forms
      gen5_mean: 0.229
      gen6_mean: 0.307
      in_band_0p2_0p5: true     # at the LOW edge of Rashmi's [0.2,0.5] band, inside it
    oriC_low_affinity_occupancy:
      gen5_mean: 0.774          # ~12/14 oriC boxes bound — NOT saturated (clearly < 1)
      gen6_mean: 0.819
      whole_run_early: 0.65
      whole_run_late: 0.72
    oriC_high_affinity_occupancy: {gen5_mean: 0.999}  # near-saturated, as expected
    chromosome_occupancy: {gen5_mean: 0.999}
    dnaA_promoter_occupancy: {gen5_mean: 0.999}
    total_DnaA_bound: {gen5_mean: 313}
    number_of_oric_emitted: 1   # oriC stayed at 1 in the emitted window (see emit_caveat)
    emit_caveat: |
      The parquet history emitted only the FIRST ~24/36/56/52/18/1 seconds of each
      of the 6 generations (gen N = N-row file at 1 s cadence), not the full 56-76 min
      cycles (the dills hold only the division-point snapshot). So every emitted tick
      is early-cycle and oriC = 1 throughout the emitted data; the 1<->2 oriC pattern
      and division (tau 63/65/64/69/76/56 min, 6/6 divided) come from the run summary +
      dills, matching the dnaa-2 baseline. The occupancy / free-DnaA numbers above are
      therefore early-cell-cycle steady-state values.
  outcomes:
    cycle-preserved-vs-dnaa2:
      result: PASS
      detail: read-only listener; cell cycle matches the dnaa-2 succinate baseline
    oric-pattern-1-or-2:
      result: PASS
      detail: oriC in {1,2} across generations
    binding-columns-populate:
