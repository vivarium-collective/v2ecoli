      resolution_venue: pbg-superpowers
      candidate_resolution:
        type: upstream_PR
        venue: pbg-superpowers
        target_slug: report-card-verdict-taxonomy
        notes: Add a verdict category (e.g. 'architectural-gap' / 'out-of-scope-scale') so execute-and-report cards distinguish scoped limits from genuine mismatch.
      priority: 3
      review_by: Eran 2026-06-14 (synthesis author); Chris expert review pending
