runs:
  - id: v1-first-run-2026-08-10
    script: run_reduced_ode_model.py (v1, superseded)
    outcome: |
      Ran cleanly but surfaced two real calibration bugs before any
      qualitative conclusion could be trusted: (1) the "reference" state
      used to calibrate synthesis rates (FliA~2487, FlgM~1496) was
      mis-attributed as a late-timepoint diagnostic snapshot rather than
      the genuine natural ParCa basal IC it actually is; (2) the FliA:FlgM
      sequestration term was an ad hoc bimolecular rate fit to a mismatched
      transient (a 5s crash under an artificial override IC), which
      blew up unrealistically (FlgM 1496->0.6 within 10s) when applied at
      the real reference scale. Not used for any conclusion.
  - id: v2-validated-run-2026-08-10
    script: run_reduced_ode_model.py (v2, current)
    outcome: |
      Full rewrite: real natural (un-overridden) t=0 WCM state used as the
      reference IC (confirmed via direct build_composite() read with no
      diagnostic override -- FlhDC=335, FliA=2487, FlgM=1496, FliT=974,
      FliD=2115, all complexes exactly 0, confirming these are total pool
      sizes). FliA:FlgM and FliT:FliD both modeled as real 1:1 fast
      equilibria with K_D measured DIRECTLY from the WCM (not derived from
      an uncertain volume/Avogadro conversion, though that independent
      derivation landed within ~25% of the measured value as a sanity
      check): K_D(FlgM:FliA)=144.5, K_D(FliT:FliD)=141.3 count-units,
      measured from 4 early-timepoint (t=2-20s) samples each, both highly
      consistent (<2% spread). Discovered and fixed a real missing
      mechanism: the checkpoint's free-FliT input must be the FliT:FliD-
      equilibrium-corrected value (execution order: ecoli-equilibrium runs
      before the checkpoint step), not the raw FliT total -- validated
      by predicting free FliT~99.4/free FliD~1240 from the equilibrium
      alone (zero fitting) and finding it matches the independently
      measured real trajectory (FliT settles ~100-106, FliD ~1240-1265)
      to within a few percent. Also found and fixed a real formula bug:
      FlgM secretion is a FLAT per-complete-flagellum rate
      (hbb_count*secretion_rate, per flagella_flgm_secretion.py), NOT
      proportional to available FlgM as v1 assumed -- confirmed directly
      from source. Validated the corrected model against real WCM data
      (comprehensive-panel diagnostic, matched override IC): qualitative
      shape now matches (gradual FlgM decline, gradual FliA rise,
      fast-then-plateau FlhDC decline) with quantitative values within
      ~2-3x at t=2400s (model retains more FlgM, FlhDC settles higher
      than the real ~3 vs model's ~11.5) -- reasonable agreement given the
      remaining synthesis-calibration approximation (open_decision below).
      Full 8hr run: FlhDC settles ~10; FliA total rises to ~8500; FlgM
      crashes toward 0 late in the run as N_complete grows (46.5 flagella
      by 8hr, each secreting, exceeds max FlgM synthesis ~0.4/s); flagella
      count grows to 46.5, tracking nucleation_rate*time almost exactly
      (0.00167*28800=48) -- i.e. NOT self-limiting within the tested
      window; completion-rate ratio (last 10% vs overall average) = 1.13,
      indicating acceleration, not saturation.
    charts: [charts/01_reduced_ode_v2_target20000_8.0hr.svg]
    data: [reduced_ode_v2_target20000_8.0hr.npz]
    archived_at: archive/flit-flhdc-regulation-2026-08/code/ (run_reduced_ode_model_v2_with_flit.py, plus its chart/npz)
  - id: v3-no-flit-2026-08-10
    script: run_reduced_ode_model.py (v3, current)
    outcome: |
      Superseded v2's "frozen, left as-is" plan from earlier the same day
      -- Maya asked to keep the model in sync with the live WCM instead.
      Removed the FliT:FlhDC checkpoint entirely (no v/c2 titration term)
      and the FliT:FliD equilibrium (no longer needed, that reaction was
      removed from the WCM alongside the checkpoint it fed), mirroring the
      WCM's real 2026-08-10 removal exactly. v2's code archived first at
      archive/flit-flhdc-regulation-2026-08/code/run_reduced_ode_model_v2_
      with_flit.py for before/after comparison. Result: FlhD4C2 (X) now has
      NO decay term at all (matching the live WCM, which also has none
      pending the NFsim replacement) -- grows perfectly linearly,
      335->28,217.7 over 8hr (confirmed: Delta=3485.4/hr, exactly
      K_SYNTH_X=0.9682/s x 3600s -- pure unbounded synthesis, no
      saturation whatsoever). FliA total also rises further than in v2
      (9045.8 vs ~8500 at 8hr) since it's no longer indirectly damped by a
      checkpoint-suppressed X. Flagella count is UNCHANGED from v2 (46.53
      at 8hr, same nucleation_rate*time trajectory) -- expected, since
      nucleation was never gated by X in this model either version;
      removing the checkpoint affects gene expression, not assembly.
      FliT is now tracked as a genuine dead-end variable (still
      synthesized/degraded under its own real rates, consistent with
      FLIT-DIMER_RXN staying in the live WCM, but influences nothing else).
    charts: [charts/02_reduced_ode_v3_no_flit_target20000_8.0hr.svg]
    data: [reduced_ode_v3_no_flit_target20000_8.0hr.npz]

findings:
  - id: flagella-06-reference-ic-was-a-real-parca-basal-state-not-a-snapshot-bug
    date: '2026-08-10'
    summary: |
      What looked like a calibration bug (v1's "reference" values 2487/
      1496 seeming too large to be a genuine t=0 IC) was resolved by
      directly reading the WCM's natural (non-diagnostic-override) t=0
      bulk state: FlhDC=335, FliA=2487, FlgM=1496, FliT=974, FliD=2115,
      with all relevant complexes exactly 0. These ARE the real ParCa
      basal values, not an artifact -- the diagnostic override IC used
      throughout study 02 (FliA=500, FlgM=800) is the exception, not the
      norm, applied specifically to force interesting dynamics into the
      observable window.
  - id: flagella-06-checkpoint-input-needs-flit-flid-equilibrium-correction
    date: '2026-08-10'
    summary: |
      The FliT:FlhDC checkpoint's real "u" input (free FliT-dimer) is NOT
      the raw synthesized FliT total -- the real execution order runs
      ecoli-equilibrium (which partitions FliT:FliD) before the checkpoint
      step, so the checkpoint always sees the FliT:FliD-equilibrium-
      depleted free FliT count. Missed in v1 (used raw FliT total
      directly); the correction was validated with zero fitting (predicted
      free FliT~99.4 from the measured K_D and real totals alone, matching
      the independently measured real trajectory ~100-106).
  - id: flagella-06-flgm-secretion-is-flat-rate-not-concentration-dependent
    date: '2026-08-10'
    summary: |
      flagella_flgm_secretion.py's real formula is a flat per-complete-
      flagellum export rate (hbb_count*secretion_rate, clamped so it can't
      go negative), independent of how much FlgM is currently free. v1
      modeled it as proportional to free FlgM (typical first-order
      clearance kinetics), which produced an unrealistic ~170/s drain vs.
      the real ~0.4/s at N_complete=4 -- a nearly 500x error traced
      directly to misreading the mechanism, not a calibration issue.
  - id: flagella-06-checkpoint-alone-does-not-bound-flagella-count-8hr
    date: '2026-08-10'
    summary: |
      Across an 8-hour run with a validated (real-data-checked) v2
      parameterization, flagella count grows to 46.5 -- tracking
      nucleation_rate*time almost exactly, i.e. effectively unconstrained
      -- while the checkpoint mechanism itself clearly IS acting on gene
      expression (FlhDC crashes from 335 to ~10, FliA rises substantially,
      FlgM eventually can't keep up with secretion once dozens of flagella
      exist). This converges with study 02's own WCM-based finding
      (flagella-02-second-supply-bottleneck-motor-complex-not-checkpoint):
      the checkpoint regulates expression correctly, but by itself (absent
      motor-complex gating on nucleation, which this model deliberately
      does not include) it does not translate into a bounded flagella
      count. Two independent modeling approaches now agree on this point.
  - id: flagella-06-flhdc-unbounded-without-any-decay-term
    date: '2026-08-10'
    summary: |
      v3 (no FliT checkpoint, matching the live WCM's 2026-08-10 removal):
      with no decay term at all for FlhD4C2, X grows perfectly linearly
      and without limit -- 335->28,217.7 over 8hr, exactly K_SYNTH_X x
      time with zero saturation. This is the reduced-model confirmation of
      the same tradeoff already documented for the live WCM (open_decision
      flhdc-has-no-degradation-pathway-pending-nfsim in flagella-02's
      study.yaml): removing the checkpoint without replacing it leaves the
      master regulator with no brake whatsoever. Flagella count itself is
      unaffected (still 46.53 at 8hr, same as v2) since nucleation was
      never gated by X in either version -- confirms the checkpoint's
      removal changes gene-expression dynamics but not assembly output in
      this model, consistent with flagella-06-checkpoint-alone-does-not-
      bound-flagella-count-8hr's earlier finding that the checkpoint was
      never what limited count anyway.

