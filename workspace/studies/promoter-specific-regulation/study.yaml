controls:
- name: most-edges-are-unchanged
  kind: negative
  hypothesis: A rule that reassigns most of the network is a different model, not a correction.
  expected: at most 35% of adjudicated edges change assignment.
  observed: Only 10.5% of adjudicated edges retained; the rule strips 89.5%.
  result: FAIL
- name: rescue-is-not-a-global-growth-artefact
