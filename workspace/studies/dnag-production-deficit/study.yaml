conclusion: |
  CORRECTED after expert challenge. The first version of this conclusion claimed the
  deficit was a translation-side execution gap and that the dedup hypothesis was
  refuted. Both claims were wrong. They rested on static ParCa parameters rather than
  on what the simulation does, in a study whose own headline finding is that the two
  diverge by 22x.

  Measured during a run, over a full generation (2528 timesteps):
    TU00352 mRNA present            0 copies, 100% of timesteps
    TU00352 synthesis events        0
    transcripts made for dnaG       0
    transcripts made for rpoD       461 (via TU00472)
    transcripts made for rpsU       1   (via TU0-14460)

  dnaG depends on a single transcript that the model never synthesises. Its operon
  partners each carry a second transcript that IS used, so they are supplied normally
  while dnaG receives nothing. That is the mechanism: not a per-cistron translation
  step, but the absence of any alternative route for dnaG alone.

  It also explains the protein numbers without invoking translation. ParCa seeds ~38
  copies, nothing replenishes them, and the pool decays toward zero -- mean 1.76,
  absent 61.6% of a healthy lineage. An mRNA that is never made cannot be translated,
  so dnaG's low translation efficiency (1.5th percentile) is downstream of the real
  block and cannot be the cause.

  Two errors are worth recording because they were methodological, not arithmetic.
  First, basal_prob never governed this transcript at all: TU00352 is in idx_rprotein,
  and TranscriptInitiation overrides basal_prob with the fixed ribosomal-protein
  probability for those TUs. Second, the operon 'internal control' assumed the three
  cistrons share one mRNA pool. They do not, and that false premise is what made a
  transcriptional divergence look translational.

  The transcription-unit architecture is therefore back at the centre of the
  investigation. Whether the rpsU-promoter dedup is what left dnaG without an
  alternative transcript, and why an idx_rprotein TU draws zero synthesis, are the two
  open questions -- and they are now the investigation's main thread rather than a
  retired one.
