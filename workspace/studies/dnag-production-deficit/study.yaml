  statement: The DnaG deficit is a translation-side execution gap, not a transcription-unit problem, so the investigation's repair target moves from the dedup to translation efficiency and its application.
  summary: |
    The chain measurement resolves three candidate explanations into one. Transcription
    is 30x the median, degradation is exactly the default rate, and translation
    efficiency is 1.5th percentile of 4309 monomers. The operon control confirms the
    loss is per-cistron: three genes on one mRNA pool diverge 3.55x.

    This costs the investigation its founding hypothesis. Study 1 traced a replication
    arrest to DnaG; the standing assumption was that the rpsU-promoter dedup starved
    dnaG of transcription. That is now refuted -- dnaG's transcript is among the most
    transcribed in the model. The dedup remains a real structural defect, because it
    still prevents dnaG from being regulated independently of rpsU and rpoD, but it is
    not why DnaG is scarce.

    What replaces it is sharper. Translation efficiency is a ParCa INPUT fitted from
    Li 2014 ribosome profiling, so a low value there is inherited, not emergent -- hence
    engineered. And the 22x gap between the fit and the simulation says the loss is
    not even fully explained by the input: something downstream of the fit is losing
    most of the remainder. HolA (1.9th percentile) and HolB (5.7th) sit in the same
    tail, so this plausibly affects a class of low-abundance proteins rather than DnaG
    alone, which would make it a general defect with a specific, measured consequence
    for replication.
