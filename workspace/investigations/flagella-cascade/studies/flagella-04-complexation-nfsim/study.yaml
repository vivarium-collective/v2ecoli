    monomer pools (FliF/FlgE/FliC) vs assembled complete flagella, now on a SYMLOG
    y-axis so the handful of complete flagella stay visible against the thousands of
    free FlgE monomers (Maya's "scale seems unfair" — fixed). 2400 s composed
    production+complexation run; final: export=2, motor=1, hook=12, complete
    flagella=9.
- address: image:charts/02_nfsim_assembly_stacked.svg
  chart: charts/02_nfsim_assembly_stacked.svg
  render: PYTHONPATH=$PWD .venv/bin/python workspace/investigations/flagella-cascade/studies/flagella-04-complexation-nfsim/run_nfsim_assembly.py --seconds 2400 --sample 120
