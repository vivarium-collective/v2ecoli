    detail: |
      (TBD) Will measure (1) crash-free completion rate across all samples and
      (2) max total-order Sobol across the 6 candidate deep params. A dominant
      parameter is defined as total-order Sobol ≥ 0.5.
    measured_value: null
  pass_if:
    op: in_range
    low: 0.5
    high: 1.0

