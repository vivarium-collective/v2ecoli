schema_version: 4
name: v2ecoli-vecoli-comparison
title: v2ecoli ↔ vEcoli comparison
question: Does v2ecoli reproduce vEcoli across nutrient conditions?
comparison:
  v2ecoli:
    repo: https://github.com/vivarium-collective/v2ecoli
    commit: ''
  vecoli:
    repo: https://github.com/CovertLab/vEcoli
    commit: ''
  vecoli_dir_env: V2E_VECOLI_DIR
  v2_cache: out/cache_full
  ve_cache: out/compare_harness/vecoli_parca
  defaults:
    cards:
    - config
    - standard
    - statistical
    seeds: 4
studies:
- parca
- basal
- metabolism_redux
- with_aa
- succinate
- no_oxygen
- acetate
- statistical
executive:
  what_is_this: |
    Does v2ecoli reproduce vEcoli across nutrient conditions? Each study runs both engines from matched ParCa initial states and grades v2ecoli against a live vEcoli reference on the standard observables -- cell, dry, protein and RNA mass, and growth rate. GOLD STANDARD (updated): grading now gates on the multi-seed STATISTICAL card (Welch t-test over 4 seeds) plus the ParCa t=0 card; the single-seed 'standard' card is illustrative only. The earlier single-seed 'acetate/succinate refuted' and 'growth-rate drift' verdicts have been RETIRED as grading artifacts -- one seed cannot separate a real port divergence from stochastic seed noise (v2ecoli's own 4-seed spread on succinate is ~8-9%, larger than the 6.4% RNA 'mismatch' it was flagged for), the ppGpp + metabolism parameters are bit-identical between engines, and the basal 4-seed statistical card already finds the engines equivalent. Every condition is being re-graded on 4 seeds; ParCa agreement and the basal statistical-equivalence result stand. The MetabolismRedux swap remains investigated-but-blocked on a process-bigraph step-cascade runtime issue (not a science mismatch).

