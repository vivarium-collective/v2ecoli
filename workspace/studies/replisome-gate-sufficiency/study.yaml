patch_validation:
  source: out/smoke-gte/smoke-gte-mech_summary.json
  recorded_at: 2026-09-02, ~2 minutes AFTER preregistered.registered_at
  note: 'Validation that the == -> >= patch changes behaviour, not evidence for any

    pre-registered criterion. 3-generation smoke, seed 0, mechanistic arm:

    all 3 generations divided (tau 43.0 / 46.0 / 54.0 min; final dry mass

    722.6 / 634.4 / 574.4 fg). Under == the same arm stalled at generation 2,

    burning the full 200 min cap at 4156.5 fg.


    So the patch works and the profile matches the permissive control''s band

    (43-59 min, 592-732 fg). It gives NO evidence of an imminent stall: tau

    drifts up and mass drifts down at roughly the rate the permissive arm shows

    over 12 generations. If a stall exists it is at generation 4 or later, which

    is what the sweep is for.

    '
