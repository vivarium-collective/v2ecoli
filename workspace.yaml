schema_version: 2
name: v2ecoli
created: '2026-05-16'
plugin_version: 0.6.1
package_path: v2ecoli
layout:
  studies: workspace/studies
  investigations: workspace/investigations
  references: workspace/references
  experiments: workspace/experiments
runtime:
  # PDMP investigation runs on the XArrayEmitter (zarr-partitioned,
  # multi-generation native): its validation pipeline aligns every phase on a
  # single time-series format (see investigation.yaml guidelines.emitter).
  # parquet stays available as a fallback — pass an explicit ParquetEmitter or
  # use the parquet runners in v2ecoli.library.parquet_run.
  default_emitter: xarray   # 'parquet' | 'sqlite' | 'xarray'
  max_generations: 8        # multi-gen cap (xarray + parquet runs) — bumped for PDMP validation ensembles
  # Multiseed parallelism: 'ray' runs one worker process per seed (parity with
  # vEcoli — see docs/perf/). Unset/None = sequential. Needs `v2ecoli[ray]`.
  # Runners use v2ecoli.library.parallel_seeds.run_seeds_parallel(mode=<this>).
  parallel: ray             # 'ray' | null
observables: []
visualizations: []
simulations: []
datasets: []
expert_docs:
- name: duf-final-report
  path: workspace/references/expert/duf_final_report_2026.pdf
  sha256: 145a5c7fac2247036281bf5fb2db49ce9e5e9c8d309aba65e91b937918f61b5f
  description: "DARPA DUF ARC final report (HR0011-24-3-0372, UConn, PI Agmon,\nSep\
    \ 2024\u2013Sep 2025): \"An Integrated Discovery Workflow for an\nE. coli Whole-Cell\
    \ Model\". Establishes the motivation for the\nPDMP reformulation of v2ecoli \u2014\
    \ the current hybrid-algorithmic\nWCM is not a well-defined dynamical system and\
    \ resists\nlikelihood-based inference and causal discovery.\n"
  contributor: eran
- name: v2ecoli-pdmp-roadmap
  path: workspace/references/expert/v2ecoli_pdmp_roadmap.pdf
  sha256: f11aa49dab7ad53dfe78766a49f40b42d745ecba980beac0a8f9e0cbcb2aadb5
  description: "Six-phase incremental roadmap for transforming v2ecoli into a\npiecewise-deterministic\
    \ Markov process (PDMP). Phases 0\u20135:\ncharacterization \u2192 kinetic-ODE\
    \ metabolism \u2192 continuous-time\njump layer \u2192 likelihood/Bayesian interface\
    \ \u2192 compiled runtime \u2192\ncausal discovery / functional annotation. Spine\
    \ of the\nv2ecoli-pdmp investigation.\n"
  contributor: eran
