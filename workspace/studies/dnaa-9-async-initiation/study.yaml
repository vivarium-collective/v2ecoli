findings:
  - id: F-01
    statement: >-
      DnaA-ATP FRACTION IS TUNED BY HYDROLYSIS (with extrinsic mechanisms off). With RIDA/DDAH/DARS off,
      DNAA_HYDROLYSIS_RATE_PER_MIN is the DnaA-ATP-fraction setpoint (as its own code comment states):
      0.046 -> fraction 0.19 (just below band), 0.025 -> 0.29 (in band), 0.015 -> 0.35. At 0.025 the
      total DnaA-ATP fraction is in [0.2,0.5] on seeds 0/1/2 (0.23-0.26). This reproduces Rashmi's result
      and CORRECTS the earlier dnaa-6 F-04 / RIDA-based claim: the earlier "hydrolysis isn't a lever"
      reading was an artifact of leaving RIDA ON in the reference (RIDA drained DnaA-ATP and masked the
      hydrolysis effect). No new mechanism is needed for the fraction — just the hydrolysis rate.
    status: evaluated
    provenance:
      run_ids: [opclean_s0, opclean_s1, opclean_s2]
  - id: F-02
    statement: >-
      FULL-OCCUPANCY TRIGGER. DNAA_INIT_LOW_THRESHOLD=8 fires initiation only when all 8 oriC-low sites
      are bound (peak occupancy 1.00), replacing the partial ~0.6 (threshold 6/8) firing.
    status: evaluated
    provenance:
      run_ids: [opclean_s0]
  - id: F-03
    statement: >-
      ASYNCHRONOUS INITIATION IMPLEMENTED, BUT OVER-REPLICATES ALONE. A new flag-gated per-origin
      initiation path (DNAA_ASYNC_INITIATION) makes each oriC bind DnaA and initiate independently — the
      deriver emits per-origin oriC-low saturation and chromosome_replication fires only the saturated
      subset. Origins decouple (oriC steps through 3, not a synchronous 2->4 jump). But with NO
      re-initiation control, the origins re-fire continuously: oriC runs to 3/4/5 and total DnaA climbs
      above [300,800] on all seeds. Asynchrony therefore requires a re-initiation frequency control
      (SeqA), which is dnaa-10. The synchronous control (async off) stays once-per-cycle (oriC 1<->2 with
      only a startup transient) — confirming the over-replication is specifically the async re-firing.
    status: evaluated
    provenance:
      run_ids: [opclean_s0, opclean_s1, opclean_s2]
  - id: F-04
    statement: >-
      IMPLEMENTATION VERIFIED (Rashmi feedback 2026-07-02) — two apparent problems are FIGURE ARTIFACTS
      and one mechanism is CONFIRMED CORRECT. (a) oriC does NOT jump 1->3: every initiation is +1
      (1->2->3->4); the apparent 1->3 is downsampling of the fast over-replicating re-firing (oriC goes
      1->2->3 in ~3 s). (b) The trigger fires at FULL per-origin occupancy, not 0.6: at the gen-2 firing
      the per-origin bound = [2, 8] — the firing origin is at 8/8 (full); the plotted 0.6 is the GLOBAL
      average across a full origin + a refilling one. (c) FORK-PASSAGE RESET is correct: right after an
      origin fires at 8/8, per-origin bound resets to [0, 0] (chromosome_structure.py). The new
      dnaa9_diagnostics figure plots per-origin box COUNTS + cell mass + bulk DnaA-ATP (Rashmi's asks),
      labeled n=4/K=30.
    status: evaluated
    provenance:
      run_ids: [opclean_s1]
  - id: F-05
    statement: >-
      DWELL-TIME REDUCES OVER-REPLICATION (Rashmi's suggestion) — a more mechanistic control than SeqA.
      New knob DNAA_INIT_DWELL_SEC requires an origin to stay SATURATED (>=8/8) continuously for N seconds
      before it may fire, so transient fill-spikes do not trigger initiation. dwell=10 s (async, hydrolysis
      0.025, RIDA/SeqA OFF) reduces the over-replication from oriC max 4-5 to max 3, with total DnaA in band
      (501) and the DnaA-ATP fraction in band (0.302) — comparable to the SeqA fix (dnaa-10) but WITHOUT a
      separate sequestration mechanism (dwell=5 s is weaker: more oriC=3). So the dwell time is a lighter,
      physics-based alternative to SeqA for throttling re-initiation. (Not yet fully 1<->2; combining dwell
      with a longer dwell or SeqA, and/or re-tuning n/K, is the follow-up.)
    status: evaluated
    provenance:
      run_ids: [dwell10, dwell5]
  - id: F-06
    statement: >-
      DWELL + SeqA GIVES CLEAN ONCE-PER-GENERATION (Rashmi's re-tune request), AND oriC=3 IS PARTLY
      EXPECTED. Combining the dwell (30 s) with the SeqA eclipse (40 min) on the hydrolysis/threshold-8/async
      config gives clean once-per-cell-cycle firing — oriC strictly 1<->2 (0% of ticks >= 3) on seeds 1 and 2,
      with the DnaA-ATP fraction (0.26-0.27) and total DnaA (529-546) both in band; seed 0 keeps ~13% oriC=3.
      IMPORTANT CONTEXT: the residual oriC=3 is NOT necessarily an error — per-generation tau here is 32-66
      min while C+D ~= 60 min for succinate, so in the FAST generations (tau < C+D) an overlapping replication
      round (oriC=3) is BIOLOGICALLY EXPECTED. So the right target is not "eliminate oriC=3" but "no runaway
      over-replication + DnaA in band," which dwell+SeqA achieves. The dwell/n/K sweep on its own (dwell
      30/60, K=40, n=6) only reached oriC max 3 (a full-cycle re-initiation block, not a seconds-scale dwell,
      is what removes a whole extra round — hence dwell+SeqA). Open for Rashmi/Haochen: confirm the intended
      tau / C / D regime (whether overlapping rounds should occur at this growth rate at all).
    status: evaluated
    provenance:
      run_ids: [dwell30_ecl40_s0, dwell30_ecl40_s1, dwell30_ecl40_s2]

biological_summary: >-
  DnaA-ATP saturates the oriC low-affinity boxes and fires initiation; in a real cell each origin binds
  DnaA and initiates on its own schedule (asynchrony), while SeqA sequesters the just-replicated origin
  to prevent immediate re-firing. This study sets the DnaA-ATP level with the hydrolysis rate, fires at
  full filament saturation, and makes initiation per-origin — and shows that without the SeqA
  re-initiation block, independent origins re-fire and over-replicate. That block is dnaa-10.
