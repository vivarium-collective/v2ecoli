schema_version: 3
name: mbp-09-millard-reactor-comparison
created: '2026-06-14'
phase: Design
study_kind: diagnostic   # head-to-head comparison; categorizes divergences (report cards)

design_status: drafted
implementation_status: in_progress
simulation_status: not_run
evaluation_status: not_evaluated
expert_review_status: not_requested

# Two coupled arms compared against the Beulig WT batch prefix:
#   - WCM arm:     reactor_bird_coupled (built, mbp-03)
#   - Millard arm: the Millard kinetic-metabolism cell coupled to the same
#                  BiRDTransportProcess (to be built — see implementation_requirements).
baseline:
- name: wcm-coupled
  composite: v2ecoli.composites.reactor_bird_coupled
  params: {seed: 0, cache_dir: out/cache}
- name: millard-coupled
  composite: v2ecoli.composites.reactor_bird_coupled_millard
  params:
    seed: 0
    cache_dir: out/cache

purpose:
  question: |
    Coupled to the same BiRD reactor and run against the Beulig WT batch
    prefix, does the Millard 2017 kinetic central-carbon metabolism track the
    bioreactor conditions (glucose drawdown, acetate overflow, O2 use, growth)
    BETTER than v2ecoli's constraint-based kFBA? Rendered as a structured
    report-card comparison (per-group axis verdicts + categorized divergences),
    NOT a tolerance gate (execute-and-report, per chris_feedback_2026_05_26 §10).

pipeline_gate:
  prerequisites:
  - mbp-03-bird-reactor-coupling        # the reactor coupling + ReactorCellCoupler (BUILT)
  - mbp-08-millard-swap-validation      # the validated Millard cell (baseline_millard)
  - mbp-05-palsson-benchmark            # the Beulig comparison harness + digitized reference

implementation_requirements:
- id: req-1-millard-exchange-accounting
  kind: process
  effort: M
  title: Millard cell exposes O2/CO2 exchange to the reactor coupler
  description: |
    The Millard cell (baseline_millard) replaced FBA metabolism, so it does NOT
    populate `agents.*.environment.exchange` with O2/CO2 — which is what
    ReactorCellCoupler reads to drive reactor consumption. Without this the
    Millard-coupled reactor is degenerate (cell consumes no reactor O2; DO stays
    at saturation). The Millard 2017 model HAS an O2 species + central fluxes, so
    translate Millard's O2 uptake / CO2 evolution (central_fluxes) into the cell-
    side exchange the coupler consumes (counts into environment.exchange, or a
    Millard-aware coupler input). This is the deferred Millard mass-exchange
    accounting (also unblocks the wcm-mass-conservation gate on the Millard cell).
  unblocks: [the Millard arm + wcm-mass-conservation-closes on baseline_millard]
  status: done
- id: req-2-millard-coupled-composite
  kind: composite
  effort: S
  title: reactor_bird_coupled (Millard variant)
  description: |
    A composite coupling baseline_millard (instead of baseline_population's FBA
    cell) to BiRDTransportHours + ReactorCellCoupler — i.e. the mbp-03 wiring with
    the Millard cell engine swapped in (the cell-side interface contract makes this
    a drop-in). Likely a `cell_engine` param on reactor_bird_coupled, or a sibling
    reactor_bird_coupled_millard.
  status: done
- id: req-3-beulig-report-card
  kind: harness
  effort: M
  title: Reuse the mbp-05 Beulig comparison harness for both arms
  description: |
    Run both arms against the Beulig batch prefix through the mbp-05 comparison
    harness, producing a report_card_verdict.json per arm at the card paths below,
    so the report_card_axis tests grade them. Reuses mbp-05's comparison_overlays
    + grader (req: mbp-05 built).

# Report-card axis grading for BOTH arms vs Beulig (mirrors mbp-05's 5 groups).
# Diagnostic (execute-and-report); the verdicts categorize divergences that feed
# mbp-06, and the head-to-head shows where kinetic metabolism tracks better.
behavior_tests:
- name: millard-growth-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: growth}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: millard-substrate-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: substrate}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: millard-byproducts-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: byproducts}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: millard-gas_transfer-axes-graded-vs-beulig
  classification: diagnostic
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: gas_transfer}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range
- name: kinetic-vs-fba-tracking-summarized
  classification: primary
  question: Is the head-to-head (Millard vs WCM-FBA, both vs Beulig) rendered with a per-group winner and categorized divergences feeding mbp-06?
  measure: {kind: report_card_axis, card: docs/report_cards/beulig_batch/millard_vs_beulig, group: summary}
  pass_if: {op: report_card_group_within_tol}
  acceptance_form: quantitative_range

# Homed here from mbp-08 (deferred): once req-1 lands, the Millard cell exposes
# exchange and this gate becomes evaluable on the Millard arm.
- name: wcm-mass-conservation-closes-millard
  classification: diagnostic
  measure: {kind: derived, formula: "listeners.mass.conservation_relative_cumulative", window: full_lineage_from_gen_0}
  pass_if: {op: in_range, low: 0.0, high: 0.05}
  cites: [agmon2022]
  acceptance_form: quantitative_range

open_questions:
- id: bird-o2-saturation-temperature-sign-bug
  text: |
    pbg-bioreactordesign#2 — dissolved-O2 saturation has the wrong temperature
    sign (masked at 298 K; biases c*(O2) high at the 310 K target). Both arms
    compare against the same biased c*, so the head-to-head is unaffected, but
    absolute DO magnitudes vs Beulig are biased until fixed upstream.

tests:
  pytest_args: []
